            ['G2', 'D3'], null, ['A2', 'E3'], null, ['D3', 'A3'], null, null, null
        ];
        const plainsHeartbeatDrone = [
            'D2', null, null, null, 'D2', null, 'A2', null,
            'A2', null, null, null, 'D2', null, null, null,
            'F2', null, null, null, 'C3', null, 'A2', null,
            'G2', null, 'A2', null, 'D2', null, 'D2', null
        ];

        function getPostCurrentBPM() {
            const st = Math.max(0, Math.min(9, postStage));
            return Math.round(60 + st * (100 / 9));
        }

        function initChiptuneAudio() {
            if (!chiptuneAudioCtx) chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (chiptuneAudioCtx.state === 'suspended' && !isPaused) chiptuneAudioCtx.resume();
        }

        function playTone(freq, type, duration, volume, swell = false) {
            if (!freq || !chiptuneAudioCtx || isPaused) return;
            const nowT = chiptuneAudioCtx.currentTime;
            const osc = chiptuneAudioCtx.createOscillator();
            const gainNode = chiptuneAudioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, nowT);

            if (swell) {
                gainNode.gain.setValueAtTime(0.0005, nowT);
                gainNode.gain.linearRampToValueAtTime(volume, nowT + duration * 0.38);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, nowT + duration);
            } else {
                gainNode.gain.setValueAtTime(volume, nowT);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, nowT + Math.max(0.02, duration - 0.012));
            }

            osc.connect(gainNode);
            gainNode.connect(chiptuneAudioCtx.destination);
            osc.start(nowT);
            osc.stop(nowT + duration + 0.01);
        }

        function scheduleNextChiptuneStep() {
            if (!chiptuneIsPlaying) return;

            let stepDurSec = 60 / 75 / 2;
            if (activeTrackMode === 'POST') {
                const bpm = getPostCurrentBPM();
                stepDurSec = 60 / bpm / 2;
            }

            if (!isPaused && chiptuneAudioCtx) {
                if (activeTrackMode === 'TIPI') {
                    const lead = matriarchFiddle[currentStep];
                    const bass = celloDrone[currentStep];
                    if (lead && NOTES[lead]) playTone(NOTES[lead], 'square', stepDurSec * 1.2, 0.02, false);
                    if (bass && NOTES[bass]) playTone(NOTES[bass], 'sine', stepDurSec * 3.8, 0.15, false);
                } else {
                    const fid = galleonPlainsFiddle[currentStep];
                    const acc = galleonAccordionDyad[currentStep];
                    const drn = plainsHeartbeatDrone[currentStep];

                    if (fid && NOTES[fid]) {
                        const gate = postStage < 3 ? 1.25 : 0.90;
                        playTone(NOTES[fid], 'square', stepDurSec * gate, 0.028, false);
                    }
                    if (acc) {
                        playTone(NOTES[acc[0]], 'sawtooth', stepDurSec * 2.4, 0.018, true);
                        playTone(NOTES[acc[1]] * 1.003, 'triangle', stepDurSec * 2.4, 0.045, true);
                    }
                    if (drn && NOTES[drn]) {
                        playTone(NOTES[drn], 'sine', stepDurSec * 2.8, 0.16, false);
                    }
                }
                currentStep = (currentStep + 1) % 32;
            }

            chiptuneTimeout = setTimeout(scheduleNextChiptuneStep, stepDurSec * 1000);
        }

        function startChiptuneTrack(mode = 'TIPI') {
            initChiptuneAudio();
            stopChiptuneTrack();
            activeTrackMode = mode;
            chiptuneIsPlaying = true;
            currentStep = 0;
            scheduleNextChiptuneStep();
        }

        function stopChiptuneTrack() {
            chiptuneIsPlaying = false;
            if (chiptuneTimeout) {
                clearTimeout(chiptuneTimeout);
                chiptuneTimeout = null;
            }
            currentStep = 0;
        }

        function playSfx(kind) {
            initChiptuneAudio();
            if (!chiptuneAudioCtx || isPaused) return;
            if (kind === 'serve') {
                playTone(587.33, 'triangle', 0.10, 0.14);
                setTimeout(() => playTone(880.00, 'triangle', 0.16, 0.14), 75);
            } else if (kind === 'craft') {
                playTone(392.00, 'square', 0.07, 0.06);
                setTimeout(() => playTone(523.25, 'triangle', 0.12, 0.12), 65);
            } else if (kind === 'stitch_step') {
                playTone(620 + clerk.stitchProgress * 45, 'triangle', 0.05, 0.08);
            } else if (kind === 'pickup') {
                playTone(493.88, 'triangle', 0.06, 0.08);
            } else if (kind === 'miss') {
                playTone(155.00, 'sawtooth', 0.18, 0.10);
            } else if (kind === 'click') {
                playTone(440.00, 'square', 0.04, 0.03);
            }
        }

        document.addEventListener('touchstart', initChiptuneAudio, { once: true });
        document.addEventListener('mousedown', initChiptuneAudio, { once: true });

        // ==========================================
        // LANE'S POST TYPEWRITER INTRO FLOW (2 SCREENS OVER TITLE BACKDROP)
        // ==========================================
        function startPostIntro() {
            postIntroPage = 0;
            postIntroTitleAlpha = 1.0;
            postIntroBoxAlpha = 0.0;
            postIntroTextAlpha = 1.0;
            postIntroChars = 0;
            postIntroPhase = 'FADE_TITLE';
            playSfx('click');
            gameState = 'POST_INTRO';
        }

        function updatePostIntro(dtMs) {
            if (postIntroPhase === 'FADE_TITLE') {
                postIntroTitleAlpha = Math.max(0, postIntroTitleAlpha - dtMs / 350);
                postIntroBoxAlpha = Math.min(1, postIntroBoxAlpha + dtMs / 380);
                if (postIntroTitleAlpha <= 0 && postIntroBoxAlpha >= 1) {
                    postIntroPhase = 'TYPE';
                    postIntroChars = 0;
                }
            } else if (postIntroPhase === 'TYPE') {
                const fullLen = POST_INTRO_PAGES[postIntroPage].length;
                const prevInt = Math.floor(postIntroChars);
                postIntroChars = Math.min(fullLen, postIntroChars + dtMs * 0.042); // ~42 chars/sec typewriter
                const curInt = Math.floor(postIntroChars);
                if (curInt > prevInt && curInt % 4 === 0 && POST_INTRO_PAGES[postIntroPage][curInt - 1] !== ' ') {
                    playTone(520, 'square', 0.018, 0.015);
                }
            } else if (postIntroPhase === 'FADE_TEXT') {
                postIntroTextAlpha = Math.max(0, postIntroTextAlpha - dtMs / 300);
                if (postIntroTextAlpha <= 0) {
                    postIntroPage = 1;
                    postIntroChars = 0;
                    postIntroTextAlpha = 1.0;
                    postIntroPhase = 'TYPE';
                }
            } else if (postIntroPhase === 'START_FADE') {
                postIntroBoxAlpha = Math.max(0, postIntroBoxAlpha - dtMs / 300);
                if (postIntroBoxAlpha <= 0) {
                    startOrderRush();
                }
            }
        }

        function handlePostIntroAdvance() {
            const fullLen = POST_INTRO_PAGES[postIntroPage].length;
            if (postIntroPhase === 'FADE_TITLE') {
                postIntroTitleAlpha = 0;
                postIntroBoxAlpha = 1;
                postIntroPhase = 'TYPE';
                return;
            }
            if (postIntroPhase === 'TYPE') {
                if (postIntroChars < fullLen) {
                    // Instant-finish current page typewriter
                    postIntroChars = fullLen;
                    playSfx('click');
                } else if (postIntroPage === 0) {
                    // Fade out screen 1/2 text -> reveal screen 2/2
                    postIntroPhase = 'FADE_TEXT';
                    playSfx('click');
                } else {
                    // Screen 2/2 complete -> start Lane's Post!
                    postIntroPhase = 'START_FADE';
                    playSfx('serve');
                }
            }
        }

        function wrapCanvasLines(text, maxWidth, font) {
            ctx.font = font;
            const words = text.split(' ');
            const lines = [];
            let current = '';
            for (const w of words) {
                const test = current ? (current + ' ' + w) : w;
                if (ctx.measureText(test).width > maxWidth && current) {
                    lines.push(current);
                    current = w;
                } else {
                    current = test;
                }
            }
            if (current) lines.push(current);
            return lines;
        }

        // ==========================================
        // LANE'S POST SPATIAL CLERK RUSH LOGIC
        // ==========================================
        let nextCustomerUid = 1;

        function getFreeCounterSpot() {
            const taken = new Set();
            postCustomers.forEach(c => {
                if (c.spotIdx !== -1 && c.state !== 'WALK_OUT') taken.add(c.spotIdx);
            });
            for (let i = 0; i < MAX_COUNTER_SPOTS; i++) {
                if (!taken.has(i)) return i;
            }
            return -1;
        }

        function getQueuedCustomerCount() {
            return postCustomers.filter(c => c.state !== 'WALK_OUT' && c.spotIdx === -1).length;
        }

        function refreshQueuePositions() {
            let freeSpot = getFreeCounterSpot();
            while (freeSpot !== -1) {
                const nextInLine = postCustomers.find(c => (c.state === 'IN_QUEUE' || c.state === 'WALK_IN') && c.spotIdx === -1);
                if (!nextInLine) break;
                nextInLine.spotIdx = freeSpot;
                nextInLine.queueIdx = -1;
                nextInLine.state = 'WALK_IN';
                nextInLine.targetX = postLayout.counterX - 20;
                nextInLine.targetY = postLayout.spotYs[freeSpot];
                freeSpot = getFreeCounterSpot();
            }

            const queued = postCustomers.filter(c => c.state !== 'WALK_OUT' && c.spotIdx === -1);
            queued.forEach((c, idx) => {
                c.queueIdx = idx;
                c.targetX = Math.max(26, postLayout.queueBaseX - idx * 30);
                c.targetY = postLayout.queueBaseY + ((idx % 2) * 8 - 4);
            });
        }

        function spawnPostCustomer() {
            const spotIdx = getFreeCounterSpot();
            const queuedCount = getQueuedCustomerCount();

            if (spotIdx === -1 && queuedCount >= MAX_WAIT_QUEUE) {
                postGameOverReason = 'QUEUE OVERRUN!';
                stopChiptuneTrack();
                playSfx('miss');
                gameState = 'ORDER_GAMEOVER';
                return;
            }

            const arch = CUSTOMER_ARCHETYPES[Math.floor(Math.random() * CUSTOMER_ARCHETYPES.length)];
            const reqLine = arch.requests[Math.floor(Math.random() * arch.requests.length)];
            const basePatience = Math.max(24000, 36000 - postStage * 1300);

            const cust = {
                id: nextCustomerUid++,
                arch,
                requestLine: reqLine,
                x: postLayout.doorX - 12,
                y: postLayout.doorY,
                targetX: spotIdx !== -1 ? (postLayout.counterX - 20) : postLayout.queueBaseX,
                targetY: spotIdx !== -1 ? postLayout.spotYs[spotIdx] : postLayout.queueBaseY,
                state: 'WALK_IN',
                spotIdx,
                queueIdx: spotIdx === -1 ? queuedCount : -1,
                hideId: Math.floor(Math.random() * 4),
                palId: Math.floor(Math.random() * 4),
                furId: Math.floor(Math.random() * 4),
                patience: basePatience,
                maxPatience: basePatience,
                shoutAnimMs: 0,
                servedMocc: false
            };

            postCustomers.push(cust);
            lastSpawnedCustomer = cust;
            refreshQueuePositions();
        }

        function startOrderRush() {
            postCustomers = [];
            lastSpawnedCustomer = null;
            postElapsedMs = 0;
            postStage = 0;
            postGameOverReason = 'POST CLOSED!';
            shelfStockIdx = [0, 0, 0];
            clerk = {
                x: Math.floor((postLayout.aisleMinX + postLayout.aisleMaxX) / 2),
                y: postLayout.spotYs[1],
                facing: -1,
                movingMs: 0,
                rustleAnimMs: 0,
                stitchProgress: 0,
                heldHide: null,
                heldPal: null,
                heldFur: null,
                craftedMocc: null
            };
            moveDir = { dx: 0, dy: 0, pulseMs: 0 };
            orderScore = 0;
            orderCombo = 0;
            orderServedCount = 0;
            orderStrikes = 0;
            orderSpawnTimerMs = 24000;
            feedbackMsg = '';
            feedbackTimerMs = 0;

            spawnPostCustomer();
            startChiptuneTrack('POST');
            lastFrameTime = performance.now();
            gameState = 'ORDER_PLAYING';
        }

        function getClerkInteractionTarget() {
            if (clerk.x >= postLayout.aisleMaxX - 16) {
                for (const sh of postLayout.shelves) {
                    if (clerk.y >= sh.y - 8 && clerk.y <= sh.y + sh.h + 8) {
                        return { zone: 'SHELF', shelf: sh };
                    }
                }
            }
            if (clerk.y >= postLayout.benchStandY - 14 && Math.abs(clerk.x - postLayout.benchX) <= 34) {
                return { zone: 'WORKBENCH' };
            }
            if (clerk.x <= postLayout.aisleMinX + 18) {
                let bestCust = null;
                let bestDist = 36;
                postCustomers.forEach(c => {
                    if (c.state === 'AT_COUNTER') {
                        const d = Math.abs(clerk.y - c.y);
                        if (d < bestDist) {
                            bestDist = d;
                            bestCust = c;
                        }
                    }
                });
                if (bestCust) return { zone: 'CUSTOMER', customer: bestCust };
            }
            return { zone: 'NONE' };
        }

        function advanceWorkbenchStitch(btn) {
            if (clerk.craftedMocc) return true;
            if (clerk.heldHide === null || clerk.heldPal === null || clerk.heldFur === null) {
                feedbackMsg = 'NEED HIDE + BEAD + FUR';
                feedbackColor = '#ff6b6b';
                feedbackTimerMs = 850;
                playSfx('miss');
                return true;
            }

            const expectedBtn = STITCH_SEQ[clerk.stitchProgress];
            if (btn === expectedBtn) {
                clerk.stitchProgress++;
                clerk.rustleAnimMs = 280;
                playSfx('stitch_step');

                if (clerk.stitchProgress >= STITCH_SEQ.length) {
                    clerk.craftedMocc = {
                        hideId: clerk.heldHide,
                        palId: clerk.heldPal,
                        furId: clerk.heldFur
                    };
                    clerk.heldHide = null;
                    clerk.heldPal = null;
                    clerk.heldFur = null;
                    clerk.stitchProgress = 0;
                    playSfx('craft');
                }
            } else {
                clerk.stitchProgress = (btn === 'B') ? 1 : 0;
                clerk.rustleAnimMs = 180;
                playSfx('click');
            }
            return true;
        }

        function handleClerkActionA() {
            const target = getClerkInteractionTarget();

            if (target.zone === 'SHELF') {
                if (clerk.craftedMocc) {
                    feedbackMsg = 'DELIVER FIRST!';
                    feedbackColor = '#ffe169';
                    feedbackTimerMs = 800;
                    playSfx('miss');
                    return;
                }
                const sIdx = target.shelf.idx;
                const itemVal = shelfStockIdx[sIdx];
                if (target.shelf.kind === 'HIDE') {
                    if (clerk.heldHide === itemVal) shelfStockIdx[sIdx] = (shelfStockIdx[sIdx] + 1) % 4;
                    clerk.heldHide = shelfStockIdx[sIdx];
                } else if (target.shelf.kind === 'PAL') {
                    if (clerk.heldPal === itemVal) shelfStockIdx[sIdx] = (shelfStockIdx[sIdx] + 1) % 4;
                    clerk.heldPal = shelfStockIdx[sIdx];
                } else if (target.shelf.kind === 'FUR') {
                    if (clerk.heldFur === itemVal) shelfStockIdx[sIdx] = (shelfStockIdx[sIdx] + 1) % 4;
                    clerk.heldFur = shelfStockIdx[sIdx];
                }
                clerk.stitchProgress = 0;
                clerk.facing = 1;
                playSfx('pickup');
                return;
            }

            if (target.zone === 'WORKBENCH') {
                advanceWorkbenchStitch('A');
                return;
            }

            if (target.zone === 'CUSTOMER') {
                clerk.facing = -1;
                const cust = target.customer;
                if (!clerk.craftedMocc) {
                    cust.shoutAnimMs = 900;
                    playSfx('click');
                    return;
                }
                if (
                    clerk.craftedMocc.hideId === cust.hideId &&
                    clerk.craftedMocc.palId === cust.palId &&
                    clerk.craftedMocc.furId === cust.furId
                ) {
                    clerk.craftedMocc = null;
                    cust.servedMocc = true;
                    cust.state = 'WALK_OUT';
                    cust.spotIdx = -1;
                    cust.targetX = postLayout.doorX - 24;
                    cust.targetY = postLayout.doorY;

                    orderServedCount++;
                    orderCombo++;
                    const speedBonus = Math.round((cust.patience / cust.maxPatience) * 50);
                    const pts = (100 + speedBonus) * Math.min(5, orderCombo);
                    orderScore += pts;
                    const thx = cust.arch.thanks[Math.floor(Math.random() * cust.arch.thanks.length)];
                    feedbackMsg = `${thx} (+${pts})`;
                    feedbackColor = '#7bed9f';
                    feedbackTimerMs = 1300;
                    playSfx('serve');
                    refreshQueuePositions();
                } else {
                    orderCombo = 0;
                    cust.shoutAnimMs = 900;
                    feedbackMsg = 'Wrong material used!';
                    feedbackColor = '#ff5252';
                    feedbackTimerMs = 1200;
                    playSfx('miss');
                }
            }
        }

        function handleClerkActionB() {
            const target = getClerkInteractionTarget();
            if (target.zone === 'SHELF') {
                const sIdx = target.shelf.idx;
                shelfStockIdx[sIdx] = (shelfStockIdx[sIdx] + 1) % 4;
                clerk.facing = 1;
                playSfx('click');
                return;
            }
            if (target.zone === 'WORKBENCH' && !clerk.craftedMocc && clerk.heldHide !== null && clerk.heldPal !== null && clerk.heldFur !== null) {
                advanceWorkbenchStitch('B');
                return;
            }
            if (clerk.craftedMocc || clerk.heldHide !== null || clerk.heldPal !== null || clerk.heldFur !== null) {
                clerk.craftedMocc = null;
                clerk.heldHide = null;
                clerk.heldPal = null;
                clerk.heldFur = null;
                clerk.stitchProgress = 0;
                playSfx('click');
            }
        }

        function updateOrderRush(dtMs) {
            postElapsedMs += dtMs;
            postStage = Math.min(9, Math.floor(postElapsedMs / 60000));

            if (feedbackTimerMs > 0) feedbackTimerMs -= dtMs;
            if (clerk.rustleAnimMs > 0) clerk.rustleAnimMs = Math.max(0, clerk.rustleAnimMs - dtMs);

            let vx = (keysHeld.right ? 1 : 0) - (keysHeld.left ? 1 : 0);
            let vy = (keysHeld.down ? 1 : 0) - (keysHeld.up ? 1 : 0);
            if (vx === 0 && vy === 0 && moveDir.pulseMs > 0) {
                vx = moveDir.dx;
                vy = moveDir.dy;
                moveDir.pulseMs = Math.max(0, moveDir.pulseMs - dtMs);
            }

            if (vx !== 0 || vy !== 0) {
                const len = Math.hypot(vx, vy);
                const speed = 0.165 * dtMs;
                const nextX = Math.max(postLayout.aisleMinX, Math.min(postLayout.aisleMaxX, clerk.x + (vx / len) * speed));
                const nextY = Math.max(postLayout.floorTopY + 24, Math.min(postLayout.benchStandY, clerk.y + (vy / len) * speed));

                if (nextY < postLayout.benchStandY - 14) {
                    clerk.stitchProgress = 0;
                }

                clerk.x = nextX;
                clerk.y = nextY;
                if (vx < 0) clerk.facing = -1;
                else if (vx > 0) clerk.facing = 1;
                clerk.movingMs = 120;
            } else if (clerk.movingMs > 0) {
                clerk.movingMs = Math.max(0, clerk.movingMs - dtMs);
            }

            const walkSpeed = 0.082 * dtMs;
            for (let i = postCustomers.length - 1; i >= 0; i--) {
                const c = postCustomers[i];
                if (c.shoutAnimMs > 0) c.shoutAnimMs = Math.max(0, c.shoutAnimMs - dtMs);

                const dx = c.targetX - c.x;
                const dy = c.targetY - c.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    c.x += (dx / dist) * Math.min(dist, walkSpeed);
                    c.y += (dy / dist) * Math.min(dist, walkSpeed);
                } else {
                    c.x = c.targetX;
                    c.y = c.targetY;
                    if (c.state === 'WALK_IN') {
                        if (c.spotIdx !== -1) {
                            c.state = 'AT_COUNTER';
                            c.shoutAnimMs = 1400;
                            playSfx('click');
                        } else {
                            c.state = 'IN_QUEUE';
                        }
                    } else if (c.state === 'WALK_OUT') {
                        postCustomers.splice(i, 1);
                        continue;
                    }
                }

                if (c.state === 'AT_COUNTER') {
                    c.patience -= dtMs;
                    if (c.patience <= 0) {
                        c.state = 'WALK_OUT';
                        c.spotIdx = -1;
                        c.targetX = postLayout.doorX - 24;
                        c.targetY = postLayout.doorY;
                        orderStrikes++;
                        orderCombo = 0;
                        playSfx('miss');
                        refreshQueuePositions();

                        if (orderStrikes >= MAX_STRIKES) {
                            postGameOverReason = 'POST CLOSED!';
                            stopChiptuneTrack();
                            gameState = 'ORDER_GAMEOVER';
                            return;
                        }
                    }
                }
            }

            const activeCustomers = postCustomers.filter(c => c.state !== 'WALK_OUT');
            const stageIntervalMs = Math.round(24000 - postStage * 2050);
            const patienceTriggerRatio = Math.min(0.85, 0.35 + postStage * 0.055);

            orderSpawnTimerMs -= dtMs;

            let prevBelowThreshold = false;
            if (
                lastSpawnedCustomer &&
                lastSpawnedCustomer.state === 'AT_COUNTER' &&
                (lastSpawnedCustomer.patience / lastSpawnedCustomer.maxPatience) <= patienceTriggerRatio
            ) {
                prevBelowThreshold = true;
            }

            if (activeCustomers.length === 0 || orderSpawnTimerMs <= 0 || (prevBelowThreshold && orderSpawnTimerMs < stageIntervalMs - 2500)) {
                spawnPostCustomer();
                orderSpawnTimerMs = stageIntervalMs;
            }
        }

        // ==========================================
        // TIPI CUTSCENES (UNSKIPPABLE, STEPPED SNES TIMING)
        // ==========================================
        function startTipiIntroCutscene() {
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            startChiptuneTrack('TIPI');
            gameState = 'TIPI_INTRO_CUTSCENE';
        }

        function startTipiSitCutscene() {
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            gameState = 'TIPI_SIT_CUTSCENE';
        }

        function startBeadingSession() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            cursor = { x: 4, y: 4, color: 1 };
            actionBarFocus = false;
            actionBarIdx = 1;
            showChalkGuide = (selectedTipiTemplate >= 0);
            beadingFadeAlpha = 1.0;
            gameState = 'BEADING';
        }

        function startTipiOutroCutscene() {
            actionBarFocus = false;
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            playSfx('serve');
            gameState = 'TIPI_OUTRO_CUTSCENE';
        }

        function updateTipiCutscenes(dtMs) {
            if (gameState === 'TIPI_INTRO_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                if (cutsceneElapsedMs >= 2800) {
                    prepRow = 0;
                    gameState = 'PREP_SELECT';
                }
            } else if (gameState === 'TIPI_SIT_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                if (cutsceneElapsedMs >= 2700) {
                    startBeadingSession();
                }
            } else if (gameState === 'BEADING' && beadingFadeAlpha > 0) {
                beadingFadeAlpha = Math.max(0, beadingFadeAlpha - dtMs / 450);
            } else if (gameState === 'TIPI_OUTRO_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                const maxCam = Math.max(0, TIPI_WORLD_W - VIEW_W);

                if (cutsceneElapsedMs < 2400) {
                    const t = stepProgress((cutsceneElapsedMs - 500) / 1800, 16);
                    tipiCamX = snap2(t * maxCam);
                } else {
                    tipiCamX = snap2(maxCam);
                }

                if (cutsceneElapsedMs >= 9100) {
                    stopChiptuneTrack();
                    tipiCamX = 0;
                    gameState = 'MODE_SELECT';
                }
            }
        }

        // ==========================================
        // DIRECT POSTMESSAGE SIGNAL BRIDGE
        // ==========================================
        function handleCommand(cmd) {
            if (cmd === 'PAUSE') {
                isPaused = true;
                if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'running') chiptuneAudioCtx.suspend();
                return;
            }
            if (cmd === 'RESUME') {
                isPaused = false;
                lastFrameTime = performance.now();
                if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'suspended') chiptuneAudioCtx.resume();
                return;
            }
            if (isPaused) return;

            if (gameState === 'TIPI_INTRO_CUTSCENE' || gameState === 'TIPI_SIT_CUTSCENE' || gameState === 'TIPI_OUTRO_CUTSCENE') {
                return;
            }

            if (gameState === 'MODE_SELECT') {
                if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_RIGHT' || cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN') {
                    menuSelection = menuSelection === 0 ? 1 : 0;
                    playSfx('click');
                }
                if (cmd === 'BUTTON_A') {
                    if (menuSelection === 0) startPostIntro();
                    else startTipiIntroCutscene();
                }
                return;
            }

            if (gameState === 'POST_INTRO') {
                if (cmd === 'BUTTON_A') handlePostIntroAdvance();
                return;
            }

            if (gameState === 'ORDER_PLAYING') {
                if (cmd === 'DPAD_UP')    { moveDir = { dx: 0,  dy: -1, pulseMs: 135 }; }
                if (cmd === 'DPAD_DOWN')  { moveDir = { dx: 0,  dy: 1,  pulseMs: 135 }; }
                if (cmd === 'DPAD_LEFT')  { moveDir = { dx: -1, dy: 0,  pulseMs: 135 }; clerk.facing = -1; }
                if (cmd === 'DPAD_RIGHT') { moveDir = { dx: 1,  dy: 0,  pulseMs: 135 }; clerk.facing = 1; }
                if (cmd === 'BUTTON_A')   { handleClerkActionA(); }
                if (cmd === 'BUTTON_B')   { handleClerkActionB(); }
                return;
            }

            if (gameState === 'ORDER_GAMEOVER') {
                if (cmd === 'BUTTON_A') startOrderRush();
                if (cmd === 'BUTTON_B') gameState = 'MODE_SELECT';
                return;
            }

            if (gameState === 'PREP_SELECT') {
                if (cmd === 'DPAD_UP') prepRow = (prepRow + 4) % 5;
                if (cmd === 'DPAD_DOWN') prepRow = (prepRow + 1) % 5;
                if (cmd === 'DPAD_LEFT') {
                    if (prepRow === 0) selectedHideId = (selectedHideId + HIDES.length - 1) % HIDES.length;
                    if (prepRow === 1) selectedPaletteId = (selectedPaletteId + PALETTES.length - 1) % PALETTES.length;
                    if (prepRow === 2) selectedTipiFurId = (selectedTipiFurId + FURS.length - 1) % FURS.length;
                    if (prepRow === 3) selectedTipiTemplate = selectedTipiTemplate <= -1 ? PATTERNS.length - 1 : selectedTipiTemplate - 1;
                    playSfx('click');
                }
                if (cmd === 'DPAD_RIGHT') {
                    if (prepRow === 0) selectedHideId = (selectedHideId + 1) % HIDES.length;
                    if (prepRow === 1) selectedPaletteId = (selectedPaletteId + 1) % PALETTES.length;
                    if (prepRow === 2) selectedTipiFurId = (selectedTipiFurId + 1) % FURS.length;
                    if (prepRow === 3) selectedTipiTemplate = selectedTipiTemplate >= PATTERNS.length - 1 ? -1 : selectedTipiTemplate + 1;
                    playSfx('click');
                }
                if (cmd === 'BUTTON_A') {
                    if (prepRow === 4) startTipiSitCutscene();
                    else prepRow++;
                }
                if (cmd === 'BUTTON_B') {
                    stopChiptuneTrack();
                    gameState = 'MODE_SELECT';
                }
                return;
            }

            if (gameState === 'BEADING') {
                if (actionBarFocus) {
                    if (cmd === 'DPAD_UP') {
                        actionBarFocus = false;
                        cursor.y = ROWS - 1;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    } else if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_RIGHT') {
                        actionBarIdx = actionBarIdx === 0 ? 1 : 0;
                    } else if (cmd === 'BUTTON_A') {
                        if (actionBarIdx === 0) {
                            if (selectedTipiTemplate >= 0) showChalkGuide = !showChalkGuide;
                            else board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
                        } else {
                            startTipiOutroCutscene();
                        }
                    } else if (cmd === 'BUTTON_B') {
                        actionBarFocus = false;
                    }
                    return;
                }

                if (cmd === 'DPAD_UP') {
                    if (cursor.y > 0) {
                        cursor.y--;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    }
                } else if (cmd === 'DPAD_DOWN') {
                    if (cursor.y < ROWS - 1) {
                        cursor.y++;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    } else {
                        actionBarFocus = true;
                        actionBarIdx = 1;
                    }
                } else if (cmd === 'DPAD_LEFT') {
                    const { minC } = getRowColBounds(cursor.y);
                    if (cursor.x > minC) cursor.x--;
                } else if (cmd === 'DPAD_RIGHT') {
                    const { maxC } = getRowColBounds(cursor.y);
                    if (cursor.x < maxC) cursor.x++;
                } else if (cmd === 'BUTTON_B') {
                    cursor.color = (cursor.color + 1) % 8;
                } else if (cmd === 'BUTTON_A') {
                    if (isPlayableCell(cursor.y, cursor.x)) {
                        board[cursor.y][cursor.x] = cursor.color;
                    }
                }
            }
        }

        window.addEventListener('message', function(event) {
            handleCommand(event.data);
        });

        // ==========================================
        // 16-BIT BEAD RENDERERS (FLAT & SEWN EDGE-SIDE)
        // ==========================================
        function drawFlatBeadAt(cx, cy, radius, beadStyle, alpha = 1.0) {
            if (!beadStyle) return;
            ctx.save();
            ctx.globalAlpha = alpha;

            ctx.fillStyle = 'rgba(12, 5, 2, 0.72)';
            ctx.beginPath(); ctx.arc(cx + radius * 0.14, cy + radius * 0.18, radius * 1.02, 0, Math.PI * 2); ctx.fill();

            const grad = ctx.createRadialGradient(cx - radius * 0.30, cy - radius * 0.32, radius * 0.10, cx, cy, radius);
            grad.addColorStop(0.0, beadStyle.hi); grad.addColorStop(0.32, beadStyle.mid);
            grad.addColorStop(0.76, beadStyle.deep); grad.addColorStop(1.0, beadStyle.rim);
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

            const holeR = Math.max(1.2, radius * 0.32);
            ctx.strokeStyle = beadStyle.holeRim; ctx.lineWidth = Math.max(0.7, radius * 0.14);
            ctx.beginPath(); ctx.arc(cx, cy, holeR + 0.3, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = '#120804';
            ctx.beginPath(); ctx.arc(cx, cy, holeR, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.ellipse(cx - radius * 0.40, cy - radius * 0.40, Math.max(0.9, radius * 0.22), Math.max(0.7, radius * 0.12), -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function traceBeadBarrelPath(ctxRef, cx, cy, halfW, halfH) {
            const r = Math.min(halfW * 0.55, halfH * 0.92);
            ctxRef.beginPath();
            ctxRef.moveTo(cx - halfW + r, cy - halfH);
            ctxRef.quadraticCurveTo(cx, cy - halfH * 1.14, cx + halfW - r, cy - halfH);
            ctxRef.quadraticCurveTo(cx + halfW, cy - halfH, cx + halfW, cy);
            ctxRef.quadraticCurveTo(cx + halfW, cy + halfH, cx + halfW - r, cy + halfH);
            ctxRef.quadraticCurveTo(cx, cy + halfH * 1.14, cx - halfW + r, cy + halfH);
            ctxRef.quadraticCurveTo(cx - halfW, cy + halfH, cx - halfW, cy);
            ctxRef.quadraticCurveTo(cx - halfW, cy - halfH, cx - halfW + r, cy - halfH);
            ctxRef.closePath();
        }

        function drawSewnBeadAt(cx, cy, cellSize, beadStyle, isSewn = true, alpha = 1.0) {
            if (!beadStyle) return;
            const halfW = Math.max(5.5, Math.floor(cellSize * 0.43));
            const halfH = Math.max(4.0, Math.floor(cellSize * 0.31));

            ctx.save();
            ctx.globalAlpha = alpha;

            if (isSewn) {
                const threadOut = halfW + 2.5;
                ctx.fillStyle = '#1a0b04';
                ctx.fillRect(Math.floor(cx - threadOut - 1), Math.floor(cy - 1), 2, 2);
                ctx.fillRect(Math.floor(cx + threadOut - 1), Math.floor(cy - 1), 2, 2);

                ctx.strokeStyle = '#efe0be'; ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(cx - threadOut, cy); ctx.lineTo(cx - halfW + 1, cy);
                ctx.moveTo(cx + halfW - 1, cy); ctx.lineTo(cx + threadOut, cy);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(1.2, isSewn ? 2.0 : 3.2);
            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.fillStyle = isSewn ? 'rgba(12, 5, 2, 0.72)' : 'rgba(12, 5, 2, 0.48)';
            ctx.fill();
            ctx.restore();

            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            const grad = ctx.createRadialGradient(cx - halfW * 0.24, cy - halfH * 0.42, halfH * 0.12, cx, cy + halfH * 0.10, halfW * 1.18);
            grad.addColorStop(0.0, beadStyle.hi); grad.addColorStop(0.32, beadStyle.mid);
            grad.addColorStop(0.76, beadStyle.deep); grad.addColorStop(1.0, beadStyle.rim);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.save();
            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.clip();
            ctx.fillStyle = 'rgba(16, 6, 2, 0.34)';
            ctx.fillRect(cx - halfW, cy - halfH * 0.55, 2, halfH * 1.1);
            ctx.fillRect(cx + halfW - 2, cy - halfH * 0.55, 2, halfH * 1.1);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
            ctx.beginPath();
            ctx.ellipse(cx - halfW * 0.16, cy - halfH * 0.44, Math.max(2.0, halfW * 0.42), Math.max(1.0, halfH * 0.20), -0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.strokeStyle = 'rgba(20, 8, 3, 0.65)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
        }

        // ==========================================
        // BUSHY / FLUFFY ANKLE FUR TRIM RENDERER
        // ==========================================
        function drawFluffyFurTrim(x, y, width, height, furObj, bushy = false) {
            ctx.save();
            if (bushy) {
                ctx.fillStyle = furObj.dark;
                for (let fx = x - 6; fx <= x + width - 2; fx += 8) {
                    const seed = Math.abs(Math.sin(fx * 12.9898) * 43758.5453) % 1;
                    const topJut = Math.floor(seed * 5);
                    const botJut = Math.floor(((seed * 5) % 1) * 6);
                    ctx.fillRect(fx, y - topJut, 10, height + topJut + botJut);
                }

                ctx.fillStyle = furObj.base;
                for (let fx = x - 4; fx <= x + width - 4; fx += 9) {
                    const seed = Math.abs(Math.sin(fx * 78.233) * 19341.23) % 1;
                    const ty = y - Math.floor(seed * 4);
                    const th = height - 1 + Math.floor(((seed * 4) % 1) * 5);
                    ctx.fillRect(fx, ty, 10, th);
                    ctx.fillRect(fx - 2, ty + 3, 14, Math.max(4, th - 6));
                }

                ctx.fillStyle = furObj.hi;
                for (let fx = x - 2; fx <= x + width - 6; fx += 10) {
                    const seed = Math.abs(Math.sin(fx * 41.123) * 9182.77) % 1;
                    const hy = y - 1 + Math.floor(seed * (height * 0.35));
                    ctx.fillRect(fx, hy, 6, 5);
                    ctx.fillRect(fx + 2, hy - 2, 4, 3);
                }
                ctx.restore();
                return;
            }

            ctx.fillStyle = furObj.dark;
            for (let fx = x - 3; fx <= x + width + 3; fx += 4) {
                const seed = Math.abs(Math.sin(fx * 12.9898) * 43758.5453) % 1;
                const topJut = Math.floor(seed * 3);
                const botJut = Math.floor(((seed * 7) % 1) * 4);
                ctx.fillRect(fx, y - topJut, 5, height + topJut + botJut);
            }
            ctx.fillStyle = furObj.base;
            for (let fx = x - 2; fx <= x + width + 2; fx += 5) {
                const seed = Math.abs(Math.sin(fx * 78.233) * 19341.23) % 1;
                ctx.fillRect(fx, y - Math.floor(seed * 2), 5, height + Math.floor(seed * 2));
            }
            ctx.fillStyle = furObj.hi;
            for (let fx = x; fx <= x + width - 2; fx += 6) {
                const seed = Math.abs(Math.sin(fx * 41.123) * 9182.77) % 1;
                ctx.fillRect(fx, y + Math.floor(seed * 2), 3, 3);
            }
            ctx.restore();
        }

        // ==========================================
        // 16-BIT MOCCASIN RENDERER (THE TIPI)
        // ==========================================
        function traceFlippedDomePath(ctxRef, cx, rx, topY, domeCenterY, ry, topCorner = 4) {
            ctxRef.beginPath();
            ctxRef.moveTo(cx - rx + topCorner, topY);
            ctxRef.lineTo(cx + rx - topCorner, topY);
            ctxRef.quadraticCurveTo(cx + rx, topY, cx + rx, topY + topCorner);
            ctxRef.lineTo(cx + rx, domeCenterY);
            ctxRef.ellipse(cx, domeCenterY, rx, ry, 0, 0, Math.PI, false);
            ctxRef.lineTo(cx - rx, topY + topCorner);
            ctxRef.quadraticCurveTo(cx - rx, topY, cx - rx + topCorner, topY);
            ctxRef.closePath();
        }

        function drawThickSinewSeamFlipped(cx, rx, topY, domeCenterY, ry, sinewColor) {
            const pts = [];
            const sideSteps = 7;
            for (let i = 0; i < sideSteps; i++) pts.push({ x: cx + rx, y: topY + 4 + (i / sideSteps) * (domeCenterY - (topY + 4)) });
            const arcSteps = 28;
            for (let i = 0; i <= arcSteps; i++) {
                const a = (i / arcSteps) * Math.PI;
                pts.push({ x: cx + Math.cos(a) * rx, y: domeCenterY + Math.sin(a) * ry });
            }
            for (let i = 1; i <= sideSteps; i++) pts.push({ x: cx - rx, y: domeCenterY - (i / sideSteps) * (domeCenterY - (topY + 4)) });

            for (let i = 0; i < pts.length - 1; i += 2) {
                const p1 = pts[i], p2 = pts[i + 1];
                ctx.fillStyle = '#1c0c04';
                ctx.fillRect(Math.floor(p1.x - 1.5), Math.floor(p1.y - 1.5), 3, 3);
                ctx.fillRect(Math.floor(p2.x - 1.5), Math.floor(p2.y - 1.5), 3, 3);

                ctx.strokeStyle = 'rgba(18, 8, 2, 0.78)'; ctx.lineWidth = 4.0; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(p1.x + 1, p1.y + 1.5); ctx.lineTo(p2.x + 1, p2.y + 1.5); ctx.stroke();

                ctx.strokeStyle = sinewColor; ctx.lineWidth = 2.8;
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }

            for (let sx = cx - rx + 8; sx <= cx + rx - 14; sx += 14) {
                ctx.fillStyle = '#1c0c04';
                ctx.fillRect(sx - 1, topY + 2, 2, 3); ctx.fillRect(sx + 7, topY + 2, 2, 3);
                ctx.strokeStyle = sinewColor; ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.moveTo(sx, topY + 3); ctx.lineTo(sx + 7, topY + 3); ctx.stroke();
            }
        }

        function drawMoccasin(m, hideObj, guidePatternGrid, guidePalette, furObj) {
            const cx = m.offsetX + m.gridW / 2;
            const vampRX = Math.floor(m.gridW / 2) + 12;
            const vampTopY = m.offsetY - 10;
            const vampDomeCenterY = m.offsetY + m.gridH - Math.floor(m.cellSize * 3.1);
            const vampBotY = m.offsetY + m.gridH + 12;
            const vampRY = vampBotY - vampDomeCenterY;

            const outerRX = vampRX + 20;
            const outerTopY = vampTopY - 12;
            const outerDomeCenterY = vampDomeCenterY - 6;
            const outerBotY = vampBotY + 24;
            const outerRY = outerBotY - outerDomeCenterY;

            ctx.save();

            ctx.save();
            ctx.translate(5, 8);
            traceFlippedDomePath(ctx, cx, outerRX, outerTopY - 18, outerDomeCenterY, outerRY, 6);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.58)'; ctx.fill();
            ctx.restore();

            traceFlippedDomePath(ctx, cx, outerRX, outerTopY, outerDomeCenterY, outerRY, 6);
            ctx.save();
            ctx.clip();
            const outerGrad = ctx.createRadialGradient(cx + 14, outerDomeCenterY, 18, cx, outerDomeCenterY - 20, outerRX * 1.45);
            outerGrad.addColorStop(0.0, hideObj.outerLight); outerGrad.addColorStop(0.65, hideObj.outerMid); outerGrad.addColorStop(1.0, hideObj.outerDark);
            ctx.fillStyle = outerGrad;
            ctx.fillRect(cx - outerRX - 2, outerTopY - 2, outerRX * 2 + 4, (outerBotY - outerTopY) + 4);

            const pleatCount = 21;
            for (let i = 0; i < pleatCount; i++) {
                const t = i / (pleatCount - 1);
                const a = 0.06 + t * (Math.PI - 0.12);
                const ox = cx + Math.cos(a) * (outerRX + 2), oy = outerDomeCenterY + Math.sin(a) * (outerRY + 2);
                const ix = cx + Math.cos(a) * (vampRX - 2), iy = vampDomeCenterY + Math.sin(a) * (vampRY - 2);
                ctx.strokeStyle = 'rgba(18, 8, 2, 0.68)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ix, iy); ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 230, 190, 0.24)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(ox + 2.5, oy - 1); ctx.lineTo(ix + 2, iy - 1); ctx.stroke();
            }
            ctx.restore();

            traceFlippedDomePath(ctx, cx, outerRX, outerTopY, outerDomeCenterY, outerRY, 6);
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2.5; ctx.stroke();

            traceFlippedDomePath(ctx, cx, vampRX + 3, vampTopY - 2, vampDomeCenterY, vampRY + 3, 3);
            ctx.fillStyle = '#211005'; ctx.fill();

            traceFlippedDomePath(ctx, cx, vampRX, vampTopY, vampDomeCenterY, vampRY, 3);
            ctx.save();
            ctx.clip();
            const vampGrad = ctx.createRadialGradient(cx + 12, m.offsetY + m.gridH * 0.58, 16, cx, m.offsetY + m.gridH * 0.52, Math.max(vampRX, m.gridH) * 1.15);
            vampGrad.addColorStop(0.0, hideObj.light); vampGrad.addColorStop(0.42, hideObj.mid);
            vampGrad.addColorStop(0.84, hideObj.dark); vampGrad.addColorStop(1.0, hideObj.edge);
            ctx.fillStyle = vampGrad;
            ctx.fillRect(cx - vampRX - 2, vampTopY - 2, vampRX * 2 + 4, (vampBotY - vampTopY) + 4);
            drawDitherBand(ctx, cx - vampRX, vampTopY, vampRX * 2, vampBotY - vampTopY, 'rgba(20, 10, 4, 0.12)', 2);
            ctx.restore();

            traceFlippedDomePath(ctx, cx, vampRX, vampTopY, vampDomeCenterY, vampRY, 3);
            ctx.strokeStyle = '#261206'; ctx.lineWidth = 2; ctx.stroke();

            drawThickSinewSeamFlipped(cx, vampRX - 1, vampTopY, vampDomeCenterY, vampRY - 1, hideObj.sinew);

            const cuffH = 26;
            const cuffTopY = vampTopY - cuffH - 2;
            const cuffW = outerRX * 2 - 2, cuffX = cx - cuffW / 2;
            ctx.fillStyle = hideObj.cuffMain; ctx.fillRect(cuffX, cuffTopY, cuffW, cuffH);
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2; ctx.strokeRect(cuffX, cuffTopY + 2, cuffW, cuffH - 2);

            drawFluffyFurTrim(cuffX, cuffTopY - 2, cuffW, 24, furObj || FURS[0], true);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!isPlayableCell(r, c)) continue;
                    const cellX = m.offsetX + c * m.cellSize, cellY = m.offsetY + r * m.cellSize;
                    const midX = cellX + m.cellSize / 2, midY = cellY + m.cellSize / 2;

                    const roleId = guidePatternGrid ? guidePatternGrid[r][c] : 0;
                    if (roleId > 0 && guidePalette) {
                        const bStyle = guidePalette.beads[roleId];
                        ctx.strokeStyle = bStyle.mid; ctx.globalAlpha = 0.72; ctx.lineWidth = 1.8;
                        ctx.strokeRect(cellX + 3, cellY + 3, m.cellSize - 6, m.cellSize - 6);
                        ctx.fillStyle = bStyle.mid;
                        ctx.beginPath(); ctx.arc(midX, midY, Math.max(2.5, m.cellSize * 0.14), 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1.0;
                    } else {
                        ctx.fillStyle = hideObj.guideDot;
                        ctx.fillRect(Math.floor(midX - 1), Math.floor(midY - 1), 2, 2);
                    }
                }
            }

            ctx.restore();
            return { moccBottomY: outerBotY + 6 };
        }

        // ==========================================
        // UI HELPERS & SCENE RENDERING
        // ==========================================
        function drawPixelText(text, x, y, color, font, align = 'center') {
            ctx.font = font; ctx.textAlign = align;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillText(text, x + 2, y + 2);
            ctx.fillStyle = color; ctx.fillText(text, x, y);
        }

        function drawTopHudBar() {
            const grad = ctx.createLinearGradient(0, 0, 0, HUD_TOP_H);
            grad.addColorStop(0, '#2a160c'); grad.addColorStop(0.6, '#1d0e07'); grad.addColorStop(1, '#120804');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, VIEW_W, HUD_TOP_H);
            ctx.fillStyle = '#784c23'; ctx.fillRect(0, HUD_TOP_H - 3, VIEW_W, 2);
            ctx.fillStyle = '#cfa04e'; ctx.fillRect(0, HUD_TOP_H - 2, VIEW_W, 1);
        }

        function drawBottomHudBar(text) {
            const y = VIEW_H - HUD_BOT_H;
            ctx.fillStyle = '#180c06'; ctx.fillRect(0, y, VIEW_W, HUD_BOT_H);
            ctx.fillStyle = '#8c5c2b'; ctx.fillRect(0, y, VIEW_W, 2);
            if (text) drawPixelText(text, VIEW_W / 2, y + 17, '#d9c29c', 'bold 12px Courier New', 'center');
        }

        function drawModalPanel(cx, cy, w, h) {
            const x = Math.floor(cx - w / 2), y = Math.floor(cy - h / 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.60)'; ctx.fillRect(x + 4, y + 4, w, h);
            ctx.fillStyle = 'rgba(24, 13, 7, 0.94)'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#c9933b'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
            ctx.strokeStyle = '#5c3318'; ctx.lineWidth = 1; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
        }

        function drawGriddedPatternPreview(cx, cy, cellPx, patternObj, paletteObj, hideObj) {
            const totalW = COLS * cellPx, totalH = ROWS * cellPx;
            const ox = Math.floor(cx - totalW / 2), oy = Math.floor(cy - totalH / 2);

            ctx.save();
            ctx.fillStyle = '#120804'; ctx.fillRect(ox - 4, oy - 4, totalW + 8, totalH + 8);
            ctx.strokeStyle = '#9c7132'; ctx.lineWidth = 1.5; ctx.strokeRect(ox - 4, oy - 4, totalW + 8, totalH + 8);

            const isDarkHide = (hideObj.id === 2);
            const gridStroke = isDarkHide ? 'rgba(220, 210, 195, 0.18)' : 'rgba(24, 11, 4, 0.28)';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = ox + c * cellPx, y = oy + r * cellPx;
                    if (!isPlayableCell(r, c)) {
                        ctx.fillStyle = '#170c06'; ctx.fillRect(x, y, cellPx, cellPx);
                        continue;
                    }
                    ctx.fillStyle = hideObj.mid; ctx.fillRect(x, y, cellPx, cellPx);
                    ctx.strokeStyle = gridStroke; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cellPx - 1, cellPx - 1);

                    if (patternObj) {
                        const role = patternObj.grid[r][c];
                        if (role > 0) drawFlatBeadAt(x + cellPx / 2, y + cellPx / 2, Math.max(2.2, cellPx * 0.42), paletteObj.beads[role]);
                    }
                }
            }

            if (!patternObj) drawPixelText("BLANK", cx, cy + 4, isDarkHide ? '#d9c29c' : '#2b1507', 'bold 10px Courier New');
            ctx.restore();
        }

        function drawPixelSquareIrisOut(cx, cy, progress) {
            if (progress >= 0.96) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
                return;
            }

            const maxHalf = Math.max(VIEW_W, VIEW_H) * 0.72;
            const half = snap2(Math.max(0, maxHalf * (1 - progress)));
            const left = snap2(cx - half);
            const right = snap2(cx + half);
            const top = snap2(cy - half);
            const bot = snap2(cy + half);

            ctx.fillStyle = '#000000';
            if (top > 0) ctx.fillRect(0, 0, VIEW_W, top);
            if (bot < VIEW_H) ctx.fillRect(0, bot, VIEW_W, VIEW_H - bot);
            if (left > 0) ctx.fillRect(0, Math.max(0, top), left, Math.max(0, bot - top));
            if (right < VIEW_W) ctx.fillRect(right, Math.max(0, top), VIEW_W - right, Math.max(0, bot - top));

            const ditherW = 12;
            if (half > 4) {
                drawDitherBand(ctx, left, top, right - left, Math.min(ditherW, half), '#000000', 1);
                drawDitherBand(ctx, left, Math.max(top, bot - ditherW), right - left, Math.min(ditherW, half), '#000000', 1);
                drawDitherBand(ctx, left, top, Math.min(ditherW, half), bot - top, '#000000', 1);
                drawDitherBand(ctx, Math.max(left, right - ditherW), top, Math.min(ditherW, half), bot - top, '#000000', 1);
            }
        }

        function drawLanesPostInteractiveProps(now) {
            const target = getClerkInteractionTarget();

            postLayout.shelves.forEach(sh => {
                const selIdx = shelfStockIdx[sh.idx];
                const slotH = Math.floor((sh.h - 6) / 4);
                const sy = sh.y + 4 + selIdx * slotH;

                ctx.strokeStyle = '#ffe169';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(postLayout.shelfX + 1, sy, 10, slotH - 1);

                if (target.zone === 'SHELF' && target.shelf.idx === sh.idx) {
                    ctx.strokeStyle = '#7bed9f';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(postLayout.shelfX - 2, sh.y, postLayout.shelfW + 3, sh.h);
                }
            });

            const bx = postLayout.benchX - 24, by = postLayout.benchY - 14, bw = 54, bh = 28;
            const readyToCraft = (clerk.heldHide !== null && clerk.heldPal !== null && clerk.heldFur !== null && !clerk.craftedMocc);
            if (target.zone === 'WORKBENCH' || readyToCraft) {
                const pulse = Math.floor(now / 220) % 2 === 0;
                ctx.strokeStyle = readyToCraft ? (pulse ? '#7bed9f' : '#ffe169') : '#ffe169';
                ctx.lineWidth = 2;
                ctx.strokeRect(bx - 1, by - 1, bw + 2, bh + 2);
            }

            if (readyToCraft && (target.zone === 'WORKBENCH' || clerk.stitchProgress > 0)) {
                const pipBarW = 52, pipBarH = 14;
                const px0 = postLayout.benchX - Math.floor(pipBarW / 2) + 3;
                const py0 = by - 20;
                ctx.fillStyle = 'rgba(14, 8, 4, 0.92)';
                ctx.fillRect(px0, py0, pipBarW, pipBarH);
                ctx.strokeStyle = '#cfa04e'; ctx.lineWidth = 1;
                ctx.strokeRect(px0, py0, pipBarW, pipBarH);

                for (let i = 0; i < STITCH_SEQ.length; i++) {
                    const stepBtn = STITCH_SEQ[i];
                    const sx = px0 + 3 + i * 7;
                    const done = i < clerk.stitchProgress;
                    const isNext = i === clerk.stitchProgress;
                    ctx.fillStyle = done
                        ? '#7bed9f'
                        : (stepBtn === 'B' ? '#d63333' : '#12AEA2');
                    ctx.globalAlpha = done ? 1.0 : (isNext ? 1.0 : 0.35);
                    ctx.fillRect(sx, py0 + (isNext ? 2 : 4), 5, isNext ? 10 : 7);
                }
                ctx.globalAlpha = 1.0;
            }

            if (target.zone === 'CUSTOMER') {
                const cy = target.customer.y;
                ctx.strokeStyle = '#7bed9f';
                ctx.lineWidth = 2;
                ctx.strokeRect(postLayout.counterX + 1, cy - 13, postLayout.counterW - 2, 26);
            }
        }

        function drawClerkInventoryBar() {
            drawBottomHudBar(null);
            const botY = VIEW_H - HUD_BOT_H;
            const cy = botY + 13;

            if (clerk.craftedMocc) {
                drawMini444MoccasinSprite(
                    VIEW_W / 2 - 44, cy - 2,
                    HIDES[clerk.craftedMocc.hideId],
                    PALETTES[clerk.craftedMocc.palId],
                    FURS[clerk.craftedMocc.furId],
                    false
                );
                draw444IconSet(VIEW_W / 2 + 14, cy, clerk.craftedMocc.hideId, clerk.craftedMocc.palId, clerk.craftedMocc.furId, 1.0);
                return;
            }

            const slotCenters = [VIEW_W / 2 - 48, VIEW_W / 2, VIEW_W / 2 + 48];
            slotCenters.forEach(sx => {
                ctx.fillStyle = '#0f0703';
                ctx.fillRect(sx - 12, cy - 8, 24, 16);
                ctx.strokeStyle = '#5c3b1e';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx - 12, cy - 8, 24, 16);
            });

            if (clerk.heldHide !== null) {
                const h = HIDES[clerk.heldHide];
                ctx.fillStyle = h.mid;   ctx.fillRect(slotCenters[0] - 8, cy - 5, 16, 10);
                ctx.fillStyle = h.light; ctx.fillRect(slotCenters[0] - 6, cy - 4, 10, 4);
            }
            if (clerk.heldPal !== null) {
                const p = PALETTES[clerk.heldPal];
                drawFlatBeadAt(slotCenters[1] - 4, cy - 2, 3.4, p.beads[1]);
                drawFlatBeadAt(slotCenters[1] + 4, cy - 2, 3.4, p.beads[3]);
                drawFlatBeadAt(slotCenters[1],     cy + 3, 3.4, p.beads[5]);
            }
            if (clerk.heldFur !== null) {
                const f = FURS[clerk.heldFur];
                ctx.fillStyle = f.dark; ctx.fillRect(slotCenters[2] - 7, cy - 5, 14, 10);
                ctx.fillStyle = f.base; ctx.fillRect(slotCenters[2] - 6, cy - 6, 12, 9);
                ctx.fillStyle = f.hi;   ctx.fillRect(slotCenters[2] - 4, cy - 4, 6, 4);
            }
        }

        function drawScene(now) {
            const midY = Math.floor((VIEW_H - HUD_BOT_H) / 2);

            // 1. TITLE SCREEN & LANE'S POST 2-SCREEN TYPEWRITER BRIEFING OVER TITLE BACKDROP
            if (gameState === 'MODE_SELECT' || gameState === 'POST_INTRO') {
                ctx.drawImage(titleBgCanvas, 0, 0);
                drawAnimatedTitleEffects(now);

                const titleAlpha = (gameState === 'MODE_SELECT') ? 1.0 : postIntroTitleAlpha;
                if (titleAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = titleAlpha;
                    drawPixelText("li rassad di fleur", VIEW_W / 2, 62, '#fff2cc', 'bold 26px Courier New');

                    const boxW = Math.min(168, Math.floor((VIEW_W - 44) / 2));
                    const boxH = 74, gap = 14, totalW = boxW * 2 + gap;
                    const leftX = Math.floor((VIEW_W - totalW) / 2);
                    const boxY = Math.floor(VIEW_H - HUD_BOT_H - boxH - 36);

                    [
                        { title: "LANE'S POST", sub: "HBC CLERK RUSH", idx: 0 },
                        { title: "THE TIPI",    sub: "FREEFORM BEADWORK", idx: 1 }
                    ].forEach((ch, i) => {
                        const bx = leftX + i * (boxW + gap);
                        const sel = (menuSelection === ch.idx);
                        ctx.fillStyle = 'rgba(18, 10, 5, 0.86)'; ctx.fillRect(bx, boxY, boxW, boxH);
                        ctx.strokeStyle = sel ? '#ffe169' : '#8c6232'; ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeRect(bx, boxY, boxW, boxH);
                        drawPixelText(sel ? `> ${ch.title} <` : ch.title, bx + boxW / 2, boxY + 32, sel ? '#ffe169' : '#c7b8a1', 'bold 14px Courier New');
                        drawPixelText(ch.sub, bx + boxW / 2, boxY + 54, sel ? '#f6e7c8' : '#8c7a66', 'bold 10px Courier New');
                    });
                    ctx.restore();
                }

                // Large Screen-Sized Transparent White Text Box for Lane's Post Intro (1/2 & 2/2)
                if (gameState === 'POST_INTRO' && postIntroBoxAlpha > 0.01) {
                    const pad = 16;
                    const bx = pad;
                    const by = 18;
                    const bw = VIEW_W - pad * 2;
                    const bh = VIEW_H - HUD_BOT_H - 34;

                    ctx.save();
                    ctx.globalAlpha = postIntroBoxAlpha;
                    // Transparent white parchment-glass backdrop so the Title Card scene faintly shows through
                    ctx.fillStyle = 'rgba(252, 248, 240, 0.84)';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.strokeStyle = '#3b2412';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(bx, by, bw, bh);
                    ctx.strokeStyle = '#9c6838';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(bx + 4, by + 4, bw - 8, bh - 8);

                    if (postIntroPhase !== 'FADE_TITLE' && postIntroTextAlpha > 0.01) {
                        ctx.globalAlpha = postIntroBoxAlpha * postIntroTextAlpha;
                        const fullText = POST_INTRO_PAGES[postIntroPage];
                        const shownText = fullText.slice(0, Math.floor(postIntroChars));
                        const font = 'bold 14px Courier New';
                        const lines = wrapCanvasLines(shownText, bw - 36, font);

                        ctx.font = font;
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#1c1008';
                        const lineH = 22;
                        const startY = by + 46;
                        lines.forEach((ln, idx) => {
                            ctx.fillText(ln, bx + 18, startY + idx * lineH);
                        });

                        // Blinking (A) prompt once typewriter finishes the screen
                        if (Math.floor(postIntroChars) >= fullText.length) {
                            const blinkOn = Math.floor(now / 360) % 2 === 0;
                            if (blinkOn) {
                                ctx.textAlign = 'right';
                                ctx.font = 'bold 15px Courier New';
                                ctx.fillStyle = '#8B1E24';
                                const promptLabel = postIntroPage === 0 ? '(A)' : '(A) TO START';
                                ctx.fillText(promptLabel, bx + bw - 18, by + bh - 18);
                            }
                        }
                    }
                    ctx.restore();
                }

                drawBottomHudBar(null);
                drawPauseOverlay();
                return;
            }

            // 2. LANE'S POST SPATIAL CLERK RUSH
            if (gameState === 'ORDER_PLAYING' || gameState === 'ORDER_GAMEOVER') {
                ctx.drawImage(postBgCanvas, 0, 0);
                drawLanesPostInteractiveProps(now);
                drawLanesPostAmbientLife(now);

                const renderQueue = postCustomers.map(c => ({ y: c.y, fn: () => drawPostCustomerSprite(c, now) }));
                renderQueue.push({ y: clerk.y, fn: () => drawClerkSprite(now) });
                renderQueue.sort((a, b) => a.y - b.y);
                renderQueue.forEach(item => item.fn());

                drawTopHudBar();
                drawPixelText(`${orderScore}`, 14, 28, '#ffe49e', 'bold 17px Courier New', 'left');

                const qCount = getQueuedCustomerCount();
                if (orderCombo > 1) {
                    drawPixelText(`x${orderCombo}`, VIEW_W / 2 - 28, 28, '#7bed9f', 'bold 14px Courier New', 'center');
                }
                for (let qi = 0; qi < MAX_WAIT_QUEUE; qi++) {
                    const qx = Math.floor(VIEW_W / 2 + (orderCombo > 1 ? 4 : -22) + qi * 11);
                    ctx.fillStyle = qi < qCount ? (qCount >= 3 ? '#ff5252' : '#ffe169') : '#382214';
                    ctx.fillRect(qx, 19, 7, 7);
                    ctx.strokeStyle = '#8c5c2b'; ctx.lineWidth = 1; ctx.strokeRect(qx, 19, 7, 7);
                }

                const livesLeft = Math.max(0, MAX_STRIKES - orderStrikes);
                drawPixelText(`${'♥'.repeat(livesLeft)}${'·'.repeat(orderStrikes)}`, VIEW_W - 14, 28, livesLeft <= 1 ? '#ff5252' : '#ff6b6b', 'bold 16px Courier New', 'right');

                if (feedbackTimerMs > 0) {
                    const fbX = Math.max(106, Math.min(VIEW_W - 106, clerk.x - 16));
                    drawPixelText(feedbackMsg, fbX, Math.max(HUD_TOP_H + 18, clerk.y - 60), feedbackColor, 'bold 12px Courier New');
                }

                drawClerkInventoryBar();

                if (gameState === 'ORDER_GAMEOVER') {
                    drawModalPanel(VIEW_W / 2, midY, Math.min(310, VIEW_W - 28), 166);
                    drawPixelText(postGameOverReason, VIEW_W / 2, midY - 40, '#ffe169', 'bold 21px Courier New');
                    drawPixelText(`SCORE: ${orderScore}`, VIEW_W / 2, midY + 6, '#F2EFE9', 'bold 17px Courier New');
                    drawPixelText(`SERVED: ${orderServedCount}`, VIEW_W / 2, midY + 38, '#7BAFD4', 'bold 15px Courier New');
                }

                drawPauseOverlay();
                return;
            }

            // 3. ZOOMED-IN PANNABLE CONICAL TIPI SCENES
            ctx.save();
            ctx.translate(-Math.floor(tipiCamX), 0);
            ctx.drawImage(tipiBgCanvas, 0, 0);
            drawAnimatedTipiDoorwayShimmer(now);

            const chosenHide = HIDES[selectedHideId];
            const chosenPal = PALETTES[selectedPaletteId];
            const chosenFur = FURS[selectedTipiFurId];

            if (gameState === 'TIPI_INTRO_CUTSCENE') {
                const doorEntryX = tipiLayout.doorX + tipiLayout.doorW * 0.50;
                const doorEntryY = tipiLayout.doorY + tipiLayout.doorH + 2;
                const standX = doorEntryX + 26, standY = doorEntryY + 10;
                const stashEndX = tipiLayout.stashX - 18, stashEndY = tipiLayout.stashY + 14;

                if (cutsceneElapsedMs < 700) {
                    const t = stepProgress(cutsceneElapsedMs / 700, 6);
                    drawMotherSprite(doorEntryX + (standX - doorEntryX) * t, doorEntryY + (standY - doorEntryY) * t, 'duck', now);
                } else if (cutsceneElapsedMs < 2100) {
                    const t = stepProgress((cutsceneElapsedMs - 700) / 1400, 12);
                    drawMotherSprite(standX + (stashEndX - standX) * t, standY + (stashEndY - standY) * t, 'walk', now);
                } else {
                    drawMotherSprite(stashEndX, stashEndY, 'kneel', now);
                    ctx.fillStyle = '#ffe57f'; ctx.fillRect(tipiLayout.stashX + 14, tipiLayout.stashY - 11, 4, 4);
                }

                drawCentralEmberHearth(now);
                ctx.restore();

                drawBottomHudBar(null);
                drawPauseOverlay();
                return;
            }

            if (gameState === 'PREP_SELECT') {
                drawMotherSprite(tipiLayout.stashX - 18, tipiLayout.stashY + 14, 'kneel', now);
                drawCentralEmberHearth(now);
                ctx.restore();

                const boxW = Math.min(344, VIEW_W - 22), boxH = 352;
                drawModalPanel(VIEW_W / 2, midY, boxW, boxH);

                const topY = Math.floor(midY - boxH / 2);

                drawPixelText(`< ${chosenHide.name} >`, VIEW_W / 2, topY + 28, prepRow === 0 ? '#ffe169' : '#c7b8a1', 'bold 15px Courier New');
                ctx.fillStyle = chosenHide.mid; ctx.fillRect(VIEW_W / 2 - 26, topY + 35, 52, 10);
                ctx.strokeStyle = '#f6e7c8'; ctx.lineWidth = 1; ctx.strokeRect(VIEW_W / 2 - 26, topY + 35, 52, 10);

                drawPixelText(`< ${chosenPal.name} >`, VIEW_W / 2, topY + 72, prepRow === 1 ? '#ffe169' : '#c7b8a1', 'bold 15px Courier New');
                for (let i = 1; i <= 7; i++) drawFlatBeadAt(VIEW_W / 2 - 66 + (i - 1) * 22, topY + 90, 6.5, chosenPal.beads[i]);

                drawPixelText(`< ${chosenFur.name} >`, VIEW_W / 2, topY + 124, prepRow === 2 ? '#ffe169' : '#c7b8a1', 'bold 15px Courier New');
                drawFluffyFurTrim(VIEW_W / 2 - 28, topY + 131, 56, 8, chosenFur, false);

                const selPat = selectedTipiTemplate >= 0 ? PATTERNS[selectedTipiTemplate] : null;
                const tplLabel = selPat ? selPat.name : 'Blank';
                drawPixelText(`< ${tplLabel} >`, VIEW_W / 2, topY + 170, prepRow === 3 ? '#ffe169' : '#c7b8a1', 'bold 15px Courier New');
                drawGriddedPatternPreview(VIEW_W / 2, topY + 226, 9, selPat, chosenPal, chosenHide);

                drawPixelText(prepRow === 4 ? "> SIT BY THE EMBERS <" : "  SIT BY THE EMBERS  ", VIEW_W / 2, topY + 318, prepRow === 4 ? '#7bed9f' : '#8c7a66', 'bold 16px Courier New');

                drawBottomHudBar(null);
                drawPauseOverlay();
                return;
            }

            if (gameState === 'TIPI_SIT_CUTSCENE') {
                const startX = tipiLayout.stashX - 18, startY = tipiLayout.stashY + 14;
                const sitX = tipiLayout.robeSitX, sitY = tipiLayout.robeSitY + 8;

                drawCentralEmberHearth(now);

                if (cutsceneElapsedMs < 1450) {
                    const t = stepProgress(cutsceneElapsedMs / 1450, 12);
                    drawMotherSprite(startX + (sitX - startX) * t, startY + (sitY - startY) * t, 'carry', now, chosenHide);
                } else {
                    drawMotherSprite(sitX, sitY, 'sit_rustle', now, chosenHide);
                }
                ctx.restore();

                if (cutsceneElapsedMs > 2150) {
                    const fade = stepProgress((cutsceneElapsedMs - 2150) / 550, 6);
                    ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
                    ctx.fillRect(0, 0, VIEW_W, VIEW_H - HUD_BOT_H);
                }

                drawBottomHudBar(null);
                drawPauseOverlay();
                return;
            }

            if (gameState === 'TIPI_OUTRO_CUTSCENE') {
                const sitX = tipiLayout.robeSitX, sitY = tipiLayout.robeSitY + 8;
                const husX = tipiLayout.husbandX, husY = tipiLayout.husbandY + 8;

                drawCentralEmberHearth(now);

                if (cutsceneElapsedMs < 2400) {
                    drawMotherSprite(sitX, sitY, 'sit_rustle_fast', now, chosenHide);
                    drawHusbandSprite(husX, husY, 'sit', now, false, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 3600) {
                    const t = stepProgress((cutsceneElapsedMs - 2400) / 1200, 10);
                    drawMotherSprite(sitX + (husX - 30 - sitX) * t, sitY + (husY - sitY) * t, 'carry_mocc', now, chosenHide, chosenPal, chosenFur);
                    drawHusbandSprite(husX, husY, 'sit', now, false, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 4300) {
                    drawMotherSprite(husX - 30, husY, 'place_mocc', now, chosenHide, chosenPal, chosenFur);
                    drawHusbandSprite(husX, husY, 'sit', now, true, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 6100) {
                    const jigPhase = (cutsceneElapsedMs - 4300) / 900;
                    drawMotherSprite(husX - 36, husY, 'walk', 0);
                    drawHusbandSprite(husX, husY, 'jig', now, true, chosenHide, chosenPal, chosenFur, jigPhase);
                } else {
                    drawMotherSprite(husX - 32, husY, 'blush', now);
                    drawHusbandSprite(husX - 10, husY, 'kiss', now, true, chosenHide, chosenPal, chosenFur);
                }

                ctx.restore();

                drawBottomHudBar(null);

                if (cutsceneElapsedMs > 6800) {
                    const irisP = stepProgress((cutsceneElapsedMs - 6800) / 2000, 16);
                    const irisScreenX = (husX - 24) - Math.floor(tipiCamX);
                    const irisScreenY = husY - 46;
                    drawPixelSquareIrisOut(irisScreenX, irisScreenY, irisP);
                }

                drawPauseOverlay();
                return;
            }

            // 4. FREEFORM BEADING WORKBENCH (THE TIPI)
            if (gameState === 'BEADING') {
                drawCentralEmberHearth(now);
                ctx.restore();

                const m = getGridMetrics();
                const guideGrid = (showChalkGuide && selectedTipiTemplate >= 0) ? PATTERNS[selectedTipiTemplate].grid : null;

                const { moccBottomY } = drawMoccasin(m, chosenHide, guideGrid, chosenPal, chosenFur);

                ctx.save();
                ctx.translate(m.offsetX, m.offsetY);
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (!isPlayableCell(r, c) || board[r][c] === 0) continue;
                        drawSewnBeadAt(c * m.cellSize + m.cellSize / 2, r * m.cellSize + m.cellSize / 2, m.cellSize, chosenPal.beads[board[r][c]], true);
                    }
                }

                if (!actionBarFocus) {
                    if (cursor.color > 0) {
                        drawSewnBeadAt(cursor.x * m.cellSize + m.cellSize / 2, cursor.y * m.cellSize + m.cellSize / 2, m.cellSize, chosenPal.beads[cursor.color], false, 0.62);
                    }
                    const blink = Math.floor(now / 260) % 2 === 0;
                    ctx.strokeStyle = blink ? '#ffe49e' : '#3a1f0b'; ctx.lineWidth = 2;
                    ctx.strokeRect(cursor.x * m.cellSize + 1, cursor.y * m.cellSize + 1, m.cellSize - 2, m.cellSize - 2);
                }
                ctx.restore();

                const barY = Math.min(VIEW_H - HUD_BOT_H - 12, moccBottomY + 14);
                const leftLabel = selectedTipiTemplate >= 0 ? (showChalkGuide ? 'Guide: ON' : 'Guide: OFF') : 'Clear';
                const rightLabel = 'Stitch';

                drawPixelText(
                    (actionBarFocus && actionBarIdx === 0) ? `[ ${leftLabel} ]` : leftLabel,
                    VIEW_W / 2 - 76, barY,
                    (actionBarFocus && actionBarIdx === 0) ? '#ffe169' : '#a3907a',
                    'bold 13px Courier New'
                );
                drawPixelText(
                    (actionBarFocus && actionBarIdx === 1) ? `[ ${rightLabel} ]` : rightLabel,
                    VIEW_W / 2 + 76, barY,
                    (actionBarFocus && actionBarIdx === 1) ? '#7bed9f' : '#a3907a',
                    'bold 13px Courier New'
                );

                drawBottomHudBar(null);
                const botY = VIEW_H - HUD_BOT_H;
                if (cursor.color === 0) {
                    drawPixelText("ERASER", VIEW_W / 2, botY + 17, '#ff6b6b', 'bold 12px Courier New');
                } else {
                    const bSt = chosenPal.beads[cursor.color];
                    drawFlatBeadAt(VIEW_W / 2 - 96, botY + 13, 6.5, bSt);
                    drawPixelText(bSt.name, VIEW_W / 2 + 8, botY + 17, bSt.hi, 'bold 12px Courier New');
                }

                if (beadingFadeAlpha > 0) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${beadingFadeAlpha})`;
                    ctx.fillRect(0, 0, VIEW_W, VIEW_H - HUD_BOT_H);
                }
            }

            drawPauseOverlay();
        }

        function drawPauseOverlay() {
            if (!isPaused) return;
            ctx.fillStyle = 'rgba(10, 6, 4, 0.78)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            drawPixelText("PAUSED", VIEW_W / 2, VIEW_H / 2, '#D99B26', 'bold 28px Courier New');
        }

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const dtMs = Math.min(100, timestamp - lastFrameTime);
            lastFrameTime = timestamp;

            if (!isPaused) {
                if (gameState === 'POST_INTRO') updatePostIntro(dtMs);
                else if (gameState === 'ORDER_PLAYING') updateOrderRush(dtMs);
                else updateTipiCutscenes(dtMs);
            }

            drawScene(timestamp);
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // === TEMPORARY DEV KEYBOARD MAP (REMOVE BEFORE CABINET DEPLOY) ===
        // Mapping: Arrow Keys = D-Pad | Z = Button B | X = Button A | Escape = Start / Pause
        window.addEventListener('keydown', function(e) {
            const k = e.key.toLowerCase();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z', 'x', 'escape'].includes(k)) {
                e.preventDefault();
            }

            if (e.key === 'Escape') {
                if (e.repeat) return;
                if (gameState === 'BEADING' || gameState === 'ORDER_PLAYING') {
                    handleCommand(isPaused ? 'RESUME' : 'PAUSE');
                } else {
                    handleCommand('BUTTON_A');
                }
                return;
            }

            if (isPaused) return;

            if (e.key === 'ArrowUp')    { keysHeld.up = true;    if (gameState !== 'ORDER_PLAYING') handleCommand('DPAD_UP'); }
            if (e.key === 'ArrowDown')  { keysHeld.down = true;  if (gameState !== 'ORDER_PLAYING') handleCommand('DPAD_DOWN'); }
            if (e.key === 'ArrowLeft')  { keysHeld.left = true;  if (gameState !== 'ORDER_PLAYING') handleCommand('DPAD_LEFT'); }
            if (e.key === 'ArrowRight') { keysHeld.right = true; if (gameState !== 'ORDER_PLAYING') handleCommand('DPAD_RIGHT'); }

            if (k === 'x' && !e.repeat) handleCommand('BUTTON_A');
            if (k === 'z' && !e.repeat) handleCommand('BUTTON_B');
        });

        window.addEventListener('keyup', function(e) {
            if (e.key === 'ArrowUp')    keysHeld.up = false;
            if (e.key === 'ArrowDown')  keysHeld.down = false;
            if (e.key === 'ArrowLeft')  keysHeld.left = false;
            if (e.key === 'ArrowRight') keysHeld.right = false;
        });
        // === END TEMPORARY DEV KEYBOARD MAP ===
    </script>
</body>
</html>
