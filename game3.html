        // ==========================================
        // 9x9 ROUNDED MOCCASIN MASK (THE TIPI)
        // ==========================================
        function getRowColBounds(r) {
            if (r === ROWS - 1) return { minC: 2, maxC: 6 };
            if (r === ROWS - 2) return { minC: 1, maxC: 7 };
            return { minC: 0, maxC: COLS - 1 };
        }

        function isPlayableCell(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
            const { minC, maxC } = getRowColBounds(r);
            return c >= minC && c <= maxC;
        }

        // ==========================================
        // VIEWPORT SCALING & THREE 16/32-BIT BACKDROPS
        // ==========================================
        function resizeViewport() {
            const w = window.innerWidth || 400;
            const h = window.innerHeight || 533;
            const aspect = w / h;

            if (aspect < 400 / 533) {
                VIEW_W = 400;
                VIEW_H = Math.round(400 / aspect);
            } else {
                VIEW_H = 533;
                VIEW_W = Math.round(533 * aspect);
            }

            TIPI_WORLD_W = Math.floor(VIEW_W * 1.48);

            canvas.width = VIEW_W;
            canvas.height = VIEW_H;
            ctx.imageSmoothingEnabled = false;

            titleBgCanvas.width = VIEW_W; titleBgCanvas.height = VIEW_H;
            titleBgCtx.imageSmoothingEnabled = false;

            tipiBgCanvas.width = TIPI_WORLD_W; tipiBgCanvas.height = VIEW_H;
            tipiBgCtx.imageSmoothingEnabled = false;

            postBgCanvas.width = VIEW_W; postBgCanvas.height = VIEW_H;
            postBgCtx.imageSmoothingEnabled = false;

            renderStaticLanesPostTitleBackdrop();
            renderStaticTipiBackdrop();
            renderStaticLanesPostBackdrop();
        }

        function getGridMetrics() {
            const padX = VIEW_W > 540 ? 150 : 48;
            const topMoccPad = 76;
            const botMoccPad = 72;
            const availW = VIEW_W - padX * 2;
            const availH = VIEW_H - HUD_BOT_H - topMoccPad - botMoccPad;
            const cellSize = Math.max(18, Math.min(32, Math.floor(Math.min(availW / COLS, availH / ROWS))));
            const gridW = cellSize * COLS;
            const gridH = cellSize * ROWS;
            const offsetX = Math.floor((VIEW_W - gridW) / 2);
            const offsetY = topMoccPad + Math.floor((availH - gridH) / 2);
            return { cellSize, gridW, gridH, offsetX, offsetY };
        }

        function drawDitherBand(c, x, y, w, h, color, density = 2) {
            c.fillStyle = color;
            const step = density === 1 ? 2 : (density === 2 ? 4 : 6);
            for (let py = y; py < y + h; py += 2) {
                const rowShift = ((py >> 1) & 1) * (step >> 1);
                for (let px = x + rowShift; px < x + w; px += step) {
                    c.fillRect(px, py, 2, 2);
                }
            }
        }

        function drawPixelCampTipi(c, cx, baseY, w, h) {
            const halfW = Math.floor(w / 2);
            c.fillStyle = 'rgba(26, 20, 12, 0.45)';
            c.fillRect(cx - halfW - 2, baseY - 2, w + 8, 5);

            c.fillStyle = '#4a321d';
            c.fillRect(cx - 5, baseY - h - 10, 2, 12);
            c.fillRect(cx + 3, baseY - h - 10, 2, 12);
            c.fillRect(cx - 1, baseY - h - 12, 2, 14);

            for (let row = 0; row < h; row += 2) {
                const frac = row / h;
                const rw = Math.max(4, Math.floor(frac * w));
                const lx = cx - Math.floor(rw / 2);
                const py = baseY - h + row;
                const lightCol = frac < 0.22 ? '#6e5239' : (frac > 0.80 ? '#a67d4e' : '#dfd0b4');
                const midCol   = frac < 0.22 ? '#543c28' : (frac > 0.80 ? '#876138' : '#c2af8e');
                const darkCol  = frac < 0.22 ? '#3b291a' : (frac > 0.80 ? '#634424' : '#8f7958');

                const split1 = Math.floor(rw * 0.45);
                const split2 = Math.floor(rw * 0.78);
                c.fillStyle = lightCol; c.fillRect(lx, py, split1, 2);
                c.fillStyle = midCol;   c.fillRect(lx + split1, py, split2 - split1, 2);
                c.fillStyle = darkCol;  c.fillRect(lx + split2, py, rw - split2, 2);
            }
            const bandY = baseY - Math.floor(h * 0.22);
            const bandW = Math.floor(w * 0.78);
            c.fillStyle = '#8f2424';
            c.fillRect(cx - Math.floor(bandW / 2), bandY, bandW, 3);

        function drawFlushPixelHideDoorway(c, x, y, w, h) {
            const cx = Math.floor(x + w / 2);
            const steps = [
                { dy: 0,  inset: 14 }, { dy: 4,  inset: 10 },
                { dy: 8,  inset: 7  }, { dy: 14, inset: 4  },
                { dy: 22, inset: 2  }, { dy: 34, inset: 1  },
                { dy: 46, inset: 2  }
            ];

            for (let i = 0; i < steps.length; i++) {
                const s = steps[i];
                const nextY = (i + 1 < steps.length) ? steps[i + 1].dy : h;
                const rowH = nextY - s.dy;
                const rx = x + s.inset;
                const rw = w - s.inset * 2;

                c.fillStyle = '#241106';
                c.fillRect(rx - 2, y + s.dy - 2, rw + 4, rowH + 2);

                const frac = s.dy / h;
                c.fillStyle = frac < 0.30 ? '#4d6580'

                    : frac < 0.88 ? '#487699'

                c.fillRect(rx, y + s.dy, rw, rowH);
            }

            c.fillStyle = '#5c351a';
            c.fillRect(x - 1, y + 18, 4, h - 22);
            c.fillRect(x + w - 3, y + 18, 4, h - 22);
            c.fillStyle = '#7d4c27';
            c.fillRect(x, y + 20, 2, h - 26);
            c.fillRect(x + w - 2, y + 20, 2, h - 26);

        function drawCentralEmberHearth(now) {
            const { fireX, fireY } = tipiLayout;

            fireGlow.addColorStop(0.0, `rgba(255, 118, 28, ${0.42 * pulse})`);
            fireGlow.addColorStop(0.32, `rgba(214, 72, 16, ${0.22 * pulse})`);

            for (let i = -12; i <= 12; i += 4) {
