        // ==========================================
        // 9x9 ROUNDED MOCCASIN MASK (FLIPPED: SQUARED CUFF TOP, ROUNDED TOE BOTTOM)
        // ==========================================
        function getRowColBounds(r) {
            if (r === ROWS - 1) return { minC: 2, maxC: 6 };
            if (r === ROWS - 2) return { minC: 1, maxC: 7 };
            return { minC: 0, maxC: COLS - 1 };
        }

        function isPlayableCell(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
            const { minC, maxC } = getRowColBounds(r);
            return c >= minC && c <= maxC;
        }

        // ==========================================

        // ==========================================
        function resizeViewport() {
            const w = window.innerWidth || 400;
            const h = window.innerHeight || 533;
            const aspect = w / h;

            if (aspect < 400 / 533) {
                VIEW_W = 400;
                VIEW_H = Math.round(400 / aspect);
            } else {
                VIEW_H = 533;
                VIEW_W = Math.round(533 * aspect);
            }

            TIPI_WORLD_W = Math.floor(VIEW_W * 1.48);

            canvas.width = VIEW_W;
            canvas.height = VIEW_H;
            ctx.imageSmoothingEnabled = false;

            titleBgCanvas.width = VIEW_W; titleBgCanvas.height = VIEW_H;
            titleBgCtx.imageSmoothingEnabled = false;

            tipiBgCanvas.width = TIPI_WORLD_W; tipiBgCanvas.height = VIEW_H;
            tipiBgCtx.imageSmoothingEnabled = false;

            postBgCanvas.width = VIEW_W; postBgCanvas.height = VIEW_H;
            postBgCtx.imageSmoothingEnabled = false;

            renderStaticAssiniboineBendBackdrop();
            renderStaticTipiBackdrop();
            renderStaticLanesPostBackdrop();
        }

        function initChiptuneAudio() {
            if (!chiptuneAudioCtx) chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (chiptuneAudioCtx.state === 'suspended' && !isPaused) chiptuneAudioCtx.resume();
        }

        function playTone(freq, type, duration, volume) {
            if (!freq || !chiptuneAudioCtx || isPaused) return;
            const osc = chiptuneAudioCtx.createOscillator();
            const gainNode = chiptuneAudioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, chiptuneAudioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, chiptuneAudioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, chiptuneAudioCtx.currentTime + duration - 0.015);
            osc.connect(gainNode); gainNode.connect(chiptuneAudioCtx.destination);
            osc.start(); osc.stop(chiptuneAudioCtx.currentTime + duration);
        }

        function playSfx(kind) {
            initChiptuneAudio();
            if (!chiptuneAudioCtx || isPaused) return;
            if (kind === 'serve') {
                playTone(587.33, 'triangle', 0.10, 0.14);
                setTimeout(() => playTone(880.00, 'triangle', 0.16, 0.14), 75);
            } else if (kind === 'miss') {
                playTone(155.00, 'sawtooth', 0.18, 0.10);
            } else if (kind === 'click') {
                playTone(440.00, 'square', 0.04, 0.03);
            }
        }

        function sequenceTrack() {
            if (isPaused) return;
            const leadNote = matriarchFiddle[currentStep], bassNote = celloDrone[currentStep];
            if (leadNote && NOTES[leadNote]) playTone(NOTES[leadNote], 'square', noteLength * 1.2, 0.02);
            if (bassNote && NOTES[bassNote]) playTone(NOTES[bassNote], 'sine', noteLength * 3.8, 0.15);
            currentStep = (currentStep + 1) % 32;
        }

        function startChiptuneTrack() {
            initChiptuneAudio();
            if (!chiptuneIsPlaying) {
                chiptuneIsPlaying = true;
                currentStep = 0;
                chiptuneInterval = setInterval(sequenceTrack, noteLength * 1000);
            }
        }

        function stopChiptuneTrack() {
            if (chiptuneIsPlaying) {
                clearInterval(chiptuneInterval);
                chiptuneIsPlaying = false;
                currentStep = 0;
            }
        }

            activeOrders.push({

                name: POST_VISITORS[Math.floor(Math.random() * POST_VISITORS.length)],
                hideId: Math.floor(Math.random() * HIDES.length),
                palId: Math.floor(Math.random() * PALETTES.length),
                furId: Math.floor(Math.random() * FURS.length),
                patience: basePatience,

            });

        function startOrderRush() {
            activeOrders = [];
            orderScore = 0; orderCombo = 0; orderServedCount = 0; orderStrikes = 0;
            orderSpawnTimerMs = 3500;
            craftHideId = 0; craftPalId = 0; craftFurId = 0; craftRow = 0;

        function serveCurrentMoccasin() {
            let bestIdx = -1, lowestPatience = Infinity;
            for (let i = 0; i < activeOrders.length; i++) {
                const o = activeOrders[i];
                if (o.hideId === craftHideId && o.palId === craftPalId && o.furId === craftFurId) {
                    if (o.patience < lowestPatience) { lowestPatience = o.patience; bestIdx = i; }
                }
            }

            if (bestIdx >= 0) {
                const served = activeOrders.splice(bestIdx, 1)[0];
                orderServedCount++; orderCombo++;
                const speedBonus = Math.round((served.patience / served.maxPatience) * 50);
                const pts = (100 + speedBonus) * Math.min(5, orderCombo);
                orderScore += pts;
                feedbackMsg = `SERVED ${served.name.toUpperCase()}! +${pts}`;
                feedbackColor = '#7bed9f'; feedbackTimerMs = 1100;
                playSfx('serve');

                if (activeOrders.length === 0) {
                    spawnVisitorOrder();
                    orderSpawnTimerMs = Math.max(2200, 5000 - orderServedCount * 140);
                }
            } else {
                orderCombo = 0;
                feedbackMsg = 'NO MATCHING ORDER!';
                feedbackColor = '#ff6b6b'; feedbackTimerMs = 900;
                playSfx('miss');
            }
        }

        function updateOrderRush(dtMs) {
            if (feedbackTimerMs > 0) feedbackTimerMs -= dtMs;
            for (let i = activeOrders.length - 1; i >= 0; i--) {
                activeOrders[i].patience -= dtMs;
                if (activeOrders[i].patience <= 0) {
                    const leftName = activeOrders[i].name;
                    activeOrders.splice(i, 1);
                    orderStrikes++; orderCombo = 0;
                    feedbackMsg = `${leftName.toUpperCase()} WALKED OUT!`;
                    feedbackColor = '#ff6b6b'; feedbackTimerMs = 1200;
                    playSfx('miss');
                    if (orderStrikes >= MAX_STRIKES) {
                        stopChiptuneTrack();
                        gameState = 'ORDER_GAMEOVER';
                        return;
                    }
                }
            }
            if (activeOrders.length === 0) {
                spawnVisitorOrder();
                orderSpawnTimerMs = Math.max(2500, 5500 - orderServedCount * 150);
            } else if (activeOrders.length < MAX_ACTIVE_ORDERS) {
                orderSpawnTimerMs -= dtMs;
                if (orderSpawnTimerMs <= 0) {
                    spawnVisitorOrder();
                    orderSpawnTimerMs = Math.max(2500, 6200 - orderServedCount * 160);
                }
            }
        }

        // ==========================================
        // TIPI STUDIO CUTSCENES (UNSKIPPABLE, STEPPED SNES TIMING)
        // ==========================================
        function startTipiIntroCutscene() {
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            startChiptuneTrack();
            gameState = 'TIPI_INTRO_CUTSCENE';
        }

        function startTipiSitCutscene() {
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            gameState = 'TIPI_SIT_CUTSCENE';
        }

        function startStudioSession() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            cursor = { x: 4, y: 4, color: 1 };
            actionBarFocus = false;
            actionBarIdx = 1;
            showChalkGuide = (selectedStudioTemplate >= 0);
            beadingFadeAlpha = 1.0;
            gameState = 'BEADING';
        }

        function startTipiOutroCutscene() {
            actionBarFocus = false;
            tipiCamX = 0;
            cutsceneElapsedMs = 0;
            playSfx('serve');
            gameState = 'TIPI_OUTRO_CUTSCENE';
        }

        function updateTipiCutscenes(dtMs) {
            if (gameState === 'TIPI_INTRO_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                if (cutsceneElapsedMs >= 2800) {
                    prepRow = 0;
                    gameState = 'PREP_SELECT';
                }
            } else if (gameState === 'TIPI_SIT_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                if (cutsceneElapsedMs >= 2700) {
                    startStudioSession();
                }
            } else if (gameState === 'BEADING' && beadingFadeAlpha > 0) {
                beadingFadeAlpha = Math.max(0, beadingFadeAlpha - dtMs / 450);
            } else if (gameState === 'TIPI_OUTRO_CUTSCENE') {
                cutsceneElapsedMs += dtMs;
                const maxCam = Math.max(0, TIPI_WORLD_W - VIEW_W);

                if (cutsceneElapsedMs < 2400) {
                    const t = stepProgress((cutsceneElapsedMs - 500) / 1800, 16);
                    tipiCamX = snap2(t * maxCam);
                } else if (cutsceneElapsedMs < 7200) {
                    tipiCamX = snap2(maxCam);
                } else {
                    const t = stepProgress((cutsceneElapsedMs - 7200) / 1800, 16);
                    tipiCamX = snap2(maxCam * (1 - t));
                }

                if (cutsceneElapsedMs >= 9600) {
                    stopChiptuneTrack();
                    tipiCamX = 0;
                    gameState = 'MODE_SELECT';
                }
            }
        }

        // ==========================================
        // DIRECT POSTMESSAGE SIGNAL BRIDGE
        // ==========================================
        function handleCommand(cmd) {
            if (cmd === 'PAUSE') {
                isPaused = true;
                if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'running') chiptuneAudioCtx.suspend();
                return;
            }
            if (cmd === 'RESUME') {
                isPaused = false;
                lastFrameTime = performance.now();
                if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'suspended') chiptuneAudioCtx.resume();
                return;
            }
            if (isPaused) return;

            // Cutscenes are unskippable
            if (gameState === 'TIPI_INTRO_CUTSCENE' || gameState === 'TIPI_SIT_CUTSCENE' || gameState === 'TIPI_OUTRO_CUTSCENE') {
                return;
            }

            if (gameState === 'MODE_SELECT') {
                if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_RIGHT' || cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN') {
                    menuSelection = menuSelection === 0 ? 1 : 0;
                    playSfx('click');
                }
                if (cmd === 'BUTTON_A') {
                    if (menuSelection === 0) startOrderRush();
                    else startTipiIntroCutscene();
                }
                return;
            }

            if (gameState === 'ORDER_PLAYING') {
                if (cmd === 'DPAD_UP') { craftRow = (craftRow + 2) % 3; playSfx('click'); }
                else if (cmd === 'DPAD_DOWN') { craftRow = (craftRow + 1) % 3; playSfx('click'); }
                else if (cmd === 'DPAD_LEFT') {
                    if (craftRow === 0) craftHideId = (craftHideId + 3) % 4;
                    if (craftRow === 1) craftPalId = (craftPalId + 3) % 4;
                    if (craftRow === 2) craftFurId = (craftFurId + 3) % 4;
                    playSfx('click');
                } else if (cmd === 'DPAD_RIGHT' || cmd === 'BUTTON_B') {
                    if (craftRow === 0) craftHideId = (craftHideId + 1) % 4;
                    if (craftRow === 1) craftPalId = (craftPalId + 1) % 4;
                    if (craftRow === 2) craftFurId = (craftFurId + 1) % 4;
                    playSfx('click');
                } else if (cmd === 'BUTTON_A') {
                    serveCurrentMoccasin();
                }
                return;
            }

            if (gameState === 'ORDER_GAMEOVER') {
                if (cmd === 'BUTTON_A') startOrderRush();
                if (cmd === 'BUTTON_B') gameState = 'MODE_SELECT';
                return;
            }

            if (gameState === 'PREP_SELECT') {
                if (cmd === 'DPAD_UP') prepRow = (prepRow + 4) % 5;
                if (cmd === 'DPAD_DOWN') prepRow = (prepRow + 1) % 5;
                if (cmd === 'DPAD_LEFT') {
                    if (prepRow === 0) selectedHideId = (selectedHideId + HIDES.length - 1) % HIDES.length;
                    if (prepRow === 1) selectedPaletteId = (selectedPaletteId + PALETTES.length - 1) % PALETTES.length;
                    if (prepRow === 2) selectedStudioFurId = (selectedStudioFurId + FURS.length - 1) % FURS.length;
                    if (prepRow === 3) selectedStudioTemplate = selectedStudioTemplate <= -1 ? PATTERNS.length - 1 : selectedStudioTemplate - 1;
                    playSfx('click');
                }
                if (cmd === 'DPAD_RIGHT') {
                    if (prepRow === 0) selectedHideId = (selectedHideId + 1) % HIDES.length;
                    if (prepRow === 1) selectedPaletteId = (selectedPaletteId + 1) % PALETTES.length;
                    if (prepRow === 2) selectedStudioFurId = (selectedStudioFurId + 1) % FURS.length;
                    if (prepRow === 3) selectedStudioTemplate = selectedStudioTemplate >= PATTERNS.length - 1 ? -1 : selectedStudioTemplate + 1;
                    playSfx('click');
                }
                if (cmd === 'BUTTON_A') {
                    if (prepRow === 4) startTipiSitCutscene();
                    else prepRow++;
                }
                if (cmd === 'BUTTON_B') {
                    stopChiptuneTrack();
                    gameState = 'MODE_SELECT';
                }
                return;
            }

            if (gameState === 'BEADING') {
                if (actionBarFocus) {
                    if (cmd === 'DPAD_UP') {
                        actionBarFocus = false;
                        cursor.y = ROWS - 1;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    } else if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_RIGHT') {
                        actionBarIdx = actionBarIdx === 0 ? 1 : 0;
                    } else if (cmd === 'BUTTON_A') {
                        if (actionBarIdx === 0) {
                            if (selectedStudioTemplate >= 0) showChalkGuide = !showChalkGuide;
                            else board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
                        } else {
                            startTipiOutroCutscene();
                        }
                    } else if (cmd === 'BUTTON_B') {
                        actionBarFocus = false;
                    }
                    return;
                }

                if (cmd === 'DPAD_UP') {
                    if (cursor.y > 0) {
                        cursor.y--;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    }
                } else if (cmd === 'DPAD_DOWN') {
                    if (cursor.y < ROWS - 1) {
                        cursor.y++;
                        const { minC, maxC } = getRowColBounds(cursor.y);
                        cursor.x = Math.max(minC, Math.min(maxC, cursor.x));
                    } else {
                        actionBarFocus = true;
                        actionBarIdx = 1; // Highlight [STITCH]
                    }
                } else if (cmd === 'DPAD_LEFT') {
                    const { minC } = getRowColBounds(cursor.y);
                    if (cursor.x > minC) cursor.x--;
                } else if (cmd === 'DPAD_RIGHT') {
                    const { maxC } = getRowColBounds(cursor.y);
                    if (cursor.x < maxC) cursor.x++;
                } else if (cmd === 'BUTTON_B') {
                    cursor.color = (cursor.color + 1) % 8;
                } else if (cmd === 'BUTTON_A') {
                    if (isPlayableCell(cursor.y, cursor.x)) {
                        board[cursor.y][cursor.x] = cursor.color;
                    }
                }
            }
        }

        window.addEventListener('message', function(event) {
            handleCommand(event.data);
        });

        // ==========================================
        // 16-BIT BEAD RENDERERS (FLAT & SEWN EDGE-SIDE)
        // ==========================================
        function drawFlatBeadAt(cx, cy, radius, beadStyle, alpha = 1.0) {
            if (!beadStyle) return;
            ctx.save();
            ctx.globalAlpha = alpha;

            ctx.fillStyle = 'rgba(12, 5, 2, 0.72)';
            ctx.beginPath(); ctx.arc(cx + radius * 0.14, cy + radius * 0.18, radius * 1.02, 0, Math.PI * 2); ctx.fill();

            const grad = ctx.createRadialGradient(cx - radius * 0.30, cy - radius * 0.32, radius * 0.10, cx, cy, radius);
            grad.addColorStop(0.0, beadStyle.hi); grad.addColorStop(0.32, beadStyle.mid);
            grad.addColorStop(0.76, beadStyle.deep); grad.addColorStop(1.0, beadStyle.rim);
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

            const holeR = Math.max(1.5, radius * 0.32);
            ctx.strokeStyle = beadStyle.holeRim; ctx.lineWidth = Math.max(0.8, radius * 0.14);
            ctx.beginPath(); ctx.arc(cx, cy, holeR + 0.3, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = '#120804';
            ctx.beginPath(); ctx.arc(cx, cy, holeR, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.ellipse(cx - radius * 0.40, cy - radius * 0.40, Math.max(1.0, radius * 0.22), Math.max(0.8, radius * 0.12), -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function traceBeadBarrelPath(ctxRef, cx, cy, halfW, halfH) {
            const r = Math.min(halfW * 0.55, halfH * 0.92);
            ctxRef.beginPath();
            ctxRef.moveTo(cx - halfW + r, cy - halfH);
            ctxRef.quadraticCurveTo(cx, cy - halfH * 1.14, cx + halfW - r, cy - halfH);
            ctxRef.quadraticCurveTo(cx + halfW, cy - halfH, cx + halfW, cy);
            ctxRef.quadraticCurveTo(cx + halfW, cy + halfH, cx + halfW - r, cy + halfH);
            ctxRef.quadraticCurveTo(cx, cy + halfH * 1.14, cx - halfW + r, cy + halfH);
            ctxRef.quadraticCurveTo(cx - halfW, cy + halfH, cx - halfW, cy);
            ctxRef.quadraticCurveTo(cx - halfW, cy - halfH, cx - halfW + r, cy - halfH);
            ctxRef.closePath();
        }

        function drawSewnBeadAt(cx, cy, cellSize, beadStyle, isSewn = true, alpha = 1.0) {
            if (!beadStyle) return;
            const halfW = Math.max(5.5, Math.floor(cellSize * 0.43));
            const halfH = Math.max(4.0, Math.floor(cellSize * 0.31));

            ctx.save();
            ctx.globalAlpha = alpha;

            if (isSewn) {
                const threadOut = halfW + 2.5;
                ctx.fillStyle = '#1a0b04';
                ctx.fillRect(Math.floor(cx - threadOut - 1), Math.floor(cy - 1), 2, 2);
                ctx.fillRect(Math.floor(cx + threadOut - 1), Math.floor(cy - 1), 2, 2);

                ctx.strokeStyle = '#efe0be'; ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(cx - threadOut, cy); ctx.lineTo(cx - halfW + 1, cy);
                ctx.moveTo(cx + halfW - 1, cy); ctx.lineTo(cx + threadOut, cy);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(1.2, isSewn ? 2.0 : 3.2);
            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.fillStyle = isSewn ? 'rgba(12, 5, 2, 0.72)' : 'rgba(12, 5, 2, 0.48)';
            ctx.fill();
            ctx.restore();

            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            const grad = ctx.createRadialGradient(cx - halfW * 0.24, cy - halfH * 0.42, halfH * 0.12, cx, cy + halfH * 0.10, halfW * 1.18);
            grad.addColorStop(0.0, beadStyle.hi); grad.addColorStop(0.32, beadStyle.mid);
            grad.addColorStop(0.76, beadStyle.deep); grad.addColorStop(1.0, beadStyle.rim);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.save();
            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.clip();
            ctx.fillStyle = 'rgba(16, 6, 2, 0.34)';
            ctx.fillRect(cx - halfW, cy - halfH * 0.55, 2, halfH * 1.1);
            ctx.fillRect(cx + halfW - 2, cy - halfH * 0.55, 2, halfH * 1.1);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
            ctx.beginPath();
            ctx.ellipse(cx - halfW * 0.16, cy - halfH * 0.44, Math.max(2.0, halfW * 0.42), Math.max(1.0, halfH * 0.20), -0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            traceBeadBarrelPath(ctx, cx, cy, halfW, halfH);
            ctx.strokeStyle = 'rgba(20, 8, 3, 0.65)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
        }

        // ==========================================
        // BUSHY / FLUFFY ANKLE FUR TRIM RENDERER
        // ==========================================
        function drawFluffyFurTrim(x, y, width, height, furObj, bushy = false) {
            ctx.save();
            if (bushy) {
                // Chunky, warm, bushy pixel fur puffs (less fine detail, plush moccasin feel)
                // 1. Deep under-fur shadow silhouette
                ctx.fillStyle = furObj.dark;
                for (let fx = x - 6; fx <= x + width - 2; fx += 8) {
                    const seed = Math.abs(Math.sin(fx * 12.9898) * 43758.5453) % 1;
                    const topJut = Math.floor(seed * 5);
                    const botJut = Math.floor(((seed * 5) % 1) * 6);
                    ctx.fillRect(fx, y - topJut, 10, height + topJut + botJut);
                }

                // 2. Main chunky bushy mid-tone fur puffs
                ctx.fillStyle = furObj.base;
                for (let fx = x - 4; fx <= x + width - 4; fx += 9) {
                    const seed = Math.abs(Math.sin(fx * 78.233) * 19341.23) % 1;
                    const ty = y - Math.floor(seed * 4);
                    const th = height - 1 + Math.floor(((seed * 4) % 1) * 5);
                    ctx.fillRect(fx, ty, 10, th);
                    ctx.fillRect(fx - 2, ty + 3, 14, Math.max(4, th - 6));
                }

                // 3. Soft warm bushy highlight clusters
                ctx.fillStyle = furObj.hi;
                for (let fx = x - 2; fx <= x + width - 6; fx += 10) {
                    const seed = Math.abs(Math.sin(fx * 41.123) * 9182.77) % 1;
                    const hy = y - 1 + Math.floor(seed * (height * 0.35));
                    ctx.fillRect(fx, hy, 6, 5);
                    ctx.fillRect(fx + 2, hy - 2, 4, 3);
                }
                ctx.restore();
                return;
            }

            // Compact fuzzy trim for menu swatch & Lane's Post mini moccasin
            ctx.fillStyle = furObj.dark;
            for (let fx = x - 3; fx <= x + width + 3; fx += 4) {
                const seed = Math.abs(Math.sin(fx * 12.9898) * 43758.5453) % 1;
                const topJut = Math.floor(seed * 3);
                const botJut = Math.floor(((seed * 7) % 1) * 4);
                ctx.fillRect(fx, y - topJut, 5, height + topJut + botJut);
            }
            ctx.fillStyle = furObj.base;
            for (let fx = x - 2; fx <= x + width + 2; fx += 5) {
                const seed = Math.abs(Math.sin(fx * 78.233) * 19341.23) % 1;
                ctx.fillRect(fx, y - Math.floor(seed * 2), 5, height + Math.floor(seed * 2));
            }
            ctx.fillStyle = furObj.hi;
            for (let fx = x; fx <= x + width - 2; fx += 6) {
                const seed = Math.abs(Math.sin(fx * 41.123) * 9182.77) % 1;
                ctx.fillRect(fx, y + Math.floor(seed * 2), 3, 3);
            }
            ctx.restore();
        }

        // ==========================================
        // 16-BIT MOCCASIN RENDERERS (FLIPPED VAMP: CUFF AT TOP, ROUNDED TOE AT BOTTOM)
        // ==========================================
        function traceDomePath(ctxRef, cx, rx, domeCenterY, ry, bottomY, botCorner = 4) {
            ctxRef.beginPath();
            ctxRef.moveTo(cx - rx, bottomY - botCorner);
            ctxRef.lineTo(cx - rx, domeCenterY);
            ctxRef.ellipse(cx, domeCenterY, rx, ry, 0, Math.PI, 0, false);
            ctxRef.lineTo(cx + rx, bottomY - botCorner);
            ctxRef.quadraticCurveTo(cx + rx, bottomY, cx + rx - botCorner, bottomY);
            ctxRef.lineTo(cx - rx + botCorner, bottomY);
            ctxRef.quadraticCurveTo(cx - rx, bottomY, cx - rx, bottomY - botCorner);
            ctxRef.closePath();
        }

        function traceFlippedDomePath(ctxRef, cx, rx, topY, domeCenterY, ry, topCorner = 4) {
            ctxRef.beginPath();
            ctxRef.moveTo(cx - rx + topCorner, topY);
            ctxRef.lineTo(cx + rx - topCorner, topY);
            ctxRef.quadraticCurveTo(cx + rx, topY, cx + rx, topY + topCorner);
            ctxRef.lineTo(cx + rx, domeCenterY);
            ctxRef.ellipse(cx, domeCenterY, rx, ry, 0, 0, Math.PI, false);
            ctxRef.lineTo(cx - rx, topY + topCorner);
            ctxRef.quadraticCurveTo(cx - rx, topY, cx - rx + topCorner, topY);
            ctxRef.closePath();
        }

        function drawThickSinewSeamFlipped(cx, rx, topY, domeCenterY, ry, sinewColor) {
            const pts = [];
            const sideSteps = 7;
            for (let i = 0; i < sideSteps; i++) pts.push({ x: cx + rx, y: topY + 4 + (i / sideSteps) * (domeCenterY - (topY + 4)) });
            const arcSteps = 28;
            for (let i = 0; i <= arcSteps; i++) {
                const a = (i / arcSteps) * Math.PI;
                pts.push({ x: cx + Math.cos(a) * rx, y: domeCenterY + Math.sin(a) * ry });
            }
            for (let i = 1; i <= sideSteps; i++) pts.push({ x: cx - rx, y: domeCenterY - (i / sideSteps) * (domeCenterY - (topY + 4)) });

            for (let i = 0; i < pts.length - 1; i += 2) {
                const p1 = pts[i], p2 = pts[i + 1];
                ctx.fillStyle = '#1c0c04';
                ctx.fillRect(Math.floor(p1.x - 1.5), Math.floor(p1.y - 1.5), 3, 3);
                ctx.fillRect(Math.floor(p2.x - 1.5), Math.floor(p2.y - 1.5), 3, 3);

                ctx.strokeStyle = 'rgba(18, 8, 2, 0.78)'; ctx.lineWidth = 4.0; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(p1.x + 1, p1.y + 1.5); ctx.lineTo(p2.x + 1, p2.y + 1.5); ctx.stroke();

                ctx.strokeStyle = sinewColor; ctx.lineWidth = 2.8;
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }

            for (let sx = cx - rx + 8; sx <= cx + rx - 14; sx += 14) {
                ctx.fillStyle = '#1c0c04';
                ctx.fillRect(sx - 1, topY + 2, 2, 3); ctx.fillRect(sx + 7, topY + 2, 2, 3);
                ctx.strokeStyle = sinewColor; ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.moveTo(sx, topY + 3); ctx.lineTo(sx + 7, topY + 3); ctx.stroke();
            }
        }

        function drawCompactOrderMoccasin(cx, cy, hideObj, palObj, furObj) {
            const vampRX = 46, vampTopY = cy - 58, vampDomeY = cy - 12, vampRY = vampDomeY - vampTopY, vampBotY = cy + 36;
            const outerRX = vampRX + 14, outerTopY = vampTopY - 14, outerDomeY = vampDomeY + 4, outerRY = outerDomeY - outerTopY, outerBotY = vampBotY + 8;

            ctx.save();
            ctx.save();
            ctx.translate(4, 6);
            traceDomePath(ctx, cx, outerRX, outerDomeY, outerRY, outerBotY + 18, 5);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; ctx.fill();
            ctx.restore();

            traceDomePath(ctx, cx, outerRX, outerDomeY, outerRY, outerBotY, 5);
            ctx.fillStyle = hideObj.outerMid; ctx.fill();
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2; ctx.stroke();

            const cuffTopY = vampBotY + 1, cuffH = 22, cuffW = outerRX * 2 - 4, cuffX = cx - cuffW / 2;
            ctx.fillStyle = hideObj.cuffMain; ctx.fillRect(cuffX, cuffTopY, cuffW, cuffH);
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2; ctx.strokeRect(cuffX, cuffTopY, cuffW, cuffH);

            drawFluffyFurTrim(cuffX, cuffTopY + cuffH - 8, cuffW, 11, furObj, false);

            traceDomePath(ctx, cx, vampRX, vampDomeY, vampRY, vampBotY, 3);
            const vampGrad = ctx.createRadialGradient(cx + 6, cy - 10, 8, cx, cy, vampRX * 1.3);
            vampGrad.addColorStop(0.0, hideObj.light); vampGrad.addColorStop(0.5, hideObj.mid); vampGrad.addColorStop(1.0, hideObj.dark);
            ctx.fillStyle = vampGrad; ctx.fill();
            ctx.strokeStyle = hideObj.sinew; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);

            const bY = cy - 8, sp = 14;
            drawFlatBeadAt(cx - sp, bY + sp, 5, palObj.beads[5]);
            drawFlatBeadAt(cx + sp, bY + sp, 5, palObj.beads[5]);
            drawFlatBeadAt(cx, bY - sp, 6.5, palObj.beads[1]);
            drawFlatBeadAt(cx, bY + sp, 6.5, palObj.beads[1]);
            drawFlatBeadAt(cx - sp, bY, 6.5, palObj.beads[2]);
            drawFlatBeadAt(cx + sp, bY, 6.5, palObj.beads[2]);
            drawFlatBeadAt(cx, bY, 7, palObj.beads[3]);
            ctx.restore();
        }

        function drawMoccasin(m, hideObj, guidePatternGrid, guidePalette, furObj) {
            const cx = m.offsetX + m.gridW / 2;
            const vampRX = Math.floor(m.gridW / 2) + 12;
            const vampTopY = m.offsetY - 10;
            const vampDomeCenterY = m.offsetY + m.gridH - Math.floor(m.cellSize * 3.1);
            const vampBotY = m.offsetY + m.gridH + 12;
            const vampRY = vampBotY - vampDomeCenterY;

            const outerRX = vampRX + 20;
            const outerTopY = vampTopY - 12;
            const outerDomeCenterY = vampDomeCenterY - 6;
            const outerBotY = vampBotY + 24;
            const outerRY = outerBotY - outerDomeCenterY;

            ctx.save();

            // 1. Grounded drop shadow
            ctx.save();
            ctx.translate(5, 8);
            traceFlippedDomePath(ctx, cx, outerRX, outerTopY - 18, outerDomeCenterY, outerRY, 6);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.58)'; ctx.fill();
            ctx.restore();

            // 2. Outer puckered lower-hide toe wrap
            traceFlippedDomePath(ctx, cx, outerRX, outerTopY, outerDomeCenterY, outerRY, 6);
            ctx.save();
            ctx.clip();
            const outerGrad = ctx.createRadialGradient(cx + 14, outerDomeCenterY, 18, cx, outerDomeCenterY - 20, outerRX * 1.45);
            outerGrad.addColorStop(0.0, hideObj.outerLight); outerGrad.addColorStop(0.65, hideObj.outerMid); outerGrad.addColorStop(1.0, hideObj.outerDark);
            ctx.fillStyle = outerGrad;
            ctx.fillRect(cx - outerRX - 2, outerTopY - 2, outerRX * 2 + 4, (outerBotY - outerTopY) + 4);

            const pleatCount = 21;
            for (let i = 0; i < pleatCount; i++) {
                const t = i / (pleatCount - 1);
                const a = 0.06 + t * (Math.PI - 0.12);
                const ox = cx + Math.cos(a) * (outerRX + 2), oy = outerDomeCenterY + Math.sin(a) * (outerRY + 2);
                const ix = cx + Math.cos(a) * (vampRX - 2), iy = vampDomeCenterY + Math.sin(a) * (vampRY - 2);
                ctx.strokeStyle = 'rgba(18, 8, 2, 0.68)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ix, iy); ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 230, 190, 0.24)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(ox + 2.5, oy - 1); ctx.lineTo(ix + 2, iy - 1); ctx.stroke();
            }
            ctx.restore();

            traceFlippedDomePath(ctx, cx, outerRX, outerTopY, outerDomeCenterY, outerRY, 6);
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2.5; ctx.stroke();

            // 3. Central Moccasin Vamp (Squared top, rounded toe dome at bottom)
            traceFlippedDomePath(ctx, cx, vampRX + 3, vampTopY - 2, vampDomeCenterY, vampRY + 3, 3);
            ctx.fillStyle = '#211005'; ctx.fill();

            traceFlippedDomePath(ctx, cx, vampRX, vampTopY, vampDomeCenterY, vampRY, 3);
            ctx.save();
            ctx.clip();
            const vampGrad = ctx.createRadialGradient(cx + 12, m.offsetY + m.gridH * 0.58, 16, cx, m.offsetY + m.gridH * 0.52, Math.max(vampRX, m.gridH) * 1.15);
            vampGrad.addColorStop(0.0, hideObj.light); vampGrad.addColorStop(0.42, hideObj.mid);
            vampGrad.addColorStop(0.84, hideObj.dark); vampGrad.addColorStop(1.0, hideObj.edge);
            ctx.fillStyle = vampGrad;
            ctx.fillRect(cx - vampRX - 2, vampTopY - 2, vampRX * 2 + 4, (vampBotY - vampTopY) + 4);
            drawDitherBand(ctx, cx - vampRX, vampTopY, vampRX * 2, vampBotY - vampTopY, 'rgba(20, 10, 4, 0.12)', 2);
            ctx.restore();

            traceFlippedDomePath(ctx, cx, vampRX, vampTopY, vampDomeCenterY, vampRY, 3);
            ctx.strokeStyle = '#261206'; ctx.lineWidth = 2; ctx.stroke();

            // 4. Thick hand-stitched sinew around flipped vamp
            drawThickSinewSeamFlipped(cx, vampRX - 1, vampTopY, vampDomeCenterY, vampRY - 1, hideObj.sinew);

            // 5. Turned-down ankle cuff + Warm Bushy Fur at the TOP (ends just before Row 0 of beads)
            const cuffH = 26;
            const cuffTopY = vampTopY - cuffH - 2;
            const cuffW = outerRX * 2 - 2, cuffX = cx - cuffW / 2;
            ctx.fillStyle = hideObj.cuffMain; ctx.fillRect(cuffX, cuffTopY, cuffW, cuffH);
            ctx.strokeStyle = '#1c0c04'; ctx.lineWidth = 2; ctx.strokeRect(cuffX, cuffTopY + 2, cuffW, cuffH - 2);

            // Warm bushy fur covering the cuff and draping gently right up to the top seam above Row 0
            drawFluffyFurTrim(cuffX, cuffTopY - 2, cuffW, 24, furObj || FURS[0], true);

            // 6. Playable 9x9 cells
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!isPlayableCell(r, c)) continue;
                    const cellX = m.offsetX + c * m.cellSize, cellY = m.offsetY + r * m.cellSize;
                    const midX = cellX + m.cellSize / 2, midY = cellY + m.cellSize / 2;

                    const roleId = guidePatternGrid ? guidePatternGrid[r][c] : 0;
                    if (roleId > 0 && guidePalette) {
                        const bStyle = guidePalette.beads[roleId];
                        ctx.strokeStyle = bStyle.mid; ctx.globalAlpha = 0.72; ctx.lineWidth = 1.8;
                        ctx.strokeRect(cellX + 3, cellY + 3, m.cellSize - 6, m.cellSize - 6);
                        ctx.fillStyle = bStyle.mid;
                        ctx.beginPath(); ctx.arc(midX, midY, Math.max(2.5, m.cellSize * 0.14), 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1.0;
                    } else {
                        ctx.fillStyle = hideObj.guideDot;
                        ctx.fillRect(Math.floor(midX - 1), Math.floor(midY - 1), 2, 2);
                    }
                }
            }

            ctx.restore();
            return { moccBottomY: outerBotY + 6 };
        }

        // ==========================================
        // UI HELPERS & SCENE RENDERING
        // ==========================================
        function drawPixelText(text, x, y, color, font, align = 'center') {
            ctx.font = font; ctx.textAlign = align;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillText(text, x + 2, y + 2);
            ctx.fillStyle = color; ctx.fillText(text, x, y);
        }

        function drawTopHudBar() {
            const grad = ctx.createLinearGradient(0, 0, 0, HUD_TOP_H);
            grad.addColorStop(0, '#2a160c'); grad.addColorStop(0.5, '#1d0e07'); grad.addColorStop(1, '#120804');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, VIEW_W, HUD_TOP_H);
            ctx.fillStyle = '#784c23'; ctx.fillRect(0, HUD_TOP_H - 3, VIEW_W, 2);
            ctx.fillStyle = '#cfa04e'; ctx.fillRect(0, HUD_TOP_H - 2, VIEW_W, 1);
        }

        function drawBottomHudBar(text) {
            const y = VIEW_H - HUD_BOT_H;
            ctx.fillStyle = '#180c06'; ctx.fillRect(0, y, VIEW_W, HUD_BOT_H);
            ctx.fillStyle = '#8c5c2b'; ctx.fillRect(0, y, VIEW_W, 2);
            drawPixelText(text, VIEW_W / 2, y + 17, '#d9c29c', 'bold 12px Courier New', 'center');
        }

        function drawModalPanel(cx, cy, w, h) {
            const x = Math.floor(cx - w / 2), y = Math.floor(cy - h / 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.60)'; ctx.fillRect(x + 4, y + 4, w, h);
            ctx.fillStyle = 'rgba(24, 13, 7, 0.94)'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#c9933b'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
            ctx.strokeStyle = '#5c3318'; ctx.lineWidth = 1; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
        }

        function drawGriddedPatternPreview(cx, cy, cellPx, patternObj, paletteObj, hideObj) {
            const totalW = COLS * cellPx, totalH = ROWS * cellPx;
            const ox = Math.floor(cx - totalW / 2), oy = Math.floor(cy - totalH / 2);

            ctx.save();
            ctx.fillStyle = '#120804'; ctx.fillRect(ox - 4, oy - 4, totalW + 8, totalH + 8);
            ctx.strokeStyle = '#9c7132'; ctx.lineWidth = 1.5; ctx.strokeRect(ox - 4, oy - 4, totalW + 8, totalH + 8);

            const isDarkHide = (hideObj.id === 2);
            const gridStroke = isDarkHide ? 'rgba(220, 210, 195, 0.18)' : 'rgba(24, 11, 4, 0.28)';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = ox + c * cellPx, y = oy + r * cellPx;
                    if (!isPlayableCell(r, c)) {
                        ctx.fillStyle = '#170c06'; ctx.fillRect(x, y, cellPx, cellPx);
                        continue;
                    }
                    ctx.fillStyle = hideObj.mid; ctx.fillRect(x, y, cellPx, cellPx);
                    ctx.strokeStyle = gridStroke; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cellPx - 1, cellPx - 1);

                    if (patternObj) {
                        const role = patternObj.grid[r][c];
                        if (role > 0) drawFlatBeadAt(x + cellPx / 2, y + cellPx / 2, Math.max(2.2, cellPx * 0.42), paletteObj.beads[role]);
                    }
                }
            }

            if (!patternObj) drawPixelText("BLANK", cx, cy + 4, isDarkHide ? '#d9c29c' : '#2b1507', 'bold 10px Courier New');
            ctx.restore();
        }

        function drawOrderTicketCard(x, y, w, h, order) {
            const hideObj = HIDES[order.hideId], palObj = PALETTES[order.palId], furObj = FURS[order.furId];
            const isMatch = (order.hideId === craftHideId && order.palId === craftPalId && order.furId === craftFurId);

            ctx.fillStyle = 'rgba(20, 11, 6, 0.92)'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = isMatch ? '#7bed9f' : '#a87832'; ctx.lineWidth = isMatch ? 2.5 : 1.5; ctx.strokeRect(x, y, w, h);

            drawPixelText(order.name.toUpperCase(), x + w / 2, y + 14, '#ffe49e', 'bold 11px Courier New');

            const pct = Math.max(0, order.patience / order.maxPatience);
            const barX = x + 6, barY = y + 20, barW = w - 12, barH = 6;
            ctx.fillStyle = '#120804'; ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = pct > 0.5 ? '#7bed9f' : (pct > 0.25 ? '#f2c938' : '#ff5252');
            ctx.fillRect(barX, barY, Math.floor(barW * pct), barH);

            ctx.fillStyle = hideObj.mid; ctx.fillRect(x + 8, y + 32, 14, 11);
            ctx.strokeStyle = '#f6e7c8'; ctx.lineWidth = 1; ctx.strokeRect(x + 8, y + 32, 14, 11);
            drawPixelText(hideObj.shortName, x + 28, y + 41, '#f6e7c8', 'bold 10px Courier New', 'left');

            drawFlatBeadAt(x + 11, y + 57, 3.6, palObj.beads[1]);
            drawFlatBeadAt(x + 17, y + 57, 3.6, palObj.beads[3]);
            drawFlatBeadAt(x + 23, y + 57, 3.6, palObj.beads[5]);
            drawPixelText(palObj.shortName, x + 31, y + 60, '#7BAFD4', 'bold 10px Courier New', 'left');

            ctx.fillStyle = furObj.base; ctx.fillRect(x + 10, y + 71, 10, 9);
            ctx.fillStyle = furObj.hi; ctx.fillRect(x + 11, y + 72, 6, 4);
            drawPixelText(furObj.shortName, x + 28, y + 79, '#ffe169', 'bold 10px Courier New', 'left');
        }

        function drawScene(now) {
            const midY = Math.floor(HUD_TOP_H + (VIEW_H - HUD_TOP_H - HUD_BOT_H) / 2);

            // 1. TITLE SCREEN — NATURAL ASSINIBOINE RIVER BEND
            if (gameState === 'MODE_SELECT') {

                const boxW = Math.min(168, Math.floor((VIEW_W - 44) / 2));

                [

                    { title: "TIPI STUDIO", sub: "FREEFORM BEADWORK", idx: 1 }

                    ctx.strokeStyle = sel ? '#ffe169' : '#8c6232'; ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeRect(bx, boxY, boxW, boxH);
                    drawPixelText(sel ? `> ${ch.title} <` : ch.title, bx + boxW / 2, boxY + 32, sel ? '#ffe169' : '#c7b8a1', 'bold 14px Courier New');
                    drawPixelText(ch.sub, bx + boxW / 2, boxY + 54, sel ? '#f6e7c8' : '#8c7a66', 'bold 10px Courier New');
                });

                drawBottomHudBar("D-PAD: SELECT  |  A: ENTER");
                drawPauseOverlay();
                return;
            }

            // 2. LANE'S POST 4-4-4 CLERK RUSH
            if (gameState === 'ORDER_PLAYING' || gameState === 'ORDER_GAMEOVER') {
                ctx.drawImage(postBgCanvas, 0, 0);
                drawAnimatedPostEffects(now);

                drawTopHudBar();
                drawPixelText(`SCORE: ${orderScore}`, 12, 26, '#ffe49e', 'bold 16px Courier New', 'left');
                drawPixelText(`SERVED: ${orderServedCount}`, VIEW_W / 2, 26, '#7BAFD4', 'bold 14px Courier New', 'center');

                const livesLeft = Math.max(0, MAX_STRIKES - orderStrikes);
                drawPixelText(`LIVES: ${'♥'.repeat(livesLeft)}${'·'.repeat(orderStrikes)}`, VIEW_W - 12, 26, livesLeft <= 1 ? '#ff5252' : '#ff6b6b', 'bold 14px Courier New', 'right');
                drawPixelText(
                    orderCombo > 1 ? `LANE'S POST • STREAK x${orderCombo}!` : "LANE'S POST • MATCH HIDE + HANK + FUR",
                    VIEW_W / 2, 52, orderCombo > 1 ? '#7bed9f' : '#d9c29c', 'bold 11px Courier New', 'center'
                );

                const cardW = Math.min(122, Math.floor((VIEW_W - 28) / 3)), cardH = 90, gap = 8;
                const totalRowW = activeOrders.length * cardW + Math.max(0, activeOrders.length - 1) * gap;
                const startX = Math.floor((VIEW_W - totalRowW) / 2), cardY = HUD_TOP_H + 10;

                for (let i = 0; i < activeOrders.length; i++) {

                }

                const curHide = HIDES[craftHideId], curPal = PALETTES[craftPalId], curFur = FURS[craftFurId];
                const moccCY = cardY + cardH + 74;

                drawModalPanel(VIEW_W / 2, panelCY, panelW, panelH);

                const pTop = panelCY - panelH / 2;
                [
                    { label: 'HIDE', val: curHide.name, idx: 0 },
                    { label: 'HANK', val: curPal.name,  idx: 1 },
                    { label: 'FUR ', val: curFur.name,  idx: 2 }
                ].forEach(r => {

                    drawPixelText(`< ${r.val} >`, VIEW_W / 2 + 28, ry, active ? '#ffffff' : '#c7b8a1', 'bold 14px Courier New', 'center');
                });

                if (gameState === 'ORDER_GAMEOVER') {

                    drawPixelText(`FINAL SCORE: ${orderScore}`, VIEW_W / 2, midY - 18, '#F2EFE9', 'bold 17px Courier New');
                    drawPixelText(`ORDERS SERVED: ${orderServedCount}`, VIEW_W / 2, midY + 12, '#7BAFD4', 'bold 15px Courier New');
                    drawPixelText("PRESS 'A' TO PLAY AGAIN", VIEW_W / 2, midY + 56, '#7bed9f', 'bold 14px Courier New');
                    drawPixelText("PRESS 'B' FOR MAIN MENU", VIEW_W / 2, midY + 82, '#a3907a', 'bold 12px Courier New');

            ctx.translate(-Math.floor(tipiCamX), 0);

            if (gameState === 'TIPI_OUTRO_CUTSCENE') {
                const sitX = tipiLayout.robeSitX, sitY = tipiLayout.robeSitY + 8;
                const husX = tipiLayout.husbandX, husY = tipiLayout.husbandY + 8;
                const doorExitX = tipiLayout.doorX + tipiLayout.doorW * 0.50;
                const doorExitY = tipiLayout.doorY + tipiLayout.doorH + 2;

                drawCentralEmberHearth(now);

                if (cutsceneElapsedMs < 2400) {
                    drawMotherSprite(sitX, sitY, 'sit_rustle_fast', now, chosenHide);
                    drawHusbandSprite(husX, husY, 'sit', now, false, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 3600) {
                    const t = stepProgress((cutsceneElapsedMs - 2400) / 1200, 10);
                    drawMotherSprite(sitX + (husX - 30 - sitX) * t, sitY + (husY - sitY) * t, 'carry_mocc', now, chosenHide, chosenPal, chosenFur);
                    drawHusbandSprite(husX, husY, 'sit', now, false, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 4300) {
                    drawMotherSprite(husX - 30, husY, 'place_mocc', now, chosenHide, chosenPal, chosenFur);
                    drawHusbandSprite(husX, husY, 'sit', now, true, chosenHide, chosenPal, chosenFur);
                } else if (cutsceneElapsedMs < 6100) {
                    const jigPhase = (cutsceneElapsedMs - 4300) / 900;
                    drawMotherSprite(husX - 36, husY, 'walk', 0);
                    drawHusbandSprite(husX, husY, 'jig', now, true, chosenHide, chosenPal, chosenFur, jigPhase);
                } else if (cutsceneElapsedMs < 7200) {
                    drawMotherSprite(husX - 32, husY, 'walk', 0);
                    drawHusbandSprite(husX - 10, husY, 'kiss', now, true, chosenHide, chosenPal, chosenFur);
                } else {
                    drawMotherSprite(husX - 32, husY, 'walk', 0);
                    const t = stepProgress((cutsceneElapsedMs - 7200) / 2100, 18);
                    const hx = (husX - 10) + (doorExitX - (husX - 10)) * t;
                    const hy = husY + (doorExitY - husY) * t;
                    const hPose = t > 0.78 ? 'duck_left' : 'walk_left';
                    if (t < 0.96) {
                        drawHusbandSprite(hx, hy, hPose, now, true, chosenHide, chosenPal, chosenFur);
                    }
                }

                ctx.restore();

                if (cutsceneElapsedMs > 8400) {
                    const fade = stepProgress((cutsceneElapsedMs - 8400) / 1100, 8);
                    ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
                    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
                }

                drawTopHudBar();
                const caption = cutsceneElapsedMs < 2400 ? "FINISHING THE MOCCASINS..."
                    : cutsceneElapsedMs < 4300 ? "A FRESH PAIR FOR THE TRAIL..."
                    : cutsceneElapsedMs < 6100 ? "1 - 2 - 3 - KICK!"
                    : cutsceneElapsedMs < 7200 ? "MERCI, MA CHERE!"
                    : "OFF DOWN THE ASSINIBOINE...";
                drawPixelText(caption, VIEW_W / 2, 38, '#ffe49e', 'bold 16px Courier New');
                drawBottomHudBar("ASSINIBOINE RIVER TIPI");
                drawPauseOverlay();
                return;
            }

            // 4. TIPI STUDIO BEADING WORKBENCH (FLIPPED VAMP + BUSHY FUR + GUIDE/STITCH ONLY)
            if (gameState === 'BEADING') {
                drawCentralEmberHearth(now);
                ctx.restore();

                const m = getGridMetrics();
                const guideGrid = (showChalkGuide && selectedStudioTemplate >= 0) ? PATTERNS[selectedStudioTemplate].grid : null;

                drawTopHudBar();
                const stTitle = selectedStudioTemplate >= 0 ? `TIPI: ${PATTERNS[selectedStudioTemplate].shortName}` : 'TIPI STUDIO';
                drawPixelText(stTitle, 12, 26, '#ffe49e', 'bold 15px Courier New', 'left');

                if (cursor.color === 0) {
                    drawPixelText("BRUSH: ERASER", VIEW_W - 12, 26, '#ff6b6b', 'bold 14px Courier New', 'right');
                } else {
                    const bSt = chosenPal.beads[cursor.color];
                    drawPixelText(`#${cursor.color} ${bSt.name}`, VIEW_W / 2, 52, bSt.hi, 'bold 13px Courier New', 'center');
                    drawFlatBeadAt(VIEW_W - 22, 22, 9, bSt);
                }

                const { moccBottomY } = drawMoccasin(m, chosenHide, guideGrid, chosenPal, chosenFur);

                ctx.save();
                ctx.translate(m.offsetX, m.offsetY);
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (!isPlayableCell(r, c) || board[r][c] === 0) continue;
                        drawSewnBeadAt(c * m.cellSize + m.cellSize / 2, r * m.cellSize + m.cellSize / 2, m.cellSize, chosenPal.beads[board[r][c]], true);
                    }
                }

                if (!actionBarFocus) {
                    if (cursor.color > 0) {
                        drawSewnBeadAt(cursor.x * m.cellSize + m.cellSize / 2, cursor.y * m.cellSize + m.cellSize / 2, m.cellSize, chosenPal.beads[cursor.color], false, 0.62);
                    }
                    const blink = Math.floor(now / 260) % 2 === 0;
                    ctx.strokeStyle = blink ? '#ffe49e' : '#3a1f0b'; ctx.lineWidth = 2;
                    ctx.strokeRect(cursor.x * m.cellSize + 1, cursor.y * m.cellSize + 1, m.cellSize - 2, m.cellSize - 2);
                }
                ctx.restore();

                // Clean 2-Option Action Bar: [GUIDE: ON/OFF] (or [CLEAR]) and [STITCH]
                const barY = Math.min(VIEW_H - HUD_BOT_H - 12, moccBottomY + 14);
                const leftLabel = selectedStudioTemplate >= 0 ? (showChalkGuide ? 'Guide: ON' : 'Guide: OFF') : 'Clear';
                const rightLabel = 'Stitch';

                drawPixelText(
                    (actionBarFocus && actionBarIdx === 0) ? `[ ${leftLabel} ]` : leftLabel,
                    VIEW_W / 2 - 76, barY,
                    (actionBarFocus && actionBarIdx === 0) ? '#ffe169' : '#a3907a',
                    'bold 13px Courier New'
                );
                drawPixelText(
                    (actionBarFocus && actionBarIdx === 1) ? `[ ${rightLabel} ]` : rightLabel,
                    VIEW_W / 2 + 76, barY,
                    (actionBarFocus && actionBarIdx === 1) ? '#7bed9f' : '#a3907a',
                    'bold 13px Courier New'
                );

                drawBottomHudBar("A: PLACE  |  B: BEAD COLOR  |  DOWN: STITCH");

                if (beadingFadeAlpha > 0) {
                    ctx.fillStyle = `rgba(18, 9, 5, ${beadingFadeAlpha})`;
                    ctx.fillRect(0, HUD_TOP_H, VIEW_W, VIEW_H - HUD_TOP_H - HUD_BOT_H);
                }
            }

            drawPauseOverlay();
        }

        function drawPauseOverlay() {
            if (!isPaused) return;
            ctx.fillStyle = 'rgba(10, 6, 4, 0.78)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            drawPixelText("PAUSED", VIEW_W / 2, VIEW_H / 2, '#D99B26', 'bold 28px Courier New');
        }

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const dtMs = Math.min(100, timestamp - lastFrameTime);
            lastFrameTime = timestamp;

            if (!isPaused) {
                if (gameState === 'ORDER_PLAYING') updateOrderRush(dtMs);
                else updateTipiCutscenes(dtMs);
            }

            drawScene(timestamp);
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // === TEMPORARY DEV KEYBOARD MAP (REMOVE BEFORE CABINET DEPLOY) ===
        // Mapping: Arrow Keys = D-Pad | Z = Button B | X = Button A | Escape = Start / Pause
        window.addEventListener('keydown', function(e) {
            const k = e.key.toLowerCase();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z', 'x', 'escape'].includes(k)) {
                e.preventDefault();
            }

            if (e.key === 'Escape') {
                if (e.repeat) return;
                if (gameState === 'BEADING' || gameState === 'ORDER_PLAYING') {
                    handleCommand(isPaused ? 'RESUME' : 'PAUSE');
                } else {
                    handleCommand('BUTTON_A');
                }
                return;
            }

            if (isPaused) return;

            if (e.key === 'ArrowUp') handleCommand('DPAD_UP');
            else if (e.key === 'ArrowDown') handleCommand('DPAD_DOWN');
            else if (e.key === 'ArrowLeft') handleCommand('DPAD_LEFT');
            else if (e.key === 'ArrowRight') handleCommand('DPAD_RIGHT');
            else if (k === 'x' && !e.repeat) handleCommand('BUTTON_A');
            else if (k === 'z' && !e.repeat) handleCommand('BUTTON_B');
        });
        // === END TEMPORARY DEV KEYBOARD MAP ===
    </script>
</body>
</html>
