        ctx.textAlign = 'left';
    }

    function drawMuzzleFlash(muzzleX, muzzleY) {
        if (flashEffect <= 0) return;
        let progress = flashEffect / 15;
        let yPos = muzzleY - ((1 - progress) * VIEW_H);

        ctx.fillStyle = `rgba(255, 255, 255, ${progress + 0.2})`;
        for (let y = 0; y < VIEW_H; y += 10) {
            if (y > yPos - 50 && y < yPos + 20) {
                if (Math.random() > 0.1) {
                    let spread = (muzzleY - y) / 2;
                    ctx.fillRect(muzzleX - spread - 40, y, 80 + spread * 2, 10);
                }
            }
        }
    }

    function drawFirstPersonGun() {
        const pivotX = Math.floor(VIEW_W * 0.52);
        const pivotY = VIEW_H + 14 + gunDropY;

        const dx = gunAim.x - pivotX;
        const dy = gunAim.y - pivotY;
        const dist = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / dist;
        const uy = dy / dist;

        const elevationFactor = 1 - (gunAim.y / VIEW_H);
        const barrelLen = Math.round(VIEW_H * (0.20 + elevationFactor * 0.14));
        const tipX = Math.round(pivotX + ux * barrelLen);
        const tipY = Math.round(pivotY + uy * barrelLen);

        const segments = 16;
        for (let s = segments; s >= 0; s--) {
            const frac = s / segments;
            const segX = Math.round(tipX + (pivotX - tipX) * frac);
            const segY = Math.round(tipY + (pivotY - tipY) * frac);

            if (frac > 0.14) {
                const stockHalfW = Math.round(4 + frac * 6);
                ctx.fillStyle = C.GUN_WOOD;
                ctx.fillRect(segX - stockHalfW, segY - 2, stockHalfW * 2, 6);
                if (s === 5 || s === 11) {
                    ctx.fillStyle = C.LEDGER_GOLD;
                    ctx.fillRect(segX - stockHalfW, segY, stockHalfW * 2, 2);
                }
            }

            const barrelHalfW = Math.round(3 + frac * 2.5);
            ctx.fillStyle = C.GUN_BARREL;
            ctx.fillRect(segX - barrelHalfW, segY - 3, barrelHalfW * 2, 6);
            ctx.fillStyle = C.GUN_IRON;
            ctx.fillRect(segX - Math.max(1, barrelHalfW - 2), segY - 3, Math.max(2, (barrelHalfW - 2) * 2), 5);
        }

        ctx.fillStyle = C.BLACK;
        ctx.fillRect(tipX - 4, tipY - 2, 8, 4);
        ctx.fillStyle = C.WHITE;
        ctx.fillRect(tipX - 1, tipY - 4, 2, 2);

        return { x: tipX, y: tipY };
    }

    function getEntityBounds(b) {
        const matrix = b.spriteFrames[b.animFrame];
        const w = matrix[0].length * b.scale;
        const h = matrix.length * b.scale;
        const drawX = (b.x + 0.5) * TILE_W - (w / 2);
        const drawY = b.dead ? b.dropY : ((b.y + 0.5) * TILE_H - (h / 2));
        return { drawX, drawY, w, h };
    }

    function drawEntity(b) {
        const matrix = b.spriteFrames[b.animFrame];
        const { drawX, drawY, w, h } = getEntityBounds(b);

        if (activeLevel === 'WOODS' && !b.dead && b.kind !== 'PORCUPINE') {
            ctx.fillStyle = 'rgba(4, 6, 8, 0.55)';
            ctx.fillRect(Math.floor(drawX + 2), Math.floor(drawY + h - 2), Math.max(6, w - 4), 3);
        }

        ctx.save();
        if (b.kind === 'PORCUPINE') {
            if (b.climbPhase === 'UP') {
                ctx.translate(drawX, drawY + h);
                ctx.scale(1, -1);
                drawSprite(0, 0, matrix, b.colorMap, b.scale);
            } else {
                drawSprite(drawX, drawY, matrix, b.colorMap, b.scale);
            }
        } else if (b.dir === -1) {
            ctx.translate(drawX + w, drawY);
            ctx.scale(-1, 1);
            drawSprite(0, 0, matrix, b.colorMap, b.scale);
        } else {
            drawSprite(drawX, drawY, matrix, b.colorMap, b.scale);
        }
        ctx.restore();

        if (b.dead && b.hitDelay > 0) {
            ctx.fillStyle = b.colorMap[1] || C.WHITE;
            let p = 20 - b.hitDelay;
            let cx = drawX + w / 2;
            let cy = drawY + h / 2;

            ctx.fillRect(cx - p - 4, cy - p - 4, 4, 2); ctx.fillRect(cx + p + 2, cy - p - 2, 2, 2);
            ctx.fillRect(cx - p - 2, cy + p + 2, 2, 2); ctx.fillRect(cx + p + 4, cy + p + 4, 4, 2);
        }
    }

    function draw() {
        if (state === 'TITLE') {
            drawTitleScreen();
            return;
        }
        if (state === 'SELECT') {
            drawSelectScreen();
            return;
        }
        if (state === 'INTRO') {
            drawIntroScreen();
            return;
        }
        if (state === 'OUTRO') {
            drawOutroScreen();
            return;
        }

        drawBackground();

        if (activeLevel === 'WOODS') {
            entities.filter(b => b.depth <= 2).forEach(drawEntity);
            forestBlinds.filter(bl => bl.depth === 3).forEach(drawWoodlandBlind);
            entities.filter(b => b.depth >= 4).forEach(drawEntity);
        } else {
            entities.forEach(drawEntity);
        }

        drawForeground(0);

        if (state === 'PLAYING') {
            let muzzlePos = drawFirstPersonGun();
            if (flashEffect > 0) drawMuzzleFlash(muzzlePos.x, muzzlePos.y);

            const tileLeft = Math.floor(crosshair.x * TILE_W);
            const tileTop = Math.floor(crosshair.y * TILE_H);
            const cx = Math.floor(tileLeft + TILE_W / 2);
            const cy = Math.floor(tileTop + TILE_H / 2);

            ctx.fillStyle = isLoaded ? 'rgba(220, 28, 36, 0.65)' : 'rgba(255, 255, 255, 0.35)';
            ctx.fillRect(cx - 1, cy - 4, 2, 8);
            ctx.fillRect(cx - 4, cy - 1, 8, 2);
            ctx.fillRect(tileLeft + 1, tileTop + 1, 2, 1);
            ctx.fillRect(tileLeft + Math.floor(TILE_W) - 3, tileTop + 1, 2, 1);
            ctx.fillRect(tileLeft + 1, tileTop + Math.floor(TILE_H) - 2, 2, 1);
            ctx.fillRect(tileLeft + Math.floor(TILE_W) - 3, tileTop + Math.floor(TILE_H) - 2, 2, 1);
        }

        ctx.font = "bold 12px Courier New";
        ctx.fillStyle = C.WHITE;
        popups.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillText(p.text, p.x, p.y);
            ctx.globalAlpha = 1.0;
        });
    }

    function loop() {
        if (!isPaused) {
            update();
            draw();
        }
        requestAnimationFrame(loop);
    }

    function updateUI() {
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;
        document.getElementById('time-display').innerText = `TIME: ${min}:${sec.toString().padStart(2, '0')}`;
        document.getElementById('score-display').innerText = `SCORE: ${score}`;

        let ammoEl = document.getElementById('ammo-display');
        if (isLoaded) { ammoEl.innerText = "LOADED"; ammoEl.className = "ammo-status loaded"; }
        else { ammoEl.innerText = "EMPTY"; ammoEl.className = "ammo-status"; }

        if (activeLevel === 'POND') {
            document.getElementById('totals-display').innerText = `D:${stats.c1} G:${stats.c2} W:${stats.c3} S:${stats.c4}`;
        } else {
            document.getElementById('totals-display').innerText = `H:${stats.c1} G:${stats.c2} F:${stats.c3} P:${stats.c4}`;
        }
    }

    function isShotBlockedByBlind(aimX, aimY, targetDepth, isPorcupine) {
        if (activeLevel !== 'WOODS' || isPorcupine) return false;
        for (let bl of forestBlinds) {
            if (bl.depth > targetDepth) {
                if (aimX >= bl.x && aimX <= bl.x + bl.w && aimY >= bl.topY && aimY <= bl.bottomY) {
                    return true;
                }
            }
        }
        return false;
    }

    function fireGun() {
        if (state !== 'PLAYING' || isPaused) return;

        if (!isLoaded) {
            playMisfireSound();
            return;
        }

        isLoaded = false;
        flashEffect = 15;
        updateUI();

        const tileLeft = crosshair.x * TILE_W;
        const tileRight = (crosshair.x + 1) * TILE_W;
        const aimX = (crosshair.x + 0.5) * TILE_W;
        const aimY = (crosshair.y + 0.5) * TILE_H;

        let anyHit = false;
        let blockedByCover = false;

        entities.forEach(b => {
            if (b.dead) return;
            const { drawX, drawY, w } = getEntityBounds(b);
            const activeRow = Math.round(b.y);

            const rowMatches = (activeRow === crosshair.y);
            const colOverlaps = (drawX + w >= tileLeft) && (drawX <= tileRight);

            if (rowMatches && colOverlaps) {
                if (isShotBlockedByBlind(aimX, aimY, b.depth, b.kind === 'PORCUPINE')) {
                    blockedByCover = true;
                } else {
                    anyHit = true;
                    b.dead = true;
                    b.hitDelay = 20;
                    b.dropY = drawY;
                    score += b.pts;
                    stats[b.slot]++;
                    popups.push({
                        text: `+${b.pts}`,
                        x: Math.max(6, Math.min(VIEW_W - 44, drawX + w * 0.25)),
                        y: Math.max(24, drawY),
                        life: 1.0
                    });
                }
            }
        });

        if (!anyHit && activeLevel === 'WOODS' && isShotBlockedByBlind(aimX, aimY, 0, false)) {
            blockedByCover = true;
        }

        if (blockedByCover && !anyHit) {
            playBlockedShotSound();
            popups.push({
                text: 'BLOCKED!',
                x: Math.max(8, Math.min(VIEW_W - 64, aimX - 24)),
                y: aimY,
                life: 0.9
            });
        } else {
            playShootSound();
        }

        updateUI();
    }

    function moveCrosshair(dx, dy) {
        if (state !== 'PLAYING' || isPaused) return;
        let nx = crosshair.x + dx;
        let ny = crosshair.y + dy;
        if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
            crosshair.x = nx;
            crosshair.y = ny;
        }
    }

    function openLevelSelect() {
        state = 'SELECT';
        hudTop.style.display = 'none';
        clearInputStates();
        playMenuBlip(350, 460);
    }

    function openIntroCutscene() {
        activeLevel = LEVELS[selectedLevelIdx].id;
        state = 'INTRO';
        introFrame = 0;
        hudTop.style.display = 'none';
        clearInputStates();
        playMenuBlip(420, 540);
    }

    function startGame() {
        activeLevel = LEVELS[selectedLevelIdx].id;
        state = 'PLAYING';
        isPaused = false;
        score = 0; timeLeft = 300; lastTime = Math.floor(Date.now() / 1000);
        stats = { c1: 0, c2: 0, c3: 0, c4: 0 };
        isLoaded = true; gunDropY = 0; entities = []; popups = [];
        crosshair = { x: 5, y: 5 };
        gunAim = { x: (crosshair.x + 0.5) * TILE_W, y: (crosshair.y + 0.5) * TILE_H };
        flashEffect = 0;

        rareSpawned = 0;
        const willAppear = Math.random() < 0.65;
        if (willAppear) {
            rareTriggerTimes = [95 + Math.floor(Math.random() * 145)];
        } else {
            rareTriggerTimes = [];
        }

        hudTop.style.display = 'flex';
        startChiptuneTrack();
        updateUI();
    }

    function endGame() {
        state = 'OUTRO';
        outroFrame = 0;
        outroCountStep = 0;
        outroDisp = { c1: 0, c2: 0, c3: 0, c4: 0, total: 0 };
        hudTop.style.display = 'none';
        stopChiptuneTrack();
        clearInputStates();
    }

    // --- ARCADE CABINET postMessage BRIDGE ---
    const dpadState = {
        UP:    { active: false, lastTapTime: 0, holdDelayTimer: null, glideInterval: null, streamWatchdog: null },
        DOWN:  { active: false, lastTapTime: 0, holdDelayTimer: null, glideInterval: null, streamWatchdog: null },
        LEFT:  { active: false, lastTapTime: 0, holdDelayTimer: null, glideInterval: null, streamWatchdog: null },
        RIGHT: { active: false, lastTapTime: 0, holdDelayTimer: null, glideInterval: null, streamWatchdog: null }
    };

    const dirVectors = {
        UP:    [0, -1],
        DOWN:  [0, 1],
        LEFT:  [-1, 0],
        RIGHT: [1, 0]
    };

    let lastBtnATime = 0;
    let lastBtnBTime = 0;
    let lastMenuNavTime = 0;
    const BTN_DEBOUNCE_MS = 110;
    const MENU_DEBOUNCE_MS = 160;
    const TAP_LOCKOUT_MS = 190;
    const HOLD_THRESHOLD_MS = 310;
    const GLIDE_STEP_MS = 165;
    const STREAM_RELEASE_MS = 180;

    function releaseDir(dir) {
        const entry = dpadState[dir];
        if (!entry) return;
        entry.active = false;
        if (entry.holdDelayTimer) { clearTimeout(entry.holdDelayTimer); entry.holdDelayTimer = null; }
        if (entry.glideInterval) { clearInterval(entry.glideInterval); entry.glideInterval = null; }
        if (entry.streamWatchdog) { clearTimeout(entry.streamWatchdog); entry.streamWatchdog = null; }
    }

    function clearInputStates() {
        releaseDir('UP');
        releaseDir('DOWN');
        releaseDir('LEFT');
        releaseDir('RIGHT');
    }

    function handleDirSignal(dir, isPulse) {
        if (isPaused) return;

        if (state === 'SELECT') {
            const now = Date.now();
            if (now - lastMenuNavTime < MENU_DEBOUNCE_MS) return;
            if (dir === 'UP' && selectedLevelIdx !== 0) {
                selectedLevelIdx = 0;
                lastMenuNavTime = now;
                playMenuBlip(360);
            } else if (dir === 'DOWN' && selectedLevelIdx !== 1) {
                selectedLevelIdx = 1;
                lastMenuNavTime = now;
                playMenuBlip(300);
            }
            return;
        }

        if (state !== 'PLAYING') return;
        const entry = dpadState[dir];
        const [dx, dy] = dirVectors[dir];
        const now = Date.now();

        if (!entry.active) {
            entry.active = true;

            if (now - entry.lastTapTime >= TAP_LOCKOUT_MS) {
                moveCrosshair(dx, dy);
                entry.lastTapTime = now;
            }

            entry.holdDelayTimer = setTimeout(() => {
                if (!isPaused && state === 'PLAYING' && entry.active) {
                    moveCrosshair(dx, dy);
                    entry.glideInterval = setInterval(() => {
                        if (!isPaused && state === 'PLAYING' && entry.active) {
                            moveCrosshair(dx, dy);
                        }
                    }, GLIDE_STEP_MS);
                }
            }, HOLD_THRESHOLD_MS);
        }

        if (entry.streamWatchdog) clearTimeout(entry.streamWatchdog);
        entry.streamWatchdog = setTimeout(() => releaseDir(dir), STREAM_RELEASE_MS);
    }

    window.addEventListener('message', function(event) {
        const raw = event.data;
        const cmd = typeof raw === 'string' ? raw : (raw && (raw.type || raw.cmd || raw.action));
        if (!cmd) return;

        if (cmd === 'PAUSE') {
            isPaused = true;
            clearInputStates();
            if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'running') {
                chiptuneAudioCtx.suspend();
            }
            return;
        }
        if (cmd === 'RESUME') {
            if (isPaused) {
                isPaused = false;
                lastTime = Math.floor(Date.now() / 1000);
                if (chiptuneAudioCtx && chiptuneAudioCtx.state === 'suspended' && state === 'PLAYING') {
                    chiptuneAudioCtx.resume();
                }
            }
            return;
        }

        if (isPaused) return;

        const now = Date.now();
        if (cmd === 'BUTTON_A' || cmd === 'BUTTON_A_PRESS') {
            if (now - lastBtnATime < BTN_DEBOUNCE_MS) return;
            lastBtnATime = now;
            if (state === 'TITLE' || state === 'OUTRO') openLevelSelect();
            else if (state === 'SELECT') openIntroCutscene();
            else if (state === 'INTRO') startGame();
            else if (state === 'PLAYING') fireGun();
            return;
        }
        if (cmd === 'BUTTON_B' || cmd === 'BUTTON_B_PRESS') {
            if (now - lastBtnBTime < BTN_DEBOUNCE_MS) return;
            lastBtnBTime = now;
            if (state === 'SELECT') {
                state = 'TITLE';
                playMenuBlip(280, 200);
            } else if (state === 'INTRO') {
                openLevelSelect();
            } else if (state === 'PLAYING') {
                isLoaded = true;
                updateUI();
            }
            return;
        }

        if (cmd === 'DPAD_UP') handleDirSignal('UP', true);
        else if (cmd === 'DPAD_UP_PRESS') handleDirSignal('UP', false);
        else if (cmd === 'DPAD_UP_RELEASE') releaseDir('UP');

        else if (cmd === 'DPAD_DOWN') handleDirSignal('DOWN', true);
        else if (cmd === 'DPAD_DOWN_PRESS') handleDirSignal('DOWN', false);
        else if (cmd === 'DPAD_DOWN_RELEASE') releaseDir('DOWN');

        else if (cmd === 'DPAD_LEFT') handleDirSignal('LEFT', true);
        else if (cmd === 'DPAD_LEFT_PRESS') handleDirSignal('LEFT', false);
        else if (cmd === 'DPAD_LEFT_RELEASE') releaseDir('LEFT');

        else if (cmd === 'DPAD_RIGHT') handleDirSignal('RIGHT', true);
        else if (cmd === 'DPAD_RIGHT_PRESS') handleDirSignal('RIGHT', false);
        else if (cmd === 'DPAD_RIGHT_RELEASE') releaseDir('RIGHT');
    });

    updateUI();
    loop();
</script>
</body>
</html>
