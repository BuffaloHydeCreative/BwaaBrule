<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Glace Rouge — Red River Curling</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #091a24;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #game-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #091a24;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>

<script>
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');

  // Dynamic Fullscreen Resolution Engine (maintains crisp 320px logical width, adapts height to fill full screen without letterboxing)
  let VIEW_W = 320;
  let VIEW_H = 240;

  function resizeViewport() {
    const container = document.getElementById('game-container');
    const rect = container.getBoundingClientRect();
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);
    const aspect = h / w;

    VIEW_W = 320;
    VIEW_H = Math.max(220, Math.min(540, Math.round(VIEW_W * aspect)));
    cvs.width = VIEW_W;
    cvs.height = VIEW_H;
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, dur, vol = 0.09) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function playSweepNoise() {
    if (!audioCtx) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.08);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  }
  function playStoneClack(intensity = 1) {
    if (!audioCtx) return;
    const vol = Math.min(0.45, Math.max(0.08, intensity * 0.25));
    playTone(210, 'triangle', 0.07, vol);
    playTone(540, 'square', 0.04, vol * 0.7);
  }

  // --- 16-BIT SNES MASTER PALETTE ---
  const PAL = {
    DARK_GREEN: '#0E2A1E', MUTED_GREEN: '#3D5948', LUSH_GREEN: '#A8D038', BRIGHT_GREEN: '#88A326',
    GOLD: '#F7C844', ORANGE: '#FB6604', RED: '#AD1C21', BORDEAUX: '#540E11',
    OCEAN: '#0F6F9E', SEA_GREEN: '#12AEA2', ICE_LIGHT: '#E0F7FA', ICE_MID: '#80DEEA', ICE_DARK: '#00838F',
    HIDE: '#D4D0C5', WHITE: '#FFFFFF', BLACK: '#111111', GRAY_DARK: '#2C2C2C', GRAY_LIGHT: '#8E99A2',
    SKIN: '#E0A97B',
    LIMESTONE_LIGHT: '#EAE6DC', LIMESTONE_MID: '#D4D0C5', LIMESTONE_DARK: '#9C9688',
    SPRUCE_DARK: '#0D261C', SPRUCE_MID: '#1B4332', SPRUCE_LIGHT: '#2D6A4F',
    PRAIRIE_GOLD: '#D4A338', PRAIRIE_TAN: '#E5BE67', PRAIRIE_BROWN: '#8C6229'
  };

  // --- MULTI-LAYERED PARALLAX SNOWFALL & RED RIVER VALLEY DATA ---
  const SNOW_LAYERS = [
    // Far fine snow (slow drift, small 1x1 flakes)
    Array.from({ length: 38 }, (_, i) => ({
      x: (i * 89) % 320,
      y: (i * 53) % 540,
      spdY: 0.25 + (i % 3) * 0.08,
      drift: (i % 2 === 0 ? 1 : -1) * 0.15,
      phase: i * 0.7,
      size: 1,
      color: 'rgba(224, 247, 250, 0.55)'
    })),
    // Mid blizzard flakes (medium speed, 2x1 / 2x2 flakes)
    Array.from({ length: 28 }, (_, i) => ({
      x: (i * 113 + 17) % 320,
      y: (i * 71 + 29) % 540,
      spdY: 0.55 + (i % 4) * 0.12,
      drift: (i % 3 === 0 ? 1 : -1) * 0.35,
      phase: i * 1.1,
      size: 2,
      color: 'rgba(255, 255, 255, 0.80)'
    })),
    // Near foreground heavy snow gusts (fast fall, crisp 2x2 / 3x2 flakes)
    Array.from({ length: 16 }, (_, i) => ({
      x: (i * 137 + 41) % 320,
      y: (i * 97 + 13) % 540,
      spdY: 1.05 + (i % 3) * 0.22,
      drift: 0.65,
      phase: i * 1.9,
      size: 2,
      color: '#FFFFFF'
    }))
  ];

  const SKY_CLOUDS = [
    { x: 20,  y: 16, w: 46, spd: 0.06 },
    { x: 145, y: 26, w: 58, spd: 0.04 },
    { x: 255, y: 12, w: 40, spd: 0.07 }
  ];

  // --- RINKS CONFIGURATION ---
  const RINKS = [
    {
      name: 'THE FORKS',
      sub: 'UPPER FORT GARRY & ASSINIBOINE',
      desc: 'CONJUNCTION OF RED & ASSINIBOINE RIVERS',
      status: 'OPEN',
      ends: 3
    },
    {
      name: 'LOWER FORT GARRY',
      sub: 'STONE FORT & SHIELD SHORE',
      desc: 'COMING SOON',
      status: 'LOCKED',
      ends: 3
    },
    {
      name: 'ST. BONIFACE BEND',
      sub: 'CATHEDRAL & POINT DOUGLAS',
      desc: 'COMING SOON',
      status: 'LOCKED',
      ends: 3
    }
  ];

  // --- GAME STATE ---
  let state = 'TITLE';
  let frame = 0;
  let selectedRinkIdx = 0;
  let isPaused = false;

  let currentEnd = 1;
  const totalEnds = 3;
  let stonesPerTeam = 4;
  let playerStonesThrown = 0;
  let aiStonesThrown = 0;
  let isPlayerTurn = true;
  let playerTotalScore = 0;
  let aiTotalScore = 0;
  let lastEndWinner = '';
  let lastEndPoints = 0;

  // --- RINK GEOMETRY ---
  const WORLD_H = 1200;
  const HOUSE_X = 160;
  const HOUSE_Y = 215;
  const HOUSE_R = 46;
  const BACK_Y = 158;
  const FAR_HOG_Y = 335;
  const NEAR_HOG_Y = 1085;
  const HACK_X = 160;
  const HACK_Y = 1145;
  const STONE_R = 7;

  const BANK_LEFT_X = 53;
  const BANK_RIGHT_X = 267;
  const SLOPE_ZONE = 24;

  // Focused Down-Rink Scout Camera (frames Far Hog Line & full House without overshooting into sky)
  const SCOUT_CAM_Y = 132;

  // --- REALISTIC CURLING KINEMATICS ---
  const ICE_DECEL = 0.0155;

  const MARKER_HOG_PCT    = 25;
  const MARKER_HOUSE_PCT  = 50;
  const MARKER_BUTTON_PCT = 62.5;
  const MARKER_BACK_PCT   = 75;

  const DIST_ZERO  = 690;
  const DIST_HOG   = HACK_Y - FAR_HOG_Y;               // 810px
  const DIST_HOUSE = HACK_Y - (HOUSE_Y + HOUSE_R);     // 884px
  const DIST_BACK  = HACK_Y - BACK_Y;                  // 987px
  const DIST_MAX   = 1750;

  function getTargetDistanceFromPower(rawPct) {
    const p = Math.max(0, Math.min(100, rawPct));
    if (p <= MARKER_HOG_PCT) {
      const t = p / MARKER_HOG_PCT;
      return DIST_ZERO + t * (DIST_HOG - DIST_ZERO);
    } else if (p <= MARKER_HOUSE_PCT) {
      const t = (p - MARKER_HOG_PCT) / (MARKER_HOUSE_PCT - MARKER_HOG_PCT);
      return DIST_HOG + t * (DIST_HOUSE - DIST_HOG);
    } else if (p <= MARKER_BACK_PCT) {
      const t = (p - MARKER_HOUSE_PCT) / (MARKER_BACK_PCT - MARKER_HOUSE_PCT);
      return DIST_HOUSE + t * (DIST_BACK - DIST_HOUSE);
    } else {
      const t = (p - MARKER_BACK_PCT) / (100 - MARKER_BACK_PCT);
      return DIST_BACK + Math.pow(t, 1.35) * (DIST_MAX - DIST_BACK);
    }
  }

  function getReleaseSpeedFromPower(rawPct) {
    const dist = getTargetDistanceFromPower(rawPct);
    return Math.sqrt(2 * ICE_DECEL * dist);
  }

  function predictStoppingDistance(v0) {
    return (v0 * v0) / (2 * ICE_DECEL);
  }

  function getHackCamY() {
    return Math.max(0, WORLD_H - VIEW_H);
  }

  let camY = getHackCamY();
  let targetCamY = getHackCamY();

  let aimAngle = -Math.PI / 2;
  let powerVal = 0;
  let powerDir = 0.625;
  let spinDir = -1;

  let stones = [];
  let activeStone = null;
  let sweepHeat = 0;
  let sweepPulse = 0;
  let sweeperAnim = 0;
  let aiThinkTimer = 0;
  let settleDelay = 0;
  let statusBanner = '';

  // --- POSTMESSAGE JOYSTICK & BUTTON INPUT ENGINE (PULSE + HOLD DECAY & DEBOUNCE) ---
  // Matches the parent index.html drag-joystick (initial pulse + 100ms repeat) and prevents double-firing
  const dpadExpiry = { UP: 0, DOWN: 0, LEFT: 0, RIGHT: 0 };
  const DPAD_HOLD_WINDOW_MS = 145;
  let lastBtnATime = 0;
  let lastBtnBTime = 0;
  const BTN_DEBOUNCE_MS = 110;

  function isDpadHeld(dir) {
    return performance.now() < dpadExpiry[dir];
  }

  function clearAllInputs() {
    dpadExpiry.UP = 0;
    dpadExpiry.DOWN = 0;
    dpadExpiry.LEFT = 0;
    dpadExpiry.RIGHT = 0;
  }

  function startMatch() {
    currentEnd = 1;
    playerTotalScore = 0;
    aiTotalScore = 0;
    startNewEnd();
  }

  function startNewEnd() {
    stones = [];
    playerStonesThrown = 0;
    aiStonesThrown = 0;
    isPlayerTurn = (currentEnd % 2 === 1);
    prepareNextShot();
  }

  function prepareNextShot() {
    if (playerStonesThrown >= stonesPerTeam && aiStonesThrown >= stonesPerTeam) {
      evaluateEndScore();
      return;
    }

    activeStone = {
      x: HACK_X,
      y: HACK_Y,
      vx: 0,
      vy: 0,
      spin: 0,
      angularVel: 0,
      angle: 0,
      team: isPlayerTurn ? 'PLAYER' : 'AI',
      crossedHog: false
    };

    sweepHeat = 0;
    sweepPulse = 0;
    sweeperAnim = 0;
    settleDelay = 0;

    if (isPlayerTurn) {
      aimAngle = -Math.PI / 2;
      powerVal = 0;
      powerDir = 0.625;
      state = 'AIM';
      statusBanner = `END ${currentEnd}/${totalEnds} • STONE ${playerStonesThrown + 1}/${stonesPerTeam}`;
      targetCamY = getHackCamY();
    } else {
      state = 'AI_PREP';
      aiThinkTimer = 50;
      statusBanner = `END ${currentEnd}/${totalEnds} • HBC STONE ${aiStonesThrown + 1}/${stonesPerTeam}`;
      targetCamY = getHackCamY();
    }
  }

  function releaseStone(launchSpeed, lockedSpin, angle) {
    activeStone.vx = Math.cos(angle) * launchSpeed;
    activeStone.vy = Math.sin(angle) * launchSpeed;
    activeStone.spin = lockedSpin;
    activeStone.angularVel = lockedSpin * 0.042;
    activeStone.angle = 0;
    stones.push(activeStone);

    if (activeStone.team === 'PLAYER') playerStonesThrown++;
    else aiStonesThrown++;

    playTone(180, 'triangle', 0.14, 0.14);
    statusBanner = activeStone.team === 'PLAYER' ? "TAP 'A' TO SWEEP PEBBLE!" : "OFFICER RELEASES!";
    state = 'SLIDE';
  }

  function triggerSweep() {
    if (state !== 'SLIDE' || !activeStone || activeStone.team !== 'PLAYER') return;
    if (activeStone.y < HOUSE_Y - 6) return;

    const spd = Math.hypot(activeStone.vx, activeStone.vy);
    if (spd > 0.35) {
      sweepPulse = Math.min(1.0, sweepPulse + 0.55);
      sweepHeat = Math.min(100, sweepHeat + 24);
      sweeperAnim = 12;
      playSweepNoise();
    }
  }

  // --- AI SHOT PLANNER ---
  function executeAIShot() {
    let bestPlayerStone = null;
    let bestPlayerDist = 999;
    for (let s of stones) {
      if (s.team === 'PLAYER') {
        let d = Math.hypot(s.x - HOUSE_X, s.y - HOUSE_Y);
        if (d < bestPlayerDist) { bestPlayerDist = d; bestPlayerStone = s; }
      }
    }

    let targetX = HOUSE_X + (Math.random() - 0.5) * 14;
    let targetY = HOUSE_Y + (Math.random() - 0.5) * 14;
    let aiSpin = Math.random() > 0.5 ? 1 : -1;
    let isTakeout = (bestPlayerStone && bestPlayerDist < 28 && Math.random() < 0.55);

    if (isTakeout) {
      targetX = bestPlayerStone.x;
      targetY = bestPlayerStone.y;
    }

    let travelDist = Math.hypot(targetX - HACK_X, targetY - HACK_Y);
    let aiSpeed = isTakeout
      ? (6.45 + Math.random() * 0.55)
      : (Math.sqrt(2 * ICE_DECEL * travelDist) + (Math.random() - 0.5) * 0.14);

    let curlCompensation = isTakeout ? 4 : 11;
    let compensatedX = targetX - (aiSpin * curlCompensation);
    let aiAngle = Math.atan2(targetY - HACK_Y, compensatedX - HACK_X);
    releaseStone(aiSpeed, aiSpin, aiAngle);
  }

  // --- REALISTIC CURLING PEBBLE FRICTION, CONTROLLED LATE HOOK & END-BOARD ELIMINATION ---
  function updatePhysics() {
    let anyMoving = false;

    if (activeStone && activeStone.team === 'AI' && activeStone.y > HOUSE_Y + 35 && activeStone.y < NEAR_HOG_Y - 80) {
      const spd = Math.hypot(activeStone.vx, activeStone.vy);
      if (spd > 1.4 && spd < 3.6 && Math.random() < 0.12) {
        sweepPulse = Math.min(1.0, sweepPulse + 0.45);
        sweepHeat = Math.min(100, sweepHeat + 18);
        sweeperAnim = 10;
      }
    }

    if (sweepPulse > 0) sweepPulse = Math.max(0, sweepPulse - 0.065);
    if (sweepHeat > 0) sweepHeat = Math.max(0, sweepHeat - 1.8);
    if (sweeperAnim > 0) sweeperAnim--;

    for (let i = 0; i < stones.length; i++) {
      let s = stones[i];
      let spd = Math.hypot(s.vx, s.vy);

      if (spd > 0.025) {
        anyMoving = true;

        let isSwept = (s === activeStone && sweepPulse > 0.05);
        let sweepFactor = isSwept ? sweepPulse : 0;

        // 1. Controlled realistic late-break curl
        let speedRatio = Math.min(1.0, spd / 6.2);
        let crawlDamp = Math.min(1.0, spd / 0.75);
        let lateBreakWeight = Math.pow(1.0 - speedRatio, 1.35) * crawlDamp;
        let effectiveSpin = s.spin * (1.0 - 0.65 * sweepFactor);
        let curlAccel = effectiveSpin * (0.0009 + 0.0042 * lateBreakWeight);

        s.vx += curlAccel;
        s.angle += s.angularVel * Math.min(1.0, spd / 2.2);

        // 2. Natural inward-sloping riverbank ice shelves
        const leftSlopeEdge = BANK_LEFT_X + SLOPE_ZONE;
        const rightSlopeEdge = BANK_RIGHT_X - SLOPE_ZONE;
        let bankDrag = 0;

        if (s.x < leftSlopeEdge) {
          let slopeDepth = Math.min(1.4, (leftSlopeEdge - s.x) / SLOPE_ZONE);
          s.vx += 0.028 * slopeDepth;
          bankDrag = 0.008 * slopeDepth;
        } else if (s.x > rightSlopeEdge) {
          let slopeDepth = Math.min(1.4, (s.x - rightSlopeEdge) / SLOPE_ZONE);
          s.vx -= 0.028 * slopeDepth;
          bankDrag = 0.008 * slopeDepth;
        }

        s.x += s.vx;
        s.y += s.vy;

        // 3. Standard Curling Boundary Rules (Side boards OR End board = instant elimination)
        if (s.x - STONE_R <= BANK_LEFT_X || s.x + STONE_R >= BANK_RIGHT_X) {
          s.outOfBounds = true;
          if (s === activeStone) statusBanner = "OUT OF PLAY — HIT SIDE BANK!";
          playTone(110, 'sawtooth', 0.14, 0.12);
          continue;
        }

        if (s.y - STONE_R <= BACK_Y) {
          s.outOfBounds = true;
          if (s === activeStone) statusBanner = "OUT OF PLAY — HIT END BOARD!";
          playTone(110, 'sawtooth', 0.14, 0.12);
          continue;
        }

        // 4. True Kinetic Ice Friction
        let currentDecel = ICE_DECEL * (1.0 - 0.28 * sweepFactor) + bankDrag;
        if (spd < 0.45) currentDecel += (0.45 - spd) * 0.024;

        let newSpd = Math.max(0, spd - currentDecel);
        let scale = newSpd / spd;
        s.vx *= scale;
        s.vy *= scale;

        if (s.y <= FAR_HOG_Y) s.crossedHog = true;
      } else {
        if (s.x < BANK_LEFT_X + 10) {
          s.x += 0.20;
          anyMoving = true;
        } else if (s.x > BANK_RIGHT_X - 10) {
          s.x -= 0.20;
          anyMoving = true;
        } else {
          s.vx = 0;
          s.vy = 0;
        }
      }
    }

    // 5. Elastic Granite Stone-to-Stone Collisions
    for (let i = 0; i < stones.length; i++) {
      for (let j = i + 1; j < stones.length; j++) {
        let a = stones[i];
        let b = stones[j];
        if (a.outOfBounds || b.outOfBounds) continue;

        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let dist = Math.hypot(dx, dy);
        const minDist = STONE_R * 2;

        if (dist > 0 && dist < minDist) {
          let overlap = (minDist - dist) * 0.5;
          let nx = dx / dist;
          let ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;

          let rvx = b.vx - a.vx;
          let rvy = b.vy - a.vy;
          let velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal < 0) {
            const restitution = 0.90;
            let impulse = -(1 + restitution) * velAlongNormal * 0.5;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;

            b.spin = -a.spin * 0.30;
            b.angularVel = b.spin * 0.03;
            playStoneClack(Math.abs(velAlongNormal));
          }
        }
      }
    }

    stones = stones.filter(s => !s.outOfBounds);

    if (activeStone && !activeStone.outOfBounds) {
      targetCamY = Math.max(SCOUT_CAM_Y, Math.min(getHackCamY(), activeStone.y - Math.floor(VIEW_H * 0.48)));
    } else {
      targetCamY = SCOUT_CAM_Y;
    }

    if (!anyMoving) {
      settleDelay++;
      if (settleDelay > 28) {
        stones = stones.filter(s => s.y <= FAR_HOG_Y);
        activeStone = null;
        isPlayerTurn = !isPlayerTurn;
        prepareNextShot();
      }
    } else {
      settleDelay = 0;
    }
  }

  // --- CURLING END SCORING ---
  function evaluateEndScore() {
    const maxRingR = HOUSE_R + STONE_R;
    let inHouse = stones
      .map(s => ({ team: s.team, dist: Math.hypot(s.x - HOUSE_X, s.y - HOUSE_Y) }))
      .filter(s => s.dist <= maxRingR)
      .sort((a, b) => a.dist - b.dist);

    if (inHouse.length === 0) {
      lastEndWinner = 'BLANK';
      lastEndPoints = 0;
    } else {
      const winnerTeam = inHouse[0].team;
      let pts = 0;
      for (let item of inHouse) {
        if (item.team === winnerTeam) pts++;
        else break;
      }
      lastEndWinner = winnerTeam;
      lastEndPoints = pts;
      if (winnerTeam === 'PLAYER') {
        playerTotalScore += pts;
        playTone(587, 'square', 0.25);
      } else {
        aiTotalScore += pts;
        playTone(196, 'sawtooth', 0.25);
      }
    }

    targetCamY = SCOUT_CAM_Y;
    state = 'END_SUMMARY';
  }

  // --- INPUT HANDLING (DEBOUNCED BUTTONS + JOYSTICK CARDINAL PULSES) ---
  function handleA() {
    const now = performance.now();
    if (now - lastBtnATime < BTN_DEBOUNCE_MS) return;
    lastBtnATime = now;
    if (isPaused) return;

    initAudio();
    if (state === 'TITLE') {
      playTone(440, 'square', 0.1);
      state = 'RINK_SELECT';
    }
    else if (state === 'RINK_SELECT') {
      if (RINKS[selectedRinkIdx].status === 'OPEN') {
        playTone(523, 'square', 0.12);
        startMatch();
      } else {
        playTone(160, 'sawtooth', 0.1);
      }
    }
    else if (state === 'AIM') {
      playTone(392, 'square', 0.08);
      powerVal = 0;
      powerDir = 0.625;
      state = 'POWER';
      statusBanner = `LOCKED ${spinDir < 0 ? 'LEFT' : 'RIGHT'} CURL • SET WEIGHT!`;
    }
    else if (state === 'POWER') {
      const launchSpd = getReleaseSpeedFromPower(powerVal);
      releaseStone(launchSpd, spinDir, aimAngle);
    }
    else if (state === 'SLIDE') {
      triggerSweep();
    }
    else if (state === 'END_SUMMARY') {
      playTone(440, 'square', 0.1);
      if (currentEnd >= totalEnds) {
        state = 'MATCH_OVER';
      } else {
        currentEnd++;
        startNewEnd();
      }
    }
    else if (state === 'MATCH_OVER') {
      playTone(440, 'square', 0.1);
      state = 'RINK_SELECT';
    }
  }

  function handleB() {
    const now = performance.now();
    if (now - lastBtnBTime < BTN_DEBOUNCE_MS) return;
    lastBtnBTime = now;
    if (isPaused) return;

    initAudio();
    if (state === 'AIM') {
      spinDir *= -1;
      playTone(340, 'triangle', 0.06);
    } else if (state === 'SLIDE') {
      triggerSweep();
    } else if (state === 'RINK_SELECT') {
      state = 'TITLE';
      playTone(300, 'triangle', 0.06);
    }
  }

  function handleDpadPulse(dir) {
    if (isPaused) return;
    const now = performance.now();
    const wasAlreadyHeld = now < dpadExpiry[dir];
    dpadExpiry[dir] = now + DPAD_HOLD_WINDOW_MS;

    if (state === 'RINK_SELECT') {
      if (dir === 'UP') {
        selectedRinkIdx = (selectedRinkIdx + RINKS.length - 1) % RINKS.length;
        playTone(320, 'triangle', 0.05);
      }
      if (dir === 'DOWN') {
        selectedRinkIdx = (selectedRinkIdx + 1) % RINKS.length;
        playTone(320, 'triangle', 0.05);
      }
    } else if (state === 'AIM' && !wasAlreadyHeld) {
      // Immediate crisp single-step nudge on initial joystick flick; holding continues smoothly in update()
      if (dir === 'LEFT')  aimAngle = Math.max(-Math.PI * 0.68, aimAngle - 0.014);
      if (dir === 'RIGHT') aimAngle = Math.min(-Math.PI * 0.32, aimAngle + 0.014);
    }
  }

  // --- UPDATE LOOP ---
  function update() {
    if (isPaused) return;
    frame++;

    // Update multi-layer falling snow particles
    for (let l = 0; l < SNOW_LAYERS.length; l++) {
      const layer = SNOW_LAYERS[l];
      for (let f of layer) {
        f.y += f.spdY;
        f.x += f.drift + Math.sin(frame * 0.03 + f.phase) * (0.18 + l * 0.12);
        if (f.y > VIEW_H) {
          f.y = -4;
          f.x = (f.x + 73) % VIEW_W;
        }
        if (f.x < 0) f.x += VIEW_W;
        if (f.x >= VIEW_W) f.x -= VIEW_W;
      }
    }

    // Drift background clouds
    for (let c of SKY_CLOUDS) {
      c.x += c.spd;
      if (c.x > VIEW_W + 20) c.x = -c.w - 10;
    }

    if (state === 'AIM') {
      if (isDpadHeld('LEFT'))  aimAngle = Math.max(-Math.PI * 0.68, aimAngle - 0.010);
      if (isDpadHeld('RIGHT')) aimAngle = Math.min(-Math.PI * 0.32, aimAngle + 0.010);

      if (isDpadHeld('UP')) targetCamY = SCOUT_CAM_Y;
      else targetCamY = getHackCamY();
    }
    else if (state === 'POWER') {
      targetCamY = getHackCamY();
      const norm = powerVal / 100;
      const accelMultiplier = 0.42 + Math.pow(norm, 1.55) * 2.35;
      powerVal += powerDir * accelMultiplier;

      if (powerVal >= 100) {
        powerVal = 100;
        powerDir = -Math.abs(powerDir);
      }
      if (powerVal <= 0) {
        powerVal = 0;
        powerDir = Math.abs(powerDir);
      }
    }
    else if (state === 'AI_PREP') {
      aiThinkTimer--;
      if (aiThinkTimer <= 0) {
        executeAIShot();
      }
    }
    else if (state === 'SLIDE') {
      updatePhysics();
    }

    camY += (targetCamY - camY) * 0.14;
  }

  // --- SNES PIXEL ART RENDERING HELPERS ---
  function drawPixelText(txt, x, y, size, color, align = 'left', shadow = true) {
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textAlign = align;
    if (shadow) {

      ctx.fillText(txt, x + 1, y + 1);

    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
  }

  // Render a specific depth layer of falling snow
  function drawSnowLayer(layerIdx, maxY = VIEW_H) {
    const layer = SNOW_LAYERS[layerIdx];
    for (let f of layer) {
      if (f.y <= maxY) {
        ctx.fillStyle = f.color;
        ctx.fillRect(Math.round(f.x), Math.round(f.y), f.size, f.size);
      }
    }
  }

  function drawSnowSpruce(x, y, hScale = 1) {
    const w = Math.floor(14 * hScale);
    const trunkH = Math.floor(5 * hScale);
    ctx.fillStyle = '#3E2723';
    ctx.fillRect(x + Math.floor(w / 2) - 1, y + Math.floor(20 * hScale), 3, trunkH);

    const tiers = [
      { ty: 0,  tw: 4,  th: 5 },
      { ty: 4,  tw: 8,  th: 5 },
      { ty: 9,  tw: 11, th: 6 },
      { ty: 14, tw: 14, th: 6 }
    ];
    tiers.forEach(t => {
      let bx = x + Math.floor((w - t.tw * hScale) / 2);
      let by = y + Math.floor(t.ty * hScale);
      let bw = Math.floor(t.tw * hScale);
      let bh = Math.floor(t.th * hScale);

      ctx.fillStyle = PAL.SPRUCE_DARK;
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = PAL.SPRUCE_MID;
      ctx.fillRect(bx + 1, by, Math.max(1, bw - 3), bh - 1);
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(bx, by, bw, Math.max(1, Math.floor(2 * hScale)));
      ctx.fillStyle = PAL.ICE_MID;
      ctx.fillRect(bx + 1, by + Math.max(1, Math.floor(2 * hScale)), Math.max(1, bw - 2), 1);
    });

  // --- MULTI-LAYER PARALLAX RED RIVER VALLEY BACKDROP + LAYERED SNOWFALL ---
  function drawRedRiverValleyBackdrop(offsetY, parallaxShift = 0) {
    // Layer 0: Deep Winter Sub-Arctic Sky Banding
    ctx.fillStyle = '#18364F';
    ctx.fillRect(0, offsetY, VIEW_W, 38);
    ctx.fillStyle = '#386A8C';
    ctx.fillRect(0, offsetY + 32, VIEW_W, 26);
    ctx.fillStyle = '#6EA5C9';
    ctx.fillRect(0, offsetY + 56, VIEW_W, 22);

    // Layer 1: Slow Drifting Winter Sky Clouds (Parallax Factor 0.15)
    for (let c of SKY_CLOUDS) {
      let cx = Math.round((c.x + parallaxShift * 0.15) % (VIEW_W + 60));
      if (cx < -60) cx += VIEW_W + 60;
      let cy = offsetY + c.y;
      ctx.fillStyle = 'rgba(224, 247, 250, 0.28)';
      ctx.fillRect(cx + 4, cy, c.w - 8, 5);
      ctx.fillRect(cx, cy + 3, c.w, 4);
    }

    // Far fine snow layer falling behind distant treeline
    drawSnowLayer(0, offsetY + 118);

    // Layer 2: Distant Red River Valley Horizon Treeline Silhouette (Parallax Factor 0.25)
    ctx.fillStyle = '#26495C';
    for (let hx = -40; hx < VIEW_W + 60; hx += 36) {
      let tx = Math.round(hx + ((parallaxShift * 0.25) % 36));
      ctx.fillRect(tx, offsetY + 66, 24, 12);
      ctx.fillRect(tx + 5, offsetY + 61, 14, 5);
      ctx.fillRect(tx + 9, offsetY + 57, 6, 4);
    }

    // Layer 3: Snow-Covered North Bank & Point Douglas / Forks Terraces
    ctx.fillStyle = PAL.ICE_LIGHT;
    ctx.fillRect(0, offsetY + 72, VIEW_W, 42);
    ctx.fillStyle = '#C5DCE8';
    ctx.fillRect(0, offsetY + 96, VIEW_W, 18);

    // Mid-layer snowfall drifting across the snowbanks
    drawSnowLayer(1, offsetY + 118);

    // Layer 4: Midground Spruce Groves, Assiniboine Conjunction & Upper Fort Garry (Parallax Factor 0.55)
    const midShift = Math.round(parallaxShift * 0.55);

    drawSnowSpruce(14 + midShift, offsetY + 52, 1.1);
    drawSnowSpruce(32 + midShift, offsetY + 58, 0.9);
    drawWinterGrassClump(56 + midShift, offsetY + 75);
    drawWinterGrassClump(76 + midShift, offsetY + 78);

    // Incoming Frozen Assiniboine Conjunction Notch
    ctx.fillStyle = '#9BB8C9';
    ctx.fillRect(58 + midShift, offsetY + 86, 62, 12);
    ctx.fillStyle = PAL.ICE_DARK;
    ctx.fillRect(62 + midShift, offsetY + 90, 56, 22);
    ctx.fillStyle = PAL.ICE_MID;
    ctx.fillRect(66 + midShift, offsetY + 94, 52, 20);
    ctx.fillStyle = PAL.WHITE;
    ctx.fillRect(72 + midShift, offsetY + 99, 18, 2);
    ctx.fillRect(88 + midShift, offsetY + 106, 22, 2);

    // Upper Fort Garry
    drawWinterUpperFortGarry(124 + midShift, offsetY + 38, 0.88);

    drawSnowSpruce(256 + midShift, offsetY + 55, 1.05);
    drawSnowSpruce(278 + midShift, offsetY + 60, 0.9);
    drawWinterGrassClump(242 + midShift, offsetY + 78);
    drawWinterGrassClump(296 + midShift, offsetY + 80);

    // Layer 5: Foreground Riverbank Snow Ledge & Reeds (Parallax Factor 1.0)
    ctx.fillStyle = PAL.ICE_DARK;
    ctx.fillRect(0, offsetY + 112, VIEW_W, 6);
    drawWinterGrassClump(18, offsetY + 106);
    drawWinterGrassClump(44, offsetY + 107);
    drawWinterGrassClump(134, offsetY + 106);
    drawWinterGrassClump(178, offsetY + 107);
    drawWinterGrassClump(232, offsetY + 106);
    drawWinterGrassClump(282, offsetY + 107);
  }

  function drawCurlingStone(x, y, team, spinAngle = 0, isGlowing = false) {
    const sx = Math.round(x);
    const sy = Math.round(y);

    ctx.fillStyle = 'rgba(0, 40, 60, 0.35)';
    ctx.fillRect(sx - 6, sy + 4, 12, 4);

    if (isGlowing && sweepHeat > 15) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.fillRect(sx - 9, sy - 9, 18, 18);
    }

    ctx.fillStyle = PAL.BLACK;
    ctx.fillRect(sx - 5, sy - 7, 10, 14);
    ctx.fillRect(sx - 7, sy - 5, 14, 10);

    ctx.fillStyle = '#4A525D';
    ctx.fillRect(sx - 4, sy - 6, 8, 12);
    ctx.fillRect(sx - 6, sy - 4, 12, 8);

    ctx.fillStyle = '#7D8794';
    ctx.fillRect(sx - 4, sy - 5, 6, 4);

    ctx.fillStyle = team === 'PLAYER' ? PAL.GOLD : PAL.SEA_GREEN;
    ctx.fillRect(sx - 6, sy - 1, 12, 2);

    ctx.fillStyle = team === 'PLAYER' ? PAL.RED : PAL.OCEAN;
    ctx.fillRect(sx - 3, sy - 3, 6, 6);
    ctx.fillStyle = PAL.WHITE;
    let hx = Math.round(Math.cos(spinAngle) * 2);
    let hy = Math.round(Math.sin(spinAngle) * 2);
    ctx.fillRect(sx - 1 + hx, sy - 1 + hy, 2, 2);
  }

  function drawSweeper(x, y, animTick) {
    const sx = Math.round(x);

    ctx.fillStyle = PAL.BLACK;
    ctx.fillRect(sx - 4, sy - 12, 8, 14);
    ctx.fillStyle = '#1A4B84';
    ctx.fillRect(sx - 3, sy - 8, 6, 8);
    ctx.fillStyle = PAL.RED;
    ctx.fillRect(sx - 3, sy - 4, 6, 2);
    ctx.fillRect(sx - 3, sy - 13, 6, 3);
    ctx.fillStyle = PAL.SKIN;
    ctx.fillRect(sx - 2, sy - 10, 4, 2);

    ctx.fillStyle = '#7B3F1D';
    ctx.fillRect(sx - 10 + sweepOffset, sy - 6, 8, 2);
    ctx.fillStyle = PAL.GOLD;
    ctx.fillRect(sx - 14 + sweepOffset, sy - 4, 6, 4);
  }

  // --- DRAW FROZEN RIVER RINK SHEET ---
  function drawFrozenRink() {
    ctx.save();
    ctx.translate(0, -Math.round(camY));

    // Parallax horizontal pan subtly linked to aimAngle during AIM so the valley feels alive
    const aimPan = (state === 'AIM' || state === 'POWER') ? Math.round((aimAngle + Math.PI / 2) * 16) : 0;
    drawRedRiverValleyBackdrop(0, aimPan);

    ctx.fillStyle = PAL.ICE_LIGHT;
    ctx.fillRect(0, 118, 52, WORLD_H - 118);
    ctx.fillRect(268, 118, 52, WORLD_H - 118);

    ctx.fillStyle = PAL.BORDEAUX;
    ctx.fillRect(50, 118, 3, WORLD_H - 118);
    ctx.fillRect(267, 118, 3, WORLD_H - 118);

    for (let sy = 135; sy < WORLD_H - 30; sy += 75) {
      drawSnowSpruce(10, sy, 0.95);
      drawWinterGrassClump(34, sy + 16);
      drawSnowSpruce(286, sy + 20, 0.95);
      drawWinterGrassClump(272, sy + 6);
    }

    ctx.fillStyle = PAL.ICE_MID;
    ctx.fillRect(53, 118, 214, WORLD_H - 118);

    ctx.fillStyle = '#8FE3EE';
    ctx.fillRect(53, 118, SLOPE_ZONE, WORLD_H - 118);
    ctx.fillRect(267 - SLOPE_ZONE, 118, SLOPE_ZONE, WORLD_H - 118);

    ctx.fillStyle = '#A8ECF4';
    ctx.fillRect(77, 118, 166, WORLD_H - 118);
    ctx.fillStyle = '#C0F3F9';
    ctx.fillRect(102, 118, 116, WORLD_H - 118);

    ctx.fillStyle = PAL.ICE_DARK;
    for (let iy = 135; iy < WORLD_H - 25; iy += 48) {
      ctx.fillRect(58, iy, 6, 1);
      ctx.fillRect(64, iy + 3, 5, 1);
      ctx.fillRect(256, iy, 6, 1);
      ctx.fillRect(251, iy + 3, 5, 1);

      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(88, iy + 14, 14, 1);
      ctx.fillRect(216, iy + 30, 16, 1);
      ctx.fillStyle = PAL.ICE_DARK;
    }

    function drawPixelCircle(cx, cy, r, color) {
      ctx.fillStyle = color;
      for (let dy = -r; dy <= r; dy++) {
        let dx = Math.floor(Math.sqrt(r * r - dy * dy));
        ctx.fillRect(cx - dx, cy + dy, dx * 2, 1);
      }
    }
    drawPixelCircle(HOUSE_X, HOUSE_Y, HOUSE_R, PAL.OCEAN);
    drawPixelCircle(HOUSE_X, HOUSE_Y, 31, PAL.WHITE);
    drawPixelCircle(HOUSE_X, HOUSE_Y, 16, PAL.RED);
    drawPixelCircle(HOUSE_X, HOUSE_Y, 5, PAL.GOLD);

    ctx.fillStyle = 'rgba(14, 42, 30, 0.35)';
    ctx.fillRect(HOUSE_X, 130, 1, WORLD_H - 150);
    ctx.fillRect(53, HOUSE_Y, 214, 1);

    ctx.fillStyle = '#4A220D';
    ctx.fillRect(50, BACK_Y - 3, 220, 3);
    ctx.fillStyle = PAL.BORDEAUX;
    ctx.fillRect(53, BACK_Y, 214, 2);
    drawPixelText("END BOARD", 160, BACK_Y - 5, 5, PAL.BORDEAUX, 'center', false);

    ctx.fillRect(53, FAR_HOG_Y, 214, 3);
    drawPixelText("FAR HOG LINE", 60, FAR_HOG_Y - 3, 5, PAL.BORDEAUX, 'left', false);

    ctx.fillRect(53, NEAR_HOG_Y, 214, 3);
    drawPixelText("HOG LINE", 60, NEAR_HOG_Y - 3, 5, PAL.BORDEAUX, 'left', false);

    ctx.fillStyle = '#4A220D';
    ctx.fillRect(HACK_X - 14, HACK_Y + 4, 10, 5);
    ctx.fillRect(HACK_X + 4, HACK_Y + 4, 10, 5);

    if ((state === 'AIM' || state === 'POWER') && activeStone) {
      let previewSpd = (state === 'AIM') ? getReleaseSpeedFromPower(MARKER_BUTTON_PCT) : getReleaseSpeedFromPower(powerVal);
      let previewDist = predictStoppingDistance(previewSpd);
      let isTakeoutSpd = previewSpd > 6.1;
      let totalLateralBreak = spinDir * (isTakeoutSpd ? 4 : 12);

      const steps = 18;
      for (let step = 1; step <= steps; step++) {
        let t = step / steps;
        let straightX = activeStone.x + Math.cos(aimAngle) * (previewDist * t);
        let straightY = activeStone.y + Math.sin(aimAngle) * (previewDist * t);
        let curlBend = totalLateralBreak * Math.pow(t, 2.0);
        let px = Math.round(straightX + curlBend);
        let py = Math.round(straightY);

        if (py > BACK_Y) {
          ctx.fillStyle = (step % 2 === 0) ? PAL.GOLD : PAL.RED;
          ctx.fillRect(px - 1, py - 1, 3, 3);
        }
      }
    }

    for (let s of stones) {
      drawCurlingStone(s.x, s.y, s.team, s.angle || 0, s === activeStone);
    }

    if ((state === 'AIM' || state === 'POWER' || state === 'AI_PREP') && activeStone) {
      drawCurlingStone(activeStone.x, activeStone.y, activeStone.team, spinDir * 0.5, false);
    }

    if (state === 'SLIDE' && activeStone && sweeperAnim > 0) {
      drawSweeper(activeStone.x + 16, activeStone.y - 4, frame);
    }

    ctx.restore();

    // Foreground Heavy Snow Gusts falling across the active rink viewport
    drawSnowLayer(2, VIEW_H - 44);
  }

  // --- MAIN RENDER LOOP ---
  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE') {
      // Full-height Red River Valley Winter Parallax Scene with 3-Layer Falling Snow
      const valleyY = Math.max(76, Math.floor(VIEW_H * 0.34));
      const gentleSway = Math.sin(frame * 0.008) * 14;

      // Upper Winter Sky Fill for taller viewports
      ctx.fillStyle = '#0e2336';
      ctx.fillRect(0, 0, VIEW_W, valleyY + 10);

      drawRedRiverValleyBackdrop(valleyY, gentleSway);

      // Frozen River Ice Foreground stretching cleanly to the bottom of the fullscreen viewport
      const iceTop = valleyY + 116;
      ctx.fillStyle = PAL.ICE_MID;
      ctx.fillRect(0, iceTop, VIEW_W, VIEW_H - iceTop);
      ctx.fillStyle = '#A8ECF4';
      ctx.fillRect(36, iceTop, VIEW_W - 72, VIEW_H - iceTop);

      // Ice cracks & sheen
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(54, iceTop + 14, 28, 2);
      ctx.fillRect(218, iceTop + 26, 32, 2);

      // Foreground Snow Layer across the full scene
      drawSnowLayer(2, VIEW_H);

      // Decorative Curling Stones on the Ice
      const stoneY = Math.min(VIEW_H - 22, iceTop + 22);
      drawCurlingStone(122, stoneY, 'PLAYER', frame * 0.02, false);
      drawCurlingStone(198, stoneY, 'AI', -frame * 0.02, false);

      // SNES Title Banner
      const bannerY = Math.max(12, Math.floor(valleyY * 0.16));
      ctx.fillStyle = 'rgba(14, 42, 30, 0.92)';
      ctx.fillRect(16, bannerY, 288, 66);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(16, bannerY, 288, 66);

      drawPixelText("LA GLACE ROUGE", 160, bannerY + 26, 16, PAL.GOLD, 'center');
      drawPixelText("RED RIVER CURLING AT THE FORKS", 160, bannerY + 42, 6, PAL.HIDE, 'center');
      if (frame % 50 < 30) {
        drawPixelText("PRESS 'A' TO STEP ONTO THE ICE", 160, bannerY + 58, 7, PAL.SEA_GREEN, 'center');
      }
    }
    else if (state === 'RINK_SELECT') {
      // Live Red River Valley Winter Parallax & Snowfall behind the Rink Select Menu
      const valleyY = Math.max(40, Math.floor(VIEW_H * 0.25));
      ctx.fillStyle = '#0e2336';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawRedRiverValleyBackdrop(valleyY, Math.sin(frame * 0.008) * 10);
      ctx.fillStyle = PAL.ICE_MID;
      ctx.fillRect(0, valleyY + 116, VIEW_W, VIEW_H - (valleyY + 116));
      drawSnowLayer(2, VIEW_H);

      ctx.fillStyle = 'rgba(14, 42, 30, 0.86)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.strokeStyle = PAL.HIDE; ctx.lineWidth = 2;
      ctx.strokeRect(4, 4, VIEW_W - 8, VIEW_H - 8);

      const topY = Math.max(24, Math.floor((VIEW_H - 210) * 0.4));
      drawPixelText("SELECT FROZEN RINK", 160, topY, 11, PAL.GOLD, 'center');
      drawPixelText("WINTER 1850 • RED RIVER VALLEY", 160, topY + 13, 6, PAL.SEA_GREEN, 'center');

      for (let i = 0; i < RINKS.length; i++) {
        const r = RINKS[i];
        const y = topY + 24 + i * 54;
        const isSel = (i === selectedRinkIdx);
        const isOpen = (r.status === 'OPEN');

        ctx.fillStyle = isSel ? 'rgba(84, 14, 17, 0.92)' : 'rgba(17, 17, 17, 0.82)';
        ctx.fillRect(16, y, 288, 46);
        ctx.strokeStyle = isSel ? PAL.GOLD : (isOpen ? PAL.SEA_GREEN : PAL.GRAY_DARK);
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.strokeRect(16, y, 288, 46);

        if (isSel) {
          drawPixelText(">", 24, y + 27, 10, PAL.GOLD);
        }

        drawPixelText(r.name, 40, y + 18, 9, isOpen ? PAL.WHITE : PAL.GRAY_LIGHT);
        drawPixelText(r.sub, 40, y + 30, 5, isOpen ? PAL.HIDE : PAL.GRAY_DARK);

        if (isOpen) {
          drawPixelText("3 ENDS • 4 ROCKS • OPEN ICE", 40, y + 40, 5, PAL.LUSH_GREEN);
          drawPixelText("PLAY", 294, y + 27, 8, PAL.GOLD, 'right');
        } else {
          drawPixelText("COMING SOON", 294, y + 27, 7, PAL.ORANGE, 'right');
        }
      }

      drawPixelText("UP/DOWN: RINK   A: START MATCH", 160, VIEW_H - 14, 6, PAL.WHITE, 'center');
    }
    else {
      drawFrozenRink();

      // --- TOP SCOREBOARD HUD ---
      ctx.fillStyle = 'rgba(17, 17, 17, 0.92)';
      ctx.fillRect(0, 0, VIEW_W, 24);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(0, 24, VIEW_W, 2);

      drawPixelText(`YOU:${playerTotalScore}`, 8, 15, 7, PAL.GOLD);
      for (let i = 0; i < stonesPerTeam; i++) {
        ctx.fillStyle = i < (stonesPerTeam - playerStonesThrown) ? PAL.RED : PAL.GRAY_DARK;
        ctx.fillRect(66 + i * 8, 9, 6, 6);
      }

      drawPixelText(`END ${currentEnd}/${totalEnds}`, 160, 15, 7, PAL.WHITE, 'center');

      for (let i = 0; i < stonesPerTeam; i++) {
        ctx.fillStyle = i < (stonesPerTeam - aiStonesThrown) ? PAL.SEA_GREEN : PAL.GRAY_DARK;
        ctx.fillRect(216 + i * 8, 9, 6, 6);
      }
      drawPixelText(`HBC:${aiTotalScore}`, 312, 15, 7, PAL.SEA_GREEN, 'right');

      // --- FULL-WIDTH BOTTOM-SET HUD & DOWN-RINK WEIGHT BAR ---
      const hudTop = VIEW_H - 44;
      ctx.fillStyle = 'rgba(14, 42, 30, 0.94)';
      ctx.fillRect(0, hudTop, VIEW_W, 44);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(0, hudTop - 1, VIEW_W, 2);

      if (state === 'AIM' || state === 'POWER') {
        let curlTxt = spinDir < 0 ? "CURL: <- LEFT (B)" : "CURL: RIGHT -> (B)";
        drawPixelText(curlTxt, 8, hudTop + 11, 5, state === 'AIM' ? PAL.GOLD : PAL.SEA_GREEN);

        let phaseHint = state === 'AIM' ? "UP:SCOUT  A:POWER" : "A:RELEASE STONE!";
        drawPixelText(phaseHint, 312, hudTop + 11, 5, state === 'POWER' ? PAL.ORANGE : PAL.WHITE, 'right');

        const barX = 6;
        const barY = hudTop + 16;
        const barW = 308;
        const barH = 14;

        const hogX    = barX + Math.round(barW * 0.25);
        const houseX  = barX + Math.round(barW * 0.50);
        const buttonX = barX + Math.round(barW * 0.625);
        const backX   = barX + Math.round(barW * 0.75);

        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(barX, barY, barW, barH);

        ctx.fillStyle = 'rgba(60, 60, 60, 0.45)';
        ctx.fillRect(barX + 1, barY + 1, hogX - barX - 1, barH - 2);

        ctx.fillStyle = 'rgba(15, 111, 158, 0.55)';
        ctx.fillRect(hogX, barY + 1, houseX - hogX, barH - 2);

        ctx.fillStyle = 'rgba(18, 174, 162, 0.72)';
        ctx.fillRect(houseX, barY + 1, backX - houseX, barH - 2);

        ctx.fillStyle = 'rgba(173, 28, 33, 0.60)';
        ctx.fillRect(backX, barY + 1, (barX + barW - 1) - backX, barH - 2);

        if (state === 'POWER') {
          let fillW = Math.round((powerVal / 100) * (barW - 2));
          ctx.fillStyle = powerVal > MARKER_BACK_PCT ? PAL.RED : (powerVal >= MARKER_HOUSE_PCT ? PAL.LUSH_GREEN : PAL.GOLD);
          ctx.fillRect(barX + 1, barY + 2, fillW, barH - 4);
        }

        ctx.fillStyle = PAL.RED;
        ctx.fillRect(hogX, barY, 2, barH);
        ctx.fillStyle = PAL.ICE_LIGHT;
        ctx.fillRect(houseX, barY, 2, barH);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(buttonX - 1, barY - 1, 2, barH + 2);
        ctx.fillStyle = PAL.ORANGE;
        ctx.fillRect(backX, barY, 2, barH);

        ctx.strokeStyle = state === 'POWER' ? PAL.GOLD : PAL.HIDE;
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        if (state === 'POWER') {
          let fillW = Math.round((powerVal / 100) * (barW - 2));
          ctx.fillStyle = PAL.WHITE;
          ctx.fillRect(barX + fillW, barY - 2, 2, barH + 4);
        }

        drawPixelText("HOG", hogX, hudTop + 40, 5, PAL.RED, 'center', false);
        drawPixelText("HOUSE", houseX, hudTop + 40, 5, PAL.ICE_LIGHT, 'center', false);
        drawPixelText("BTN", buttonX, hudTop + 40, 5, PAL.GOLD, 'center', false);
        drawPixelText("BACK", backX, hudTop + 40, 5, PAL.ORANGE, 'center', false);
        drawPixelText("OUT", barX + Math.round(barW * 0.90), hudTop + 40, 5, PAL.RED, 'center', false);
      } 
      else if (state === 'SLIDE' && activeStone && activeStone.team === 'PLAYER') {
        drawPixelText(statusBanner, 160, hudTop + 11, 6, PAL.GOLD, 'center');

        const barX = 6;
        const barY = hudTop + 17;
        const barW = 308;
        const barH = 12;

        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(barX, barY, barW, barH);
        ctx.strokeStyle = PAL.SEA_GREEN;
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        ctx.fillStyle = PAL.ICE_MID;
        ctx.fillRect(barX + 1, barY + 2, Math.round((sweepHeat / 100) * (barW - 2)), barH - 4);
        drawPixelText("SWEEP REDUCES ICE FRICTION & STRAIGHTENS CURL", 160, hudTop + 40, 5, PAL.HIDE, 'center', false);
      } 
      else {
        drawPixelText(statusBanner, 160, hudTop + 26, 6, PAL.WHITE, 'center');
      }

      if (state === 'END_SUMMARY') {
        const modalY = Math.floor((VIEW_H - 114) / 2);
        ctx.fillStyle = 'rgba(14, 42, 30, 0.94)';
        ctx.fillRect(28, modalY, 264, 114);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(28, modalY, 264, 114);

        drawPixelText(`END ${currentEnd} COMPLETE`, 160, modalY + 22, 9, PAL.GOLD, 'center');

        if (lastEndWinner === 'PLAYER') {
          drawPixelText(`YOU SCORE +${lastEndPoints} PT${lastEndPoints > 1 ? 'S' : ''}!`, 160, modalY + 46, 8, PAL.LUSH_GREEN, 'center');
        } else if (lastEndWinner === 'AI') {
          drawPixelText(`OFFICER SCORES +${lastEndPoints}!`, 160, modalY + 46, 8, PAL.RED, 'center');
        } else {
          drawPixelText("BLANK END (0 PTS)", 160, modalY + 46, 8, PAL.HIDE, 'center');
        }

        drawPixelText(`YOU ${playerTotalScore}  -  ${aiTotalScore} HBC`, 160, modalY + 70, 8, PAL.WHITE, 'center');

        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' TO CONTINUE", 160, modalY + 98, 7, PAL.GOLD, 'center');
        }
      }

      if (state === 'MATCH_OVER') {
        const modalY = Math.floor((VIEW_H - 134) / 2);
        ctx.fillStyle = 'rgba(14, 42, 30, 0.96)';
        ctx.fillRect(22, modalY, 276, 134);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(22, modalY, 276, 134);

        drawPixelText("MATCH AT THE FORKS", 160, modalY + 24, 8, PAL.HIDE, 'center');
        if (playerTotalScore > aiTotalScore) {
          drawPixelText("VICTORY ON THE ICE!", 160, modalY + 48, 10, PAL.SEA_GREEN, 'center');
        } else if (aiTotalScore > playerTotalScore) {
          drawPixelText("OFFICERS TAKE THE MATCH", 160, modalY + 48, 8, PAL.RED, 'center');
        } else {
          drawPixelText("HONOURABLE DRAW!", 160, modalY + 48, 10, PAL.GOLD, 'center');
        }

        drawPixelText(`FINAL: YOU ${playerTotalScore} - ${aiTotalScore} HBC`, 160, modalY + 76, 8, PAL.WHITE, 'center');

        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' FOR RINK SELECT", 160, modalY + 112, 7, PAL.GOLD, 'center');
        }
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- EXCLUSIVE POSTMESSAGE JOYSTICK & BUTTON BRIDGE (NO DUPLICATE LOCAL LISTENERS) ---
  window.addEventListener('message', function(event) {
    const cmd = event.data;
    if (cmd === 'PAUSE') {
      isPaused = true;
      clearAllInputs();
      return;
    }
    if (cmd === 'RESUME') {
      isPaused = false;
      clearAllInputs();
      return;
    }

    if (cmd === 'DPAD_UP' || cmd === 'DPAD_UP_PRESS')       handleDpadPulse('UP');
    else if (cmd === 'DPAD_DOWN' || cmd === 'DPAD_DOWN_PRESS')  handleDpadPulse('DOWN');
    else if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_LEFT_PRESS')  handleDpadPulse('LEFT');
    else if (cmd === 'DPAD_RIGHT' || cmd === 'DPAD_RIGHT_PRESS') handleDpadPulse('RIGHT');
    else if (cmd === 'DPAD_UP_RELEASE')    dpadExpiry.UP = 0;
    else if (cmd === 'DPAD_DOWN_RELEASE')  dpadExpiry.DOWN = 0;
    else if (cmd === 'DPAD_LEFT_RELEASE')  dpadExpiry.LEFT = 0;
    else if (cmd === 'DPAD_RIGHT_RELEASE') dpadExpiry.RIGHT = 0;
    else if (cmd === 'BUTTON_A') handleA();
    else if (cmd === 'BUTTON_B') handleB();
  });

  loop();
</script>
</body>
</html>
