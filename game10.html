<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Glace Rouge — Red River Curling</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<style>
  body {
    margin: 0; padding: 0;
    background: #06131c;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; width: 100vw;
    font-family: 'Press Start 2P', monospace;
    user-select: none; touch-action: manipulation; overflow: hidden;
  }
  #vanta-bg {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }
  #game-container {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%; max-width: 600px;
    display: flex; flex-direction: column; justify-content: center;
    box-sizing: border-box; padding: 10px;
  }
  #screen-container {
    flex: 0 0 auto; width: 100%;
    aspect-ratio: 4 / 3; 
    border: 4px solid #D4D0C5; 
    position: relative; background: transparent; 
    overflow: hidden; box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(0,0,0,0.85);
  }
  canvas {
    width: 100%; height: 100%;
    display: block; image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="vanta-bg"></div>
<div id="game-container">
  <div id="screen-container">
    <canvas id="gameCanvas" width="320" height="240"></canvas>
  </div>
</div>

<script>
  // --- VANTA.JS SUB-GLACIAL WINTER RIVER MIST & AURORA BACKDROP ---
  try {
    if (window.VANTA) {
      VANTA.FOG({
        el: "#vanta-bg",
        mouseControls: false,
        touchControls: false,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        highlightColor: 0x12aea2,
        midtoneColor: 0x0f6f9e,
        lowlightColor: 0x0e2a1e,
        baseColor: 0x091a24,
        blurFactor: 0.65,
        speed: 1.10,
        zoom: 1.25
      });
    }
  } catch (e) {}

  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, dur, vol = 0.09) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function playSweepNoise() {
    if (!audioCtx) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.08);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  }
  function playStoneClack(intensity = 1) {
    if (!audioCtx) return;
    const vol = Math.min(0.45, Math.max(0.08, intensity * 0.25));
    playTone(210, 'triangle', 0.07, vol);
    playTone(540, 'square', 0.04, vol * 0.7);
  }

  // --- 16-BIT SNES MASTER PALETTE ---
  const PAL = {
    DARK_GREEN: '#0E2A1E', MUTED_GREEN: '#3D5948', LUSH_GREEN: '#A8D038', BRIGHT_GREEN: '#88A326',
    GOLD: '#F7C844', ORANGE: '#FB6604', RED: '#AD1C21', BORDEAUX: '#540E11',
    OCEAN: '#0F6F9E', SEA_GREEN: '#12AEA2', ICE_LIGHT: '#E0F7FA', ICE_MID: '#80DEEA', ICE_DARK: '#00838F',
    HIDE: '#D4D0C5', WHITE: '#FFFFFF', BLACK: '#111111', GRAY_DARK: '#2C2C2C', GRAY_LIGHT: '#8E99A2',
    SKIN: '#E0A97B',
    LIMESTONE_LIGHT: '#EAE6DC', LIMESTONE_MID: '#D4D0C5', LIMESTONE_DARK: '#9C9688',
    SPRUCE_DARK: '#0D261C', SPRUCE_MID: '#1B4332', SPRUCE_LIGHT: '#2D6A4F',
    PRAIRIE_GOLD: '#D4A338', PRAIRIE_TAN: '#E5BE67', PRAIRIE_BROWN: '#8C6229'
  };

  // --- RINKS CONFIGURATION ---
  const RINKS = [
    {
      name: 'THE FORKS',
      sub: 'UPPER FORT GARRY & ASSINIBOINE',
      desc: 'CONJUNCTION OF RED & ASSINIBOINE RIVERS',
      status: 'OPEN',
      ends: 3
    },
    {
      name: 'LOWER FORT GARRY',
      sub: 'STONE FORT & SHIELD SHORE',
      desc: 'COMING SOON',
      status: 'LOCKED',
      ends: 3
    },
    {
      name: 'ST. BONIFACE BEND',
      sub: 'CATHEDRAL & POINT DOUGLAS',
      desc: 'COMING SOON',
      status: 'LOCKED',
      ends: 3
    }
  ];

  // --- GAME STATE ---
  let state = 'TITLE';
  let frame = 0;
  let selectedRinkIdx = 0;

  let currentEnd = 1;
  const totalEnds = 3;
  let stonesPerTeam = 4; // 4 rocks per team (half a regular 8-rock curling end)
  let playerStonesThrown = 0;
  let aiStonesThrown = 0;
  let isPlayerTurn = true;
  let playerTotalScore = 0;
  let aiTotalScore = 0;
  let lastEndWinner = '';
  let lastEndPoints = 0;

  // --- RINK GEOMETRY ---
  const WORLD_H = 1200;
  const HOUSE_X = 160;
  const HOUSE_Y = 215;
  const HOUSE_R = 46;
  const BACK_Y = 158;
  const FAR_HOG_Y = 335;
  const NEAR_HOG_Y = 1085;
  const HACK_X = 160;
  const HACK_Y = 1145;
  const STONE_R = 7;

  const BANK_LEFT_X = 53;
  const BANK_RIGHT_X = 267;
  const SLOPE_ZONE = 24;

  // Focused Down-Rink Scout Camera (frames Far Hog Line at bottom of visible ice & full House in center, without overshooting into sky)
  const SCOUT_CAM_Y = 132;

  // --- REALISTIC CURLING KINEMATICS ---
  const ICE_DECEL = 0.0155;

  // Piecewise Down-Rink Weight Bar Landmarks (Dedicates 75% of the bar to playable shot precision!):
  // 0%   -> Short / Near-Hog approach (dist = 690px)
  // 25%  -> Far Hog Line (HACK_Y - FAR_HOG_Y = 810px)
  // 50%  -> Top of House (HACK_Y - (HOUSE_Y + HOUSE_R) = 884px)
  // 62.5%-> Button Center (HACK_Y - HOUSE_Y = 930px)
  // 75%  -> Back of House / End Board (HACK_Y - BACK_Y = 987px)
  // 100% -> Takeout / Overshot Surge (dist = 1750px -> v0 = 7.36)
  const MARKER_HOG_PCT    = 25;
  const MARKER_HOUSE_PCT  = 50;
  const MARKER_BUTTON_PCT = 62.5;
  const MARKER_BACK_PCT   = 75;

  const DIST_ZERO  = 690;
  const DIST_HOG   = HACK_Y - FAR_HOG_Y;               // 810px
  const DIST_HOUSE = HACK_Y - (HOUSE_Y + HOUSE_R);     // 884px
  const DIST_BACK  = HACK_Y - BACK_Y;                  // 987px
  const DIST_MAX   = 1750;                             // High takeout weight

  function getTargetDistanceFromPower(rawPct) {
    const p = Math.max(0, Math.min(100, rawPct));
    if (p <= MARKER_HOG_PCT) {
      const t = p / MARKER_HOG_PCT;
      return DIST_ZERO + t * (DIST_HOG - DIST_ZERO);
    } else if (p <= MARKER_HOUSE_PCT) {
      const t = (p - MARKER_HOG_PCT) / (MARKER_HOUSE_PCT - MARKER_HOG_PCT);
      return DIST_HOG + t * (DIST_HOUSE - DIST_HOG);
    } else if (p <= MARKER_BACK_PCT) {
      const t = (p - MARKER_HOUSE_PCT) / (MARKER_BACK_PCT - MARKER_HOUSE_PCT);
      return DIST_HOUSE + t * (DIST_BACK - DIST_HOUSE);
    } else {
      // Final 25% of bar ramps rapidly into heavy takeout weight
      const t = (p - MARKER_BACK_PCT) / (100 - MARKER_BACK_PCT);
      return DIST_BACK + Math.pow(t, 1.35) * (DIST_MAX - DIST_BACK);
    }
  }

  function getReleaseSpeedFromPower(rawPct) {
    const dist = getTargetDistanceFromPower(rawPct);
    return Math.sqrt(2 * ICE_DECEL * dist);
  }

  function predictStoppingDistance(v0) {
    return (v0 * v0) / (2 * ICE_DECEL);
  }

  let camY = WORLD_H - 240;
  let targetCamY = WORLD_H - 240;

  let aimAngle = -Math.PI / 2;
  let powerVal = 0;
  let powerDir = 0.625; // Half base speed with exponential acceleration curve
  let spinDir = -1;

  let stones = [];
  let activeStone = null;
  let sweepHeat = 0;
  let sweepPulse = 0;
  let sweeperAnim = 0;
  let aiThinkTimer = 0;
  let settleDelay = 0;
  let statusBanner = '';

  let dpad = { up: false, down: false, left: false, right: false };

  function startMatch() {
    currentEnd = 1;
    playerTotalScore = 0;
    aiTotalScore = 0;
    startNewEnd();
  }

  function startNewEnd() {
    stones = [];
    playerStonesThrown = 0;
    aiStonesThrown = 0;
    isPlayerTurn = (currentEnd % 2 === 1);
    prepareNextShot();
  }

  function prepareNextShot() {
    if (playerStonesThrown >= stonesPerTeam && aiStonesThrown >= stonesPerTeam) {
      evaluateEndScore();
      return;
    }

    activeStone = {
      x: HACK_X,
      y: HACK_Y,
      vx: 0,
      vy: 0,
      spin: 0,
      angularVel: 0,
      angle: 0,
      team: isPlayerTurn ? 'PLAYER' : 'AI',
      crossedHog: false
    };

    sweepHeat = 0;
    sweepPulse = 0;
    sweeperAnim = 0;
    settleDelay = 0;

    if (isPlayerTurn) {
      aimAngle = -Math.PI / 2;
      powerVal = 0;
      powerDir = 0.625;
      state = 'AIM';
      statusBanner = `END ${currentEnd}/${totalEnds} • STONE ${playerStonesThrown + 1}/${stonesPerTeam}`;
      targetCamY = WORLD_H - 240;
    } else {
      state = 'AI_PREP';
      aiThinkTimer = 50;
      statusBanner = `END ${currentEnd}/${totalEnds} • HBC STONE ${aiStonesThrown + 1}/${stonesPerTeam}`;
      targetCamY = WORLD_H - 240;
    }
  }

  function releaseStone(launchSpeed, lockedSpin, angle) {
    activeStone.vx = Math.cos(angle) * launchSpeed;
    activeStone.vy = Math.sin(angle) * launchSpeed;
    activeStone.spin = lockedSpin;
    activeStone.angularVel = lockedSpin * 0.042;
    activeStone.angle = 0;
    stones.push(activeStone);

    if (activeStone.team === 'PLAYER') playerStonesThrown++;
    else aiStonesThrown++;

    playTone(180, 'triangle', 0.14, 0.14);
    statusBanner = activeStone.team === 'PLAYER' ? "TAP 'A' TO SWEEP PEBBLE!" : "OFFICER RELEASES!";
    state = 'SLIDE';
  }

  function triggerSweep() {
    if (state !== 'SLIDE' || !activeStone || activeStone.team !== 'PLAYER') return;
    if (activeStone.y < HOUSE_Y - 6) return;

    const spd = Math.hypot(activeStone.vx, activeStone.vy);
    if (spd > 0.35) {
      sweepPulse = Math.min(1.0, sweepPulse + 0.55);
      sweepHeat = Math.min(100, sweepHeat + 24);
      sweeperAnim = 12;
      playSweepNoise();
    }
  }

  // --- AI SHOT PLANNER ---
  function executeAIShot() {
    let bestPlayerStone = null;
    let bestPlayerDist = 999;
    for (let s of stones) {
      if (s.team === 'PLAYER') {
        let d = Math.hypot(s.x - HOUSE_X, s.y - HOUSE_Y);
        if (d < bestPlayerDist) { bestPlayerDist = d; bestPlayerStone = s; }
      }
    }

    let targetX = HOUSE_X + (Math.random() - 0.5) * 14;
    let targetY = HOUSE_Y + (Math.random() - 0.5) * 14;
    let aiSpin = Math.random() > 0.5 ? 1 : -1;
    let isTakeout = (bestPlayerStone && bestPlayerDist < 28 && Math.random() < 0.55);

    if (isTakeout) {
      targetX = bestPlayerStone.x;
      targetY = bestPlayerStone.y;
    }

    let travelDist = Math.hypot(targetX - HACK_X, targetY - HACK_Y);
    let aiSpeed = isTakeout
      ? (6.45 + Math.random() * 0.55)
      : (Math.sqrt(2 * ICE_DECEL * travelDist) + (Math.random() - 0.5) * 0.14);

    let curlCompensation = isTakeout ? 4 : 11;
    let compensatedX = targetX - (aiSpin * curlCompensation);
    let aiAngle = Math.atan2(targetY - HACK_Y, compensatedX - HACK_X);
    releaseStone(aiSpeed, aiSpin, aiAngle);
  }

  // --- REALISTIC CURLING PEBBLE FRICTION, CONTROLLED LATE HOOK & END-BOARD ELIMINATION ---
  function updatePhysics() {
    let anyMoving = false;

    if (activeStone && activeStone.team === 'AI' && activeStone.y > HOUSE_Y + 35 && activeStone.y < NEAR_HOG_Y - 80) {
      const spd = Math.hypot(activeStone.vx, activeStone.vy);
      if (spd > 1.4 && spd < 3.6 && Math.random() < 0.12) {
        sweepPulse = Math.min(1.0, sweepPulse + 0.45);
        sweepHeat = Math.min(100, sweepHeat + 18);
        sweeperAnim = 10;
      }
    }

    if (sweepPulse > 0) sweepPulse = Math.max(0, sweepPulse - 0.065);
    if (sweepHeat > 0) sweepHeat = Math.max(0, sweepHeat - 1.8);
    if (sweeperAnim > 0) sweeperAnim--;

    for (let i = 0; i < stones.length; i++) {
      let s = stones[i];
      let spd = Math.hypot(s.vx, s.vy);

      if (spd > 0.025) {
        anyMoving = true;

        let isSwept = (s === activeStone && sweepPulse > 0.05);
        let sweepFactor = isSwept ? sweepPulse : 0;

        // 1. Controlled realistic late-break curl
        let speedRatio = Math.min(1.0, spd / 6.2);
        let crawlDamp = Math.min(1.0, spd / 0.75);
        let lateBreakWeight = Math.pow(1.0 - speedRatio, 1.35) * crawlDamp;
        let effectiveSpin = s.spin * (1.0 - 0.65 * sweepFactor);
        let curlAccel = effectiveSpin * (0.0009 + 0.0042 * lateBreakWeight);

        s.vx += curlAccel;
        s.angle += s.angularVel * Math.min(1.0, spd / 2.2);

        // 2. Natural inward-sloping riverbank ice shelves
        const leftSlopeEdge = BANK_LEFT_X + SLOPE_ZONE;
        const rightSlopeEdge = BANK_RIGHT_X - SLOPE_ZONE;
        let bankDrag = 0;

        if (s.x < leftSlopeEdge) {
          let slopeDepth = Math.min(1.4, (leftSlopeEdge - s.x) / SLOPE_ZONE);
          s.vx += 0.028 * slopeDepth;
          bankDrag = 0.008 * slopeDepth;
        } else if (s.x > rightSlopeEdge) {
          let slopeDepth = Math.min(1.4, (s.x - rightSlopeEdge) / SLOPE_ZONE);
          s.vx -= 0.028 * slopeDepth;
          bankDrag = 0.008 * slopeDepth;
        }

        s.x += s.vx;
        s.y += s.vy;

        // 3. Standard Curling Boundary Rules (Side boards OR End board = instant elimination)
        if (s.x - STONE_R <= BANK_LEFT_X || s.x + STONE_R >= BANK_RIGHT_X) {
          s.outOfBounds = true;
          if (s === activeStone) statusBanner = "OUT OF PLAY — HIT SIDE BANK!";
          playTone(110, 'sawtooth', 0.14, 0.12);
          continue;
        }

        if (s.y - STONE_R <= BACK_Y) {
          s.outOfBounds = true;
          if (s === activeStone) statusBanner = "OUT OF PLAY — HIT END BOARD!";
          playTone(110, 'sawtooth', 0.14, 0.12);
          continue;
        }

        // 4. True Kinetic Ice Friction
        let currentDecel = ICE_DECEL * (1.0 - 0.28 * sweepFactor) + bankDrag;
        if (spd < 0.45) currentDecel += (0.45 - spd) * 0.024;

        let newSpd = Math.max(0, spd - currentDecel);
        let scale = newSpd / spd;
        s.vx *= scale;
        s.vy *= scale;

        if (s.y <= FAR_HOG_Y) s.crossedHog = true;
      } else {
        if (s.x < BANK_LEFT_X + 10) {
          s.x += 0.20;
          anyMoving = true;
        } else if (s.x > BANK_RIGHT_X - 10) {
          s.x -= 0.20;
          anyMoving = true;
        } else {
          s.vx = 0;
          s.vy = 0;
        }
      }
    }

    // 5. Elastic Granite Stone-to-Stone Collisions
    for (let i = 0; i < stones.length; i++) {
      for (let j = i + 1; j < stones.length; j++) {
        let a = stones[i];
        let b = stones[j];
        if (a.outOfBounds || b.outOfBounds) continue;

        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let dist = Math.hypot(dx, dy);
        const minDist = STONE_R * 2;

        if (dist > 0 && dist < minDist) {
          let overlap = (minDist - dist) * 0.5;
          let nx = dx / dist;
          let ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;

          let rvx = b.vx - a.vx;
          let rvy = b.vy - a.vy;
          let velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal < 0) {
            const restitution = 0.90;
            let impulse = -(1 + restitution) * velAlongNormal * 0.5;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;

            b.spin = -a.spin * 0.30;
            b.angularVel = b.spin * 0.03;
            playStoneClack(Math.abs(velAlongNormal));
          }
        }
      }
    }

    stones = stones.filter(s => !s.outOfBounds);

    if (activeStone && !activeStone.outOfBounds) {
      targetCamY = Math.max(SCOUT_CAM_Y, Math.min(WORLD_H - 240, activeStone.y - 115));
    } else {
      targetCamY = SCOUT_CAM_Y;
    }

    if (!anyMoving) {
      settleDelay++;
      if (settleDelay > 28) {
        stones = stones.filter(s => s.y <= FAR_HOG_Y);
        activeStone = null;
        isPlayerTurn = !isPlayerTurn;
        prepareNextShot();
      }
    } else {
      settleDelay = 0;
    }
  }

  // --- CURLING END SCORING ---
  function evaluateEndScore() {
    const maxRingR = HOUSE_R + STONE_R;
    let inHouse = stones
      .map(s => ({ team: s.team, dist: Math.hypot(s.x - HOUSE_X, s.y - HOUSE_Y) }))
      .filter(s => s.dist <= maxRingR)
      .sort((a, b) => a.dist - b.dist);

    if (inHouse.length === 0) {
      lastEndWinner = 'BLANK';
      lastEndPoints = 0;
    } else {
      const winnerTeam = inHouse[0].team;
      let pts = 0;
      for (let item of inHouse) {
        if (item.team === winnerTeam) pts++;
        else break;
      }
      lastEndWinner = winnerTeam;
      lastEndPoints = pts;
      if (winnerTeam === 'PLAYER') {
        playerTotalScore += pts;
        playTone(587, 'square', 0.25);
      } else {
        aiTotalScore += pts;
        playTone(196, 'sawtooth', 0.25);
      }
    }

    targetCamY = SCOUT_CAM_Y;
    state = 'END_SUMMARY';
  }

  // --- INPUT HANDLING ---
  function handleA() {
    initAudio();
    if (state === 'TITLE') {
      playTone(440, 'square', 0.1);
      state = 'RINK_SELECT';
    }
    else if (state === 'RINK_SELECT') {
      if (RINKS[selectedRinkIdx].status === 'OPEN') {
        playTone(523, 'square', 0.12);
        startMatch();
      } else {
        playTone(160, 'sawtooth', 0.1);
      }
    }
    else if (state === 'AIM') {
      playTone(392, 'square', 0.08);
      powerVal = 0;
      powerDir = 0.625;
      state = 'POWER';
      statusBanner = `LOCKED ${spinDir < 0 ? 'LEFT' : 'RIGHT'} CURL • SET WEIGHT!`;
    }
    else if (state === 'POWER') {
      const launchSpd = getReleaseSpeedFromPower(powerVal);
      releaseStone(launchSpd, spinDir, aimAngle);
    }
    else if (state === 'SLIDE') {
      triggerSweep();
    }
    else if (state === 'END_SUMMARY') {
      playTone(440, 'square', 0.1);
      if (currentEnd >= totalEnds) {
        state = 'MATCH_OVER';
      } else {
        currentEnd++;
        startNewEnd();
      }
    }
    else if (state === 'MATCH_OVER') {
      playTone(440, 'square', 0.1);
      state = 'RINK_SELECT';
    }
  }

  function handleB() {
    initAudio();
    if (state === 'AIM') {
      spinDir *= -1;
      playTone(340, 'triangle', 0.06);
    } else if (state === 'SLIDE') {
      triggerSweep();
    } else if (state === 'RINK_SELECT') {
      state = 'TITLE';
      playTone(300, 'triangle', 0.06);
    }
  }

  function handleDpad(dir) {
    if (state === 'RINK_SELECT') {
      if (dir === 'UP') {
        selectedRinkIdx = (selectedRinkIdx + RINKS.length - 1) % RINKS.length;
        playTone(320, 'triangle', 0.05);
      }
      if (dir === 'DOWN') {
        selectedRinkIdx = (selectedRinkIdx + 1) % RINKS.length;
        playTone(320, 'triangle', 0.05);
      }
    }
  }

  // --- UPDATE LOOP ---
  function update() {
    frame++;

    if (state === 'AIM') {
      if (dpad.left)  aimAngle = Math.max(-Math.PI * 0.68, aimAngle - 0.011);
      if (dpad.right) aimAngle = Math.min(-Math.PI * 0.32, aimAngle + 0.011);

      // Hold UP to scout the Far Hog Line & House directly (frames y: 132..372 without overshooting into sky)
      if (dpad.up) targetCamY = SCOUT_CAM_Y;
      else targetCamY = WORLD_H - 240;
    }
    else if (state === 'POWER') {
      targetCamY = WORLD_H - 240;
      // Exponential bar speed-up at half overall sweep rate
      const norm = powerVal / 100;
      const accelMultiplier = 0.42 + Math.pow(norm, 1.55) * 2.35;
      powerVal += powerDir * accelMultiplier;

      if (powerVal >= 100) {
        powerVal = 100;
        powerDir = -Math.abs(powerDir);
      }
      if (powerVal <= 0) {
        powerVal = 0;
        powerDir = Math.abs(powerDir);
      }
    }
    else if (state === 'AI_PREP') {
      aiThinkTimer--;
      if (aiThinkTimer <= 0) {
        executeAIShot();
      }
    }
    else if (state === 'SLIDE') {
      updatePhysics();
    }

    camY += (targetCamY - camY) * 0.14;
  }

    function drawPixelCircle(cx, cy, r, color) {
      ctx.fillStyle = color;

      }

    drawPixelCircle(HOUSE_X, HOUSE_Y, HOUSE_R, PAL.OCEAN);

    drawPixelCircle(HOUSE_X, HOUSE_Y, 16, PAL.RED);

    ctx.fillRect(53, HOUSE_Y, 214, 1);

    ctx.fillRect(50, BACK_Y - 3, 220, 3);
    ctx.fillStyle = PAL.BORDEAUX;
    ctx.fillRect(53, BACK_Y, 214, 2);

    ctx.fillRect(53, FAR_HOG_Y, 214, 3);
    drawPixelText("FAR HOG LINE", 60, FAR_HOG_Y - 3, 5, PAL.BORDEAUX, 'left', false);

    ctx.fillRect(53, NEAR_HOG_Y, 214, 3);
    drawPixelText("HOG LINE", 60, NEAR_HOG_Y - 3, 5, PAL.BORDEAUX, 'left', false);

    ctx.fillStyle = '#4A220D';
    ctx.fillRect(HACK_X - 14, HACK_Y + 4, 10, 5);
    ctx.fillRect(HACK_X + 4, HACK_Y + 4, 10, 5);

    if ((state === 'AIM' || state === 'POWER') && activeStone) {
      let previewSpd = (state === 'AIM') ? getReleaseSpeedFromPower(MARKER_BUTTON_PCT) : getReleaseSpeedFromPower(powerVal);
      let previewDist = predictStoppingDistance(previewSpd);
      let isTakeoutSpd = previewSpd > 6.1;
      let totalLateralBreak = spinDir * (isTakeoutSpd ? 4 : 12);

      const steps = 18;
      for (let step = 1; step <= steps; step++) {
        let t = step / steps;
        let straightX = activeStone.x + Math.cos(aimAngle) * (previewDist * t);
        let straightY = activeStone.y + Math.sin(aimAngle) * (previewDist * t);
        let curlBend = totalLateralBreak * Math.pow(t, 2.0);
        let px = Math.round(straightX + curlBend);
        let py = Math.round(straightY);

        if (py > BACK_Y) {
          ctx.fillStyle = (step % 2 === 0) ? PAL.GOLD : PAL.RED;
          ctx.fillRect(px - 1, py - 1, 3, 3);
        }
      }
    }

    for (let s of stones) {
      drawCurlingStone(s.x, s.y, s.team, s.angle || 0, s === activeStone);
    }

    if ((state === 'AIM' || state === 'POWER' || state === 'AI_PREP') && activeStone) {
      drawCurlingStone(activeStone.x, activeStone.y, activeStone.team, spinDir * 0.5, false);
    }

    if (state === 'SLIDE' && activeStone && sweeperAnim > 0) {
      drawSweeper(activeStone.x + 16, activeStone.y - 4, frame);
    }

    ctx.restore();
  }

        ctx.strokeRect(barX, barY, barW, barH);

        ctx.fillStyle = PAL.ICE_MID;
        ctx.fillRect(barX + 1, barY + 2, Math.round((sweepHeat / 100) * (barW - 2)), barH - 4);
        drawPixelText("SWEEP REDUCES ICE FRICTION & STRAIGHTENS CURL", 160, 236, 5, PAL.HIDE, 'center', false);
      } 
      else {
        drawPixelText(statusBanner, 160, 222, 6, PAL.WHITE, 'center');
      }

      if (state === 'END_SUMMARY') {
        ctx.fillStyle = 'rgba(14, 42, 30, 0.94)';
        ctx.fillRect(28, 60, 264, 114);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(28, 60, 264, 114);

        drawPixelText(`END ${currentEnd} COMPLETE`, 160, 82, 9, PAL.GOLD, 'center');

        if (lastEndWinner === 'PLAYER') {
          drawPixelText(`YOU SCORE +${lastEndPoints} PT${lastEndPoints > 1 ? 'S' : ''}!`, 160, 106, 8, PAL.LUSH_GREEN, 'center');
        } else if (lastEndWinner === 'AI') {
          drawPixelText(`OFFICER SCORES +${lastEndPoints}!`, 160, 106, 8, PAL.RED, 'center');
        } else {
          drawPixelText("BLANK END (0 PTS)", 160, 106, 8, PAL.HIDE, 'center');
        }

        drawPixelText(`YOU ${playerTotalScore}  -  ${aiTotalScore} HBC`, 160, 130, 8, PAL.WHITE, 'center');

        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' TO CONTINUE", 160, 158, 7, PAL.GOLD, 'center');
        }
      }

      if (state === 'MATCH_OVER') {
        ctx.fillStyle = 'rgba(14, 42, 30, 0.96)';
        ctx.fillRect(22, 48, 276, 134);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(22, 48, 276, 134);

        drawPixelText("MATCH AT THE FORKS", 160, 72, 8, PAL.HIDE, 'center');
        if (playerTotalScore > aiTotalScore) {
          drawPixelText("VICTORY ON THE ICE!", 160, 96, 10, PAL.SEA_GREEN, 'center');
        } else if (aiTotalScore > playerTotalScore) {
          drawPixelText("OFFICERS TAKE THE MATCH", 160, 96, 8, PAL.RED, 'center');
        } else {
          drawPixelText("HONOURABLE DRAW!", 160, 96, 10, PAL.GOLD, 'center');
        }

        drawPixelText(`FINAL: YOU ${playerTotalScore} - ${aiTotalScore} HBC`, 160, 124, 8, PAL.WHITE, 'center');

        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' FOR RINK SELECT", 160, 160, 7, PAL.GOLD, 'center');
        }
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- ARCADE CABINET POSTMESSAGE BRIDGE ---
  window.addEventListener('message', function(event) {
    const cmd = event.data;
    if (cmd === 'DPAD_UP_PRESS' || cmd === 'DPAD_UP') { dpad.up = true; handleDpad('UP'); }
    if (cmd === 'DPAD_UP_RELEASE') dpad.up = false;
    if (cmd === 'DPAD_DOWN_PRESS' || cmd === 'DPAD_DOWN') { dpad.down = true; handleDpad('DOWN'); }
    if (cmd === 'DPAD_DOWN_RELEASE') dpad.down = false;
    if (cmd === 'DPAD_LEFT_PRESS' || cmd === 'DPAD_LEFT') { dpad.left = true; handleDpad('LEFT'); }
    if (cmd === 'DPAD_LEFT_RELEASE') dpad.left = false;
    if (cmd === 'DPAD_RIGHT_PRESS' || cmd === 'DPAD_RIGHT') { dpad.right = true; handleDpad('RIGHT'); }
    if (cmd === 'DPAD_RIGHT_RELEASE') dpad.right = false;
    if (cmd === 'BUTTON_A') handleA();
    if (cmd === 'BUTTON_B') handleB();
  });

  // Keyboard fallback for standalone testing
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp')    { dpad.up = true; handleDpad('UP'); }
    if (e.key === 'ArrowDown')  { dpad.down = true; handleDpad('DOWN'); }
    if (e.key === 'ArrowLeft')  { dpad.left = true; handleDpad('LEFT'); }
    if (e.key === 'ArrowRight') { dpad.right = true; handleDpad('RIGHT'); }
    if (e.key === 'a' || e.key === 'A' || e.key === 'z' || e.key === 'Z' || e.key === 'Enter' || e.key === ' ') handleA();
    if (e.key === 'b' || e.key === 'B' || e.key === 'x' || e.key === 'X' || e.key === 'Shift') handleB();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp')    dpad.up = false;
    if (e.key === 'ArrowDown')  dpad.down = false;
    if (e.key === 'ArrowLeft')  dpad.left = false;
    if (e.key === 'ArrowRight') dpad.right = false;
  });

  loop();
</script>
</body>
</html>
