<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bwaa Brule</title>
  <style>
    :root {
      /* Top clearance so Google Sites / website builder floating headers never clip the screen */
      --site-header-clearance: max(54px, env(safe-area-inset-top, 0px));
      /* Extra bottom lift so mobile Safari/Chrome search bars + gesture bars never cover controls */
      --browser-hud-clearance: max(115px, calc(env(safe-area-inset-bottom, 0px) + 72px));
    }

    @media (min-width: 768px) {
      :root {
        --site-header-clearance: max(56px, env(safe-area-inset-top, 0px));
        --browser-hud-clearance: max(18px, env(safe-area-inset-bottom, 0px));
      }
    }

    /* Global Reset & Full-Page Embed Base */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body { 
      margin: 0; 
      padding: 0; 
      background: #050505; 
      color: #fff; 
      font-family: 'Courier New', Courier, monospace; 
      height: 100%; 
      width: 100%;
      overflow: hidden;
      touch-action: none; 
    }

    /* Full-Page Responsive Embed Shell (synced to visualViewport via JS) */
    .embed-shell {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100svh;
      background: #050505;
      padding-top: var(--site-header-clearance);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- SECTION 1: EXPANDED CRT VIEWPORT --- */
    .crt-screen {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      border-top: 2px solid #1d1d1d;
      border-bottom: 2px solid #222;
    }

    .screen-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none; 
    }

    #boot-splash {
      background: #000;
      z-index: 15;
      display: flex; 
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #introCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      z-index: 2;
    }

    /* --- SYSTEM SAVE WARNING LOADING SCREEN --- */
    #loading-warning {
      background: #000;
      z-index: 15;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .warning-box {
      width: 92%;
      max-width: 390px;
      background: #06090e;
      border: 2px solid #F7C844;
      box-shadow: 0 0 24px rgba(247, 200, 68, 0.2), inset 0 0 14px rgba(0, 0, 0, 0.9);
      padding: 18px 16px;
      text-align: center;
    }

    .warning-badge {
      display: inline-block;
      background: #AD1C21;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 3px 10px;
      margin-bottom: 12px;
      border: 1px solid #F7C844;
    }

    .warning-text {
      color: #F7C844;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.45;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .loading-bar-track {
      width: 100%;
      height: 14px;
      background: #111622;
      border: 1.5px solid #12AEA2;
      padding: 2px;
      margin-bottom: 8px;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        90deg,
        #12AEA2 0px,
        #12AEA2 10px,
        #0c7d74 10px,
        #0c7d74 13px
      );
      transition: width 0.08s linear;
    }

    .loading-sub {
      font-size: 11px;
      color: #12AEA2;
      letter-spacing: 1px;
    }

    #static-splash {
      background: #000;
      z-index: 14;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #bwaaCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      z-index: 2;
    }

    /* --- SUPER MARIO ALL-STARS STYLE GAME BANNER CAROUSEL --- */
    #game-carousel {
      background: #06070d;
      color: #12AEA2;
      padding: 10px 12px 12px 12px;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .carousel-topbar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed #12AEA2;
      padding-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      flex: 0 0 auto;
    }

    .carousel-counter {
      color: #F7C844;
      background: #141829;
      border: 1.5px solid #12AEA2;
      padding: 2px 7px;
      font-size: 12px;
    }

    .carousel-stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .nav-arrow {
      flex: 0 0 34px;
      height: 54px;
      background: #111626;
      border: 2px solid #12AEA2;
      color: #F7C844;
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #000, inset 0 0 8px rgba(18, 174, 162, 0.25);
      animation: arrowBlink 1.1s infinite ease-in-out;
    }

    .nav-arrow:active, .nav-arrow.pulse-hit {
      transform: scale(0.92);
      background: #12AEA2;
      color: #000;
      animation: none;
    }

    @keyframes arrowBlink {
      0%, 100% { opacity: 1; transform: translateX(0); }
      50% { opacity: 0.45; }
    }

    /* Pixel Artbox Frame */
    .artbox-frame {
      flex: 1 1 auto;
      height: 100%;
      max-height: 310px;
      background: #0d101d;
      border: 3px solid #f4f4f4;
      box-shadow:
        inset 0 0 0 3px #12AEA2,
        0 6px 0 #000,
        0 0 22px rgba(18, 174, 162, 0.28);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    #artboxCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Curtain / Shutter Wipe Transition Overlay on Switch */
    .artbox-wipe {
      position: absolute;
      inset: 0;
      background: #000;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
    }

    .artbox-wipe.wipe-left {
      animation: shutterWipeLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .artbox-wipe.wipe-right {
      animation: shutterWipeRight 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes shutterWipeLeft {
      0% { opacity: 1; transform: translateX(0%); }
      100% { opacity: 0; transform: translateX(-100%); }
    }

    @keyframes shutterWipeRight {
      0% { opacity: 1; transform: translateX(0%); }
      100% { opacity: 0; transform: translateX(100%); }
    }

    .carousel-footer {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .pip-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .pip-dot {
      width: 8px;
      height: 8px;
      background: #1f293d;
      border: 1px solid #12AEA2;
      cursor: pointer;
    }

    .pip-dot.active {
      width: 16px;
      background: #F7C844;
      border-color: #fff;
    }

    .carousel-prompt {
      font-size: 12px;
      font-weight: bold;
      color: #12AEA2;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* --- PAUSE HUD OVERLAY --- */
    #pause-overlay {
      background: rgba(0, 0, 0, 0.86);
      color: #12AEA2;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 16;
    }

    .pause-box {
      width: 90%;
      max-width: 320px;
      background: #050505;
      border: 2px solid #12AEA2;
      box-shadow: 0 0 24px rgba(18, 174, 162, 0.3), inset 0 0 12px rgba(0, 0, 0, 0.9);
      padding: 18px;
    }

    .pause-header {
      font-weight: bold;
      font-size: 17px;
      text-align: center;
      color: #F7C844;
      margin-bottom: 14px;
      border-bottom: 2px dashed #12AEA2;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .pause-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pause-list li {
      font-size: 15px;
      text-transform: uppercase;
      color: #12AEA2;
      opacity: 0.72;
      padding: 5px 6px;
      cursor: pointer;
    }

    .pause-list li.active {
      opacity: 1;
      font-weight: bold;
      background: #12AEA2;
      color: #000;
    }

    .pause-list li::before {
      content: "  ";
      white-space: pre;
    }

    .pause-list li.active::before {
      content: "> ";
    }

    .pause-hint {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px dashed #333;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    /* Full-Bleed In-Game iFrame */
    #arcade-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
      pointer-events: none;
    }

    /* Retro CRT Scanline & Vignette Overlay */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), 
        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      z-index: 25;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 32px rgba(0, 0, 0, 0.65);
    }

    /* --- SECTION 2: CONTROL DECK LIFTED WELL ABOVE BROWSER BOTTOM HUD --- */
    .control-deck {
      flex: 0 0 auto;
      width: 100%;
      background: linear-gradient(to bottom, #161616 0%, #090909 70%, #050505 100%);
      border-top: 1px solid #2c2c2c;
      padding-top: 10px;
      padding-left: calc(18px + env(safe-area-inset-left));
      padding-right: calc(18px + env(safe-area-inset-right));
      padding-bottom: calc(12px + var(--browser-hud-clearance));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .deck-inner {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Left Thumb: Drag Joystick */
    .joystick-base {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #141414 32%, #242424 100%);
      border-radius: 50%;
      border: 3px solid #050505;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.9), 0 1px 4px rgba(255, 255, 255, 0.08);
      position: relative;
      touch-action: none; 
      cursor: grab;
    }

    .joystick-base:active {
      cursor: grabbing;
    }

    .joystick-stick {
      width: 50px; 
      height: 50px;
      background: radial-gradient(circle at 35% 35%, #8f8f8f, #222);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      position: absolute;
      top: 22px; 
      left: 22px; 
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.75);
      pointer-events: none; 
      transition: transform 0.14s ease-out; 
      z-index: 1;
    }

    .joystick-stick.dragging {
      transition: none; 
    }

    /* Center: System Home / Pause Button */
    .center-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      align-self: flex-end;
      margin-bottom: 4px;
    }

    .home-btn {
      padding: 7px 14px;
      background: #1b1b1b;
      border: 1.5px solid rgba(18, 174, 162, 0.55);
      border-radius: 14px;
      color: #d8d8d8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 3px 0 #000, 0 4px 10px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    .home-btn:active, .home-btn.active-press {
      transform: translateY(3px);
      box-shadow: 0 0 0 #000;
      background: rgba(18, 174, 162, 0.28);
      border-color: #12AEA2;
      color: #fff;
    }

    .key-hint {
      font-size: 9px;
      color: #666;
      letter-spacing: 0.5px;
    }

    /* Right Thumb: Angled B & A Action Buttons */
    .action-container {
      display: flex;
      gap: 14px;
      transform: rotate(-14deg);
      margin-right: 4px;
    }

    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2.5px solid #090909;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 4px 10px rgba(255, 255, 255, 0.2), inset 0 -6px 12px rgba(0, 0, 0, 0.65), 0 5px 0 #000, 0 8px 14px rgba(0, 0, 0, 0.65);
      touch-action: none;
    }

    .action-btn::after {
      content: '';
      position: absolute;
      top: 4px; left: 10px; right: 10px; height: 15px;
      background: linear-gradient(rgba(255, 255, 255, 0.22), transparent);
      border-radius: 20px 20px 0 0;
      pointer-events: none;
    }

    .action-btn:active, .action-btn.active-press {
      transform: translateY(5px);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.55), 0 0 0 #000, 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    .btn-b { 
      background: #AD1C21; 
      margin-top: 16px; 
    }
    .btn-a { 
      background: #12AEA2; 
    }

    .btn-label {
      font-size: 11px;
      font-weight: bold;
      color: #888;
    }

    /* Desktop / Wide Embed Enhancement */
    @media (min-width: 768px) {
      .control-deck {
        padding-top: 12px;
        padding-left: 32px;
        padding-right: 32px;
        padding-bottom: calc(14px + var(--browser-hud-clearance));
      }
      .deck-inner {
        max-width: 680px;
      }
      .joystick-base {
        width: 112px;
        height: 112px;
      }
      .joystick-stick {
        width: 54px;
        height: 54px;
        top: 26px;
        left: 26px;
      }
      .action-btn {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>

  <div class="embed-shell" id="embed-shell" tabindex="0">
    <!-- 1. EXPANDED CRT VIEWPORT -->
    <div class="crt-screen">
      
      <div id="boot-splash" class="screen-layer">
        <canvas id="introCanvas" width="600" height="450"></canvas>
      </div>

      <!-- SIMULATED LOADING / SAVE WARNING SCREEN -->
      <div id="loading-warning" class="screen-layer">
        <div class="warning-box">
          <div class="warning-badge">NOTICE</div>
          <div class="warning-text">
            Games do not save, do not close browser/turn off screen.
          </div>
          <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
          </div>
          <div class="loading-sub" id="loading-sub">LOADING BWAA_BRULE.EXE...</div>
        </div>
      </div>

      <div id="static-splash" class="screen-layer">
        <canvas id="bwaaCanvas" width="600" height="450"></canvas>
      </div>

      <!-- SUPER MARIO ALL-STARS STYLE GAME BANNER CAROUSEL -->
      <div id="game-carousel" class="screen-layer">
        <div class="carousel-topbar">
          <span>BWAA_BRULE.EXE // SELECT GAME</span>
          <span class="carousel-counter" id="carousel-counter">01 / 10</span>
        </div>

        <div class="carousel-stage">
          <div class="nav-arrow" id="arrow-prev" aria-label="Previous Game">&#9664;</div>

          <div class="artbox-frame" id="artbox-frame">
            <canvas id="artboxCanvas" width="440" height="270"></canvas>
            <div class="artbox-wipe" id="artbox-wipe"></div>
          </div>

          <div class="nav-arrow" id="arrow-next" aria-label="Next Game">&#9654;</div>
        </div>

        <div class="carousel-footer">
          <div class="pip-dots" id="pip-dots"></div>
          <div class="carousel-prompt">&#9664;/&#9654; BROWSE &nbsp;&bull;&nbsp; PRESS A TO PLAY</div>
        </div>
      </div>

      <!-- PAUSE HUD OVERLAY -->
      <div id="pause-overlay" class="screen-layer">
        <div class="pause-box">
          <div class="pause-header">SYSTEM PAUSED</div>
          <ul class="pause-list" id="pause-list">
            <li class="active" data-action="RESUME">Return to Game</li>
            <li data-action="RESTART">Restart Game</li>
            <li data-action="MENU">Return to Game Selection</li>
          </ul>
          <div class="pause-hint">D-PAD: SELECT &nbsp;|&nbsp; A: OK</div>
        </div>
      </div>

      <iframe id="arcade-frame" class="screen-layer" title="Game Screen"></iframe>

    </div>

    <!-- 2. CONTROL DECK LIFTED ABOVE MOBILE BROWSER BOTTOM HUD -->
    <div class="control-deck">
      <div class="deck-inner">
        <div class="joystick-base" id="joystick-base">
          <div class="joystick-stick" id="joystick-stick"></div>
        </div>

        <div class="center-hud">
          <div class="home-btn" id="btn-home" onmousedown="handleSystemMenuTrigger()" ontouchstart="preventGhostClick(event, 'HOME')">HOME</div>
          <span class="key-hint">ESC: PAUSE</span>
        </div>

        <div class="action-container">
          <div class="action-btn-wrapper">
            <div class="action-btn btn-b" id="btn-b" onmousedown="btnAction('BUTTON_B')" ontouchstart="preventGhostClick(event, 'BUTTON_B')"></div>
            <span class="btn-label">B</span>
          </div>
          <div class="action-btn-wrapper">
            <div class="action-btn btn-a" id="btn-a" onmousedown="btnAction('BUTTON_A')" ontouchstart="preventGhostClick(event, 'BUTTON_A')"></div>
            <span class="btn-label">A</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let machineState = 'BOOT'; // BOOT, WARNING, STATIC, MENU, PLAYING, PAUSED
    let currentIndex = 0;
    let pauseIndex = 0;

    const GAME_CATALOG = [

    let isPlaying = false;

    const embedShell = document.getElementById('embed-shell');
    const bootSplash = document.getElementById('boot-splash');
    const loadingWarning = document.getElementById('loading-warning');
    const loadingBarFill = document.getElementById('loading-bar-fill');
    const staticSplash = document.getElementById('static-splash');
    const gameCarousel = document.getElementById('game-carousel');
    const pauseOverlay = document.getElementById('pause-overlay');
    const gameFrame = document.getElementById('arcade-frame');
    const pauseItems = document.querySelectorAll('#pause-list li');
    const btnAEl = document.getElementById('btn-a');
    const btnBEl = document.getElementById('btn-b');
    const btnHomeEl = document.getElementById('btn-home');

    const carouselCounter = document.getElementById('carousel-counter');
    const artboxFrame = document.getElementById('artbox-frame');
    const artboxWipe = document.getElementById('artbox-wipe');
    const arrowPrev = document.getElementById('arrow-prev');
    const arrowNext = document.getElementById('arrow-next');
    const pipDotsContainer = document.getElementById('pip-dots');

    let staticStartTime = 0;
    let warningStartTime = 0;

    /* --- DYNAMIC MOBILE BROWSER VIEWPORT SYNC --- */
    function syncViewportBounds() {
      if (window.visualViewport) {
        embedShell.style.height = `${window.visualViewport.height}px`;
        embedShell.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        embedShell.style.height = `${window.innerHeight}px`;
        embedShell.style.top = '0px';
      }
      if (isPlaying && gameFrame.contentWindow) {
        try {
          gameFrame.contentWindow.dispatchEvent(new Event('resize'));
        } catch (err) {}
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewportBounds);
      window.visualViewport.addEventListener('scroll', syncViewportBounds);
    }
    window.addEventListener('resize', syncViewportBounds);
    syncViewportBounds();

    window.addEventListener('load', () => {
      syncViewportBounds();
      window.focus();
      embedShell.focus({ preventScroll: true });
    });

    embedShell.addEventListener('pointerdown', () => {
      window.focus();
      embedShell.focus({ preventScroll: true });
    });

    /* --- BUILD CAROUSEL PIP DOTS --- */
    const pipDots = [];
    GAME_CATALOG.forEach((g, idx) => {
      const dot = document.createElement('div');
      dot.className = 'pip-dot' + (idx === 0 ? ' active' : '');
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        if (machineState !== 'MENU' || idx === currentIndex) return;
        const dir = idx > currentIndex ? 1 : -1;
        setCarouselIndex(idx, dir);
      });
      pipDotsContainer.appendChild(dot);
      pipDots.push(dot);
    });

    /* --- IFRAME PAUSE / FREEZE CONTROLLER --- */
    let isFramePaused = false;
    let pausedRAFCallbacks = [];

    function attachFramePauseHook() {
      try {
        const win = gameFrame.contentWindow;
        if (!win || win.__pauseHooked) return;
        win.__pauseHooked = true;

        const origRAF = win.requestAnimationFrame.bind(win);
        win.requestAnimationFrame = function(cb) {
          if (isFramePaused) {
            pausedRAFCallbacks.push(cb);
            return -1;
          }
          return origRAF(cb);
        };

        const origSetInterval = win.setInterval.bind(win);
        win.setInterval = function(fn, delay, ...args) {
          return origSetInterval(function() {
            if (!isFramePaused) {
              if (typeof fn === 'function') fn(...args);
            }
          }, delay);
        };
      } catch (err) {}
    }

    gameFrame.addEventListener('load', () => {
      isFramePaused = false;
      pausedRAFCallbacks = [];
      attachFramePauseHook();
      try {
        gameFrame.contentWindow.dispatchEvent(new Event('resize'));
      } catch (err) {}
      window.focus();
      embedShell.focus({ preventScroll: true });
    });

    function postToGame(command) {
      if (isPlaying && gameFrame.contentWindow) {
        gameFrame.contentWindow.postMessage(command, '*');
      }
    }

    function setFramePaused(paused) {
      isFramePaused = paused;
      postToGame(paused ? 'PAUSE' : 'RESUME');
      if (!paused) {
        try {
          const win = gameFrame.contentWindow;
          const cbs = pausedRAFCallbacks.splice(0);
          cbs.forEach(cb => win.requestAnimationFrame(cb));
        } catch (err) {}
      }
    }

    /* --- SIMULATED LOADING / SAVE WARNING SCREEN --- */
    function transitionToWarning() {
      machineState = 'WARNING';
      bootSplash.style.display = 'none';
      staticSplash.style.display = 'none';
      pauseOverlay.style.display = 'none';
      gameCarousel.style.display = 'none';
      loadingBarFill.style.width = '0%';
      loadingWarning.style.display = 'flex';
      warningStartTime = performance.now();
      requestAnimationFrame(warningLoop);
    }

    function warningLoop(timestamp) {
      if (machineState !== 'WARNING') return;
      const elapsed = (timestamp - warningStartTime) / 1000;
      const duration = 4.2; // Enough time to read the no-save / keep-browser-open notice
      const pct = Math.min(100, Math.round((elapsed / duration) * 100));
      loadingBarFill.style.width = `${pct}%`;

      if (elapsed >= duration) {
        transitionToStatic();
        return;
      }
      requestAnimationFrame(warningLoop);
    }

    function transitionToStatic() {
      machineState = 'STATIC';
      bootSplash.style.display = 'none';
      loadingWarning.style.display = 'none';
      pauseOverlay.style.display = 'none';
      gameCarousel.style.display = 'none';
      staticSplash.style.display = 'flex';
      staticStartTime = performance.now();
      requestAnimationFrame(staticLoop);
    }

    function openCarouselMenu() {
      machineState = 'MENU';
      staticSplash.style.display = 'none';
      loadingWarning.style.display = 'none';
      pauseOverlay.style.display = 'none';
      gameCarousel.style.display = 'flex';
      updateCarouselUI();
      requestAnimationFrame(artboxLoop);
    }

    function sendSignal(command) {
      if (isPlaying && machineState === 'PLAYING') {
        postToGame(command);
      }
    }

    function preventGhostClick(e, actionType) {
      e.preventDefault(); 
      e.stopPropagation();
      if (actionType === 'BUTTON_A' || actionType === 'BUTTON_B') {
        btnAction(actionType);
        e.target.classList.add('active-press');
        setTimeout(() => e.target.classList.remove('active-press'), 150);
      } else if (actionType === 'HOME') {
        e.target.classList.add('active-press');
        setTimeout(() => e.target.classList.remove('active-press'), 150);
        handleSystemMenuTrigger();
      }
    }

    function pressDpad(directionStr) {
      if (machineState === 'PLAYING') {
        sendSignal(directionStr);
      } else if (machineState === 'MENU') {
        if (directionStr === 'DPAD_LEFT' || directionStr === 'DPAD_UP') cycleCarousel(-1);
        if (directionStr === 'DPAD_RIGHT' || directionStr === 'DPAD_DOWN') cycleCarousel(1);
      } else if (machineState === 'PAUSED') {
        if (directionStr === 'DPAD_UP') movePauseMenu(-1);
        if (directionStr === 'DPAD_DOWN') movePauseMenu(1);
      }
    }

    function updateCarouselUI() {
      const numStr = String(currentIndex + 1).padStart(2, '0');
      const totStr = String(GAME_CATALOG.length).padStart(2, '0');
      carouselCounter.textContent = `${numStr} / ${totStr}`;
      pipDots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }

    function triggerWipeReveal(direction) {
      artboxWipe.classList.remove('wipe-left', 'wipe-right');
      void artboxWipe.offsetWidth;
      artboxWipe.classList.add(direction >= 0 ? 'wipe-left' : 'wipe-right');

      const arrowEl = direction >= 0 ? arrowNext : arrowPrev;
      arrowEl.classList.add('pulse-hit');
      setTimeout(() => arrowEl.classList.remove('pulse-hit'), 160);
    }

    function setCarouselIndex(newIdx, direction = 1) {
      currentIndex = ((newIdx % GAME_CATALOG.length) + GAME_CATALOG.length) % GAME_CATALOG.length;
      updateCarouselUI();
      triggerWipeReveal(direction);
      playCarouselTick(direction);
    }

    function cycleCarousel(step) {
      setCarouselIndex(currentIndex + step, step);
    }

    arrowPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      if (machineState === 'MENU') cycleCarousel(-1);
    });

    arrowNext.addEventListener('click', (e) => {
      e.stopPropagation();
      if (machineState === 'MENU') cycleCarousel(1);
    });

    artboxFrame.addEventListener('click', (e) => {
      e.stopPropagation();
      if (machineState === 'MENU') btnAction('BUTTON_A');
    });

    function movePauseMenu(direction) {
      pauseItems[pauseIndex].classList.remove('active');
      pauseIndex += direction;
      if (pauseIndex < 0) pauseIndex = pauseItems.length - 1;
      if (pauseIndex >= pauseItems.length) pauseIndex = 0;
      pauseItems[pauseIndex].classList.add('active');
    }

    function openPauseMenu() {
      if (machineState !== 'PLAYING') return;
      stopSendingDirection();
      machineState = 'PAUSED';
      pauseItems[pauseIndex].classList.remove('active');
      pauseIndex = 0;
      pauseItems[pauseIndex].classList.add('active');
      setFramePaused(true);
      pauseOverlay.style.display = 'flex';
    }

    function resumeGame() {
      if (machineState !== 'PAUSED') return;
      pauseOverlay.style.display = 'none';
      machineState = 'PLAYING';
      setFramePaused(false);
    }

    function restartGame() {
      pauseOverlay.style.display = 'none';
      isFramePaused = false;
      pausedRAFCallbacks = [];
      machineState = 'PLAYING';
      isPlaying = true;
      gameFrame.style.display = 'block';
      gameFrame.src = 'about:blank';
      setTimeout(() => {
        gameFrame.src = GAME_CATALOG[currentIndex].file;
      }, 20);
    }

    function returnToGameMenu() {
      pauseOverlay.style.display = 'none';
      isFramePaused = false;
      pausedRAFCallbacks = [];
      gameFrame.src = "";
      gameFrame.style.display = 'none';
      isPlaying = false;
      openCarouselMenu();
    }

    function executePauseSelection() {
      const action = pauseItems[pauseIndex].dataset.action;
      if (action === 'RESUME') resumeGame();
      else if (action === 'RESTART') restartGame();
      else if (action === 'MENU') returnToGameMenu();
    }

    pauseItems.forEach((item, idx) => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        if (machineState !== 'PAUSED') return;
        pauseItems[pauseIndex].classList.remove('active');
        pauseIndex = idx;
        pauseItems[pauseIndex].classList.add('active');
        executePauseSelection();
      });
    });

    function btnAction(buttonStr) {
      if (machineState === 'BOOT' && buttonStr === 'BUTTON_A') {
        triggerBootStart();
      } else if (machineState === 'PLAYING') {
        sendSignal(buttonStr);
      } else if (machineState === 'PAUSED') {
        if (buttonStr === 'BUTTON_A') executePauseSelection();
        else if (buttonStr === 'BUTTON_B') resumeGame();
      } else if (machineState === 'STATIC' && buttonStr === 'BUTTON_A') {
        openCarouselMenu();
      } else if (machineState === 'MENU') {
        if (buttonStr === 'BUTTON_A') {
          machineState = 'PLAYING';
          gameCarousel.style.display = 'none';
          gameFrame.style.display = 'block';
          gameFrame.src = GAME_CATALOG[currentIndex].file;
          isPlaying = true;
        } else if (buttonStr === 'BUTTON_B') {
          returnToSplash();
        }
      }
    }

    function returnToSplash() {
      stopSendingDirection();
      isFramePaused = false;
      pausedRAFCallbacks = [];
      pauseOverlay.style.display = 'none';
      gameFrame.src = ""; 
      gameFrame.style.display = 'none';
      gameCarousel.style.display = 'none';
      machineState = 'STATIC';
      staticSplash.style.display = 'flex';
      isPlaying = false;
      staticStartTime = performance.now();
      requestAnimationFrame(staticLoop);
    }

    function handleSystemMenuTrigger() {
      if (machineState === 'PLAYING') {
        openPauseMenu();
      } else if (machineState === 'PAUSED') {
        resumeGame();
      } else if (machineState === 'MENU') {
        returnToSplash();
      }
    }

    /* --- JOYSTICK DRAG & KEYBOARD LOGIC --- */
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let isDragging = false;
    let currentDir = null;
    let activeBroadcastDir = null;
    const maxRadius = 26; 
    const deadzone = 11;  

    let holdTimer = null;
    let repeatInterval = null;

    function startSendingDirection(dir) {
      stopSendingDirection();
      activeBroadcastDir = dir;
      if (machineState === 'PLAYING') {
        sendSignal(`${dir}_PRESS`);
      }
      pressDpad(dir); 
      holdTimer = setTimeout(() => {
        repeatInterval = setInterval(() => { pressDpad(dir); }, 130); 
      }, 300);
    }

    function stopSendingDirection() {
      if (holdTimer) clearTimeout(holdTimer);
      if (repeatInterval) clearInterval(repeatInterval);
      holdTimer = null;
      repeatInterval = null;
      if (activeBroadcastDir) {
        if (machineState === 'PLAYING') {
          sendSignal(`${activeBroadcastDir}_RELEASE`);
        }
        activeBroadcastDir = null;
      }
    }

    function startDrag(e) {
      e.preventDefault();
      e.stopPropagation();
      isDragging = true;
      joyStick.classList.add('dragging');
      moveDrag(e);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();

      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      let stickX = dx;
      let stickY = dy;
      if (distance > maxRadius) {
        const angle = Math.atan2(dy, dx);
        stickX = Math.cos(angle) * maxRadius;
        stickY = Math.sin(angle) * maxRadius;
      }

      joyStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      let newDir = null;
      if (distance > deadzone) {
        if (Math.abs(dx) > Math.abs(dy)) {
          newDir = dx > 0 ? 'DPAD_RIGHT' : 'DPAD_LEFT';
        } else {
          newDir = dy > 0 ? 'DPAD_DOWN' : 'DPAD_UP';
        }
      }

      if (newDir !== currentDir) {
        currentDir = newDir;
        if (currentDir) startSendingDirection(currentDir);
        else stopSendingDirection();
      }
    }

    function endDrag(e) {
      if (!isDragging) return;
      if (e) e.preventDefault();
      isDragging = false;
      currentDir = null;
      stopSendingDirection(); 
      joyStick.classList.remove('dragging');
      joyStick.style.transform = `translate(0px, 0px)`;
    }

    joyBase.addEventListener('mousedown', startDrag);
    joyBase.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    /* --- KEYBOARD INPUT HANDLERS (ARROWS = DPAD, Z/A = A, X/B = B, ESC = PAUSE) --- */
    const activeDirectionKeys = new Set();
    const ARROW_TO_DIR = {
      ArrowUp: 'DPAD_UP',
      ArrowDown: 'DPAD_DOWN',
      ArrowLeft: 'DPAD_LEFT',
      ArrowRight: 'DPAD_RIGHT'
    };
    const DIR_TO_OFFSET = {
      DPAD_UP: [0, -maxRadius],
      DPAD_DOWN: [0, maxRadius],
      DPAD_LEFT: [-maxRadius, 0],
      DPAD_RIGHT: [maxRadius, 0]
    };

    function syncKeyboardJoystick() {
      if (isDragging) return;
      const keysArray = Array.from(activeDirectionKeys);
      if (keysArray.length === 0) {
        currentDir = null;
        stopSendingDirection();
        joyStick.classList.remove('dragging');
        joyStick.style.transform = `translate(0px, 0px)`;
        return;
      }
      const latestKey = keysArray[keysArray.length - 1];
      const newDir = ARROW_TO_DIR[latestKey];
      const [ox, oy] = DIR_TO_OFFSET[newDir];
      joyStick.classList.add('dragging');
      joyStick.style.transform = `translate(${ox}px, ${oy}px)`;

      if (newDir !== currentDir) {
        currentDir = newDir;
        startSendingDirection(currentDir);
      }
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      const lower = key.toLowerCase();

      if (ARROW_TO_DIR[key]) {
        e.preventDefault();
        if (e.repeat) return;
        activeDirectionKeys.add(key);
        syncKeyboardJoystick();
        return;
      }

      if (lower === 'a' || lower === 'z' || key === 'Enter') {
        e.preventDefault();
        if (e.repeat) return;
        btnAEl.classList.add('active-press');
        btnAction('BUTTON_A');
        return;
      }

      if (lower === 'b' || lower === 'x') {
        e.preventDefault();
        if (e.repeat) return;
        btnBEl.classList.add('active-press');
        btnAction('BUTTON_B');
        return;
      }

      if (key === 'Escape' || key === 'Esc') {
        e.preventDefault();
        if (e.repeat) return;
        btnHomeEl.classList.add('active-press');
        handleSystemMenuTrigger();
        return;
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key;
      const lower = key.toLowerCase();

      if (ARROW_TO_DIR[key]) {
        e.preventDefault();
        activeDirectionKeys.delete(key);
        syncKeyboardJoystick();
        return;
      }

      if (lower === 'a' || lower === 'z' || key === 'Enter') {
        e.preventDefault();
        btnAEl.classList.remove('active-press');
        return;
      }

      if (lower === 'b' || lower === 'x') {
        e.preventDefault();
        btnBEl.classList.remove('active-press');
        return;
      }

      if (key === 'Escape' || key === 'Esc') {
        e.preventDefault();
        btnHomeEl.classList.remove('active-press');
        return;
      }
    });

    window.addEventListener('blur', () => {
      activeDirectionKeys.clear();
      syncKeyboardJoystick();
      btnAEl.classList.remove('active-press');
      btnBEl.classList.remove('active-press');
      btnHomeEl.classList.remove('active-press');
    });

    /* --- PIXEL ARTBOX BANNER RENDERER (SMAS STYLE) --- */
    const artCanvas = document.getElementById('artboxCanvas');
    const aCtx = artCanvas.getContext('2d');
    aCtx.imageSmoothingEnabled = false;

    function drawPineTree(ctx, x, y, scale, snowy = false) {
      const s = scale;
      ctx.fillStyle = '#3a2311';
      ctx.fillRect(x - 2 * s, y, 4 * s, 6 * s);
      ctx.fillStyle = snowy ? '#1d4d3e' : '#1b4728';
      ctx.fillRect(x - 10 * s, y - 6 * s, 20 * s, 6 * s);
      ctx.fillRect(x - 7 * s, y - 13 * s, 14 * s, 7 * s);
      ctx.fillRect(x - 4 * s, y - 19 * s, 8 * s, 6 * s);
      if (snowy) {
        ctx.fillStyle = '#e8fbff';
        ctx.fillRect(x - 8 * s, y - 6 * s, 16 * s, 2 * s);
        ctx.fillRect(x - 5 * s, y - 13 * s, 10 * s, 2 * s);
        ctx.fillRect(x - 2 * s, y - 19 * s, 4 * s, 2 * s);
      }
    }

    function drawWesternTipi(ctx, x, baseY, scale = 1, tick = 0) {
      const s = scale;
      ctx.fillStyle = '#5c3419';
      ctx.fillRect(x - 6 * s, baseY - 46 * s, 2 * s, 12 * s);
      ctx.fillRect(x + 4 * s, baseY - 46 * s, 2 * s, 12 * s);
      ctx.fillStyle = '#f2dec0';
      ctx.fillRect(x - 4 * s, baseY - 38 * s, 8 * s, 8 * s);
      ctx.fillRect(x - 9 * s, baseY - 30 * s, 18 * s, 8 * s);
      ctx.fillRect(x - 14 * s, baseY - 22 * s, 28 * s, 8 * s);
      ctx.fillRect(x - 19 * s, baseY - 14 * s, 38 * s, 8 * s);
      ctx.fillRect(x - 23 * s, baseY - 6 * s, 46 * s, 6 * s);
      ctx.fillStyle = '#c4451c';
      ctx.fillRect(x - 14 * s, baseY - 20 * s, 28 * s, 3 * s);
      ctx.fillRect(x - 21 * s, baseY - 8 * s, 42 * s, 4 * s);
      ctx.fillStyle = '#F7C844';
      ctx.fillRect(x - 18 * s, baseY - 12 * s, 36 * s, 2 * s);
      ctx.fillStyle = '#d9b88c';
      ctx.fillRect(x - 8 * s, baseY - 36 * s, 5 * s, 6 * s);
      ctx.fillRect(x + 3 * s, baseY - 36 * s, 5 * s, 6 * s);
      ctx.fillStyle = '#3b150c';
      ctx.fillRect(x - 4 * s, baseY - 11 * s, 8 * s, 11 * s);
      const drift = Math.round(Math.sin(tick * 0.06) * 2);
      ctx.fillStyle = 'rgba(255, 244, 224, 0.45)';
      ctx.fillRect(x - 2 + drift, baseY - 52 * s, 4, 4);
      ctx.fillRect(x + 2 - drift, baseY - 58 * s, 3, 3);
    }

    function drawSnowfall(ctx, W, maxY, tick, count = 24) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      for (let i = 0; i < count; i++) {
        const seedX = (i * 73 + 19) % W;
        const speed = 0.7 + (i % 3) * 0.35;
        const drift = Math.round(Math.sin(tick * 0.04 + i) * 6);
        const sx = ((seedX + drift) % W + W) % W;
        const sy = Math.floor((tick * speed + i * 29) % maxY);
        const size = (i % 4 === 0) ? 3 : 2;
        ctx.fillRect(sx, sy, size, size);
      }
    }

    function drawArtboxScene(ctx, game, tick) {
      const W = artCanvas.width;
      const H = artCanvas.height;
      const bob = Math.sin(tick * 0.08) * 3;
      const wave = Math.floor(tick / 14) % 2;
      const cx = Math.round(W / 2);
      const cy = Math.round(H * 0.43 + bob);

      // Clear stage
      ctx.fillStyle = '#090b12';
      ctx.fillRect(0, 0, W, H);

      if (game.artType === 'CANOE') {
        // 1. RED RIVER RUN: One-man canoe on parallax Red River + Prairie
        ctx.fillStyle = '#2d1832';
        ctx.fillRect(0, 0, W, 56);
        ctx.fillStyle = '#732c3f';
        ctx.fillRect(0, 56, W, 42);
        ctx.fillStyle = '#c45b33';
        ctx.fillRect(0, 98, W, 24);

        ctx.fillStyle = '#F7C844';
        ctx.fillRect(W - 86, 28, 26, 26);

        const farScroll = Math.floor(tick * 0.5) % 110;
        ctx.fillStyle = '#5c4b23';
        ctx.fillRect(0, 108, W, 26);
        ctx.fillStyle = '#826e2e';
        for (let x = -farScroll; x < W + 110; x += 110) {
          ctx.fillRect(x, 102, 74, 12);
          ctx.fillRect(x + 18, 97, 38, 6);
        }

        const midScroll = Math.floor(tick * 1.2) % 90;
        ctx.fillStyle = '#a38936';
        ctx.fillRect(0, 124, W, 24);
        ctx.fillStyle = '#3D5948';
        for (let x = -midScroll; x < W + 90; x += 90) {
          ctx.fillRect(x + 10, 114, 16, 12);
          ctx.fillRect(x + 15, 124, 5, 6);
        }

        ctx.fillStyle = '#7a2520';
        ctx.fillRect(0, 144, W, H - 144);
        ctx.fillStyle = '#9e382b';
        ctx.fillRect(0, 152, W, 28);
        const fastScroll = Math.floor(tick * 2.4) % 64;
        ctx.fillStyle = 'rgba(247, 200, 68, 0.35)';
        for (let x = -fastScroll; x < W + 64; x += 64) {
          ctx.fillRect(x, 158, 24, 3);
          ctx.fillRect(x + 28, 174, 18, 3);
        }

        const canoeY = Math.round(148 + bob);
        ctx.fillStyle = '#d9a760';
        ctx.fillRect(cx - 56, canoeY, 112, 14);
        ctx.fillRect(cx - 66, canoeY - 6, 14, 10);
        ctx.fillRect(cx + 52, canoeY - 6, 14, 10);
        ctx.fillStyle = '#AD1C21';
        ctx.fillRect(cx - 50, canoeY + 4, 100, 4);

        ctx.fillStyle = '#12AEA2';
        ctx.fillRect(cx - 8, canoeY - 18, 16, 18);
        ctx.fillStyle = '#dcd7c9';
        ctx.fillRect(cx - 5, canoeY - 27, 10, 9);
        ctx.fillStyle = '#AD1C21';
        ctx.fillRect(cx - 6, canoeY - 32, 12, 6);
        ctx.fillRect(cx - 11, canoeY - 30, 5, 5);
        const strokeX = wave === 0 ? -6 : 6;
        ctx.fillStyle = '#F7C844';
        ctx.fillRect(cx - 18 + strokeX, canoeY - 12, 36, 3);
        ctx.fillRect(cx - 22 + strokeX, canoeY - 4, 8, 14);

      } else if (game.artType === 'FIDDLE') {
        // 2. LA GRANDE GIGUE: Métis Fiddle (with mini-sash tied to neck) leaning against a rock
        ctx.fillStyle = '#1a122b';

    let carouselTick = 0;
    function artboxLoop() {
      if (machineState !== 'MENU') return;
      carouselTick++;
      drawArtboxScene(aCtx, GAME_CATALOG[currentIndex], carouselTick);
      requestAnimationFrame(artboxLoop);
    }

    function playCarouselTick(dir) {
      if (!audioCtx) return;
      const baseFreq = dir >= 0 ? 523.25 : 440.0;
      playPulseCall(baseFreq, 0, 0.06, 0.08);
      playPulseCall(baseFreq * 1.25, 0.045, 0.08, 0.09);
    }

    function drawMatrix(context, matrix, palette, startX, startY, pixelSize, alpha = 1.0) {
        context.globalAlpha = alpha;
        for (let y = 0; y < matrix.length; y++) {
            for (let x = 0; x < matrix[y].length; x++) {
                const colorCode = matrix[y][x];
                if (colorCode !== '0' && palette[colorCode]) {
                    context.fillStyle = palette[colorCode];
                    context.fillRect(startX + (x * pixelSize), startY + (y * pixelSize), pixelSize, pixelSize);
                }
            }
        }
        context.globalAlpha = 1.0;
    }

    /* --- BWAA BRULE STACKED ANIMATION (STATIC SPLASH) --- */
    const BWAA_PALETTE = {
        '0': null,
        '1': '#540E11',
        '2': '#ffffff'
    };

    const BWAA_SPRITE = [
        "000001111110000110000110000011110000001111000000",
        "000012222221001221001221000122221000012222100000",
        "000012211221001221001221001221122100122112210000",
        "000012222210001221001221001222222100122222210000",
        "000012211221001221111221001221122100122112210000",
        "000012211221001222222221001221122100122112210000",
        "000012222221000122112210001221122100122112210000",
        "000001111110000011001100000110011000011001100000",
        "000000000000000000000000000000000000000000000000",
        "000000000000000000000000000000000000000000000000",
        "011111100001111110000110011000011000000001111110",
        "122222210012222221001221122100122100000012222221",
        "122112210012211221001221122100122100000012210000",
        "122222100012222210001221122100122100000012222100",
        "122112210012211221001221122100122100000012210000",
        "122112210012211221001221122100122111100012211110",
        "122222210012211221000122221000122222210012222221",
        "011111100001100110000011110000011111100001111110"
    ];

    const sCanvas = document.getElementById('bwaaCanvas');
    const sCtx = sCanvas.getContext('2d');
    sCtx.imageSmoothingEnabled = false;

    function staticLoop(timestamp) {
        if (machineState !== 'STATIC') return;

        sCtx.fillStyle = '#000000';
        sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);

        const elapsed = (timestamp - staticStartTime) / 1000;
        const zoomDuration = 4.0; 
        let currentScale;

        if (elapsed < zoomDuration) {
            const t = elapsed / zoomDuration;
            const easeOut = 1 - Math.pow(1 - t, 3);
            currentScale = 0.5 + (1.25 - 0.5) * easeOut;
        } else {
            currentScale = 1.25; 
        }

        sCtx.save();
        sCtx.translate(sCanvas.width / 2, sCanvas.height / 2 - 25);
        sCtx.scale(currentScale, currentScale);

        const pSize = 5; 
        const spriteW = BWAA_SPRITE[0].length * pSize;
        const spriteH = BWAA_SPRITE.length * pSize;
        
        drawMatrix(sCtx, BWAA_SPRITE, BWAA_PALETTE, -spriteW/2, -spriteH/2, pSize);
        sCtx.restore();

        if (elapsed >= zoomDuration) {
            const blink = Math.floor(timestamp / 500) % 2 === 0;
            if (blink) {
                sCtx.fillStyle = '#12AEA2'; 
                sCtx.font = 'bold 24px "Courier New"';
                sCtx.textAlign = 'center';
                sCtx.fillText("PRESS A TO START", sCanvas.width / 2, sCanvas.height - 32);
            }
        }

        requestAnimationFrame(staticLoop);
    }

    /* --- ANIMATED BOOT SPLASH LOGIC (BUFFALOHYDE) --- */
    const canvas = document.getElementById('introCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const PALETTE = {
        '0': null, 
        '1': '#1e1b18', 
        '2': '#dcd7c9', 
        '3': '#c7f1ef', 
        '4': '#AD1C21', 
        '5': '#F7C844', 
        '6': '#ffffff'  
    };

    const BUFFALO_SPRITE = [
      "0000000011100000",
      "0000000111120000",
      "0000011111121000",
      "0000111111111000",
      "0001111111111000",
      "0001111111111000",
      "0001111111133000",
      "0001111111130000",
      "0000111111100000",
      "0000100100100000",
      "0000100100100000"
    ];

    let splashState = 'WAITING'; 
    let animStartTime = 0;
    let audioCtx = null;
    let customPulseWave = null;

    function triggerBootStart() {
        if (machineState === 'BOOT' && splashState === 'WAITING') {
            initAudio();
            playBuffaloStartup();
            splashState = 'PLAYING';
            animStartTime = performance.now();
        }
    }

    window.addEventListener('click', triggerBootStart);
    window.addEventListener('touchstart', triggerBootStart, {passive: true});

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (!customPulseWave && audioCtx.createPeriodicWave) {
            const harmonics = 16;
            const real = new Float32Array(harmonics);
            const imag = new Float32Array(harmonics);
            const duty = 0.25;
            for (let n = 1; n < harmonics; n++) {
                imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
            }
            customPulseWave = audioCtx.createPeriodicWave(real, imag);
        }
    }

    function playBuffaloStartup() {
        if (!audioCtx) return;

        const herdGallop = [
            { freq: 49.00,  delay: 0.00, dur: 0.14, vol: 0.44 },
            { freq: 49.00,  delay: 0.08, dur: 0.14, vol: 0.36 },
            { freq: 58.27,  delay: 0.16, dur: 0.16, vol: 0.46 },
            { freq: 65.41,  delay: 0.26, dur: 0.14, vol: 0.44 },
            { freq: 65.41,  delay: 0.34, dur: 0.14, vol: 0.38 },
            { freq: 73.42,  delay: 0.42, dur: 0.16, vol: 0.48 },
            { freq: 87.31,  delay: 0.52, dur: 0.14, vol: 0.46 },
            { freq: 98.00,  delay: 0.60, dur: 0.28, vol: 0.52 }
        ];

        herdGallop.forEach(step => {
            playHerdThud(step.freq, step.delay, step.dur, step.vol);
        });

        const hoofTimes = [0.00, 0.08, 0.16, 0.26, 0.34, 0.42, 0.52, 0.60];
        hoofTimes.forEach((t, idx) => {
            const accent = (idx % 3 === 2 || idx === 7) ? 0.14 : 0.08;
            playHoofNoise(t, 0.065, accent);
        });

        const fanfareNotes = [
            { freq: 293.66, delay: 0.68, dur: 0.10, vol: 0.11 },
            { freq: 392.00, delay: 0.77, dur: 0.10, vol: 0.12 },
            { freq: 440.00, delay: 0.86, dur: 0.10, vol: 0.12 },
            { freq: 587.33, delay: 0.95, dur: 0.34, vol: 0.14 }
        ];

        fanfareNotes.forEach(note => {
            playPulseCall(note.freq, note.delay, note.dur, note.vol);
        });
    }

    function playHerdThud(frequency, delay, duration, volume) {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequency * 1.18, now);
        osc.frequency.exponentialRampToValueAtTime(frequency, now + Math.min(0.06, duration * 0.5));

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.01);
    }

    function playHoofNoise(delay, duration, volume) {
        const now = audioCtx.currentTime + delay;
        const sampleRate = audioCtx.sampleRate;
        const frameCount = Math.max(1, Math.floor(sampleRate * duration));
        const buffer = audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < frameCount; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(320, now);
        filter.Q.setValueAtTime(2.2, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
        noise.stop(now + duration);
    }

    function playPulseCall(frequency, delay, duration, volume) {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (customPulseWave) {
            osc.setPeriodicWave(customPulseWave);
        } else {
            osc.type = 'square';
        }

        osc.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.01);
    }

    function drawSparkle(x, y, scale, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);
        ctx.fillStyle = PALETTE['5']; 
        ctx.fillRect(-2, -10, 4, 20);
        ctx.fillRect(-10, -2, 20, 4);
        ctx.fillStyle = PALETTE['6']; 
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    function bootLoop(timestamp) {
        if (machineState !== 'BOOT') return;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (splashState === 'WAITING') {
            const blink = Math.floor(timestamp / 500) % 2 === 0;
            if (blink) {
                ctx.fillStyle = '#12AEA2';
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText("POWER ON", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '16px "Courier New"';
                ctx.fillText("(TAP OR PRESS A TO START)", canvas.width / 2, canvas.height / 2 + 15);
            }
        } 
        else if (splashState === 'PLAYING') {
            const elapsed = (timestamp - animStartTime) / 1000; 
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 35; 
            
            let currentScale = 0;
            let currentRotation = 0;
            
            if (elapsed < 1.2) {
                const t = elapsed / 1.2;
                const easeOut = 1 - Math.pow(1 - t, 3);
                currentScale = easeOut * 1.0; 
                currentRotation = (1 - easeOut) * Math.PI * 4; 
            } 
            else if (elapsed < 2.5) {
                currentScale = 1.0;
                currentRotation = 0;
            }
            else if (elapsed < 5.0) {
                const t = (elapsed - 2.5) / 2.5;
                currentScale = 1.0 + Math.pow(t * 10, 3); 
                currentRotation = 0;
            }
            else {
                splashState = 'DONE';
                transitionToWarning();
                return;
            }

            if (splashState === 'PLAYING') {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(currentRotation);
                ctx.scale(currentScale, currentScale);
                
                const pSize = 12; 
                const spriteW = BUFFALO_SPRITE[0].length * pSize;
                const spriteH = BUFFALO_SPRITE.length * pSize;
                drawMatrix(ctx, BUFFALO_SPRITE, PALETTE, -spriteW/2, -spriteH/2, pSize);

                ctx.fillStyle = PALETTE['4'];
                ctx.textAlign = 'center';
                ctx.letterSpacing = "-1px";
                ctx.font = 'bold 36px "Courier New"';
                ctx.fillText("BUFFALOHYDE", 0, spriteH/2 + 30);
                ctx.font = 'bold 24px "Courier New"';
                ctx.fillText("CREATIVE", 0, spriteH/2 + 60);
                ctx.restore();

                if (elapsed > 1.2 && elapsed < 2.0) {
                    const sparkleLife = elapsed - 1.2;
                    if (sparkleLife < 0.6) {
                        const scale = Math.sin((sparkleLife / 0.6) * Math.PI); 
                        const rot = sparkleLife * Math.PI; 
                        drawSparkle(centerX - 80, centerY - 40, scale, rot);
                        drawSparkle(centerX + 90, centerY + 20, scale, -rot);
                        drawSparkle(centerX - 40, centerY + 80, scale * 0.8, rot * 1.5);
                    }
                }
            }
        }
        requestAnimationFrame(bootLoop);
    }
    requestAnimationFrame(bootLoop);
  </script>
</body>
