  let OX = 0;

  function resizeViewport() {
    const ww = window.innerWidth || 320;
    const wh = window.innerHeight || 240;
    const aspect = ww / Math.max(1, wh);
    VIEW_H = BASE_H;
    VIEW_W = Math.max(320, Math.round(BASE_H * aspect));
    cvs.width = VIEW_W;
    cvs.height = VIEW_H;
    OX = Math.floor((VIEW_W - 320) / 2);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resizeViewport);

  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, dur, vol = 0.1) {
    if (!audioCtx || isPaused) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function playGunshot() {
    if (!audioCtx || isPaused) return;
    const bufferSize = audioCtx.sampleRate * 0.45;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1100, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.45);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.65, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  }

  function getBagScore(bag) {

        activeBagSlot = i;

  // --- GENERATE 3 RANDOM MATCHUPS FROM THE 4-COURSE POOL ---
  function generatePreRaceBoard() {
    const playerTotal = getBagScore(firebag);
    const arch = OPPONENTS[Math.floor(Math.random() * OPPONENTS.length)];

    let maxCoverable = Math.min(arch.wMax, playerTotal);
    let minCoverable = Math.min(arch.wMin, maxCoverable);
    if (maxCoverable < 1) maxCoverable = 1;
    if (minCoverable < 1) minCoverable = 1;

    let npcWager = Math.floor(Math.random() * (maxCoverable - minCoverable + 1)) + minCoverable;

    let validSeek = arch.seeking.filter(idx => ITEMS[idx].val <= playerTotal);
    if (validSeek.length === 0) validSeek = [0];
    let seekingIdx = validSeek[Math.floor(Math.random() * validSeek.length)];

    let rem = npcWager;
    let npcItems = [];
    if (ITEMS[seekingIdx].val <= rem && ITEMS[seekingIdx].val <= playerTotal) {
      npcItems.push(ITEMS[seekingIdx]);
      rem -= ITEMS[seekingIdx].val;
    }
    for (let i = ITEMS.length - 1; i >= 0; i--) {
      while (rem >= ITEMS[i].val && ITEMS[i].val <= playerTotal) {
        npcItems.push(ITEMS[i]);
        rem -= ITEMS[i].val;
      }
    }

    curOpponent = {
      name: arch.names[Math.floor(Math.random() * arch.names.length)],
      group: arch.group,
      style: arch.style,
      seekingName: ITEMS[seekingIdx].name,
      wager: npcWager,
      wagerItems: npcItems,
      quote: arch.quote
    };

    let coursePool = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, 3);

    raceListings = [];
    for (let i = 0; i < 3; i++) {
      let cIdx = coursePool[i];
      let hA = Math.floor(Math.random() * HORSE_ROSTER.length);
      let hB = (hA + 1 + Math.floor(Math.random() * (HORSE_ROSTER.length - 1))) % HORSE_ROSTER.length;
      let rA = Math.floor(Math.random() * RIDER_SKINS.length);
      let rB = (rA + 1 + Math.floor(Math.random() * (RIDER_SKINS.length - 1))) % RIDER_SKINS.length;
      raceListings.push({
        courseIdx: cIdx,
        horseA: hA,
        horseB: hB,
        riderA: rA,
        riderB: rB
      });
    }

    selListingIdx = 0;
    selPrefHorse = 0;
    cardSide = 0;
    setupRow = 0;
    initDefaultBet();
  }

  // --- RESOLVE WAGER PRIORITY & CAPTAIN BREAKDOWN ---
  function resolveWagerAndDraft() {
    const chosen = raceListings[selListingIdx];
    const preferredH = selPrefHorse === 0 ? chosen.horseA : chosen.horseB;
    const otherH     = selPrefHorse === 0 ? chosen.horseB : chosen.horseA;
    const preferredR = selPrefHorse === 0 ? chosen.riderA : chosen.riderB;
    const otherR     = selPrefHorse === 0 ? chosen.riderB : chosen.riderA;

    let pBet = getBagScore(stagedBet);
    if (pBet < 1) {
      initDefaultBet();
      pBet = getBagScore(stagedBet);
    }

    match.playerBetTotal = pBet;
    match.npcBetTotal = curOpponent.wager;
    match.npcWagerItems = curOpponent.wagerItems;
    match.effectivePot = pBet + curOpponent.wager;

    if (pBet > curOpponent.wager) {
      match.playerWonPick = true;
      match.playerHorseIdx = preferredH;
      match.playerRiderIdx = preferredR;
      match.npcHorseIdx = otherH;
      match.npcRiderIdx = otherR;
    } else {
      match.playerWonPick = false;
      match.npcHorseIdx = preferredH;
      match.npcRiderIdx = preferredR;
      match.playerHorseIdx = otherH;
      match.playerRiderIdx = otherR;
    }
    match.courseIdx = chosen.courseIdx;

    generateCaptainCommentary();
  }

  function formatBetSummary(bag) {
    let parts = [];
    ITEMS.forEach(it => {
      if (bag[it.key] > 0) parts.push(`${bag[it.key]} ${it.name}`);
    });
    return parts.join(', ');
  }

  function generateCaptainCommentary() {
    const c = COURSES[match.courseIdx];
    const pH = HORSE_ROSTER[match.playerHorseIdx];
    const nH = HORSE_ROSTER[match.npcHorseIdx];
    const betStr = formatBetSummary(stagedBet);

    let draftCall = "";
    if (match.playerWonPick) {
      draftCall = `Your stake (${betStr}) tops ${curOpponent.name}! You claim de ${pH.name}, leaving ${curOpponent.name} wid de ${nH.name}! `;
    } else if (match.playerBetTotal === match.npcBetTotal) {
      draftCall = `Even wagers on de barrel! Tie goes to ${curOpponent.name}, who claims de ${nH.name}! Your ${betStr} rides wid de ${pH.name}! `;
    } else {
      draftCall = `${curOpponent.name} outbids your stake and snatches de ${nH.name}! Dat puts your ${betStr} on de ${pH.name}! `;
    }

    let trackCall = "";
    if (c.mod === 'SNOW') {
      trackCall = "De Assiniboine river is froze hard—watch dem slick ice patches to de winter camp! ";
    } else if (c.mod === 'FLAT') {
      trackCall = "Flat prairie grass past de buffalo—pure speed to de cart circle! ";
    } else if (c.mod === 'BUMPS') {
      trackCall = "Summer bumps past de river-lot houses down into de Forks valley and up to Upper Fort Garry! ";
    } else {
      trackCall = "Spring ice melt at Lower Fort Garry! Heavy, dense mud along de rocky shore to St. Andrews stone church—stocky muscle rules today! ";
    }

    captainText = draftCall + trackCall + "Any horse can steal de day if de wind blows right—step back from de line!";
  }

    if (playerWon) {
      match.npcWagerItems.forEach(it => {

      ITEMS.forEach(it => {
        firebag[it.key] = Math.max(0, firebag[it.key] - stagedBet[it.key]);
      });
    }
    stagedBet = { moccasins: 0, capote: 0, sash: 0, robe: 0 };
  }

  // Generate race-day randomized stat jitter so breed/course logic guides odds without guaranteeing a win
  function rollRaceDayForm(horseIdx) {
    const base = HORSE_ROSTER[horseIdx];
    const jitter = (range) => (Math.random() * 2 - 1) * range;
    return {
      spd:   Math.max(2.6, base.spd   + jitter(0.68)),
      burst: Math.max(2.0, base.burst + jitter(2.2)),
      end:   Math.max(2.0, base.end   + jitter(2.4)),
      agi:   Math.max(1.5, base.agi   + jitter(2.3)),
      snow:  Math.max(2.0, base.snow  + jitter(2.6)),
      might: Math.max(2.5, base.might + jitter(2.6)),
      surgePhase: Math.random() * Math.PI * 2,
      surgeFreq: 0.055 + Math.random() * 0.05,
      lateKick: (Math.random() < 0.38) ? (0.35 + Math.random() * 0.55) : 0
    };
  }

  function setupRace() {
    const pForm = rollRaceDayForm(match.playerHorseIdx);
    const rForm = rollRaceDayForm(match.npcHorseIdx);
    race = {
      dist: 6500,
      pDist: 0, rDist: 0,
      pSpd: pForm.spd, rSpd: rForm.spd,
      pStam: 100, rStam: 100,
      pLane: 0, rLane: 1,
      pStumble: 0, rStumble: 0,
      pForm: pForm, rForm: rForm,
      obstacles: [],
      countdownVal: 3,
      countdownTimer: 0,
      bangFlash: 0,
      photoTimer: 0,
      runoutTimer: 0,
      winner: '',
      logText: 'AWAITING STARTER...'
    };
    for (let x = 500; x < 6200; x += 380 + Math.random() * 250) {
      race.obstacles.push({
        dist: x,
        lane: Math.random() > 0.5 ? 0 : 1,
        passedP: false,
        passedR: false
      });
    }
  }

  // --- AUTONOMOUS AI RACE SIMULATION (With Increased Organic Chance) ---
  function simulateHorse(isPlayerSide) {
    const baseH = isPlayerSide ? HORSE_ROSTER[match.playerHorseIdx] : HORSE_ROSTER[match.npcHorseIdx];
    const form  = isPlayerSide ? race.pForm : race.rForm;
    const course = COURSES[match.courseIdx];
    let dist = isPlayerSide ? race.pDist : race.rDist;
    let stam = isPlayerSide ? race.pStam : race.rStam;
    let stumble = isPlayerSide ? race.pStumble : race.rStumble;
    let lane = isPlayerSide ? race.pLane : race.rLane;

    let targetSpd = form.spd;
    // Softened surface modifier coefficients so strategy helps, but upsets remain very possible
    if (course.mod === 'SNOW') {
      targetSpd += (form.snow - 6) * 0.14;
    } else if (course.mod === 'FLAT') {
      targetSpd += 0.45;
    } else if (course.mod === 'BUMPS') {
      targetSpd += (form.agi - 6) * 0.13;
    } else if (course.mod === 'MUD') {
      targetSpd += (form.might - 6.5) * 0.17;
    }

    let progress = dist / race.dist;
    if (progress < 0.25 && form.burst > 6 && stam > 30) {
      targetSpd += (form.burst * 0.15);
      stam -= 0.25;
    } else if (progress > 0.68 && stam > 15) {
      targetSpd += (form.end * 0.12) + form.lateKick;
      stam -= 0.18;
    } else {
      if (stam < 100) stam += (form.end * 0.04);
    }

    // Occasional spontaneous mid-race surge ("catching a second wind")
    if (Math.random() < 0.008 && stam > 25) {
      targetSpd += 0.75;
      stam -= 6;
      if (isPlayerSide) race.logText = `${baseH.name.toUpperCase()} FINDS A SECOND WIND!`;
    }

    for (let obs of race.obstacles) {
      let passed = isPlayerSide ? obs.passedP : obs.passedR;
      if (!passed && Math.abs(obs.dist - dist) < 35 && obs.lane === lane) {
        if (isPlayerSide) obs.passedP = true; else obs.passedR = true;
        // Balanced obstacle clear chance with extra luck factor
        let clearChance = 0.22 + (form.agi / 16);
        if (course.mod === 'SNOW') clearChance += (form.snow / 32);
        if (course.mod === 'MUD')  clearChance = 0.20 + (form.might / 18) + (form.agi / 30);

        if (Math.random() < clearChance) {
          if (isPlayerSide) race.logText = `${baseH.name.toUpperCase()} CLEARS ${course.obs}!`;
        } else {
          stumble = (baseH.fearless || (course.mod === 'MUD' && form.might >= 9)) ? 16 : 32;
          if (isPlayerSide) race.logText = `${baseH.name.toUpperCase()} BOGGED IN ${course.obs}!`;
        }
      }
    }

    if (stumble > 0) {
      targetSpd *= (course.mod === 'MUD' && form.might >= 9) ? 0.76 : 0.62;
      stumble--;
    }

    // Dynamic stride rhythm + organic momentum wave
    targetSpd += Math.sin(frame * form.surgeFreq + form.surgePhase) * 0.42;
    targetSpd += (Math.random() - 0.5) * 0.22;
    targetSpd = Math.max(1.6, targetSpd);

    dist += targetSpd;

    if (isPlayerSide) {
      race.pDist = dist; race.pSpd = targetSpd; race.pStam = stam; race.pStumble = stumble;
    } else {
      race.rDist = dist; race.rSpd = targetSpd; race.rStam = stam; race.rStumble = stumble;
    }
  }

  // --- INPUT ACTION DISPATCHER ---
  function triggerMenuCommand(cmd) {
    initAudio();
    if (state === 'TITLE') {
      if (cmd === 'BUTTON_A') {
        playTone(440, 'square', 0.1);
        hubChoice = 0;
        state = 'HUB';
      }
    }
    else if (state === 'HUB') {
      if (cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN' || cmd === 'DPAD_LEFT' || cmd === 'DPAD_RIGHT') {
        hubChoice = (hubChoice + 1) % 2;
        playTone(340, 'triangle', 0.06);
      }
      if (cmd === 'BUTTON_A') {
        playTone(523, 'square', 0.12);
        if (hubChoice === 0) {
          generatePreRaceBoard();
          state = 'LISTING';
        } else {
          grangeIdx = 0;
          state = 'GRANGE';
        }
      }
    }
    else if (state === 'GRANGE') {
      if (cmd === 'DPAD_LEFT') {
        grangeIdx = (grangeIdx + HORSE_ROSTER.length - 1) % HORSE_ROSTER.length;
        playTone(350, 'triangle', 0.06);
      }
      if (cmd === 'DPAD_RIGHT') {
        grangeIdx = (grangeIdx + 1) % HORSE_ROSTER.length;
        playTone(350, 'triangle', 0.06);
      }
      if (cmd === 'BUTTON_B') {
        playTone(420, 'triangle', 0.08);
        state = 'HUB';
      }
      if (cmd === 'BUTTON_A') {
        // Proceed directly to Race Listing from La Grange
        playTone(523, 'square', 0.12);
        generatePreRaceBoard();
        state = 'LISTING';
      }
    }
    else if (state === 'LISTING') {
      if (cmd === 'BUTTON_B') {
        cardSide = (cardSide + 1) % 2;
        setupRow = 0;
        playTone(460, 'triangle', 0.08);
        return;
      }

      if (cardSide === 0) {
        if (cmd === 'DPAD_UP') { setupRow = (setupRow + 2) % 3; playTone(300, 'triangle', 0.05); }
        if (cmd === 'DPAD_DOWN') { setupRow = (setupRow + 1) % 3; playTone(300, 'triangle', 0.05); }
        
        if (cmd === 'DPAD_LEFT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) selListingIdx = (selListingIdx + 2) % 3;
          if (setupRow === 1) selPrefHorse = (selPrefHorse + 1) % 2;
        }
        if (cmd === 'DPAD_RIGHT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) selListingIdx = (selListingIdx + 1) % 3;
          if (setupRow === 1) selPrefHorse = (selPrefHorse + 1) % 2;
        }
        if (cmd === 'BUTTON_A') {
          if (setupRow === 0) {
            setupRow = 1;
            playTone(380, 'triangle', 0.05);
          } else if (setupRow === 1) {
            setupRow = 2;
            playTone(380, 'triangle', 0.05);
          } else {
            playTone(523, 'square', 0.12);
            resolveWagerAndDraft();
            state = 'CAPTAIN';
          }
        }
      } else {
        // Secondary Card: Dedicated Full Firebag Wager Stager
        if (cmd === 'DPAD_LEFT') {
          activeBagSlot = (activeBagSlot + 3) % 4;
          playTone(350, 'triangle', 0.05);
        }
        if (cmd === 'DPAD_RIGHT') {
          activeBagSlot = (activeBagSlot + 1) % 4;
          playTone(350, 'triangle', 0.05);
        }
        if (cmd === 'BUTTON_A') {
          let k = ITEMS[activeBagSlot].key;
          let owned = firebag[k];
          if (owned > 0) {
            let nextQty = (stagedBet[k] + 1) % (owned + 1);
            let otherStaged = getBagScore(stagedBet) - (stagedBet[k] * ITEMS[activeBagSlot].val);
            if (nextQty === 0 && otherStaged === 0) {
              nextQty = 1;
              playTone(220, 'sawtooth', 0.06);
            } else {
              stagedBet[k] = nextQty;
              playTone(420, 'triangle', 0.06);
            }
          } else {
            playTone(180, 'sawtooth', 0.06);
          }
        }
      }
    }
    else if (state === 'CAPTAIN') {
      if (cmd === 'BUTTON_A') {
        playTone(523, 'square', 0.12);
        setupRace();
        state = 'READY';
      }
    }
    else if (state === 'READY') {
      if (cmd === 'BUTTON_A') {
        state = 'COUNTDOWN';
        race.countdownVal = 3;
        race.countdownTimer = 50;
        playTone(440, 'square', 0.15);
      }
    }
    else if (state === 'RESULT') {
      if (cmd === 'BUTTON_A') {
        playTone(440, 'square', 0.1);
        if (getBagScore(firebag) <= 0) {
          resetFirebag();
          state = 'TITLE';
        } else {
          hubChoice = 0;
          state = 'HUB';
        }
      }
    }
  }

  // --- ARCADE CABINET POSTMESSAGE BRIDGE (Single Source of Truth) ---
  const dpadHold = {
    UP:    { active: false, holdUntil: 0, nextRepeat: 0 },
    DOWN:  { active: false, holdUntil: 0, nextRepeat: 0 },
    LEFT:  { active: false, holdUntil: 0, nextRepeat: 0 },
    RIGHT: { active: false, holdUntil: 0, nextRepeat: 0 }
  };
  const btnDebounce = { BUTTON_A: 0, BUTTON_B: 0 };
  const HOLD_WINDOW_MS = 145;
  const REPEAT_DELAY_MS = 185;
  const DEBOUNCE_MS = 110;

  function clearInputStates() {
    for (const dir in dpadHold) {
      dpadHold[dir].active = false;
      dpadHold[dir].holdUntil = 0;
      dpadHold[dir].nextRepeat = 0;
    }
  }

  function processHeldInputs(now) {
    for (const dir in dpadHold) {
      const slot = dpadHold[dir];
      if (!slot.active) continue;
      if (now > slot.holdUntil) {
        slot.active = false;
        continue;
      }
      if (now >= slot.nextRepeat) {
        triggerMenuCommand('DPAD_' + dir);
        slot.nextRepeat = now + REPEAT_DELAY_MS;
      }
    }
  }

  window.addEventListener('message', function(event) {
    const raw = event.data;
    const msg = (typeof raw === 'string') ? raw : (raw && (raw.type || raw.action || raw.cmd));
    if (!msg || typeof msg !== 'string') return;

    if (msg === 'PAUSE') {
      isPaused = true;
      clearInputStates();
      return;
    }
    if (msg === 'RESUME') {
      isPaused = false;
      clearInputStates();
      return;
    }
    if (isPaused) return;

    const now = performance.now();

    const cardinals = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
    for (const dir of cardinals) {
      if (msg === `DPAD_${dir}` || msg === `DPAD_${dir}_PRESS`) {
        const slot = dpadHold[dir];
        if (!slot.active) {
          triggerMenuCommand(`DPAD_${dir}`);
          slot.nextRepeat = now + REPEAT_DELAY_MS;
        }
        slot.active = true;
        slot.holdUntil = now + HOLD_WINDOW_MS;
        return;
      }
      if (msg === `DPAD_${dir}_RELEASE`) {
        dpadHold[dir].active = false;
        dpadHold[dir].holdUntil = 0;
        return;
      }
    }

    if (msg === 'BUTTON_A' || msg === 'BUTTON_A_PRESS') {
      if (now - btnDebounce.BUTTON_A >= DEBOUNCE_MS) {
        btnDebounce.BUTTON_A = now;
        triggerMenuCommand('BUTTON_A');
      }
      return;
    }
    if (msg === 'BUTTON_B' || msg === 'BUTTON_B_PRESS') {
      if (now - btnDebounce.BUTTON_B >= DEBOUNCE_MS) {
        btnDebounce.BUTTON_B = now;
        triggerMenuCommand('BUTTON_B');
      }
      return;
    }
  });

  // --- UPDATE LOOP ---
  function update() {
    if (isPaused) return;
    processHeldInputs(performance.now());
    frame++;

    if (state === 'COUNTDOWN') {
      race.countdownTimer--;
      if (race.countdownTimer <= 0) {
        race.countdownVal--;
        if (race.countdownVal > 0) {
          race.countdownTimer = 50;
          playTone(440, 'square', 0.15);
        } else {
          playGunshot();
          race.bangFlash = 12;
          race.logText = "BANG! THEY'RE OFF!";
          state = 'RACING';
        }
      }
    }
    else if (state === 'RACING') {
      if (race.bangFlash > 0) race.bangFlash--;
      simulateHorse(true);
      simulateHorse(false);

      const HORSE_NOSE_OFFSET = 46;
      if ((race.pDist + HORSE_NOSE_OFFSET) >= race.dist || (race.rDist + HORSE_NOSE_OFFSET) >= race.dist) {
        if (race.pDist >= race.rDist) {
          race.winner = 'PLAYER';
          settleFirebagOutcome(true);
        } else {
          race.winner = 'RIVAL';
          settleFirebagOutcome(false);
        }
        race.photoTimer = 75;
        race.logText = "PHOTO FINISH AT THE LINE!";
        playTone(880, 'square', 0.08, 0.15);
        state = 'PHOTO_FINISH';
      }
    }
    else if (state === 'PHOTO_FINISH') {
      race.photoTimer--;
      if (race.photoTimer <= 0) {
        race.runoutTimer = 55;
        race.logText = race.winner === 'PLAYER' ? "TOP LANE TAKES THE RIBBON!" : "BOTTOM LANE TAKES THE RIBBON!";
        if (race.winner === 'PLAYER') playTone(587, 'square', 0.3);
        else playTone(196, 'sawtooth', 0.3);
        state = 'RUNOUT';
      }
    }
    else if (state === 'RUNOUT') {
      race.pDist += race.pSpd * 0.85;
      race.rDist += race.rSpd * 0.85;
      race.runoutTimer--;
      if (race.runoutTimer <= 0) {
        state = 'RESULT';
      }
    }
  }

  function drawDetailedHorse(x, y, horseIdx, riderIdx, animIdx, isStumbling = false, scale = 2) {
    const h = HORSE_ROSTER[horseIdx];
    const rSkin = RIDER_SKINS[riderIdx];
    const coat = PAL.COATS[h.coat];
    const matrix = HORSE_FRAMES[animIdx % 3];

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x + 3 * scale, y + 13.5 * scale, 17 * scale, 2 * scale);

    const pMap = {
      '1': PAL.BLACK,
      '2': coat.b,
      '3': coat.h,
      '4': coat.s,
      '5': coat.m,
      '6': rSkin.tunic,
      '7': rSkin.accent,
      '8': PAL.SKIN,
      '9': coat.sp ? coat.sp : coat.b,
      'H': rSkin.hat,
      'T': rSkin.trim
    };

    let yOffset = (isStumbling && state === 'RACING') ? (frame % 4 < 2 ? -2 : 2) : 0;

    for (let r = 0; r < matrix.length; r++) {
      for (let c = 0; c < matrix[r].length; c++) {
        const ch = matrix[r][c];
        if (ch !== '0') {
          ctx.fillStyle = pMap[ch];
          ctx.fillRect(x + c * scale, y + yOffset + r * scale, scale, scale);
        }
      }
    }
  }

  function drawSnowSpruce(x, y, hScale = 1) {
    const w = Math.floor(14 * hScale);
    const trunkH = Math.floor(5 * hScale);
    ctx.fillStyle = '#3E2723';
    ctx.fillRect(x + Math.floor(w / 2) - 1, y + Math.floor(20 * hScale), 3, trunkH);

    const tiers = [
      { ty: 0,  tw: 4,  th: 5 },
      { ty: 4,  tw: 8,  th: 5 },
      { ty: 9,  tw: 11, th: 6 },
      { ty: 14, tw: 14, th: 6 }
    ];
    tiers.forEach(t => {
      let bx = x + Math.floor((w - t.tw * hScale) / 2);
      let by = y + Math.floor(t.ty * hScale);
      let bw = Math.floor(t.tw * hScale);
      let bh = Math.floor(t.th * hScale);

      ctx.fillStyle = PAL.SPRUCE_DARK;
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = PAL.SPRUCE_MID;
      ctx.fillRect(bx + 1, by, Math.max(1, bw - 3), bh - 1);
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(bx, by, bw, Math.max(1, Math.floor(2 * hScale)));
      ctx.fillStyle = PAL.ICE_MID;
      ctx.fillRect(bx + 1, by + Math.max(1, Math.floor(2 * hScale)), Math.max(1, bw - 2), 1);
    });
  }

      ctx.fillRect(x, y + 18, w, 8);
      drawSnowSpruce(x + 8, y + 6, 0.65);
      drawSnowSpruce(x + 68, y + 5, 0.7);
      drawWinterGrassClump(x + 36, y + 18);

      ctx.fillStyle = PAL.DARK_GREEN;
      ctx.fillRect(x + 10, y + 9, 8, 9);
      ctx.fillStyle = PAL.LIMESTONE_LIGHT;
      ctx.fillRect(x + 56, y + 13, 12, 6);
      ctx.fillStyle = PAL.RED;

      ctx.fillStyle = PAL.MARSH_MUD;

      ctx.fillRect(x + 50, y + 48, 26, 3);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x, y + Math.floor(h * 0.70), w, 1);

    let anim = Math.floor(frame / 6);
    drawDetailedHorse(x + 6,  y + 20, listing.horseA, listing.riderA, anim, false, 1.35);
    drawDetailedHorse(x + 48, y + 34, listing.horseB, listing.riderB, anim + 1, false, 1.35);
  }

      let bgOff = (scrollPx * 0.3) % 480;

        drawTipi(i - bgOff + 92, 78);

        drawPrairieGrassTuft(i - bgOff + 154, 100, false);
        drawPrairieBuffalo(i - bgOff + 188, 82, true);
        drawPrairieBuffalo(i - bgOff + 222, 85, true);
        drawPrairieGrassTuft(i - bgOff + 260, 96, false);
        drawPrairieBuffalo(i - bgOff + 296, 81, false);
        drawPrairieGrassTuft(i - bgOff + 340, 95, false);
        drawPrairieGrassTuft(i - bgOff + 372, 101, true);
        drawPrairieGrassTuft(i - bgOff + 410, 94, false);

      let bgOff = (scrollPx * 0.35) % 640;
      for (let i = -320; i < VIEW_W + 640; i += 320) {

          { dx: 18, lush: true },
          { dx: 88, lush: false },
          { dx: 142, lush: true },
          { dx: 215, lush: false },
          { dx: 288, lush: true }
        ];
        tufts.forEach(t => {
          let tx = i - (bgOff % 320) + t.dx;
          if (tx < valleyX + 10 || tx > valleyX + 76) {
            drawPrairieGrassTuft(tx, 86, t.lush);
          }
        });
      }

      ctx.fillStyle = PAL.DARK_GREEN;
      for (let sx = -160; sx < bgSpan; sx += 24) {
        let bx = sx - (bgOff % 24);
        if (bx < valleyX + 12 || bx > valleyX + 74) {
          ctx.fillRect(bx + 2, 93, 10, 3);
          ctx.fillStyle = PAL.MUTED_GREEN;
          ctx.fillRect(bx + 4, 92, 6, 2);
          ctx.fillStyle = PAL.DARK_GREEN;
        }
      }

      ctx.fillStyle = PAL.OCEAN; ctx.fillRect(0, 96, VIEW_W, 12);
      ctx.fillStyle = PAL.SEA_GREEN;
      let waterTick = (state === 'PHOTO_FINISH') ? 0 : frame;
      let waterOff = (scrollPx * 0.5 + waterTick * 0.6) % 80;
      for (let wx = -80; wx < VIEW_W + 160; wx += 80) {
        ctx.fillRect(wx - waterOff + 10, 99, 18, 1);
        ctx.fillRect(wx - waterOff + 42, 104, 22, 1);
      }

      ctx.fillStyle = PAL.DARK_GREEN;  ctx.fillRect(0, 108, VIEW_W, 8);
      ctx.fillStyle = PAL.MUTED_GREEN; ctx.fillRect(0, 116, VIEW_W, 62);
      ctx.fillStyle = PAL.LUSH_GREEN;  ctx.fillRect(0, 178, VIEW_W, VIEW_H - 178);

        drawPrairieGrassTuft(i - fgOff + 52, 107, false);
        ctx.fillStyle = PAL.DARK_GREEN;
        ctx.fillRect(i - fgOff + 10, 145, 36, 4);
        ctx.fillStyle = PAL.MUTED_GREEN;
        ctx.fillRect(i - fgOff + 30, 200, 42, 4);

    else {

      ctx.fillStyle = '#588BAE'; ctx.fillRect(0, 42, VIEW_W, 28);
      ctx.fillStyle = '#9BC1BC'; ctx.fillRect(0, 70, VIEW_W, 12);

      ctx.fillStyle = PAL.MARSH_REED;  ctx.fillRect(0, 76, VIEW_W, 9);
      ctx.fillStyle = PAL.MUTED_GREEN; ctx.fillRect(0, 85, VIEW_W, 11);

      let churchX    = finishX - 18;

      let leftClip  = isRaceView ? Math.max(0, startFortX + 118) : 0;
      let rightClip = isRaceView ? Math.min(VIEW_W, churchX - 8) : VIEW_W;

      if (rightClip > leftClip) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(leftClip, 0, rightClip - leftClip, 96);
        ctx.clip();

        let bgOff = (scrollPx * 0.35) % 640;
        for (let i = -640; i < VIEW_W + 1280; i += 640) {
          drawSnowSpruce(i - bgOff + 24,   58, 1.0);
          drawWigwam(i - bgOff + 68,       67);
          drawShieldBoulder(i - bgOff + 112, 83, 1.1);
          drawRedRiverHouse(i - bgOff + 165, 65, false);
          drawRiverbankTree(i - bgOff + 235, 59, true);
          drawWigwam(i - bgOff + 295,      68);
          drawShieldBoulder(i - bgOff + 345, 82, 1.25);
          drawSnowSpruce(i - bgOff + 390,  57, 1.1);
          drawRedRiverHouse(i - bgOff + 455, 65, true);
          drawWigwam(i - bgOff + 520,      67);
          drawShieldBoulder(i - bgOff + 575, 83, 1.0);

          drawStoneFort(startFortX, 42, 0.80);

      let bgOff = (scrollPx * 0.35) % 320;

        drawPrairieGrassTuft(i - bgOff + 52, 86, true);
        drawShieldBoulder(i - bgOff + 108, 88, 1.0);
        drawPrairieGrassTuft(i - bgOff + 154, 86, false);

      let waterTick = (state === 'PHOTO_FINISH') ? 0 : frame;

        drawShieldBoulder(i - fgOff + 56, 107, 0.75);
        ctx.fillStyle = PAL.MARSH_WET;
        ctx.fillRect(i - fgOff + 12, 144, 38, 5);
        ctx.fillRect(i - fgOff + 32, 198, 44, 5);

    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 174, VIEW_W, 2);
  }

  // --- MAIN RENDER LOOP ---
  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE' || state === 'HUB') {
      drawCourseBackdrop(1, frame * 1.5);
      const centerX = Math.floor(VIEW_W / 2);
      drawDetailedHorse(centerX - 80, 130, 0, 0, Math.floor(frame / 6), false, 2);
      drawDetailedHorse(centerX + 20, 180, 5, 1, Math.floor((frame + 3) / 6), false, 2);

      if (state === 'TITLE') {
        ctx.fillStyle = 'rgba(14, 42, 30, 0.92)';
        ctx.fillRect(OX + 14, 18, 292, 76);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(OX + 14, 18, 292, 76);

        drawPixelText("AEN ZHWAAL", OX + 160, 47, 20, PAL.GOLD, 'center');
        drawPixelText("HORSE RACING AT THE RED RIVER SETTLEMENT", OX + 160, 66, 6, PAL.HIDE, 'center');
        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' TO START", OX + 160, 84, 8, PAL.SEA_GREEN, 'center');
        }
      } else {
        // Post-Title Choice Text Box: "To Race Listing" or "La Grange"
        ctx.fillStyle = 'rgba(14, 42, 30, 0.95)';
        ctx.fillRect(OX + 28, 22, 264, 82);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(OX + 28, 22, 264, 82);

        drawPixelText("RED RIVER GROUNDS", OX + 160, 38, 7, PAL.HIDE, 'center');

        const opts = [
          { label: "TO RACE LISTING", sub: "WAGER & MATCHUP BOARD" },
          { label: "LA GRANGE",       sub: "STABLE & BREED GUIDE" }
        ];
        for (let i = 0; i < 2; i++) {
          let by = 48 + i * 24;
          let isSel = (hubChoice === i);
          ctx.fillStyle = isSel ? PAL.BORDEAUX : PAL.BLACK;
          ctx.fillRect(OX + 42, by, 236, 20);
          ctx.strokeStyle = isSel ? PAL.GOLD : PAL.MUTED_GREEN;
          ctx.lineWidth = isSel ? 2 : 1;
          ctx.strokeRect(OX + 42, by, 236, 20);

          drawPixelText((isSel ? "> " : "  ") + opts[i].label, OX + 50, by + 13, 8, isSel ? PAL.GOLD : PAL.WHITE);
        }
      }
    }
    else if (state === 'GRANGE') {
      // Full-Screen Interactive Info-Carousel Reader ("La Grange")
      const hInfo = HORSE_ROSTER[grangeIdx];
      drawGrangeDwelling(grangeIdx);

      // Top HUD Bar anchored at y = 0 across full VIEW_W
      ctx.fillStyle = 'rgba(14, 42, 30, 0.92)';
      ctx.fillRect(0, 0, VIEW_W, 24);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(0, 24, VIEW_W, 2);

      drawPixelText(`LA GRANGE (${grangeIdx + 1}/6)`, 10, 15, 7, PAL.GOLD);
      drawPixelText(`< ${hInfo.name.toUpperCase()} >`, Math.floor(VIEW_W / 2), 15, 7, PAL.WHITE, 'center');
      drawPixelText(hInfo.dwellingTitle, VIEW_W - 10, 15, 5, PAL.SEA_GREEN, 'right');

      // Semi-Transparent Text Box with Hunt Captain Portrait & Full Colourful Description
      const boxH = 74;
      const boxY = VIEW_H - boxH - 18;
      ctx.fillStyle = 'rgba(14, 42, 30, 0.86)';
      ctx.fillRect(OX + 10, boxY, 300, boxH);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(OX + 10, boxY, 300, boxH);

      // Hunt Captain Mini Portrait inside left of box
      ctx.fillStyle = PAL.BORDEAUX; ctx.fillRect(OX + 16, boxY + 8, 28, 28);
      ctx.fillStyle = PAL.SKIN;     ctx.fillRect(OX + 23, boxY + 14, 14, 13);
      ctx.fillStyle = PAL.RED;      ctx.fillRect(OX + 21, boxY + 9, 18, 6);
      ctx.fillStyle = PAL.BLACK;    ctx.fillRect(OX + 23, boxY + 22, 14, 7);
      ctx.fillStyle = PAL.GOLD;     ctx.fillRect(OX + 20, boxY + 29, 20, 7);

      drawPixelText(`${hInfo.name} (${hInfo.breed})`, OX + 50, boxY + 16, 6, PAL.GOLD);

      // Word-wrap Hunt Captain's full colourful description
      const words = hInfo.captainDesc.split(' ');
      let lines = [], line = '';
      words.forEach(w => {
        if ((line + w).length > 38) { lines.push(line); line = w + ' '; }
        else line += w + ' ';
      });
      lines.push(line);

      lines.slice(0, 4).forEach((l, idx) => {
        drawPixelText(l, OX + 50, boxY + 29 + idx * 10, 5, PAL.WHITE);
      });

      // Bottom Navigation Bar anchored at VIEW_H - 15
      ctx.fillStyle = PAL.BLACK;
      ctx.fillRect(0, VIEW_H - 15, VIEW_W, 15);
      drawPixelText("LEFT/RIGHT: BREED | B: BACK | A: TO RACES", Math.floor(VIEW_W / 2), VIEW_H - 5, 5, PAL.GOLD, 'center');
    }
    else if (state === 'LISTING') {
      ctx.fillStyle = PAL.DARK_GREEN;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);

      const bagTotal = getBagScore(firebag);
      const currentBetVal = getBagScore(stagedBet);

      // Top HUD Bar anchored at y = 0 across full VIEW_W
      ctx.fillStyle = PAL.BLACK;
      ctx.fillRect(0, 0, VIEW_W, 20);
      ctx.fillStyle = PAL.HIDE;
      ctx.fillRect(0, 20, VIEW_W, 1);

      drawPixelText(`FIREBAG:${bagTotal}`, 8, 13, 7, PAL.SEA_GREEN);
      drawPixelText(cardSide === 0 ? "[B:OPEN FIREBAG]" : "[B:RACE CARD]", Math.floor(VIEW_W / 2), 13, 5, PAL.GOLD, 'center');
      drawPixelText(`VS:${curOpponent.name}`, VIEW_W - 8, 13, 7, PAL.GOLD, 'right');

      if (cardSide === 0) {
        drawPixelText(`${curOpponent.style} | SEEKING:${curOpponent.seekingName.toUpperCase()}`, VIEW_W - 8, 30, 5, PAL.HIDE, 'right');
        drawPixelText(`"${curOpponent.quote}"`, VIEW_W - 8, 39, 5, PAL.GRAY_LIGHT, 'right');

        const colW = 98;
        const startX = OX + 9;
        for (let i = 0; i < 3; i++) {
          let cx = startX + i * (colW + 4);
          let cy = 44;
          let isCardSel = (selListingIdx === i);
          let isFocusRow0 = (setupRow === 0 && isCardSel);

          ctx.fillStyle = isCardSel ? '#1E3D2F' : PAL.BLACK;
          ctx.fillRect(cx, cy, colW, 106);
          ctx.strokeStyle = isFocusRow0 ? PAL.GOLD : (isCardSel ? PAL.SEA_GREEN : PAL.GRAY_DARK);
          ctx.lineWidth = isCardSel ? 2 : 1;
          ctx.strokeRect(cx, cy, colW, 106);

          let cName = COURSES[raceListings[i].courseIdx].short;
          drawPixelText(cName, cx + colW / 2, cy + 10, 6, isCardSel ? PAL.GOLD : PAL.WHITE, 'center');

          drawMiniScenePreview(cx + 5, cy + 14, 88, 56, raceListings[i]);
          ctx.strokeStyle = PAL.BLACK; ctx.lineWidth = 1;
          ctx.strokeRect(cx + 5, cy + 14, 88, 56);

          let hA = HORSE_ROSTER[raceListings[i].horseA].name;
          let hB = HORSE_ROSTER[raceListings[i].horseB].name;
          let isPrefA = (isCardSel && selPrefHorse === 0);
          let isPrefB = (isCardSel && selPrefHorse === 1);

          drawPixelText((isPrefA ? "*" : "") + hA, cx + colW / 2, cy + 82, 5, isPrefA ? PAL.SEA_GREEN : PAL.WHITE, 'center');
          drawPixelText("VS", cx + colW / 2, cy + 91, 5, PAL.GRAY_LIGHT, 'center');
          drawPixelText((isPrefB ? "*" : "") + hB, cx + colW / 2, cy + 100, 5, isPrefB ? PAL.SEA_GREEN : PAL.WHITE, 'center');
        }

        const activeList = raceListings[selListingIdx];
        const prefHorseObj = HORSE_ROSTER[selPrefHorse === 0 ? activeList.horseA : activeList.horseB];

        ctx.fillStyle = setupRow === 1 ? PAL.BORDEAUX : PAL.BLACK;
        ctx.fillRect(OX + 9, 155, 302, 18);
        ctx.strokeStyle = setupRow === 1 ? PAL.GOLD : PAL.MUTED_GREEN;
        ctx.lineWidth = 1;
        ctx.strokeRect(OX + 9, 155, 302, 18);
        drawPixelText((setupRow === 1 ? ">" : " ") + "PREF MOUNT:", OX + 14, 167, 6, PAL.WHITE);
        drawPixelText(`< ${prefHorseObj.name} >`, OX + 305, 167, 6, PAL.SEA_GREEN, 'right');

        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(OX + 9, 177, 302, 18);
        ctx.strokeStyle = PAL.MUTED_GREEN;
        ctx.strokeRect(OX + 9, 177, 302, 18);
        drawPixelText(`YOUR WAGER: ${currentBetVal} PTS`, OX + 14, 189, 6, PAL.GOLD);
        drawPixelText("PRESS B TO EDIT BAG", OX + 305, 189, 5, PAL.SEA_GREEN, 'right');

        const btnH = 28;
        const btnY = VIEW_H - btnH - 8;
        let isBtnFocus = (setupRow === 2);
        ctx.fillStyle = isBtnFocus ? PAL.GOLD : PAL.BORDEAUX;
        ctx.fillRect(OX + 58, btnY, 204, btnH);
        ctx.strokeStyle = isBtnFocus ? PAL.WHITE : PAL.GOLD;
        ctx.lineWidth = 2;
        ctx.strokeRect(OX + 58, btnY, 204, btnH);
        drawPixelText("KOMANSE!", OX + 160, btnY + 19, 11, isBtnFocus ? PAL.BLACK : PAL.GOLD, 'center', !isBtnFocus);
      } 
      else {
        // Dedicated Full Firebag Wager Card (Spacious & Clear, no breed guide here)
        ctx.fillStyle = '#172E24';
        ctx.fillRect(OX + 9, 28, 302, 182);
        ctx.strokeStyle = PAL.GOLD;
        ctx.lineWidth = 2;
        ctx.strokeRect(OX + 9, 28, 302, 182);

        drawPixelText("FIREBAG WAGER", OX + 16, 44, 8, PAL.GOLD);
        drawPixelText(`BET: ${currentBetVal} / ${bagTotal} PTS`, OX + 304, 44, 7, PAL.SEA_GREEN, 'right');

        for (let idx = 0; idx < 4; idx++) {
          const it = ITEMS[idx];
          const owned = firebag[it.key];
          const betQty = stagedBet[it.key];
          const sx = OX + 15 + idx * 73;
          const sy = 56;
          const sw = 69;
          const sh = 128;
          const isSlotSel = (activeBagSlot === idx);

          ctx.fillStyle = betQty > 0 ? '#1C3F31' : PAL.BLACK;
          ctx.fillRect(sx, sy, sw, sh);
          ctx.strokeStyle = isSlotSel ? PAL.GOLD : (betQty > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK);
          ctx.lineWidth = isSlotSel ? 2 : 1;
          ctx.strokeRect(sx, sy, sw, sh);

          // Scaled up 2x Icon
          ctx.save();
          ctx.translate(sx + 24, sy + 12);
          ctx.scale(2, 2);
          drawFirebagItemIcon(0, 0, idx, owned === 0);
          ctx.restore();

          drawPixelText(it.short, sx + sw / 2, sy + 48, 7, owned > 0 ? PAL.WHITE : PAL.GRAY_DARK, 'center');
          drawPixelText(`${it.val} PT${it.val > 1 ? 'S' : ''}`, sx + sw / 2, sy + 64, 6, PAL.HIDE, 'center');

          drawPixelText(`OWN:${owned}`, sx + sw / 2, sy + 88, 6, owned > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK, 'center');
          drawPixelText(`BET:${betQty}`, sx + sw / 2, sy + 110, 7, betQty > 0 ? PAL.GOLD : PAL.GRAY_LIGHT, 'center');
        }

        drawPixelText("LEFT/RIGHT: SELECT   A: +1 / TOGGLE", OX + 160, 200, 5, PAL.HIDE, 'center');

        const footerH = 16;
        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(0, VIEW_H - footerH, VIEW_W, footerH);
        drawPixelText("PRESS 'B' TO RETURN TO RACE CARD", Math.floor(VIEW_W / 2), VIEW_H - 5, 6, PAL.GOLD, 'center');
      }
    }
    else if (state === 'CAPTAIN') {
      drawCourseBackdrop(match.courseIdx, 0);
      ctx.fillStyle = 'rgba(14, 42, 30, 0.93)';
      ctx.fillRect(OX + 14, 18, 292, 204);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(OX + 14, 18, 292, 204);

      ctx.fillStyle = PAL.BORDEAUX; ctx.fillRect(OX + 24, 30, 34, 34);
      ctx.fillStyle = PAL.SKIN; ctx.fillRect(OX + 33, 38, 16, 15);
      ctx.fillStyle = PAL.RED; ctx.fillRect(OX + 31, 32, 20, 7);
      ctx.fillStyle = PAL.BLACK; ctx.fillRect(OX + 33, 47, 16, 8);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(OX + 29, 55, 24, 9);

      drawPixelText("BUFFALO HUNT CAPTAIN", OX + 66, 43, 8, PAL.GOLD);
      drawPixelText(`POT: ${match.effectivePot} PTS | ${COURSES[match.courseIdx].short}`, OX + 66, 57, 6, PAL.SEA_GREEN);

      const words = captainText.split(' ');
      let lines = [], line = '';
      words.forEach(w => {
        if ((line + w).length > 35) { lines.push(line); line = w + ' '; }
        else line += w + ' ';
      });
      lines.push(line);

      lines.forEach((l, idx) => {
        drawPixelText(l, OX + 24, 80 + idx * 13, 6, PAL.WHITE);
      });

      if (frame % 50 < 30) {
        drawPixelText("PRESS 'A' TO WATCH RACE", OX + 160, 210, 7, PAL.GOLD, 'center');
      }
    }
    else if (state === 'READY' || state === 'COUNTDOWN' || state === 'RACING' || state === 'PHOTO_FINISH' || state === 'RUNOUT' || state === 'RESULT') {
      drawCourseBackdrop(match.courseIdx, race.pDist);

      let startX = 48 - race.pDist;
      if (startX > -10 && startX < VIEW_W + 10) {
        ctx.fillStyle = PAL.HIDE;
        ctx.fillRect(startX, 112, 3, VIEW_H - 112);
      }

      let finishX = 48 + (race.dist - race.pDist);
      if (finishX > -20 && finishX < VIEW_W + 20) {
        ctx.fillStyle = PAL.BORDEAUX;
        ctx.fillRect(finishX, 112, 4, VIEW_H - 112);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(finishX + 1, 112, 2, VIEW_H - 112);
      }

      const mod = COURSES[match.courseIdx].mod;
      race.obstacles.forEach(obs => {
        let ox = 48 + (obs.dist - race.pDist);
        if (ox > -30 && ox < VIEW_W + 30) {
          let oy = obs.lane === 0 ? 142 : 202;
          if (mod === 'SNOW') {
            ctx.fillStyle = PAL.OCEAN; ctx.fillRect(ox, oy, 22, 8);
            ctx.fillStyle = PAL.WHITE; ctx.fillRect(ox + 3, oy + 2, 16, 3);
          } else if (mod === 'FLAT') {
            ctx.fillStyle = PAL.BLACK; ctx.fillRect(ox, oy + 2, 14, 6);
            ctx.fillStyle = '#5E1E0C'; ctx.fillRect(ox - 2, oy + 6, 18, 3);
          } else if (mod === 'BUMPS') {
            ctx.fillStyle = '#3E2723'; ctx.fillRect(ox, oy, 24, 9);
            ctx.fillStyle = PAL.DARK_GREEN; ctx.fillRect(ox + 4, oy + 2, 16, 4);
          } else {
            ctx.fillStyle = '#26180D'; ctx.fillRect(ox, oy, 26, 10);
            ctx.fillStyle = PAL.ICE_DARK; ctx.fillRect(ox + 4, oy + 2, 18, 5);
            ctx.fillStyle = PAL.ICE_LIGHT; ctx.fillRect(ox + 7, oy + 3, 7, 2);
          }
        }
      });

      let isAnimating = (state === 'RACING' || state === 'RUNOUT');
      let pAnim = (state === 'PHOTO_FINISH') ? 0 : (isAnimating ? Math.floor(frame / 4) : 1);
      let rAnim = (state === 'PHOTO_FINISH') ? 0 : (isAnimating ? Math.floor((frame + 2) / 4) : 1);

      drawDetailedHorse(48, 120, match.playerHorseIdx, match.playerRiderIdx, pAnim, race.pStumble > 0, 2);

      let rScreenX = 48 + (race.rDist - race.pDist);
      if (rScreenX > -60 && rScreenX < VIEW_W + 60) {
        drawDetailedHorse(rScreenX, 180, match.npcHorseIdx, match.npcRiderIdx, rAnim, race.rStumble > 0, 2);
      }

      if (state === 'PHOTO_FINISH' && race.photoTimer > 67) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }

      if (race.bangFlash > 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }

      const topHudH = 28;
      ctx.fillStyle = PAL.BLACK; ctx.fillRect(0, 0, VIEW_W, topHudH);
      ctx.fillStyle = PAL.GOLD;  ctx.fillRect(0, topHudH, VIEW_W, 2);

      const barW = Math.max(180, VIEW_W - 140);
      ctx.fillStyle = PAL.GRAY_DARK; ctx.fillRect(10, 8, barW, 12);
      let pPct = Math.min(1, race.pDist / race.dist);
      let rPct = Math.min(1, race.rDist / race.dist);
      ctx.fillStyle = PAL.RED;       ctx.fillRect(10 + rPct * (barW - 6), 14, 6, 6);
      ctx.fillStyle = PAL.SEA_GREEN; ctx.fillRect(10 + pPct * (barW - 6), 8, 6, 6);

      drawPixelText(`POT:${match.effectivePot}`, VIEW_W - 10, 17, 7, PAL.GOLD, 'right');

      const botHudH = 16;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, VIEW_H - botHudH, VIEW_W, botHudH);
      drawPixelText(race.logText, Math.floor(VIEW_W / 2), VIEW_H - 5, 6, PAL.WHITE, 'center');

      if (state === 'READY') {
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(OX + 30, 85, 260, 54);
        ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(OX + 30, 85, 260, 54);
        drawPixelText("RIDERS AT THE LINE", OX + 160, 106, 9, PAL.WHITE, 'center');
        if (frame % 40 < 25) {
          drawPixelText("PRESS 'A' FOR COUNTDOWN", OX + 160, 126, 8, PAL.GOLD, 'center');
        }
      }
      else if (state === 'COUNTDOWN') {
        let frenchWords = { 3: "TROIS...", 2: "DEUX...", 1: "UN!" };
        let txt = frenchWords[race.countdownVal] || "";
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(OX + 70, 85, 180, 50);
        ctx.strokeStyle = PAL.ORANGE; ctx.strokeRect(OX + 70, 85, 180, 50);
        drawPixelText(txt, OX + 160, 118, 16, PAL.GOLD, 'center');
      }
      else if (state === 'RESULT') {
        ctx.fillStyle = 'rgba(14, 42, 30, 0.95)';
        ctx.fillRect(OX + 18, 36, 284, 174);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(OX + 18, 36, 284, 174);

        const wonNames = match.npcWagerItems.map(it => it.name).join(' + ');
        if (race.winner === 'PLAYER') {
          drawPixelText("YOUR HORSE WINS!", OX + 160, 62, 10, PAL.SEA_GREEN, 'center');
          drawPixelText(`WON: ${wonNames}`, OX + 160, 82, 6, PAL.GOLD, 'center');
        } else {
          drawPixelText("OPPONENT WINS!", OX + 160, 62, 10, PAL.RED, 'center');
          drawPixelText(`LOST -${match.playerBetTotal} PTS OF GOODS`, OX + 160, 82, 7, PAL.HIDE, 'center');
        }

        drawPixelText(`FIREBAG SCORE: ${getBagScore(firebag)}`, OX + 160, 105, 8, PAL.WHITE, 'center');

        for (let idx = 0; idx < 4; idx++) {
          const it = ITEMS[idx];
          const bx = OX + 30 + idx * 66;
          const by = 116;
          ctx.fillStyle = PAL.BLACK;
          ctx.fillRect(bx, by, 60, 32);
          ctx.strokeStyle = firebag[it.key] > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK;
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by, 60, 32);
          drawFirebagItemIcon(bx + 4, by + 6, idx, firebag[it.key] === 0);
          drawPixelText(`${it.short}:${it.val}`, bx + 18, by + 14, 5, PAL.HIDE, 'left', false);
          drawPixelText(`x${firebag[it.key]}`, bx + 18, by + 26, 7, firebag[it.key] > 0 ? PAL.GOLD : PAL.GRAY_DARK, 'left', false);
        }

        if (getBagScore(firebag) <= 0) {
          drawPixelText("FIREBAG EMPTY! STARTING ANEW.", OX + 160, 168, 6, PAL.ORANGE, 'center');
        }
        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' TO CONTINUE", OX + 160, 194, 8, PAL.GOLD, 'center');
        }
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
