  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, dur, vol = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function playGunshot() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.45;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1100, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.45);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.65, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  }

  // --- PLAYER FIREBAG WALLET & STAGING ---
  let firebag = { moccasins: 1, capote: 1, sash: 0, robe: 0 };
  let stagedBet = { moccasins: 0, capote: 0, sash: 0, robe: 0 };
  let activeBagSlot = 0;
  let breedBrowseIdx = 0;

  function getBagScore(bag) {
    return (bag.moccasins * 1) + (bag.capote * 2) + (bag.sash * 3) + (bag.robe * 4);
  }

  function resetFirebag() {
    firebag = { moccasins: 1, capote: 1, sash: 0, robe: 0 };
    stagedBet = { moccasins: 0, capote: 0, sash: 0, robe: 0 };
  }

  function initDefaultBet() {
    stagedBet = { moccasins: 0, capote: 0, sash: 0, robe: 0 };
    activeBagSlot = 0;
    for (let i = 0; i < ITEMS.length; i++) {
      let k = ITEMS[i].key;
      if (firebag[k] > 0) {
        stagedBet[k] = 1;
        activeBagSlot = i;
        break;
      }
    }
  }

  // --- GENERATE 3 RANDOM MATCHUPS FROM THE 4-COURSE POOL ---
  function generatePreRaceBoard() {
    const playerTotal = getBagScore(firebag);
    const arch = OPPONENTS[Math.floor(Math.random() * OPPONENTS.length)];

    let maxCoverable = Math.min(arch.wMax, playerTotal);
    let minCoverable = Math.min(arch.wMin, maxCoverable);
    if (maxCoverable < 1) maxCoverable = 1;
    if (minCoverable < 1) minCoverable = 1;

    let npcWager = Math.floor(Math.random() * (maxCoverable - minCoverable + 1)) + minCoverable;

    let validSeek = arch.seeking.filter(idx => ITEMS[idx].val <= playerTotal);
    if (validSeek.length === 0) validSeek = [0];
    let seekingIdx = validSeek[Math.floor(Math.random() * validSeek.length)];

    let rem = npcWager;
    let npcItems = [];
    if (ITEMS[seekingIdx].val <= rem && ITEMS[seekingIdx].val <= playerTotal) {
      npcItems.push(ITEMS[seekingIdx]);
      rem -= ITEMS[seekingIdx].val;
    }
    for (let i = ITEMS.length - 1; i >= 0; i--) {
      while (rem >= ITEMS[i].val && ITEMS[i].val <= playerTotal) {
        npcItems.push(ITEMS[i]);
        rem -= ITEMS[i].val;
      }
    }

    curOpponent = {
      name: arch.names[Math.floor(Math.random() * arch.names.length)],
      group: arch.group,
      style: arch.style,
      seekingName: ITEMS[seekingIdx].name,
      wager: npcWager,
      wagerItems: npcItems,
      quote: arch.quote
    };

    // Draw 3 random courses from the 4-course pool
    let coursePool = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, 3);

    raceListings = [];
    for (let i = 0; i < 3; i++) {
      let cIdx = coursePool[i];
      let hA = Math.floor(Math.random() * HORSE_ROSTER.length);
      let hB = (hA + 1 + Math.floor(Math.random() * (HORSE_ROSTER.length - 1))) % HORSE_ROSTER.length;
      let rA = Math.floor(Math.random() * RIDER_SKINS.length);
      let rB = (rA + 1 + Math.floor(Math.random() * (RIDER_SKINS.length - 1))) % RIDER_SKINS.length;
      raceListings.push({
        courseIdx: cIdx,
        horseA: hA,
        horseB: hB,
        riderA: rA,
        riderB: rB
      });
    }

    selListingIdx = 0;
    selPrefHorse = 0;
    cardSide = 0;
    setupRow = 0;
    breedBrowseIdx = raceListings[0].horseA;
    initDefaultBet();
  }

  // --- RESOLVE WAGER PRIORITY & CAPTAIN BREAKDOWN ---
  function resolveWagerAndDraft() {
    const chosen = raceListings[selListingIdx];
    const preferredH = selPrefHorse === 0 ? chosen.horseA : chosen.horseB;
    const otherH     = selPrefHorse === 0 ? chosen.horseB : chosen.horseA;
    const preferredR = selPrefHorse === 0 ? chosen.riderA : chosen.riderB;
    const otherR     = selPrefHorse === 0 ? chosen.riderB : chosen.riderA;

    let pBet = getBagScore(stagedBet);
    if (pBet < 1) {
      initDefaultBet();
      pBet = getBagScore(stagedBet);
    }

    match.playerBetTotal = pBet;
    match.npcBetTotal = curOpponent.wager;
    match.npcWagerItems = curOpponent.wagerItems;
    match.effectivePot = pBet + curOpponent.wager;

    if (pBet > curOpponent.wager) {
      match.playerWonPick = true;
      match.playerHorseIdx = preferredH;
      match.playerRiderIdx = preferredR;
      match.npcHorseIdx = otherH;
      match.npcRiderIdx = otherR;
    } else {
      match.playerWonPick = false;
      match.npcHorseIdx = preferredH;
      match.npcRiderIdx = preferredR;
      match.playerHorseIdx = otherH;
      match.playerRiderIdx = otherR;
    }
    match.courseIdx = chosen.courseIdx;

    generateCaptainCommentary();
  }

  function formatBetSummary(bag) {
    let parts = [];
    ITEMS.forEach(it => {
      if (bag[it.key] > 0) parts.push(`${bag[it.key]} ${it.name}`);
    });
    return parts.join(', ');
  }

  function generateCaptainCommentary() {
    const c = COURSES[match.courseIdx];
    const pH = HORSE_ROSTER[match.playerHorseIdx];
    const nH = HORSE_ROSTER[match.npcHorseIdx];
    const betStr = formatBetSummary(stagedBet);

    let draftCall = "";
    if (match.playerWonPick) {
      draftCall = `Your stake (${betStr}) tops ${curOpponent.name}! You claim de ${pH.name}, leaving ${curOpponent.name} wid de ${nH.name}! `;
    } else if (match.playerBetTotal === match.npcBetTotal) {
      draftCall = `Even wagers on de barrel! Tie goes to ${curOpponent.name}, who claims de ${nH.name}! Your ${betStr} rides wid de ${pH.name}! `;
    } else {
      draftCall = `${curOpponent.name} outbids your stake and snatches de ${nH.name}! Dat puts your ${betStr} on de ${pH.name}! `;
    }

    let trackCall = "";
    if (c.mod === 'SNOW') {
      trackCall = "De Assiniboine river is froze hard—watch dem slick ice patches to de winter camp! ";
    } else if (c.mod === 'FLAT') {
      trackCall = "Flat prairie grass past de buffalo—pure speed to de cart circle! ";
    } else if (c.mod === 'BUMPS') {
      trackCall = "Summer bumps past de river-lot houses down into de Forks valley and up to Upper Fort Garry! ";
    } else {
      trackCall = "Spring ice melt at Lower Fort Garry! Heavy, dense mud along de rocky shore to St. Andrews stone church—stocky muscle rules today! ";
    }

    captainText = draftCall + trackCall + "Step back from de line, mes amis!";
  }

  // --- SETTLE FIREBAG ITEMS AT RACE END ---
  function settleFirebagOutcome(playerWon) {
    if (playerWon) {
      match.npcWagerItems.forEach(it => {
        firebag[it.key]++;
      });
    } else {
      ITEMS.forEach(it => {
        firebag[it.key] = Math.max(0, firebag[it.key] - stagedBet[it.key]);
      });
    }
    stagedBet = { moccasins: 0, capote: 0, sash: 0, robe: 0 };
  }

    const pH = HORSE_ROSTER[match.playerHorseIdx];
    const rH = HORSE_ROSTER[match.npcHorseIdx];
    race = {
      dist: 6500,
      pDist: 0, rDist: 0,
      pSpd: pH.spd, rSpd: rH.spd,
      pStam: 100, rStam: 100,
      pLane: 0, rLane: 1,
      pStumble: 0, rStumble: 0,
      obstacles: [],
      countdownVal: 3,
      countdownTimer: 0,
      bangFlash: 0,
      photoTimer: 0,
      runoutTimer: 0,
      winner: '',
      logText: 'AWAITING STARTER...'
    };
    for (let x = 500; x < 6200; x += 380 + Math.random() * 250) {
      race.obstacles.push({
        dist: x,
        lane: Math.random() > 0.5 ? 0 : 1,
        passedP: false,
        passedR: false
      });

  // --- AUTONOMOUS AI RACE SIMULATION ---
  function simulateHorse(isPlayerSide) {
    const h = isPlayerSide ? HORSE_ROSTER[match.playerHorseIdx] : HORSE_ROSTER[match.npcHorseIdx];
    const course = COURSES[match.courseIdx];
    let dist = isPlayerSide ? race.pDist : race.rDist;
    let stam = isPlayerSide ? race.pStam : race.rStam;
    let stumble = isPlayerSide ? race.pStumble : race.rStumble;
    let lane = isPlayerSide ? race.pLane : race.rLane;

    let targetSpd = h.spd;
    if (course.mod === 'SNOW') {
      targetSpd += (h.snow - 6) * 0.22;
    } else if (course.mod === 'FLAT') {
      targetSpd += 0.6;
    } else if (course.mod === 'BUMPS') {
      targetSpd += (h.agi - 6) * 0.20;
    } else if (course.mod === 'MUD') {
      // Lower Fort Garry Spring-Melt Mud: strongly rewards stocky & strong breeds (Draft Horse & Indian Pony)
      targetSpd += (h.might - 6.5) * 0.28;
    }

    let progress = dist / race.dist;
    if (progress < 0.25 && h.burst > 6 && stam > 30) {
      targetSpd += (h.burst * 0.18);
      stam -= 0.25;
    } else if (progress > 0.70 && stam > 20) {
      targetSpd += (h.end * 0.14);
      stam -= 0.20;
    } else {
      if (stam < 100) stam += (h.end * 0.04);
    }

    for (let obs of race.obstacles) {
      let passed = isPlayerSide ? obs.passedP : obs.passedR;
      if (!passed && Math.abs(obs.dist - dist) < 35 && obs.lane === lane) {
        if (isPlayerSide) obs.passedP = true; else obs.passedR = true;
        let clearChance = (h.agi / 12);
        if (course.mod === 'SNOW') clearChance += (h.snow / 25);
        if (course.mod === 'MUD')  clearChance = (h.might / 13) + (h.agi / 24);

        if (Math.random() < clearChance) {
          if (isPlayerSide) race.logText = `${h.name.toUpperCase()} CLEARS ${course.obs}!`;
        } else {
          stumble = (h.fearless || (course.mod === 'MUD' && h.might >= 9)) ? 18 : 40;
          if (isPlayerSide) race.logText = `${h.name.toUpperCase()} BOGGED IN ${course.obs}!`;
        }
      }
    }

    if (stumble > 0) {
      targetSpd *= (course.mod === 'MUD' && h.might >= 9) ? 0.72 : 0.55;
      stumble--;
    }
    targetSpd += (Math.sin(frame * 0.1 + (isPlayerSide ? 0 : 2)) * 0.25);
    targetSpd = Math.max(1.5, targetSpd);

    dist += targetSpd;

    if (isPlayerSide) {
      race.pDist = dist; race.pSpd = targetSpd; race.pStam = stam; race.pStumble = stumble;
    } else {
      race.rDist = dist; race.rSpd = targetSpd; race.rStam = stam; race.rStumble = stumble;
    }
  }

  // --- INPUT HANDLING ---
  function handleInput(cmd) {
    initAudio();
    if (state === 'TITLE') {
      if (cmd === 'BUTTON_A') {
        playTone(440, 'square', 0.1);
        generatePreRaceBoard();
        state = 'LISTING';
      }
    }
    else if (state === 'LISTING') {
      if (cmd === 'BUTTON_B') {
        cardSide = (cardSide + 1) % 2;
        setupRow = 0;
        if (cardSide === 1) {
          const activeList = raceListings[selListingIdx];
          breedBrowseIdx = selPrefHorse === 0 ? activeList.horseA : activeList.horseB;
        }
        playTone(460, 'triangle', 0.08);
        return;
      }

      if (cardSide === 0) {
        if (cmd === 'DPAD_UP') { setupRow = (setupRow + 2) % 3; playTone(300, 'triangle', 0.05); }
        if (cmd === 'DPAD_DOWN') { setupRow = (setupRow + 1) % 3; playTone(300, 'triangle', 0.05); }
        
        if (cmd === 'DPAD_LEFT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) selListingIdx = (selListingIdx + 2) % 3;
          if (setupRow === 1) selPrefHorse = (selPrefHorse + 1) % 2;
        }
        if (cmd === 'DPAD_RIGHT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) selListingIdx = (selListingIdx + 1) % 3;
          if (setupRow === 1) selPrefHorse = (selPrefHorse + 1) % 2;
        }
        if (cmd === 'BUTTON_A') {
          if (setupRow === 0) {
            setupRow = 1;
            playTone(380, 'triangle', 0.05);
          } else if (setupRow === 1) {
            setupRow = 2;
            playTone(380, 'triangle', 0.05);
          } else {
            playTone(523, 'square', 0.12);
            resolveWagerAndDraft();
            state = 'CAPTAIN';
          }
        }
      } else {
        if (cmd === 'DPAD_UP' || cmd === 'DPAD_DOWN') {
          setupRow = (setupRow + 1) % 2;
          playTone(300, 'triangle', 0.05);
        }
        if (cmd === 'DPAD_LEFT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) {
            activeBagSlot = (activeBagSlot + 3) % 4;
          } else {
            breedBrowseIdx = (breedBrowseIdx + HORSE_ROSTER.length - 1) % HORSE_ROSTER.length;
          }
        }
        if (cmd === 'DPAD_RIGHT') {
          playTone(350, 'triangle', 0.05);
          if (setupRow === 0) {
            activeBagSlot = (activeBagSlot + 1) % 4;
          } else {
            breedBrowseIdx = (breedBrowseIdx + 1) % HORSE_ROSTER.length;
          }
        }
        if (cmd === 'BUTTON_A') {
          if (setupRow === 0) {
            let k = ITEMS[activeBagSlot].key;
            let owned = firebag[k];
            if (owned > 0) {
              let nextQty = (stagedBet[k] + 1) % (owned + 1);
              let otherStaged = getBagScore(stagedBet) - (stagedBet[k] * ITEMS[activeBagSlot].val);
              if (nextQty === 0 && otherStaged === 0) {
                nextQty = 1;
                playTone(220, 'sawtooth', 0.06);
              } else {
                stagedBet[k] = nextQty;
                playTone(420, 'triangle', 0.06);
              }
            } else {
              playTone(180, 'sawtooth', 0.06);
            }
          } else {
            breedBrowseIdx = (breedBrowseIdx + 1) % HORSE_ROSTER.length;
            playTone(380, 'triangle', 0.05);
          }
        }
      }
    }
    else if (state === 'CAPTAIN') {
      if (cmd === 'BUTTON_A') {
        playTone(523, 'square', 0.12);
        setupRace();
        state = 'READY';
      }
    }
    else if (state === 'READY') {
      if (cmd === 'BUTTON_A') {
        state = 'COUNTDOWN';
        race.countdownVal = 3;
        race.countdownTimer = 50;
        playTone(440, 'square', 0.15);
      }
    }
    else if (state === 'RESULT') {
      if (cmd === 'BUTTON_A') {
        playTone(440, 'square', 0.1);
        if (getBagScore(firebag) <= 0) {
          resetFirebag();
          state = 'TITLE';
        } else {
          generatePreRaceBoard();
          state = 'LISTING';
        }
      }
    }
  }

  // --- UPDATE LOOP ---
  function update() {
    frame++;
    if (state === 'COUNTDOWN') {
      race.countdownTimer--;
      if (race.countdownTimer <= 0) {
        race.countdownVal--;
        if (race.countdownVal > 0) {
          race.countdownTimer = 50;
          playTone(440, 'square', 0.15);
        } else {
          playGunshot();
          race.bangFlash = 12;
          race.logText = "BANG! THEY'RE OFF!";
          state = 'RACING';
        }
      }
    }
    else if (state === 'RACING') {
      if (race.bangFlash > 0) race.bangFlash--;
      simulateHorse(true);
      simulateHorse(false);

      const HORSE_NOSE_OFFSET = 46;
      if ((race.pDist + HORSE_NOSE_OFFSET) >= race.dist || (race.rDist + HORSE_NOSE_OFFSET) >= race.dist) {
        if (race.pDist >= race.rDist) {
          race.winner = 'PLAYER';
          settleFirebagOutcome(true);
        } else {
          race.winner = 'RIVAL';
          settleFirebagOutcome(false);
        }
        race.photoTimer = 75;
        race.logText = "PHOTO FINISH AT THE LINE!";
        playTone(880, 'square', 0.08, 0.15);
        state = 'PHOTO_FINISH';
      }
    }
    else if (state === 'PHOTO_FINISH') {
      race.photoTimer--;
      if (race.photoTimer <= 0) {
        race.runoutTimer = 55;
        race.logText = race.winner === 'PLAYER' ? "TOP LANE TAKES THE RIBBON!" : "BOTTOM LANE TAKES THE RIBBON!";
        if (race.winner === 'PLAYER') playTone(587, 'square', 0.3);
        else playTone(196, 'sawtooth', 0.3);
        state = 'RUNOUT';
      }
    }
    else if (state === 'RUNOUT') {
      race.pDist += race.pSpd * 0.85;
      race.rDist += race.rSpd * 0.85;
      race.runoutTimer--;
      if (race.runoutTimer <= 0) {
        state = 'RESULT';
      }
    }
  }

  function drawDetailedHorse(x, y, horseIdx, riderIdx, animIdx, isStumbling = false, scale = 2) {
    const h = HORSE_ROSTER[horseIdx];
    const rSkin = RIDER_SKINS[riderIdx];
    const coat = PAL.COATS[h.coat];
    const matrix = HORSE_FRAMES[animIdx % 3];

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x + 3 * scale, y + 13.5 * scale, 17 * scale, 2 * scale);

    const pMap = {
      '1': PAL.BLACK,
      '2': coat.b,
      '3': coat.h,
      '4': coat.s,
      '5': coat.m,
      '6': rSkin.tunic,
      '7': rSkin.accent,
      '8': PAL.SKIN,
      '9': coat.sp ? coat.sp : coat.b,
      'H': rSkin.hat,
      'T': rSkin.trim
    };

    let yOffset = (isStumbling && state === 'RACING') ? (frame % 4 < 2 ? -2 : 2) : 0;

    for (let r = 0; r < matrix.length; r++) {
      for (let c = 0; c < matrix[r].length; c++) {
        const ch = matrix[r][c];
        if (ch !== '0') {
          ctx.fillStyle = pMap[ch];
          ctx.fillRect(x + c * scale, y + yOffset + r * scale, scale, scale);
        }
      }
    }
  }

  function drawMiniScenePreview(x, y, w, h, listing) {
    const c = COURSES[listing.courseIdx];
    ctx.fillStyle = c.mod === 'SNOW' ? '#7EB5D6' : (c.mod === 'FLAT' ? '#5BA4DC' : (c.mod === 'BUMPS' ? '#4A9ED1' : '#588BAE'));
    ctx.fillRect(x, y, w, Math.floor(h * 0.42));

    if (c.mod === 'SNOW') {
      ctx.fillStyle = PAL.ICE_LIGHT;
      ctx.fillRect(x, y + 18, w, 8);
      drawSnowSpruce(x + 8, y + 6, 0.65);
      drawSnowSpruce(x + 68, y + 5, 0.7);
      drawWinterGrassClump(x + 36, y + 18);
      ctx.fillStyle = PAL.ICE_MID;
      ctx.fillRect(x, y + Math.floor(h * 0.42), w, Math.ceil(h * 0.58));
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(x + 8, y + 36, 20, 2);
      ctx.fillRect(x + 54, y + 52, 24, 2);
    } else if (c.mod === 'FLAT') {
      ctx.fillStyle = PAL.BRIGHT_GREEN;
      ctx.fillRect(x, y + 18, w, 8);
      ctx.fillStyle = PAL.HIDE;
      ctx.fillRect(x + 12, y + 11, 10, 10);

      drawPrairieGrassTuft(x + 70, y + 16, false);
      ctx.fillStyle = '#C68E45';
      ctx.fillRect(x, y + Math.floor(h * 0.42), w, Math.ceil(h * 0.58));
    } else if (c.mod === 'BUMPS') {
      ctx.fillStyle = PAL.BRIGHT_GREEN;
      ctx.fillRect(x, y + 16, w, 6);
      ctx.fillStyle = PAL.DARK_GREEN;
      ctx.fillRect(x + 10, y + 9, 8, 9);
      ctx.fillStyle = PAL.LIMESTONE_LIGHT;
      ctx.fillRect(x + 56, y + 13, 12, 6);
      ctx.fillStyle = PAL.RED;
      ctx.fillRect(x + 55, y + 11, 14, 3);
      ctx.fillStyle = PAL.OCEAN;
      ctx.fillRect(x, y + 21, w, 5);
      ctx.fillStyle = PAL.MUTED_GREEN;
      ctx.fillRect(x, y + Math.floor(h * 0.42), w, Math.ceil(h * 0.58));
    } else {
      // Lower Fort Garry Preview: Pre-Canadian Shield boulders, wigwam, marsh & spring-melt mud track
      ctx.fillStyle = PAL.MARSH_REED;
      ctx.fillRect(x, y + 15, w, 6);
      drawShieldBoulder(x + 8, y + 13, 0.7);
      drawWigwam(x + 32, y + 6);
      drawSnowSpruce(x + 68, y + 4, 0.65);
      ctx.fillStyle = PAL.OCEAN;
      ctx.fillRect(x, y + 21, w, 4);

      ctx.fillRect(x + 10, y + 36, 22, 3);
      ctx.fillRect(x + 50, y + 48, 26, 3);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x, y + Math.floor(h * 0.70), w, 1);

    let anim = Math.floor(frame / 6);
    drawDetailedHorse(x + 6,  y + 20, listing.horseA, listing.riderA, anim, false, 1.35);
    drawDetailedHorse(x + 48, y + 34, listing.horseB, listing.riderB, anim + 1, false, 1.35);
  }

      if (isRaceView) {

          drawRedRiverCartCircle(finishX - 24, 84);
        }
      }

      ctx.fillStyle = '#C68E45'; ctx.fillRect(0, 120, 320, 60);
      ctx.fillStyle = '#D9A45B'; ctx.fillRect(0, 180, 320, 60);

      let fgOff = scrollPx % 160;
      ctx.fillStyle = '#8C5F27';
      for (let i = -160; i < 480; i += 40) {
        ctx.fillRect(i - fgOff + 12, 130, 6, 2);
        ctx.fillRect(i - fgOff + 28, 205, 8, 2);

    else if (c.mod === 'BUMPS') {
      // 3. Upper Fort Garry (Summer Forks)
      ctx.fillStyle = '#1E6B9C'; ctx.fillRect(0, 0, 320, 42);

      ctx.fillStyle = PAL.BRIGHT_GREEN; ctx.fillRect(0, 84, 320, 12);

      let finishX = isRaceView ? (48 + (race.dist - scrollPx)) : 99999;

      let valleyX = fortX - 96;
      let schoolhouseX = valleyX - 58;

      let hardstopScreenX = isRaceView ? (schoolhouseX - 4) : 320;

          { dx: 88, lush: false },
          { dx: 142, lush: true },
          { dx: 215, lush: false },

      let waterTick = (state === 'PHOTO_FINISH') ? 0 : frame;
      let waterOff = (scrollPx * 0.5 + waterTick * 0.6) % 120;
      for (let wx = -120; wx < 440; wx += 120) {
        // Drifting spring melt ice chunks & ripples
        ctx.fillStyle = PAL.ICE_LIGHT;
        ctx.fillRect(wx - waterOff + 14, 99, 8, 2);
        ctx.fillStyle = PAL.SEA_GREEN;
        ctx.fillRect(wx - waterOff + 58, 103, 20, 1);
        ctx.fillStyle = PAL.ICE_MID;
        ctx.fillRect(wx - waterOff + 92, 100, 6, 2);
      }

      // Near-Shore Rocky Shield Edge & Heavy Spring-Melt Mud Track (y: 108 to 240)
      ctx.fillStyle = PAL.SHIELD_DARK; ctx.fillRect(0, 108, 320, 8);
      ctx.fillStyle = PAL.MARSH_MUD;   ctx.fillRect(0, 116, 320, 62);
      ctx.fillStyle = '#5E442C';       ctx.fillRect(0, 178, 320, 62);

      // Rocky Shore Boulders, Marsh Reeds & Deep Mud Ruts Parallax
      let fgOff = scrollPx % 160;
      for (let i = -160; i < 480; i += 80) {
        drawShieldBoulder(i - fgOff + 8, 106, 0.95);
        drawPrairieGrassTuft(i - fgOff + 34, 105, true);
        drawShieldBoulder(i - fgOff + 56, 107, 0.75);
        // Heavy wet mud ruts across the lanes
        ctx.fillStyle = PAL.MARSH_WET;
        ctx.fillRect(i - fgOff + 12, 144, 38, 5);
        ctx.fillRect(i - fgOff + 32, 198, 44, 5);
      }
    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 174, 320, 2);
  }

  // --- MAIN RENDER LOOP ---
  function draw() {
    ctx.clearRect(0, 0, 320, 240);

    if (state === 'TITLE') {
      drawCourseBackdrop(1, frame * 1.5);
      drawDetailedHorse(80, 130, 0, 0, Math.floor(frame / 6), false, 2);
      drawDetailedHorse(180, 180, 5, 1, Math.floor((frame + 3) / 6), false, 2);

      ctx.fillStyle = 'rgba(14, 42, 30, 0.92)';
      ctx.fillRect(14, 18, 292, 76);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(14, 18, 292, 76);

      drawPixelText("AEN ZHWAAL", 160, 47, 20, PAL.GOLD, 'center');
      drawPixelText("HORSE RACING AT THE RED RIVER SETTLEMENT", 160, 66, 6, PAL.HIDE, 'center');
      if (frame % 50 < 30) {
        drawPixelText("PRESS 'A' TO START", 160, 84, 8, PAL.SEA_GREEN, 'center');
      }
    }
    else if (state === 'LISTING') {
      ctx.fillStyle = PAL.DARK_GREEN; ctx.fillRect(0, 0, 320, 240);
      ctx.strokeStyle = PAL.HIDE; ctx.lineWidth = 2; ctx.strokeRect(3, 3, 314, 234);

      const bagTotal = getBagScore(firebag);
      const currentBetVal = getBagScore(stagedBet);

      drawPixelText(`FIREBAG:${bagTotal}`, 8, 14, 7, PAL.SEA_GREEN);
    
      drawPixelText(`VS:${curOpponent.name}`, 312, 14, 7, PAL.GOLD, 'right');

      if (cardSide === 0) {
        drawPixelText(`${curOpponent.style} | SEEKING:${curOpponent.seekingName.toUpperCase()}`, 312, 23, 5, PAL.HIDE, 'right');
        drawPixelText(`"${curOpponent.quote}"`, 312, 32, 5, PAL.GRAY_LIGHT, 'right');

        const colW = 98;
        const startX = 9;
        for (let i = 0; i < 3; i++) {
          let cx = startX + i * (colW + 4);
          let cy = 38;
          let isCardSel = (selListingIdx === i);
          let isFocusRow0 = (setupRow === 0 && isCardSel);

          ctx.fillStyle = isCardSel ? '#1E3D2F' : PAL.BLACK;
          ctx.fillRect(cx, cy, colW, 108);
          ctx.strokeStyle = isFocusRow0 ? PAL.GOLD : (isCardSel ? PAL.SEA_GREEN : PAL.GRAY_DARK);
          ctx.lineWidth = isCardSel ? 2 : 1;
          ctx.strokeRect(cx, cy, colW, 108);

          let cName = COURSES[raceListings[i].courseIdx].short;
          drawPixelText(cName, cx + colW / 2, cy + 10, 6, isCardSel ? PAL.GOLD : PAL.WHITE, 'center');

          drawMiniScenePreview(cx + 5, cy + 14, 88, 58, raceListings[i]);
          ctx.strokeStyle = PAL.BLACK; ctx.lineWidth = 1;
          ctx.strokeRect(cx + 5, cy + 14, 88, 58);

          let hA = HORSE_ROSTER[raceListings[i].horseA].name;
          let hB = HORSE_ROSTER[raceListings[i].horseB].name;
          let isPrefA = (isCardSel && selPrefHorse === 0);
          let isPrefB = (isCardSel && selPrefHorse === 1);

          drawPixelText((isPrefA ? "*" : "") + hA, cx + colW / 2, cy + 84, 5, isPrefA ? PAL.SEA_GREEN : PAL.WHITE, 'center');
          drawPixelText("VS", cx + colW / 2, cy + 93, 5, PAL.GRAY_LIGHT, 'center');
          drawPixelText((isPrefB ? "*" : "") + hB, cx + colW / 2, cy + 102, 5, isPrefB ? PAL.SEA_GREEN : PAL.WHITE, 'center');
        }

        const activeList = raceListings[selListingIdx];
        const prefHorseObj = HORSE_ROSTER[selPrefHorse === 0 ? activeList.horseA : activeList.horseB];

        ctx.fillStyle = setupRow === 1 ? PAL.BORDEAUX : PAL.BLACK;
        ctx.fillRect(9, 151, 302, 18);
        ctx.strokeStyle = setupRow === 1 ? PAL.GOLD : PAL.MUTED_GREEN;
        ctx.lineWidth = 1;
        ctx.strokeRect(9, 151, 302, 18);
        drawPixelText((setupRow === 1 ? ">" : " ") + "PREF MOUNT:", 14, 163, 6, PAL.WHITE);
        drawPixelText(`< ${prefHorseObj.name} >`, 305, 163, 6, PAL.SEA_GREEN, 'right');

        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(9, 173, 302, 18);
        ctx.strokeStyle = PAL.MUTED_GREEN;
        ctx.strokeRect(9, 173, 302, 18);
        drawPixelText(`YOUR WAGER: ${currentBetVal} PTS`, 14, 185, 6, PAL.GOLD);
        drawPixelText("PRESS B TO EDIT BAG", 305, 185, 5, PAL.SEA_GREEN, 'right');

        let isBtnFocus = (setupRow === 2);
        ctx.fillStyle = isBtnFocus ? PAL.GOLD : PAL.BORDEAUX;
        ctx.fillRect(58, 198, 204, 28);
        ctx.strokeStyle = isBtnFocus ? PAL.WHITE : PAL.GOLD;
        ctx.lineWidth = 2;
        ctx.strokeRect(58, 198, 204, 28);
        drawPixelText("KOMANSE!", 160, 217, 11, isBtnFocus ? PAL.BLACK : PAL.GOLD, 'center', !isBtnFocus);
      } 
      else {
        const isBagRow = (setupRow === 0);
        const isBreedRow = (setupRow === 1);

        ctx.fillStyle = isBagRow ? '#172E24' : '#0B1D15';
        ctx.fillRect(9, 22, 302, 114);
        ctx.strokeStyle = isBagRow ? PAL.GOLD : PAL.MUTED_GREEN;
        ctx.lineWidth = isBagRow ? 2 : 1;
        ctx.strokeRect(9, 22, 302, 114);

        drawPixelText((isBagRow ? ">" : " ") + "FIREBAG WAGER", 14, 34, 7, PAL.GOLD);
        drawPixelText(`STAGED BET: ${currentBetVal} / ${bagTotal} PTS`, 305, 34, 6, PAL.SEA_GREEN, 'right');

        for (let idx = 0; idx < 4; idx++) {
          const it = ITEMS[idx];
          const owned = firebag[it.key];
          const betQty = stagedBet[it.key];
          const sx = 14 + idx * 74;
          const sy = 40;
          const sw = 70;
          const sh = 78;
          const isSlotSel = (isBagRow && activeBagSlot === idx);

          ctx.fillStyle = betQty > 0 ? '#1C3F31' : PAL.BLACK;
          ctx.fillRect(sx, sy, sw, sh);
          ctx.strokeStyle = isSlotSel ? PAL.GOLD : (betQty > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK);
          ctx.lineWidth = isSlotSel ? 2 : 1;
          ctx.strokeRect(sx, sy, sw, sh);

          drawFirebagItemIcon(sx + 30, sy + 6, idx, owned === 0);

          drawPixelText(it.short, sx + sw / 2, sy + 28, 6, owned > 0 ? PAL.WHITE : PAL.GRAY_DARK, 'center');
          drawPixelText(`${it.val} PT${it.val > 1 ? 'S' : ''}`, sx + sw / 2, sy + 40, 5, PAL.HIDE, 'center');

          drawPixelText(`OWN:${owned}`, sx + sw / 2, sy + 54, 6, owned > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK, 'center');
          drawPixelText(`BET:${betQty}`, sx + sw / 2, sy + 69, 6, betQty > 0 ? PAL.GOLD : PAL.GRAY_LIGHT, 'center');
        }

        drawPixelText("LEFT/RIGHT: ITEM   A: +1 / TOGGLE", 160, 131, 5, PAL.HIDE, 'center');

        const hInfo = HORSE_ROSTER[breedBrowseIdx];
        ctx.fillStyle = isBreedRow ? '#172E24' : '#0B1D15';
        ctx.fillRect(9, 141, 302, 74);
        ctx.strokeStyle = isBreedRow ? PAL.GOLD : PAL.MUTED_GREEN;
        ctx.lineWidth = isBreedRow ? 2 : 1;
        ctx.strokeRect(9, 141, 302, 74);

        drawPixelText((isBreedRow ? ">" : " ") + `BREED GUIDE (${breedBrowseIdx + 1}/6)`, 14, 153, 6, PAL.GOLD);
        drawPixelText("< LEFT / RIGHT >", 305, 153, 5, PAL.GRAY_LIGHT, 'right');

        ctx.fillStyle = PAL.BLACK;
        ctx.fillRect(14, 159, 58, 48);
        ctx.strokeStyle = PAL.GRAY_DARK;
        ctx.lineWidth = 1;
        ctx.strokeRect(14, 159, 58, 48);
        drawDetailedHorse(19, 168, breedBrowseIdx, breedBrowseIdx % RIDER_SKINS.length, Math.floor(frame / 6), false, 2);

        drawPixelText(hInfo.name.toUpperCase(), 80, 170, 7, PAL.WHITE);
        drawPixelText(hInfo.breed, 80, 182, 5, PAL.HIDE);
        drawPixelText("CAPTAIN:", 80, 195, 5, PAL.SEA_GREEN);
        drawPixelText(hInfo.captainNote, 80, 206, 5, PAL.GOLD);

        drawPixelText("PRESS 'B' TO RETURN TO RACE CARD", 160, 229, 6, PAL.GOLD, 'center');
      }
    }
    else if (state === 'CAPTAIN') {
      drawCourseBackdrop(match.courseIdx, 0);
      ctx.fillStyle = 'rgba(14, 42, 30, 0.93)';
      ctx.fillRect(14, 18, 292, 204);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(14, 18, 292, 204);

      ctx.fillStyle = PAL.BORDEAUX; ctx.fillRect(24, 30, 34, 34);
      ctx.fillStyle = PAL.SKIN; ctx.fillRect(33, 38, 16, 15);
      ctx.fillStyle = PAL.RED; ctx.fillRect(31, 32, 20, 7);
      ctx.fillStyle = PAL.BLACK; ctx.fillRect(33, 47, 16, 8);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(29, 55, 24, 9);

      drawPixelText("BUFFALO HUNT CAPTAIN", 66, 43, 8, PAL.GOLD);
      drawPixelText(`POT: ${match.effectivePot} PTS | ${COURSES[match.courseIdx].short}`, 66, 57, 6, PAL.SEA_GREEN);

      const words = captainText.split(' ');
      let lines = [], line = '';
      words.forEach(w => {
        if ((line + w).length > 35) { lines.push(line); line = w + ' '; }
        else line += w + ' ';
      });
      lines.push(line);

      lines.forEach((l, idx) => {
        drawPixelText(l, 24, 80 + idx * 13, 6, PAL.WHITE);
      });

      if (frame % 50 < 30) {
        drawPixelText("PRESS 'A' TO WATCH RACE", 160, 210, 7, PAL.GOLD, 'center');
      }
    }
    else if (state === 'READY' || state === 'COUNTDOWN' || state === 'RACING' || state === 'PHOTO_FINISH' || state === 'RUNOUT' || state === 'RESULT') {
      drawCourseBackdrop(match.courseIdx, race.pDist);

      let startX = 48 - race.pDist;
      if (startX > -10 && startX < 330) {
        ctx.fillStyle = PAL.HIDE;
        ctx.fillRect(startX, 112, 3, 128);
      }

      let finishX = 48 + (race.dist - race.pDist);
      if (finishX > -20 && finishX < 340) {
        ctx.fillStyle = PAL.BORDEAUX;
        ctx.fillRect(finishX, 112, 4, 128);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(finishX + 1, 112, 2, 128);
      }

      const mod = COURSES[match.courseIdx].mod;
      race.obstacles.forEach(obs => {
        let ox = 48 + (obs.dist - race.pDist);
        if (ox > -30 && ox < 340) {
          let oy = obs.lane === 0 ? 142 : 202;
          if (mod === 'SNOW') {
            ctx.fillStyle = PAL.OCEAN; ctx.fillRect(ox, oy, 22, 8);
            ctx.fillStyle = PAL.WHITE; ctx.fillRect(ox + 3, oy + 2, 16, 3);
          } else if (mod === 'FLAT') {
            ctx.fillStyle = PAL.BLACK; ctx.fillRect(ox, oy + 2, 14, 6);
            ctx.fillStyle = '#5E1E0C'; ctx.fillRect(ox - 2, oy + 6, 18, 3);
          } else if (mod === 'BUMPS') {
            ctx.fillStyle = '#3E2723'; ctx.fillRect(ox, oy, 24, 9);
            ctx.fillStyle = PAL.DARK_GREEN; ctx.fillRect(ox + 4, oy + 2, 16, 4);
          } else {
            // Lower Fort Garry Spring-Melt Mud Bog & Half-Melted Ice Slush
            ctx.fillStyle = '#26180D'; ctx.fillRect(ox, oy, 26, 10);
            ctx.fillStyle = PAL.ICE_DARK; ctx.fillRect(ox + 4, oy + 2, 18, 5);
            ctx.fillStyle = PAL.ICE_LIGHT; ctx.fillRect(ox + 7, oy + 3, 7, 2);
          }
        }
      });

      let isAnimating = (state === 'RACING' || state === 'RUNOUT');
      let pAnim = (state === 'PHOTO_FINISH') ? 0 : (isAnimating ? Math.floor(frame / 4) : 1);
      let rAnim = (state === 'PHOTO_FINISH') ? 0 : (isAnimating ? Math.floor((frame + 2) / 4) : 1);

      drawDetailedHorse(48, 120, match.playerHorseIdx, match.playerRiderIdx, pAnim, race.pStumble > 0, 2);

      let rScreenX = 48 + (race.rDist - race.pDist);
      if (rScreenX > -60 && rScreenX < 340) {
        drawDetailedHorse(rScreenX, 180, match.npcHorseIdx, match.npcRiderIdx, rAnim, race.rStumble > 0, 2);
      }

      if (state === 'PHOTO_FINISH' && race.photoTimer > 67) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillRect(0, 0, 320, 240);
      }

      if (race.bangFlash > 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fillRect(0, 0, 320, 240);
      }

      ctx.fillStyle = PAL.BLACK; ctx.fillRect(0, 0, 320, 28);
      ctx.fillStyle = PAL.GOLD;  ctx.fillRect(0, 28, 320, 2);

      ctx.fillStyle = PAL.GRAY_DARK; ctx.fillRect(10, 8, 180, 12);
      let pPct = Math.min(1, race.pDist / race.dist);
      let rPct = Math.min(1, race.rDist / race.dist);
      ctx.fillStyle = PAL.RED;       ctx.fillRect(10 + rPct * 174, 14, 6, 6);
      ctx.fillStyle = PAL.SEA_GREEN; ctx.fillRect(10 + pPct * 174, 8, 6, 6);

      drawPixelText(`POT:${match.effectivePot}`, 310, 17, 7, PAL.GOLD, 'right');

      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 224, 320, 16);
      drawPixelText(race.logText, 160, 235, 6, PAL.WHITE, 'center');

      if (state === 'READY') {
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(30, 85, 260, 54);
        ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(30, 85, 260, 54);
        drawPixelText("RIDERS AT THE LINE", 160, 106, 9, PAL.WHITE, 'center');
        if (frame % 40 < 25) {
          drawPixelText("PRESS 'A' FOR COUNTDOWN", 160, 126, 8, PAL.GOLD, 'center');
        }
      }
      else if (state === 'COUNTDOWN') {
        let frenchWords = { 3: "TROIS...", 2: "DEUX...", 1: "UN!" };
        let txt = frenchWords[race.countdownVal] || "";
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(70, 85, 180, 50);
        ctx.strokeStyle = PAL.ORANGE; ctx.strokeRect(70, 85, 180, 50);
        drawPixelText(txt, 160, 118, 16, PAL.GOLD, 'center');
      }
      else if (state === 'RESULT') {
        ctx.fillStyle = 'rgba(14, 42, 30, 0.95)';
        ctx.fillRect(18, 36, 284, 174);
        ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
        ctx.strokeRect(18, 36, 284, 174);

        const wonNames = match.npcWagerItems.map(it => it.name).join(' + ');
        if (race.winner === 'PLAYER') {
          drawPixelText("YOUR HORSE WINS!", 160, 62, 10, PAL.SEA_GREEN, 'center');
          drawPixelText(`WON: ${wonNames}`, 160, 82, 6, PAL.GOLD, 'center');
        } else {
          drawPixelText("OPPONENT WINS!", 160, 62, 10, PAL.RED, 'center');
          drawPixelText(`LOST -${match.playerBetTotal} PTS OF GOODS`, 160, 82, 7, PAL.HIDE, 'center');
        }

        drawPixelText(`FIREBAG SCORE: ${getBagScore(firebag)}`, 160, 105, 8, PAL.WHITE, 'center');

        for (let idx = 0; idx < 4; idx++) {
          const it = ITEMS[idx];
          const bx = 30 + idx * 66;
          const by = 116;
          ctx.fillStyle = PAL.BLACK;
          ctx.fillRect(bx, by, 60, 32);
          ctx.strokeStyle = firebag[it.key] > 0 ? PAL.SEA_GREEN : PAL.GRAY_DARK;
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by, 60, 32);
          drawFirebagItemIcon(bx + 4, by + 6, idx, firebag[it.key] === 0);
          drawPixelText(`${it.short}:${it.val}`, bx + 18, by + 14, 5, PAL.HIDE, 'left', false);
          drawPixelText(`x${firebag[it.key]}`, bx + 18, by + 26, 7, firebag[it.key] > 0 ? PAL.GOLD : PAL.GRAY_DARK, 'left', false);
        }

        if (getBagScore(firebag) <= 0) {
          drawPixelText("FIREBAG EMPTY! STARTING ANEW.", 160, 168, 6, PAL.ORANGE, 'center');
        }
        if (frame % 50 < 30) {
          drawPixelText("PRESS 'A' TO CONTINUE", 160, 194, 8, PAL.GOLD, 'center');
        }
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- POSTMESSAGE ARCADE BRIDGE ---
  window.addEventListener('message', function(event) {
    handleInput(event.data);
  });

  // Keyboard fallback for standalone browser testing
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') handleInput('DPAD_UP');
    if (e.key === 'ArrowDown') handleInput('DPAD_DOWN');
    if (e.key === 'ArrowLeft') handleInput('DPAD_LEFT');
    if (e.key === 'ArrowRight') handleInput('DPAD_RIGHT');
    if (e.key === 'a' || e.key === 'A' || e.key === 'z' || e.key === 'Z' || e.key === 'Enter' || e.key === ' ') handleInput('BUTTON_A');
    if (e.key === 'b' || e.key === 'B' || e.key === 'x' || e.key === 'X' || e.key === 'Shift') handleInput('BUTTON_B');
  });

  loop();
</script>
</body>
</html>
