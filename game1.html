<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Red River Run</title>
<style>
  html, body, #game-container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050C08;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #game-container {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  #header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 36px;
    display: none;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(10, 26, 19, 0.92) 0%, rgba(10, 26, 19, 0.65) 100%);
    border-bottom: 2px solid #D4A338;
    color: #F7C844;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Courier New', Courier, monospace;
    padding: 0 18px;
    box-sizing: border-box;
    z-index: 20;
    text-shadow: 2px 2px 0 #000;
  }

  #screen-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: bold;
    color: #ffffff;
    background: #4A0C10;
    font-size: 16px;
    padding: 14px 24px;
    display: none;
    white-space: nowrap;
    border: 3px solid #F7C844;
    box-shadow: 0 6px 0 #000;
    text-align: center;
    z-index: 25;
    font-family: 'Courier New', Courier, monospace;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <span id="title-display">THE FORKS</span>
    <span id="score-display">DIST: 0</span>
  </div>

  <div id="screen-container">
    <canvas id="gameCanvas"></canvas>
    <div id="msg">RUN AGROUND!<br><br>PRESS 'A' TO RESTART</div>
  </div>
</div>

<script>
  // ==========================================
  // 1. FULL-SCREEN VIEWPORT & SNES RESOLUTION
  // ==========================================
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  const headerBar = document.getElementById('header');

  let VIEW_W = 240;
  let VIEW_H = 135;

  function resizeViewport() {
    const aspect = window.innerWidth / window.innerHeight;
    if (window.innerWidth >= window.innerHeight) {
      VIEW_H = 135;
      VIEW_W = Math.max(240, Math.round(135 * aspect));
    } else {
      VIEW_W = 220;
      VIEW_H = Math.max(135, Math.round(220 / aspect));
    }
    cvs.width = VIEW_W;
    cvs.height = VIEW_H;
    ctx.imageSmoothingEnabled = false;
  }

  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  // ==========================================
  // 2. SNES SHADED PALETTE & GAME STATE
  // ==========================================
  const msg = document.getElementById('msg');
  const scoreDisplay = document.getElementById('score-display');
  const titleDisplay = document.getElementById('title-display');

  const PAL = {
    OUTLINE: '#0B1610',
    SILHOUETTE: '#05070D',
    SIL_RIM: '#433878',
    DARK_PINE: '#123324',
    MID_PINE: '#275940',
    LIGHT_PINE: '#458761',
    CEDAR_DARK: '#163D2B',
    CEDAR_MID: '#2F6B4C',
    CEDAR_LIGHT: '#569E73',
    MARSH_LIGHT: '#9AC448',
    MARSH_MID: '#5E8C31',
    MARSH_DARK: '#32521E',
    REED_GOLD: '#D6B85A',
    GOLD_LIGHT: '#FBE07A',
    GOLD_MID: '#E2AC32',
    GOLD_DARK: '#A8741A',
    CHARTREUSE_L: '#BCE254',
    CHARTREUSE_D: '#7EA626',
    MAROON_DEEP: '#3A0B0E',
    MAROON_MID: '#5E171C',
    MAROON_FOAM: '#C48A78',
    LAKE_DEEP: '#0A3E59',
    LAKE_MID: '#16688F',
    LAKE_FOAM: '#48D8CC',
    WAVE_CREST: '#E8FAFF',
    INDIGO_DEEP: '#0B1930',
    INDIGO_MID: '#1B355C',
    NIGHT_SKY_T: '#0A0818',
    NIGHT_SKY_B: '#2E1E54',
    DAY_SKY_T: '#87B5C9',
    DAY_SKY_B: '#E6DFCE',
    HIDE_LIGHT: '#F2ECDC',
    HIDE_MID: '#CBBFA4',
    HIDE_DARK: '#8F8268',
    WOOD_LIGHT: '#C88446',
    WOOD_MID: '#8C5022',
    WOOD_DARK: '#4D280E',
    SAND_LIGHT: '#E2CCA2',
    SAND_MID: '#B59B6D',
    STONE_LIGHT: '#B5B8B4',
    STONE_MID: '#7A7E7A',
    STONE_DARK: '#424644',
    SNOW_LIGHT: '#FFFFFF',
    SNOW_MID: '#D4E7F5',
    SNOW_DARK: '#93B6CF',
    ICE_DEEP: '#7BAEC9',
    ICE_MID: '#A6D5ED',
    GLARE_ICE_L: '#E4F9FF',
    GLARE_ICE_M: '#66D6F2',
    SASH_RED: '#C42424',
    FIRE_ORANGE: '#F26419',
    FIRE_YELLOW: '#F6AE2D',
    NWC_BLUE: '#234B7A',
    HBC_COAT: '#9E2A2B',
    SUIT_DARK: '#151922',
    SUIT_MID: '#29303D',
    BAY_DEEP: '#0B496B',
    BAY_MID: '#18749E',
    BAY_FOAM: '#7CE4EC'
  };

  // Stage Distance Milestones
  const DIST = {
    FORKS_END: 450,
    LOWER_FORT_END: 900,
    MOUTH_OPEN_START: 1330,
    ST_PETERS_END: 1450,
    LAKE_DAY_END: 2050,
    WINTER_ONSET: 2150,
    LAKE_CLOSE_START: 2530, // Natural North Shore lake closing (2530 -> 2650)
    LAKE_MIDNIGHT_END: 2650,
    DEPLOY_END: 2770,
    BLIZZARD_PEAK: 3300,
    VICTORY_YORK: 4000
  };

  const TILE_PX = 16;

  // Screen & Cutscene Modes
  let gameMode = 'TITLE'; // 'TITLE' | 'OPENING_CUTSCENE' | 'PLAYING' | 'CLOSING_CUTSCENE' | 'GAME_OVER' | 'VICTORY'
  let titleStartTime = performance.now();
  let titleFadeOutAlpha = 0;
  let isFadingFromTitle = false;

  let isPaused = false;
  let score = 0, frame = 0, speed = 1.4;
  let bgOffset = 0;

  // 3 Persistent Tracks: 0 (Top), 1 (Middle), 2 (Bottom)
  let playerLane = 1;
  let playerVisualY = 0;
  let shakeTimer = 0;
  let slowTimer = 0;
  let slowFactor = 0.75;
  let boostTimer = 0;
  let isIceSlip = false;
  let crashReason = "RUN AGROUND!";
  let lastSplashStrokeId = -1;

  // Extended Opening Cutscene State (Upper Fort Garry & The Forks)
  let openingFrame = 0;
  const OPENING_TOTAL = 520; // ~8.6s full choreographed arrival, urgent dispatch & departure

  // Mid-Game Dogsled Deployment Cutscene (2650 - 2770)
  let isDeployingSled = false;
  let deployProgress = 0;
  let isSledMode = false;

  // Extended Closing Cutscene State (York Factory -> Suited Factor -> Hudson Bay Barque -> Fade to Black)
  let closingFrame = 0;
  const CLOSING_TOTAL = 420; // ~7s camera pan to Hudson Bay barque & fade to black

  // River Features & Hazards
  let riverFeatures = [];
  let hazards = [];
  let nextFeatureX = 0;
  let nextDeepWaveX = 0;
  let lakeWaveArmed = false;
  let lastFeatureType = 'NONE';
  let sugarIslandSpawned = false;

  // Unique One-Off Landmarks & Historical Vignettes
  let upperFortSpawned = false;
  let sevenOaksSpawned = false;
  let stAndrewsSpawned = false;
  let lowerFortSpawned = false;
  let norwayHouseSpawned = false;
  let yorkFactorySpawned = false;
  let landmarks = [];

  // Parallax Snow / Blizzard Particles
  let snowParticles = [];
  function initSnow() {
    snowParticles = [];
    for (let i = 0; i < 210; i++) {
      snowParticles.push({
        x: Math.random() * 480,
        y: Math.random() * 160,
        layer: i % 3
      });
    }
  }
  initSnow();

  // ==========================================
  // 3. COLOR INTERPOLATION & SILHOUETTE HELPERS
  // ==========================================
  function hexToRgb(hex) {
    const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return res ? {
      r: parseInt(res[1], 16),
      g: parseInt(res[2], 16),
      b: parseInt(res[3], 16)
    } : { r: 0, g: 0, b: 0 };
  }

  function lerpColor(c1, c2, t) {
    if (t <= 0) return c1;
    if (t >= 1) return c2;
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r + (b.r - a.r) * t);
    const g = Math.round(a.g + (b.g - a.g) * t);
    const bl = Math.round(a.b + (b.b - a.b) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function getSilhouetteFactor() {
    if (score < DIST.LAKE_DAY_END || score >= DIST.DEPLOY_END) return 0;
    if (score < DIST.LAKE_DAY_END + 140) {
      return (score - DIST.LAKE_DAY_END) / 140;
    }
    if (score >= DIST.LAKE_MIDNIGHT_END) {
      return Math.max(0, 1 - (score - DIST.LAKE_MIDNIGHT_END) / 80);
    }
    return 1;
  }

  function getEnvColors() {
    let skyTop = PAL.DAY_SKY_T, skyBot = PAL.DAY_SKY_B;
    let gndTop = PAL.GOLD_LIGHT, gndMid = PAL.GOLD_MID, gndDark = PAL.GOLD_DARK;
    let watDeep = PAL.MAROON_DEEP, watMid = PAL.MAROON_MID, watFoam = PAL.MAROON_FOAM;
    let title = "THE FORKS";

    if (score < DIST.FORKS_END) {
      title = "THE FORKS";
      const t = score / DIST.FORKS_END;
      gndTop = lerpColor(PAL.GOLD_LIGHT, PAL.CHARTREUSE_L, t);
      gndMid = lerpColor(PAL.GOLD_MID, PAL.CHARTREUSE_D, t);
      gndDark = lerpColor(PAL.GOLD_DARK, PAL.MID_PINE, t);
    } else if (score < DIST.LOWER_FORT_END) {
      title = "LOWER FORT GARRY";
      const t = (score - DIST.FORKS_END) / (DIST.LOWER_FORT_END - DIST.FORKS_END);
      gndTop = lerpColor(PAL.CHARTREUSE_L, PAL.MARSH_LIGHT, t);
      gndMid = lerpColor(PAL.CHARTREUSE_D, PAL.MARSH_MID, t);
      gndDark = lerpColor(PAL.MID_PINE, PAL.MARSH_DARK, t);
      watDeep = lerpColor(PAL.MAROON_DEEP, '#1A3A3A', t);
      watMid = lerpColor(PAL.MAROON_MID, '#2B5B56', t);
      watFoam = lerpColor(PAL.MAROON_FOAM, PAL.LAKE_FOAM, t);
    } else if (score < DIST.ST_PETERS_END) {
      title = score >= DIST.MOUTH_OPEN_START ? "MOUTH OF LAKE WINNIPEG" : "ST. PETER'S I.R.";
      const t = (score - DIST.LOWER_FORT_END) / (DIST.ST_PETERS_END - DIST.LOWER_FORT_END);
      gndTop = lerpColor(PAL.MARSH_LIGHT, PAL.LIGHT_PINE, t);
      gndMid = lerpColor(PAL.MARSH_MID, PAL.MID_PINE, t);
      gndDark = lerpColor(PAL.MARSH_DARK, PAL.DARK_PINE, t);
      watDeep = lerpColor('#1A3A3A', PAL.LAKE_DEEP, t);
      watMid = lerpColor('#2B5B56', PAL.LAKE_MID, t);
      watFoam = PAL.LAKE_FOAM;
    } else if (score < DIST.LAKE_DAY_END) {
      title = "LAKE WINNIPEG SHORE";
      const t = (score - DIST.ST_PETERS_END) / (DIST.LAKE_DAY_END - DIST.ST_PETERS_END);
      gndTop = lerpColor(PAL.LIGHT_PINE, PAL.MID_PINE, t);
      gndMid = PAL.MID_PINE;
      gndDark = PAL.DARK_PINE;
      watDeep = PAL.LAKE_DEEP;
      watMid = PAL.LAKE_MID;
      watFoam = PAL.LAKE_FOAM;
    } else if (score < DIST.LAKE_MIDNIGHT_END) {
      title = score >= DIST.WINTER_ONSET ? "MIDNIGHT LAKE - FIRST SNOW" : "MIDNIGHT LAKE WINNIPEG";
      const nightT = Math.min(1, (score - DIST.LAKE_DAY_END) / 160);
      const icyT = score >= DIST.WINTER_ONSET
        ? Math.min(1, (score - DIST.WINTER_ONSET) / (DIST.LAKE_MIDNIGHT_END - DIST.WINTER_ONSET))
        : 0;

      skyTop = lerpColor(PAL.DAY_SKY_T, lerpColor(PAL.NIGHT_SKY_T, '#1D2948', icyT), nightT);
      skyBot = lerpColor(PAL.DAY_SKY_B, lerpColor(PAL.NIGHT_SKY_B, '#4A5D82', icyT), nightT);
      gndTop = lerpColor(PAL.MID_PINE, lerpColor('#0A0D14', '#4B637A', icyT), nightT);
      gndMid = lerpColor(PAL.MID_PINE, lerpColor('#05070D', '#2D3E52', icyT), nightT);
      gndDark = lerpColor(PAL.DARK_PINE, '#030408', nightT);
      watDeep = lerpColor(PAL.LAKE_DEEP, lerpColor(PAL.INDIGO_DEEP, '#284B6E', icyT), nightT);
      watMid = lerpColor(PAL.LAKE_MID, lerpColor(PAL.INDIGO_MID, '#4979A3', icyT), nightT);
      watFoam = lerpColor(PAL.LAKE_FOAM, lerpColor('#3C78A8', '#B8DCF0', icyT), nightT);
    } else if (score < DIST.DEPLOY_END) {
      title = "NORTH SHORE LANDING";
      const t = (score - DIST.LAKE_MIDNIGHT_END) / (DIST.DEPLOY_END - DIST.LAKE_MIDNIGHT_END);
      skyTop = lerpColor('#1D2948', '#7C9EB2', t);
      skyBot = lerpColor('#4A5D82', '#D6E2E8', t);
      gndTop = lerpColor('#4B637A', PAL.SNOW_LIGHT, t);
      gndMid = lerpColor('#2D3E52', PAL.SNOW_MID, t);
      gndDark = lerpColor('#030408', PAL.SNOW_DARK, t);
      watDeep = lerpColor('#284B6E', PAL.ICE_DEEP, t);
      watMid = lerpColor('#4979A3', PAL.ICE_MID, t);
      watFoam = lerpColor('#B8DCF0', PAL.SNOW_LIGHT, t);
    } else if (score < 3650) {
      if (score >= 3200 && score < 3420) title = "NORWAY HOUSE";
      else title = (score >= 3100 && score <= 3450) ? "BOREAL BLIZZARD" : "BOREAL WINTER TRAIL";
      const blizT = score < 3300
        ? Math.min(1, Math.max(0, (score - 2850) / 450))
        : Math.max(0, 1 - (score - 3300) / 450);
      skyTop = lerpColor('#7C9EB2', '#B8C8D4', blizT);
      skyBot = lerpColor('#D6E2E8', '#E4EDF2', blizT);
      gndTop = PAL.SNOW_LIGHT;
      gndMid = PAL.SNOW_MID;
      gndDark = PAL.SNOW_DARK;
      watDeep = PAL.ICE_DEEP;
      watMid = PAL.ICE_MID;
      watFoam = PAL.SNOW_LIGHT;
    } else {
      title = "HUDSON BAY - YORK FACTORY";
      const t = Math.min(1, (score - 3650) / 250);
      skyTop = lerpColor('#7C9EB2', '#6BA3C4', t);
      skyBot = lerpColor('#D6E2E8', '#F2E8D5', t);
      gndTop = PAL.SNOW_LIGHT;
      gndMid = PAL.SNOW_MID;
      gndDark = PAL.SNOW_DARK;
      watDeep = PAL.ICE_DEEP;
      watMid = PAL.ICE_MID;
      watFoam = PAL.SNOW_LIGHT;
    }

    return { skyTop, skyBot, gndTop, gndMid, gndDark, watDeep, watMid, watFoam, title };
  }

  // ==========================================
  // 4. STYLIZED "WOODLAND" PIXEL FONT TITLE SCREEN
  // ==========================================
  // Custom 16-bit Woodland-inspired pixel serif glyph bitmaps (7x9 high-contrast flared serifs)
  const WOODLAND_GLYPHS = {
    'R': [
      '1111100',
      '0110110',
      '0110011',
      '0110011',
      '0111110',
      '0110110',
      '0110011',
      '0110011',
      '1111011'
    ],
    'E': [
      '1111111',
      '0110001',
      '0110100',
      '0111100',
      '0110100',
      '0110000',
      '0110001',
      '0110011',
      '1111111'
    ],
    'D': [
      '1111100',
      '0110110',
      '0110011',
      '0110011',
      '0110011',
      '0110011',
      '0110011',
      '0110110',
      '1111100'
    ],
    'I': [
      '11111',
      '00110',
      '00110',
      '00110',
      '00110',
      '00110',
      '00110',
      '00110',
      '11111'
    ],
    'V': [
      '1110111',
      '0110010',
      '0110010',
      '0110010',
      '0011100',
      '0011100',
      '0011100',
      '0001000',
      '0001000'
    ],
    'U': [
      '1110111',
      '0110010',
      '0110010',
      '0110010',
      '0110010',
      '0110010',
      '0110010',
      '0110010',
      '0011100'
    ],
    'N': [
      '1110011',
      '0111010',
      '0111110',
      '0111110',
      '0110110',
      '0110110',
      '0110010',
      '0110010',
      '1110011'
    ]
  };

  function drawWoodlandWord(word, centerX, startY, scale) {
    const letterGap = 2 * scale;
    let totalW = 0;
    for (let i = 0; i < word.length; i++) {
      const g = WOODLAND_GLYPHS[word[i]];
      if (g) totalW += g[0].length * scale + (i < word.length - 1 ? letterGap : 0);
    }

    let curX = Math.round(centerX - totalW / 2);
    for (let i = 0; i < word.length; i++) {
      const g = WOODLAND_GLYPHS[word[i]];
      if (!g) continue;
      const gw = g[0].length;
      const gh = g.length;

      // Deep dark maroon/black drop shadow for Woodland 16-bit relief
      ctx.fillStyle = PAL.OUTLINE;
      for (let r = 0; r < gh; r++) {
        for (let c = 0; c < gw; c++) {
          if (g[r][c] === '1') {
            ctx.fillRect(curX + c * scale - 1, startY + r * scale - 1, scale + 2, scale + 2);
            ctx.fillRect(curX + c * scale + 2, startY + r * scale + 2, scale, scale);
          }
        }
      }

      // Shaded Woodland gold-to-ivory serif fill
      for (let r = 0; r < gh; r++) {
        for (let c = 0; c < gw; c++) {
          if (g[r][c] === '1') {
            if (r <= 2) ctx.fillStyle = PAL.SNOW_LIGHT;
            else if (r <= 5) ctx.fillStyle = PAL.GOLD_LIGHT;
            else ctx.fillStyle = PAL.GOLD_MID;
            ctx.fillRect(curX + c * scale, startY + r * scale, scale, scale);
          }
        }
      }

      curX += gw * scale + letterGap;
    }
  }

  function drawTitleCardScreen() {
    const elapsedSec = (performance.now() - titleStartTime) / 1000;
    const tAnim = frame * 0.04;

    // 1. Warm twilight/prairie sky
    ctx.fillStyle = PAL.DAY_SKY_T;
    ctx.fillRect(0, 0, VIEW_W, Math.floor(VIEW_H * 0.24));
    ctx.fillStyle = PAL.DAY_SKY_B;
    ctx.fillRect(0, Math.floor(VIEW_H * 0.12), VIEW_W, Math.floor(VIEW_H * 0.14));

    // Distant prairie horizon & silhouetted oaks
    const farHorizonY = Math.floor(VIEW_H * 0.22);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(0, farHorizonY, VIEW_W, 5);
    drawShadedPine(18, farHorizonY - 11, false, false);
    drawShadedTipi(48, farHorizonY - 9);
    drawShadedPine(VIEW_W - 34, farHorizonY - 11, false, false);

    // 2. Close-up of the Red River (rich shaded maroon water with animated current swells)
    const riverStartY = farHorizonY + 4;
    const lowerBankY = Math.floor(VIEW_H * 0.72);
    ctx.fillStyle = PAL.MAROON_DEEP;
    ctx.fillRect(0, riverStartY, VIEW_W, lowerBankY - riverStartY);

    // Layered close-up river swells & reflections
    for (let ry = riverStartY + 4; ry < lowerBankY - 3; ry += 6) {
      const waveOff = Math.round(((frame * 0.45) + ry * 7) % 52);
      ctx.fillStyle = PAL.MAROON_MID;
      for (let wx = -52; wx < VIEW_W + 52; wx += 52) {
        ctx.fillRect(wx + waveOff, ry, 28, 3);
      }
      ctx.fillStyle = PAL.MAROON_FOAM;
      for (let wx = -52; wx < VIEW_W + 52; wx += 52) {
        ctx.fillRect(wx + waveOff + 6, ry + 1, 12, 1);
      }
    }

    // Close-up birchbark canoe gliding gently in the foreground river
    drawCanoeAndHunter(Math.floor(VIEW_W * 0.14), lowerBankY - 18, frame);

    // 3. Close-up Lower Riverbank (Foreground golden prairie grass, sand edge, oaks & boulders)
    ctx.fillStyle = PAL.MAROON_FOAM;
    ctx.fillRect(0, lowerBankY - 2, VIEW_W, 2);
    ctx.fillStyle = PAL.SAND_MID;
    ctx.fillRect(0, lowerBankY, VIEW_W, 3);
    ctx.fillStyle = PAL.GOLD_LIGHT;
    ctx.fillRect(0, lowerBankY + 3, VIEW_W, 6);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(0, lowerBankY + 9, VIEW_W, 12);
    ctx.fillStyle = PAL.GOLD_DARK;
    ctx.fillRect(0, lowerBankY + 21, VIEW_W, VIEW_H - (lowerBankY + 21));

    // Close-up grass tufts & riverbank stones framing the lower bank
    for (let gx = 6; gx < VIEW_W; gx += 18) {
      ctx.fillStyle = PAL.MID_PINE;
      ctx.fillRect(gx, lowerBankY + 2, 1, 4);
      ctx.fillRect(gx + 2, lowerBankY + 1, 1, 5);
      ctx.fillStyle = PAL.CHARTREUSE_L;
      ctx.fillRect(gx + 1, lowerBankY + 2, 1, 3);
    }
    drawShieldOutcrop(10, lowerBankY + 1, false, false);
    drawShadedPine(VIEW_W - 26, lowerBankY - 8, false, false);

    // 4. Stylized "Woodland" Pixel Title Banner
    const titleScale = VIEW_W >= 260 ? 3 : 2;
    const topWordY = Math.floor(VIEW_H * 0.18);
    const botWordY = topWordY + 9 * titleScale + 6;
    drawWoodlandWord('RED RIVER', Math.floor(VIEW_W / 2), topWordY, titleScale);
    drawWoodlandWord('RUN', Math.floor(VIEW_W / 2), botWordY, titleScale);

    // 5. "PRESS A TO START" fades in smoothly after 2.0 seconds on the lower banking!
    if (elapsedSec >= 2.0) {
      const fadeInT = Math.min(1, (elapsedSec - 2.0) / 0.85);
      const pulse = 0.72 + Math.sin(tAnim * 2.2) * 0.28;
      const alpha = fadeInT * pulse;

      const promptY = lowerBankY + Math.floor((VIEW_H - lowerBankY) * 0.56);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(Math.floor(VIEW_W / 2) - 58, promptY - 7, 116, 12);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText("PRESS 'A' TO START", Math.floor(VIEW_W / 2), promptY + 2);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    // Fade-to-black transition into Upper Fort Garry opening cutscene
    if (isFadingFromTitle) {
      titleFadeOutAlpha = Math.min(1, titleFadeOutAlpha + 0.045);
      ctx.fillStyle = `rgba(5, 10, 8, ${titleFadeOutAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      if (titleFadeOutAlpha >= 1) {
        isFadingFromTitle = false;
        beginOpeningCutscene();
      }
    }
  }

  // ==========================================
  // 5. ENLARGED SNES SPRITES & SILHOUETTE SHADING
  // ==========================================
  function drawCanoeHullOnly(x, y, frameCount, beached, silT = 0) {
    const bob = beached ? 0 : Math.sin(frameCount * 0.14) * 1;
    const py = Math.round(y + bob);

    const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
    const cHideL = lerpColor(PAL.HIDE_LIGHT, PAL.SIL_RIM, silT);
    const cHideM = lerpColor(PAL.HIDE_MID, PAL.SILHOUETTE, silT);
    const cHideD = lerpColor(PAL.HIDE_DARK, PAL.SILHOUETTE, silT);
    const cSash = lerpColor(PAL.SASH_RED, '#A82038', silT);
    const cWoodD = lerpColor(PAL.WOOD_DARK, PAL.SILHOUETTE, silT);
    const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
    const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM, silT);

    if (!beached) {
      ctx.fillStyle = `rgba(0, 0, 0, ${(0.35 + silT * 0.25).toFixed(2)})`;
      ctx.fillRect(x + 4, py + 14, 36, 2);
    }

    ctx.fillStyle = cOut;
    ctx.fillRect(x + 3, py + 7, 38, 7);
    ctx.fillRect(x + 1, py + 5, 4, 4);
    ctx.fillRect(x + 39, py + 5, 4, 4);
    ctx.fillRect(x, py + 4, 2, 2);
    ctx.fillRect(x + 42, py + 4, 2, 2);

    ctx.fillStyle = cHideL;
    ctx.fillRect(x + 4, py + 7, 36, 2);
    ctx.fillRect(x + 2, py + 5, 3, 2);
    ctx.fillRect(x + 39, py + 5, 3, 2);
    ctx.fillRect(x + 1, py + 4, 2, 1);
    ctx.fillRect(x + 41, py + 4, 2, 1);

    ctx.fillStyle = cHideM;
    ctx.fillRect(x + 4, py + 9, 36, 3);
    ctx.fillRect(x + 2, py + 7, 2, 2);
    ctx.fillRect(x + 40, py + 7, 2, 2);

    ctx.fillStyle = cHideD;
    ctx.fillRect(x + 6, py + 12, 32, 2);

    ctx.fillStyle = cSash;
    ctx.fillRect(x + 7, py + 9, 3, 1);
    ctx.fillRect(x + 34, py + 9, 3, 1);
    ctx.fillStyle = cWoodD;
    ctx.fillRect(x + 12, py + 8, 1, 4);
    ctx.fillRect(x + 31, py + 8, 1, 4);

    if (!beached) {
      ctx.fillStyle = cOut;
      ctx.fillRect(x + 26, py + 3, 8, 4);
      ctx.fillStyle = cWoodM;
      ctx.fillRect(x + 27, py + 4, 6, 3);
      ctx.fillStyle = cWoodL;
      ctx.fillRect(x + 28, py + 4, 4, 1);
    }
  }

  function drawCanoeAndHunter(x, y, frameCount, hasPackage = true) {
    if (isSledMode) {
      drawDogSledAndHunter(x, y, frameCount, false, true);
      return;
    }

    const silT = gameMode === 'TITLE' ? 0 : getSilhouetteFactor();
    const bob = Math.sin(frameCount * 0.14) * 1;
    const py = Math.round(y + bob);

    drawCanoeHullOnly(x, y, frameCount, !hasPackage, silT);

    // Draw urgent wrapped parcel in bow if carrying package
    if (hasPackage) {
      const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
      const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
      const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM, silT);
      ctx.fillStyle = cOut;
      ctx.fillRect(x + 26, py + 3, 8, 4);
      ctx.fillStyle = cWoodM;
      ctx.fillRect(x + 27, py + 4, 6, 3);
      ctx.fillStyle = cWoodL;
      ctx.fillRect(x + 28, py + 4, 4, 1);
    }

    const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
    const cHideL = lerpColor(PAL.HIDE_LIGHT, PAL.SIL_RIM, silT);
    const cHideM = lerpColor(PAL.HIDE_MID, PAL.SILHOUETTE, silT);
    const cSash = lerpColor(PAL.SASH_RED, '#D92648', silT);
    const cSkin = lerpColor('#C98E63', PAL.SILHOUETTE, silT);
    const cHair = lerpColor('#14110F', PAL.SILHOUETTE, silT);
    const cWoodD = lerpColor(PAL.WOOD_DARK, PAL.SILHOUETTE, silT);
    const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
    const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM, silT);

    const hx = x + 14;
    const hy = py - 5;

    ctx.fillStyle = cOut;
    ctx.fillRect(hx, hy + 5, 9, 7);
    ctx.fillStyle = cHideM;
    ctx.fillRect(hx + 1, hy + 6, 7, 5);
    ctx.fillStyle = cHideL;
    ctx.fillRect(hx + 1, hy + 6, 4, 3);

    ctx.fillStyle = cHideL;
    ctx.fillRect(hx + 1, hy + 11, 1, 1);
    ctx.fillRect(hx + 3, hy + 11, 1, 1);
    ctx.fillRect(hx + 5, hy + 11, 1, 1);
    ctx.fillRect(hx + 7, hy + 11, 1, 1);

    ctx.fillStyle = cSash;
    ctx.fillRect(hx + 1, hy + 9, 7, 2);

    ctx.fillStyle = cOut;
    ctx.fillRect(hx + 2, hy - 1, 6, 6);
    ctx.fillStyle = cSkin;
    ctx.fillRect(hx + 5, hy + 1, 2, 3);
    ctx.fillStyle = cHair;
    ctx.fillRect(hx + 2, hy - 1, 5, 2);
    ctx.fillRect(hx + 1, hy + 1, 4, 4);

    // Animated Paddling Cycle (Solid, straight wooden paddle)
    const strokeIdx = Math.floor(frameCount / 7);
    const strokePhase = strokeIdx % 4;
    const cycleNum = Math.floor(strokeIdx / 4);

    // Subtle (25% volume) soft paddle splash audio on every SECOND paddle stroke!
    if (gameMode === 'PLAYING' && !isPaused && strokePhase === 1 && cycleNum % 2 === 1 && lastSplashStrokeId !== cycleNum) {
      lastSplashStrokeId = cycleNum;
      playPaddleSplashSound();
    }

    let handFrontX = hx + 7, handFrontY = hy + 7;
    let handBackX = hx + 3, handBackY = hy + 5;
    let bladeX = hx + 11, bladeY = py + 14;

    if (strokePhase === 0) {
      handFrontX = hx + 8; handFrontY = hy + 7;
      handBackX = hx + 4; handBackY = hy + 4;
      bladeX = hx + 12; bladeY = py + 14;
    } else if (strokePhase === 1) {
      handFrontX = hx + 6; handFrontY = hy + 7;
      handBackX = hx + 3; handBackY = hy + 4;
      bladeX = hx + 6; bladeY = py + 15;
    } else if (strokePhase === 2) {
      handFrontX = hx + 3; handFrontY = hy + 7;
      handBackX = hx + 0; handBackY = hy + 4;
      bladeX = hx - 2; bladeY = py + 14;
    } else {
      handFrontX = hx + 5; handFrontY = hy + 6;
      handBackX = hx + 2; handBackY = hy + 4;
      bladeX = hx + 4; bladeY = py + 11;
    }

    ctx.fillStyle = cHideL;
    ctx.fillRect(handBackX, handBackY, 3, 2);
    ctx.fillRect(handFrontX, handFrontY, 3, 2);

    const topX = handBackX;
    const topY = handBackY - 3;
    const steps = 11;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const sx = Math.round(topX + (bladeX - topX) * t);
      const sy = Math.round(topY + (bladeY - topY) * t);
      if (s >= 8) {
        ctx.fillStyle = cWoodD;
        ctx.fillRect(sx - 1, sy, 3, 2);
        ctx.fillStyle = cWoodL;
        ctx.fillRect(sx, sy, 2, 1);
      } else {
        ctx.fillStyle = cWoodM;
        ctx.fillRect(sx, sy, 1, 1);
      }
    }

    // Soft animated water splash droplets & ripple on every second paddle stroke
    if (strokePhase !== 3) {
      ctx.fillStyle = lerpColor(PAL.SNOW_LIGHT, '#72B8E8', silT);
      ctx.fillRect(bladeX - 2, py + 14, 5, 1);
      if (cycleNum % 2 === 1 && (strokePhase === 1 || strokePhase === 2)) {
        ctx.fillRect(bladeX - 4, py + 13, 2, 1);
        ctx.fillRect(bladeX + 3, py + 13, 2, 1);
        ctx.fillRect(bladeX - 1, py + 12, 1, 1);
      }
    }
  }

  function drawDogSledAndHunter(x, y, frameCount, stationary, hasCargo = true, showHunterOnSled = true) {
    const py = Math.round(y);
    const runStep = stationary ? 0 : (Math.floor(frameCount / 5) % 2);

    for (let d = 0; d < 2; d++) {
      const dx = x + 28 + d * 13;
      const dy = py + 5 + (!stationary && d === runStep ? 0 : 1);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 22, py + 9, dx - (x + 22), 1);

      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(dx, dy, 9, 5);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(dx + 1, dy + 1, 7, 3);
      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(dx + 7, dy - 3, 4, 4);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(dx + 8, dy - 2, 3, 2);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(dx - 2, dy - 1, 2, 3);

      ctx.fillStyle = PAL.SNOW_LIGHT;
      if (runStep === 0 || stationary) {
        ctx.fillRect(dx, dy + 5, 2, 3);
        ctx.fillRect(dx + 7, dy + 5, 2, 3);
      } else {
        ctx.fillRect(dx + 2, dy + 5, 2, 3);
        ctx.fillRect(dx + 5, dy + 5, 2, 3);
      }
    }

    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 2, py + 12, 21, 2);
    ctx.fillRect(x + 21, py + 7, 3, 6);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 3, py + 10, 18, 2);

    if (hasCargo) {
      ctx.fillStyle = PAL.HIDE_DARK;
      ctx.fillRect(x + 10, py + 5, 9, 5);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 11, py + 5, 7, 3);
    }

    if (showHunterOnSled) {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 1, py, 8, 11);
      ctx.fillStyle = PAL.HIDE_DARK;
      ctx.fillRect(x + 2, py + 1, 6, 9);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 3, py + 2, 4, 6);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 2, py + 6, 6, 2);
      ctx.fillStyle = PAL.HIDE_MID;
      ctx.fillRect(x + 2, py - 4, 6, 5);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 6, py - 3, 2, 3);
      ctx.fillStyle = '#C98E63';
      ctx.fillRect(x + 5, py - 2, 2, 2);
    }
  }

  // ==========================================
  // 5. EXTENDED OPENING & CLOSING CUTSCENES
  // ==========================================
  // Red River Cart (Two large spoked wooden wheels, oxen/horse, stacked trade crates)
  function drawRedRiverCart(x, y, frameCount, moving) {
    const wheelSpin = moving ? (Math.floor(frameCount / 4) % 2) : 0;

    // Ox / Draft horse pulling cart (facing left)
    ctx.fillStyle = '#3B2314';
    ctx.fillRect(x - 16, y + 3, 12, 6);
    ctx.fillRect(x - 19, y + 1, 4, 5);
    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(x - 20, y, 2, 2); // Horn
    ctx.fillStyle = '#1F120A';
    ctx.fillRect(x - 15 + wheelSpin, y + 9, 2, 4);
    ctx.fillRect(x - 7 - wheelSpin, y + 9, 2, 4);
    // Wooden shafts
    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(x - 6, y + 5, 8, 1);

    // Cart wooden bed & stacked cargo crates
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x, y + 4, 22, 4);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 2, y, 8, 4);
    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(x + 11, y - 1, 9, 5);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(x + 13, y + 1, 5, 1);

    // Iconic tall spoked Red River wooden wheel
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(x + 6, y + 3, 10, 10);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 7, y + 4, 8, 8);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(x + 8, y + 5, 6, 6);
    ctx.fillStyle = PAL.WOOD_DARK;
    if (wheelSpin === 0) {
      ctx.fillRect(x + 10, y + 4, 2, 8);
      ctx.fillRect(x + 7, y + 7, 8, 2);
    } else {
      ctx.fillRect(x + 8, y + 5, 2, 2);
      ctx.fillRect(x + 12, y + 9, 2, 2);
      ctx.fillRect(x + 12, y + 5, 2, 2);
      ctx.fillRect(x + 8, y + 9, 2, 2);
    }
  }

  // Extended Opening Cutscene at Upper Fort Garry & The Forks
  function drawOpeningCutscene() {
    const f = openingFrame;
    const hudH = 36;
    const horizonY = hudH + Math.floor((VIEW_H - hudH) * 0.24);
    const riverTopY = horizonY + 14;
    const riverH = VIEW_H - riverTopY;
    const laneH = Math.floor(riverH / 3);
    const midY = riverTopY + laneH + Math.floor((laneH - 15) / 2);

    // Sky
    ctx.fillStyle = PAL.DAY_SKY_T;
    ctx.fillRect(0, 0, VIEW_W, horizonY);
    ctx.fillStyle = PAL.DAY_SKY_B;
    ctx.fillRect(0, Math.floor(horizonY * 0.55), VIEW_W, horizonY);

    // Golden Prairie Bank at The Forks
    ctx.fillStyle = PAL.GOLD_LIGHT;
    ctx.fillRect(0, horizonY, VIEW_W, 5);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(0, horizonY + 5, VIEW_W, 5);
    ctx.fillStyle = PAL.GOLD_DARK;
    ctx.fillRect(0, horizonY + 10, VIEW_W, 4);

    // Red River body
    ctx.fillStyle = PAL.MAROON_DEEP;
    ctx.fillRect(0, riverTopY, VIEW_W, riverH);
    ctx.fillStyle = PAL.MAROON_MID;
    ctx.fillRect(0, riverTopY, VIEW_W, 6);

    // Assiniboine River Tributary flowing down from horizon on the left to meet Red River at The Forks!
    const forksJoinX = 56;
    fillPixelPoly([
      [12, horizonY],
      [34, horizonY],
      [forksJoinX + 14, riverTopY + 3],
      [forksJoinX - 18, riverTopY + 3]
    ], PAL.MAROON_DEEP);
    fillPixelPoly([
      [33, horizonY],
      [36, horizonY],
      [forksJoinX + 16, riverTopY + 3],
      [forksJoinX + 13, riverTopY + 3]
    ], PAL.MAROON_FOAM);

    // Background prairie trees
    drawShadedPine(12, horizonY - 12, false, false);
    drawShadedPine(VIEW_W - 28, horizonY - 12, false, false);

    // Upper Fort Garry locked beside The Forks (x = 64)
    const fortX = 64;
    const fortY = horizonY - 10;
    const fortRustle = (f >= 210 && f <= 355) ? Math.round(Math.sin(f * 1.4) * 1.5) : 0;
    drawFortLandmark(fortX + fortRustle, fortY, 'UPPER_FORT');

    // Rustle dust puffs & windows glowing during fort activity (f: 210..355)
    if (f >= 210 && f <= 355) {
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(fortX + 6 + fortRustle, fortY + 6, 3, 2);
      ctx.fillRect(fortX + 24 + fortRustle, fortY + 6, 3, 2);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(fortX - 3, fortY + 11, 3, 2);
      ctx.fillRect(fortX + 34, fortY + 10, 3, 2);
    }

    // 1. Red River Cart rolls in from the right (f: 0..85) and parks beside Upper Fort Garry
    const cartTargetX = fortX + 52;
    const cartX = f < 85
      ? Math.round(VIEW_W + 24 - (f / 85) * (VIEW_W + 24 - cartTargetX))
      : cartTargetX;
    drawRedRiverCart(cartX, horizonY - 9, f, f < 85);

    // 2. Exclamation mark pops up and flashes 3 times above Upper Fort Garry (f: 85..145)
    if (f >= 85 && f <= 145) {
      const flashIdx = Math.floor((f - 85) / 10); // 0,1 (flash 1), 2,3 (flash 2), 4,5 (flash 3)
      if (flashIdx % 2 === 0) {
        const exX = fortX + 16;
        const exY = fortY - 18;
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(exX - 2, exY - 1, 6, 12);
        ctx.fillStyle = PAL.SASH_RED;
        ctx.fillRect(exX - 1, exY, 4, 10);
        ctx.fillStyle = PAL.GOLD_LIGHT;
        ctx.fillRect(exX, exY + 1, 2, 5);
        ctx.fillRect(exX, exY + 8, 2, 2);
      }
    }

    // 3. Canoe comes down from the horizon along the Assiniboine River, stopping at Upper Fort Garry (f: 120..185)
    const dockX = 28;
    const dockY = riverTopY - 6;
    if (f >= 120 && f < 185) {
      const ct = (f - 120) / 65;
      const cx = Math.round(10 + ct * (dockX - 10));
      const cy = Math.round(horizonY - 6 + ct * (dockY - (horizonY - 6)));
      drawCanoeAndHunter(cx, cy, f, false);
    } else if (f >= 185 && f < 395) {
      // Canoe parked at Upper Fort Garry landing while trapper fetches urgent package
      drawCanoeHullOnly(dockX, dockY, f, true, 0);
    }

    // 4. Trapper walks from canoe to Upper Fort Garry (f: 185..215), enters fort, then returns with package (f: 355..395)
    const gateX = fortX + 15;
    const gateY = horizonY - 3;
    if (f >= 185 && f < 215) {
      const wt = (f - 185) / 30;
      const wx = Math.round(dockX + 16 + (gateX - (dockX + 16)) * wt);
      const wy = Math.round(dockY - 2 + (gateY - (dockY - 2)) * wt);
      drawWalkingVoyageur(wx, wy, f, false);
    } else if (f >= 355 && f < 395) {
      const wt = (f - 355) / 40;
      const wx = Math.round(gateX + (dockX + 16 - gateX) * wt);
      const wy = Math.round(gateY + (dockY - 2 - gateY) * wt);
      drawWalkingVoyageur(wx, wy, f, true);
    }

    // 5. Urgent Dispatch Speech Box above the fort during the rustle (f: 215..355)
    if (f >= 215 && f <= 355) {
      const boxW = Math.min(VIEW_W - 16, 216);
      const boxX = Math.floor((VIEW_W - boxW) / 2);
      const boxY = 8;
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(boxX - 2, boxY - 2, boxW + 4, 30);
      ctx.fillStyle = '#12291E';
      ctx.fillRect(boxX, boxY, boxW, 26);
      ctx.strokeStyle = PAL.GOLD_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, 25);

      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.font = 'bold 6px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('This package is highly urgent and must get', Math.floor(VIEW_W / 2), boxY + 10);
      ctx.fillText('to York Factory as soon as possible...no matter the weather!', Math.floor(VIEW_W / 2), boxY + 20);
      ctx.textAlign = 'left';
    }

    // 6. Canoe paddles short stretch down the Assiniboine & turns right at The Forks into the Red River (f: 395..520)
    if (f >= 395) {
      const pt = Math.min(1, (f - 395) / (OPENING_TOTAL - 395));
      if (pt < 0.45) {
        // Short paddle down the Assiniboine into The Forks junction
        const st = pt / 0.45;
        const cx = Math.round(dockX + (forksJoinX - 10 - dockX) * st);
        const cy = Math.round(dockY + (midY - dockY) * st);
        drawCanoeAndHunter(cx, cy, f, true);
      } else {
        // Turns right at The Forks to begin the Red River paddle!
        const rt = (pt - 0.45) / 0.55;
        const cx = Math.round((forksJoinX - 10) * (1 - rt) + 16 * rt);
        drawCanoeAndHunter(cx, midY, f, true);
      }
    }

    // Fade-in from black on first 22 frames
    if (f < 22) {
      const alpha = 1 - f / 22;
      ctx.fillStyle = `rgba(5, 10, 8, ${alpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  function drawWalkingVoyageur(wx, wy, frameCount, carryingPackage) {
    const stepBob = Math.floor(frameCount / 5) % 2;
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(wx, wy, 7, 10);
    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(wx + 1, wy + 1, 5, 7);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(wx + 1, wy + 5, 5, 1);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(wx + 1, wy - 3, 5, 4);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(wx + 1 + stepBob, wy + 9, 2, 2);
    ctx.fillRect(wx + 4 - stepBob, wy + 9, 2, 2);

    if (carryingPackage) {
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(wx - 3, wy + 2, 6, 4);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(wx - 2, wy + 3, 4, 2);
    }
  }

  // Full-Rigged 3-Masted HBC Barque Ship in Port at York Factory / Hudson Bay
  function drawHBCBarqueShip(x, waterY, frameCount) {
    const bob = Math.sin(frameCount * 0.06) * 1;
    const sy = Math.round(waterY + bob);

    // Dark timber hull with white gunport stripe
    fillPixelPoly([
      [x, sy - 6],
      [x + 68, sy - 6],
      [x + 62, sy + 4],
      [x + 8, sy + 4]
    ], PAL.OUTLINE);
    fillPixelPoly([
      [x + 2, sy - 5],
      [x + 66, sy - 5],
      [x + 60, sy + 3],
      [x + 9, sy + 3]
    ], PAL.WOOD_DARK);
    // White gunport stripe
    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(x + 5, sy - 2, 56, 2);
    // Bowsprit pointing right toward open Hudson Bay
    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(x + 66, sy - 7, 14, 2);

    // Three tall masts (Fore, Main, Mizzen)
    const masts = [x + 18, x + 36, x + 52];
    const mastHeights = [30, 36, 26];
    for (let m = 0; m < 3; m++) {
      const mx = masts[m];
      const mh = mastHeights[m];
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(mx, sy - 6 - mh, 2, mh);

      // Furled/billowing square sails on yards
      ctx.fillStyle = PAL.SNOW_MID;
      ctx.fillRect(mx - 6, sy - 6 - mh + 5, 14, 7);
      ctx.fillRect(mx - 7, sy - 6 - mh + 15, 16, 8);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(mx - 5, sy - 6 - mh + 5, 11, 3);
      ctx.fillRect(mx - 6, sy - 6 - mh + 15, 13, 3);
    }

    // Rigging lines
    ctx.fillStyle = 'rgba(20, 20, 20, 0.55)';
    ctx.fillRect(x + 6, sy - 18, 12, 1);
    ctx.fillRect(x + 54, sy - 20, 14, 1);

    // Red Ensign HBC Flag flying proudly from the mainmast / stern!
    const flagWave = Math.floor(frameCount / 8) % 2;
    const fx = x + 38;
    const fy = sy - 44;
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(fx, fy, 11, 6);
    ctx.fillRect(fx + 10, fy + flagWave, 3, 5);
    // Union canton & white "HBC" mark
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(fx, fy, 4, 3);
    ctx.fillStyle = PAL.SNOW_LIGHT;
    ctx.fillRect(fx + 5, fy + 2, 4, 2);

    // Gangplank connecting snowy port pier to the barque deck
    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(x - 10, sy - 4, 14, 2);
  }

  // Extended Closing Cutscene: York Factory -> Suited Factor in Top Hat -> Camera Pan to Hudson Bay Barque -> Fade to Black
  function drawClosingCutscene() {
    const f = closingFrame;
    const hudH = 36;
    const horizonY = hudH + Math.floor((VIEW_H - hudH) * 0.22);
    const riverTopY = horizonY + 4;
    const riverH = VIEW_H - riverTopY;

    // Camera pan offset: stays locked on York Factory for f: 0..170, then pans smoothly right (0 -> 150px)
    // to reveal the grand opening of Hudson Bay and the full-rigged HBC barque in port!
    const panT = f <= 170 ? 0 : Math.min(1, (f - 170) / 145);
    const camX = Math.round(panT * 155);

    // 1. Crisp Northern Sky
    ctx.fillStyle = '#6BA3C4';
    ctx.fillRect(0, 0, VIEW_W, horizonY);
    ctx.fillStyle = '#F2E8D5';
    ctx.fillRect(0, Math.floor(horizonY * 0.55), VIEW_W, horizonY);

    // 2. Ground & Open Hudson Bay Waterline (pans left as camera moves right)
    const coastSplitWorldX = 165; // Where snowy York Factory shore meets open Hudson Bay
    const coastSplitScreenX = coastSplitWorldX - camX;

    // Snow-covered shore on left
    if (coastSplitScreenX > 0) {
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(0, horizonY, coastSplitScreenX, VIEW_H - horizonY);
      ctx.fillStyle = PAL.SNOW_MID;
      ctx.fillRect(0, riverTopY, coastSplitScreenX, riverH);
    }

    // Grand opening of Hudson Bay on right!
    if (coastSplitScreenX < VIEW_W) {
      const bayStartX = Math.max(0, coastSplitScreenX);
      ctx.fillStyle = PAL.BAY_DEEP;
      ctx.fillRect(bayStartX, horizonY, VIEW_W - bayStartX, VIEW_H - horizonY);
      ctx.fillStyle = PAL.BAY_MID;
      ctx.fillRect(bayStartX, horizonY + 4, VIEW_W - bayStartX, 14);
      ctx.fillStyle = PAL.BAY_FOAM;
      ctx.fillRect(bayStartX, horizonY, VIEW_W - bayStartX, 1);

      // Gentle Hudson Bay swells & ice floes
      for (let bx = bayStartX + 10; bx < VIEW_W; bx += 36) {
        const shimmer = Math.round(Math.sin((bx + f * 0.3) * 0.1) * 2);
        ctx.fillStyle = PAL.BAY_FOAM;
        ctx.fillRect(bx + shimmer, horizonY + 18, 14, 1);
        ctx.fillRect(bx + 8 - shimmer, horizonY + 34, 18, 1);
      }

      // Timber port pier extending into Hudson Bay
      if (coastSplitScreenX > -45) {
        ctx.fillStyle = PAL.WOOD_DARK;
        ctx.fillRect(coastSplitScreenX - 6, horizonY + 6, 48, 5);
        ctx.fillStyle = PAL.WOOD_LIGHT;
        ctx.fillRect(coastSplitScreenX - 6, horizonY + 6, 48, 2);
      }
    }

    // 3. York Factory Depot & Parked Dogsled (worldX ~ 55)
    const fortWorldX = 55;
    const fortScreenX = fortWorldX - camX;
    const fortY = horizonY - 11;
    if (fortScreenX > -60) {
      drawFortLandmark(fortScreenX, fortY, 'YORK_FACTORY');
      drawShadedPine(fortScreenX - 18, horizonY - 10, true, false);
      // Parked dogsled resting outside York Factory
      drawDogSledAndHunter(fortScreenX - 24, riverTopY + 8, f, true, false, false);
    }

    // 4. Full-Rigged HBC Barque Ship docked in Hudson Bay port (worldX = 202)
    const shipWorldX = 202;
    const shipScreenX = shipWorldX - camX;
    if (shipScreenX < VIEW_W + 20) {
      drawHBCBarqueShip(shipScreenX, horizonY + 9, f);
    }

    // 5. Phase 1 (f: 0..105): Trapper carries package from sled inside York Factory
    const doorWorldX = fortWorldX + 20;
    if (f < 105) {
      const wt = f / 105;
      const trapperWorldX = Math.round((fortWorldX - 16) + (doorWorldX - (fortWorldX - 16)) * wt);
      const trapperWorldY = Math.round((riverTopY + 8) + (fortY + 6 - (riverTopY + 8)) * wt);
      drawWalkingVoyageur(trapperWorldX - camX, trapperWorldY, f, true);
    }

    // 6. Phase 2 (f: 125..355): Suited man in top hat exits York Factory with package, walks right across the pier,
    //    and boards the HBC Barque ship in Hudson Bay!
    if (f >= 125 && f <= 355) {
      const walkProgress = (f - 125) / 230;
      const factorWorldX = Math.round(doorWorldX + (shipWorldX + 18 - doorWorldX) * walkProgress);
      const factorWorldY = Math.round((fortY + 6) + ((horizonY + 1) - (fortY + 6)) * Math.min(1, walkProgress * 1.4));
      const fx = factorWorldX - camX;
      const fy = factorWorldY;
      const stepBob = Math.floor(f / 5) % 2;

      // Tailored dark suit & coat
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx, fy, 7, 11);
      ctx.fillStyle = PAL.SUIT_DARK;
      ctx.fillRect(fx + 1, fy + 1, 5, 8);
      ctx.fillStyle = PAL.SUIT_MID;
      ctx.fillRect(fx + 2, fy + 2, 2, 6);
      // White shirt cravat
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(fx + 4, fy + 1, 2, 3);
      // Face
      ctx.fillStyle = '#E0AC84';
      ctx.fillRect(fx + 3, fy - 2, 3, 3);
      // Tall HBC Silk Top Hat
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx + 1, fy - 3, 7, 1); // Hat brim
      ctx.fillRect(fx + 2, fy - 7, 5, 4); // Hat crown
      ctx.fillStyle = PAL.SUIT_MID;
      ctx.fillRect(fx + 3, fy - 6, 2, 3);

      // Striding legs
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx + 1 + stepBob, fy + 9, 2, 3);
      ctx.fillRect(fx + 4 - stepBob, fy + 9, 2, 3);

      // Urgent package tucked securely under his arm
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(fx + 4, fy + 3, 6, 4);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(fx + 5, fy + 4, 4, 2);
    }

    // 7. Phase 3 (f: 355..420): Suited factor has boarded the HBC barque; smooth fade to black!
    if (f > 355) {
      const fadeAlpha = Math.min(1, (f - 355) / 60);
      ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  // Mid-Game North Shore Landing & Dogsled Deployment Animation (2650 - 2770)
  function drawDeploymentSequence(riverTopY, laneH) {
    const beachX = Math.round(VIEW_W * 0.42 - deployProgress * 30);
    const shoreTopY = riverTopY;
    const shoreBotY = VIEW_H;

    fillPixelPoly([
      [beachX + 24, shoreTopY],
      [VIEW_W, shoreTopY],
      [VIEW_W, shoreBotY],
      [beachX - 10, shoreBotY]
    ], PAL.SNOW_MID);

    fillPixelPoly([
      [beachX + 32, shoreTopY],
      [VIEW_W, shoreTopY],
      [VIEW_W, shoreBotY],
      [beachX, shoreBotY]
    ], PAL.SNOW_LIGHT);

    fillPixelPoly([
      [beachX + 20, shoreTopY],
      [beachX + 25, shoreTopY],
      [beachX - 9, shoreBotY],
      [beachX - 14, shoreBotY]
    ], PAL.ICE_MID);

    drawShadedPine(beachX + 55, shoreTopY + 6, true, false);
    drawShieldOutcrop(beachX + 75, shoreTopY + 18, true, false);
    drawShadedPine(beachX + 45, shoreTopY + laneH * 2 - 4, true, false);

    const midY = riverTopY + laneH + Math.floor((laneH - 15) / 2);

    if (deployProgress < 0.35) {
      const t = deployProgress / 0.35;
      const cx = Math.round(16 + t * (beachX - 24));
      drawCanoeAndHunter(cx, midY, frame, true);
    } else if (deployProgress < 0.72) {
      const t = (deployProgress - 0.35) / 0.37;
      const beachedX = beachX - 8;
      drawCanoeHullOnly(beachedX, midY - 12, frame, true, 0);

      const sledX = beachX + 18;
      drawDogSledAndHunter(sledX, midY + 4, frame, true, true, false);

      const walkX = Math.round(beachedX + 18 + t * 14);
      const walkY = Math.round(midY - 8 + t * 10);
      const hasParka = t > 0.45;
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(walkX, walkY, 7, 10);
      ctx.fillStyle = hasParka ? PAL.HIDE_DARK : PAL.HIDE_MID;
      ctx.fillRect(walkX + 1, walkY + 1, 5, 8);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(walkX + 1, walkY + 5, 5, 1);
      ctx.fillStyle = hasParka ? PAL.SNOW_LIGHT : '#14110F';
      ctx.fillRect(walkX + 1, walkY - 3, 5, 4);

      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(Math.floor(VIEW_W / 2) - 66, riverTopY + 3, 132, 11);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('DEPLOYING DOGSLED TEAM!', Math.floor(VIEW_W / 2), riverTopY + 11);
      ctx.textAlign = 'left';
    } else {
      const t = (deployProgress - 0.72) / 0.28;
      drawCanoeHullOnly(beachX - 18, midY - 12, frame, true, 0);
      const launchX = Math.round((beachX + 18) * (1 - t) + 16 * t);
      drawDogSledAndHunter(launchX, midY, frame, false, true, true);
    }
  }

  // ==========================================
  // 5B. SCENERY PROPS, CEDARS, SNOW TIPIS, & LANDMARKS
  // ==========================================
  function drawShadedPine(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 5, y, 2, 14);
      ctx.fillRect(x + 3, y + 3, 6, 3);
      ctx.fillRect(x + 2, y + 6, 8, 3);
      ctx.fillRect(x + 1, y + 9, 10, 3);
      return;
    }
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 5, y + 11, 2, 4);

    const cDark = isWinter ? PAL.SNOW_DARK : PAL.DARK_PINE;
    const cMid = isWinter ? PAL.SNOW_MID : PAL.MID_PINE;
    const cLight = isWinter ? PAL.SNOW_LIGHT : PAL.LIGHT_PINE;

    ctx.fillStyle = cDark;
    ctx.fillRect(x + 4, y, 4, 4);
    ctx.fillRect(x + 2, y + 4, 8, 4);
    ctx.fillRect(x + 1, y + 8, 10, 4);

    ctx.fillStyle = cMid;
    ctx.fillRect(x + 4, y, 3, 3);
    ctx.fillRect(x + 3, y + 4, 6, 3);
    ctx.fillRect(x + 2, y + 8, 7, 3);

    ctx.fillStyle = cLight;
    ctx.fillRect(x + 4, y + 1, 2, 2);
    ctx.fillRect(x + 3, y + 4, 3, 2);
    ctx.fillRect(x + 2, y + 8, 4, 2);
  }

  function drawEasternCedar(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 4, y + 1, 4, 13);
      ctx.fillRect(x + 2, y + 4, 8, 4);
      ctx.fillRect(x, y + 8, 12, 4);
      return;
    }
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 5, y + 11, 2, 4);

    ctx.fillStyle = PAL.CEDAR_DARK;
    ctx.fillRect(x + 3, y + 1, 6, 4);
    ctx.fillRect(x + 1, y + 5, 10, 4);
    ctx.fillRect(x, y + 8, 12, 4);

    ctx.fillStyle = PAL.CEDAR_MID;
    ctx.fillRect(x + 3, y + 1, 5, 3);
    ctx.fillRect(x + 2, y + 5, 8, 3);
    ctx.fillRect(x + 1, y + 8, 9, 3);

    ctx.lineTo(x + 9, y + 12);

    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 6, y - 2, 1, 3);

    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(x + 6, y + 8, 2, 4);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(x + 3, y + 6, 8, 1);

  function drawWolfCampfire(x, y, frameCount) {
    const flicker = Math.floor(frameCount / 5) % 3;

    ctx.fillStyle = 'rgba(246, 174, 45, 0.35)';

    ctx.fillStyle = PAL.WOOD_DARK;

    ctx.fillStyle = PAL.FIRE_YELLOW;
    ctx.fillRect(x + 4, y + 1 + (flicker === 2 ? 1 : 0), 2, 4);

    ctx.fillRect(x + 4, y + 4, 2, 1);
    ctx.fillStyle = PAL.FIRE_YELLOW;

    ctx.fillStyle = PAL.STONE_MID;

    ctx.fillStyle = PAL.STONE_LIGHT;

    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(wx, wy - 3, 1, 2);
    ctx.fillRect(wx + 2, wy - 3, 1, 2);

    ctx.fillRect(wx + 5, wy + 5, 3, 2);

  function drawShadedTipi(x, y) {

    ctx.moveTo(x + 7, y);
    ctx.lineTo(x + 8, y + 12);

    ctx.fillRect(x + 1, y + 1, 8, 5);

  function drawShieldOutcrop(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 2, y + 2, 14, 7);
      ctx.fillRect(x, y + 5, 18, 4);
      ctx.fillStyle = PAL.SIL_RIM;
      ctx.fillRect(x + 3, y + 2, 11, 1);
      return;
    }
    ctx.fillStyle = PAL.STONE_DARK;
    ctx.fillRect(x + 1, y + 2, 16, 7);
    ctx.fillRect(x, y + 5, 18, 4);
    ctx.fillStyle = isWinter ? PAL.SNOW_MID : PAL.STONE_MID;
    ctx.fillRect(x + 2, y + 2, 12, 4);
    ctx.fillStyle = isWinter ? PAL.SNOW_LIGHT : PAL.STONE_LIGHT;
    ctx.fillRect(x + 3, y + 2, 8, 2);
  }

  function drawBattleOfSevenOaks(lm, y, frameCount) {
    const x = Math.round(lm.x);
    if (!lm.triggered && x <= 64) {
      lm.triggered = true;
      lm.triggerFrame = frameCount;
      playTone(120, 'sawtooth', 0.16, 0.14);
    }

    const elapsed = lm.triggered ? (frameCount - lm.triggerFrame) : -1;
    const isFiring = (elapsed >= 0 && elapsed <= 18);
    const isHit = (elapsed >= 12 && elapsed <= 18);
    const isFallen = (elapsed >= 17);

    drawShadedPine(x - 4, y - 12, false, false);
    drawShadedPine(x + 18, y - 13, false, false);

    const mx1 = x + 6;
    const my1 = y - 1;
    ctx.fillStyle = '#3B2314';
    ctx.fillRect(mx1, my1 + 4, 9, 4);
    ctx.fillRect(mx1 + 7, my1 + 1, 3, 4);
    ctx.fillStyle = '#1F120A';
    ctx.fillRect(mx1 + 1, my1 + 8, 1, 3);
    ctx.fillRect(mx1 + 7, my1 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx1 + 2, my1 - 1, 4, 5);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(mx1 + 2, my1 + 2, 4, 1);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx1 + 3, my1 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx1 + 5, my1 + 1, 6, 1);

    const mx2 = x + 20;
    const my2 = y;
    ctx.fillStyle = '#5C3A21';
    ctx.fillRect(mx2, my2 + 4, 9, 4);
    ctx.fillRect(mx2 + 7, my2 + 1, 3, 4);
    ctx.fillStyle = '#2B1810';
    ctx.fillRect(mx2 + 1, my2 + 8, 1, 3);
    ctx.fillRect(mx2 + 7, my2 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx2 + 2, my2 - 1, 4, 5);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx2 + 3, my2 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx2 + 5, my2 + 1, 6, 1);

    const gx1 = x + 32;
    const gx2 = x + 40;
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(gx1, y + 4, 4, 4);
    ctx.fillRect(gx2, y + 5, 4, 4);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(gx1 + 3, y + 5, 5, 1);
    ctx.fillRect(gx2 + 3, y + 6, 5, 1);
    ctx.fillStyle = PAL.CHARTREUSE_L;
    ctx.fillRect(gx1 - 1, y + 4, 1, 6);
    ctx.fillRect(gx1 + 2, y + 3, 1, 7);
    ctx.fillRect(gx1 + 5, y + 5, 1, 5);
    ctx.fillRect(gx2 + 1, y + 4, 1, 6);
    ctx.fillRect(gx2 + 4, y + 4, 1, 6);

    if (isFiring) {
      const puffR = elapsed < 8 ? 3 : 4;
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(mx1 + 11, my1, puffR, 3);
      ctx.fillRect(mx2 + 11, my2, puffR, 3);
      ctx.fillRect(gx1 + 8, y + 4, puffR, 2);
      ctx.fillRect(gx2 + 8, y + 5, puffR, 2);

      const shotProgress = Math.min(1, elapsed / 14);
      const shotX = Math.round(gx2 + 10 + shotProgress * 26);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(shotX, y + 2, 3, 1);
      ctx.fillRect(shotX - 3, y + 5, 3, 1);
      ctx.fillRect(shotX + 2, y + 7, 3, 1);
    }

    const hbcPositions = [x + 66, x + 73, x + 80, x + 87];
    for (let i = 0; i < hbcPositions.length; i++) {
      const hx = hbcPositions[i];
      if (!isFallen) {
        ctx.fillStyle = isHit ? PAL.SNOW_LIGHT : PAL.HBC_COAT;
        ctx.fillRect(hx, y + 3, 4, 5);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 1, y + 8, 1, 3);
        ctx.fillRect(hx + 3, y + 8, 1, 3);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx, y, 4, 2);
        ctx.fillStyle = '#C98E63';
        ctx.fillRect(hx + 1, y + 2, 2, 1);
      } else {
        ctx.fillStyle = PAL.HBC_COAT;
        ctx.fillRect(hx - 1, y + 9, 6, 2);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 5, y + 9, 2, 2);
      }
    }
  }

  function drawFortLandmark(x, y, type) {
    if (type === 'ST_ANDREWS_CHURCH') {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x, y + 1, 28, 13);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(x + 1, y + 2, 26, 11);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 1, y + 2, 26, 2);
      ctx.fillStyle = PAL.DARK_PINE;
      ctx.fillRect(x - 1, y - 1, 30, 3);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 5, y + 5, 2, 4);
      ctx.fillRect(x + 11, y + 5, 2, 4);
      ctx.fillRect(x + 17, y + 5, 2, 4);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 22, y - 6, 6, 20);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 23, y - 10, 4, 4);
      fillPixelPoly([
        [x + 22, y - 10],
        [x + 25, y - 17],
        [x + 28, y - 10]
      ], PAL.STONE_DARK);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 25, y - 19, 1, 3);
      return;
    }

    if (type === 'NORWAY_HOUSE') {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x - 1, y + 2, 42, 12);
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x, y + 4, 40, 10);
      ctx.fillStyle = PAL.WOOD_MID;
      for (let px = 1; px < 39; px += 3) {
        ctx.fillRect(x + px, y + 3, 2, 11);
      }
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 6, y - 3, 28, 8);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x + 5, y - 5, 30, 2);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 5, y - 6, 30, 2);
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 17, y + 7, 6, 7);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 20, y - 12, 1, 7);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 21, y - 12, 5, 3);
      return;
    }

    if (type === 'YORK_FACTORY') {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x - 2, y - 4, 48, 18);
      ctx.fillStyle = PAL.HIDE_MID;
      ctx.fillRect(x, y - 2, 44, 15);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 1, y - 2, 42, 4);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x - 3, y - 5, 50, 3);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x - 1, y - 6, 22, 2);
      ctx.fillRect(x + 28, y - 6, 16, 2);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 18, y - 10, 8, 5);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 22, y - 15, 6, 3);
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 21, y - 15, 1, 6);
      ctx.fillStyle = PAL.INDIGO_DEEP;
      for (let wx = 4; wx <= 36; wx += 8) {

      }

    ctx.fillRect(x, y + 4, 34, 10);

    ctx.fillStyle = PAL.STONE_LIGHT;

    ctx.fillRect(x - 2, y, 7, 14);
    ctx.fillRect(x + 29, y, 7, 14);
    ctx.fillStyle = PAL.MAROON_MID;
    ctx.fillRect(x - 3, y - 2, 9, 2);
    ctx.fillRect(x + 28, y - 2, 9, 2);

    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 14, y + 7, 6, 7);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 16, y - 6, 1, 10);
