  function drawShieldOutcrop(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 2, y + 2, 14, 7);
      ctx.fillRect(x, y + 5, 18, 4);
      ctx.fillStyle = PAL.SIL_RIM_BRIGHT;
      ctx.fillRect(x + 3, y + 2, 11, 1);
      return;
    }
    ctx.fillStyle = PAL.STONE_DARK;
    ctx.fillRect(x + 1, y + 2, 16, 7);
    ctx.fillRect(x, y + 5, 18, 4);
    ctx.fillStyle = isWinter ? PAL.SNOW_MID : PAL.STONE_MID;
    ctx.fillRect(x + 2, y + 2, 12, 4);
    ctx.fillStyle = isWinter ? PAL.SNOW_LIGHT : PAL.STONE_LIGHT;
    ctx.fillRect(x + 3, y + 2, 8, 2);
  }

  // Battle of Seven Oaks Replay:
  // - Red River carts to the left of the NWC men
  // - 4 oaks to the immediate left and 3 oaks to the immediate right acting as scenic buffers
  // - Plays ONCE after user x-axis passes by, with unboxed "Battle of Seven Oaks" title above
  function drawBattleOfSevenOaks(lm, y, frameCount) {
    const x = Math.round(lm.x);
    if (!lm.triggered && x <= 78) {
      lm.triggered = true;
      lm.triggerFrame = frameCount;
      playTone(120, 'sawtooth', 0.16, 0.14);
    }

    const elapsed = lm.triggered ? (frameCount - lm.triggerFrame) : -1;
    const isFiring = (elapsed >= 0 && elapsed <= 18);
    const isHit = (elapsed >= 12 && elapsed <= 18);
    const isFallen = (elapsed >= 17);

    // 4 Oaks to the immediate left of the scene (acting as scenic buffer)
    drawShadedPine(x - 46, y - 12, false, false);
    drawShadedPine(x - 34, y - 11, false, false);
    drawShadedPine(x - 22, y - 13, false, false);
    drawShadedPine(x - 10, y - 11, false, false);

    // Red River Carts parked to the left of the NWC men
    drawRedRiverCart(x + 16, y - 4, frameCount, false);

    // Mounted NWC Rider 1 & 2
    const mx1 = x + 36;
    const my1 = y - 1;
    ctx.fillStyle = '#3B2314';
    ctx.fillRect(mx1, my1 + 4, 9, 4);
    ctx.fillRect(mx1 + 7, my1 + 1, 3, 4);
    ctx.fillStyle = '#1F120A';
    ctx.fillRect(mx1 + 1, my1 + 8, 1, 3);
    ctx.fillRect(mx1 + 7, my1 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx1 + 2, my1 - 1, 4, 5);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(mx1 + 2, my1 + 2, 4, 1);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx1 + 3, my1 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx1 + 5, my1 + 1, 6, 1);

    const mx2 = x + 50;
    const my2 = y;
    ctx.fillStyle = '#5C3A21';
    ctx.fillRect(mx2, my2 + 4, 9, 4);
    ctx.fillRect(mx2 + 7, my2 + 1, 3, 4);
    ctx.fillStyle = '#2B1810';
    ctx.fillRect(mx2 + 1, my2 + 8, 1, 3);
    ctx.fillRect(mx2 + 7, my2 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx2 + 2, my2 - 1, 4, 5);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx2 + 3, my2 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx2 + 5, my2 + 1, 6, 1);

    // Two NWC Men crouched & hidden in tall chartreuse marsh grass
    const gx1 = x + 62;
    const gx2 = x + 70;
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(gx1, y + 4, 4, 4);
    ctx.fillRect(gx2, y + 5, 4, 4);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(gx1 + 3, y + 5, 5, 1);
    ctx.fillRect(gx2 + 3, y + 6, 5, 1);
    ctx.fillStyle = PAL.CHARTREUSE_L;
    ctx.fillRect(gx1 - 1, y + 4, 1, 6);
    ctx.fillRect(gx1 + 2, y + 3, 1, 7);
    ctx.fillRect(gx1 + 5, y + 5, 1, 5);
    ctx.fillRect(gx2 + 1, y + 4, 1, 6);
    ctx.fillRect(gx2 + 4, y + 4, 1, 6);

    if (isFiring) {
      const puffR = elapsed < 8 ? 3 : 4;
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(mx1 + 11, my1, puffR, 3);
      ctx.fillRect(mx2 + 11, my2, puffR, 3);
      ctx.fillRect(gx1 + 8, y + 4, puffR, 2);
      ctx.fillRect(gx2 + 8, y + 5, puffR, 2);

      const shotProgress = Math.min(1, elapsed / 14);
      const shotX = Math.round(gx2 + 10 + shotProgress * 26);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(shotX, y + 2, 3, 1);
      ctx.fillRect(shotX - 3, y + 5, 3, 1);
      ctx.fillRect(shotX + 2, y + 7, 3, 1);
    }

    // Footed / Standing HBC Men (All hit & drop once!)
    const hbcPositions = [x + 96, x + 103, x + 110, x + 117];
    for (let i = 0; i < hbcPositions.length; i++) {
      const hx = hbcPositions[i];
      if (!isFallen) {
        ctx.fillStyle = isHit ? PAL.SNOW_LIGHT : PAL.HBC_COAT;
        ctx.fillRect(hx, y + 3, 4, 5);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 1, y + 8, 1, 3);
        ctx.fillRect(hx + 3, y + 8, 1, 3);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx, y, 4, 2);
        ctx.fillStyle = '#C98E63';
        ctx.fillRect(hx + 1, y + 2, 2, 1);
      } else {
        ctx.fillStyle = PAL.HBC_COAT;
        ctx.fillRect(hx - 1, y + 9, 6, 2);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 5, y + 9, 2, 2);
      }
    }

    // 3 Oaks to the immediate right of the animation (acting as scenic buffer)
    drawShadedPine(x + 128, y - 12, false, false);
    drawShadedPine(x + 140, y - 11, false, false);
    drawShadedPine(x + 152, y - 13, false, false);

    // Simple unboxed text above
    drawUnboxedLabel("Battle of Seven Oaks", x + 56, y - 18, false);
  }

  // Unique Historical Landmarks (All include unboxed common-name text above)
  function drawFortLandmark(x, y, type, showLabel = true, isSil = false) {
    if (type === 'ST_JOHNS_CHURCH') {
      // Early timber & stone parish church of St. John's
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x, y + 2, 24, 12);
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(x + 1, y + 3, 22, 10);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 1, y + 3, 22, 2);
      ctx.fillStyle = PAL.DARK_PINE;
      ctx.fillRect(x - 1, y, 26, 3);
      // Bell steeple on left gable
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 3, y - 6, 5, 6);
      fillPixelPoly([[x + 2, y - 6], [x + 5, y - 12], [x + 9, y - 6]], PAL.STONE_DARK);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 11, y + 6, 2, 4);
      ctx.fillRect(x + 16, y + 6, 2, 4);
      if (showLabel) drawUnboxedLabel("St Johns Church", x + 12, y - 15, false);
      return;
    }

    if (type === 'ST_ANDREWS_CHURCH') {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x, y + 1, 28, 13);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(x + 1, y + 2, 26, 11);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 1, y + 2, 26, 2);
      ctx.fillStyle = PAL.DARK_PINE;
      ctx.fillRect(x - 1, y - 1, 30, 3);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 5, y + 5, 2, 4);
      ctx.fillRect(x + 11, y + 5, 2, 4);
      ctx.fillRect(x + 17, y + 5, 2, 4);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 22, y - 6, 6, 20);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 23, y - 10, 4, 4);
      fillPixelPoly([[x + 22, y - 10], [x + 25, y - 17], [x + 28, y - 10]], PAL.STONE_DARK);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 25, y - 19, 1, 3);
      if (showLabel) drawUnboxedLabel("St Andrews on the Red", x + 14, y - 22, false);
      return;
    }

    if (type === 'LOWER_FORT_GARRY') {
      // Close to 3x the width of Upper Fort Garry (~96px wide limestone curtain walls, bastions & Big House)
      const fw = 96;
      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(x, y + 4, fw, 10);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(x + 1, y + 4, fw - 2, 8);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 1, y + 4, fw - 2, 2);

      // Interior Big House & Stone Warehouses peeking over curtain wall
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 22, y - 3, 24, 7);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x + 21, y - 5, 26, 2);
      ctx.fillStyle = PAL.STONE_LIGHT;
      ctx.fillRect(x + 58, y - 2, 20, 6);
      ctx.fillStyle = PAL.DARK_PINE;
      ctx.fillRect(x + 57, y - 4, 22, 2);

      // Corner & Mid Bastion Towers
      const bastions = [x - 2, x + 44, x + fw - 5];
      for (let b = 0; b < bastions.length; b++) {
        const bx = bastions[b];
        ctx.fillStyle = PAL.STONE_MID;
        ctx.fillRect(bx, y, 7, 14);
        ctx.fillStyle = PAL.MAROON_MID;
        ctx.fillRect(bx - 1, y - 2, 9, 2);
      }

      // Main River Gate & Flagpole
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 31, y + 7, 6, 7);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 34, y - 9, 1, 13);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 35, y - 9, 6, 3);
      if (showLabel) drawUnboxedLabel("Lower Fort Garry", x + Math.floor(fw / 2), y - 14, false);
      return;
    }

    if (type === 'FORT_BAS') {
      // Fort Bas de la Rivière: Timber palisade, log storehouses & busy Winnipeg River mouth
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x, y + 2, 44, 12);
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 1, y + 3, 42, 10);
      ctx.fillStyle = PAL.WOOD_MID;
      for (let px = 2; px < 41; px += 3) {
        ctx.fillRect(x + px, y + 2, 2, 11);
      }
      // Log storehouses inside
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 7, y - 2, 14, 6);
      ctx.fillRect(x + 24, y - 1, 13, 5);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x + 6, y - 4, 16, 2);
      ctx.fillRect(x + 23, y - 3, 15, 2);
      if (showLabel) drawUnboxedLabel("Fort Bas de la Rivière", x + 22, y - 10, false);
      return;
    }

    if (type === 'MANIGOTAGAN') {
      // Manigotagan (Bad Throat River rocky gorge mouth & small seasonal outpost)
      drawGraniteAndOchreOutcrop(x, y + 3, false);
      drawGraniteAndOchreOutcrop(x + 22, y + 3, false);
      // Small seasonal timber outpost nestled in the gorge
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 12, y + 1, 14, 8);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 13, y + 2, 12, 6);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x + 11, y - 1, 16, 2);
      if (showLabel) drawUnboxedLabel("Manigotagan", x + 19, y - 8, false);
      return;
    }

    if (type === 'BERENS_RIVER') {
      // Berens River House (Omaskosihk low-slung whitewashed log post, pelt press & rocky point — backlit silhouette!)
      const cWall = isSil ? PAL.SILHOUETTE : PAL.HIDE_LIGHT;
      const cRoof = isSil ? PAL.SILHOUETTE : PAL.MAROON_MID;
      const cRim = isSil ? PAL.SIL_RIM_BRIGHT : PAL.GOLD_LIGHT;
      drawGraniteAndOchreOutcrop(x - 4, y + 3, isSil);
      drawGraniteAndOchreOutcrop(x + 28, y + 3, isSil);

      // Low-slung whitewashed log post
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 4, y + 2, 26, 9);
      ctx.fillStyle = cWall;
      ctx.fillRect(x + 5, y + 3, 24, 7);
      ctx.fillStyle = cRoof;
      ctx.fillRect(x + 3, y, 28, 3);
      ctx.fillStyle = cRim;
      ctx.fillRect(x + 4, y, 26, 1);

      // Wooden pelt press frame beside post
      ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.WOOD_DARK;
      ctx.fillRect(x + 33, y + 1, 1, 9);
      ctx.fillRect(x + 38, y + 1, 1, 9);
      ctx.fillRect(x + 33, y + 2, 6, 2);
      if (showLabel) drawUnboxedLabel("Berens River House", x + 20, y - 8, isSil);
      return;
    }

    if (type === 'NORWAY_HOUSE') {
      // Norway House (Kinosao-sipi snow-covered whitewashed HBC warehouses with red roofs, wooden wharves & moored York boats)
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x, y, 52, 13);
      // Whitewashed HBC warehouses
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 2, y + 1, 22, 11);
      ctx.fillRect(x + 27, y + 2, 23, 10);
      // Red roofs with snow cover
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x + 1, y - 2, 24, 3);
      ctx.fillRect(x + 26, y - 1, 25, 3);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 1, y - 3, 24, 2);
      ctx.fillRect(x + 26, y - 2, 25, 2);
      // Flagpole & HBC ensign
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 25, y - 10, 1, 12);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 26, y - 10, 6, 3);
      // Wooden wharf & moored York boat at water edge
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(x + 8, y + 12, 34, 3);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 12, y + 14, 16, 3);
      if (showLabel) drawUnboxedLabel("Norway House", x + 26, y - 14, false);
      return;
    }

    if (type === 'YORK_FACTORY') {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x - 2, y - 4, 48, 18);
      ctx.fillStyle = PAL.HIDE_MID;
      ctx.fillRect(x, y - 2, 44, 15);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 1, y - 2, 42, 4);
      ctx.fillStyle = PAL.MAROON_MID;
      ctx.fillRect(x - 3, y - 5, 50, 3);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x - 1, y - 6, 22, 2);
      ctx.fillRect(x + 28, y - 6, 16, 2);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 18, y - 10, 8, 5);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 22, y - 15, 6, 3);
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 21, y - 15, 1, 6);
      ctx.fillStyle = PAL.INDIGO_DEEP;
      for (let wx = 4; wx <= 36; wx += 8) {
        ctx.fillRect(x + wx, y + 1, 3, 3);
        ctx.fillRect(x + wx, y + 7, 3, 3);
      }
      ctx.fillStyle = PAL.WOOD_DARK;
      ctx.fillRect(x + 19, y + 6, 6, 7);
      if (showLabel) drawUnboxedLabel("York Factory", x + 22, y - 18, false);
      return;
    }

    // Upper Fort Garry (Default Stone Fort)
    ctx.fillStyle = PAL.STONE_DARK;
    ctx.fillRect(x, y + 4, 34, 10);
    ctx.fillStyle = PAL.STONE_MID;
    ctx.fillRect(x + 1, y + 4, 32, 8);
    ctx.fillStyle = PAL.STONE_LIGHT;
    ctx.fillRect(x + 1, y + 4, 32, 2);

    ctx.fillStyle = PAL.STONE_MID;
    ctx.fillRect(x - 2, y, 7, 14);
    ctx.fillRect(x + 29, y, 7, 14);
    ctx.fillStyle = PAL.MAROON_MID;
    ctx.fillRect(x - 3, y - 2, 9, 2);
    ctx.fillRect(x + 28, y - 2, 9, 2);

    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 14, y + 7, 6, 7);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 16, y - 6, 1, 10);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(x + 17, y - 6, 5, 3);
    if (showLabel) drawUnboxedLabel("Upper Fort Garry", x + 17, y - 10, false);
  }

  // Near-Bank (Bottom Shoreline) Unique Features:
  // - St. Peter's Dynevor (just the backside of the steeple rendered on the close side of the riverbank + unboxed text)
  // - Brokenhead River mouth (non-navigable tributary opening along the bottom bank midway through Mouth -> Fort Bas)
  function drawNearBankLandmark(lm, bottomBankY) {
    const x = Math.round(lm.x);
    if (lm.type === 'ST_PETERS_DYNEVOR') {
      // Backside of the church gable & stone tower steeple rising from the near riverbank
      const sy = bottomBankY - 12;
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 2, sy + 6, 22, 12);
      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(x + 3, sy + 7, 20, 11);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(x + 4, sy + 7, 18, 3);

      // Rear steeple tower & pointed spire
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 9, sy - 4, 8, 12);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(x + 10, sy - 3, 6, 11);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 11, sy - 7, 4, 4);
      fillPixelPoly([
        [x + 10, sy - 7],
        [x + 13, sy - 15],
        [x + 16, sy - 7]
      ], PAL.STONE_DARK);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(x + 13, sy - 17, 1, 3);

      drawUnboxedLabel("St. Peter's Dynevor", x + 13, sy - 20, false);
    } else if (lm.type === 'BROKENHEAD_MOUTH') {
      // Non-navigable mouth of the Brokenhead River opening along the bottom bank
      fillPixelPoly([
        [x, bottomBankY],
        [x + 34, bottomBankY],
        [x + 26, VIEW_H],
        [x + 8, VIEW_H]
      ], PAL.LAKE_DEEP);
      fillPixelPoly([
        [x - 2, bottomBankY],
        [x + 2, bottomBankY],
        [x + 10, VIEW_H],
        [x + 6, VIEW_H]
      ], PAL.LAKE_FOAM);
      fillPixelPoly([
        [x + 32, bottomBankY],
        [x + 36, bottomBankY],
        [x + 28, VIEW_H],
        [x + 24, VIEW_H]
      ], PAL.LAKE_FOAM);
      drawMarshReeds(x - 8, bottomBankY - 5);
      drawMarshReeds(x + 36, bottomBankY - 5);
    }
  }

  // ==========================================
  // 7. VARIABLE-LENGTH MEANDERS, ISLAND CHUTE VS. LOG JAM, & WAVES
  // ==========================================
  function resetWorld() {
    riverFeatures = [];
    hazards = [];
    landmarks = [];
    nearBankLandmarks = [];
    spawnedFlags = {};
    lakeWaveArmed = false;
    awaitingOpeningConfirm = false;
    isDeployingSled = false;
    deployProgress = 0;
    isSledMode = false;
    lastFeatureType = 'NONE';

    // Upper Fort Garry at the start
    landmarks.push({ x: 38, type: 'UPPER_FORT' });
    spawnedFlags.UPPER_FORT = true;

    nextFeatureX = VIEW_W + 90;
    nextDeepWaveX = 99999;
  }

  function spawnIslandShorelineLogJams(islandX, islandW, chuteSide) {
    const slowSideLane = chuteSide === 0 ? 2 : 0;
    const jamCount = islandW >= 150 ? 2 : 1;
    for (let j = 0; j < jamCount; j++) {
      const ratio = jamCount === 1 ? 0.50 : (0.32 + j * 0.38);
      hazards.push({
        x: islandX + Math.floor(islandW * ratio),
        lane: slowSideLane,
        type: 'LOG_JAM',
        halfOffset: 0,
        triggered: false
      });
    }
  }

  function scheduleNextRiverFeature() {
    if (score >= 3640 && score < 3890) {
      nextFeatureX += 90;
      return;
    }

    // --- Unique Historical Landmarks Along the Voyage ---
    // 1. St Johns Church (~score 135)
    if (!spawnedFlags.ST_JOHNS && score >= 135) {
      landmarks.push({ x: VIEW_W + 30, type: 'ST_JOHNS_CHURCH' });
      spawnedFlags.ST_JOHNS = true;
    }
    // 2. Battle of Seven Oaks (~score 285, with 4 oaks left & 3 oaks right buffer)
    if (!spawnedFlags.SEVEN_OAKS && score >= 285) {
      landmarks.push({ x: VIEW_W + 60, type: 'SEVEN_OAKS', triggered: false, triggerFrame: 0 });
      spawnedFlags.SEVEN_OAKS = true;
    }
    // 3. St Andrews on the Red (after meandering settler farm stretch, ~score 650)
    if (!spawnedFlags.ST_ANDREWS && score >= 650) {
      landmarks.push({ x: VIEW_W + 35, type: 'ST_ANDREWS_CHURCH' });
      spawnedFlags.ST_ANDREWS = true;
    }
    // 4. Lower Fort Garry (3x width stone fort, keeping same spacing from St Andrews, ~score 810)
    if (!spawnedFlags.LOWER_FORT && score >= 810) {
      landmarks.push({ x: VIEW_W + 40, type: 'LOWER_FORT_GARRY' });
      spawnedFlags.LOWER_FORT = true;
    }
    // 5. Sugar Island Rapids (signals start of St. Peter's section, ~score 1140)
    if (!spawnedFlags.SUGAR_ISLAND && score >= 1140) {
      spawnedFlags.SUGAR_ISLAND = true;
      const w = 175;
      const taperW = 48;
      const chuteSide = 0;
      riverFeatures.push({
        x: nextFeatureX,
        w: w,
        taperW: taperW,
        type: 'ISLAND',
        depthFactor: 1.0,
        chuteLane: chuteSide,
        isSugarIsland: true,
        isMarshIsland: false
      });
      spawnIslandShorelineLogJams(nextFeatureX, w, chuteSide);
      lastFeatureType = 'ISLAND';
      nextFeatureX += w + 145;
      return;
    }
    // 6. St. Peter's Dynevor (backside of steeple on the near/bottom riverbank, ~score 1360)
    if (!spawnedFlags.ST_PETERS_DYNEVOR && score >= 1360) {
      nearBankLandmarks.push({ x: VIEW_W + 35, type: 'ST_PETERS_DYNEVOR' });
      spawnedFlags.ST_PETERS_DYNEVOR = true;
    }
    // 7. Brokenhead River Mouth (non-navigable mouth along bottom bank midway through Mouth -> Fort Bas, ~score 1790)
    if (!spawnedFlags.BROKENHEAD && score >= 1790) {
      nearBankLandmarks.push({ x: VIEW_W + 35, type: 'BROKENHEAD_MOUTH' });
      spawnedFlags.BROKENHEAD = true;
    }
    // 8. Fort Bas de la Rivière (end of shortest lake leg, ~score 1910)
    if (!spawnedFlags.FORT_BAS && score >= 1910) {
      landmarks.push({ x: VIEW_W + 35, type: 'FORT_BAS' });
      spawnedFlags.FORT_BAS = true;
    }
    // 9. Manigotagan (~score 2320)
    if (!spawnedFlags.MANIGOTAGAN && score >= 2320) {
      landmarks.push({ x: VIEW_W + 35, type: 'MANIGOTAGAN' });
      spawnedFlags.MANIGOTAGAN = true;
    }
    // 10. Berens River House (~score 3010, backlit silhouette)
    if (!spawnedFlags.BERENS && score >= 3010) {
      landmarks.push({ x: VIEW_W + 35, type: 'BERENS_RIVER' });
      spawnedFlags.BERENS = true;
    }
    // 11. Norway House (bright winter daylit post triggering dogsled transition, ~score 3700)
    if (!spawnedFlags.NORWAY_HOUSE && score >= 3700) {
      landmarks.push({ x: VIEW_W + 35, type: 'NORWAY_HOUSE' });
      spawnedFlags.NORWAY_HOUSE = true;
    }

    const isRedRiver = (score < DIST.SETTLER_FARMS_END);
    const isStPeters = (score >= DIST.SETTLER_FARMS_END && score < DIST.ST_PETERS_END);
    const isMouthOpening = (score >= DIST.MOUTH_OPEN_START - 40 && score < DIST.ST_PETERS_END);
    const isLakeEastShore = (score >= DIST.ST_PETERS_END && score < DIST.DEPLOY_END);
    const isWinter = (score >= DIST.DEPLOY_END);

    let chosen = 'TOP_MEANDER';
    let depthFactor = 1.0;
    let gapAfter = 145;
    let isMarshIsland = false;

    if (isRedRiver) {
      chosen = lastFeatureType === 'TOP_MEANDER' ? 'BOT_MEANDER' : 'TOP_MEANDER';
      depthFactor = Math.random() < 0.55 ? 0.5 : 1.0;
      gapAfter = 180;
    } else if (isStPeters) {
      const pool = isMouthOpening
        ? ['ISLAND', 'BOT_MEANDER']
        : ['ISLAND', 'ISLAND', 'BOT_MEANDER', 'TOP_MEANDER'];
      chosen = pool[Math.floor(Math.random() * pool.length)];
      isMarshIsland = (chosen === 'ISLAND');
      depthFactor = chosen === 'ISLAND' ? 1.0 : 0.5;
      gapAfter = 125;
    } else if (isLakeEastShore) {
      // East Shore of Lake Winnipeg: Top track (Lane 0) is open lake; bottom track (Lane 2) has shoreline points + islands
      const pool = ['BOT_MEANDER', 'BOT_MEANDER', 'ISLAND'];
      chosen = pool[Math.floor(Math.random() * pool.length)];
      if (lastFeatureType === 'ISLAND' && chosen === 'ISLAND') chosen = 'BOT_MEANDER';
      depthFactor = chosen === 'ISLAND' ? 1.0 : (Math.random() < 0.52 ? 0.5 : 1.0);
      gapAfter = 145;
    } else {
      // Boreal Winter Dogsled Trail (3870 - 5000)
      const pool = ['TOP_MEANDER', 'BOT_MEANDER', 'ISLAND'];
      chosen = pool[Math.floor(Math.random() * pool.length)];
      if (chosen === lastFeatureType && chosen !== 'ISLAND') {
        chosen = chosen === 'TOP_MEANDER' ? 'BOT_MEANDER' : 'TOP_MEANDER';
      }
      depthFactor = chosen === 'ISLAND' ? 1.0 : (Math.random() < 0.5 ? 0.5 : 1.0);
      gapAfter = 145;
    }

    let tileCount;
    if (chosen === 'ISLAND') {
      tileCount = isMarshIsland ? (7 + Math.floor(Math.random() * 5)) : (9 + Math.floor(Math.random() * 6));
    } else {
      tileCount = 6 + Math.floor(Math.random() * 30);
    }

    const w = tileCount * TILE_PX;
    const taperW = Math.min(48, Math.floor(w * 0.32));
    const chuteSide = (!isWinter && chosen === 'ISLAND') ? (Math.random() < 0.72 ? 0 : 2) : -1;

    riverFeatures.push({
      x: nextFeatureX,
      w: w,
      taperW: taperW,
      type: chosen,
      depthFactor: depthFactor,
      chuteLane: chuteSide,
      isSugarIsland: false,
      isMarshIsland: isMarshIsland
    });
    lastFeatureType = chosen;

    if (!isWinter) {
      if (chosen === 'ISLAND' && chuteSide !== -1) {
        spawnIslandShorelineLogJams(nextFeatureX, w, chuteSide);
      }

      if ((chosen === 'TOP_MEANDER' || chosen === 'BOT_MEANDER') && Math.random() < 0.52) {
        const jamLane = chosen === 'TOP_MEANDER'
          ? (depthFactor === 0.5 ? 0 : 1)
          : (depthFactor === 0.5 ? 2 : 1);
        hazards.push({
          x: nextFeatureX + Math.floor(taperW * 0.55),
          lane: jamLane,
          type: 'LOG_JAM',
          halfOffset: 0,
          triggered: false
        });
      }

      if (isRedRiver && Math.random() < 0.42) {
        const centerX = nextFeatureX + w + Math.floor(gapAfter * 0.46);
        hazards.push({
          x: centerX,
          lane: 1,
          type: Math.random() < 0.28 ? 'ROCK_CLUSTER' : 'LOG_JAM',
          halfOffset: 0,
          triggered: false
        });
      }

      if (depthFactor === 0.5 && chosen === 'BOT_MEANDER') {
        if (Math.random() < 0.35) {
          hazards.push({
            x: nextFeatureX + Math.floor(w * 0.45),
            lane: 2,
            type: 'ROCK_CLUSTER',
            halfOffset: -1,
            triggered: false
          });
        }
      } else if (isLakeEastShore) {
        if (Math.random() < 0.42) {
          const gapRockX = nextFeatureX + w + Math.floor(gapAfter * 0.48);
          const shoalLane = Math.random() < 0.55 ? 2 : 1;
          hazards.push({
            x: gapRockX,
            lane: shoalLane,
            type: 'ROCK_CLUSTER',
            halfOffset: 0,
            triggered: false
          });
        }
      } else if (!isRedRiver && Math.random() < 0.16) {
        const obsX = nextFeatureX + w + Math.floor(gapAfter * 0.48);
        const isRock = Math.random() < 0.35;
        const obsLane = isRock ? (Math.random() < 0.5 ? 1 : 2) : Math.floor(Math.random() * 3);
        hazards.push({
          x: obsX,
          lane: obsLane,
          type: isRock ? 'ROCK_CLUSTER' : 'LOG_JAM',
          halfOffset: 0,
          triggered: false
        });
      }
    } else {
      const obsX = nextFeatureX + w + Math.floor(gapAfter * 0.48);
      const obsLane = Math.floor(Math.random() * 3);
      if (Math.random() < 0.65) {
        hazards.push({
          x: obsX,
          lane: obsLane,
          type: Math.random() < 0.52 ? 'SNOW_DRIFT' : 'ICE_PATCH',
          halfOffset: 0,
          triggered: false
        });
      }

      if (depthFactor === 0.5 && (chosen === 'TOP_MEANDER' || chosen === 'BOT_MEANDER') && Math.random() < 0.60) {
        const shelfLane = chosen === 'TOP_MEANDER' ? 0 : 2;
        hazards.push({
          x: nextFeatureX + Math.floor(w * 0.48),
          lane: shelfLane,
          type: Math.random() < 0.5 ? 'SNOW_DRIFT' : 'ICE_PATCH',
          halfOffset: chosen === 'TOP_MEANDER' ? 1 : -1,
          triggered: false
        });
      }
    }

    nextFeatureX += w + gapAfter;
  }

  function scheduleDeepLakeWaves() {
    // No large waves during Mouth of Lake Winnipeg -> Fort Bas de la Rivière (1650 - 1950);
    // Waves are introduced starting in the Fort Bas -> Manigotagan leg (score >= 2020)!
    if (score < DIST.MOUTH_BAS_END + 70 || score >= DIST.LAKE_CLOSE_START - 40) return;

    if (!lakeWaveArmed) {
      lakeWaveArmed = true;
      nextDeepWaveX = VIEW_W + 90;
    }

    if (nextDeepWaveX <= VIEW_W + 90) {
      hazards.push({
        x: nextDeepWaveX,
        lane: 0,
        type: 'BIG_WAVE',
        halfOffset: 0,
        triggered: false,
        passSoundPlayed: false
      });
      playWaveWarningSound();
      nextDeepWaveX += 560 + Math.floor(Math.random() * 340);
    }
  }

  function fillPixelPoly(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(Math.round(pts[0][0]), Math.round(pts[0][1]));
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(Math.round(pts[i][0]), Math.round(pts[i][1]));
    }
    ctx.closePath();
    ctx.fill();
  }

  // Smooth Parallax Scenery Transition Helper:
  // Computes a 0..1 visibility weight for each regional scenery set with generous fade/dead-space buffers
  // so no background prop set ever pops or switches abruptly on-screen!
  function getRegionSceneryWeight(startScore, endScore, fadeSpan = 75) {
    if (score < startScore || score > endScore) return 0;
    const inW = Math.min(1, (score - startScore) / fadeSpan);
    const outW = Math.min(1, (endScore - score) / fadeSpan);
    return Math.min(inW, outW);
  }

  // ==========================================
  // 8. MAIN RENDERING PIPELINE
  // ==========================================
  function drawScene() {
    if (gameMode === 'TITLE') {
      drawTitleCardScreen();
      return;
    }
    if (gameMode === 'OPENING_CUTSCENE') {
      drawOpeningCutscene();
      return;
    }
    if (gameMode === 'CLOSING_CUTSCENE') {
      drawClosingCutscene();
      return;
    }

    const env = getEnvColors();
    if (titleDisplay.innerText !== env.title) {
      titleDisplay.innerText = env.title;
    }

    const hudH = 36;
    const playTop = hudH;
    const playH = VIEW_H - hudH;
    const isWinter = isSledMode || score >= DIST.DEPLOY_END;
    const silT = getSilhouetteFactor();
    const isSil = silT > 0.55;

    // 1. Mouth opening of Lake Winnipeg (1510 -> 1650: 0 -> 1)
    const mouthOpenT = score < 1510
      ? 0
      : Math.min(1, (score - 1510) / (DIST.ST_PETERS_END - 1510));

    // 2. Natural North Shore lake closing (3630 -> 3750: 0 -> 1)
    const lakeCloseT = score < 3630
      ? 0
      : Math.min(1, (score - 3630) / (DIST.NORWAY_HOUSE_END - 3630));

    const lakeOpenFactor = Math.max(0, mouthOpenT * (1 - lakeCloseT));
    const isLakeOpen = lakeOpenFactor >= 1;

    const horizonY = playTop + Math.floor(playH * 0.21);
    const northBankH = Math.round(14 * (1 - lakeOpenFactor));
    const riverTopY = horizonY + northBankH;
    const bottomShoreH = Math.round(12 * mouthOpenT);
    const riverH = VIEW_H - riverTopY - bottomShoreH;
    const laneH = Math.floor(riverH / 3);

    const targetPlayerY = riverTopY + playerLane * laneH + Math.floor((laneH - 15) / 2);
    if (playerVisualY === 0) playerVisualY = targetPlayerY;
    playerVisualY += (targetPlayerY - playerVisualY) * 0.24;

    ctx.save();
    if (shakeTimer > 0) {
      const sx = (Math.random() - 0.5) * 3;
      const sy = (Math.random() - 0.5) * 3;
      ctx.translate(Math.round(sx), Math.round(sy));
    }

    // 1. Shaded Sky Band
    ctx.fillStyle = env.skyTop;
    ctx.fillRect(0, 0, VIEW_W, horizonY);
    ctx.fillStyle = env.skyBot;
    ctx.fillRect(0, Math.floor(horizonY * 0.55), VIEW_W, horizonY);

    // DKC Tropical Freeze-Style Backlit Sun / Moon Disc during Sunset & Midnight Silhouette Leg
    if (score >= DIST.MANIGOTAGAN_END + 140 && score < DIST.NORWAY_HOUSE_END) {
      const celestT = Math.min(1, (score - (DIST.MANIGOTAGAN_END + 140)) / 240);
      const dawnFade = score >= 3550 ? Math.max(0, 1 - (score - 3550) / 200) : 1;
      const alpha = celestT * dawnFade;
      if (alpha > 0.05) {
        const moonX = Math.floor(VIEW_W * 0.72);
        const moonY = playTop + 12;
        ctx.fillStyle = silT > 0.5
          ? `rgba(165, 155, 235, ${(alpha * 0.28).toFixed(2)})`
          : `rgba(245, 165, 95, ${(alpha * 0.30).toFixed(2)})`;
        ctx.fillRect(moonX - 14, moonY - 8, 36, 26);
        ctx.fillStyle = silT > 0.5
          ? `rgba(235, 232, 255, ${(alpha * 0.88).toFixed(2)})`
          : `rgba(255, 224, 150, ${(alpha * 0.88).toFixed(2)})`;
        ctx.fillRect(moonX - 4, moonY - 2, 16, 14);
        ctx.fillRect(moonX - 2, moonY - 4, 12, 18);
      }
    }

    const cloudOff = (bgOffset * 0.12) % 180;
    ctx.fillStyle = silT > 0.4 ? '#281D4D' : '#FFFFFF';
    for (let cx = -180; cx < VIEW_W + 180; cx += 180) {
      ctx.fillRect(Math.round(cx - cloudOff + 24), playTop + 5, 28, 3);
      ctx.fillRect(Math.round(cx - cloudOff + 30), playTop + 3, 16, 2);
    }

    // 2. Riverbank Horizon with Smooth Dead-Space / Tapered Transitions Between Repeating Backgrounds
    if (!isLakeOpen) {
      let bankStartX = 0;
      let bankWidth = VIEW_W;
      if (mouthOpenT > 0 && mouthOpenT < 1) {
        bankStartX = 0;
        bankWidth = Math.round(VIEW_W * (1 - mouthOpenT));
      } else if (lakeCloseT > 0 && lakeCloseT < 1) {
        bankWidth = Math.round(VIEW_W * lakeCloseT);
        bankStartX = VIEW_W - bankWidth;
      }

      if (bankWidth > 0 && northBankH > 0) {
        ctx.fillStyle = env.gndTop;
        ctx.fillRect(bankStartX, horizonY, bankWidth, Math.min(5, northBankH));
        if (northBankH > 5) {
          ctx.fillStyle = env.gndMid;
          ctx.fillRect(bankStartX, horizonY + 5, bankWidth, Math.min(5, northBankH - 5));
        }
        if (northBankH > 10) {
          ctx.fillStyle = env.gndDark;
          ctx.fillRect(bankStartX, horizonY + 10, bankWidth, northBankH - 10);
        }
      }

      ctx.fillStyle = env.watFoam;
      if (bankStartX > 0) ctx.fillRect(0, horizonY, bankStartX, 1);
      if (bankStartX + bankWidth < VIEW_W) ctx.fillRect(bankStartX + bankWidth, horizonY, VIEW_W - (bankStartX + bankWidth), 1);

      if (score >= 3630) {
        const propSpacing = 180;
        const propOff = (bgOffset * 0.38) % propSpacing;
        for (let px = -propSpacing; px < VIEW_W + propSpacing; px += propSpacing) {
          const baseX = Math.round(px - propOff);
          if (baseX >= bankStartX && baseX <= bankStartX + bankWidth - 14) {
            drawEasternCedar(baseX + 12, horizonY - 11, true, false);
            drawShieldOutcrop(baseX + 46, horizonY - 3, true, false);
            drawShadedPine(baseX + 86, horizonY - 11, true, false);
          }
        }
      } else {
        // Non-overlapping regional scenery bands with dead-space buffers so backgrounds never switch abruptly!
        const wPrairie = getRegionSceneryWeight(0, 395, 55);         // 0 - 395: Golden prairie, buffalo & tipis
        const wSettler = getRegionSceneryWeight(465, 1105, 65);      // 465 - 1105: Selkirk settler log houses & model farms
        const wStPeters = getRegionSceneryWeight(1185, 1560, 65);    // 1185 - 1560: St. Peter's wigwams, wolf campfire & marsh reeds

        const propSpacing = 250;
        const propOff = (bgOffset * 0.38) % propSpacing;
        for (let px = -propSpacing; px < bankWidth + propSpacing; px += propSpacing) {
          const baseX = Math.round(px - propOff);
          if (baseX > bankWidth - 14) continue;
          const worldTileIdx = Math.floor((px + bgOffset * 0.38) / propSpacing);

          if (wPrairie > 0.05) {
            ctx.save();
            ctx.globalAlpha = wPrairie;
            drawShadedPine(baseX + 18, horizonY - 11, false, false);
            drawShadedBuffalo(baseX + 68, horizonY, false);
            drawShadedBuffalo(baseX + 82, horizonY + 2, false);
            drawShadedTipi(baseX + 135, horizonY - 8);
            drawShadedPine(baseX + 190, horizonY - 11, false, false);
            ctx.restore();
          } else if (wSettler > 0.05) {
            ctx.save();
            ctx.globalAlpha = wSettler;
            drawShadedPine(baseX + 14, horizonY - 11, false, false);
            drawSettlerLogHouse(baseX + 42, horizonY - 6);
            drawSettlerModelFarm(baseX + 74, horizonY - 3);
            drawShadedPine(baseX + 118, horizonY - 12, false, false);
            drawSettlerLogHouse(baseX + 148, horizonY - 6);
            drawSettlerModelFarm(baseX + 182, horizonY - 3);
            ctx.restore();
          } else if (wStPeters > 0.05) {
            ctx.save();
            ctx.globalAlpha = wStPeters;
            drawMarshReeds(baseX + 10, horizonY - 4);
            drawMarshReeds(baseX + 28, horizonY - 3);
            drawShadedPine(baseX + 52, horizonY - 11, false, false);
            if (Math.abs(worldTileIdx) % 2 === 0) {
              drawWigwamLodge(baseX + 82, horizonY - 6);
            } else {
              drawMarshReeds(baseX + 84, horizonY - 3);
            }
            drawMarshReeds(baseX + 116, horizonY - 4);
            if (Math.abs(worldTileIdx) % 3 === 1) {
              drawWolfCampfire(baseX + 142, horizonY - 2, frame);
            } else {
              drawMarshReeds(baseX + 144, horizonY - 3);
            }
            drawShadedPine(baseX + 182, horizonY - 11, false, false);
            drawMarshReeds(baseX + 206, horizonY - 4);
            ctx.restore();
          }
        }
      }

      // Unique One-Off Landmarks (Red River Leg)
      for (let i = 0; i < landmarks.length; i++) {
        const lm = landmarks[i];
        if (lm.type === 'SEVEN_OAKS') {
          drawBattleOfSevenOaks(lm, horizonY - 2, frame);
        } else {
          drawFortLandmark(Math.round(lm.x), horizonY - 10, lm.type, true, false);
        }
      }
    } else {
      // Open Lake Winnipeg & Boreal Winter Horizon
      ctx.fillStyle = env.watFoam;
      ctx.fillRect(0, horizonY, VIEW_W, 1);

      if (isWinter) {
        ctx.fillStyle = env.gndTop;
        ctx.fillRect(0, horizonY, VIEW_W, 3);
        ctx.fillStyle = env.gndMid;
        ctx.fillRect(0, horizonY + 3, VIEW_W, 3);

        const propSpacing = 230;
        const propOff = (bgOffset * 0.38) % propSpacing;
        for (let px = -propSpacing; px < VIEW_W + propSpacing; px += propSpacing) {
          const baseX = Math.round(px - propOff);
          const worldTileIdx = Math.floor((px + bgOffset * 0.38) / propSpacing);

          drawEasternCedar(baseX + 10, horizonY - 11, true, false);
          drawShadedPine(baseX + 36, horizonY - 11, true, false);
          drawShieldOutcrop(baseX + 64, horizonY - 3, true, false);
          drawEasternCedar(baseX + 96, horizonY - 12, true, false);
          drawShadedPine(baseX + 124, horizonY - 11, true, false);

          if (Math.abs(worldTileIdx) % 3 === 1) {
            drawSnowTipi(baseX + 152, horizonY - 9);
          } else {
            drawEasternCedar(baseX + 154, horizonY - 11, true, false);
          }
          drawShadedPine(baseX + 188, horizonY - 12, true, false);
        }
      } else {
        const waveOff = (bgOffset * 0.25) % 60;
        for (let wx = -60; wx < VIEW_W + 60; wx += 60) {
          ctx.fillRect(Math.round(wx - waveOff + 12), horizonY + 3, 10, 1);
        }
      }

      // Unique One-Off Landmarks along East Shore of Lake Winnipeg (Fort Bas, Manigotagan, Berens River House, Norway House)
      for (let i = 0; i < landmarks.length; i++) {
        const lm = landmarks[i];
        drawFortLandmark(Math.round(lm.x), horizonY - 10, lm.type, true, isSil);
      }
    }

    // 3. Unified Water / Frozen Ice Body
    ctx.fillStyle = env.watDeep;
    ctx.fillRect(0, riverTopY, VIEW_W, VIEW_H - riverTopY);

    // Moonlit / Sunset Backlit Reflection Path across Lake Winnipeg
    if (silT > 0.05) {
      const moonX = Math.floor(VIEW_W * 0.72);
      ctx.fillStyle = `rgba(165, 175, 240, ${(silT * 0.30).toFixed(2)})`;
      for (let ry = riverTopY + 3; ry < VIEW_H - bottomShoreH - 2; ry += 5) {
        const shimmerW = 12 + Math.round(Math.sin((ry + frame * 0.2) * 0.5) * 7);
        const shimmerX = moonX - Math.floor(shimmerW / 2) + Math.round(Math.cos(ry * 0.4 + frame * 0.08) * 3);
        ctx.fillRect(shimmerX, ry, shimmerW, 2);
      }
    }

    ctx.fillStyle = env.watMid;
    ctx.fillRect(0, riverTopY, VIEW_W, 6);
    if (bottomShoreH > 0) {
      ctx.fillRect(0, VIEW_H - bottomShoreH - 6, VIEW_W, 6);
    }
    ctx.fillStyle = env.watFoam;
    ctx.fillRect(0, riverTopY, VIEW_W, 1);

    if (!isWinter) {
      const flowCount = Math.ceil(VIEW_W / 32) + 2;
      for (let i = 0; i < flowCount; i++) {
        const spdMult = 0.52 + (i % 3) * 0.08;
        const fx = Math.round(((bgOffset * spdMult) + i * 34) % (VIEW_W + 40)) - 20;
        const baseBandY = riverTopY + 5 + ((i * 19) % Math.max(12, riverH - 10));
        const waveY = Math.round(Math.sin((fx + bgOffset * 0.2) * 0.045) * 2);

        ctx.fillStyle = env.watMid;
        ctx.fillRect(fx - 3, baseBandY + waveY, 22, 2);
        ctx.fillStyle = env.watFoam;
        ctx.fillRect(fx, baseBandY + waveY, 9, 1);
      }

      // Drifting lily pad clusters during Mouth of Lake Winnipeg -> Fort Bas de la Rivière (1650 - 1950)
      if (score >= DIST.ST_PETERS_END && score < DIST.MOUTH_BAS_END) {
        const lilySpacing = 120;
        const lilyOff = (bgOffset * 0.65) % lilySpacing;
        for (let lx = -lilySpacing; lx < VIEW_W + lilySpacing; lx += lilySpacing) {
          const px = Math.round(lx - lilyOff + 40);
          const py = riverTopY + riverH - 18;
          ctx.fillStyle = PAL.MARSH_MID;
          ctx.fillRect(px, py, 5, 2);
          ctx.fillRect(px + 7, py + 2, 4, 2);
          ctx.fillStyle = PAL.SNOW_LIGHT;
          ctx.fillRect(px + 2, py - 1, 1, 1); // Lily blossom
        }
      }
    } else {
      ctx.fillStyle = PAL.SNOW_LIGHT;
      const crackSpacing = 95;
      const crackOff = bgOffset % crackSpacing;
      for (let cx = -crackSpacing; cx < VIEW_W + crackSpacing; cx += crackSpacing) {
        const ix = Math.round(cx - crackOff);
        ctx.fillRect(ix + 14, riverTopY + Math.floor(laneH * 0.6), 12, 1);
        ctx.fillRect(ix + 26, riverTopY + Math.floor(laneH * 0.6) + 1, 7, 1);
        ctx.fillRect(ix + 48, riverTopY + Math.floor(laneH * 2.2), 14, 1);
      }
    }

    // Continuous Bottom Shoreline Strip & Smooth Regional East-Shore Scenery (1650 - 3750)
    if (bottomShoreH > 0) {
      const sy = VIEW_H - bottomShoreH;
      ctx.fillStyle = env.watFoam;
      ctx.fillRect(0, sy - 1, VIEW_W, 1);
      ctx.fillStyle = env.gndTop;
      ctx.fillRect(0, sy, VIEW_W, Math.min(4, bottomShoreH));
      if (bottomShoreH > 4) {
        ctx.fillStyle = env.gndMid;
        ctx.fillRect(0, sy + 4, VIEW_W, Math.min(4, bottomShoreH - 4));
      }
      if (bottomShoreH > 8) {
        ctx.fillStyle = env.gndDark;
        ctx.fillRect(0, sy + 8, VIEW_W, bottomShoreH - 8);
      }

      // Smoothly faded East-Shore bottom-bank background art with dead-space buffers between sections:
      // 1. Mouth -> Fort Bas (1650 - 1900): Cattails, bulrushes, muddy banks, pulled-up canoes & fish traps
      // 2. Fort Bas -> Manigotagan (1980 - 2310): Sandy beach points, dispersed birchbark lodges & smoke, fish-drying racks, driftwood & jack pines
      // 3. Manigotagan -> Berens River (2390 - 2990): Rounded pink/grey Canadian Shield granite rocks, wind-swept pine silhouettes & red-ochre outcrops
      // 4. Berens River -> Norway House (3070 - 3670): Low mossy clay banks, dense black spruce tips, granite reefs & voyageur cordwood piles
      const wLeg1 = getRegionSceneryWeight(1650, 1900, 45);
      const wLeg2 = getRegionSceneryWeight(1980, 2310, 55);
      const wLeg3 = getRegionSceneryWeight(2390, 2990, 65);
      const wLeg4 = getRegionSceneryWeight(3070, 3670, 65);

      const shoreSpacing = 220;
      const shoreOff = (bgOffset * 0.85) % shoreSpacing;
      for (let sx = -shoreSpacing; sx < VIEW_W + shoreSpacing; sx += shoreSpacing) {
        const bx = Math.round(sx - shoreOff);

        if (wLeg1 > 0.05) {
          ctx.save();
          ctx.globalAlpha = wLeg1;
          drawMarshReeds(bx + 12, sy - 6);
          drawPulledUpCanoeAndTrap(bx + 36, sy - 5);
          drawMarshReeds(bx + 76, sy - 6);
          drawMarshReeds(bx + 114, sy - 5);
          drawPulledUpCanoeAndTrap(bx + 144, sy - 5);
          ctx.restore();
        } else if (wLeg2 > 0.05) {
          ctx.save();
          ctx.globalAlpha = wLeg2;
          drawBirchbarkLodgeAndRack(bx + 14, sy - 8);
          // Driftwood log on sandy beach
          ctx.fillStyle = PAL.WOOD_LIGHT;
          ctx.fillRect(bx + 56, sy - 1, 14, 2);
          drawWindsweptPine(bx + 84, sy - 11, false);
          drawBirchbarkLodgeAndRack(bx + 122, sy - 8);
          drawWindsweptPine(bx + 168, sy - 11, false);
          ctx.restore();
        } else if (wLeg3 > 0.05) {
          ctx.save();
          ctx.globalAlpha = wLeg3;
          drawGraniteAndOchreOutcrop(bx + 14, sy - 6, isSil);
          drawWindsweptPine(bx + 48, sy - 11, isSil);
          drawGraniteAndOchreOutcrop(bx + 82, sy - 6, isSil);
          drawWindsweptPine(bx + 120, sy - 11, isSil);
          drawGraniteAndOchreOutcrop(bx + 156, sy - 6, isSil);
          ctx.restore();
        } else if (wLeg4 > 0.05) {
          const isSnowShore = score >= 3520;
          ctx.save();
          ctx.globalAlpha = wLeg4;
          drawBlackSpruceAndCordwood(bx + 14, sy - 8, isSil, isSnowShore);
          drawShieldOutcrop(bx + 54, sy - 5, isSnowShore, isSil);
          drawBlackSpruceAndCordwood(bx + 92, sy - 8, isSil, isSnowShore);
          drawShieldOutcrop(bx + 134, sy - 5, isSnowShore, isSil);
          drawBlackSpruceAndCordwood(bx + 168, sy - 8, isSil, isSnowShore);
          ctx.restore();
        }
      }

      // Near-bank unique features (St. Peter's Dynevor backside steeple & Brokenhead River mouth)
      for (let i = 0; i < nearBankLandmarks.length; i++) {
        drawNearBankLandmark(nearBankLandmarks[i], sy);
      }
    }

    // 4. Long Variable-Length Tapered Meandering Riverbanks & Forked Islands
    for (let i = 0; i < riverFeatures.length; i++) {
      const f = riverFeatures[i];
      const x0 = f.x;
      const x1 = f.x + f.taperW;
      const x2 = f.x + f.w - f.taperW;
      const x3 = f.x + f.w;
      const reachH = Math.round(laneH * f.depthFactor);

      if (f.type === 'TOP_MEANDER') {
        const topY = riverTopY;
        const botY = riverTopY + reachH;

        fillPixelPoly([[x0 - 3, topY],[x1, botY + 2],[x2, botY + 2],[x3 + 3, topY]], env.watFoam);
        fillPixelPoly([[x0, topY],[x1 + 2, botY],[x2 - 2, botY],[x3, topY]], isWinter ? PAL.SNOW_DARK : PAL.SAND_MID);
        fillPixelPoly([[x0 + 5, topY],[x1 + 5, botY - 2],[x2 - 5, botY - 2],[x3 - 5, topY]], env.gndMid);

        if (f.depthFactor >= 1.0) {
          fillPixelPoly([[x0 + 10, topY],[x1 + 9, botY - 5],[x2 - 9, botY - 5],[x3 - 10, topY]], env.gndTop);
          let step = 0;
          for (let tx = x1 + 8; tx <= x2 - 18; tx += 46) {
            if (isWinter && step % 2 === 1) {
              drawEasternCedar(Math.round(tx), topY - 4, true, false);
            } else {
              drawShadedPine(Math.round(tx), topY - 4, isWinter, isSil);
            }
            step++;
          }
        }
      }

      if (f.type === 'BOT_MEANDER') {
        const baseY = VIEW_H - bottomShoreH;
        const peakY = baseY - reachH;

        fillPixelPoly([[x0 - 3, baseY],[x1, peakY - 2],[x2, peakY - 2],[x3 + 3, baseY]], env.watFoam);
        fillPixelPoly([[x0, baseY],[x1 + 2, peakY],[x2 - 2, peakY],[x3, baseY]], isWinter ? PAL.SNOW_DARK : (isSil ? PAL.SILHOUETTE : (isLakeOpen ? PAL.STONE_MID : PAL.SAND_MID)));
        fillPixelPoly([[x0 + 5, baseY],[x1 + 5, peakY + 2],[x2 - 5, peakY + 2],[x3 - 5, baseY]], env.gndMid);

        if (f.depthFactor >= 1.0) {
          fillPixelPoly([[x0 + 10, baseY],[x1 + 9, peakY + 5],[x2 - 9, peakY + 5],[x3 - 10, baseY]], env.gndTop);
          let propStep = 0;
          for (let tx = x1 + 8; tx <= x2 - 18; tx += 46) {
            if (isLakeOpen && propStep % 3 === 0) {
              drawShieldOutcrop(Math.round(tx), peakY + 2, isWinter, isSil);
            } else if (isWinter && propStep % 3 === 1) {
              drawEasternCedar(Math.round(tx), peakY - 5, true, false);
            } else {
              drawShadedPine(Math.round(tx), peakY - 5, isWinter, isSil);
            }
            propStep++;
          }
        }
      }

      if (f.type === 'ISLAND') {
        const topY = riverTopY + laneH + 1;
        const botY = riverTopY + laneH * 2 - 1;
        const midY = Math.round((topY + botY) / 2);

        if (!isWinter && (f.chuteLane === 0 || f.chuteLane === 2)) {
          const chuteY = f.chuteLane === 0 ? riverTopY + 2 : riverTopY + laneH * 2 + 2;
          const chuteH = laneH - 4;
          ctx.fillStyle = env.watMid;
          ctx.fillRect(Math.round(x0), chuteY, f.w, chuteH);
          ctx.fillStyle = env.watFoam;
          for (let cx = x0 + 6; cx < x3 - 12; cx += 22) {
            const animX = Math.round(cx - ((bgOffset * 0.9) % 22));
            ctx.fillRect(animX, chuteY + 3, 12, 1);
            ctx.fillRect(animX + 5, chuteY + chuteH - 4, 10, 1);
          }
        }

        fillPixelPoly([
          [x0 - 3, midY],[x1, topY - 2],[x2, topY - 2],[x3 + 3, midY],[x2, botY + 2],[x1, botY + 2]
        ], env.watFoam);

        fillPixelPoly([
          [x0, midY],[x1 + 2, topY],[x2 - 2, topY],[x3, midY],[x2 - 2, botY],[x1 + 2, botY]
        ], isWinter ? PAL.SNOW_DARK : (isSil ? PAL.SILHOUETTE : PAL.SAND_LIGHT));

        fillPixelPoly([
          [x0 + 7, midY],[x1 + 5, topY + 3],[x2 - 5, topY + 3],[x3 - 7, midY],[x2 - 5, botY - 3],[x1 + 5, botY - 3]
        ], f.isMarshIsland ? PAL.MARSH_MID : env.gndMid);

        fillPixelPoly([
          [x0 + 11, midY],[x1 + 8, topY + 5],[x2 - 8, topY + 5],[x3 - 11, midY],[x2 - 8, botY - 6],[x1 + 8, botY - 6]
        ], f.isMarshIsland ? PAL.MARSH_LIGHT : env.gndTop);

        if (f.isMarshIsland) {
          drawMarshReeds(Math.round(x1 + 4), topY - 2);
          drawMarshReeds(Math.round((x1 + x2) / 2 - 4), topY - 3);
          drawMarshReeds(Math.round(x2 - 14), topY - 2);
        } else {
          if (isWinter) {
            drawEasternCedar(Math.round(x1 + 6), topY - 7, true, false);
            drawShadedPine(Math.round((x1 + x2) / 2 - 6), topY - 8, true, false);
          } else {
            drawShadedPine(Math.round(x1 + 6), topY - 7, false, isSil);
            drawShadedPine(Math.round((x1 + x2) / 2 - 6), topY - 8, false, isSil);
          }
          if (f.isSugarIsland) {
            drawShadedPine(Math.round(x2 - 18), topY - 6, isWinter, isSil);
            drawShieldOutcrop(Math.round((x1 + x2) / 2 - 8), midY - 2, isWinter, isSil);
            drawUnboxedLabel("Sugar Island", Math.round((x1 + x2) / 2), topY - 12, isSil);
          }
        }
      }
    }

    // 5. Hazards
    for (let i = 0; i < hazards.length; i++) {
      const h = hazards[i];
      const hx = Math.round(h.x);
      const halfShift = (h.halfOffset || 0) * Math.floor(laneH * 0.28);
      const hy = riverTopY + h.lane * laneH + Math.floor((laneH - 9) / 2) + halfShift;

      if (h.type === 'LOG_JAM') {
        ctx.fillStyle = env.watFoam;
        ctx.fillRect(hx - 2, hy + 7, 22, 2);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 2, hy, 15, 4);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.WOOD_DARK;
        ctx.fillRect(hx + 3, hy + 1, 13, 2);
        ctx.fillStyle = isSil ? PAL.SIL_RIM_BRIGHT : PAL.WOOD_LIGHT;
        ctx.fillRect(hx + 3, hy + 1, 11, 1);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx, hy + 3, 18, 5);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.WOOD_DARK;
        ctx.fillRect(hx + 1, hy + 5, 16, 2);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.WOOD_MID;
        ctx.fillRect(hx + 1, hy + 4, 16, 2);
        ctx.fillStyle = isSil ? PAL.SIL_RIM_BRIGHT : PAL.WOOD_LIGHT;
        ctx.fillRect(hx + 2, hy + 3, 14, 1);
      } else if (h.type === 'ROCK_CLUSTER') {
        ctx.fillStyle = isSil ? '#8AD0FF' : PAL.SNOW_LIGHT;
        ctx.fillRect(hx - 2, hy + 6, 20, 3);
        ctx.fillRect(hx + 2, hy + 4, 12, 5);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx - 1, hy + 4, 5, 4);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.STONE_MID;
        ctx.fillRect(hx, hy + 4, 3, 3);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 12, hy + 5, 5, 4);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.STONE_DARK;
        ctx.fillRect(hx + 13, hy + 5, 3, 3);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 3, hy + 6, 5, 3);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.STONE_MID;
        ctx.fillRect(hx + 4, hy + 6, 3, 2);

        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 4, hy, 9, 7);
        ctx.fillRect(hx + 5, hy - 1, 7, 1);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.STONE_DARK;
        ctx.fillRect(hx + 5, hy + 3, 7, 4);
        ctx.fillStyle = isSil ? PAL.SILHOUETTE : PAL.STONE_MID;
        ctx.fillRect(hx + 5, hy + 1, 7, 3);
        ctx.fillStyle = isSil ? PAL.SIL_RIM_BRIGHT : PAL.STONE_LIGHT;
        ctx.fillRect(hx + 5, hy, 5, 2);
        ctx.fillStyle = isSil ? '#B8E4FF' : PAL.SNOW_LIGHT;
        ctx.fillRect(hx + 6, hy, 3, 1);
      } else if (h.type === 'BIG_WAVE') {
        const waveW = 54;
        const waveBotY = riverTopY + laneH - 2;
        const playerX = 36;
        const foldT = Math.max(0, Math.min(1, (VIEW_W - hx) / Math.max(40, VIEW_W - playerX)));
        const crestTopY = Math.round(horizonY - 2 - foldT * 3);

        fillPixelPoly([
          [hx, waveBotY],
          [hx + Math.round(14 - foldT * 5), crestTopY + 2],
          [hx + Math.round(23 - foldT * 4), crestTopY],
          [hx + 38, crestTopY + 3],
          [hx + waveW, waveBotY]
        ], env.watMid);

        fillPixelPoly([
          [hx - 2, waveBotY - 1],
          [hx + Math.round(10 - foldT * 4), crestTopY + 3],
          [hx + Math.round(18 - foldT * 3), crestTopY],
          [hx + 29, crestTopY + 2],
          [hx + 20, waveBotY - 2]
        ], env.watFoam);

        const curlOverhang = Math.round(foldT * 4);
        fillPixelPoly([
          [hx + Math.round(9 - curlOverhang), crestTopY + 3],
          [hx + Math.round(14 - curlOverhang), crestTopY],
          [hx + 24, crestTopY],
          [hx + 30, crestTopY + 2],
          [hx + 17, crestTopY + 2]
        ], PAL.WAVE_CREST);

        ctx.fillStyle = PAL.WAVE_CREST;
        ctx.fillRect(hx + 26, crestTopY + 2, 14, 1);
        ctx.fillStyle = env.watFoam;
        ctx.fillRect(hx - 2, waveBotY - 1, waveW + 2, 1);
      } else if (h.type === 'SNOW_DRIFT') {
        fillPixelPoly([
          [hx, hy + 8],[hx + 5, hy + 2],[hx + 15, hy + 1],[hx + 22, hy + 8]
        ], PAL.SNOW_DARK);
        fillPixelPoly([
          [hx + 2, hy + 8],[hx + 6, hy + 2],[hx + 14, hy + 2],[hx + 20, hy + 8]
        ], PAL.SNOW_LIGHT);
      } else if (h.type === 'ICE_PATCH') {
        ctx.fillStyle = PAL.GLARE_ICE_M;
        ctx.fillRect(hx, hy + 1, 24, 8);
        ctx.fillStyle = PAL.GLARE_ICE_L;
        ctx.fillRect(hx + 2, hy + 2, 20, 6);
        ctx.fillStyle = PAL.SNOW_LIGHT;
        ctx.fillRect(hx + 4, hy + 3, 6, 1);
        ctx.fillRect(hx + 12, hy + 5, 7, 1);
      }
    }

    // 6. Player Sprite OR Norway House Dogsled Deployment Cutscene
    if (isDeployingSled) {
      drawDeploymentSequence(riverTopY, laneH);
    } else {
      drawCanoeAndHunter(16, playerVisualY, frame, true);
    }

    // 7. Progressive Parallax Snow & Blizzard Overlay (Begins near snowy north shore at 3520 -> peak 4350 -> fades into York Factory 5000)
    if (score >= 3520 && score <= DIST.VICTORY_YORK) {
      let intensity = 0;
      if (score < DIST.DEPLOY_END) {
        intensity = ((score - 3520) / (DIST.DEPLOY_END - 3520)) * 0.22;
      } else if (score < 4100) {
        intensity = 0.22 + ((score - DIST.DEPLOY_END) / (4100 - DIST.DEPLOY_END)) * 0.22;
      } else if (score < 4280) {
        intensity = 0.44 + ((score - 4100) / 180) * 0.25;
      } else if (score < 4500) {
        intensity = 0.69 + Math.min(1, (score - 4280) / 200) * 0.31;
      } else {
        intensity = Math.max(0.05, 1.0 - ((score - 4500) / 500) * 0.95);
      }

      const gustBreak = (score >= 4250 && score < 4580) ? (Math.sin(frame * 0.045) * 0.5 + 0.5) : 0;
      const effectiveWhiteout = Math.max(0, intensity - gustBreak * 0.36);

      if (effectiveWhiteout > 0.24) {
        const veilAlpha = Math.min(0.60, (effectiveWhiteout - 0.24) * 0.78);
        ctx.fillStyle = `rgba(225, 238, 246, ${veilAlpha.toFixed(3)})`;
        ctx.fillRect(0, playTop, VIEW_W, playH);
      }

      const activeCount = Math.floor(22 + intensity * (snowParticles.length - 22));
      for (let i = 0; i < activeCount; i++) {
        const p = snowParticles[i];
        const windVx = (0.9 + p.layer * 1.2) * (0.35 + intensity * 2.1);
        const fallVy = (0.45 + p.layer * 0.35) * (0.65 + intensity * 0.95);

        p.x -= windVx;
        p.y += fallVy;
        if (p.x < -12) p.x = VIEW_W + 8;
        if (p.y > VIEW_H) {
          p.y = playTop - 2;
          p.x = Math.random() * (VIEW_W + 20);
        }

        const sx = Math.round(p.x);
        const sy = Math.round(p.y);
        ctx.fillStyle = p.layer === 0 ? PAL.SNOW_MID : PAL.SNOW_LIGHT;
        if (intensity > 0.52 && p.layer >= 1) {
          ctx.fillRect(sx, sy, 4 + p.layer * 2, 1);
          ctx.fillRect(sx - 2, sy + 1, 3, 1);
        } else {
          ctx.fillRect(sx, sy, p.layer === 2 ? 2 : 1, p.layer === 2 ? 2 : 1);
        }
      }
    }

    ctx.restore();
  }

  // ==========================================
  // 9. COLLISIONS, ISLAND COMMITMENT, & UPDATE LOOP
  // ==========================================
  function isCommittedToIslandFork(targetLane) {
    const pLeft = 20;
    const pRight = 52;
    for (let i = 0; i < riverFeatures.length; i++) {
      const f = riverFeatures[i];
      if (f.type === 'ISLAND') {
        const forkStart = f.x + 4;
        const forkEnd = f.x + f.w - 4;
        if (pRight > forkStart && pLeft < forkEnd) {
          if (targetLane === 1 || (playerLane === 0 && targetLane === 2) || (playerLane === 2 && targetLane === 0)) {
            return true;
          }
        }
      }
    }
    return false;
  }

  function checkCollisions() {
    if (isDeployingSled) return;

    const pLeft = 20;
    const pRight = 52;
    let inFastChute = false;

    for (let i = 0; i < riverFeatures.length; i++) {
      const f = riverFeatures[i];
      const solidStart = f.type === 'ISLAND' ? (f.x + 8) : (f.x + Math.floor(f.taperW * 0.65));
      const solidEnd = f.type === 'ISLAND' ? (f.x + f.w - 8) : (f.x + f.w - Math.floor(f.taperW * 0.65));

      if (f.type === 'ISLAND' && !isSledMode && pRight > f.x && pLeft < f.x + f.w) {
        if (playerLane === f.chuteLane) {
          inFastChute = true;
        }
      }

      if (pRight > solidStart && pLeft < solidEnd) {
        if (playerLane === 0 && f.type === 'TOP_MEANDER' && f.depthFactor >= 1.0) {
          crashReason = isSledMode ? "CRASHED INTO SNOWBANK!" : "RUN AGROUND ON BANK!";
          gameOver();
          return;
        }
        if (playerLane === 2 && f.type === 'BOT_MEANDER' && f.depthFactor >= 1.0) {
          crashReason = isSledMode ? "CRASHED INTO SHORE DRIFT!" : "RUN AGROUND ON SHORE!";
          gameOver();
          return;
        }
        if (playerLane === 1 && f.type === 'ISLAND') {
          crashReason = f.isSugarIsland ? "STRANDED ON SUGAR ISLAND!" : "STRANDED ON ISLAND!";
          gameOver();
          return;
        }
      }
    }

    if (inFastChute && !isIceSlip) {
      boostTimer = 10;
    }

    for (let i = 0; i < hazards.length; i++) {
      const h = hazards[i];

      if (h.type === 'BIG_WAVE' && !h.passSoundPlayed && h.x <= 56) {
        h.passSoundPlayed = true;
        playWavePassWhoosh();
      }

      const hitStart = h.type === 'BIG_WAVE' ? (h.x + 4) : (h.x + 2);
      const hitEnd = h.type === 'BIG_WAVE' ? (h.x + 30) : (h.x + 16);

      if (!h.triggered && h.lane === playerLane && pRight > hitStart && pLeft < hitEnd) {
        h.triggered = true;
        if (h.type === 'ROCK_CLUSTER') {
          crashReason = "STRUCK SHALLOW ROCKS!";
          gameOver();
          return;
        } else if (h.type === 'BIG_WAVE') {
          crashReason = "CAPSIZED IN LAKE WHITECAP!";
          gameOver();
          return;
        } else if (h.type === 'LOG_JAM') {
          shakeTimer = 28;
          slowTimer = 36;
          slowFactor = 0.72;
          playRumbleSound();
        } else if (h.type === 'SNOW_DRIFT') {
          slowTimer = 55;
          slowFactor = 0.75;
          playTone(150, 'triangle', 0.14, 0.12);
        } else if (h.type === 'ICE_PATCH') {
          boostTimer = 120;
          isIceSlip = true;
          playTone(520, 'sine', 0.18, 0.12);
        }
      }
    }
  }

  function update() {
    if (isPaused) return;

    if (gameMode === 'TITLE') {
      drawScene();
      frame++;
      requestAnimationFrame(update);
      return;
    }

    if (gameMode === 'OPENING_CUTSCENE') {
      if (!awaitingOpeningConfirm) {
        openingFrame++;
        if (openingFrame === 136 || openingFrame === 162 || openingFrame === 188) {
          playTone(660, 'square', 0.08, 0.08);
        }
        if (openingFrame === 325) {
          playTone(392, 'triangle', 0.12, 0.10);
        }
        if (openingFrame === OPENING_DIALOGUE_FRAME) {
          awaitingOpeningConfirm = true;
        }
      }
      if (openingFrame >= OPENING_TOTAL) {
        gameMode = 'PLAYING';
        headerBar.style.display = 'flex';
        playerLane = 1;
        if (!audioTimer) {
          currentStepAudio = 0;
          audioTimer = setInterval(sequenceTrack, noteLength * 1000);
        }
      }
      drawScene();
      frame++;
      requestAnimationFrame(update);
      return;
    }

    if (gameMode === 'CLOSING_CUTSCENE') {
      closingFrame++;
      if (closingFrame === 125) {
        playTone(440, 'triangle', 0.14, 0.12);
      }
      if (closingFrame === 320) {
        playTone(587.33, 'sine', 0.25, 0.14);
        setTimeout(() => playTone(783.99, 'sine', 0.40, 0.14), 160);
      }
      drawScene();
      if (closingFrame >= CLOSING_TOTAL) {
        finishEndingFadeToBlack();
        return;
      }
      frame++;
      requestAnimationFrame(update);
      return;
    }

    if (gameMode !== 'PLAYING') return;

    // Mid-Game Norway House Landing & Dogsled Deployment Cutscene (3750 - 3870)
    if (score >= DIST.NORWAY_HOUSE_END && score < DIST.DEPLOY_END) {
      if (!isDeployingSled) {
        isDeployingSled = true;
        playerLane = 1;
        hazards = [];
        riverFeatures = [];
        playTone(440, 'triangle', 0.18, 0.14);
      }
      deployProgress = (score - DIST.NORWAY_HOUSE_END) / (DIST.DEPLOY_END - DIST.NORWAY_HOUSE_END);
      if (frame % 3 === 0) {
        score += 1;
        scoreDisplay.innerText = 'DIST: ' + score;
      }
      drawScene();
      frame++;
      requestAnimationFrame(update);
      return;
    } else if (isDeployingSled && score >= DIST.DEPLOY_END) {
      isDeployingSled = false;
      isSledMode = true;
      nextFeatureX = VIEW_W + 70;
    }

    let currentSpeed = speed;
    if (slowTimer > 0) {
      currentSpeed = speed * slowFactor;
      slowTimer--;
    } else if (boostTimer > 0) {
      currentSpeed = speed * (isIceSlip ? 1.48 : 1.32);
      boostTimer--;
      if (boostTimer <= 0) isIceSlip = false;
    }
    if (shakeTimer > 0) shakeTimer--;

    bgOffset += currentSpeed;
    nextFeatureX -= currentSpeed;
    if (lakeWaveArmed) {
      nextDeepWaveX -= currentSpeed;
    }

    if (frame % 3 === 0) {
      score += 1;
      scoreDisplay.innerText = 'DIST: ' + score;
    }

    if (score >= DIST.VICTORY_YORK) {
      gameMode = 'CLOSING_CUTSCENE';
      closingFrame = 0;
      headerBar.style.display = 'none';
      hazards = [];
      riverFeatures = [];
      if (audioTimer) {
        clearInterval(audioTimer);
        audioTimer = null;
      }
      playTone(440, 'triangle', 0.16, 0.14);
      requestAnimationFrame(update);
      return;
    }

    speed = Math.min(2.85, speed + 0.00010);

    for (let i = 0; i < riverFeatures.length; i++) {
      riverFeatures[i].x -= currentSpeed;
    }
    riverFeatures = riverFeatures.filter(f => f.x + f.w > -60);

    while (nextFeatureX < VIEW_W + 200) {
      scheduleNextRiverFeature();
    }

    scheduleDeepLakeWaves();

    for (let i = 0; i < hazards.length; i++) {
      const hSpeed = hazards[i].type === 'BIG_WAVE' ? currentSpeed * 1.38 : currentSpeed;
      hazards[i].x -= hSpeed;
    }
    hazards = hazards.filter(h => h.x > -70);

    for (let i = 0; i < landmarks.length; i++) {
      landmarks[i].x -= currentSpeed * 0.38;
    }
    landmarks = landmarks.filter(lm => lm.x > -180);

    for (let i = 0; i < nearBankLandmarks.length; i++) {
      nearBankLandmarks[i].x -= currentSpeed * 0.85;
    }
    nearBankLandmarks = nearBankLandmarks.filter(lm => lm.x > -90);

    drawScene();
    checkCollisions();

    frame++;
    requestAnimationFrame(update);
  }

  function changeTrack(direction) {
    if (gameMode !== 'PLAYING' || isPaused || isDeployingSled || isIceSlip) return;
    if (direction === 'UP' && playerLane > 0) {
      const nextLane = playerLane - 1;
      if (isCommittedToIslandFork(nextLane)) return;
      playerLane = nextLane;
      playTrackRippleSound();
    } else if (direction === 'DOWN' && playerLane < 2) {
      const nextLane = playerLane + 1;
      if (isCommittedToIslandFork(nextLane)) return;
      playerLane = nextLane;
      playTrackRippleSound();
    }
  }

  // ==========================================
  // 10. CHIPTUNE AUDIO & WATER SFX ENGINE
  // ==========================================
  let audioCtx = null;
  let audioTimer = null;
  let currentStepAudio = 0;
  const AUDIO_BPM = 132;
  const noteLength = 60 / AUDIO_BPM / 4;

  const NOTES = {
    'E3': 164.81, 'F#3': 185.00, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94, 'D4': 293.66,
    'E4': 329.63, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'D5': 587.33,
    'E5': 659.25, 'F#5': 739.99, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'D6': 1174.66
  };

  const wilyLead = [
    'E4', 'E5', 'B4', 'E5', 'D5', 'B4', 'D5', 'E5',
    'G4', 'G5', 'D5', 'G5', 'F#5', 'D5', 'F#5', 'G5',
    'A4', 'A5', 'E5', 'A5', 'G5', 'E5', 'G5', 'A5',
    'B5', 'A5', 'G5', 'F#5', 'E5', 'D5', 'B4', 'D5'
  ];

  const powWowDrum = [
    'E3', 'E3', null, 'E3', 'E3', 'E3', null, 'E3',
    'G3', 'G3', null, 'G3', 'G3', 'G3', null, 'G3',
    'A3', 'A3', null, 'A3', 'A3', 'A3', null, 'A3',
    'B3', null, 'B3', null, 'D4', 'B3', 'G3', 'F#3'
  ];

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, volume) {
    if (!freq || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration - 0.015);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playPaddleSplashSound() {
    if (!audioCtx) return;
    const dur = 0.14;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(620, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(340, audioCtx.currentTime + dur);
    filter.Q.value = 2.0;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.005, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0005, audioCtx.currentTime + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
    noise.stop(audioCtx.currentTime + dur);
  }

  function playTrackRippleSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const dur = 0.18;

    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(420, now);
    filter.frequency.exponentialRampToValueAtTime(780, now + dur);
    filter.Q.value = 2.4;

    const nGain = audioCtx.createGain();
    nGain.gain.setValueAtTime(0.01, now);
    nGain.gain.linearRampToValueAtTime(0.16, now + 0.03);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    noise.connect(filter);
    filter.connect(nGain);
    nGain.connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + dur);

    const osc = audioCtx.createOscillator();
    const oGain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(340, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.07);
    osc.frequency.setValueAtTime(410, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(640, now + 0.16);
    oGain.gain.setValueAtTime(0.09, now);
    oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
    osc.connect(oGain);
    oGain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.17);
  }

  function playRumbleSound() {
    playTone(95, 'sawtooth', 0.22, 0.18);
  }

  function playWaveWarningSound() {
    if (!audioCtx) return;
    const dur = 0.45;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(220, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + dur * 0.65);
    filter.Q.value = 1.8;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + dur * 0.55);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
    noise.stop(audioCtx.currentTime + dur);
  }

  function playWavePassWhoosh() {
    if (!audioCtx) return;
    const dur = 0.85;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(380, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + dur);
    filter.Q.value = 1.3;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.11, audioCtx.currentTime + dur * 0.30);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
    noise.stop(audioCtx.currentTime + dur);
  }

  function sequenceTrack() {
    if (isPaused || gameMode !== 'PLAYING') return;
    const leadNote = wilyLead[currentStepAudio];
    const bassNote = powWowDrum[currentStepAudio];

    if (leadNote && NOTES[leadNote]) {
      playTone(NOTES[leadNote], 'square', noteLength * 0.95, 0.03);
    }
    if (bassNote && NOTES[bassNote]) {
      playTone(NOTES[bassNote], 'triangle', noteLength * 2.2, 0.25);
    }

    currentStepAudio = (currentStepAudio + 1) % 32;
  }

  // ==========================================
  // 11. GAME STATE & ARCADE POSTMESSAGE BRIDGE
  // ==========================================
  function triggerStartFromTitle() {
    initAudio();
    if (gameMode === 'TITLE' && !isFadingFromTitle) {
      isFadingFromTitle = true;
      titleFadeOutAlpha = 0;
      playTone(392, 'triangle', 0.14, 0.14);
    } else if (gameMode === 'GAME_OVER' || gameMode === 'VICTORY') {
      beginOpeningCutscene();
    }
  }

  function beginOpeningCutscene() {
    score = 0;
    frame = 0;
    speed = 1.5;
    bgOffset = 0;
    playerLane = 1;
    playerVisualY = 0;
    shakeTimer = 0;
    slowTimer = 0;
    boostTimer = 0;
    isIceSlip = false;
    lastSplashStrokeId = -1;

    resetWorld();
    initSnow();

    gameMode = 'OPENING_CUTSCENE';
    openingFrame = 0;
    awaitingOpeningConfirm = false;
    headerBar.style.display = 'none';
    msg.style.display = 'none';
    msg.style.background = '#4A0C10';
  }

  function gameOver() {
    gameMode = 'GAME_OVER';
    playTone(110, 'sawtooth', 0.35, 0.25);
    msg.style.background = '#4A0C10';
    msg.innerHTML = `${crashReason}<br><br>PRESS 'A' TO RESTART`;
    msg.style.display = 'block';

    if (audioTimer) {
      clearInterval(audioTimer);
      audioTimer = null;
    }
  }

  function finishEndingFadeToBlack() {
    gameMode = 'VICTORY';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    msg.style.background = '#123324';
    msg.innerHTML = `DISPATCH DELIVERED TO YORK FACTORY!<br>BOUND FOR LONDON VIA HUDSON BAY<br><br>PRESS 'A' TO RUN AGAIN`;
    msg.style.display = 'block';
  }

  let lastA = 0;
  let lastB = 0;
  let dpadHolds = { UP: 0, DOWN: 0, LEFT: 0, RIGHT: 0 };

  window.addEventListener('message', function(event) {
    let cmd = event.data;
    if (typeof cmd === 'object' && cmd.type) cmd = cmd.type;
    if (typeof cmd !== 'string') return;

    if (cmd === 'PAUSE') {
      isPaused = true;
      dpadHolds = { UP: 0, DOWN: 0, LEFT: 0, RIGHT: 0 };
      if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
      return;
    }
    if (cmd === 'RESUME') {
      isPaused = false;
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      requestAnimationFrame(update);
      return;
    }

    if (isPaused) return;
    const now = Date.now();

    if (cmd === 'BUTTON_A' && now - lastA > 110) {
      lastA = now;
      if (gameMode === 'OPENING_CUTSCENE' && awaitingOpeningConfirm) {
        awaitingOpeningConfirm = false;
        openingFrame = OPENING_DIALOGUE_FRAME + 1;
        playTone(493.88, 'triangle', 0.12, 0.14);
      } else if (gameMode === 'TITLE' || gameMode === 'GAME_OVER' || gameMode === 'VICTORY') {
        triggerStartFromTitle();
      }
    }
    if (cmd === 'BUTTON_B' && now - lastB > 110) {
      lastB = now;
    }

    if (cmd.startsWith('DPAD_')) {
      const dir = cmd.replace('DPAD_', '').replace('_PRESS', '').replace('_RELEASE', '');
      if (cmd.includes('_RELEASE')) {
        dpadHolds[dir] = 0;
      } else {
        if (now - dpadHolds[dir] > 145) {
          dpadHolds[dir] = now;
          changeTrack(dir);
        }
      }
    }
  });

  // Start continuous render loop on the stylized Woodland title screen
  resetWorld();
  titleStartTime = performance.now();
  requestAnimationFrame(update);
</script>
</body>
