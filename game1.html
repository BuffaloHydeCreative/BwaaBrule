<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Red River Run</title>
<style>
  html, body, #game-container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050C08;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #game-container {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  #header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 36px;
    display: none;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(10, 26, 19, 0.94) 0%, rgba(10, 26, 19, 0.72) 100%);
    border-bottom: 2px solid #D4A338;
    color: #F7C844;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Courier New', Courier, monospace;
    padding: 0 18px;
    box-sizing: border-box;
    z-index: 20;
    text-shadow: 2px 2px 0 #000;
  }

  #screen-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: bold;
    color: #ffffff;
    background: #4A0C10;
    font-size: 16px;
    padding: 14px 24px;
    display: none;
    white-space: nowrap;
    border: 3px solid #F7C844;
    box-shadow: 0 6px 0 #000;
    text-align: center;
    z-index: 25;
    font-family: 'Courier New', Courier, monospace;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <span id="title-display">THE FORKS</span>
    <span id="score-display">DIST: 0</span>
  </div>

  <div id="screen-container">
    <canvas id="gameCanvas"></canvas>
    <div id="msg">RUN AGROUND!<br><br>PRESS 'A' TO RESTART</div>
  </div>
</div>

<script>
  // ==========================================
  // 1. FULL-SCREEN VIEWPORT & CRISP 16-BIT RESOLUTION
  // ==========================================
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  const headerBar = document.getElementById('header');

  let VIEW_W = 320;
  let VIEW_H = 180;

  function resizeViewport() {
    const aspect = window.innerWidth / window.innerHeight;
    if (window.innerWidth >= window.innerHeight) {
      VIEW_H = 180;
      VIEW_W = Math.max(320, Math.round(180 * aspect));
    } else {
      VIEW_W = 280;
      VIEW_H = Math.max(180, Math.round(280 / aspect));
    }
    cvs.width = VIEW_W;
    cvs.height = VIEW_H;
    ctx.imageSmoothingEnabled = false;
  }

  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  // ==========================================
  // 2. SNES SHADED PALETTE & GAME STATE
  // ==========================================
  const msg = document.getElementById('msg');
  const scoreDisplay = document.getElementById('score-display');
  const titleDisplay = document.getElementById('title-display');

  const PAL = {
    OUTLINE: '#0B1610',
    SILHOUETTE: '#070A14',
    SIL_RIM: '#6D62B8',
    SIL_RIM_BRIGHT: '#A99EF0',
    DARK_PINE: '#123324',
    MID_PINE: '#275940',
    LIGHT_PINE: '#458761',
    CEDAR_DARK: '#163D2B',
    CEDAR_MID: '#2F6B4C',
    CEDAR_LIGHT: '#569E73',
    MARSH_LIGHT: '#9AC448',
    MARSH_MID: '#5E8C31',
    MARSH_DARK: '#32521E',
    REED_GOLD: '#D6B85A',
    GOLD_LIGHT: '#FBE07A',
    GOLD_MID: '#E2AC32',
    GOLD_DARK: '#A8741A',
    CHARTREUSE_L: '#BCE254',
    CHARTREUSE_D: '#7EA626',
    MAROON_DEEP: '#3A0B0E',
    MAROON_MID: '#5E171C',
    MAROON_FOAM: '#C48A78',
    LAKE_DEEP: '#0A3E59',
    LAKE_MID: '#16688F',
    LAKE_FOAM: '#48D8CC',
    WAVE_CREST: '#E8FAFF',
    INDIGO_DEEP: '#071022',
    INDIGO_MID: '#10203E',
    SUNSET_TOP: '#26174A',
    SUNSET_MID: '#7D3559',
    SUNSET_BOT: '#DF6E42',
    NIGHT_SKY_T: '#09071A',
    NIGHT_SKY_M: '#19133D',
    NIGHT_SKY_B: '#2E1E59',
    HIDE_LIGHT: '#F2ECDC',
    HIDE_MID: '#CBBFA4',
    HIDE_DARK: '#8F8268',
    WOOD_LIGHT: '#C88446',
    WOOD_MID: '#8C5022',
    WOOD_DARK: '#4D280E',
    SAND_LIGHT: '#E2CCA2',
    SAND_MID: '#B59B6D',
    ROCK_OUTLINE: '#181B22',
    ROCK_DARK: '#303540',
    ROCK_MID: '#525A68',
    ROCK_LIGHT: '#7E8899',
    TIN_DARK: '#6A7582',
    TIN_MID: '#A8B6C4',
    TIN_LIGHT: '#E6F2FA',
    OCHRE_RED: '#A63A28',
    STONE_LIGHT: '#B5B8B4',
    STONE_MID: '#7A7E7A',
    STONE_DARK: '#424644',
    SNOW_LIGHT: '#FFFFFF',
    SNOW_MID: '#D4E7F5',
    SNOW_DARK: '#93B6CF',
    ICE_DEEP: '#7BAEC9',
    ICE_MID: '#A6D5ED',
    GLARE_ICE_L: '#E4F9FF',
    GLARE_ICE_M: '#66D6F2',
    SASH_RED: '#C42424',
    FIRE_ORANGE: '#F26419',
    FIRE_YELLOW: '#F6AE2D',
    NWC_BLUE: '#234B7A',
    HBC_COAT: '#9E2A2B',
    SUIT_DARK: '#151922',
    SUIT_MID: '#29303D',
    BAY_DEEP: '#0B496B',
    BAY_MID: '#18749E',
    BAY_FOAM: '#7CE4EC',
    DAY_SKY_T: '#6FA6C4',
    DAY_SKY_M: '#9BC4D8',
    DAY_SKY_B: '#C7DFEA'
  };

  // Geographic Stage Milestones
  const DIST = {
    FORKS_END: 600,
    PLAINS_END: 1160,
    SETTLER_FARMS_END: 1650,
    MOUTH_OPEN_START: 2010,
    ST_PETERS_END: 2150,
    MOUTH_BAS_END: 2470,
    MANIGOTAGAN_END: 2910,
    BERENS_END: 3630,
    LAKE_CLOSE_START: 4230,
    NORWAY_HOUSE_END: 4350,
    DEPLOY_END: 4470,
    BLIZZARD_PEAK: 5200,
    VICTORY_YORK: 6450
  };

  const TILE_PX = 18;

  let gameMode = 'TITLE'; // 'TITLE' | 'OPENING_CUTSCENE' | 'PLAYING' | 'CLOSING_CUTSCENE' | 'GAME_OVER' | 'VICTORY'
  let titleStartTime = performance.now();
  let titleFadeOutAlpha = 0;
  let isFadingFromTitle = false;

  let isPaused = false;
  let score = 0, frame = 0, speed = 1.5;
  let bgOffset = 0;

  // 3 Persistent Tracks: 0 (Top / Open Lake), 1 (Middle), 2 (Bottom / East Shoreline)
  let playerLane = 1;
  let playerVisualY = 0;
  let shakeTimer = 0;
  let slowTimer = 0;
  let slowFactor = 0.75;
  let boostTimer = 0;
  let isIceSlip = false;
  let crashReason = "RUN AGROUND!";
  let lastSplashStrokeId = -1;

  // Opening Cutscene State
  let openingFrame = 0;
  let awaitingOpeningConfirm = false;
  const OPENING_DIALOGUE_FRAME = 390;
  const OPENING_TOTAL = 620;

  // Mid-Game Dogsled Deployment Cutscene at Norway House (4350 - 4470)
  let isDeployingSled = false;
  let deployProgress = 0;

  // Closing Cutscene State
  let closingFrame = 0;
  const CLOSING_TOTAL = 420;

  // River Features & Hazards
  let riverFeatures = [];
  let hazards = [];
  let nextFeatureX = 0;
  let nextDeepWaveX = 0;
  let lakeWaveArmed = false;
  let lastFeatureType = 'NONE';

  // Unique One-Off Landmarks
  let spawnedFlags = {};
  let landmarks = [];
  let nearBankLandmarks = [];

  // Parallax Snow / Blizzard Particles
  let snowParticles = [];
  function initSnow() {
    snowParticles = [];
    for (let i = 0; i < 230; i++) {
      snowParticles.push({
        x: Math.random() * 540,
        y: Math.random() * 200,
        layer: i % 3
      });
    }
  }
  initSnow();

  // Twilight Stars for Midnight Lake Winnipeg Title Screen
  let titleStars = [];
  function initTitleStars() {
    titleStars = [];
    for (let i = 0; i < 38; i++) {
      titleStars.push({
        x: ((i * 73 + 19) % 480) / 480,
        y: ((i * 37 + 11) % 100) / 100,
        size: i % 5 === 0 ? 2 : 1,
        phase: i * 0.7
      });
    }
  }
  initTitleStars();

  // ==========================================
  // 3. COLOR INTERPOLATION & PARALLAX SKY ENGINE
  // ==========================================
  function hexToRgb(hex) {
    const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return res ? {
      r: parseInt(res[1], 16),
      g: parseInt(res[2], 16),
      b: parseInt(res[3], 16)
    } : { r: 0, g: 0, b: 0 };
  }

  function lerpColor(c1, c2, t) {
    if (t <= 0) return c1;
    if (t >= 1) return c2;
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r + (b.r - a.r) * t);
    const g = Math.round(a.g + (b.g - a.g) * t);
    const bl = Math.round(a.b + (b.b - a.b) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function getSilhouetteFactor() {
    if (score < 3270 || score >= DIST.NORWAY_HOUSE_END) return 0;
    if (score < DIST.BERENS_END) {
      return (score - 3270) / (DIST.BERENS_END - 3270);
    }
    if (score >= 4130) {
      return Math.max(0, 1 - (score - 4130) / (DIST.NORWAY_HOUSE_END - 4130));
    }
    return 1;
  }

  function getEnvColors() {
    let skyTop = PAL.DAY_SKY_T, skyMid = PAL.DAY_SKY_M, skyBot = PAL.DAY_SKY_B;
    let gndTop = PAL.GOLD_LIGHT, gndMid = PAL.GOLD_MID, gndDark = PAL.GOLD_DARK;
    let watDeep = PAL.MAROON_DEEP, watMid = PAL.MAROON_MID, watFoam = PAL.MAROON_FOAM;
    let title = "THE FORKS";

    if (score < DIST.FORKS_END) {
      title = "THE FORKS";
      const t = score / DIST.FORKS_END;
      skyTop = lerpColor('#6FA6C4', '#68A4C7', t);
      skyMid = lerpColor('#9BC4D8', '#99C7DE', t);
      skyBot = lerpColor('#C7DFEA', '#CBE3EE', t);
      gndTop = lerpColor(PAL.GOLD_LIGHT, PAL.CHARTREUSE_L, t);
      gndMid = lerpColor(PAL.GOLD_MID, PAL.CHARTREUSE_D, t);
      gndDark = lerpColor(PAL.GOLD_DARK, PAL.MID_PINE, t);
    } else if (score < DIST.PLAINS_END) {
      title = "RED RIVER PLAINS";
      const t = (score - DIST.FORKS_END) / (DIST.PLAINS_END - DIST.FORKS_END);
      skyTop = lerpColor('#68A4C7', '#74A9C7', t);
      skyMid = lerpColor('#99C7DE', '#A6CADB', t);
      skyBot = lerpColor('#CBE3EE', '#D6E5EC', t);
      gndTop = lerpColor(PAL.CHARTREUSE_L, PAL.GOLD_LIGHT, t * 0.45);
      gndMid = lerpColor(PAL.CHARTREUSE_D, PAL.GOLD_MID, t * 0.45);
      gndDark = PAL.MID_PINE;
      watDeep = lerpColor(PAL.MAROON_DEEP, '#321419', t);
      watMid = lerpColor(PAL.MAROON_MID, '#52242B', t);
      watFoam = lerpColor(PAL.MAROON_FOAM, '#B59084', t);
    } else if (score < DIST.SETTLER_FARMS_END) {
      title = score >= 1300 ? "LOWER FORT GARRY" : "RED RIVER SETTLEMENT";
      const t = (score - DIST.PLAINS_END) / (DIST.SETTLER_FARMS_END - DIST.PLAINS_END);
      skyTop = lerpColor('#74A9C7', '#669EBF', t);
      skyMid = lerpColor('#A6CADB', '#94BFD6', t);
      skyBot = lerpColor('#D6E5EC', '#C4DCE8', t);
      gndTop = lerpColor(PAL.CHARTREUSE_L, PAL.MARSH_LIGHT, t);
      gndMid = lerpColor(PAL.CHARTREUSE_D, PAL.MARSH_MID, t);
      gndDark = lerpColor(PAL.MID_PINE, PAL.MARSH_DARK, t);
      watDeep = lerpColor('#321419', '#281C24', t);
      watMid = lerpColor('#52242B', '#47333C', t);
      watFoam = lerpColor('#B59084', '#8FA89B', t);
    } else if (score < DIST.ST_PETERS_END) {
      title = score >= DIST.MOUTH_OPEN_START ? "MOUTH OF LAKE WINNIPEG" : "ST. PETER'S";
      const t = (score - DIST.SETTLER_FARMS_END) / (DIST.ST_PETERS_END - DIST.SETTLER_FARMS_END);
      skyTop = lerpColor('#669EBF', '#5E98BD', t);
      skyMid = lerpColor('#94BFD6', '#8DBBD6', t);
      skyBot = lerpColor('#C4DCE8', '#BEDAE8', t);
      gndTop = lerpColor(PAL.MARSH_LIGHT, PAL.LIGHT_PINE, t);
      gndMid = lerpColor(PAL.MARSH_MID, PAL.MID_PINE, t);
      gndDark = lerpColor(PAL.MARSH_DARK, PAL.DARK_PINE, t);
      watDeep = lerpColor('#281C24', PAL.LAKE_DEEP, t);
      watMid = lerpColor('#47333C', PAL.LAKE_MID, t);
      watFoam = lerpColor('#8FA89B', PAL.LAKE_FOAM, t);
    } else if (score < DIST.MOUTH_BAS_END) {
      title = "FORT BAS DE LA RIVIÈRE";
      skyTop = '#5E98BD';
      skyMid = '#8DBBD6';
      skyBot = '#BEDAE8';
      gndTop = PAL.LIGHT_PINE;
      gndMid = PAL.MID_PINE;
      gndDark = PAL.DARK_PINE;
      watDeep = PAL.LAKE_DEEP;
      watMid = PAL.LAKE_MID;
      watFoam = PAL.LAKE_FOAM;
    } else if (score < DIST.MANIGOTAGAN_END) {
      title = "MANIGOTAGAN SHORE";
      const t = (score - DIST.MOUTH_BAS_END) / (DIST.MANIGOTAGAN_END - DIST.MOUTH_BAS_END);
      skyTop = lerpColor('#5E98BD', '#6B8AB5', t);
      skyMid = lerpColor('#8DBBD6', '#A1A6C7', t);
      skyBot = lerpColor('#BEDAE8', '#D4C2D6', t);
      gndTop = lerpColor(PAL.LIGHT_PINE, PAL.MID_PINE, t);
      gndMid = lerpColor(PAL.MID_PINE, PAL.DARK_PINE, t * 0.6);
      gndDark = PAL.DARK_PINE;
      watDeep = PAL.LAKE_DEEP;
      watMid = PAL.LAKE_MID;
      watFoam = PAL.LAKE_FOAM;
    } else if (score < DIST.BERENS_END) {
      title = score >= 3370 ? "BERENS RIVER HOUSE" : "CANADIAN SHIELD COAST";
      const shieldT = Math.min(1, (score - DIST.MANIGOTAGAN_END) / 220);
      const sunsetT = Math.min(1, (score - DIST.MANIGOTAGAN_END) / 360);
      const nightT = Math.max(0, (score - 3270) / (DIST.BERENS_END - 3270));

      const dayToSunsetSkyT = lerpColor('#6B8AB5', PAL.SUNSET_TOP, sunsetT);
      const dayToSunsetSkyM = lerpColor('#A1A6C7', PAL.SUNSET_MID, sunsetT);
      const dayToSunsetSkyB = lerpColor('#D4C2D6', PAL.SUNSET_BOT, sunsetT);
      skyTop = lerpColor(dayToSunsetSkyT, PAL.NIGHT_SKY_T, nightT);
      skyMid = lerpColor(dayToSunsetSkyM, PAL.NIGHT_SKY_M, nightT);
      skyBot = lerpColor(dayToSunsetSkyB, PAL.NIGHT_SKY_B, nightT);

      const dayGndTop = lerpColor(PAL.MID_PINE, PAL.ROCK_MID, shieldT);
      const dayGndMid = lerpColor(lerpColor(PAL.MID_PINE, PAL.DARK_PINE, 0.6), PAL.ROCK_DARK, shieldT);
      const dayGndDark = lerpColor(PAL.DARK_PINE, PAL.ROCK_OUTLINE, shieldT);

      gndTop = lerpColor(dayGndTop, '#191C30', nightT);
      gndMid = lerpColor(dayGndMid, '#0D101E', nightT);
      gndDark = lerpColor(dayGndDark, '#070A14', nightT);
      watDeep = lerpColor(PAL.LAKE_DEEP, PAL.INDIGO_DEEP, nightT);
      watMid = lerpColor(PAL.LAKE_MID, PAL.INDIGO_MID, nightT);
      watFoam = lerpColor(PAL.LAKE_FOAM, '#28457A', nightT);
    } else if (score < DIST.NORWAY_HOUSE_END) {
      title = score >= 4210 ? "NORWAY HOUSE" : "MIDNIGHT LAKE WINNIPEG";
      const dawnT = score >= 4130
        ? Math.min(1, (score - 4130) / (DIST.NORWAY_HOUSE_END - 4130))
        : 0;

      skyTop = lerpColor(PAL.NIGHT_SKY_T, '#6391B0', dawnT);
      skyMid = lerpColor(PAL.NIGHT_SKY_M, '#94B8CE', dawnT);
      skyBot = lerpColor(PAL.NIGHT_SKY_B, '#C6DCE8', dawnT);
      gndTop = lerpColor('#191C30', PAL.SNOW_LIGHT, dawnT);
      gndMid = lerpColor('#0D101E', PAL.SNOW_MID, dawnT);
      gndDark = lerpColor('#070A14', PAL.SNOW_DARK, dawnT);
      watDeep = lerpColor(PAL.INDIGO_DEEP, PAL.ICE_DEEP, dawnT);
      watMid = lerpColor(PAL.INDIGO_MID, PAL.ICE_MID, dawnT);
      watFoam = lerpColor('#28457A', PAL.SNOW_LIGHT, dawnT);
    } else if (score < DIST.DEPLOY_END) {
      title = "NORWAY HOUSE - DOGSLED";
      skyTop = '#6391B0';
      skyMid = '#94B8CE';
      skyBot = '#C6DCE8';
      gndTop = PAL.SNOW_LIGHT;
      gndMid = PAL.SNOW_MID;
      gndDark = PAL.SNOW_DARK;
      watDeep = PAL.ICE_DEEP;
      watMid = PAL.ICE_MID;
      watFoam = PAL.SNOW_LIGHT;
    } else if (score < 6000) {
      title = (score >= 4850 && score <= 5700) ? "BOREAL BLIZZARD" : "BOREAL WINTER TRAIL";
      const blizT = score < 5200
        ? Math.min(1, Math.max(0, (score - 4570) / 630))
        : Math.max(0, 1 - (score - 5200) / 650);
      skyTop = lerpColor('#6391B0', '#8FA4B5', blizT);
      skyMid = lerpColor('#94B8CE', '#B4C4D1', blizT);
      skyBot = lerpColor('#C6DCE8', '#D3DFE8', blizT);
      gndTop = PAL.SNOW_LIGHT;
      gndMid = PAL.SNOW_MID;
      gndDark = PAL.SNOW_DARK;
      watDeep = PAL.ICE_DEEP;
      watMid = PAL.ICE_MID;
      watFoam = PAL.SNOW_LIGHT;
    } else {
      title = "HUDSON BAY - YORK FACTORY";
      const t = Math.min(1, (score - 6000) / 350);
      skyTop = lerpColor('#6391B0', '#5E9AC2', t);
      skyMid = lerpColor('#94B8CE', '#94C2DE', t);
      skyBot = lerpColor('#C6DCE8', '#C9E2F0', t);
      gndTop = PAL.SNOW_LIGHT;
      gndMid = PAL.SNOW_MID;
      gndDark = PAL.SNOW_DARK;
      watDeep = PAL.ICE_DEEP;
      watMid = PAL.ICE_MID;
      watFoam = PAL.SNOW_LIGHT;
    }

    return { skyTop, skyMid, skyBot, gndTop, gndMid, gndDark, watDeep, watMid, watFoam, title };
  }

  function drawParallaxSky(horizonY, skyTop, skyMid, skyBot, silT, scrollPx) {
    const grad = ctx.createLinearGradient(0, 0, 0, horizonY);
    grad.addColorStop(0, skyTop);
    grad.addColorStop(0.52, skyMid);
    grad.addColorStop(1, skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, horizonY);

    const farCloudSpacing = 210;
    const farOff = (scrollPx * 0.08) % farCloudSpacing;
    ctx.fillStyle = silT > 0.45 ? '#1D153D' : lerpColor(skyBot, '#FFFFFF', 0.45);
    for (let cx = -farCloudSpacing; cx < VIEW_W + farCloudSpacing; cx += farCloudSpacing) {
      const fx = Math.round(cx - farOff + 30);
      if (44 < horizonY - 6) {
        ctx.fillRect(fx + 6, 40, 18, 2);
        ctx.fillRect(fx, 42, 30, 2);
      }
    }

    const midCloudSpacing = 175;
    const midOff = (scrollPx * 0.16) % midCloudSpacing;
    ctx.fillStyle = silT > 0.45 ? '#2B1F57' : lerpColor(skyBot, '#FFFFFF', 0.65);
    for (let cx = -midCloudSpacing; cx < VIEW_W + midCloudSpacing; cx += midCloudSpacing) {
      const mx = Math.round(cx - midOff + 85);
      if (54 < horizonY - 4) {
        ctx.fillRect(mx + 4, 49, 14, 2);
        ctx.fillRect(mx, 51, 22, 2);
      }
    }
  }

  // ==========================================
  // 4. CRISP PIXEL LABEL HELPER & MIDNIGHT LAKE TITLE CARD
  // ==========================================
  function drawUnboxedLabel(text, centerX, y, isSil = false) {
    const tx = Math.round(centerX);
    const ty = Math.round(y);
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillText(text, tx - 1, ty);
    ctx.fillText(text, tx + 1, ty);
    ctx.fillText(text, tx, ty - 1);
    ctx.fillText(text, tx, ty + 1);
    ctx.fillStyle = isSil ? PAL.SIL_RIM_BRIGHT : PAL.GOLD_LIGHT;
    ctx.fillText(text, tx, ty);
    ctx.textAlign = 'left';
  }

  const WOODLAND_GLYPHS = {
    ' ': ['00000000','00000000','00000000','00000000','00000000','00000000','00000000','00000000','00000000'],
    'R': ['1111100','0110110','0110011','0110011','0111110','0110110','0110011','0110011','1111011'],
    'E': ['1111111','0110001','0110100','0111100','0110100','0110000','0110001','0110011','1111111'],
    'D': ['1111100','0110110','0110011','0110011','0110011','0110011','0110011','0110110','1111100'],
    'I': ['11111','00110','00110','00110','00110','00110','00110','00110','11111'],
    'V': ['1110111','0110010','0110010','0110010','0011100','0011100','0011100','0001000','0001000'],
    'U': ['1110111','0110010','0110010','0110010','0110010','0110010','0110010','0110010','0011100'],
    'N': ['1110011','0111010','0111110','0111110','0110110','0110110','0110010','0110010','1110011']
  };

  function drawWoodlandWord(word, centerX, startY, scale) {
    const letterGap = 2 * scale;
    let totalW = 0;
    for (let i = 0; i < word.length; i++) {
      const g = WOODLAND_GLYPHS[word[i]];
      if (g) totalW += g[0].length * scale + (i < word.length - 1 ? letterGap : 0);
    }

    let curX = Math.round(centerX - totalW / 2);
    for (let i = 0; i < word.length; i++) {
      const g = WOODLAND_GLYPHS[word[i]];
      if (!g) continue;
      const gw = g[0].length;
      const gh = g.length;

      if (word[i] !== ' ') {
        ctx.fillStyle = PAL.OUTLINE;
        for (let r = 0; r < gh; r++) {
          for (let c = 0; c < gw; c++) {
            if (g[r][c] === '1') {
              ctx.fillRect(curX + c * scale - 1, startY + r * scale - 1, scale + 2, scale + 2);
              ctx.fillRect(curX + c * scale + 2, startY + r * scale + 2, scale, scale);
            }
          }
        }

        for (let r = 0; r < gh; r++) {
          for (let c = 0; c < gw; c++) {
            if (g[r][c] === '1') {
              if (r <= 2) ctx.fillStyle = PAL.SNOW_LIGHT;
              else if (r <= 5) ctx.fillStyle = PAL.GOLD_LIGHT;
              else ctx.fillStyle = PAL.GOLD_MID;
              ctx.fillRect(curX + c * scale, startY + r * scale, scale, scale);
            }
          }
        }
      }

      curX += gw * scale + letterGap;
    }
  }

  function drawTitleCardScreen() {
    const elapsedSec = (performance.now() - titleStartTime) / 1000;
    const tAnim = frame * 0.04;
    const scrollPx = frame * 1.15;

    const horizonY = Math.floor(VIEW_H * 0.36);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, '#070614');
    skyGrad.addColorStop(0.5, '#141133');
    skyGrad.addColorStop(1, '#241B52');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, VIEW_W, horizonY);

    for (let i = 0; i < titleStars.length; i++) {
      const st = titleStars[i];
      const sx = Math.round(st.x * VIEW_W);
      const sy = Math.round(st.y * (horizonY - 6)) + 3;
      const twinkle = 0.35 + 0.55 * (Math.sin(tAnim * 1.6 + st.phase) * 0.5 + 0.5);
      if (st.size === 2) {
        ctx.fillStyle = `rgba(175, 185, 245, ${(twinkle * 0.28).toFixed(2)})`;
        ctx.fillRect(sx - 1, sy - 1, 4, 4);
      }
      ctx.fillStyle = `rgba(235, 238, 255, ${twinkle.toFixed(2)})`;
      ctx.fillRect(sx, sy, st.size, st.size);
    }

    const moonX = Math.floor(VIEW_W * 0.76);
    const moonY = Math.floor(horizonY * 0.34);
    ctx.fillStyle = 'rgba(170, 175, 235, 0.14)';
    ctx.fillRect(moonX - 10, moonY - 9, 24, 24);
    ctx.fillStyle = 'rgba(225, 228, 252, 0.36)';
    ctx.fillRect(moonX - 4, moonY - 5, 13, 16);
    ctx.fillRect(moonX - 6, moonY - 3, 16, 12);
    ctx.fillStyle = '#110E2B';
    ctx.fillRect(moonX - 7, moonY - 5, 11, 14);
    ctx.fillRect(moonX - 8, moonY - 3, 12, 10);

    const titleScale = 2;
    const topWordY = 8;
    const botWordY = topWordY + 9 * titleScale + 5;
    drawWoodlandWord('RED RIVER', Math.floor(VIEW_W / 2), topWordY, titleScale);
    drawWoodlandWord('RUN', Math.floor(VIEW_W / 2), botWordY, titleScale);

    const bottomShoreH = 14;
    const lakeH = VIEW_H - horizonY - bottomShoreH;
    const laneH = Math.floor(lakeH / 3);

    ctx.fillStyle = PAL.INDIGO_DEEP;
    ctx.fillRect(0, horizonY, VIEW_W, VIEW_H - horizonY);

    ctx.fillStyle = '#1D2D59';
    ctx.fillRect(0, horizonY, VIEW_W, 1);
    ctx.fillStyle = 'rgba(120, 135, 205, 0.14)';
    for (let ry = horizonY + 4; ry < VIEW_H - bottomShoreH - 4; ry += 6) {
      const shimmerW = 10 + Math.round(Math.sin((ry + frame * 0.18) * 0.5) * 6);
      const shimmerX = moonX - Math.floor(shimmerW / 2) + Math.round(Math.cos(ry * 0.35 + frame * 0.06) * 3);
      ctx.fillRect(shimmerX, ry, shimmerW, 2);
    }

    for (let wIdx = 0; wIdx < 4; wIdx++) {
      const wx = Math.round(VIEW_W + 40 - ((scrollPx * (0.95 + (wIdx % 2) * 0.25) + wIdx * 95) % (VIEW_W + 120)));
      const wy = horizonY + 8 + ((wIdx * 29) % Math.max(20, lakeH - 16));
      const waveW = 46;

      fillPixelPoly([
        [wx, wy + 7],
        [wx + 12, wy + 2],
        [wx + 22, wy],
        [wx + 35, wy + 3],
        [wx + waveW, wy + 7]
      ], PAL.INDIGO_MID);

      fillPixelPoly([
        [wx + 10, wy + 3],
        [wx + 15, wy],
        [wx + 24, wy],
        [wx + 29, wy + 2],
        [wx + 18, wy + 2]
      ], '#25427A');

      ctx.fillStyle = '#1B3463';
      ctx.fillRect(wx - 2, wy + 6, waveW + 4, 1);
    }

    ctx.fillStyle = PAL.INDIGO_MID;
    const rippleCount = Math.ceil(VIEW_W / 38) + 2;
    for (let i = 0; i < rippleCount; i++) {
      const rx = Math.round(((scrollPx * 0.65) + i * 38) % (VIEW_W + 40)) - 20;
      const ry = horizonY + 10 + ((i * 23) % Math.max(14, lakeH - 12));
      ctx.fillRect(rx, ry, 18, 2);
      ctx.fillStyle = '#1B3463';
      ctx.fillRect(rx + 4, ry, 7, 1);
      ctx.fillStyle = PAL.INDIGO_MID;
    }

    const midTrackY = horizonY + laneH + Math.floor((laneH - 15) / 2);
    drawCanoeAndHunter(Math.floor(VIEW_W * 0.24), midTrackY, frame, true, 1.0);

    const sy = VIEW_H - bottomShoreH;
    ctx.fillStyle = '#1D2D59';
    ctx.fillRect(0, sy - 1, VIEW_W, 1);
    ctx.fillStyle = '#13182B';
    ctx.fillRect(0, sy, VIEW_W, 5);
    ctx.fillStyle = '#0B0E1A';
    ctx.fillRect(0, sy + 5, VIEW_W, 5);
    ctx.fillStyle = PAL.SILHOUETTE;
    ctx.fillRect(0, sy + 10, VIEW_W, bottomShoreH - 10);

    const meanderPeriod = 340;
    const meanderW = 148;
    const taperW = 42;
    const reachH = Math.round(laneH * 0.88);
    for (let mBase = -meanderPeriod; mBase < VIEW_W + meanderPeriod; mBase += meanderPeriod) {
      const x0 = Math.round(mBase - ((scrollPx * 0.85) % meanderPeriod));
      const x1 = x0 + taperW;
      const x2 = x0 + meanderW - taperW;
      const x3 = x0 + meanderW;
      const peakY = sy - reachH;

      fillPixelPoly([[x0 - 3, sy],[x1, peakY - 2],[x2, peakY - 2],[x3 + 3, sy]], '#223A6B');
      fillPixelPoly([[x0, sy],[x1 + 2, peakY],[x2 - 2, peakY],[x3, sy]], '#121629');
      fillPixelPoly([[x0 + 6, sy],[x1 + 6, peakY + 3],[x2 - 6, peakY + 3],[x3 - 6, sy]], PAL.SILHOUETTE);

      drawShadedPine(x1 + 10, peakY - 6, false, true);
      drawShadedGrayRock(x1 + 32, peakY + 1, false, true);
      drawShadedPine(x2 - 18, peakY - 5, false, true);
    }

    if (elapsedSec >= 2.0) {
      const fadeInT = Math.min(1, (elapsedSec - 2.0) / 0.85);
      const pulse = 0.75 + Math.sin(tAnim * 2.2) * 0.25;
      const alpha = fadeInT * pulse;

      const promptY = VIEW_H - 9;
      ctx.save();
      ctx.globalAlpha = alpha;
      drawUnboxedLabel("PRESS 'A' TO START", Math.floor(VIEW_W / 2), promptY, false);
      ctx.restore();
    }

    if (isFadingFromTitle) {
      titleFadeOutAlpha = Math.min(1, titleFadeOutAlpha + 0.045);
      ctx.fillStyle = `rgba(5, 10, 8, ${titleFadeOutAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      if (titleFadeOutAlpha >= 1) {
        isFadingFromTitle = false;
        beginOpeningCutscene();
      }
    }
  }

  // ==========================================
  // 5. ENLARGED SNES SPRITES & DKC SILHOUETTE SHADING
  // ==========================================
  function drawCanoeHullOnly(x, y, frameCount, beached, silT = 0) {
    const bob = beached ? 0 : Math.sin(frameCount * 0.14) * 1;
    const py = Math.round(y + bob);

    const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
    const cHideL = lerpColor(PAL.HIDE_LIGHT, PAL.SIL_RIM_BRIGHT, silT);
    const cHideM = lerpColor(PAL.HIDE_MID, PAL.SILHOUETTE, silT);
    const cHideD = lerpColor(PAL.HIDE_DARK, PAL.SILHOUETTE, silT);
    const cSash = lerpColor(PAL.SASH_RED, '#D92648', silT);
    const cWoodD = lerpColor(PAL.WOOD_DARK, PAL.SILHOUETTE, silT);
    const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
    const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM, silT);

    if (!beached) {
      ctx.fillStyle = `rgba(0, 0, 0, ${(0.35 + silT * 0.25).toFixed(2)})`;
      ctx.fillRect(x + 4, py + 14, 36, 2);
    }

    ctx.fillStyle = cOut;
    ctx.fillRect(x + 3, py + 7, 38, 7);
    ctx.fillRect(x + 1, py + 5, 4, 4);
    ctx.fillRect(x + 39, py + 5, 4, 4);
    ctx.fillRect(x, py + 4, 2, 2);
    ctx.fillRect(x + 42, py + 4, 2, 2);

    ctx.fillStyle = cHideL;
    ctx.fillRect(x + 4, py + 7, 36, 2);
    ctx.fillRect(x + 2, py + 5, 3, 2);
    ctx.fillRect(x + 39, py + 5, 3, 2);
    ctx.fillRect(x + 1, py + 4, 2, 1);
    ctx.fillRect(x + 41, py + 4, 2, 1);

    ctx.fillStyle = cHideM;
    ctx.fillRect(x + 4, py + 9, 36, 3);
    ctx.fillRect(x + 2, py + 7, 2, 2);
    ctx.fillRect(x + 40, py + 7, 2, 2);

    ctx.fillStyle = cHideD;
    ctx.fillRect(x + 6, py + 12, 32, 2);

    ctx.fillStyle = cSash;
    ctx.fillRect(x + 7, py + 9, 3, 1);
    ctx.fillRect(x + 34, py + 9, 3, 1);
    ctx.fillStyle = cWoodD;
    ctx.fillRect(x + 12, py + 8, 1, 4);
    ctx.fillRect(x + 31, py + 8, 1, 4);

    if (!beached) {
      ctx.fillStyle = cOut;

      ctx.fillRect(x + 27, py + 4, 6, 3);
      ctx.fillStyle = cWoodL;
      ctx.fillRect(x + 28, py + 4, 4, 1);

  function drawFrontFacingCanoe(cx, cy, frameCount, hasPackage = false) {
    const bob = Math.sin(frameCount * 0.14) * 1;
    const py = Math.round(cy + bob);
    const strokePhase = Math.floor(frameCount / 7) % 4;

    ctx.fillStyle = PAL.MAROON_FOAM;
    ctx.fillRect(cx - 10, py + 11, 20, 1);
    ctx.fillRect(cx - 7, py + 13, 14, 1);

    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(cx - 6, py + 5, 12, 6);
    ctx.fillRect(cx - 4, py + 3, 8, 9);
    ctx.fillRect(cx - 2, py + 1, 4, 12);

    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(cx - 5, py + 6, 10, 4);
    ctx.fillRect(cx - 3, py + 4, 6, 7);

    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(cx - 5, py + 5, 10, 1);
    ctx.fillRect(cx - 1, py + 2, 2, 9);

    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(cx - 2, py + 7, 4, 1);

    if (hasPackage) {
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(cx - 3, py + 3, 6, 3);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(cx - 2, py + 3, 4, 1);
    }

    const hx = cx - 4;
    const hy = py - 5;
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(hx, hy + 4, 8, 6);
    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(hx + 1, hy + 4, 6, 5);
    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(hx + 2, hy + 4, 4, 4);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(hx + 1, hy + 7, 6, 1);

    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(hx + 1, hy - 1, 6, 5);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(hx + 1, hy - 1, 6, 2);
    ctx.fillStyle = '#C98E63';
    ctx.fillRect(hx + 2, hy + 1, 4, 3);

    const paddleDip = (strokePhase === 1 || strokePhase === 2) ? 2 : 0;
    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(cx + 4, hy + 3 + paddleDip, 2, 10);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(cx + 4, hy + 10 + paddleDip, 3, 4);
    if (paddleDip > 0) {
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(cx + 3, py + 11, 5, 1);
    }
  }

  function drawCanoeAndHunter(x, y, frameCount, hasPackage = true, forcedSilT = null) {
    if (isSledMode && forcedSilT === null) {
      drawDogSledAndHunter(x, y, frameCount, false, true);
      return;
    }

    const silT = forcedSilT !== null ? forcedSilT : (gameMode === 'TITLE' ? 1.0 : getSilhouetteFactor());
    const bob = Math.sin(frameCount * 0.14) * 1;
    const py = Math.round(y + bob);

    drawCanoeHullOnly(x, y, frameCount, !hasPackage, silT);

    if (hasPackage) {
      const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
      const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
      const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM_BRIGHT, silT);
      ctx.fillStyle = cOut;
      ctx.fillRect(x + 26, py + 3, 8, 4);
      ctx.fillStyle = cWoodM;
      ctx.fillRect(x + 27, py + 4, 6, 3);
      ctx.fillStyle = cWoodL;
      ctx.fillRect(x + 28, py + 4, 4, 1);
    }

    const cOut = lerpColor(PAL.OUTLINE, PAL.SILHOUETTE, silT);
    const cHideL = lerpColor(PAL.HIDE_LIGHT, PAL.SIL_RIM_BRIGHT, silT);
    const cHideM = lerpColor(PAL.HIDE_MID, PAL.SILHOUETTE, silT);
    const cSash = lerpColor(PAL.SASH_RED, '#D92648', silT);
    const cSkin = lerpColor('#C98E63', PAL.SILHOUETTE, silT);
    const cHair = lerpColor('#14110F', PAL.SILHOUETTE, silT);
    const cWoodD = lerpColor(PAL.WOOD_DARK, PAL.SILHOUETTE, silT);
    const cWoodM = lerpColor(PAL.WOOD_MID, PAL.SILHOUETTE, silT);
    const cWoodL = lerpColor(PAL.WOOD_LIGHT, PAL.SIL_RIM_BRIGHT, silT);

    const hx = x + 14;
    const hy = py - 5;

    ctx.fillStyle = cOut;
    ctx.fillRect(hx, hy + 5, 9, 7);
    ctx.fillStyle = cHideM;
    ctx.fillRect(hx + 1, hy + 6, 7, 5);
    ctx.fillStyle = cHideL;
    ctx.fillRect(hx + 1, hy + 6, 4, 3);

    ctx.fillStyle = cHideL;
    ctx.fillRect(hx + 1, hy + 11, 1, 1);
    ctx.fillRect(hx + 3, hy + 11, 1, 1);
    ctx.fillRect(hx + 5, hy + 11, 1, 1);
    ctx.fillRect(hx + 7, hy + 11, 1, 1);

    ctx.fillStyle = cSash;
    ctx.fillRect(hx + 1, hy + 9, 7, 2);

    ctx.fillStyle = cOut;
    ctx.fillRect(hx + 2, hy - 1, 6, 6);
    ctx.fillStyle = cSkin;
    ctx.fillRect(hx + 5, hy + 1, 2, 3);
    ctx.fillStyle = cHair;
    ctx.fillRect(hx + 2, hy - 1, 5, 2);
    ctx.fillRect(hx + 1, hy + 1, 4, 4);

    const strokeIdx = Math.floor(frameCount / 7);
    const strokePhase = strokeIdx % 4;
    const cycleNum = Math.floor(strokeIdx / 4);

    if (gameMode === 'PLAYING' && !isPaused && strokePhase === 1 && cycleNum % 2 === 1 && lastSplashStrokeId !== cycleNum) {
      lastSplashStrokeId = cycleNum;
      playPaddleSplashSound();
    }

    let handFrontX = hx + 7, handFrontY = hy + 7;
    let handBackX = hx + 3, handBackY = hy + 5;
    let bladeX = hx + 11, bladeY = py + 14;

    if (strokePhase === 0) {
      handFrontX = hx + 8; handFrontY = hy + 7;
      handBackX = hx + 4; handBackY = hy + 4;
      bladeX = hx + 12; bladeY = py + 14;
    } else if (strokePhase === 1) {
      handFrontX = hx + 6; handFrontY = hy + 7;
      handBackX = hx + 3; handBackY = hy + 4;
      bladeX = hx + 6; bladeY = py + 15;
    } else if (strokePhase === 2) {
      handFrontX = hx + 3; handFrontY = hy + 7;
      handBackX = hx + 0; handBackY = hy + 4;
      bladeX = hx - 2; bladeY = py + 14;
    } else {
      handFrontX = hx + 5; handFrontY = hy + 6;
      handBackX = hx + 2; handBackY = hy + 4;
      bladeX = hx + 4; bladeY = py + 11;
    }

    ctx.fillStyle = cHideL;
    ctx.fillRect(handBackX, handBackY, 3, 2);
    ctx.fillRect(handFrontX, handFrontY, 3, 2);

    const topX = handBackX;
    const topY = handBackY - 3;
    const steps = 11;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const sx = Math.round(topX + (bladeX - topX) * t);
      const sy = Math.round(topY + (bladeY - topY) * t);
      if (s >= 8) {
        ctx.fillStyle = cWoodD;
        ctx.fillRect(sx - 1, sy, 3, 2);
        ctx.fillStyle = cWoodL;
        ctx.fillRect(sx, sy, 2, 1);
      } else {
        ctx.fillStyle = cWoodM;
        ctx.fillRect(sx, sy, 1, 1);
      }
    }

    if (strokePhase !== 3) {
      ctx.fillStyle = lerpColor(PAL.SNOW_LIGHT, '#4C78BD', silT);
      ctx.fillRect(bladeX - 2, py + 14, 5, 1);
      if (cycleNum % 2 === 1 && (strokePhase === 1 || strokePhase === 2)) {
        ctx.fillRect(bladeX - 4, py + 13, 2, 1);
        ctx.fillRect(bladeX + 3, py + 13, 2, 1);
        ctx.fillRect(bladeX - 1, py + 12, 1, 1);
      }
    }
  }

  function drawDogSledAndHunter(x, y, frameCount, stationary, hasCargo = true, showHunterOnSled = true) {
    const py = Math.round(y);
    const runStep = stationary ? 0 : (Math.floor(frameCount / 5) % 2);

    for (let d = 0; d < 2; d++) {
      const dx = x + 28 + d * 13;
      const dy = py + 5 + (!stationary && d === runStep ? 0 : 1);
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(x + 22, py + 9, dx - (x + 22), 1);

      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(dx, dy, 9, 5);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(dx + 1, dy + 1, 7, 3);
      ctx.fillStyle = PAL.STONE_DARK;
      ctx.fillRect(dx + 7, dy - 3, 4, 4);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(dx + 8, dy - 2, 3, 2);
      ctx.fillStyle = PAL.STONE_MID;
      ctx.fillRect(dx - 2, dy - 1, 2, 3);

      ctx.fillStyle = PAL.SNOW_LIGHT;
      if (runStep === 0 || stationary) {
        ctx.fillRect(dx, dy + 5, 2, 3);

    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 2, py + 12, 21, 2);
    ctx.fillRect(x + 21, py + 7, 3, 6);
    ctx.fillStyle = PAL.WOOD_LIGHT;
    ctx.fillRect(x + 3, py + 10, 18, 2);

    if (hasCargo) {
      ctx.fillStyle = PAL.HIDE_DARK;
      ctx.fillRect(x + 10, py + 5, 9, 5);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 11, py + 5, 7, 3);
    }

    if (showHunterOnSled) {
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(x + 1, py, 8, 11);
      ctx.fillStyle = PAL.HIDE_DARK;
      ctx.fillRect(x + 2, py + 1, 6, 9);
      ctx.fillStyle = PAL.HIDE_LIGHT;
      ctx.fillRect(x + 3, py + 2, 4, 6);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(x + 2, py + 6, 6, 2);
      ctx.fillStyle = PAL.HIDE_MID;
      ctx.fillRect(x + 2, py - 4, 6, 5);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(x + 6, py - 3, 2, 3);
      ctx.fillStyle = '#C98E63';
      ctx.fillRect(x + 5, py - 2, 2, 2);
    }
  }

    ctx.fillRect(x + 7, y + 4, 8, 8);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(x + 8, y + 5, 6, 6);
    ctx.fillStyle = PAL.WOOD_DARK;
    if (wheelSpin === 0) {
      ctx.fillRect(x + 10, y + 4, 2, 8);
      ctx.fillRect(x + 7, y + 7, 8, 2);
    } else {
      ctx.fillRect(x + 8, y + 5, 2, 2);
      ctx.fillRect(x + 12, y + 9, 2, 2);
      ctx.fillRect(x + 12, y + 5, 2, 2);
      ctx.fillRect(x + 8, y + 9, 2, 2);
    }
  }

  function drawOpeningCutscene() {
    const f = openingFrame;
    const animTick = awaitingOpeningConfirm ? frame : f;
    const hudH = 36;
    const horizonY = hudH + Math.floor((VIEW_H - hudH) * 0.24);
    const riverTopY = horizonY + 18;
    const riverH = VIEW_H - riverTopY;
    const laneH = Math.floor(riverH / 3);
    const midY = riverTopY + laneH + Math.floor((laneH - 15) / 2);

    drawParallaxSky(horizonY, PAL.DAY_SKY_T, PAL.DAY_SKY_M, PAL.DAY_SKY_B, 0, animTick * 0.4);

    ctx.fillStyle = PAL.GOLD_LIGHT;
    ctx.fillRect(0, horizonY, VIEW_W, 6);
    ctx.fillStyle = PAL.GOLD_MID;
    ctx.fillRect(0, horizonY + 6, VIEW_W, 6);
    ctx.fillStyle = PAL.GOLD_DARK;
    ctx.fillRect(0, horizonY + 12, VIEW_W, 6);

    ctx.fillStyle = PAL.MAROON_DEEP;
    ctx.fillRect(0, riverTopY, VIEW_W, riverH);
    ctx.fillStyle = PAL.MAROON_MID;
    ctx.fillRect(0, riverTopY, VIEW_W, 6);

    const assiniTopX = 42;
    const forksJoinX = 68;
    fillPixelPoly([
      [assiniTopX - 10, horizonY],
      [assiniTopX + 10, horizonY],
      [forksJoinX + 18, riverTopY + 3],
      [forksJoinX - 18, riverTopY + 3]
    ], PAL.MAROON_DEEP);
    fillPixelPoly([
      [assiniTopX + 9, horizonY],
      [assiniTopX + 12, horizonY],
      [forksJoinX + 20, riverTopY + 3],
      [forksJoinX + 17, riverTopY + 3]
    ], PAL.MAROON_FOAM);

    drawShadedPine(14, horizonY - 12, false, false);
    drawShadedPine(VIEW_W - 32, horizonY - 12, false, false);

    const fortX = 92;
    const fortY = horizonY - 10;
    let fortNudgeX = 0;
    if (f >= 128 && f <= 136) {
      fortNudgeX = (f % 4 < 2) ? 2 : 0;
    } else if (f >= 318 && f <= 326) {
      fortNudgeX = (f % 4 < 2) ? 2 : 0;
    }
    drawFortLandmark(fortX + fortNudgeX, fortY, 'UPPER_FORT', false, false);

    const cartTargetX = fortX + 54;
    const cartX = f < 120
      ? Math.round(VIEW_W + 24 - (f / 120) * (VIEW_W + 24 - cartTargetX))
      : cartTargetX;
    drawRedRiverCart(cartX, horizonY - 9, animTick, f < 120);

    const gateX = fortX + 15;
    const gateY = horizonY - 3;
    if (f >= 112 && f <= 132) {
      const ct = (f - 112) / 20;
      const cmX = Math.round(cartTargetX - 4 + (gateX - (cartTargetX - 4)) * ct);
      drawWalkingVoyageur(cmX, gateY, animTick, true);
    }

    if (f >= 136 && f <= 214) {
      const flashIdx = Math.floor((f - 136) / 13);
      if (flashIdx % 2 === 0) {
        const exX = fortX + 16;
        const exY = fortY - 26;
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(exX - 2, exY - 1, 6, 12);
        ctx.fillStyle = PAL.SASH_RED;
        ctx.fillRect(exX - 1, exY, 4, 10);
        ctx.fillStyle = PAL.GOLD_LIGHT;
        ctx.fillRect(exX, exY + 1, 2, 5);
        ctx.fillRect(exX, exY + 8, 2, 2);
      }
    }

    const assiniDockX = 56;
    const assiniDockY = horizonY + 7;
    if (f >= 185 && f < 275) {
      const ct = (f - 185) / 90;
      const cx = Math.round(assiniTopX + (assiniDockX - assiniTopX) * ct);
      const cy = Math.round((horizonY - 4) + (assiniDockY - (horizonY - 4)) * ct);
      drawFrontFacingCanoe(cx, cy, animTick, false);
    } else if (f >= 275 && f < 475) {
      drawFrontFacingCanoeEmpty(assiniDockX, assiniDockY, animTick);
    }

    if (f >= 275 && f < 320) {
      const wt = (f - 275) / 45;
      const wx = Math.round(assiniDockX + 6 + (gateX - (assiniDockX + 6)) * wt);
      const wy = Math.round(assiniDockY - 3 + (gateY - (assiniDockY - 3)) * wt);
      drawWalkingVoyageur(wx, wy, animTick, false);
    } else if (f >= 420 && f < 475) {
      const wt = (f - 420) / 55;
      const wx = Math.round(gateX + (assiniDockX + 6 - gateX) * wt);
      const wy = Math.round(gateY + (assiniDockY - 3 - gateY) * wt);
      drawWalkingVoyageur(wx, wy, animTick, true);
    }

    if (f >= 325 && f <= 420) {
      const boxW = Math.min(VIEW_W - 18, 296);
      const boxX = Math.floor((VIEW_W - boxW) / 2);
      const boxY = 6;
      const boxH = awaitingOpeningConfirm ? 44 : 33;

      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(boxX - 2, boxY - 2, boxW + 4, boxH + 4);
      ctx.fillStyle = '#0F241A';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = PAL.GOLD_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);

      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('This package is highly urgent and must get to', Math.floor(VIEW_W / 2), boxY + 12);
      ctx.fillText('York Factory as soon as possible...no matter the weather!', Math.floor(VIEW_W / 2), boxY + 24);

      if (awaitingOpeningConfirm) {
        const blinkOn = Math.floor(frame / 18) % 2 === 0;
        if (blinkOn) {
          ctx.fillStyle = PAL.GOLD_LIGHT;
          ctx.fillText("PRESS 'A' TO DEPART", Math.floor(VIEW_W / 2), boxY + 37);
        }
      }
      ctx.textAlign = 'left';
    }

    if (f >= 475) {
      const pt = Math.min(1, (f - 475) / (OPENING_TOTAL - 475));
      if (pt < 0.42) {
        const st = pt / 0.42;
        const cx = Math.round(assiniDockX + (forksJoinX - assiniDockX) * st);
        const cy = Math.round(assiniDockY + (midY - assiniDockY) * st);
        drawFrontFacingCanoe(cx, cy, animTick, true);
      } else {
        const rt = (pt - 0.42) / 0.58;
        const cx = Math.round((forksJoinX - 18) * (1 - rt) + 20 * rt);
        drawCanoeAndHunter(cx, midY, animTick, true, 0);
      }
    }

    drawStBonifaceTwinSteeples(VIEW_W - 66, VIEW_H);

    if (f < 30) {
      const alpha = 1 - f / 30;
      ctx.fillStyle = `rgba(5, 10, 8, ${alpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  function drawFrontFacingCanoeEmpty(cx, cy, frameCount) {
    const bob = Math.sin(frameCount * 0.1) * 0.5;
    const py = Math.round(cy + bob);
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(cx - 6, py + 5, 12, 6);
    ctx.fillRect(cx - 4, py + 3, 8, 9);
    ctx.fillRect(cx - 2, py + 1, 4, 12);
    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(cx - 5, py + 6, 10, 4);
    ctx.fillRect(cx - 3, py + 4, 6, 7);
    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(cx - 5, py + 5, 10, 1);
    ctx.fillRect(cx - 1, py + 2, 2, 9);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(cx - 2, py + 7, 4, 1);
  }

  function drawWalkingVoyageur(wx, wy, frameCount, carryingPackage) {
    const stepBob = Math.floor(frameCount / 6) % 2;
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(wx, wy, 7, 10);
    ctx.fillStyle = PAL.HIDE_MID;
    ctx.fillRect(wx + 1, wy + 1, 5, 7);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(wx + 1, wy + 5, 5, 1);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(wx + 1, wy - 3, 5, 4);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(wx + 1 + stepBob, wy + 9, 2, 2);
    ctx.fillRect(wx + 4 - stepBob, wy + 9, 2, 2);

    if (carryingPackage) {
      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(wx - 3, wy + 2, 6, 4);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(wx - 2, wy + 3, 4, 2);
    }
  }

  function drawHBCBarqueShip(x, waterY, frameCount) {
    const bob = Math.sin(frameCount * 0.06) * 1;
    const sy = Math.round(waterY + bob);

    fillPixelPoly([[x, sy - 6],[x + 68, sy - 6],[x + 62, sy + 4],[x + 8, sy + 4]], PAL.OUTLINE);
    fillPixelPoly([[x + 2, sy - 5],[x + 66, sy - 5],[x + 60, sy + 3],[x + 9, sy + 3]], PAL.WOOD_DARK);
    ctx.fillStyle = PAL.HIDE_LIGHT;
    ctx.fillRect(x + 5, sy - 2, 56, 2);
    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(x + 66, sy - 7, 14, 2);

    const masts = [x + 18, x + 36, x + 52];
    const mastHeights = [30, 36, 26];
    for (let m = 0; m < 3; m++) {
      const mx = masts[m];
      const mh = mastHeights[m];
      ctx.fillStyle = PAL.WOOD_LIGHT;
      ctx.fillRect(mx, sy - 6 - mh, 2, mh);

      ctx.fillStyle = PAL.SNOW_MID;
      ctx.fillRect(mx - 6, sy - 6 - mh + 5, 14, 7);
      ctx.fillRect(mx - 7, sy - 6 - mh + 15, 16, 8);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(mx - 5, sy - 6 - mh + 5, 11, 3);
      ctx.fillRect(mx - 6, sy - 6 - mh + 15, 13, 3);
    }

    ctx.fillStyle = 'rgba(20, 20, 20, 0.55)';
    ctx.fillRect(x + 6, sy - 18, 12, 1);
    ctx.fillRect(x + 54, sy - 20, 14, 1);

    const flagWave = Math.floor(frameCount / 8) % 2;
    const fx = x + 38;
    const fy = sy - 44;
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(fx, fy, 11, 6);
    ctx.fillRect(fx + 10, fy + flagWave, 3, 5);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(fx, fy, 4, 3);
    ctx.fillStyle = PAL.SNOW_LIGHT;
    ctx.fillRect(fx + 5, fy + 2, 4, 2);

    ctx.fillStyle = PAL.WOOD_MID;
    ctx.fillRect(x - 10, sy - 4, 14, 2);
  }

  function drawClosingCutscene() {
    const f = closingFrame;
    const hudH = 36;
    const horizonY = hudH + Math.floor((VIEW_H - hudH) * 0.22);
    const riverTopY = horizonY + 4;
    const riverH = VIEW_H - riverTopY;

    const panT = f <= 170 ? 0 : Math.min(1, (f - 170) / 145);
    const camX = Math.round(panT * 155);

    drawParallaxSky(horizonY, '#5E9AC2', '#94C2DE', '#C9E2F0', 0, camX + f * 0.35);

    const coastSplitWorldX = 185;
    const coastSplitScreenX = coastSplitWorldX - camX;

    if (coastSplitScreenX > 0) {
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(0, horizonY, coastSplitScreenX, VIEW_H - horizonY);
      ctx.fillStyle = PAL.SNOW_MID;
      ctx.fillRect(0, riverTopY, coastSplitScreenX, riverH);
    }

    if (coastSplitScreenX < VIEW_W) {
      const bayStartX = Math.max(0, coastSplitScreenX);
      ctx.fillStyle = PAL.BAY_DEEP;
      ctx.fillRect(bayStartX, horizonY, VIEW_W - bayStartX, VIEW_H - horizonY);
      ctx.fillStyle = PAL.BAY_MID;
      ctx.fillRect(bayStartX, horizonY + 4, VIEW_W - bayStartX, 14);
      ctx.fillStyle = PAL.BAY_FOAM;
      ctx.fillRect(bayStartX, horizonY, VIEW_W - bayStartX, 1);

      for (let bx = bayStartX + 10; bx < VIEW_W; bx += 36) {
        const shimmer = Math.round(Math.sin((bx + f * 0.3) * 0.1) * 2);
        ctx.fillStyle = PAL.BAY_FOAM;
        ctx.fillRect(bx + shimmer, horizonY + 18, 14, 1);
        ctx.fillRect(bx + 8 - shimmer, horizonY + 34, 18, 1);
      }

      if (coastSplitScreenX > -45) {
        ctx.fillStyle = PAL.WOOD_DARK;
        ctx.fillRect(coastSplitScreenX - 6, horizonY + 6, 48, 5);
        ctx.fillStyle = PAL.WOOD_LIGHT;
        ctx.fillRect(coastSplitScreenX - 6, horizonY + 6, 48, 2);
      }
    }

    const fortWorldX = 65;
    const fortScreenX = fortWorldX - camX;
    const fortY = horizonY - 11;
    if (fortScreenX > -60) {
      drawFortLandmark(fortScreenX, fortY, 'YORK_FACTORY', false, false);
      drawShadedPine(fortScreenX - 18, horizonY - 10, true, false);
      drawDogSledAndHunter(fortScreenX - 24, riverTopY + 8, f, true, false, false);
    }

    const shipWorldX = 222;
    const shipScreenX = shipWorldX - camX;
    if (shipScreenX < VIEW_W + 20) {
      drawHBCBarqueShip(shipScreenX, horizonY + 9, f);
    }

    const doorWorldX = fortWorldX + 20;
    if (f < 105) {
      const wt = f / 105;
      const trapperWorldX = Math.round((fortWorldX - 16) + (doorWorldX - (fortWorldX - 16)) * wt);
      const trapperWorldY = Math.round((riverTopY + 8) + (fortY + 6 - (riverTopY + 8)) * wt);
      drawWalkingVoyageur(trapperWorldX - camX, trapperWorldY, f, true);
    }

    if (f >= 125 && f <= 355) {
      const walkProgress = (f - 125) / 230;
      const factorWorldX = Math.round(doorWorldX + (shipWorldX + 18 - doorWorldX) * walkProgress);
      const factorWorldY = Math.round((fortY + 6) + ((horizonY + 1) - (fortY + 6)) * Math.min(1, walkProgress * 1.4));
      const fx = factorWorldX - camX;
      const fy = factorWorldY;
      const stepBob = Math.floor(f / 5) % 2;

      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx, fy, 7, 11);
      ctx.fillStyle = PAL.SUIT_DARK;
      ctx.fillRect(fx + 1, fy + 1, 5, 8);
      ctx.fillStyle = PAL.SUIT_MID;
      ctx.fillRect(fx + 2, fy + 2, 2, 6);
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(fx + 4, fy + 1, 2, 3);
      ctx.fillStyle = '#E0AC84';
      ctx.fillRect(fx + 3, fy - 2, 3, 3);
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx + 1, fy - 3, 7, 1);
      ctx.fillRect(fx + 2, fy - 7, 5, 4);
      ctx.fillStyle = PAL.SUIT_MID;
      ctx.fillRect(fx + 3, fy - 6, 2, 3);

      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(fx + 1 + stepBob, fy + 9, 2, 3);
      ctx.fillRect(fx + 4 - stepBob, fy + 9, 2, 3);

      ctx.fillStyle = PAL.WOOD_MID;
      ctx.fillRect(fx + 4, fy + 3, 6, 4);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(fx + 5, fy + 4, 4, 2);
    }

    if (f > 355) {
      const fadeAlpha = Math.min(1, (f - 355) / 60);
      ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  function drawDeploymentSequence(horizonY, riverTopY, laneH) {
    const beachX = Math.round(VIEW_W * 0.44 - deployProgress * 26);
    const shoreTopY = riverTopY;
    const shoreBotY = VIEW_H;

    fillPixelPoly([[beachX + 24, shoreTopY],[VIEW_W, shoreTopY],[VIEW_W, shoreBotY],[beachX - 10, shoreBotY]], PAL.SNOW_MID);
    fillPixelPoly([[beachX + 32, shoreTopY],[VIEW_W, shoreTopY],[VIEW_W, shoreBotY],[beachX, shoreBotY]], PAL.SNOW_LIGHT);
    fillPixelPoly([[beachX + 20, shoreTopY],[beachX + 25, shoreTopY],[beachX - 9, shoreBotY],[beachX - 14, shoreBotY]], PAL.ICE_MID);

    const postX = Math.max(24, beachX - 12);
    drawFortLandmark(postX, horizonY - 11, 'NORWAY_HOUSE', true, false);

    drawShadedPine(beachX + 68, shoreTopY + 8, true, false);
    drawShadedGrayRock(beachX + 86, shoreTopY + 20, true, false);
    drawShadedPine(beachX + 48, shoreTopY + laneH * 2 - 4, true, false);

    const midY = riverTopY + laneH + Math.floor((laneH - 15) / 2);

    if (deployProgress < 0.35) {
      const t = deployProgress / 0.35;
      const cx = Math.round(16 + t * (beachX - 24));
      drawCanoeAndHunter(cx, midY, frame, true);
    } else if (deployProgress < 0.72) {
      const t = (deployProgress - 0.35) / 0.37;
      const beachedX = beachX - 8;
      drawCanoeHullOnly(beachedX, midY - 12, frame, true, 0);

      const sledX = beachX + 18;
      drawDogSledAndHunter(sledX, midY + 4, frame, true, true, false);

      const walkX = Math.round(beachedX + 18 + t * 14);
      const walkY = Math.round(midY - 8 + t * 10);
      const hasParka = t > 0.45;
      ctx.fillStyle = PAL.OUTLINE;
      ctx.fillRect(walkX, walkY, 7, 10);
      ctx.fillStyle = hasParka ? PAL.HIDE_DARK : PAL.HIDE_MID;
      ctx.fillRect(walkX + 1, walkY + 1, 5, 8);
      ctx.fillStyle = PAL.SASH_RED;
      ctx.fillRect(walkX + 1, walkY + 5, 5, 1);
      ctx.fillStyle = hasParka ? PAL.SNOW_LIGHT : '#14110F';
      ctx.fillRect(walkX + 1, walkY - 3, 5, 4);

      drawUnboxedLabel('DEPLOYING DOGSLED AT NORWAY HOUSE!', Math.floor(VIEW_W / 2), riverTopY + 12, false);
    } else {
      const t = (deployProgress - 0.72) / 0.28;
      drawCanoeHullOnly(beachX - 18, midY - 12, frame, true, 0);
      const launchX = Math.round((beachX + 18) * (1 - t) + 16 * t);
      drawDogSledAndHunter(launchX, midY, frame, false, true, true);
    }
  }

  // ==========================================
  // 6B. REGIONAL SCENERY PROPS & UNIQUE LANDMARKS
  // ==========================================
  function drawTallPrairieGrasses(x, y) {
    ctx.fillStyle = PAL.MID_PINE;
    ctx.fillRect(x, y - 3, 1, 4);
    ctx.fillRect(x + 2, y - 4, 1, 5);
    ctx.fillRect(x + 5, y - 2, 1, 3);
    ctx.fillRect(x + 9, y - 4, 1, 5);
    ctx.fillRect(x + 12, y - 3, 1, 4);
    ctx.fillStyle = PAL.CHARTREUSE_L;
    ctx.fillRect(x + 1, y - 3, 1, 4);
    ctx.fillRect(x + 4, y - 4, 1, 5);
    ctx.fillRect(x + 10, y - 3, 1, 4);
    ctx.fillStyle = PAL.GOLD_LIGHT;
    ctx.fillRect(x + 7, y - 2, 1, 3);
  }

  function drawShadedGrayRock(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 3, y + 1, 14, 3);
      ctx.fillRect(x + 1, y + 3, 18, 5);
      ctx.fillRect(x, y + 6, 20, 3);
      ctx.fillStyle = PAL.SIL_RIM_BRIGHT;
      ctx.fillRect(x + 4, y + 1, 11, 1);
      ctx.fillRect(x + 2, y + 3, 4, 1);
      return;
    }
    ctx.fillStyle = PAL.ROCK_OUTLINE;
    ctx.fillRect(x + 3, y + 1, 14, 3);
    ctx.fillRect(x + 1, y + 3, 18, 5);
    ctx.fillRect(x, y + 6, 20, 3);

    ctx.fillStyle = PAL.ROCK_DARK;
    ctx.fillRect(x + 1, y + 5, 18, 3);
    ctx.fillStyle = PAL.ROCK_MID;
    ctx.fillRect(x + 2, y + 2, 15, 4);
    ctx.fillStyle = isWinter ? PAL.SNOW_LIGHT : PAL.ROCK_LIGHT;
    ctx.fillRect(x + 3, y + 2, 10, 2);
    ctx.fillRect(x + 2, y + 4, 5, 1);
  }

  function drawShadedPine(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 5, y, 2, 14);
      ctx.fillRect(x + 3, y + 3, 6, 3);
      ctx.fillRect(x + 2, y + 6, 8, 3);
      ctx.fillRect(x + 1, y + 9, 10, 3);
      ctx.fillStyle = PAL.SIL_RIM;
      ctx.fillRect(x + 5, y, 1, 11);
      return;
    }
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 5, y + 11, 2, 4);

    const cDark = isWinter ? PAL.SNOW_DARK : PAL.DARK_PINE;
    const cMid = isWinter ? PAL.SNOW_MID : PAL.MID_PINE;
    const cLight = isWinter ? PAL.SNOW_LIGHT : PAL.LIGHT_PINE;

    ctx.fillStyle = cDark;
    ctx.fillRect(x + 4, y, 4, 4);
    ctx.fillRect(x + 2, y + 4, 8, 4);
    ctx.fillRect(x + 1, y + 8, 10, 4);

    ctx.fillStyle = cMid;
    ctx.fillRect(x + 4, y, 3, 3);
    ctx.fillRect(x + 3, y + 4, 6, 3);
    ctx.fillRect(x + 2, y + 8, 7, 3);

    ctx.fillStyle = cLight;
    ctx.fillRect(x + 4, y + 1, 2, 2);
    ctx.fillRect(x + 3, y + 4, 3, 2);
    ctx.fillRect(x + 2, y + 8, 4, 2);
  }

  function drawEasternCedar(x, y, isWinter, isSil) {
    if (isSil) {
      ctx.fillStyle = PAL.SILHOUETTE;
      ctx.fillRect(x + 4, y + 1, 4, 13);
      ctx.fillRect(x + 2, y + 4, 8, 4);
      ctx.fillRect(x, y + 8, 12, 4);
      ctx.fillStyle = PAL.SIL_RIM;
      ctx.fillRect(x + 4, y + 1, 2, 2);
      return;
    }
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(x + 5, y + 11, 2, 4);

    ctx.fillStyle = PAL.CEDAR_DARK;
    ctx.fillRect(x + 3, y + 1, 6, 4);
    ctx.fillRect(x + 1, y + 5, 10, 4);
    ctx.fillRect(x, y + 8, 12, 4);

    ctx.fillStyle = PAL.CEDAR_MID;
    ctx.fillRect(x + 3, y + 1, 5, 3);
    ctx.fillRect(x + 2, y + 5, 8, 3);
    ctx.fillRect(x + 1, y + 8, 9, 3);

    ctx.fillStyle = isWinter ? PAL.SNOW_LIGHT : PAL.CEDAR_LIGHT;
    ctx.fillRect(x + 4, y + 1, 4, 2);
    ctx.fillRect(x + 2, y + 5, 6, 1);
    ctx.fillRect(x + 1, y + 8, 7, 1);
  }

  // Grounded Red River Log Cabin (spills forward onto the riverbank toward the river)
  function drawSettlerLogHouse(x, y) {
    ctx.fillStyle = PAL.OUTLINE;
    ctx.fillRect(x, y + 4, 20, 10);

  function drawBattleOfSevenOaks(lm, y, frameCount) {
    const x = Math.round(lm.x);
    if (!lm.triggered && x <= 78) {
      lm.triggered = true;
      lm.triggerFrame = frameCount;
      playTone(120, 'sawtooth', 0.16, 0.14);
    }

    const elapsed = lm.triggered ? (frameCount - lm.triggerFrame) : -1;
    const isFiring = (elapsed >= 0 && elapsed <= 18);
    const isHit = (elapsed >= 12 && elapsed <= 18);
    const isFallen = (elapsed >= 17);

    drawShadedPine(x - 46, y - 12, false, false);
    drawShadedPine(x - 34, y - 11, false, false);
    drawShadedPine(x - 22, y - 13, false, false);
    drawShadedPine(x - 10, y - 11, false, false);

    drawRedRiverCart(x + 16, y - 4, frameCount, false);

    const mx1 = x + 36;
    const my1 = y - 1;
    ctx.fillStyle = '#3B2314';
    ctx.fillRect(mx1, my1 + 4, 9, 4);
    ctx.fillRect(mx1 + 7, my1 + 1, 3, 4);
    ctx.fillStyle = '#1F120A';
    ctx.fillRect(mx1 + 1, my1 + 8, 1, 3);
    ctx.fillRect(mx1 + 7, my1 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx1 + 2, my1 - 1, 4, 5);
    ctx.fillStyle = PAL.SASH_RED;
    ctx.fillRect(mx1 + 2, my1 + 2, 4, 1);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx1 + 3, my1 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx1 + 5, my1 + 1, 6, 1);

    const mx2 = x + 50;
    const my2 = y;
    ctx.fillStyle = '#5C3A21';
    ctx.fillRect(mx2, my2 + 4, 9, 4);
    ctx.fillRect(mx2 + 7, my2 + 1, 3, 4);
    ctx.fillStyle = '#2B1810';
    ctx.fillRect(mx2 + 1, my2 + 8, 1, 3);
    ctx.fillRect(mx2 + 7, my2 + 8, 1, 3);
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(mx2 + 2, my2 - 1, 4, 5);
    ctx.fillStyle = '#14110F';
    ctx.fillRect(mx2 + 3, my2 - 3, 3, 2);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(mx2 + 5, my2 + 1, 6, 1);

    const gx1 = x + 62;
    const gx2 = x + 70;
    ctx.fillStyle = PAL.NWC_BLUE;
    ctx.fillRect(gx1, y + 4, 4, 4);
    ctx.fillRect(gx2, y + 5, 4, 4);
    ctx.fillStyle = PAL.WOOD_DARK;
    ctx.fillRect(gx1 + 3, y + 5, 5, 1);
    ctx.fillRect(gx2 + 3, y + 6, 5, 1);
    ctx.fillStyle = PAL.CHARTREUSE_L;
    ctx.fillRect(gx1 - 1, y + 4, 1, 6);
    ctx.fillRect(gx1 + 2, y + 3, 1, 7);
    ctx.fillRect(gx1 + 5, y + 5, 1, 5);
    ctx.fillRect(gx2 + 1, y + 4, 1, 6);
    ctx.fillRect(gx2 + 4, y + 4, 1, 6);

    if (isFiring) {
      const puffR = elapsed < 8 ? 3 : 4;
      ctx.fillStyle = PAL.SNOW_LIGHT;
      ctx.fillRect(mx1 + 11, my1, puffR, 3);
      ctx.fillRect(mx2 + 11, my2, puffR, 3);
      ctx.fillRect(gx1 + 8, y + 4, puffR, 2);
      ctx.fillRect(gx2 + 8, y + 5, puffR, 2);

      const shotProgress = Math.min(1, elapsed / 14);
      const shotX = Math.round(gx2 + 10 + shotProgress * 26);
      ctx.fillStyle = PAL.GOLD_LIGHT;
      ctx.fillRect(shotX, y + 2, 3, 1);
      ctx.fillRect(shotX - 3, y + 5, 3, 1);
      ctx.fillRect(shotX + 2, y + 7, 3, 1);
    }

    const hbcPositions = [x + 96, x + 103, x + 110, x + 117];
    for (let i = 0; i < hbcPositions.length; i++) {
      const hx = hbcPositions[i];
      if (!isFallen) {
        ctx.fillStyle = isHit ? PAL.SNOW_LIGHT : PAL.HBC_COAT;
        ctx.fillRect(hx, y + 3, 4, 5);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 1, y + 8, 1, 3);
        ctx.fillRect(hx + 3, y + 8, 1, 3);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx, y, 4, 2);
        ctx.fillStyle = '#C98E63';
        ctx.fillRect(hx + 1, y + 2, 2, 1);
      } else {
        ctx.fillStyle = PAL.HBC_COAT;
        ctx.fillRect(hx - 1, y + 9, 6, 2);
        ctx.fillStyle = PAL.OUTLINE;
        ctx.fillRect(hx + 5, y + 9, 2, 2);
      }
    }

    drawShadedPine(x + 128, y - 12, false, false);
    drawShadedPine(x + 140, y - 11, false, false);
    drawShadedPine(x + 152, y - 13, false, false);

    drawUnboxedLabel("Battle of Seven Oaks", x + 56, y - 18, false);
  }

    if (type === 'LOWER_FORT_GARRY') {
