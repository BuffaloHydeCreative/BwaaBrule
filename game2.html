<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- DYNAMIC FULL-BLEED VIEWPORT SCALING ---
const BASE_H = 400;
let VIEW_W = 600;
let VIEW_H = 400;
let HIT_ZONE_X = 100;

function resizeViewport() {
  const ww = window.innerWidth || 600;
  const wh = window.innerHeight || 400;
  const aspect = ww / Math.max(1, wh);
  VIEW_H = BASE_H;
  VIEW_W = Math.max(360, Math.round(BASE_H * aspect));
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;
  HIT_ZONE_X = Math.max(72, Math.min(130, Math.round(VIEW_W * 0.18)));
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeViewport);
resizeViewport();

// --- 1855 RED RIVER MICHIF KITCHEN PARTY PALETTE ---
const PAL = {
  INK: '#0E0705',
  LOG_DARK: '#2C160C',
  LOG_MID: '#4D2817',
  LOG_LIGHT: '#733E24',
  CHINKING: '#C8B896',
  FLOOR_DARK: '#241209',
  FLOOR_MID: '#3D2011',

  FIRE_GOLD: '#F7C844',
  CAPOTE_BLUE: '#1A3E6C',

  SASH_RED: '#C51E40',

  SASH_GOLD: '#F2A922',

  SKIN_SHADE: '#B87E56',
  HAIR_DARK: '#1C110B',
  BEARD_GREY: '#9EA4AB',
  BUFFALO_FUR: '#3B2314',
  WHITE: '#FFFFFF',
  DIM: '#6B5B52'
};

// --- MUSICAL & SEQUENCER STATE ---
let currentBPM = 138;
const LOOKAHEAD = 25.0;
const SCHEDULE_AHEAD_TIME = 2.0;
const TOLERANCE_PERFECT = 0.075;
const TOLERANCE_GOOD = 0.145;
const NOTE_SPEED = 290;

// Game Modes: 'BAND' (DAW-Band Control) | 'JIG' (Rhythm Match-the-Beat Mode)
let controlMode = 'BAND';
let isPaused = false;
let cursorIdx = 2; // 0: Fiddle 1, 1: Fiddle 2, 2: Central Jigger, 3: Spoons/Bones, 4: Voyageur Caller

// Band Configuration — Opens directly on the true Red River Jig with one "Push Up"
const band = {
  fiddle1On: true,
  fiddle2On: true,
  fiddleMode: 'UNISON', // 'UNISON' | 'COMPLEMENTARY' | 'BATTLE'
  percOn: true,
  percInstrument: 'SPOONS', // 'SPOONS' | 'BONES'
  percStyle: 'GALLOP', // 'STEADY' | 'GALLOP' | 'ROLL'
  callerOn: true,
  callerSong: 'SHOUTS' // 'SHOUTS' | 'AVIRON' | 'MALBROUGH'
};

const FIDDLE_MODES = ['UNISON', 'COMPLEMENTARY', 'BATTLE'];
const PERC_COMBOS = [
  { inst: 'SPOONS', style: 'STEADY', label: 'SPOONS: STEADY' },
  { inst: 'SPOONS', style: 'GALLOP', label: 'SPOONS: GALLOP' },
  { inst: 'SPOONS', style: 'ROLL',   label: 'SPOONS: ROLL' },
  { inst: 'BONES',  style: 'STEADY', label: 'BONES: STEADY' },
  { inst: 'BONES',  style: 'GALLOP', label: 'BONES: GALLOP' },
  { inst: 'BONES',  style: 'ROLL',   label: 'BONES: ROLL' }
];
let percComboIdx = 1;
const CALLER_SONGS = ['SHOUTS', 'AVIRON', 'MALBROUGH'];

// --- TRUE TRADITIONAL "RED RIVER JIG" (A-CROSS TUNING: AEAE / ADAE, ONE PUSH-UP STRUCTURE) ---
// Section A (Steps 0–15): High "Push Up" signature opening (E5-A5-C#6-B5-A5-F#5-E5-C#5 / D5-F#5-A5-F#5-E5-C#5-B4-A4)
// Section B (Steps 16–31): Low Turnaround Shuffle (A4-C#5-E5-C#5-B4-G#4-E4-G#4 / A4-C#5-E5-F#5-E5-C#5-B4-A4)
const RED_RIVER_JIG_LEAD = [
  // First Push-Up (High Register)
  76, 81, 85, 83, 81, 78, 76, 73,
  74, 78, 81, 78, 76, 73, 71, 69,
  // Low Turnaround (Cross-Tuned A-Mixolydian / A-Major Drop)
  69, 73, 76, 73, 71, 68, 64, 68,
  69, 73, 76, 78, 76, 73, 71, 69
];

// Complementary Second Fiddle (Lower/Thirds Counter-Harmony & Drone Double-Stops)
const RED_RIVER_JIG_HARMONY = [
  69, 73, 76, 74, 73, 74, 69, 69,
  69, 74, 76, 74, 73, 69, 68, 64,
  64, 69, 73, 69, 68, 64, 59, 64,
  64, 69, 73, 74, 73, 69, 68, 64
];

// Traditional French-Canadian Paddling Round: "C'est l'aviron" (32 steps)
const AVIRON_MELODY = [
  69, 69, 71, 71, 73, 71, 69, 0,
  73, 73, 74, 74, 76, 74, 73, 0,
  74, 73, 71, 69, 71, 73, 74, 71,
  69, 67, 66, 64, 62, 66, 62, 0
];

// Traditional French Song: "Malbrough s'en va-t-en guerre" (32 steps)
const MALBROUGH_MELODY = [
  62, 66, 66, 66, 67, 69, 67, 0,
  66, 64, 64, 64, 66, 67, 66, 0,
  62, 66, 66, 66, 67, 69, 67, 0,
  66, 69, 67, 66, 64, 62, 62, 0
];

// Authentic Red River Jig Footwork Chart:
// "Shuffling the right foot (B), then the left (A). In every third shuffle, lift feet backward, missing a beat of music."
// Pattern per 4-step group: Step 0 (Right/B), Step 1 (Left/A), Step 2 (Lift/Miss Beat!), Step 3 (Fancy Heel-Toe / Step)
const JIG_STEP_CHART = [
  { s: 0,  btn: 'B', cue: 'RIGHT' },
  { s: 1,  btn: 'A', cue: 'LEFT'  },
  // s: 2 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 3,  btn: 'B', cue: 'STEP'  },

  { s: 4,  btn: 'B', cue: 'RIGHT' },
  { s: 5,  btn: 'A', cue: 'LEFT'  },
  // s: 6 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 7,  btn: 'A', cue: 'STEP'  },

  { s: 8,  btn: 'B', cue: 'RIGHT' },
  { s: 9,  btn: 'A', cue: 'LEFT'  },
  // s: 10 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 11, btn: 'B', cue: 'FANCY' },

  { s: 12, btn: 'A', cue: 'LEFT'  },
  { s: 13, btn: 'B', cue: 'RIGHT' },
  { s: 14, btn: 'A', cue: 'HEEL'  },

  // Low Turnaround Phrase (Steps 16–31)
  { s: 16, btn: 'B', cue: 'RIGHT' },
  { s: 17, btn: 'A', cue: 'LEFT'  },
  // s: 18 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 19, btn: 'B', cue: 'STEP'  },

  { s: 20, btn: 'B', cue: 'RIGHT' },
  { s: 21, btn: 'A', cue: 'LEFT'  },
  // s: 22 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 23, btn: 'A', cue: 'STEP'  },

  { s: 24, btn: 'B', cue: 'RIGHT' },
  { s: 25, btn: 'A', cue: 'LEFT'  },
  // s: 26 -> LIFT FOOT BACKWARD (MISS BEAT)
  { s: 27, btn: 'B', cue: 'FANCY' },

  { s: 28, btn: 'A', cue: 'LEFT'  },
  { s: 29, btn: 'B', cue: 'RIGHT' },
  { s: 30, btn: 'A', cue: 'TOE'   }
];

// --- AUDIO ENGINE (WITH SAFARI iOS UNLOCK) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let noiseBuffer = null;
let nextStepTime = 0.0;
let currentStep = 0;
let schedulerTimer = null;
let activeNodes = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    const bufferSize = audioCtx.sampleRate * 1.0;
    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }
  if (audioCtx.state === 'suspended' && !isPaused) {
    audioCtx.resume();
  }
}

document.addEventListener('touchstart', initAudio, { passive: true });
document.addEventListener('mousedown', initAudio, { passive: true });

function registerNode(node) {
  activeNodes.push(node);
  node.onended = () => {
    const idx = activeNodes.indexOf(node);
    if (idx > -1) activeNodes.splice(idx, 1);
  };
}

function stopAllAudio() {
  activeNodes.forEach(n => {
    try { n.stop(); } catch (e) {}
  });
  activeNodes = [];
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

// Bowed Chiptune Fiddle Voice (with open A3/E4 cross-tuned drone shimmer)
function playFiddle(midi, time, dur, gainVal, detuneCents = 0) {
  if (!midi || !audioCtx || gainVal <= 0) return;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(midiToFreq(midi), time);
  if (detuneCents !== 0) osc.detune.setValueAtTime(detuneCents, time);

  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1480, time);
  filter.Q.setValueAtTime(1.35, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainVal, time + 0.016);
  gain.gain.setValueAtTime(gainVal * 0.85, time + dur * 0.72);
  gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.01);
  registerNode(osc);
}

// Spoons (Dull Bass/Tom-esque Thud) vs Buffalo Rib Bones (Crisp Resonant Snare Clack)
function playPercHit(time, isBones, accent) {
  if (!audioCtx || !noiseBuffer) return;

  if (!isBones) {
    // SPOONS: Dull bass/tom-esque lap & knee thud
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    const baseF = accent ? 165 : 135;
    osc.frequency.setValueAtTime(baseF, time);
    osc.frequency.exponentialRampToValueAtTime(68, time + 0.075);

    const vol = accent ? 0.28 : 0.17;
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.085);
    registerNode(osc);
  } else {
    // BUFFALO RIB BONES: Crisp resonant snare-like bone clack
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(accent ? 2150 : 1850, time);
    filter.Q.setValueAtTime(3.2, time);

    const gain = audioCtx.createGain();
    const vol = accent ? 0.26 : 0.16;
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.055);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(time);
    noise.stop(time + 0.06);
    registerNode(noise);

    const clickOsc = audioCtx.createOscillator();
    const clickGain = audioCtx.createGain();
    clickOsc.type = 'square';
    clickOsc.frequency.setValueAtTime(accent ? 740 : 620, time);
    clickOsc.frequency.exponentialRampToValueAtTime(240, time + 0.03);
    clickGain.gain.setValueAtTime(vol * 0.45, time);
    clickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
    clickOsc.connect(clickGain);
    clickGain.connect(audioCtx.destination);
    clickOsc.start(time);
    clickOsc.stop(time + 0.04);
    registerNode(clickOsc);
  }
}

// Voyageur Caller Voice
function playCallerVocal(midi, time, dur) {
  if (!midi || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  osc.type = 'square';
  osc.frequency.setValueAtTime(midiToFreq(midi - 12), time);

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(880, time);
  filter.Q.setValueAtTime(2.5, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(0.13, time + 0.025);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.01);
  registerNode(osc);
}

function playCallerShout(time, isAllez) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  if (!isAllez) {
    osc.frequency.setValueAtTime(220, time);
    osc.frequency.setValueAtTime(329.63, time + 0.11);
  } else {
    osc.frequency.setValueAtTime(277.18, time);
    osc.frequency.exponentialRampToValueAtTime(440, time + 0.16);
  }
  gain.gain.setValueAtTime(0.14, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.23);
  registerNode(osc);
}

function playStumbleClonk() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
  gain.gain.setValueAtTime(0.35, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.18);
  registerNode(osc);
}

// --- JIG RHYTHM & VISUAL CALLOUT STATE ---
let expectedBeats = [];
let floatingTexts = [];
let shoutBanner = { text: '', timer: 0 };
let score = 0;
let combo = 0;
let maxCombo = 0;
let jigStepsLeft = 0;
let jiggerPose = 'IDLE'; // 'IDLE' | 'JIG_R' | 'JIG_L' | 'LIFT' | 'FALL'
let jiggerPoseTimer = 0;
let animFrame = 0;
let firstBootAnnouncementDone = false;

function triggerShout(text, duration = 65) {
  shoutBanner.text = text;
  shoutBanner.timer = duration;
}

// Helper to determine whether each Fiddler is actively illuminated & bowing on the current step
function getFiddlerActiveState(s32) {
  const isAcapella = band.callerOn && (band.callerSong === 'AVIRON' || band.callerSong === 'MALBROUGH') && controlMode !== 'JIG';
  if (isAcapella) {
    return { f1Playing: false, f2Playing: false };
  }

  if (band.fiddleMode === 'BATTLE' && band.fiddle1On && band.fiddle2On) {
    // Verse-for-verse battle: Steps 0-15 (Push-Up) = Fiddle 1 lit & bowing, Fiddle 2 resting/muted;
    // Steps 16-31 (Low Turnaround) = Fiddle 2 lit & bowing, Fiddle 1 resting/muted!
    const f1Turn = (s32 < 16);
    return { f1Playing: f1Turn, f2Playing: !f1Turn };
  }

  return {
    f1Playing: band.fiddle1On,
    f2Playing: band.fiddle2On
  };
}

// --- SEQUENCER STEP ENGINE ---
function scheduleStep(stepIndex, time, stepDur) {
  const s32 = stepIndex % 32;
  const isAcapella = band.callerOn && (band.callerSong === 'AVIRON' || band.callerSong === 'MALBROUGH');

  if (!firstBootAnnouncementDone && stepIndex === 0) {
    firstBootAnnouncementDone = true;
    triggerShout("RED RIVER JIG • FIRST PUSH-UP!", 85);
  }

  // 1. FIDDLE 1 & FIDDLE 2 (Red River Jig with Push-Up & Low Turnaround)
  if (!isAcapella || controlMode === 'JIG') {
    const n1 = RED_RIVER_JIG_LEAD[s32];
    const n2 = RED_RIVER_JIG_HARMONY[s32];

    if (band.fiddle1On && band.fiddle2On) {
      if (band.fiddleMode === 'UNISON') {
        // Unison with automatic doubling-echo effect (+7 cents chorus & 42ms echo)
        playFiddle(n1, time, stepDur * 0.9, 0.11, -6);
        playFiddle(n1, time + 0.042, stepDur * 0.85, 0.075, +8);
      } else if (band.fiddleMode === 'COMPLEMENTARY') {
        // Harmonizing: Fiddle 1 plays lead, Fiddle 2 plays complementary harmony simultaneously
        playFiddle(n1, time, stepDur * 0.9, 0.11, 0);
        playFiddle(n2, time, stepDur * 0.9, 0.095, +4);
      } else if (band.fiddleMode === 'BATTLE') {
        // Dual-Fiddle Battle: Verse-for-verse back and forth (Steps 0-15 Fiddle 1, Steps 16-31 Fiddle 2)
        if (s32 < 16) {
          playFiddle(n1, time, stepDur * 0.92, 0.13, 0);
          if (s32 === 0) triggerShout("BATTLE: FIDDLE 1 PUSH-UP!");
        } else {
          playFiddle(n2, time, stepDur * 0.92, 0.13, +5);
          if (s32 === 16) triggerShout("BATTLE: FIDDLE 2 TURNAROUND!");
        }
      }
    } else if (band.fiddle1On) {
      playFiddle(n1, time, stepDur * 0.9, 0.12, 0);
    } else if (band.fiddle2On) {
      playFiddle(n2, time, stepDur * 0.9, 0.12, +4);
    }
  }

  // 2. SPOONS / BUFFALO RIB BONES
  if (band.percOn && (!isAcapella || controlMode === 'JIG')) {
    const isBones = (band.percInstrument === 'BONES');
    if (band.percStyle === 'STEADY') {
      if (s32 % 2 === 1) {
        playPercHit(time, isBones, s32 % 4 === 3);
      }
    } else if (band.percStyle === 'GALLOP') {
      // Métis triplet gallop (1-2-3, 1-2-3)
      playPercHit(time, isBones, true);
      playPercHit(time + stepDur * 0.33, isBones, false);
      playPercHit(time + stepDur * 0.66, isBones, false);
    } else if (band.percStyle === 'ROLL') {
      playPercHit(time, isBones, s32 % 2 === 0);
      playPercHit(time + stepDur * 0.5, isBones, false);
    }
  }

  // 3. VOYAGEUR CALLER
  if (band.callerOn) {
    if (band.callerSong === 'SHOUTS') {
      const bandActiveCount = (band.fiddle1On ? 1 : 0) + (band.fiddle2On ? 1 : 0) + (band.percOn ? 1 : 0);
      if ((bandActiveCount >= 2 || controlMode === 'JIG') && band.fiddleMode !== 'BATTLE') {
        if (s32 === 0 && stepIndex > 0) {
          playCallerShout(time, false);
          triggerShout("HÉ-HO! PUSH UP!");
        } else if (s32 === 16) {
          playCallerShout(time, true);
          triggerShout("ALLEZ! FANCY STEPS!");
        }
      }
    } else if (band.callerSong === 'AVIRON') {
      const vNote = AVIRON_MELODY[s32];
      if (vNote) {
        playCallerVocal(vNote, time, stepDur * 0.95);
        const roundNote = AVIRON_MELODY[(s32 + 28) % 32];
        if (roundNote) {
          playCallerVocal(roundNote + 12, time, stepDur * 0.85);
        }
      }
      if (s32 === 0) triggerShout("C'EST L'AVIRON QUI NOUS MÈNE!");
    } else if (band.callerSong === 'MALBROUGH') {
      const mNote = MALBROUGH_MELODY[s32];
      if (mNote) {
        playCallerVocal(mNote, time, stepDur * 0.95);
      }
      if (s32 === 0) triggerShout("MALBROUGH S'EN VA-T-EN GUERRE!");
    }
  }

  // 4. JIG RHYTHM BEAT SPAWNING (Right-Left-Lift-Step pattern)
  if (controlMode === 'JIG' && jigStepsLeft > 0) {
    const hitDef = JIG_STEP_CHART.find(item => item.s === s32);
    if (hitDef) {
      expectedBeats.push({
        time: time,
        btn: hitDef.btn,
        cue: hitDef.cue,
        hit: false,
        missed: false
      });
    } else if (s32 % 4 === 2) {
      // Every third shuffle: visual back-foot lift marker ("LIFT / REST BEAT")
      expectedBeats.push({
        time: time,
        btn: 'LIFT',
        cue: 'LIFT',
        hit: true,
        missed: false
      });
    }

    jigStepsLeft--;
    if (jigStepsLeft <= 0) {
      setTimeout(() => {
        if (controlMode === 'JIG' && jigStepsLeft <= 0) {
          disengageJigMode(true);
        }
      }, 1800);
    }
  }
}

function scheduler() {
  if (isPaused || !audioCtx) return;
  const stepDur = (60.0 / currentBPM) / 2;
  while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD_TIME) {
    scheduleStep(currentStep, nextStepTime, stepDur);
    nextStepTime += stepDur;
    currentStep++;
  }
  schedulerTimer = setTimeout(scheduler, LOOKAHEAD);
}

function ensureSequencerRunning() {
  initAudio();
  if (!schedulerTimer) {
    nextStepTime = audioCtx.currentTime + 0.08;
    scheduler();
  }
}

// --- JIG RHYTHM MODE ENGAGE / DISENGAGE ---
function engageJigMode() {
  ensureSequencerRunning();
  controlMode = 'JIG';
  score = 0;
  combo = 0;
  maxCombo = 0;
  expectedBeats = [];
  floatingTexts = [];
  // 192 steps (~42s at 138 BPM) of Red River Jig push-ups & turnarounds
  jigStepsLeft = 192;
  jiggerPose = 'IDLE';
  triggerShout("RIGHT-LEFT-LIFT! KEEP UPPER BODY STEADY!");
}

function disengageJigMode(completed = false) {
  controlMode = 'BAND';
  expectedBeats = [];
  jiggerPose = 'IDLE';
  if (completed) {
    triggerShout(`BRAVO! SCORE: ${score} (MAX ${maxCombo}x)`);
  } else {
    triggerShout("BACK TO KITCHEN BAND CONTROL");
  }
}

function handleJigTap(btnPressed) {
  if (controlMode !== 'JIG' || !audioCtx || isPaused) return;
  const now = audioCtx.currentTime;

  let closest = null;
  let minDiff = Infinity;
  for (let i = 0; i < expectedBeats.length; i++) {
    const b = expectedBeats[i];
    if (!b.hit && !b.missed && b.btn !== 'LIFT') {
      const diff = Math.abs(now - b.time);
      if (diff < minDiff) {
        minDiff = diff;
        closest = b;
      }
    }
  }

  if (closest && minDiff <= TOLERANCE_GOOD) {
    closest.hit = true;
    const exactBtn = (closest.btn === btnPressed);
    const label = closest.cue === 'FANCY' ? 'FANCY STEP!' : (minDiff <= TOLERANCE_PERFECT && exactBtn ? 'PERFECT!' : 'SHUFFLE!');
    const pts = (closest.cue === 'FANCY') ? 150 : (minDiff <= TOLERANCE_PERFECT && exactBtn ? 100 : 60);

    score += pts;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    jiggerPose = (btnPressed === 'B') ? 'JIG_R' : 'JIG_L';
    jiggerPoseTimer = now + 0.22;
    spawnFloatingText(label, exactBtn ? PAL.SASH_TEAL : PAL.FIRE_ORANGE);
  } else {
    combo = 0;
    jiggerPose = 'FALL';
    jiggerPoseTimer = now + 0.6;
    playStumbleClonk();
    spawnFloatingText("MISSED BEAT!", PAL.FIRE_RED);
  }
}

function spawnFloatingText(text, color) {
  floatingTexts.push({
    text,
    color,
    x: VIEW_W / 2,
    y: VIEW_H - 185,
    life: 1.0
  });
}

// --- ARCADE CABINET POSTMESSAGE BRIDGE (Single Source of Truth) ---
const dpadHold = {
  UP:    { active: false, holdUntil: 0, nextRepeat: 0 },
  DOWN:  { active: false, holdUntil: 0, nextRepeat: 0 },
  LEFT:  { active: false, holdUntil: 0, nextRepeat: 0 },
  RIGHT: { active: false, holdUntil: 0, nextRepeat: 0 }
};
const btnDebounce = { BUTTON_A: 0, BUTTON_B: 0 };
const HOLD_WINDOW_MS = 145;
const REPEAT_DELAY_MS = 195;
const DEBOUNCE_MS = 110;

function clearInputStates() {
  for (const k in dpadHold) {
    dpadHold[k].active = false;
    dpadHold[k].holdUntil = 0;
    dpadHold[k].nextRepeat = 0;
  }
}

function handleCardinalStep(dir) {
  ensureSequencerRunning();

  if (controlMode === 'JIG') {
    if (dir === 'UP') {
      disengageJigMode(false);
    }
    return;
  }

  if (dir === 'LEFT') {
    cursorIdx = (cursorIdx + 4) % 5;
  } else if (dir === 'RIGHT') {
    cursorIdx = (cursorIdx + 1) % 5;
  } else if (dir === 'UP') {
    currentBPM = Math.min(185, currentBPM + 4);
  } else if (dir === 'DOWN') {
    currentBPM = Math.max(84, currentBPM - 4);
  }
}

function processHeldInputs(now) {
  for (const dir in dpadHold) {
    const slot = dpadHold[dir];
    if (!slot.active) continue;
    if (now > slot.holdUntil) {
      slot.active = false;
      continue;
    }
    if (now >= slot.nextRepeat) {
      handleCardinalStep(dir);
      slot.nextRepeat = now + REPEAT_DELAY_MS;
    }
  }
}

function handleActionA() {
  ensureSequencerRunning();

  if (controlMode === 'JIG') {
    handleJigTap('A');
    return;
  }

  if (cursorIdx === 0) band.fiddle1On = !band.fiddle1On;
  else if (cursorIdx === 1) band.fiddle2On = !band.fiddle2On;
  else if (cursorIdx === 2) engageJigMode();
  else if (cursorIdx === 3) band.percOn = !band.percOn;
  else if (cursorIdx === 4) band.callerOn = !band.callerOn;
}

function handleActionB() {
  ensureSequencerRunning();

  if (controlMode === 'JIG') {
    handleJigTap('B');
    return;
  }

  if (cursorIdx === 0 || cursorIdx === 1) {
    const idx = FIDDLE_MODES.indexOf(band.fiddleMode);
    band.fiddleMode = FIDDLE_MODES[(idx + 1) % FIDDLE_MODES.length];
    band.fiddle1On = true;
    band.fiddle2On = true;
  } else if (cursorIdx === 2) {
    engageJigMode();
  } else if (cursorIdx === 3) {
    percComboIdx = (percComboIdx + 1) % PERC_COMBOS.length;
    band.percInstrument = PERC_COMBOS[percComboIdx].inst;
    band.percStyle = PERC_COMBOS[percComboIdx].style;
    band.percOn = true;
  } else if (cursorIdx === 4) {
    const idx = CALLER_SONGS.indexOf(band.callerSong);
    band.callerSong = CALLER_SONGS[(idx + 1) % CALLER_SONGS.length];
    band.callerOn = true;
  }
}

window.addEventListener('message', function(event) {
  const raw = event.data;
  let msg = raw;
  if (typeof raw === 'string' && raw.startsWith('{')) {
    try { msg = JSON.parse(raw); } catch (e) {}
  }
  const cmd = (typeof msg === 'string') ? msg : (msg && (msg.type || msg.action || msg.cmd || msg.command || msg.button));
  if (!cmd || typeof cmd !== 'string') return;

  if (cmd === 'PAUSE') {
    isPaused = true;
    clearInputStates();
    clearTimeout(schedulerTimer);
    schedulerTimer = null;
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    return;
  }
  if (cmd === 'RESUME') {
    isPaused = false;
    clearInputStates();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && !schedulerTimer) {
      nextStepTime = audioCtx.currentTime + 0.08;
      scheduler();
    }
    return;
  }
  if (isPaused) return;

  if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'DPAD_RELEASE' || cmd === 'NEUTRAL') {
    clearInputStates();
    return;
  }

  const now = performance.now();

  for (const dir of ['UP', 'DOWN', 'LEFT', 'RIGHT']) {
    if (cmd === `DPAD_${dir}` || cmd === `DPAD_${dir}_PRESS`) {
      const slot = dpadHold[dir];
      if (!slot.active) {
        handleCardinalStep(dir);
        slot.nextRepeat = now + REPEAT_DELAY_MS;
      }
      slot.active = true;
      slot.holdUntil = now + HOLD_WINDOW_MS;
      return;
    }
    if (cmd === `DPAD_${dir}_RELEASE`) {
      dpadHold[dir].active = false;
      dpadHold[dir].holdUntil = 0;
      return;
    }
  }

  if (cmd === 'BUTTON_A' || cmd === 'BUTTON_A_PRESS') {
    if (now - btnDebounce.BUTTON_A >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_A = now;
      handleActionA();
    }
    return;
  }

  if (cmd === 'BUTTON_B' || cmd === 'BUTTON_B_PRESS') {
    if (now - btnDebounce.BUTTON_B >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_B = now;
      handleActionB();
    }
    return;
  }
});

// --- 1855 MICHIF LOG HOUSE KITCHEN PARTY PIXEL ART RENDERER ---
function pxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawText(txt, x, y, size, color, align = 'center') {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = PAL.INK;
  ctx.fillText(txt, Math.floor(x) + 2, Math.floor(y) + 2);
  ctx.fillStyle = color;
  ctx.fillText(txt, Math.floor(x), Math.floor(y));
}

// --- DETAILED 1855 MICHIF CHARACTER SPRITES ---
function drawMichifCharacter(role, cx, cy, isLit, isSelected, beatPulse) {
  const s = 4;
  // Upper body of the Jigger stays motionless ("keeping the upper body as motionless as possible")
  const bob = (role !== 'JIGGER' && isLit && beatPulse) ? -s : 0;
  const x = Math.floor(cx - 6 * s);
  const y = Math.floor(cy - 14 * s + bob);

  // Spotlight Cone from Cabin Rafters ONLY when actively lit/playing
  if (isLit) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, 38);
    ctx.lineTo(cx - 38, cy + 8);
    ctx.lineTo(cx + 38, cy + 8);
    ctx.closePath();
    const grad = ctx.createLinearGradient(cx, 38, cx, cy + 8);
    grad.addColorStop(0, 'rgba(247, 200, 68, 0.36)');
    grad.addColorStop(1, 'rgba(247, 200, 68, 0.03)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }

  // Floor shadow
  pxRect(cx - 22, cy - 2, 44, 6, 'rgba(0,0,0,0.45)');

  // Selection Cursor Bracket Above Head
  if (isSelected) {
    const bounce = Math.sin(animFrame * 0.18) * 3;
    pxRect(cx - 10, y - 16 + bounce, 20, 4, PAL.FIRE_GOLD);
    pxRect(cx - 6, y - 12 + bounce, 12, 4, PAL.FIRE_GOLD);
    pxRect(cx - 2, y - 8 + bounce, 4, 4, PAL.FIRE_GOLD);
  }

  // Dimmed silhouette when muted or resting during a Dual-Fiddle Battle
  ctx.save();
  if (!isLit && role !== 'JIGGER') {
    ctx.globalAlpha = 0.42;
  }

  if (role === 'FIDDLE_1' || role === 'FIDDLE_2') {
    const coatCol = (role === 'FIDDLE_1') ? PAL.CAPOTE_BLUE : PAL.CAPOTE_CREAM;
    const hatCol = (role === 'FIDDLE_1') ? PAL.SASH_RED : PAL.CAPOTE_BLUE;

    // Hat / Toque
    pxRect(x + 3 * s, y, 6 * s, 2 * s, hatCol);
    pxRect(x + 2 * s, y + 2 * s, 8 * s, s, PAL.SASH_GOLD);
    // Head & Beard
    pxRect(x + 3 * s, y + 3 * s, 6 * s, 3 * s, PAL.SKIN);
    pxRect(x + 3 * s, y + 5 * s, 6 * s, s, PAL.HAIR_DARK);
    // Capote Coat
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, coatCol);
    // Woven Ceinture Fléchée (Red/Teal/Gold Sash)
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 9 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 9 * s, 2 * s, s, PAL.SASH_GOLD);
    // Trousers & Moccasins
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);

    if (isLit) {
      // Actively playing & bowing!
      pxRect(x + 8 * s, y + 5 * s, 4 * s, 2 * s, '#B85D19');
      const bowShift = beatPulse ? -s : s;
      pxRect(x + 7 * s, y + 4 * s + bowShift, 6 * s, 2, PAL.WHITE);
    } else {
      // Resting / Muted: Fiddle lowered at side, bow held still at rest
      pxRect(x + 9 * s, y + 7 * s, 2 * s, 4 * s, '#7A3B0E');
      pxRect(x + 8 * s, y + 8 * s, 2, 5 * s, PAL.DIM);
    }

  } else if (role === 'PERC') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, PAL.SASH_TEAL);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 4 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.CAPOTE_RED);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_GOLD);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);

    const handY = (isLit && beatPulse) ? y + 6 * s : y + 8 * s;
    const toolCol = (band.percInstrument === 'BONES') ? PAL.CAPOTE_CREAM : '#A8B2BD';
    pxRect(x + s, handY, 2 * s, s, toolCol);
    pxRect(x + 9 * s, handY, 2 * s, s, toolCol);

  } else if (role === 'CALLER') {
    pxRect(x + 3 * s, y - s, 6 * s, 3 * s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 3 * s, PAL.SKIN);
    pxRect(x + 3 * s, y + 4 * s, 6 * s, 2 * s, PAL.BEARD_GREY);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.CAPOTE_BLUE);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    const armY = (isLit && beatPulse) ? y + 2 * s : y + 5 * s;
    pxRect(x + 10 * s, armY, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    pxRect(x + 10 * s, armY - s, 2 * s, s, PAL.SKIN);

  } else if (role === 'JIGGER') {
    // Central Red River Jigger: Upper body stays motionless while feet execute lively shuffles & backward lifts
    const jx = Math.floor(cx - 6 * s);
    const jy = Math.floor(cy - 13 * s);

    if (jiggerPose === 'FALL') {
      pxRect(jx + 2 * s, jy + 7 * s, 8 * s, 4 * s, PAL.CAPOTE_RED);
      pxRect(jx + s, jy + 6 * s, 3 * s, 3 * s, PAL.SKIN);
      pxRect(jx + 9 * s, jy + 8 * s, 3 * s, 2 * s, PAL.SASH_TEAL);
    } else {
      // Motionless Upper Body (Hat, Head, Torso, Sash, Steady Arms)
      pxRect(jx + 4 * s, jy, 4 * s, s, PAL.INK);
      pxRect(jx + 3 * s, jy + s, 6 * s, 2 * s, PAL.SKIN);
      pxRect(jx + 3 * s, jy + 3 * s, 6 * s, 3 * s, PAL.CAPOTE_RED);
      pxRect(jx + 4 * s, jy + 5 * s, 4 * s, s, PAL.FIRE_ORANGE);
      pxRect(jx + s, jy + 4 * s, 2 * s, s, PAL.CAPOTE_RED);
      pxRect(jx + 9 * s, jy + 4 * s, 2 * s, s, PAL.CAPOTE_RED);
      pxRect(jx, jy + 5 * s, s, s, PAL.SKIN);
      pxRect(jx + 11 * s, jy + 5 * s, s, s, PAL.SKIN);

      // Lively Footwork: Right Shuffle (JIG_R), Left Shuffle (JIG_L), Backward Lift (LIFT)
      if (jiggerPose === 'JIG_R') {
        // Shuffling Right Foot Forward
        pxRect(jx + 3 * s, jy + 6 * s, 2 * s, 5 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 3 * s, jy + 11 * s, 2 * s, s, PAL.SASH_TEAL);
        pxRect(jx + 7 * s, jy + 6 * s, 3 * s, 3 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 9 * s, jy + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
      } else if (jiggerPose === 'JIG_L') {
        // Shuffling Left Foot Forward
        pxRect(jx + 2 * s, jy + 6 * s, 3 * s, 3 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + s, jy + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
        pxRect(jx + 7 * s, jy + 6 * s, 2 * s, 5 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 7 * s, jy + 11 * s, 2 * s, s, PAL.SASH_TEAL);
      } else if (jiggerPose === 'LIFT') {
        // Every 3rd shuffle: Lifting foot backward on the missed beat!
        pxRect(jx + 4 * s, jy + 6 * s, 2 * s, 5 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 4 * s, jy + 11 * s, 2 * s, s, PAL.SASH_TEAL);
        pxRect(jx + 7 * s, jy + 6 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 8 * s, jy + 8 * s, 2 * s, s, PAL.SASH_RED);
      } else {
        pxRect(jx + 4 * s, jy + 6 * s, 4 * s, 5 * s, PAL.CAPOTE_BLUE);
        pxRect(jx + 3 * s, jy + 11 * s, 2 * s, s, PAL.SASH_TEAL);
        pxRect(jx + 7 * s, jy + 11 * s, 2 * s, s, PAL.SASH_TEAL);
      }
    }
  }

  ctx.restore();
}

// --- UPDATE & RENDER LOOP ---
function update() {
  animFrame++;
  processHeldInputs(performance.now());

  if (shoutBanner.timer > 0) {
    shoutBanner.timer--;
  }

  if (audioCtx && !isPaused) {
    const now = audioCtx.currentTime;

    if (jiggerPoseTimer > 0 && now >= jiggerPoseTimer) {
      jiggerPose = 'IDLE';
      jiggerPoseTimer = 0;
    }

    if (controlMode === 'JIG') {
      for (let i = expectedBeats.length - 1; i >= 0; i--) {
        const b = expectedBeats[i];
        // Trigger backward foot lift animation on every 3rd shuffle beat
        if (b.btn === 'LIFT' && !b.triggered && now >= b.time - 0.04) {
          b.triggered = true;
          if (jiggerPose !== 'FALL') {
            jiggerPose = 'LIFT';
            jiggerPoseTimer = now + 0.18;
          }
        }
        if (!b.hit && !b.missed && b.btn !== 'LIFT' && now > b.time + TOLERANCE_GOOD) {
          b.missed = true;
          combo = 0;
          jiggerPose = 'FALL';
          jiggerPoseTimer = now + 0.55;
          playStumbleClonk();
          spawnFloatingText("MISS!", PAL.FIRE_RED);
        }
        if ((b.hit || b.missed) && now > b.time + 0.9) {
          expectedBeats.splice(i, 1);
        }
      }
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.9;
    ft.life -= 0.02;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

  drawMichifCharacter('FIDDLE_1', colW * 0.55, backRowY, f1Playing, controlMode === 'BAND' && cursorIdx === 0, beatPulse);
  drawMichifCharacter('FIDDLE_2', colW * 1.45, backRowY, f2Playing, controlMode === 'BAND' && cursorIdx === 1, beatPulse);
  drawMichifCharacter('PERC',     colW * 3.55, backRowY, band.percOn,    controlMode === 'BAND' && cursorIdx === 3, beatPulse);
  drawMichifCharacter('CALLER',   colW * 4.45, backRowY, band.callerOn,  controlMode === 'BAND' && cursorIdx === 4, beatPulse);

  // Center Front Stage: The Jigger
  drawMichifCharacter('JIGGER',   VIEW_W * 0.5, frontRowY, true, controlMode === 'BAND' && cursorIdx === 2, beatPulse);

  // Voyageur Caller Shout / Lyric Banner
  if (shoutBanner.timer > 0 && shoutBanner.text) {
    const bw = Math.min(VIEW_W - 24, shoutBanner.text.length * 9 + 24);
    pxRect(VIEW_W / 2 - bw / 2, topBarH + 8, bw, 22, PAL.INK);
    ctx.strokeStyle = PAL.FIRE_GOLD;
    ctx.lineWidth = 2;
    ctx.strokeRect(VIEW_W / 2 - bw / 2, topBarH + 8, bw, 22);
    drawText(shoutBanner.text, VIEW_W / 2, topBarH + 23, 8, PAL.FIRE_GOLD, 'center');
  }

  // 4. Bottom HUD Bar (Anchored at VIEW_H - bottomBarH)
  pxRect(0, bottomBarTop, VIEW_W, bottomBarH, PAL.INK);
  pxRect(0, bottomBarTop, VIEW_W, 3, PAL.SASH_TEAL);

  if (controlMode === 'BAND') {
    const f1BattleResting = (band.fiddleMode === 'BATTLE' && band.fiddle1On && band.fiddle2On && !f1Playing);
    const f2BattleResting = (band.fiddleMode === 'BATTLE' && band.fiddle1On && band.fiddle2On && !f2Playing);

    const items = [
      {
        title: "FIDDLE 1",
        on: f1Playing,
        stateOverride: !band.fiddle1On ? "OFF" : (f1BattleResting ? "MUTE" : "ON"),
        sub: band.fiddleMode.slice(0, 6)
      },
      {
        title: "FIDDLE 2",
        on: f2Playing,
        stateOverride: !band.fiddle2On ? "OFF" : (f2BattleResting ? "MUTE" : "ON"),
        sub: band.fiddleMode.slice(0, 6)
      },
      {
        title: "JIGGER",
        on: true,
        sub: "A:DANCE!",
        isJigger: true
      },
      {
        title: band.percInstrument,
        on: band.percOn,
        sub: band.percStyle
      },
      {
        title: "CALLER",
        on: band.callerOn,
        sub: band.callerSong.slice(0, 6)
      }
    ];

    const cardW = Math.floor((VIEW_W - 24) / 5);
    for (let i = 0; i < 5; i++) {
      const it = items[i];
      const cx = 12 + i * cardW;
      const cy = bottomBarTop + 8;
      const sel = (cursorIdx === i);

      pxRect(cx + 2, cy, cardW - 4, 48, sel ? '#2D160E' : '#14100E');
      ctx.strokeStyle = sel ? PAL.FIRE_GOLD : (it.on ? PAL.SASH_TEAL : '#3B332E');
      ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(cx + 2, cy, cardW - 4, 48);

      drawText(it.title, cx + cardW / 2, cy + 14, 7, sel ? PAL.FIRE_GOLD : PAL.WHITE, 'center');
      const stateTxt = it.isJigger ? "LEAD" : (it.stateOverride || (it.on ? "ON" : "OFF"));
      const stateCol = it.isJigger ? PAL.FIRE_ORANGE : (it.on ? PAL.SASH_TEAL : PAL.DIM);
      drawText(stateTxt, cx + cardW / 2, cy + 28, 8, stateCol, 'center');
      drawText(it.sub, cx + cardW / 2, cy + 41, 6, PAL.CAPOTE_CREAM, 'center');
    }

    drawText("L/R: SELECT  A: TOGGLE/JIG  B: STYLE/INST  U/D: BPM", VIEW_W / 2, VIEW_H - 8, 7, PAL.SASH_GOLD, 'center');

  } else {
    // JIG RHYTHM TRACK HUD (B = Right Foot, A = Left Foot, Dashed Marker = Backward Foot Lift / Missed Beat)
    pxRect(12, bottomBarTop + 8, VIEW_W - 24, 54, '#0D2A3A');

    // Hit Target Box
    ctx.strokeStyle = PAL.FIRE_GOLD;
    ctx.lineWidth = 3;
    ctx.strokeRect(HIT_ZONE_X - 18, bottomBarTop + 12, 36, 46);
    drawText("B/A", HIT_ZONE_X, bottomBarTop + 39, 8, PAL.FIRE_GOLD, 'center');

    if (audioCtx) {
      const now = audioCtx.currentTime;
      for (let i = 0; i < expectedBeats.length; i++) {
        const b = expectedBeats[i];
        const nx = HIT_ZONE_X + (b.time - now) * NOTE_SPEED;
        if (nx > -30 && nx < VIEW_W + 30) {
          if (b.btn === 'LIFT') {
            // Visual cue for the 3rd-shuffle backward foot lift (missed beat of music)
            ctx.strokeStyle = 'rgba(247, 200, 68, 0.45)';
            ctx.lineWidth = 1;
            ctx.strokeRect(nx - 8, bottomBarTop + 21, 16, 28);
            drawText("LIFT", nx, bottomBarTop + 38, 5, 'rgba(247, 200, 68, 0.65)', 'center');
          } else if (!b.hit && !b.missed) {
            const noteCol = (b.btn === 'B') ? PAL.FIRE_ORANGE : PAL.SASH_TEAL;
            pxRect(nx - 12, bottomBarTop + 15, 24, 40, noteCol);
            ctx.strokeStyle = PAL.WHITE;
            ctx.lineWidth = 2;
            ctx.strokeRect(nx - 12, bottomBarTop + 15, 24, 40);
            drawText(b.btn, nx, bottomBarTop + 40, 10, PAL.INK, 'center');
          }
        }
      }
    }

    drawText("SHUFFLE: B (RIGHT) -> A (LEFT) -> LIFT (PAUSE)!", VIEW_W / 2, VIEW_H - 7, 7, PAL.CAPOTE_CREAM, 'center');
  }

  // Floating Rhythm Feedback Popups
  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.life);
    drawText(ft.text, ft.x, ft.y, 16, ft.color, 'center');
    ctx.restore();
  }
}

function loop() {
  if (!isPaused) {
    update();
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
