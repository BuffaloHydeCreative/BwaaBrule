const BASE_H = 400;
let VIEW_W = 600;
let VIEW_H = 400;
let HIT_ZONE_X = 100;

function resizeViewport() {
  const ww = window.innerWidth || 600;
  const wh = window.innerHeight || 400;
  const aspect = ww / Math.max(1, wh);
  VIEW_H = BASE_H;
  VIEW_W = Math.max(360, Math.round(BASE_H * aspect));
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;
  HIT_ZONE_X = Math.max(82, Math.min(140, Math.round(VIEW_W * 0.20)));
  ctx.imageSmoothingEnabled = false;
}

// ============================================================================
// X / Y / Z ARRANGEMENT COMPILER
// Slot 1 -> X (Harmonic Mapping: -10 to +10)
// Slot 2 -> Y (Rhythmic Engine: -10 to +10)
// Slot 3 -> Z (Structural Macro: -10 to +10)
// ============================================================================
function computeXYZProfile() {
  const f1 = FIDDLE_ROSTER[bandSlots[0]];
  const f2 = FIDDLE_ROSTER[bandSlots[1]];
  const f3 = FIDDLE_ROSTER[bandSlots[2]];

  const X = Math.max(-10, Math.min(10, f1.x));
  const Y = Math.max(-10, Math.min(10, f2.y));
  const Z = Math.max(-10, Math.min(10, f3.z));

  // Derive BPM from Y (-10 -> 82 BPM, 0 -> 118 BPM, +10 -> 152 BPM)
  let bpm = 118;
  if (Y < 0) {
    bpm = Math.round(118 + (Y / 10) * 36); // Y=-7 -> 93 BPM (~90 BPM Waltz), Y=-2 -> 111 BPM (~110 BPM)
  } else if (Y > 0) {
    bpm = Math.round(118 + (Y / 10) * 34); // Y=+8 -> 145 BPM Breakdown Reel
  }

  // Classify Resulting Track Archetype
  let trackTitle = 'TRADITIONAL RED RIVER JIG';
  let trackSub = '1860 McDallas • Classic A-D-A-E Jig';

  if (Y <= -5 && X >= 2) {
    trackTitle = 'THE METIS WALTZ';
    trackSub = `Manitoba Wedding Waltz • ${bpm} BPM 3/4 Sway`;
  } else if (Y >= 5 && Z >= 3) {
    trackTitle = 'FESTIVAL BREAKDOWN REEL';
    trackSub = `High-Speed Dancehall Reel • ${bpm} BPM Crooked 4/4`;
  } else if (X <= -4 && Z <= -5) {
    trackTitle = 'OLD-TIME FRONTIER DRONE';
    trackSub = `1860s Kitchen Party • ${bpm} BPM Low-A Solo + Foot`;
  } else if (X !== 0 || Y !== 0 || Z !== 0) {
    trackTitle = 'CUSTOM RED RIVER HYBRID';
    trackSub = `X:${X >= 0 ? '+' + X : X}  Y:${Y >= 0 ? '+' + Y : Y}  Z:${Z >= 0 ? '+' + Z : Z} • ${bpm} BPM`;
  }

  // Harmonic Mapping (X):
  // X <= -4: Heavy Low-A Drone (57) + Dorian/Mixolydian flattened 7th
  // X >= +3: Sweet 3rd/6th Double-Stops
  // X > 0: Bright A-Major / D-Major Lift
  const semitoneShift = (X >= 2 && X <= 3) ? 0 : Math.round(X / 4);
  const lowADrone = (X <= -4);
  const sweetDoubleStops = (X >= 3);

  // Rhythmic Engine (Y):
  // Y <= -5: Smooths crooked triplets into 3/4 waltz sway
  // Y between -4 and -1: Heavy frontier swing feel
  // Y >= +5: Cut-time 4/4 high-speed double-shuffle
  const waltzSmooth = (Y <= -5);
  const swingAmount = (Y < 0 && Y > -5) ? Math.min(0.28, Math.abs(Y) * 0.065) : 0;

  // Structural Macro (Z):
  // Z <= -6: Solo fiddle + foot tap (mutes extra accompaniment)
  // Z <= -3: Strict 16-bar squared phrases (trims crooked pickup tail)
  // Z >= +4: Crooked phrasing (inserts extra high push-up turnaround bars!)
  const soloMode = (Z <= -6);
  const strictPhrasing = (Z <= -3 && Z > -6);
  const crookedPhrasing = (Z >= 4);

  const partA = strictPhrasing ? RRJ_PART_A.slice(0, 64) : RRJ_PART_A;
  const partB = strictPhrasing ? RRJ_PART_B.slice(0, 64) : RRJ_PART_B;
  const crookedInsert = partA.slice(0, 24); // Extra crooked push-up bar extension

  let sequence = [];
  let boundaries = [];

  if (crookedPhrasing) {
    boundaries = [
      { start: 0, label: 'PHASE 1: HIGH PUSH-UP' },
      { start: partA.length, label: 'PHASE 2: CROOKED BAR!' },
      { start: partA.length + crookedInsert.length, label: 'PHASE 3: BREAKDOWN B' },
      { start: partA.length + crookedInsert.length + partB.length, label: 'PHASE 4: CROOKED PUSH-UP' },
      { start: partA.length * 2 + crookedInsert.length + partB.length, label: 'PHASE 5: FINAL SPRINT' }
    ];
    sequence = [
      ...partA,
      ...crookedInsert,
      ...partB,
      ...partA,
      ...partB,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  } else if (strictPhrasing) {
    boundaries = [
      { start: 0, label: 'PHASE 1: 3/4 WALTZ A' },
      { start: partA.length, label: 'PHASE 2: 3/4 WALTZ B' },
      { start: partA.length + partB.length, label: 'PHASE 3: SWEET HARMONY A' },
      { start: partA.length * 2 + partB.length, label: 'PHASE 4: WEDDING TURN' },
      { start: partA.length * 2 + partB.length * 2, label: 'PHASE 5: GRAND FINALE' }
    ];
    sequence = [
      ...partA,
      ...partB,
      ...partA,
      ...partB,
      ...partA,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  } else {
    boundaries = [
      { start: 0, label: 'PHASE 1: SEGNO PUSH-UP' },
      { start: partA.length, label: 'PHASE 2: LOW DOUBLE-STOPS' },
      { start: partA.length + partB.length, label: 'PHASE 3: D.S. PUSH-UP' },
      { start: partA.length * 2 + partB.length, label: 'PHASE 4: TURNAROUND' },
      { start: partA.length * 2 + partB.length * 2, label: 'PHASE 5: FINAL PUSH-UP' }
    ];
    sequence = [
      ...partA,
      ...partB,
      ...partA,
      ...partB,
      ...partA,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  }

  return {
    X, Y, Z,
    bpm,
    trackTitle,
    trackSub,
    semitoneShift,
    lowADrone,
    sweetDoubleStops,
    waltzSmooth,
    swingAmount,
    soloMode,
    strictPhrasing,
    crookedPhrasing,
    boundaries,
    score: sequence
  };
}

// ============================================================================
// WEB AUDIO ENGINE (WITH X/Y/Z HARMONIC, RHYTHMIC & STRUCTURAL DSP)
// ============================================================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let noiseBuffer = null;
let nextStepTime = 0.0;
let schedulerTimer = null;
let activeNodes = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    const bufferSize = audioCtx.sampleRate * 1.0;
    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }
  if (audioCtx.state === 'suspended' && !isPaused) {
    audioCtx.resume();
  }
}

document.addEventListener('touchstart', initAudio, { passive: true });
document.addEventListener('mousedown', initAudio, { passive: true });

function registerNode(node) {
  activeNodes.push(node);
  node.onended = () => {
    const idx = activeNodes.indexOf(node);
    if (idx > -1) activeNodes.splice(idx, 1);
  };
}

function stopAllAudio() {
  activeNodes.forEach(n => {
    try { n.stop(); } catch (e) {}
  });
  activeNodes = [];
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function playFiddleTone(midi, time, dur, gainVal, detuneCents = 0, wave = 'sawtooth') {
  if (!midi || !audioCtx || gainVal <= 0) return;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  osc.type = wave;
  osc.frequency.setValueAtTime(midiToFreq(midi), time);
  if (detuneCents !== 0) osc.detune.setValueAtTime(detuneCents, time);

  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1480, time);
  filter.Q.setValueAtTime(1.35, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainVal, time + 0.012);
  gain.gain.setValueAtTime(gainVal * 0.85, time + dur * 0.72);
  gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.01);
  registerNode(osc);
}

function playFiddleCord(rootMidi, time, stepDur, stepIdx) {
  if (!audioCtx || !noiseBuffer) return;
  if (stepIdx % 2 === 0) {
    const chordRoot = rootMidi ? rootMidi - 12 : 57;
    playFiddleTone(chordRoot, time, stepDur * 0.65, 0.08, -4, 'sawtooth');
    playFiddleTone(chordRoot + 7, time, stepDur * 0.65, 0.07, +4, 'sawtooth');
  } else {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(340, time);
    osc.frequency.exponentialRampToValueAtTime(145, time + 0.045);
    gain.gain.setValueAtTime(0.13, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.055);
    registerNode(osc);
  }
}

function playFootTap(time) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(92, time);
  osc.frequency.exponentialRampToValueAtTime(44, time + 0.07);
  gain.gain.setValueAtTime(0.24, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.075);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.08);
  registerNode(osc);
}

function playScoreEventForFiddler(fiddlerId, ev, time, stepDur, stepIdx, slotOffset) {
  if (fiddlerId === 'NONE' || !ev) return;

  // In Z <= -6 Solo Mode, mute secondary fiddles (slots 1 & 2) so the solo fiddle + foot tap shines
  if (activeProfile.soloMode && slotOffset > 0) return;

  const shift = activeProfile.semitoneShift;
  const detune = (slotOffset - 1) * 5;
  const baseDur = ev.tie ? stepDur * 1.85 : stepDur * 0.92;
  const dur = activeProfile.waltzSmooth ? baseDur * 1.35 : baseDur;

  if (fiddlerId === 'SPOON_CORD') {
    playFiddleCord((ev.d || ev.n || 62) + shift, time, stepDur, stepIdx);
    return;
  }

  // Main Fiddle Lead + X-Axis Harmonic Mapping (Low-A Drone or Sweet Double-Stops)
  const note = ev.tri ? (activeProfile.waltzSmooth ? ev.tri[0] : null) : ev.n;

  if (ev.tri && !activeProfile.waltzSmooth) {
    const subDur = stepDur / 3;
    for (let t = 0; t < ev.tri.length; t++) {
      playFiddleTone(ev.tri[t] + shift, time + t * subDur, subDur * 0.94, 0.10, detune);
    }
  } else if (ev.grace && !activeProfile.waltzSmooth) {
    playFiddleTone(ev.grace + shift, time, stepDur * 0.25, 0.075, detune);
    if (note) playFiddleTone(note + shift, time + stepDur * 0.22, dur * 0.8, 0.10, detune);
  } else if (note) {
    playFiddleTone(note + shift, time, dur, 0.105, detune);

    // Sweet Double-Stops when X >= +3
    if (activeProfile.sweetDoubleStops) {
      playFiddleTone(note + shift - 4, time, dur, 0.072, detune + 3);
    }
  }

  // Heavy Low-A Drone (57) when X <= -4, or written score double-stop drone
  if (activeProfile.lowADrone) {
    if (stepIdx % 2 === 0) {
      playFiddleTone(57, time, stepDur * 1.9, 0.085, -3);
    }
  } else if (ev.d) {
    playFiddleTone(ev.d + shift, time, dur, 0.08, detune);
  }
}

function playHandPerc(percId, time, stepDur, stepIdx) {
  if (percId === 'NONE' || activeProfile.soloMode || !audioCtx || !noiseBuffer) return;

  if (percId === 'SPOONS') {
    if (stepIdx % 2 === 0) {
      const pairDur = stepDur * 2;
      const hits = activeProfile.waltzSmooth ? [0] : [0, 0.33, 0.66];
      hits.forEach((h, i) => {
        const t = time + pairDur * h;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(i === 0 ? 165 : 135, t);
        osc.frequency.exponentialRampToValueAtTime(68, t + 0.07);
        gain.gain.setValueAtTime(i === 0 ? 0.22 : 0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
        registerNode(osc);
      });
    }
  } else if (percId === 'BONES') {
    if (stepIdx % 2 === 1 || stepIdx % 4 === 0) {
      const accent = (stepIdx % 4 === 2);
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(accent ? 2150 : 1850, time);
      filter.Q.setValueAtTime(3.2, time);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(accent ? 0.22 : 0.13, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.055);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(time);
      noise.stop(time + 0.06);
      registerNode(noise);
    }
  }
}

function playBigPerc(bigId, time, stepIdx) {
  // In Z <= -6 Solo Mode, replace big percussion with the fiddler's own wooden clog foot tap!
  if (activeProfile.soloMode) {
    if (stepIdx % 4 === 0) playFootTap(time);
    return;
  }
  if (bigId === 'NONE' || !audioCtx) return;

  if (bigId === 'DRUM') {
    const mod = activeProfile.waltzSmooth ? 6 : 4;
    if (stepIdx % mod === 0) {
      const accent = (stepIdx % (mod * 2) === 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(accent ? 105 : 88, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.18);
      gain.gain.setValueAtTime(accent ? 0.34 : 0.24, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.19);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.2);
      registerNode(osc);
    }
  } else if (bigId === 'ANVIL') {
    if (stepIdx % 4 === 2) {
      const freqs = [1174.66, 1760.0, 2637.02];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, time);
        const vol = idx === 0 ? 0.14 : 0.06;
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.25);
        registerNode(osc);
      });
    }
  }
}

function playStumbleClonk() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
  gain.gain.setValueAtTime(0.32, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.18);
  registerNode(osc);
}

// ============================================================================
// PHASE 3 SONG SEQUENCER & DANCER-SPECIFIC JOYSTICK + A/B RHYTHM ENGINE
// ============================================================================
function startJiggingPhase() {
  initAudio();
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  stopAllAudio();

  activeProfile = computeXYZProfile();
  totalSongSteps = activeProfile.score.length;
  currentStep = 0;
  expectedBeats = [];
  floatingTexts = [];
  lastAnnouncedSongPhase = -1;
  score = 0;
  combo = 0;
  maxCombo = 0;
  jiggerPose = 'IDLE';
  jiggerPoseTimer = 0;

  const dancer = DANCER_ROSTER[selectedDancerIdx];
  phaseShiftBanner = { text: `HOLD ${DIR_ARROWS[dancer.phaseDirs[0]]} ${dancer.phaseDirs[0]}!`, timer: 90 };

  phase = 'JIGGING';
  nextStepTime = audioCtx.currentTime + 0.7;
  scheduler();
}

function finishSongToMenu() {
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  stopAllAudio();
  expectedBeats = [];
  phase = 'RESULTS';
}

function returnToBandBuilder() {
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  stopAllAudio();
  expectedBeats = [];
  phase = 'BAND_SELECT';
}

function scheduleStep(stepIdx, time, stepDur) {
  if (stepIdx >= totalSongSteps) return;

  // Apply Y-axis swing offset on odd 16th-note subdivisions
  const swingDelay = (stepIdx % 2 === 1 && activeProfile.swingAmount > 0)
    ? stepDur * activeProfile.swingAmount
    : 0;
  const playTime = time + swingDelay;

  const ev = activeProfile.score[stepIdx];
  const songPhaseIdx = getSongPhaseIndex(stepIdx);
  const dancer = DANCER_ROSTER[selectedDancerIdx];
  const requiredDir = dancer.phaseDirs[songPhaseIdx] || 'RIGHT';

  const f1 = FIDDLE_ROSTER[bandSlots[0]].id;
  const f2 = FIDDLE_ROSTER[bandSlots[1]].id;
  const f3 = FIDDLE_ROSTER[bandSlots[2]].id;
  const hp = HAND_PERC_ROSTER[bandSlots[3]].id;
  const bp = BIG_PERC_ROSTER[bandSlots[4]].id;

  playScoreEventForFiddler(f1, ev, playTime, stepDur, stepIdx, 0);
  playScoreEventForFiddler(f2, ev, playTime, stepDur, stepIdx, 1);
  playScoreEventForFiddler(f3, ev, playTime, stepDur, stepIdx, 2);
  playHandPerc(hp, playTime, stepDur, stepIdx);
  playBigPerc(bp, playTime, stepIdx);

  // Spawn Dancer-Specific Joystick + A/B Footwork Notes
  if (stepIdx % 2 === 0 && stepIdx < totalSongSteps - 4) {
    const shuffleBeat = Math.floor(stepIdx / 2) % dancer.stepPattern.length;
    const pat = dancer.stepPattern[shuffleBeat];
    const isPhaseStart = (stepIdx === activeProfile.boundaries[songPhaseIdx].start);

    if (pat.btn === 'LIFT') {
      expectedBeats.push({
        time: playTime,
        btn: 'LIFT',
        dir: requiredDir,
        songPhaseIdx,
        isPhaseStart,
        cue: pat.cue,
        hit: true,
        missed: false
      });
    } else {
      expectedBeats.push({
        time: playTime,
        btn: pat.btn,
        dir: requiredDir,
        songPhaseIdx,
        isPhaseStart,
        cue: pat.cue,
        hit: false,
        missed: false
      });
    }
  }
}

function scheduler() {
  if (isPaused || phase !== 'JIGGING' || !audioCtx) return;
  const stepDur = (60.0 / activeProfile.bpm) / 4;
  while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD_TIME && currentStep < totalSongSteps) {
    scheduleStep(currentStep, nextStepTime, stepDur);
    nextStepTime += stepDur;
    currentStep++;
  }
  if (currentStep < totalSongSteps) {
    schedulerTimer = setTimeout(scheduler, LOOKAHEAD);
  } else {
    schedulerTimer = null;
  }
}

// ============================================================================
// ARCADE CABINET POSTMESSAGE BRIDGE (Single Source of Truth)
// ============================================================================
const dpadHold = {
  UP:    { active: false, holdUntil: 0, nextRepeat: 0 },
  DOWN:  { active: false, holdUntil: 0, nextRepeat: 0 },
  LEFT:  { active: false, holdUntil: 0, nextRepeat: 0 },
  RIGHT: { active: false, holdUntil: 0, nextRepeat: 0 }
};
const btnDebounce = { BUTTON_A: 0, BUTTON_B: 0 };
const HOLD_WINDOW_MS = 165;
const REPEAT_DELAY_MS = 195;
const DEBOUNCE_MS = 105;

function clearInputStates() {
  for (const k in dpadHold) {
    dpadHold[k].active = false;
    dpadHold[k].holdUntil = 0;
    dpadHold[k].nextRepeat = 0;
  }
}

function getActiveHeldDirection() {
  const now = performance.now();
  let bestDir = null;
  let latestHold = 0;
  for (const dir in dpadHold) {
    const slot = dpadHold[dir];
    if (slot.active && now <= slot.holdUntil && slot.holdUntil >= latestHold) {
      latestHold = slot.holdUntil;
      bestDir = dir;
    }
  }
  return bestDir;
}

function isDirectionHeld(dir) {
  const now = performance.now();
  const slot = dpadHold[dir];
  return !!(slot && slot.active && now <= slot.holdUntil);
}

function handleJigTap(btnPressed) {
  if (phase !== 'JIGGING' || !audioCtx || isPaused) return;
  const now = audioCtx.currentTime;

  let closest = null;
  let minDiff = Infinity;
  for (let i = 0; i < expectedBeats.length; i++) {
    const b = expectedBeats[i];
    if (!b.hit && !b.missed && b.btn !== 'LIFT') {
      const diff = Math.abs(now - b.time);
      if (diff < minDiff) {
        minDiff = diff;
        closest = b;
      }
    }
  }

  if (closest && minDiff <= TOLERANCE_GOOD) {
    const exactBtn = (closest.btn === btnPressed);
    const heldCorrectDir = isDirectionHeld(closest.dir);

    if (!heldCorrectDir) {
      closest.missed = true;
      combo = 0;
      jiggerPose = 'FALL';
      jiggerPoseTimer = now + 0.5;
      playStumbleClonk();
      spawnFloatingText(`HOLD ${DIR_ARROWS[closest.dir]} ${closest.dir}!`, PAL.FIRE_RED);
      return;
    }

    closest.hit = true;
    const isFancy = (closest.cue === 'FANCY');
    const label = isFancy
      ? 'FANCY STEP!'
      : (minDiff <= TOLERANCE_PERFECT && exactBtn ? 'PERFECT!' : 'SHUFFLE!');
    const pts = isFancy ? 150 : (minDiff <= TOLERANCE_PERFECT && exactBtn ? 100 : 60);

    score += pts;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    jiggerPose = (btnPressed === 'B') ? 'JIG_R' : 'JIG_L';
    jiggerPoseTimer = now + 0.22;
    spawnFloatingText(label, exactBtn ? PAL.SASH_TEAL : PAL.FIRE_ORANGE);
  } else {
    combo = 0;
    jiggerPose = 'FALL';
    jiggerPoseTimer = now + 0.55;
    playStumbleClonk();
    spawnFloatingText("MISSED BEAT!", PAL.FIRE_RED);
  }
}

function spawnFloatingText(text, color) {
  floatingTexts.push({
    text,
    color,
    x: VIEW_W / 2,
    y: VIEW_H - 185,
    life: 1.0
  });
}

function cycleBandSlot(slotIdx, delta) {
  if (slotIdx <= 2) {
    bandSlots[slotIdx] = (bandSlots[slotIdx] + delta + FIDDLE_ROSTER.length) % FIDDLE_ROSTER.length;
  } else if (slotIdx === 3) {
    bandSlots[3] = (bandSlots[3] + delta + HAND_PERC_ROSTER.length) % HAND_PERC_ROSTER.length;
  } else if (slotIdx === 4) {
    bandSlots[4] = (bandSlots[4] + delta + BIG_PERC_ROSTER.length) % BIG_PERC_ROSTER.length;
  }
  activeProfile = computeXYZProfile();
}

function handleCardinalStep(dir) {
  initAudio();

  if (phase === 'BAND_SELECT') {
    if (dir === 'LEFT') {
      bandCursor = (bandCursor + 5) % 6;
    } else if (dir === 'RIGHT') {
      bandCursor = (bandCursor + 1) % 6;
    } else if (dir === 'UP') {
      if (bandCursor < 5) cycleBandSlot(bandCursor, -1);
    } else if (dir === 'DOWN') {
      if (bandCursor < 5) cycleBandSlot(bandCursor, +1);
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (dir === 'UP' || dir === 'DOWN') {
      phase2Row = (phase2Row + 1) % 2;
    } else if (dir === 'LEFT') {
      if (phase2Row === 0) selectedDancerIdx = (selectedDancerIdx + DANCER_ROSTER.length - 1) % DANCER_ROSTER.length;
    } else if (dir === 'RIGHT') {
      if (phase2Row === 0) selectedDancerIdx = (selectedDancerIdx + 1) % DANCER_ROSTER.length;
    }
    return;
  }
}

function processHeldInputs(now) {
  for (const dir in dpadHold) {
    const slot = dpadHold[dir];
    if (!slot.active) continue;
    if (now > slot.holdUntil) {
      slot.active = false;
      continue;
    }
    if (phase !== 'JIGGING' && now >= slot.nextRepeat) {
      handleCardinalStep(dir);
      slot.nextRepeat = now + REPEAT_DELAY_MS;
    }
  }
}

function handleActionA() {
  initAudio();

  if (phase === 'BAND_SELECT') {
    if (bandCursor === 5) {
      activeProfile = computeXYZProfile();
      phase = 'DANCER_SELECT';
      phase2Row = 0;
    } else {
      bandCursor = Math.min(5, bandCursor + 1);
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (phase2Row === 0) {
      phase2Row = 1;
    } else {
      startJiggingPhase();
    }
    return;
  }

  if (phase === 'JIGGING') {
    handleJigTap('A');
    return;
  }

  if (phase === 'RESULTS') {
    returnToBandBuilder();
  }
}

function handleActionB() {
  initAudio();

  if (phase === 'BAND_SELECT') {
    if (bandCursor < 5) {
      cycleBandSlot(bandCursor, +1);
    } else {
      activeProfile = computeXYZProfile();
      phase = 'DANCER_SELECT';
      phase2Row = 0;
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (phase2Row === 0) {
      selectedDancerIdx = (selectedDancerIdx + 1) % DANCER_ROSTER.length;
    } else {
      phase = 'BAND_SELECT';
    }
    return;
  }

  if (phase === 'JIGGING') {
    handleJigTap('B');
    return;
  }

  if (phase === 'RESULTS') {
    returnToBandBuilder();
  }
}

window.addEventListener('message', function(event) {
  const raw = event.data;
  let msg = raw;
  if (typeof raw === 'string' && raw.startsWith('{')) {
    try { msg = JSON.parse(raw); } catch (e) {}
  }
  const cmd = (typeof msg === 'string') ? msg : (msg && (msg.type || msg.action || msg.cmd || msg.command || msg.button));
  if (!cmd || typeof cmd !== 'string') return;

  if (cmd === 'PAUSE') {
    isPaused = true;
    clearInputStates();
    clearTimeout(schedulerTimer);
    schedulerTimer = null;
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    return;
  }
  if (cmd === 'RESUME') {
    isPaused = false;
    clearInputStates();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && phase === 'JIGGING' && !schedulerTimer && currentStep < totalSongSteps) {
      nextStepTime = audioCtx.currentTime + 0.08;
      scheduler();
    }
    return;
  }
  if (isPaused) return;

  if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'DPAD_RELEASE' || cmd === 'NEUTRAL') {
    clearInputStates();
    return;
  }

  const now = performance.now();

  for (const dir of ['UP', 'DOWN', 'LEFT', 'RIGHT']) {
    if (cmd === `DPAD_${dir}` || cmd === `DPAD_${dir}_PRESS`) {
      const slot = dpadHold[dir];
      if (!slot.active) {
        handleCardinalStep(dir);
        slot.nextRepeat = now + REPEAT_DELAY_MS;
      }
      slot.active = true;
      slot.holdUntil = now + HOLD_WINDOW_MS;
      return;
    }
    if (cmd === `DPAD_${dir}_RELEASE`) {
      dpadHold[dir].active = false;
      dpadHold[dir].holdUntil = 0;
      return;
    }
  }

  if (cmd === 'BUTTON_A' || cmd === 'BUTTON_A_PRESS') {
    if (now - btnDebounce.BUTTON_A >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_A = now;
      handleActionA();
    }
    return;
  }

  if (cmd === 'BUTTON_B' || cmd === 'BUTTON_B_PRESS') {
    if (now - btnDebounce.BUTTON_B >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_B = now;
      handleActionB();
    }
    return;
  }
});

// ============================================================================
// PIXEL ART HELPERS & CHARACTER RENDERERS
// ============================================================================
function pxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawText(txt, x, y, size, color, align = 'center') {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = PAL.INK;
  ctx.fillText(txt, Math.floor(x) + 2, Math.floor(y) + 2);
  ctx.fillStyle = color;
  ctx.fillText(txt, Math.floor(x), Math.floor(y));
}

function fmtSigned(n) {
  return n > 0 ? `+${n}` : `${n}`;
}

function drawMusicianMini(type, id, cx, cy, scale = 3, beatPulse = false, isMuted = false) {
  const s = scale;
  const bob = (id !== 'NONE' && !isMuted && beatPulse) ? -s : 0;
  const x = Math.floor(cx - 6 * s);
  const y = Math.floor(cy - 14 * s + bob);

  if (id === 'NONE') {
    pxRect(cx - 5 * s, cy - 4 * s, 10 * s, s, PAL.LOG_LIGHT);
    pxRect(cx - 4 * s, cy - 3 * s, s, 3 * s, PAL.LOG_DARK);
    pxRect(cx + 3 * s, cy - 3 * s, s, 3 * s, PAL.LOG_DARK);
    return;
  }

  ctx.save();
  if (isMuted) ctx.globalAlpha = 0.4;

  if (type === 'FIDDLE') {
    const fObj = FIDDLE_ROSTER.find(f => f.id === id) || FIDDLE_ROSTER[0];
    pxRect(x + 3 * s, y, 6 * s, 2 * s, fObj.hat);
    pxRect(x + 2 * s, y + 2 * s, 8 * s, s, PAL.SASH_GOLD);
    pxRect(x + 3 * s, y + 3 * s, 6 * s, 3 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, fObj.coat);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 8 * s, y + 5 * s, 4 * s, 2 * s, '#B85D19');
    if (id === 'SPOON_CORD') {
      const tapY = (!isMuted && beatPulse) ? y + 3 * s : y + 5 * s;
      pxRect(x + 8 * s, tapY, 4 * s, 2, PAL.SASH_GOLD);
    } else {
      const bowShift = (!isMuted && beatPulse) ? -s : s;
      pxRect(x + 7 * s, y + 4 * s + bowShift, 6 * s, 2, PAL.WHITE);
    }
  } else if (type === 'HAND') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, PAL.SASH_TEAL);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 4 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.CAPOTE_RED);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_GOLD);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    const handY = (!isMuted && beatPulse) ? y + 6 * s : y + 8 * s;
    const toolCol = (id === 'BONES') ? PAL.CAPOTE_CREAM : '#A8B2BD';
    pxRect(x + s, handY, 2 * s, s, toolCol);
    pxRect(x + 9 * s, handY, 2 * s, s, toolCol);
  } else if (type === 'BIG') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 4 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.BUFFALO_FUR);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    if (id === 'DRUM') {
      pxRect(x + 7 * s, y + 5 * s, 5 * s, 5 * s, PAL.CAPOTE_CREAM);
      pxRect(x + 8 * s, y + 6 * s, 3 * s, 3 * s, PAL.SASH_RED);
    } else if (id === 'ANVIL') {
      pxRect(x + 7 * s, y + 9 * s, 6 * s, 3 * s, PAL.IRON_DARK);
      pxRect(x + 6 * s, y + 8 * s, 8 * s, s, PAL.IRON_LIGHT);
      const hamY = (!isMuted && beatPulse) ? y + 4 * s : y + 7 * s;
      pxRect(x + 9 * s, hamY, 3 * s, s, PAL.IRON_LIGHT);
    }
  }
  ctx.restore();
}

function drawDancerSprite(dancer, cx, cy, scale = 4, pose = 'IDLE') {
  const s = scale;
  const x = Math.floor(cx - 6 * s);
  const y = Math.floor(cy - 13 * s);

  pxRect(cx - 22, cy - 2, 44, 6, 'rgba(0,0,0,0.45)');

  if (pose === 'FALL') {
    pxRect(x + 2 * s, y + 7 * s, 8 * s, 4 * s, dancer.topCol);
    pxRect(x + s, y + 6 * s, 3 * s, 3 * s, PAL.SKIN);
    pxRect(x + 9 * s, y + 8 * s, 3 * s, 2 * s, PAL.SASH_TEAL);
    return;
  }

  if (dancer.gender === 'F') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, dancer.hatCol);
    pxRect(x + 2 * s, y + 2 * s, s, 4 * s, PAL.HAIR_DARK);
    pxRect(x + 9 * s, y + 2 * s, s, 4 * s, PAL.HAIR_DARK);
  } else {
    pxRect(x + 4 * s, y, 4 * s, s, dancer.hatCol);
    pxRect(x + 3 * s, y + s, 6 * s, s, dancer.hatCol);
  }

  pxRect(x + 3 * s, y + s, 6 * s, 2 * s, PAL.SKIN);

  // Motionless Upper Torso & Sash
  pxRect(x + 3 * s, y + 3 * s, 6 * s, 3 * s, dancer.topCol);
  pxRect(x + 4 * s, y + 5 * s, 4 * s, s, dancer.sashCol);
  pxRect(x + s, y + 4 * s, 2 * s, s, dancer.topCol);
  pxRect(x + 9 * s, y + 4 * s, 2 * s, s, dancer.topCol);
  pxRect(x, y + 5 * s, s, s, PAL.SKIN);
  pxRect(x + 11 * s, y + 5 * s, s, s, PAL.SKIN);

  if (dancer.gender === 'F') {
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 3 * s, dancer.botCol);
    pxRect(x + 2 * s, y + 8 * s, 8 * s, s, dancer.sashCol);
  }

  if (pose === 'JIG_R') {
    pxRect(x + 3 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 8 * s, 3 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + 9 * s, y + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
  } else if (pose === 'JIG_L') {
    pxRect(x + 2 * s, y + 8 * s, 3 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + s, y + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
    pxRect(x + 7 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
  } else if (pose === 'LIFT') {
    pxRect(x + 4 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 4 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 8 * s, 2 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + 8 * s, y + 8 * s, 2 * s, s, PAL.SASH_RED);
  } else {
    pxRect(x + 4 * s, y + 8 * s, 4 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
  }
}

function drawKitchenBackdrop(floorY) {
  const logH = 22;
  for (let y = 34; y < floorY; y += logH) {
    pxRect(0, y, VIEW_W, logH - 3, PAL.LOG_MID);
    pxRect(0, y, VIEW_W, 4, PAL.LOG_LIGHT);
    pxRect(0, y + logH - 7, VIEW_W, 4, PAL.LOG_DARK);
    pxRect(0, y + logH - 3, VIEW_W, 3, PAL.CHINKING);
  }
  pxRect(0, 34, 16, floorY - 34, PAL.LOG_DARK);
  pxRect(VIEW_W - 16, 34, 16, floorY - 34, PAL.LOG_DARK);

  const hearthX = Math.max(26, Math.floor(VIEW_W * 0.1));
  const hearthW = 72;
  const hearthTop = floorY - 92;
  pxRect(hearthX, hearthTop, hearthW, 92, '#4A4947');
  pxRect(hearthX + 4, hearthTop + 4, hearthW - 8, 88, '#696764');
  pxRect(hearthX - 6, hearthTop - 6, hearthW + 12, 8, PAL.LOG_DARK);
  pxRect(hearthX + 16, floorY - 44, hearthW - 32, 44, PAL.INK);
  const flicker = Math.sin(animFrame * 0.25) * 4;
  pxRect(hearthX + 20, floorY - 24 - flicker, 32, 24 + flicker, PAL.FIRE_RED);
  pxRect(hearthX + 24, floorY - 18 - flicker * 0.7, 24, 18 + flicker * 0.7, PAL.FIRE_ORANGE);
  pxRect(hearthX + 29, floorY - 10, 14, 10, PAL.FIRE_GOLD);

  const winX = Math.min(VIEW_W - 90, Math.floor(VIEW_W * 0.78));
  const winY = floorY - 96;
  pxRect(winX, winY, 52, 46, PAL.LOG_DARK);
  pxRect(winX + 4, winY + 4, 44, 38, '#132842');
  pxRect(winX + 4, winY + 28, 44, 14, '#DDF2FF');
  pxRect(winX + 24, winY + 4, 4, 38, PAL.LOG_DARK);
  pxRect(winX + 4, winY + 20, 44, 4, PAL.LOG_DARK);

  pxRect(0, floorY, VIEW_W, VIEW_H - floorY, PAL.FLOOR_MID);
  pxRect(0, floorY, VIEW_W, 4, PAL.LOG_DARK);
  for (let py = floorY + 14; py < VIEW_H; py += 16) {
    pxRect(0, py, VIEW_W, 2, PAL.FLOOR_DARK);
  }
  const midX = Math.floor(VIEW_W / 2);
  pxRect(midX - 66, floorY + 18, 132, 24, PAL.SASH_RED);
  pxRect(midX - 60, floorY + 21, 120, 18, PAL.SASH_TEAL);
  pxRect(midX - 54, floorY + 24, 108, 12, PAL.SASH_GOLD);
  pxRect(midX - 48, floorY + 27, 96, 6, PAL.CAPOTE_CREAM);
}

// PHASE 1: BAND BUILDER PAGE (WITH LIVE X/Y/Z MODULATOR READOUT)
function drawBandBuilderPhase() {
  pxRect(0, 0, VIEW_W, VIEW_H, PAL.PANEL_BG);

  const prof = activeProfile;

  pxRect(0, 0, VIEW_W, 38, PAL.INK);
  pxRect(0, 36, VIEW_W, 2, PAL.FIRE_ORANGE);
  drawText("PHASE 1: BAND & X/Y/Z TUNE MODULATOR", VIEW_W / 2, 16, 9, PAL.FIRE_GOLD, 'center');
  drawText(`RESULT: ${prof.trackTitle} (${prof.bpm} BPM)`, VIEW_W / 2, 31, 7, PAL.SASH_TEAL, 'center');

  const slotDefs = [
    { label: 'SLOT 1 [X]', axisTag: `X: ${fmtSigned(FIDDLE_ROSTER[bandSlots[0]].x)}`, type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[0]] },
    { label: 'SLOT 2 [Y]', axisTag: `Y: ${fmtSigned(FIDDLE_ROSTER[bandSlots[1]].y)}`, type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[1]] },
    { label: 'SLOT 3 [Z]', axisTag: `Z: ${fmtSigned(FIDDLE_ROSTER[bandSlots[2]].z)}`, type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[2]] },
    { label: 'HAND PERC',  axisTag: 'RHYTHM', type: 'HAND',   item: HAND_PERC_ROSTER[bandSlots[3]] },
    { label: 'BIG PERC',   axisTag: 'PULSE',  type: 'BIG',    item: BIG_PERC_ROSTER[bandSlots[4]] }
  ];

  const margin = 12;
  const gap = 6;
  const cardW = Math.floor((VIEW_W - margin * 2 - gap * 4) / 5);
  const cardTop = 48;
  const cardH = 198;

  for (let i = 0; i < 5; i++) {
    const sDef = slotDefs[i];
    const cx = margin + i * (cardW + gap);
    const isSel = (bandCursor === i);

    pxRect(cx, cardTop, cardW, cardH, isSel ? PAL.CARD_SEL : PAL.CARD_BG);
    ctx.strokeStyle = isSel ? PAL.FIRE_GOLD : (sDef.item.id === 'NONE' ? '#3B2C24' : PAL.SASH_TEAL);
    ctx.lineWidth = isSel ? 3 : 1;
    ctx.strokeRect(cx, cardTop, cardW, cardH);

    drawText(sDef.label, cx + cardW / 2, cardTop + 16, 6, isSel ? PAL.FIRE_GOLD : PAL.CAPOTE_CREAM, 'center');

    if (isSel) {
      drawText("▲", cx + cardW / 2, cardTop + 31, 8, PAL.FIRE_ORANGE, 'center');
      drawText("▼", cx + cardW / 2, cardTop + 122, 8, PAL.FIRE_ORANGE, 'center');
    }

    pxRect(cx + 8, cardTop + 104, cardW - 16, 8, PAL.FLOOR_MID);
    drawMusicianMini(sDef.type, sDef.item.id, cx + cardW / 2, cardTop + 106, 3, isSel && (Math.floor(animFrame / 14) % 2 === 0));

    drawText(sDef.item.name, cx + cardW / 2, cardTop + 138, 7, PAL.WHITE, 'center');
    drawText(sDef.item.style, cx + cardW / 2, cardTop + 155, 5, PAL.SASH_TEAL, 'center');
    drawText(sDef.axisTag, cx + cardW / 2, cardTop + 174, 7, i < 3 ? PAL.FIRE_GOLD : PAL.CAPOTE_CREAM, 'center');
  }

  // Resulting Track & Slot Description Box
  const descBoxY = cardTop + cardH + 8;
  pxRect(margin, descBoxY, VIEW_W - margin * 2, 44, PAL.INK);
  ctx.strokeStyle = PAL.LOG_LIGHT;
  ctx.lineWidth = 1;
  ctx.strokeRect(margin, descBoxY, VIEW_W - margin * 2, 44);

  if (bandCursor < 5) {
    const activeItem = slotDefs[bandCursor].item;
    drawText(activeItem.desc, VIEW_W / 2, descBoxY + 17, 6, PAL.CAPOTE_CREAM, 'center');
    drawText(prof.trackSub, VIEW_W / 2, descBoxY + 34, 6, PAL.SASH_GOLD, 'center');
  } else {
    drawText(`LOCK IN: ${prof.trackTitle}`, VIEW_W / 2, descBoxY + 17, 7, PAL.FIRE_GOLD, 'center');
    drawText(prof.trackSub, VIEW_W / 2, descBoxY + 34, 6, PAL.SASH_TEAL, 'center');
  }

  const nextBtnY = VIEW_H - 70;
  const nextSel = (bandCursor === 5);
  pxRect(VIEW_W / 2 - 140, nextBtnY, 280, 32, nextSel ? PAL.FIRE_ORANGE : PAL.CAPOTE_RED);
  ctx.strokeStyle = nextSel ? PAL.WHITE : PAL.FIRE_GOLD;
  ctx.lineWidth = nextSel ? 3 : 2;
  ctx.strokeRect(VIEW_W / 2 - 140, nextBtnY, 280, 32);
  drawText("NEXT: CHOOSE DANCER ->", VIEW_W / 2, nextBtnY + 21, 8, nextSel ? PAL.INK : PAL.WHITE, 'center');

  pxRect(0, VIEW_H - 24, VIEW_W, 24, PAL.INK);
  drawText("L/R: SLOT   U/D or B: CHANGE   A: CONFIRM", VIEW_W / 2, VIEW_H - 8, 7, PAL.SASH_GOLD, 'center');
}

// PHASE 3: JOYSTICK HOLD + A/B JIGGING MINI-GAME STAGE
function drawJiggingPhase() {
  const topBarH = 38;
  const bottomBarH = 86;
  const bottomBarTop = VIEW_H - bottomBarH;
  const floorY = bottomBarTop - 48;
  const beatPulse = (Math.floor(currentStep / 2) % 2 === 0);

  const dancer = DANCER_ROSTER[selectedDancerIdx];
  const nextActiveBeat = expectedBeats.find(b => !b.hit && !b.missed && b.btn !== 'LIFT');
  const activeSongPhaseIdx = nextActiveBeat ? nextActiveBeat.songPhaseIdx : getSongPhaseIndex(currentStep);
  const reqDir = dancer.phaseDirs[activeSongPhaseIdx] || 'RIGHT';
  const heldDir = getActiveHeldDirection();
  const dirMatched = (heldDir === reqDir);

  drawKitchenBackdrop(floorY);

  pxRect(0, 0, VIEW_W, topBarH, PAL.INK);
  pxRect(0, topBarH - 2, VIEW_W, 2, PAL.FIRE_ORANGE);

  drawText(`SCORE:${score}`, 12, 16, 10, PAL.WHITE, 'left');
  drawText(`COMBO:${combo}x`, VIEW_W - 12, 16, 10, combo >= 5 ? PAL.FIRE_ORANGE : PAL.SASH_TEAL, 'right');
  drawText(`${activeProfile.trackTitle} • ${activeProfile.boundaries[activeSongPhaseIdx].label}`, VIEW_W / 2, 31, 6, PAL.FIRE_GOLD, 'center');

  const prog = totalSongSteps > 0 ? Math.min(1, currentStep / totalSongSteps) : 0;
  pxRect(0, topBarH, VIEW_W, 4, PAL.LOG_DARK);
  pxRect(0, topBarH, Math.floor(VIEW_W * prog), 4, PAL.SASH_TEAL);

  const colW = VIEW_W / 5;
  const backY = floorY + 12;
  const frontY = floorY + 34;

  const slotConfigs = [
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[0]].id, x: colW * 0.50, muted: false },
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[1]].id, x: colW * 1.35, muted: activeProfile.soloMode },
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[2]].id, x: colW * 3.55, muted: activeProfile.soloMode },
    { type: 'HAND',   id: HAND_PERC_ROSTER[bandSlots[3]].id, x: colW * 4.25, muted: activeProfile.soloMode },
    { type: 'BIG',    id: BIG_PERC_ROSTER[bandSlots[4]].id, x: colW * 4.78, muted: activeProfile.soloMode }
  ];

  for (const sc of slotConfigs) {
    if (sc.id !== 'NONE' && !sc.muted) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sc.x, 42);
      ctx.lineTo(sc.x - 28, backY + 6);
      ctx.lineTo(sc.x + 28, backY + 6);
      ctx.closePath();
      ctx.fillStyle = 'rgba(247, 200, 68, 0.14)';
      ctx.fill();
      ctx.restore();
    }
    drawMusicianMini(sc.type, sc.id, sc.x, backY, 3, beatPulse, sc.muted);
  }

  drawDancerSprite(dancer, VIEW_W * 0.48, frontY, 4, jiggerPose);

  if (phaseShiftBanner.timer > 0 && phaseShiftBanner.text) {
    const bw = Math.min(VIEW_W - 24, phaseShiftBanner.text.length * 10 + 28);
    pxRect(VIEW_W / 2 - bw / 2, topBarH + 8, bw, 22, PAL.INK);
    ctx.strokeStyle = PAL.FIRE_GOLD;
    ctx.lineWidth = 2;
    ctx.strokeRect(VIEW_W / 2 - bw / 2, topBarH + 8, bw, 22);
    drawText(phaseShiftBanner.text, VIEW_W / 2, topBarH + 23, 8, PAL.FIRE_GOLD, 'center');
  }

  pxRect(0, bottomBarTop, VIEW_W, bottomBarH, PAL.INK);
  pxRect(0, bottomBarTop, VIEW_W, 3, PAL.SASH_TEAL);

  // Joystick Direction Hold Box
  const joyBoxX = 10;
  const joyBoxY = bottomBarTop + 8;
  const joyBoxW = 76;
  const joyBoxH = 56;
  pxRect(joyBoxX, joyBoxY, joyBoxW, joyBoxH, dirMatched ? '#103B2C' : '#2E110E');
  ctx.strokeStyle = dirMatched ? PAL.SASH_TEAL : PAL.FIRE_GOLD;
  ctx.lineWidth = 2;
  ctx.strokeRect(joyBoxX, joyBoxY, joyBoxW, joyBoxH);

  drawText("HOLD", joyBoxX + joyBoxW / 2, joyBoxY + 13, 6, PAL.CAPOTE_CREAM, 'center');
  drawText(DIR_ARROWS[reqDir], joyBoxX + joyBoxW / 2, joyBoxY + 36, 16, dirMatched ? PAL.SASH_TEAL : PAL.FIRE_GOLD, 'center');
  drawText(reqDir, joyBoxX + joyBoxW / 2, joyBoxY + 50, 6, dirMatched ? PAL.SASH_TEAL : PAL.WHITE, 'center');

  // Side-Scrolling A/B Rhythm Track
  const trackX = joyBoxX + joyBoxW + 8;
  const trackW = VIEW_W - trackX - 10;
  const hitX = trackX + 26;
  pxRect(trackX, joyBoxY, trackW, joyBoxH, '#0D2A3A');

  ctx.strokeStyle = dirMatched ? PAL.SASH_TEAL : PAL.FIRE_GOLD;
  ctx.lineWidth = 3;
  ctx.strokeRect(hitX - 18, joyBoxY + 5, 36, 46);
  drawText("B/A", hitX, joyBoxY + 32, 8, PAL.FIRE_GOLD, 'center');

  if (audioCtx) {
    const now = audioCtx.currentTime;
    for (let i = 0; i < expectedBeats.length; i++) {
      const b = expectedBeats[i];
      const nx = hitX + (b.time - now) * NOTE_SPEED;
      if (nx > trackX - 16 && nx < VIEW_W + 30) {
        if (b.btn === 'LIFT') {
          ctx.strokeStyle = 'rgba(247, 200, 68, 0.45)';
          ctx.lineWidth = 1;
          ctx.strokeRect(nx - 8, joyBoxY + 14, 16, 28);
          drawText("LIFT", nx, joyBoxY + 31, 5, 'rgba(247, 200, 68, 0.65)', 'center');
        } else if (!b.hit && !b.missed) {
          const noteCol = (b.btn === 'B') ? PAL.FIRE_ORANGE : PAL.SASH_TEAL;
          pxRect(nx - 13, joyBoxY + 8, 26, 40, noteCol);
          ctx.strokeStyle = PAL.WHITE;
          ctx.lineWidth = 2;
          ctx.strokeRect(nx - 13, joyBoxY + 8, 26, 40);
          drawText(b.btn, nx, joyBoxY + 30, 10, PAL.INK, 'center');
          drawText(DIR_ARROWS[b.dir], nx, joyBoxY + 44, 7, PAL.WHITE, 'center');
        }
      }
    }
  }

  drawText(`HOLD ${reqDir} ${DIR_ARROWS[reqDir]} + TAP B (RIGHT) / A (LEFT)`, VIEW_W / 2, VIEW_H - 7, 7, PAL.CAPOTE_CREAM, 'center');

  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.life);
    drawText(ft.text, ft.x, ft.y, 14, ft.color, 'center');
    ctx.restore();
  }
}

// END-OF-SONG SCORE CARD
function drawResultsPhase() {
  pxRect(0, 0, VIEW_W, VIEW_H, PAL.PANEL_BG);
  pxRect(0, 0, VIEW_W, 38, PAL.INK);
  pxRect(0, 36, VIEW_W, 2, PAL.FIRE_GOLD);
  drawText("PERFORMANCE COMPLETE!", VIEW_W / 2, 24, 11, PAL.FIRE_GOLD, 'center');

  const dancer = DANCER_ROSTER[selectedDancerIdx];
  drawDancerSprite(dancer, VIEW_W / 2, 175, 4, 'JIG_R');

  drawText(`${activeProfile.trackTitle} • ${dancer.styleTitle}`, VIEW_W / 2, 212, 7, PAL.SASH_TEAL, 'center');
  drawText(`FINAL SCORE: ${score}`, VIEW_W / 2, 248, 12, PAL.WHITE, 'center');
  drawText(`MAX COMBO: ${maxCombo}x`, VIEW_W / 2, 276, 10, PAL.FIRE_ORANGE, 'center');

  pxRect(VIEW_W / 2 - 150, VIEW_H - 72, 300, 34, PAL.SASH_TEAL);
  drawText("PRESS A: RETURN TO MENU", VIEW_W / 2, VIEW_H - 50, 8, PAL.INK, 'center');
}

// ============================================================================
// MAIN UPDATE & RENDER LOOP
// ============================================================================
function update() {
  animFrame++;
  processHeldInputs(performance.now());

  if (phaseShiftBanner.timer > 0) {
    phaseShiftBanner.timer--;
  }

  if (phase === 'JIGGING' && audioCtx && !isPaused) {
    const now = audioCtx.currentTime;

    if (jiggerPoseTimer > 0 && now >= jiggerPoseTimer) {
      jiggerPose = 'IDLE';
      jiggerPoseTimer = 0;
    }

    const activeBeat = expectedBeats.find(b => !b.hit && !b.missed && b.btn !== 'LIFT');
    if (activeBeat && activeBeat.songPhaseIdx !== lastAnnouncedSongPhase) {
      lastAnnouncedSongPhase = activeBeat.songPhaseIdx;
      const newDir = activeBeat.dir;
      phaseShiftBanner = {
        text: `SHIFT STICK: HOLD ${DIR_ARROWS[newDir]} ${newDir}!`,
        timer: 85
      };
    }

    for (let i = expectedBeats.length - 1; i >= 0; i--) {
      const b = expectedBeats[i];
      if (b.btn === 'LIFT' && !b.triggered && now >= b.time - 0.04) {
        b.triggered = true;
        if (jiggerPose !== 'FALL') {
          jiggerPose = 'LIFT';
          jiggerPoseTimer = now + 0.18;
        }
      }
      if (!b.hit && !b.missed && b.btn !== 'LIFT' && now > b.time + TOLERANCE_GOOD) {
        b.missed = true;
        combo = 0;
        jiggerPose = 'FALL';
        jiggerPoseTimer = now + 0.55;
        playStumbleClonk();
        spawnFloatingText("MISS!", PAL.FIRE_RED);
      }
      if ((b.hit || b.missed) && now > b.time + 0.9) {
        expectedBeats.splice(i, 1);
      }
    }

    if (currentStep >= totalSongSteps && expectedBeats.length === 0 && now > nextStepTime + 0.8) {
      finishSongToMenu();
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.9;
    ft.life -= 0.02;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function draw() {
  if (phase === 'BAND_SELECT') {
    drawBandBuilderPhase();
  } else if (phase === 'DANCER_SELECT') {
    drawDancerSelectPhase();
  } else if (phase === 'JIGGING') {
    drawJiggingPhase();
  } else if (phase === 'RESULTS') {
    drawResultsPhase();
  }
}

function loop() {
  if (!isPaused) {
    update();
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
