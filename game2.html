const BASE_H = 480;
let VIEW_W = 720;
let VIEW_H = 480;

function resizeViewport() {
  const ww = window.innerWidth || 720;
  const wh = window.innerHeight || 480;
  const aspect = ww / Math.max(1, wh);
  VIEW_H = BASE_H;
  VIEW_W = Math.max(480, Math.round(BASE_H * aspect));
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;
  ctx.imageSmoothingEnabled = false;
}

// ============================================================================
// UNIFIED ALGORITHMIC SCORE COMPILER
// Slot 1 -> X (Harmonic Mapping)
// Slot 2 -> Y (Rhythmic Engine)
// Slot 3 -> Z (Structural Macro)
// All 3 slots combine into ONE unified algorithmic score!
// ============================================================================
function computeXYZProfile() {
  const f1 = FIDDLE_ROSTER[bandSlots[0]];
  const f2 = FIDDLE_ROSTER[bandSlots[1]];
  const f3 = FIDDLE_ROSTER[bandSlots[2]];

  const X = Math.max(-10, Math.min(10, f1.x));
  const Y = Math.max(-10, Math.min(10, f2.y));
  const Z = Math.max(-10, Math.min(10, f3.z));

  const activeFiddleIds = [f1.id, f2.id, f3.id].filter(id => id !== 'NONE');
  const hasSpoonCording = activeFiddleIds.includes('SPOON_CORD');

  let bpm = 118;
  if (Y < 0) {
    bpm = Math.round(118 + (Y / 10) * 36);
  } else if (Y > 0) {
    bpm = Math.round(118 + (Y / 10) * 34);
  }

  let trackTitle = 'THE RED RIVER JIG';
  let trackSub = '1860 McDallas • Classic Push-Up & Turnaround';

  if (Y <= -5 && X >= 2) {
    trackTitle = 'MANITOBA WEDDING WALTZ';
    trackSub = '3/4 Prairie Sway • Sweet Double-Stops';
  } else if (Y <= -5) {
    trackTitle = 'ST. BONIFACE FIDDLE AIR';
    trackSub = 'Slow 3/4 Parlor Waltz • Squared Phrases';
  } else if (Y >= 5 && Z >= 3) {
    trackTitle = 'ST. LAURENT BREAKDOWN REEL';
    trackSub = 'High-Speed Dancehall Reel • Crooked Bars';
  } else if (Y >= 5) {
    trackTitle = 'PEMBINA CROSSING REEL';
    trackSub = 'Blistering Cut-Time Double-Shuffle';
  } else if (X <= -4 && Z <= -5) {
    trackTitle = 'LA BARRIERE FRONTIER DRONE';
    trackSub = '1860s Solo Fiddle, Low-A Drone & Foot Tap';
  } else if (X <= -4) {
    trackTitle = 'FORT GARRY LOW-A DRONE JIG';
    trackSub = 'Heavy Cross-Tuned Bass Drone & Swing';
  } else if (Z >= 4) {
    trackTitle = 'BATOCHE CROOKED PUSH-UP';
    trackSub = 'Extended Extra-Bar Fiddle Showcase';
  } else if (X !== 0 || Y !== 0 || Z !== 0) {
    trackTitle = 'STE. ANNE KITCHEN TWO-STEP';
    trackSub = 'Lively Métis Cording & Settlement Groove';
  }

  const semitoneShift = (X >= 2 && X <= 3) ? 0 : Math.round(X / 4);
  const lowADrone = (X <= -4);
  const sweetDoubleStops = (X >= 3);
  const waltzSmooth = (Y <= -5);
  const cutTimeShuffle = (Y >= 5);
  const swingAmount = (Y < 0 && Y > -5) ? Math.min(0.28, Math.abs(Y) * 0.065) : 0;
  const soloMode = (Z <= -6);
  const strictPhrasing = (Z <= -3 && Z > -6);
  const crookedPhrasing = (Z >= 4);

  const partA = strictPhrasing ? RRJ_PART_A.slice(0, 64) : RRJ_PART_A;
  const partB = strictPhrasing ? RRJ_PART_B.slice(0, 64) : RRJ_PART_B;
  const crookedInsert = partA.slice(0, 24);

  let rawSequence = [];
  let boundaries = [];

  if (crookedPhrasing) {
    boundaries = [
      { start: 0, label: 'PART 1: HIGH PUSH-UP' },
      { start: partA.length, label: 'PART 2: CROOKED BAR' },
      { start: partA.length + crookedInsert.length, label: 'PART 3: BREAKDOWN' },
      { start: partA.length + crookedInsert.length + partB.length, label: 'PART 4: PUSH-UP' },
      { start: partA.length * 2 + crookedInsert.length + partB.length, label: 'PART 5: FINALE' }
    ];
    rawSequence = [
      ...partA,
      ...crookedInsert,
      ...partB,
      ...partA,
      ...partB,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  } else if (strictPhrasing) {
    boundaries = [
      { start: 0, label: 'PART 1: WALTZ AIR' },
      { start: partA.length, label: 'PART 2: LOWER SWAY' },
      { start: partA.length + partB.length, label: 'PART 3: HARMONY' },
      { start: partA.length * 2 + partB.length, label: 'PART 4: TURNAROUND' },
      { start: partA.length * 2 + partB.length * 2, label: 'PART 5: FINALE' }
    ];
    rawSequence = [
      ...partA,
      ...partB,
      ...partA,
      ...partB,
      ...partA,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  } else {
    boundaries = [
      { start: 0, label: 'PART 1: SEGNO PUSH-UP' },
      { start: partA.length, label: 'PART 2: LOW STRINGS' },
      { start: partA.length + partB.length, label: 'PART 3: D.S. PUSH-UP' },
      { start: partA.length * 2 + partB.length, label: 'PART 4: TURNAROUND' },
      { start: partA.length * 2 + partB.length * 2, label: 'PART 5: FINAL PUSH-UP' }
    ];
    rawSequence = [
      ...partA,
      ...partB,
      ...partA,
      ...partB,
      ...partA,
      { n: 62, d: 62, tie: true }, { n: 0, d: 0 }
    ];
  }

  // Compile ONE unified algorithmic score from X, Y, Z parameters
  const unifiedScore = rawSequence.map((ev, idx) => {
    const baseLead = ev.tri ? (waltzSmooth ? ev.tri[0] : null) : ev.n;
    const shiftedLead = baseLead ? baseLead + semitoneShift : 0;
    const shiftedTri = (ev.tri && !waltzSmooth) ? ev.tri.map(n => n + semitoneShift) : null;
    const shiftedGrace = (ev.grace && !waltzSmooth) ? ev.grace + semitoneShift : 0;

    let droneNote = 0;
    if (lowADrone) {
      droneNote = (idx % 2 === 0) ? 57 : 0;
    } else if (sweetDoubleStops && shiftedLead) {
      droneNote = shiftedLead - 4;
    } else if (ev.d) {
      droneNote = ev.d + semitoneShift;
    }

    return {
      lead: shiftedLead,
      tri: shiftedTri,
      grace: shiftedGrace,
      drone: droneNote,
      tie: !!ev.tie,
      doubleShuffle: cutTimeShuffle && !ev.tri && !ev.tie && !!shiftedLead,
      legato: waltzSmooth
    };
  });

  return {
    X, Y, Z,
    bpm,
    trackTitle,
    trackSub,
    hasSpoonCording,
    activeFiddleCount: activeFiddleIds.length,
    swingAmount,
    soloMode,
    waltzSmooth,
    boundaries,
    score: unifiedScore
  };
}

  let idx = 0;

// ============================================================================
// WEB AUDIO ENGINE (PLAYS ONE UNIFIED ALGORITHMIC SCORE)
// ============================================================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let noiseBuffer = null;
let nextStepTime = 0.0;
let schedulerTimer = null;
let activeNodes = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    const bufferSize = audioCtx.sampleRate * 1.0;
    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }
  if (audioCtx.state === 'suspended' && !isPaused) {
    audioCtx.resume();
  }
}

function startBandPreviewIfNeeded() {
  initAudio();
  if (phase === 'BAND_SELECT' && !isPreviewPlaying && !isPaused) {
    isPreviewPlaying = true;
    previewStep = 0;
    nextStepTime = audioCtx.currentTime + 0.08;
    clearTimeout(schedulerTimer);
    scheduler();
  }
}

document.addEventListener('touchstart', startBandPreviewIfNeeded, { passive: true });
document.addEventListener('mousedown', startBandPreviewIfNeeded, { passive: true });

function registerNode(node) {
  activeNodes.push(node);
  node.onended = () => {
    const idx = activeNodes.indexOf(node);
    if (idx > -1) activeNodes.splice(idx, 1);
  };
}

function stopAllAudio() {
  activeNodes.forEach(n => {
    try { n.stop(); } catch (e) {}
  });
  activeNodes = [];
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function playFiddleTone(midi, time, dur, gainVal, detuneCents = 0) {
  if (!midi || !audioCtx || gainVal <= 0) return;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(midiToFreq(midi), time);
  if (detuneCents !== 0) osc.detune.setValueAtTime(detuneCents, time);

  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1480, time);
  filter.Q.setValueAtTime(1.35, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainVal, time + 0.012);
  gain.gain.setValueAtTime(gainVal * 0.85, time + dur * 0.72);
  gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.01);
  registerNode(osc);
}

function playSpoonCordAccent(rootMidi, time, stepDur, stepIdx, gainScale) {
  if (!audioCtx) return;
  if (stepIdx % 2 === 0) {
    const chordRoot = rootMidi ? rootMidi - 12 : 57;
    playFiddleTone(chordRoot, time, stepDur * 0.65, 0.065 * gainScale, -4);
  } else {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(340, time);
    osc.frequency.exponentialRampToValueAtTime(145, time + 0.045);
    gain.gain.setValueAtTime(0.11 * gainScale, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.055);
    registerNode(osc);
  }
}

function playFootTap(time, gainScale = 1.0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(92, time);
  osc.frequency.exponentialRampToValueAtTime(44, time + 0.07);
  gain.gain.setValueAtTime(0.24 * gainScale, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.075);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.08);
  registerNode(osc);
}

function playHandPerc(percId, time, stepDur, stepIdx, gainScale = 1.0) {
  if (percId === 'NONE' || activeProfile.soloMode || !audioCtx || !noiseBuffer) return;

  if (percId === 'SPOONS') {
    if (stepIdx % 2 === 0) {
      const pairDur = stepDur * 2;
      const hits = activeProfile.waltzSmooth ? [0] : [0, 0.33, 0.66];
      hits.forEach((h, i) => {
        const t = time + pairDur * h;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(i === 0 ? 165 : 135, t);
        osc.frequency.exponentialRampToValueAtTime(68, t + 0.07);
        gain.gain.setValueAtTime((i === 0 ? 0.22 : 0.14) * gainScale, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
        registerNode(osc);
      });
    }
  } else if (percId === 'BONES') {
    if (stepIdx % 2 === 1 || stepIdx % 4 === 0) {
      const accent = (stepIdx % 4 === 2);
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(accent ? 2150 : 1850, time);
      filter.Q.setValueAtTime(3.2, time);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime((accent ? 0.22 : 0.13) * gainScale, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.055);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(time);
      noise.stop(time + 0.06);
      registerNode(noise);
    }
  }
}

function playBigPerc(bigId, time, stepIdx, gainScale = 1.0) {
  if (activeProfile.soloMode) {
    if (stepIdx % 4 === 0) playFootTap(time, gainScale);
    return;
  }
  if (bigId === 'NONE' || !audioCtx) return;

  if (bigId === 'DRUM') {
    const mod = activeProfile.waltzSmooth ? 6 : 4;
    if (stepIdx % mod === 0) {
      const accent = (stepIdx % (mod * 2) === 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(accent ? 105 : 88, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.18);
      gain.gain.setValueAtTime((accent ? 0.34 : 0.24) * gainScale, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.19);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.2);
      registerNode(osc);
    }
  } else if (bigId === 'ANVIL') {
    if (stepIdx % 4 === 2) {
      const freqs = [1174.66, 1760.0, 2637.02];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, time);
        const vol = (idx === 0 ? 0.14 : 0.06) * gainScale;
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.25);
        registerNode(osc);
      });
    }
  }
}

function playStumbleClonk() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
  gain.gain.setValueAtTime(0.32, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.18);
  registerNode(osc);
}

// ============================================================================
// PHASE TRANSITIONS & HALF-TEMPO JIG SEQUENCER
// ============================================================================
function startJiggingPhase() {
  initAudio();
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  isPreviewPlaying = false;
  stopAllAudio();

  activeProfile = computeXYZProfile();
  totalSongSteps = activeProfile.score.length;
  currentStep = 0;
  expectedBeats = [];
  floatingTexts = [];
  score = 0;
  combo = 0;
  maxCombo = 0;
  jiggerPose = 'IDLE';
  jiggerPoseTimer = 0;

  phase = 'JIGGING';
  nextStepTime = audioCtx.currentTime + 0.75;
  scheduler();
}

function finishSongToMenu() {
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  isPreviewPlaying = false;
  stopAllAudio();
  expectedBeats = [];
  phase = 'RESULTS';
}

function returnToBandBuilder() {
  clearTimeout(schedulerTimer);
  schedulerTimer = null;
  stopAllAudio();
  expectedBeats = [];
  activeProfile = computeXYZProfile();
  phase = 'BAND_SELECT';
  isPreviewPlaying = false;
  startBandPreviewIfNeeded();
}

// Plays ONE unified algorithmic score (never 3 stacked competing fiddle melodies)
function scheduleUnifiedSongAudio(stepIdx, time, stepDur, gainScale) {
  const scoreArr = activeProfile.score;
  const ev = scoreArr[stepIdx % scoreArr.length];

  const swingDelay = (stepIdx % 2 === 1 && activeProfile.swingAmount > 0)
    ? stepDur * activeProfile.swingAmount
    : 0;
  const playTime = time + swingDelay;

  if (activeProfile.activeFiddleCount > 0 && ev) {
    const baseDur = ev.tie ? stepDur * 1.85 : stepDur * 0.92;
    const dur = ev.legato ? baseDur * 1.35 : baseDur;

    // 1. Single Unified Lead Voice
    if (ev.tri) {
      const subDur = stepDur / 3;
      for (let t = 0; t < ev.tri.length; t++) {
        playFiddleTone(ev.tri[t], playTime + t * subDur, subDur * 0.94, 0.115 * gainScale, 0);
      }
    } else if (ev.grace) {
      playFiddleTone(ev.grace, playTime, stepDur * 0.25, 0.08 * gainScale, 0);
      if (ev.lead) playFiddleTone(ev.lead, playTime + stepDur * 0.22, dur * 0.8, 0.115 * gainScale, 0);
    } else if (ev.doubleShuffle) {
      playFiddleTone(ev.lead, playTime, stepDur * 0.45, 0.11 * gainScale, 0);
      playFiddleTone(ev.lead, playTime + stepDur * 0.48, stepDur * 0.45, 0.085 * gainScale, +3);
    } else if (ev.lead) {
      playFiddleTone(ev.lead, playTime, dur, 0.115 * gainScale, 0);
    }

    // 2. Unified Drone / Double-Stop Harmony Voice (when multiple fiddlers or double-stops are active)
    if (ev.drone && (!activeProfile.soloMode || activeProfile.X <= -4)) {
      playFiddleTone(ev.drone, playTime, dur, 0.085 * gainScale, +4);
    }

    // 3. Spoon-Cording accent if Fiddler 5 is in the ensemble
    if (activeProfile.hasSpoonCording && !activeProfile.soloMode) {
      playSpoonCordAccent(ev.drone || ev.lead || 62, playTime, stepDur, stepIdx, gainScale);
    }
  }

  const hp = HAND_PERC_ROSTER[bandSlots[3]].id;
  const bp = BIG_PERC_ROSTER[bandSlots[4]].id;
  playHandPerc(hp, playTime, stepDur, stepIdx, gainScale);
  playBigPerc(bp, playTime, stepIdx, gainScale);

  return playTime;
}

function scheduleJigStep(stepIdx, time, stepDur) {
  if (stepIdx >= totalSongSteps) return;

  const playTime = scheduleUnifiedSongAudio(stepIdx, time, stepDur, 1.0);
  const dancer = DANCER_ROSTER[selectedDancerIdx];

  // Half-tempo quarter-note rhythm prompts (every 4 sixteenth steps)
  if (stepIdx % 4 === 0 && stepIdx < totalSongSteps - 8) {
    const halfTempoBeat = Math.floor(stepIdx / 4) % dancer.stepPattern.length;
    const pat = dancer.stepPattern[halfTempoBeat];

    if (pat.btn === 'LIFT') {
      expectedBeats.push({
        time: playTime,
        btn: 'LIFT',
        cue: pat.cue,
        hit: true,
        missed: false
      });
    } else {
      expectedBeats.push({
        time: playTime,
        btn: pat.btn,
        cue: pat.cue,
        hit: false,
        missed: false
      });
    }
  }
}

function scheduler() {
  if (isPaused || !audioCtx) return;

  if (phase === 'BAND_SELECT' && isPreviewPlaying) {
    const stepDur = (60.0 / activeProfile.bpm) / 4;
    while (nextStepTime < audioCtx.currentTime + 0.8) {
      scheduleUnifiedSongAudio(previewStep, nextStepTime, stepDur, 0.72);
      nextStepTime += stepDur;
      previewStep++;
    }
    schedulerTimer = setTimeout(scheduler, LOOKAHEAD);
    return;
  }

  if (phase === 'JIGGING') {
    const stepDur = (60.0 / activeProfile.bpm) / 4;
    while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD_TIME && currentStep < totalSongSteps) {
      scheduleJigStep(currentStep, nextStepTime, stepDur);
      nextStepTime += stepDur;
      currentStep++;
    }
    if (currentStep < totalSongSteps) {
      schedulerTimer = setTimeout(scheduler, LOOKAHEAD);
    } else {
      schedulerTimer = null;
    }
  }
}

// ============================================================================
// ARCADE CABINET POSTMESSAGE BRIDGE (Single Source of Truth)
// ============================================================================
const dpadHold = {
  UP:    { active: false, holdUntil: 0, nextRepeat: 0 },
  DOWN:  { active: false, holdUntil: 0, nextRepeat: 0 },
  LEFT:  { active: false, holdUntil: 0, nextRepeat: 0 },
  RIGHT: { active: false, holdUntil: 0, nextRepeat: 0 }
};
const btnDebounce = { BUTTON_A: 0, BUTTON_B: 0 };
const HOLD_WINDOW_MS = 145;
const REPEAT_DELAY_MS = 195;
const DEBOUNCE_MS = 105;

function clearInputStates() {
  for (const k in dpadHold) {
    dpadHold[k].active = false;
    dpadHold[k].holdUntil = 0;
    dpadHold[k].nextRepeat = 0;
  }
}

function handleJigTap(btnPressed) {
  if (phase !== 'JIGGING' || !audioCtx || isPaused) return;
  const now = audioCtx.currentTime;

  let closest = null;
  let minDiff = Infinity;
  for (let i = 0; i < expectedBeats.length; i++) {
    const b = expectedBeats[i];
    if (!b.hit && !b.missed && b.btn !== 'LIFT') {
      const diff = Math.abs(now - b.time);
      if (diff < minDiff) {
        minDiff = diff;
        closest = b;
      }
    }
  }

  if (closest && minDiff <= TOLERANCE_GOOD) {
    const exactBtn = (closest.btn === btnPressed);
    if (!exactBtn) {
      // Pressed A when B was required (or vice versa)
      closest.missed = true;
      combo = 0;
      jiggerPose = 'FALL';
      jiggerPoseTimer = now + 0.5;
      playStumbleClonk();
      spawnFloatingText(`PRESS ${closest.btn}!`, PAL.FIRE_RED);
      return;
    }

    closest.hit = true;
    const isFancy = (closest.cue === 'FANCY');
    const label = isFancy
      ? 'FANCY STEP!'
      : (minDiff <= TOLERANCE_PERFECT ? 'PERFECT!' : 'SHUFFLE!');
    const pts = isFancy ? 150 : (minDiff <= TOLERANCE_PERFECT ? 100 : 60);

    score += pts;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    jiggerPose = (btnPressed === 'B') ? 'JIG_R' : 'JIG_L';
    jiggerPoseTimer = now + 0.28;
    spawnFloatingText(label, btnPressed === 'B' ? PAL.FIRE_ORANGE : PAL.SASH_TEAL);
  } else {
    combo = 0;
    jiggerPose = 'FALL';
    jiggerPoseTimer = now + 0.55;
    playStumbleClonk();
    spawnFloatingText("MISSED BEAT!", PAL.FIRE_RED);
  }
}

function spawnFloatingText(text, color) {
  floatingTexts.push({
    text,
    color,
    x: VIEW_W / 2,
    y: VIEW_H - 220,
    life: 1.0
  });
}

function cycleBandSlot(slotIdx, delta) {
  if (slotIdx <= 2) {
    bandSlots[slotIdx] = (bandSlots[slotIdx] + delta + FIDDLE_ROSTER.length) % FIDDLE_ROSTER.length;
  } else if (slotIdx === 3) {
    bandSlots[3] = (bandSlots[3] + delta + HAND_PERC_ROSTER.length) % HAND_PERC_ROSTER.length;
  } else if (slotIdx === 4) {
    bandSlots[4] = (bandSlots[4] + delta + BIG_PERC_ROSTER.length) % BIG_PERC_ROSTER.length;
  }
  activeProfile = computeXYZProfile();
  if (audioCtx && phase === 'BAND_SELECT') {
    stopAllAudio();
    nextStepTime = audioCtx.currentTime + 0.05;
  }
}

function handleCardinalStep(dir) {
  startBandPreviewIfNeeded();

  if (phase === 'BAND_SELECT') {
    if (dir === 'LEFT') {
      bandCursor = (bandCursor + 5) % 6;
    } else if (dir === 'RIGHT') {
      bandCursor = (bandCursor + 1) % 6;
    } else if (dir === 'UP') {
      if (bandCursor < 5) cycleBandSlot(bandCursor, -1);
    } else if (dir === 'DOWN') {
      if (bandCursor < 5) cycleBandSlot(bandCursor, +1);
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (dir === 'UP' || dir === 'DOWN') {
      phase2Row = (phase2Row + 1) % 2;
    } else if (dir === 'LEFT') {
      if (phase2Row === 0) selectedDancerIdx = (selectedDancerIdx + DANCER_ROSTER.length - 1) % DANCER_ROSTER.length;
    } else if (dir === 'RIGHT') {
      if (phase2Row === 0) selectedDancerIdx = (selectedDancerIdx + 1) % DANCER_ROSTER.length;
    }
    return;
  }

  if (phase === 'JIGGING') {
    if (dir === 'UP') {
      returnToBandBuilder();
    }
  }
}

function processHeldInputs(now) {
  for (const dir in dpadHold) {
    const slot = dpadHold[dir];
    if (!slot.active) continue;
    if (now > slot.holdUntil) {
      slot.active = false;
      continue;
    }
    if (now >= slot.nextRepeat) {
      handleCardinalStep(dir);
      slot.nextRepeat = now + REPEAT_DELAY_MS;
    }
  }
}

function handleActionA() {
  startBandPreviewIfNeeded();

  if (phase === 'BAND_SELECT') {
    if (bandCursor === 5) {
      clearTimeout(schedulerTimer);
      schedulerTimer = null;
      isPreviewPlaying = false;
      stopAllAudio();
      activeProfile = computeXYZProfile();
      phase = 'DANCER_SELECT';
      phase2Row = 0;
    } else {
      bandCursor = Math.min(5, bandCursor + 1);
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (phase2Row === 0) {
      phase2Row = 1;
    } else {
      startJiggingPhase();
    }
    return;
  }

  if (phase === 'JIGGING') {
    handleJigTap('A');
    return;
  }

  if (phase === 'RESULTS') {
    returnToBandBuilder();
  }
}

function handleActionB() {
  startBandPreviewIfNeeded();

  if (phase === 'BAND_SELECT') {
    if (bandCursor < 5) {
      cycleBandSlot(bandCursor, +1);
    } else {
      clearTimeout(schedulerTimer);
      schedulerTimer = null;
      isPreviewPlaying = false;
      stopAllAudio();
      activeProfile = computeXYZProfile();
      phase = 'DANCER_SELECT';
      phase2Row = 0;
    }
    return;
  }

  if (phase === 'DANCER_SELECT') {
    if (phase2Row === 0) {
      selectedDancerIdx = (selectedDancerIdx + 1) % DANCER_ROSTER.length;
    } else {
      returnToBandBuilder();
    }
    return;
  }

  if (phase === 'JIGGING') {
    handleJigTap('B');
    return;
  }

  if (phase === 'RESULTS') {
    returnToBandBuilder();
  }
}

window.addEventListener('message', function(event) {
  const raw = event.data;
  let msg = raw;
  if (typeof raw === 'string' && raw.startsWith('{')) {
    try { msg = JSON.parse(raw); } catch (e) {}
  }
  const cmd = (typeof msg === 'string') ? msg : (msg && (msg.type || msg.action || msg.cmd || msg.command || msg.button));
  if (!cmd || typeof cmd !== 'string') return;

  if (cmd === 'PAUSE') {
    isPaused = true;
    clearInputStates();
    clearTimeout(schedulerTimer);
    schedulerTimer = null;
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    return;
  }
  if (cmd === 'RESUME') {
    isPaused = false;
    clearInputStates();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && !schedulerTimer) {
      if (phase === 'BAND_SELECT' && isPreviewPlaying) {
        nextStepTime = audioCtx.currentTime + 0.08;
        scheduler();
      } else if (phase === 'JIGGING' && currentStep < totalSongSteps) {
        nextStepTime = audioCtx.currentTime + 0.08;
        scheduler();
      }
    }
    return;
  }
  if (isPaused) return;

  if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'DPAD_RELEASE' || cmd === 'NEUTRAL') {
    clearInputStates();
    return;
  }

  const now = performance.now();

  for (const dir of ['UP', 'DOWN', 'LEFT', 'RIGHT']) {
    if (cmd === `DPAD_${dir}` || cmd === `DPAD_${dir}_PRESS`) {
      const slot = dpadHold[dir];
      if (!slot.active) {
        handleCardinalStep(dir);
        slot.nextRepeat = now + REPEAT_DELAY_MS;
      }
      slot.active = true;
      slot.holdUntil = now + HOLD_WINDOW_MS;
      return;
    }
    if (cmd === `DPAD_${dir}_RELEASE`) {
      dpadHold[dir].active = false;
      dpadHold[dir].holdUntil = 0;
      return;
    }
  }

  if (cmd === 'BUTTON_A' || cmd === 'BUTTON_A_PRESS') {
    if (now - btnDebounce.BUTTON_A >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_A = now;
      handleActionA();
    }
    return;
  }

  if (cmd === 'BUTTON_B' || cmd === 'BUTTON_B_PRESS') {
    if (now - btnDebounce.BUTTON_B >= DEBOUNCE_MS) {
      btnDebounce.BUTTON_B = now;
      handleActionB();
    }
    return;
  }
});

// ============================================================================
// HIGH-READABILITY PIXEL ART & TEXT HELPERS
// ============================================================================
function pxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawText(txt, x, y, size, color, align = 'center') {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = PAL.INK;
  ctx.fillText(txt, Math.floor(x) + 2, Math.floor(y) + 2);
  ctx.fillStyle = color;
  ctx.fillText(txt, Math.floor(x), Math.floor(y));
}

function drawWrappedText(txt, cx, startY, maxWidth, lineHeight, size, color) {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  const words = txt.split(' ');
  const lines = [];
  let current = '';
  for (const w of words) {
    const test = current ? `${current} ${w}` : w;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  lines.forEach((line, i) => {
    drawText(line, cx, startY + i * lineHeight, size, color, 'center');
  });
}

function drawMusicianMini(type, id, cx, cy, scale = 4, beatPulse = false, isMuted = false) {
  const s = scale;
  const bob = (id !== 'NONE' && !isMuted && beatPulse) ? -s : 0;
  const x = Math.floor(cx - 6 * s);
  const y = Math.floor(cy - 14 * s + bob);

  if (id === 'NONE') {
    pxRect(cx - 5 * s, cy - 4 * s, 10 * s, s, PAL.LOG_LIGHT);
    pxRect(cx - 4 * s, cy - 3 * s, s, 3 * s, PAL.LOG_DARK);
    pxRect(cx + 3 * s, cy - 3 * s, s, 3 * s, PAL.LOG_DARK);
    return;
  }

  ctx.save();
  if (isMuted) ctx.globalAlpha = 0.4;

  if (type === 'FIDDLE') {
    const fObj = FIDDLE_ROSTER.find(f => f.id === id) || FIDDLE_ROSTER[0];
    pxRect(x + 3 * s, y, 6 * s, 2 * s, fObj.hat);
    pxRect(x + 2 * s, y + 2 * s, 8 * s, s, PAL.SASH_GOLD);
    pxRect(x + 3 * s, y + 3 * s, 6 * s, 3 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, fObj.coat);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 8 * s, y + 5 * s, 4 * s, 2 * s, '#B85D19');
    if (id === 'SPOON_CORD') {
      const tapY = (!isMuted && beatPulse) ? y + 3 * s : y + 5 * s;
      pxRect(x + 8 * s, tapY, 4 * s, 2, PAL.SASH_GOLD);
    } else {
      const bowShift = (!isMuted && beatPulse) ? -s : s;
      pxRect(x + 7 * s, y + 4 * s + bowShift, 6 * s, 2, PAL.WHITE);
    }
  } else if (type === 'HAND') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, PAL.SASH_TEAL);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 4 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.CAPOTE_RED);
    pxRect(x + 2 * s, y + 9 * s, 8 * s, s, PAL.SASH_GOLD);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.CAPOTE_BLUE);
    const handY = (!isMuted && beatPulse) ? y + 6 * s : y + 8 * s;
    const toolCol = (id === 'BONES') ? PAL.CAPOTE_CREAM : '#A8B2BD';
    pxRect(x + s, handY, 2 * s, s, toolCol);
    pxRect(x + 9 * s, handY, 2 * s, s, toolCol);
  } else if (type === 'BIG') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, PAL.SASH_RED);
    pxRect(x + 3 * s, y + 2 * s, 6 * s, 4 * s, PAL.SKIN);
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 5 * s, PAL.BUFFALO_FUR);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    if (id === 'DRUM') {
      pxRect(x + 7 * s, y + 5 * s, 5 * s, 5 * s, PAL.CAPOTE_CREAM);
      pxRect(x + 8 * s, y + 6 * s, 3 * s, 3 * s, PAL.SASH_RED);
    } else if (id === 'ANVIL') {
      pxRect(x + 7 * s, y + 9 * s, 6 * s, 3 * s, PAL.IRON_DARK);
      pxRect(x + 6 * s, y + 8 * s, 8 * s, s, PAL.IRON_LIGHT);
      const hamY = (!isMuted && beatPulse) ? y + 4 * s : y + 7 * s;
      pxRect(x + 9 * s, hamY, 3 * s, s, PAL.IRON_LIGHT);
    }
  }
  ctx.restore();
}

function drawDancerSprite(dancer, cx, cy, scale = 5, pose = 'IDLE') {
  const s = scale;
  const x = Math.floor(cx - 6 * s);
  const y = Math.floor(cy - 13 * s);

  pxRect(cx - 26, cy - 2, 52, 7, 'rgba(0,0,0,0.45)');

  if (pose === 'FALL') {
    pxRect(x + 2 * s, y + 7 * s, 8 * s, 4 * s, dancer.topCol);
    pxRect(x + s, y + 6 * s, 3 * s, 3 * s, PAL.SKIN);
    pxRect(x + 9 * s, y + 8 * s, 3 * s, 2 * s, PAL.SASH_TEAL);
    return;
  }

  if (dancer.gender === 'F') {
    pxRect(x + 3 * s, y, 6 * s, 2 * s, dancer.hatCol);
    pxRect(x + 2 * s, y + 2 * s, s, 4 * s, PAL.HAIR_DARK);
    pxRect(x + 9 * s, y + 2 * s, s, 4 * s, PAL.HAIR_DARK);
  } else {
    pxRect(x + 4 * s, y, 4 * s, s, dancer.hatCol);
    pxRect(x + 3 * s, y + s, 6 * s, s, dancer.hatCol);
  }

  pxRect(x + 3 * s, y + s, 6 * s, 2 * s, PAL.SKIN);

  // Motionless Upper Torso & Sash
  pxRect(x + 3 * s, y + 3 * s, 6 * s, 3 * s, dancer.topCol);
  pxRect(x + 4 * s, y + 5 * s, 4 * s, s, dancer.sashCol);
  pxRect(x + s, y + 4 * s, 2 * s, s, dancer.topCol);
  pxRect(x + 9 * s, y + 4 * s, 2 * s, s, dancer.topCol);
  pxRect(x, y + 5 * s, s, s, PAL.SKIN);
  pxRect(x + 11 * s, y + 5 * s, s, s, PAL.SKIN);

  if (dancer.gender === 'F') {
    pxRect(x + 2 * s, y + 6 * s, 8 * s, 3 * s, dancer.botCol);
    pxRect(x + 2 * s, y + 8 * s, 8 * s, s, dancer.sashCol);
  }

  if (pose === 'JIG_R') {
    pxRect(x + 3 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 8 * s, 3 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + 9 * s, y + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
  } else if (pose === 'JIG_L') {
    pxRect(x + 2 * s, y + 8 * s, 3 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + s, y + 9 * s, 2 * s, s, PAL.FIRE_GOLD);
    pxRect(x + 7 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
  } else if (pose === 'LIFT') {
    pxRect(x + 4 * s, y + 8 * s, 2 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 4 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 8 * s, 2 * s, 2 * s, PAL.LOG_DARK);
    pxRect(x + 8 * s, y + 8 * s, 2 * s, s, PAL.SASH_RED);
  } else {
    pxRect(x + 4 * s, y + 8 * s, 4 * s, 3 * s, PAL.LOG_DARK);
    pxRect(x + 3 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
    pxRect(x + 7 * s, y + 11 * s, 2 * s, s, PAL.SASH_TEAL);
  }
}

function drawKitchenBackdrop(floorY) {
  const logH = 26;
  for (let y = 48; y < floorY; y += logH) {
    pxRect(0, y, VIEW_W, logH - 3, PAL.LOG_MID);
    pxRect(0, y, VIEW_W, 4, PAL.LOG_LIGHT);
    pxRect(0, y + logH - 7, VIEW_W, 4, PAL.LOG_DARK);
    pxRect(0, y + logH - 3, VIEW_W, 3, PAL.CHINKING);
  }
  pxRect(0, 48, 18, floorY - 48, PAL.LOG_DARK);
  pxRect(VIEW_W - 18, 48, 18, floorY - 48, PAL.LOG_DARK);

  // Hearth
  const hearthX = Math.max(28, Math.floor(VIEW_W * 0.1));
  const hearthW = 84;
  const hearthTop = floorY - 108;
  pxRect(hearthX, hearthTop, hearthW, 108, '#4A4947');
  pxRect(hearthX + 4, hearthTop + 4, hearthW - 8, 104, '#696764');
  pxRect(hearthX - 6, hearthTop - 6, hearthW + 12, 8, PAL.LOG_DARK);
  pxRect(hearthX + 18, floorY - 52, hearthW - 36, 52, PAL.INK);
  const flicker = Math.sin(animFrame * 0.25) * 4;
  pxRect(hearthX + 22, floorY - 28 - flicker, 40, 28 + flicker, PAL.FIRE_RED);
  pxRect(hearthX + 27, floorY - 22 - flicker * 0.7, 30, 22 + flicker * 0.7, PAL.FIRE_ORANGE);
  pxRect(hearthX + 33, floorY - 12, 18, 12, PAL.FIRE_GOLD);

  // Window
  const winX = Math.min(VIEW_W - 104, Math.floor(VIEW_W * 0.78));
  const winY = floorY - 110;
  pxRect(winX, winY, 60, 54, PAL.LOG_DARK);
  pxRect(winX + 4, winY + 4, 52, 46, '#132842');
  pxRect(winX + 4, winY + 34, 52, 16, '#DDF2FF');
  pxRect(winX + 28, winY + 4, 4, 46, PAL.LOG_DARK);
  pxRect(winX + 4, winY + 24, 52, 4, PAL.LOG_DARK);

  // Floor & Braided Rug
  pxRect(0, floorY, VIEW_W, VIEW_H - floorY, PAL.FLOOR_MID);
  pxRect(0, floorY, VIEW_W, 4, PAL.LOG_DARK);
  for (let py = floorY + 16; py < VIEW_H; py += 18) {
    pxRect(0, py, VIEW_W, 2, PAL.FLOOR_DARK);
  }
  const midX = Math.floor(VIEW_W / 2);
  pxRect(midX - 76, floorY + 20, 152, 28, PAL.SASH_RED);
  pxRect(midX - 68, floorY + 24, 136, 20, PAL.SASH_TEAL);
  pxRect(midX - 60, floorY + 28, 120, 12, PAL.SASH_GOLD);
  pxRect(midX - 52, floorY + 31, 104, 6, PAL.CAPOTE_CREAM);
}

// PHASE 1: BAND BUILDER PAGE (3 FIDDLE PARTS COMPOSE 1 UNIFIED ALGORITHMIC SCORE)
function drawBandBuilderPhase() {
  pxRect(0, 0, VIEW_W, VIEW_H, PAL.PANEL_BG);

  const prof = activeProfile;

  pxRect(0, 0, VIEW_W, 54, PAL.INK);
  pxRect(0, 52, VIEW_W, 2, PAL.FIRE_ORANGE);
  drawText("BUILD YOUR KITCHEN BAND", VIEW_W / 2, 22, 13, PAL.FIRE_GOLD, 'center');
  const previewTag = isPreviewPlaying ? "♪ LIVE PREVIEW" : "TAP ANY BUTTON FOR SOUND";
  drawText(`${prof.trackTitle}  •  ${previewTag}`, VIEW_W / 2, 43, 9, PAL.SASH_TEAL, 'center');

  const slotDefs = [
    { label: 'PART 1: TONE',   type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[0]] },
    { label: 'PART 2: RHYTHM', type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[1]] },
    { label: 'PART 3: FORM',   type: 'FIDDLE', item: FIDDLE_ROSTER[bandSlots[2]] },
    { label: 'HAND PERC',      type: 'HAND',   item: HAND_PERC_ROSTER[bandSlots[3]] },
    { label: 'BIG PERC',       type: 'BIG',    item: BIG_PERC_ROSTER[bandSlots[4]] }
  ];

  const margin = 14;
  const gap = 8;
  const cardW = Math.floor((VIEW_W - margin * 2 - gap * 4) / 5);
  const cardTop = 66;
  const cardH = 224;
  const beatPulse = isPreviewPlaying
    ? (Math.floor(previewStep / 2) % 2 === 0)
    : (Math.floor(animFrame / 14) % 2 === 0);

  for (let i = 0; i < 5; i++) {
    const sDef = slotDefs[i];
    const cx = margin + i * (cardW + gap);
    const isSel = (bandCursor === i);

    pxRect(cx, cardTop, cardW, cardH, isSel ? PAL.CARD_SEL : PAL.CARD_BG);
    ctx.strokeStyle = isSel ? PAL.FIRE_GOLD : (sDef.item.id === 'NONE' ? '#4A382E' : PAL.SASH_TEAL);
    ctx.lineWidth = isSel ? 3 : 2;
    ctx.strokeRect(cx, cardTop, cardW, cardH);

    drawText(sDef.label, cx + cardW / 2, cardTop + 22, 8, isSel ? PAL.FIRE_GOLD : PAL.CAPOTE_CREAM, 'center');

    if (isSel) {
      drawText("▲", cx + cardW / 2, cardTop + 42, 11, PAL.FIRE_ORANGE, 'center');
      drawText("▼", cx + cardW / 2, cardTop + 148, 11, PAL.FIRE_ORANGE, 'center');
    }

    pxRect(cx + 10, cardTop + 124, cardW - 20, 8, PAL.FLOOR_MID);
    drawMusicianMini(sDef.type, sDef.item.id, cx + cardW / 2, cardTop + 126, 4, beatPulse);

    drawText(sDef.item.name, cx + cardW / 2, cardTop + 170, 9, PAL.WHITE, 'center');
    drawWrappedText(sDef.item.style, cx + cardW / 2, cardTop + 190, cardW - 10, 14, 8, PAL.SASH_TEAL);
  }

  const descBoxY = cardTop + cardH + 10;
  pxRect(margin, descBoxY, VIEW_W - margin * 2, 56, PAL.INK);
  ctx.strokeStyle = PAL.LOG_LIGHT;
  ctx.lineWidth = 2;
  ctx.strokeRect(margin, descBoxY, VIEW_W - margin * 2, 56);

  if (bandCursor < 5) {
    const activeItem = slotDefs[bandCursor].item;
    drawText(activeItem.desc, VIEW_W / 2, descBoxY + 22, 9, PAL.CAPOTE_CREAM, 'center');
    drawText(`UNIFIED TUNE: ${prof.trackTitle} (${prof.bpm} BPM)`, VIEW_W / 2, descBoxY + 44, 9, PAL.SASH_GOLD, 'center');
  } else {
    drawText(`READY: ${prof.trackTitle}`, VIEW_W / 2, descBoxY + 22, 10, PAL.FIRE_GOLD, 'center');
    drawText(prof.trackSub, VIEW_W / 2, descBoxY + 44, 9, PAL.SASH_TEAL, 'center');
  }

  const nextBtnY = VIEW_H - 84;
  const nextSel = (bandCursor === 5);
  pxRect(VIEW_W / 2 - 180, nextBtnY, 360, 40, nextSel ? PAL.FIRE_ORANGE : PAL.CAPOTE_RED);
  ctx.strokeStyle = nextSel ? PAL.WHITE : PAL.FIRE_GOLD;
  ctx.lineWidth = nextSel ? 3 : 2;
  ctx.strokeRect(VIEW_W / 2 - 180, nextBtnY, 360, 40);
  drawText("NEXT: CHOOSE DANCER ->", VIEW_W / 2, nextBtnY + 26, 11, nextSel ? PAL.INK : PAL.WHITE, 'center');

  pxRect(0, VIEW_H - 30, VIEW_W, 30, PAL.INK);
  drawText("L/R: SLOT  •  U/D or B: CHANGE  •  A: NEXT", VIEW_W / 2, VIEW_H - 10, 9, PAL.SASH_GOLD, 'center');
}

// PHASE 3: STAGGERED A/B CONTROLLER-MATCHED RHYTHM TRACK
function drawJiggingPhase() {
  const topBarH = 52;
  const bottomBarH = 114;
  const bottomBarTop = VIEW_H - bottomBarH;
  const floorY = bottomBarTop - 52;
  const beatPulse = (Math.floor(currentStep / 2) % 2 === 0);

  const dancer = DANCER_ROSTER[selectedDancerIdx];
  const activeSongPhaseIdx = getSongPhaseIndex(currentStep);

  drawKitchenBackdrop(floorY);

  // Top HUD Bar (y = 0)
  pxRect(0, 0, VIEW_W, topBarH, PAL.INK);
  pxRect(0, topBarH - 2, VIEW_W, 2, PAL.FIRE_ORANGE);

  drawText(`SCORE:${score}`, 14, 22, 12, PAL.WHITE, 'left');
  drawText(`COMBO:${combo}x`, VIEW_W - 14, 22, 12, combo >= 5 ? PAL.FIRE_ORANGE : PAL.SASH_TEAL, 'right');
  drawText(`${activeProfile.trackTitle} • ${activeProfile.boundaries[activeSongPhaseIdx].label}`, VIEW_W / 2, 43, 8, PAL.FIRE_GOLD, 'center');

  // Song Progress Bar
  const prog = totalSongSteps > 0 ? Math.min(1, currentStep / totalSongSteps) : 0;
  pxRect(0, topBarH, VIEW_W, 5, PAL.LOG_DARK);
  pxRect(0, topBarH, Math.floor(VIEW_W * prog), 5, PAL.SASH_TEAL);

  // 5 Band Members on Back Stage
  const colW = VIEW_W / 5;
  const backY = floorY + 14;
  const frontY = floorY + 40;

  const slotConfigs = [
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[0]].id, x: colW * 0.50, muted: false },
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[1]].id, x: colW * 1.35, muted: activeProfile.soloMode },
    { type: 'FIDDLE', id: FIDDLE_ROSTER[bandSlots[2]].id, x: colW * 3.55, muted: activeProfile.soloMode },
    { type: 'HAND',   id: HAND_PERC_ROSTER[bandSlots[3]].id, x: colW * 4.25, muted: activeProfile.soloMode },
    { type: 'BIG',    id: BIG_PERC_ROSTER[bandSlots[4]].id, x: colW * 4.78, muted: activeProfile.soloMode }
  ];

  for (const sc of slotConfigs) {
    if (sc.id !== 'NONE' && !sc.muted) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sc.x, 58);
      ctx.lineTo(sc.x - 32, backY + 6);
      ctx.lineTo(sc.x + 32, backY + 6);
      ctx.closePath();
      ctx.fillStyle = 'rgba(247, 200, 68, 0.14)';
      ctx.fill();
      ctx.restore();
    }
    drawMusicianMini(sc.type, sc.id, sc.x, backY, 4, beatPulse, sc.muted);
  }

  // Central Selected Métis Dancer
  drawDancerSprite(dancer, VIEW_W * 0.48, frontY, 5, jiggerPose);

  // Bottom HUD: Dual-Lane Staggered B (Top-Right) & A (Bottom-Left) Controller Layout
  pxRect(0, bottomBarTop, VIEW_W, bottomBarH, PAL.INK);
  pxRect(0, bottomBarTop, VIEW_W, 3, PAL.SASH_TEAL);

  const trackX = 14;
  const trackW = VIEW_W - 28;
  const trackTop = bottomBarTop + 8;
  const trackH = 82;
  pxRect(trackX, trackTop, trackW, trackH, '#0D2A3A');

  // Subtle horizontal divider separating Upper B Lane and Lower A Lane
  const midTrackY = trackTop + Math.floor(trackH / 2);
  pxRect(trackX, midTrackY, trackW, 2, 'rgba(255, 255, 255, 0.12)');

  // Staggered Target Rings matching physical arcade cabinet A (bottom-left) & B (top-right):
  // A Ring sits lower-left; B Ring sits upper-right!
  const hitAX = trackX + 42;
  const hitAY = trackTop + 60;
  const hitBX = trackX + 86;
  const hitBY = trackTop + 22;
  const ringR = 17;

  // Draw A Target Ring (Bottom-Left, Light Sea Green)
  ctx.beginPath();
  ctx.arc(hitAX, hitAY, ringR, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(18, 174, 162, 0.22)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = PAL.SASH_TEAL;
  ctx.stroke();
  drawText("A", hitAX, hitAY + 5, 11, PAL.SASH_TEAL, 'center');

  // Draw B Target Ring (Top-Right, Blaze Orange)
  ctx.beginPath();
  ctx.arc(hitBX, hitBY, ringR, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(251, 102, 4, 0.22)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = PAL.FIRE_ORANGE;
  ctx.stroke();
  drawText("B", hitBX, hitBY + 5, 11, PAL.FIRE_ORANGE, 'center');

  // Scrolling Notes aligned to their respective staggered target ring
  if (audioCtx) {
    const now = audioCtx.currentTime;
    for (let i = 0; i < expectedBeats.length; i++) {
      const b = expectedBeats[i];
      if (b.btn === 'LIFT') {
        const lx = hitAX + 22 + (b.time - now) * NOTE_SPEED;
        if (lx > trackX && lx < VIEW_W + 30) {
          ctx.strokeStyle = 'rgba(247, 200, 68, 0.45)';
          ctx.lineWidth = 2;
          ctx.strokeRect(lx - 10, midTrackY - 12, 20, 24);
          drawText("LIFT", lx, midTrackY + 4, 5, 'rgba(247, 200, 68, 0.8)', 'center');
        }
      } else if (!b.hit && !b.missed) {
        const isB = (b.btn === 'B');
        const targetX = isB ? hitBX : hitAX;
        const targetY = isB ? hitBY : hitAY;
        const nx = targetX + (b.time - now) * NOTE_SPEED;

        if (nx > trackX - 18 && nx < VIEW_W + 30) {
          ctx.beginPath();
          ctx.arc(nx, targetY, ringR - 2, 0, Math.PI * 2);
          ctx.fillStyle = isB ? PAL.FIRE_ORANGE : PAL.SASH_TEAL;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = PAL.WHITE;
          ctx.stroke();
          drawText(b.btn, nx, targetY + 5, 11, PAL.INK, 'center');
        }
      }
    }
  }

  drawText("TAP B (TOP-RIGHT) & A (BOTTOM-LEFT) ON THE BEAT • UP: MENU", VIEW_W / 2, VIEW_H - 8, 8, PAL.CAPOTE_CREAM, 'center');

  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.life);
    drawText(ft.text, ft.x, ft.y, 18, ft.color, 'center');
    ctx.restore();
  }
}

// MAIN UPDATE & RENDER LOOP
// ============================================================================
function update() {
  animFrame++;
  processHeldInputs(performance.now());

  if (phase === 'JIGGING' && audioCtx && !isPaused) {
    const now = audioCtx.currentTime;

    if (jiggerPoseTimer > 0 && now >= jiggerPoseTimer) {
      jiggerPose = 'IDLE';
      jiggerPoseTimer = 0;
    }

    for (let i = expectedBeats.length - 1; i >= 0; i--) {
      const b = expectedBeats[i];
      if (b.btn === 'LIFT' && !b.triggered && now >= b.time - 0.04) {
        b.triggered = true;
        if (jiggerPose !== 'FALL') {
          jiggerPose = 'LIFT';
          jiggerPoseTimer = now + 0.24;
        }
      }
      if (!b.hit && !b.missed && b.btn !== 'LIFT' && now > b.time + TOLERANCE_GOOD) {
        b.missed = true;
        combo = 0;
        jiggerPose = 'FALL';
        jiggerPoseTimer = now + 0.55;
        playStumbleClonk();
        spawnFloatingText("MISS!", PAL.FIRE_RED);
      }
      if ((b.hit || b.missed) && now > b.time + 0.9) {
        expectedBeats.splice(i, 1);
      }
    }

    if (currentStep >= totalSongSteps && expectedBeats.length === 0 && now > nextStepTime + 0.8) {
      finishSongToMenu();
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.9;
    ft.life -= 0.02;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function draw() {
  if (phase === 'BAND_SELECT') {
    drawBandBuilderPhase();
  } else if (phase === 'DANCER_SELECT') {
    drawDancerSelectPhase();
  } else if (phase === 'JIGGING') {
    drawJiggingPhase();
  } else if (phase === 'RESULTS') {
    drawResultsPhase();
  }
}

function loop() {
  if (!isPaused) {
    update();
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
