const VIEW_H = 240;

function resizeViewport() {
  const rect = document.getElementById('game-container').getBoundingClientRect();
  const w = Math.max(1, rect.width || window.innerWidth);
  const h = Math.max(1, rect.height || window.innerHeight);
  const aspect = w / h;
  VIEW_W = Math.max(180, Math.round(VIEW_H * aspect));
  if (cvs.width !== VIEW_W || cvs.height !== VIEW_H) {
    cvs.width = VIEW_W;
    cvs.height = VIEW_H;
    ctx.imageSmoothingEnabled = false;
  }
}

// --- MATH & COLOR SPLINE HELPERS ---
function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const h = c => clamp(Math.round(c), 0, 255).toString(16).padStart(2, '0');
  return `#${h(r)}${h(g)}${h(b)}`;
}
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA);
  const b = hexToRgb(hexB);
  return rgbToHex(lerp(a.r, b.r, t), lerp(a.g, b.g, t), lerp(a.b, b.b, t));
}

function getEnvAtProgress(p) {
  const prog = clamp(p, 0, 1);
  let i = 0;
  while (i < BIOME_KEYS.length - 2 && prog > BIOME_KEYS[i + 1].p) i++;
  const a = BIOME_KEYS[i];
  const b = BIOME_KEYS[i + 1];
  const rawT = clamp((prog - a.p) / (b.p - a.p), 0, 1);
  const t = rawT * rawT * (3 - 2 * rawT);

  return {
    progress: prog,
    stageIndex: prog < 0.25 ? 0 : (prog < 0.50 ? 1 : (prog < 0.75 ? 2 : 3)),
    skyTop: lerpColor(a.skyTop, b.skyTop, t),
    skyMid: lerpColor(a.skyMid, b.skyMid, t),
    skyLow: lerpColor(a.skyLow, b.skyLow, t),
    skyHorizon: lerpColor(a.skyHorizon, b.skyHorizon, t),
    sunColor: lerpColor(a.sunColor, b.sunColor, t),

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- WEB AUDIO SYNTHESIZER (SFX + ATMOSPHERE + 62 BPM 4/4 DRUM & RATTLE) ---
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.atmosStarted = false;
    this.riverGain = null;
    this.windGain = null;
    this.windFilter = null;
    this.windGustTimer = 3.5;

    this.drumActive = false;
    this.beatTimer = 0;
    this.beatIndex = 0;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (this.ctx && !this.atmosStarted) {
      this.startAtmosphereBed();
    }
  }

  startAtmosphereBed() {
    if (!this.ctx || this.atmosStarted) return;
    this.atmosStarted = true;
    const now = this.ctx.currentTime;

    const len = this.ctx.sampleRate * 3;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.997 * b0 + white * 0.029;
      b1 = 0.985 * b1 + white * 0.032;
      b2 = 0.950 * b2 + white * 0.048;
      data[i] = (b0 + b1 + b2 + white * 0.018) * 0.6;
    }

    const riverSrc = this.ctx.createBufferSource();
    riverSrc.buffer = buf;
    riverSrc.loop = true;
    const riverFilter = this.ctx.createBiquadFilter();
    riverFilter.type = 'bandpass';
    riverFilter.frequency.setValueAtTime(310, now);
    riverFilter.Q.value = 0.85;
    this.riverGain = this.ctx.createGain();
    this.riverGain.gain.setValueAtTime(0.024, now);
    riverSrc.connect(riverFilter);
    riverFilter.connect(this.riverGain);
    this.riverGain.connect(this.ctx.destination);
    riverSrc.start(now);

    const windSrc = this.ctx.createBufferSource();
    windSrc.buffer = buf;
    windSrc.loop = true;
    this.windFilter = this.ctx.createBiquadFilter();
    this.windFilter.type = 'bandpass';
    this.windFilter.frequency.setValueAtTime(420, now);
    this.windFilter.Q.value = 2.4;
    this.windGain = this.ctx.createGain();
    this.windGain.gain.setValueAtTime(0.002, now);
    windSrc.connect(this.windFilter);
    this.windFilter.connect(this.windGain);
    this.windGain.connect(this.ctx.destination);
    windSrc.start(now);
  }

  setAtmosphereActive(active) {
    if (!this.ctx || !this.riverGain || !this.windGain) return;
    const now = this.ctx.currentTime;
    this.riverGain.gain.setTargetAtTime(active ? 0.024 : 0.0001, now, 0.35);
    if (!active) {
      this.windGain.gain.setTargetAtTime(0.0001, now, 0.25);
    }
  }

  setDrumTrackActive(active) {
    if (active && !this.drumActive) {
      this.drumActive = true;
      this.beatTimer = 0.15;
      this.beatIndex = 0;
    } else if (!active) {
      this.drumActive = false;
    }
  }

  playHandDrumBeat() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(98, now);
    osc.frequency.exponentialRampToValueAtTime(52, now + 0.28);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.125, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.40);
  }

  playRattleBeat(isDownbeat) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    const oscGain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(82, now);
    osc.frequency.exponentialRampToValueAtTime(58, now + 0.11);
    const toneVol = isDownbeat ? 0.024 : 0.030;
    oscGain.gain.setValueAtTime(0.001, now);
    oscGain.gain.linearRampToValueAtTime(toneVol, now + 0.008);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(oscGain);
    oscGain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);

    const bufSize = Math.floor(this.ctx.sampleRate * 0.08);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(510, now);
    filter.Q.value = 1.7;
    const nGain = this.ctx.createGain();
    const noiseVol = isDownbeat ? 0.018 : 0.024;
    nGain.gain.setValueAtTime(noiseVol, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    noise.connect(filter);
    filter.connect(nGain);
    nGain.connect(this.ctx.destination);
    noise.start(now);
  }

  playSoftFootstep() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.055);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(340, now);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.028, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  updateAudio(dt) {
    if (!this.ctx || this.ctx.state !== 'running') return;

    if (this.windGain && this.windFilter && this.riverGain && this.riverGain.gain.value > 0.005) {
      this.windGustTimer -= dt;
      if (this.windGustTimer <= 0) {
        const now = this.ctx.currentTime;
        const gustVol = 0.012 + activeWind.strength * 0.014;
        const freq = 340 + activeWind.strength * 220;
        this.windFilter.frequency.setTargetAtTime(freq, now, 0.8);
        this.windGain.gain.setTargetAtTime(gustVol, now, 1.1);
        this.windGain.gain.setTargetAtTime(0.002, now + 2.4, 1.4);
        this.windGustTimer = 9.0 + Math.random() * 9.0;
      }
    }

    if (this.drumActive) {
      const beatDuration = 60 / 62;
      this.beatTimer -= dt;
      if (this.beatTimer <= 0) {
        this.beatTimer += beatDuration;
        const isBeatOne = (this.beatIndex === 0);
        if (isBeatOne) {
          this.playHandDrumBeat();
        }
        this.playRattleBeat(isBeatOne);
        this.beatIndex = (this.beatIndex + 1) % 4;
      }
    }
  }

  playTone(freq, endFreq, duration, type = 'triangle', vol = 0.12, delay = 0) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq !== freq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
    }
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }
  playNoise(duration, filterFreq = 800, vol = 0.08, delay = 0) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, now);
    filter.Q.value = 1.5;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }
  playStartChime() {
    this.playTone(392.00, 392.00, 0.14, 'triangle', 0.12, 0.0);
    this.playTone(587.33, 587.33, 0.28, 'triangle', 0.14, 0.12);
  }
  playBerryPick() { this.playTone(520, 660, 0.07, 'sine', 0.05); }
  playHoodRustle() {
    this.playNoise(0.24, 650, 0.08);
    this.playTone(220, 280, 0.14, 'sine', 0.06);
  }
  playArrowPickup() { this.playTone(620, 880, 0.06, 'triangle', 0.07); }
  playTestPluck() {
    this.playTone(196, 146.83, 0.35, 'triangle', 0.14);

function getGroundY(worldX) {
  const idx = Math.floor(worldX / 16);
  if (idx < 0) return 184;
  if (idx >= groundProfile.length - 1) return groundProfile[groundProfile.length - 1] || 184;
  const t = (worldX % 16) / 16;
  return groundProfile[idx] + (groundProfile[idx + 1] - groundProfile[idx]) * t;
}

function getCameraBaseForArcher(ax) {
  const leftMargin = clamp(Math.round(VIEW_W * 0.24), 44, 68);
  return clamp(ax - leftMargin, 0, Math.max(0, TOTAL_WORLD_WIDTH - VIEW_W));
}
