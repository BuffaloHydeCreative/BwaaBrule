        // Dynamic Logical Viewport Metrics (adapts cleanly to any embedded cabinet aspect ratio)
        let VIEW_W = 600;
        let VIEW_H = 400;
        let GAME_OFFSET_X = 0;

        function resizeViewport() {
            const w = window.innerWidth || 600;
            const h = window.innerHeight || 400;
            const aspect = w / h;
            VIEW_H = 400;
            VIEW_W = Math.max(480, Math.round(VIEW_H * aspect));
            canvas.width = VIEW_W;
            canvas.height = VIEW_H;
            GAME_OFFSET_X = Math.floor((VIEW_W - 600) / 2);
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeViewport);
        resizeViewport();

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('mousedown', initAudio, { once: true });

        function playSynth(type, freqStart, freqEnd, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
            if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSinkJingle() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, idx) => {
                setTimeout(() => { playSynth('triangle', freq, freq * 1.02, 0.25, 0.4); }, idx * 100);
            });
        }

        function playBonusHitJingle(mult) {
            if (!audioCtx) return;
            const base = mult >= 5 ? 660 : (mult >= 3 ? 550 : 440);
            playSynth('square', base, base * 1.5, 0.16, 0.35);
            setTimeout(() => playSynth('triangle', base * 1.5, base * 2, 0.2, 0.35), 90);
        }

                    chewAnim: Math.random() * 100,
                    size: 14
                });
            }
        }

        // Initializes the 3 special range targets once per 10-ball session (destroyed permanently when hit)
        function initRangeTargets() {
            const hole = HOLES_RANGE[0];
            const teeY = hole.tee.y; // 1000
            const windNorthFactor = -Math.sin(sessionConditions.dirAngle) * sessionConditions.speed;
            const globalMaxDist = Math.max(480, Math.min(900, 660 + windNorthFactor * 5.2));
            const minZoneY = Math.max(110, teeY - globalMaxDist);
            const maxZoneY = teeY - Math.round(globalMaxDist / 3);

            // 1. Fox (5x): Emerges from the tall grass rough patch (x: 495, y: 550) and sprints across fairway off-screen
            rangeState.fox = {
                kind: 'FOX',
                mult: 5,
                hit: false,
                active: true,
                x: 495,
                y: 550,
                vx: -1.45,
                anim: 0,
                delay: 35
            };

            // 2. Flock of Geese (3x): Sitting on the fairway pecking grass; scatter & fly off-screen permanently when hit
            const geeseY = Math.max(minZoneY + 30, Math.min(maxZoneY - 40, teeY - globalMaxDist * 0.58));
            const geeseX = 255 + Math.random() * 140;
            rangeState.geese = {
                kind: 'GEESE',
                mult: 3,
                hit: false,
                scattering: false,
                gone: false,
                x: geeseX,
                y: geeseY,
                anim: 0,
                birds: [
                    { dx: -16, dy: -6, vx: -1.6, vy: -2.4, peckOffset: 0.0 },
                    { dx: 4,   dy: -12, vx: 0.4,  vy: -2.7, peckOffset: 1.4 },
                    { dx: 18,  dy: -2, vx: 1.8,  vy: -2.2, peckOffset: 2.7 },
                    { dx: -8,  dy: 10, vx: -1.1, vy: -2.5, peckOffset: 3.9 },
                    { dx: 12,  dy: 12, vx: 1.4,  vy: -2.3, peckOffset: 5.1 }
                ]
            };

            // 3. Buffalo Herd (2 to 3 buffalos max, 2x): Rumbles horizontally across fairway off-screen to off-screen
            const herdCount = Math.random() > 0.45 ? 3 : 2;
            const herdY = Math.max(minZoneY + 20, Math.min(maxZoneY - 20, teeY - globalMaxDist * 0.80));
            const dir = Math.random() > 0.5 ? 1 : -1;
            const startX = dir > 0 ? -40 : 640;
            const members = [];
            for (let i = 0; i < herdCount; i++) {
                members.push({
                    dx: -dir * (i * 34),
                    dy: (i % 2 === 0 ? -7 : 7)
                });
            }
            rangeState.herd = {
                kind: 'BUFFALO',
                mult: 2,
                hit: false,
                active: true,
                x: startX,
                y: herdY,
                dir: dir,
                vx: dir * 0.85,
                anim: 0,
                delay: 15,
                members: members
            };
        }

        // Resets un-hit moving targets (Fox & Buffalo Herd) on every new shot
        function resetRangeMovingTargetsForShot() {
            if (rangeState.fox && !rangeState.fox.hit) {
                rangeState.fox.active = true;
                rangeState.fox.x = 495;
                rangeState.fox.y = 540 + (Math.random() - 0.5) * 35;
                rangeState.fox.vx = -(1.35 + Math.random() * 0.35);
                rangeState.fox.delay = 25 + Math.floor(Math.random() * 45);
            }
            if (rangeState.herd && !rangeState.herd.hit) {
                const dir = Math.random() > 0.5 ? 1 : -1;
                rangeState.herd.active = true;
                rangeState.herd.dir = dir;
                rangeState.herd.x = dir > 0 ? -40 : 640;
                rangeState.herd.vx = dir * (0.78 + Math.random() * 0.25);
                rangeState.herd.delay = 10 + Math.floor(Math.random() * 35);
                rangeState.herd.members.forEach((m, idx) => {
                    m.dx = -dir * (idx * 34);
                });
            }
        }

        function initRangeMode() {
            rangeState.active = true;
            rangeState.ballNum = 1;
            rangeState.maxBalls = 10;
            rangeState.ballScores = [];
            rangeState.landedBalls = [];
            rangeState.currentMultiplier = 1;
            rangeState.hitTargetsThisShot = [];
            rangeState.popups = [];
            rangeState.lastShotSummary = "";
            loadHole(0);
            initRangeTargets();
        }

        function prepareNextRangeBall() {
            const hole = HOLES_RANGE[0];
            ball.x = hole.tee.x;
            ball.y = hole.tee.y;
            ball.z = 0;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;
            ball.prevX = ball.x;
            ball.prevY = ball.y;
            lie = 'TEE';
            clubIdx = 0;
            aimAngle = hole.startAngle;
            rangeState.currentMultiplier = 1;
            rangeState.hitTargetsThisShot = [];
            meter.powerMarker = -1;
            meter.accuracyMarker = -1;
            resetRangeMovingTargetsForShot();
            let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * getEffectiveClubDist(clubIdx)));
            targetCamY = getTargetCameraY(hole, projY);
            state = 'AIM';
        }

        function resolveRangeShot(outOfBounds) {
            const hole = HOLES_RANGE[0];
            let straightYards = Math.max(0, Math.round(hole.tee.y - ball.y));
            if (outOfBounds) {
                straightYards = 0;
            }
            const mult = rangeState.currentMultiplier;
            const shotPoints = straightYards * mult;

            rangeState.ballScores.push({
                yards: straightYards,
                mult: mult,
                points: shotPoints,
                ob: outOfBounds
            });

            if (!outOfBounds && straightYards > 0) {
                rangeState.landedBalls.push({
                    x: ball.x,
                    y: ball.y,
                    mult: mult,
                    points: shotPoints
                });
            }

            rangeState.lastShotSummary = outOfBounds
                ? `BALL ${rangeState.ballNum}: WATER/OB - 0 PTS`
                : `BALL ${rangeState.ballNum}: ${straightYards}Y x${mult} = ${shotPoints} PTS`;

            shotFeedback = outOfBounds
                ? "WATER / OB!"
                : (mult > 1 ? `${straightYards}Y x${mult} = ${shotPoints}` : `${straightYards} YDS!`);

            playSynth('triangle', outOfBounds ? 160 : 520, outOfBounds ? 110 : 780, 0.22, 0.4);

            if (rangeState.ballNum >= rangeState.maxBalls) {
                setTimeout(() => {
                    state = 'FINAL_SCORECARD';
                    playSinkJingle();
                }, 1400);
                state = 'HOLE_OUT';
            } else {
                rangeState.ballNum++;
                setTimeout(() => {
                    if (state === 'HOLE_OUT') prepareNextRangeBall();
                }, 1200);
                state = 'HOLE_OUT';
            }
        }

        function drawTreeToContext(targetCtx, x, y, type) {
            if (type === 'PINE') {
                targetCtx.fillStyle = PALETTE.PINE_TRUNK; targetCtx.fillRect(x + 10, y + 20, 4, 10);
                targetCtx.fillStyle = PALETTE.PINE_LEAF; targetCtx.fillRect(x + 2, y + 12, 20, 10);
                targetCtx.fillRect(x + 6, y + 4, 12, 12); targetCtx.fillRect(x + 10, y - 4, 4, 12);
            } else if (type === 'BIRCH') {
                targetCtx.fillStyle = PALETTE.BIRCH_TRUNK; targetCtx.fillRect(x + 10, y + 10, 4, 20);
                targetCtx.fillStyle = PALETTE.BIRCH_MARK; targetCtx.fillRect(x + 10, y + 14, 2, 2); targetCtx.fillRect(x + 12, y + 22, 2, 2);
                targetCtx.fillStyle = PALETTE.BIRCH_LEAF; targetCtx.fillRect(x, y - 2, 24, 16); targetCtx.fillRect(x + 4, y - 8, 16, 10);
            } else if (type === 'SNOW_PINE') {
                targetCtx.fillStyle = '#14172b'; targetCtx.fillRect(x + 10, y + 20, 4, 10);
                targetCtx.fillStyle = '#192942'; targetCtx.fillRect(x + 2, y + 12, 20, 10);
                targetCtx.fillRect(x + 6, y + 4, 12, 12); targetCtx.fillRect(x + 10, y - 4, 4, 12);
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                targetCtx.fillRect(x + 10, y - 4, 4, 3);
                targetCtx.fillRect(x + 6, y + 4, 6, 2);
                targetCtx.fillRect(x + 3, y + 12, 8, 2);
            }
        }

        function drawTree(x, y, type) {
            drawTreeToContext(offCtx, x, y, type);
        }

        function drawSteppedMountainBlock(targetCtx, x, y, w, h, isVerticalRidge) {
            targetCtx.fillStyle = PALETTE.MTN_BASE;
            targetCtx.fillRect(x, y, w, h);

            targetCtx.fillStyle = PALETTE.MTN_MID;
            targetCtx.fillRect(x + 6, y + 6, Math.max(4, w - 12), Math.max(4, h - 14));

            targetCtx.fillStyle = PALETTE.MTN_HIGH;
            if (isVerticalRidge) {
                targetCtx.fillRect(x + 16, y + 12, Math.max(4, w - 32), Math.max(4, h - 24));
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                let spineX = x + Math.floor(w / 2) - 6;
                for (let sy = y + 18; sy < y + h - 22; sy += 24) {
                    targetCtx.fillRect(spineX, sy, 12, 14);
                    targetCtx.fillRect(spineX - 4, sy + 4, 20, 6);
                }
            } else {
                targetCtx.fillRect(x + 10, y + 8, Math.max(4, w - 20), Math.max(4, h - 38));
                targetCtx.fillStyle = PALETTE.MTN_SNOW;
                for (let px = x + 20; px < x + w - 40; px += 68) {
                    targetCtx.fillRect(px + 14, y + 6, 16, 12);
                    targetCtx.fillRect(px + 8,  y + 18, 28, 12);
                    targetCtx.fillRect(px + 2,  y + 30, 40, 10);
                }
                targetCtx.fillStyle = PALETTE.MTN_BASE;
                for (let sx = x + 16; sx < x + w - 16; sx += 22) {
                    targetCtx.fillRect(sx, y + 48, 4, Math.max(10, h - 64));
                }
            }
        }

        function drawLandShapeToContext(targetCtx, s, isPrairie, isNorthern) {
            if (s.type === 'MOUNTAIN') {
                drawSteppedMountainBlock(targetCtx, s.x, s.y, s.w, s.h, false);
                return;
            }
            if (s.type === 'RIDGE') {
                drawSteppedMountainBlock(targetCtx, s.x, s.y, s.w, s.h, true);
                return;
            }
            if (s.type === 'PEBBLE_ROUGH') {
                targetCtx.fillStyle = PALETTE.PEBBLE_BUFFER;
                targetCtx.fillRect(s.x, s.y, s.w, s.h);
                targetCtx.fillStyle = PALETTE.PEBBLE_SPECK;
                for (let px = s.x + 4; px < s.x + s.w - 4; px += 12) {
                    for (let py = s.y + 4; py < s.y + s.h - 4; py += 10) {
                        let shift = ((py / 10) % 2 === 0) ? 0 : 5;
                        if (px + shift < s.x + s.w - 4) {
                            targetCtx.fillRect(px + shift, py, 3, 3);
                        }
                    }
                }
                return;
            }
            if (s.type === 'TALL_GRASS_PATCH') {
                // Detailed Tall Grass Rough Patch (Fox den cover beside the sand trap)
                targetCtx.fillStyle = '#63521d';
                targetCtx.fillRect(s.x, s.y, s.w, s.h);
                targetCtx.fillStyle = '#756224';
                targetCtx.fillRect(s.x + 4, s.y + 4, s.w - 8, s.h - 8);
                for (let gx = s.x + 6; gx < s.x + s.w - 8; gx += 10) {
                    for (let gy = s.y + 8; gy < s.y + s.h - 6; gy += 12) {
                        let sway = ((gy / 12) % 2 === 0) ? 0 : 4;
                        // Deep shadow stalk
                        targetCtx.fillStyle = '#4d3e14';
                        targetCtx.fillRect(gx + sway, gy - 4, 2, 10);
                        // Golden-ochre tall grass blades
                        targetCtx.fillStyle = '#b39942';
                        targetCtx.fillRect(gx + sway + 2, gy - 6, 2, 11);
                        // Sunlit wheat tip
                        targetCtx.fillStyle = PALETTE.YELLOW;
                        targetCtx.fillRect(gx + sway + 2, gy - 7, 2, 3);
                    }
                }
                return;
            }

            if (s.type === 'FAIRWAY') {
                targetCtx.fillStyle = isPrairie ? PALETTE.FAIRWAY_PRAIRIE : (isNorthern ? PALETTE.FAIRWAY_NORTH : PALETTE.FAIRWAY_WOOD);
            } else if (s.type === 'SAND') {
                targetCtx.fillStyle = isNorthern ? PALETTE.SAND_NORTH : PALETTE.SAND;
            } else if (s.type === 'GREEN') {
                targetCtx.fillStyle = isNorthern ? PALETTE.GREEN_NORTH : PALETTE.GREEN;
            } else {
                targetCtx.fillStyle = PALETTE[s.type];
            }
            
            targetCtx.fillRect(s.x, s.y, s.w, s.h);

            if (s.type === 'SAND') {
                targetCtx.fillStyle = isNorthern ? PALETTE.SAND_NORTH_DARK : PALETTE.SAND_DARK;
                for (let sx = s.x + 4; sx < s.x + s.w - 6; sx += 12) {
                    for (let sy = s.y + 4; sy < s.y + s.h - 4; sy += 10) {
                        let shift = ((sy / 10) % 2 === 0) ? 0 : 5;
                        if (sx + shift < s.x + s.w - 6) {
                            targetCtx.fillRect(sx + shift, sy, 5, 3);
                        }
                    }
                }
            }
            if (s.type === 'GREEN') {
                targetCtx.fillStyle = isNorthern ? PALETTE.GREEN_NORTH_DARK : PALETTE.GREEN_DARK;
                for (let gx = s.x + 4; gx < s.x + s.w - 4; gx += 12) {
                    for (let gy = s.y + 4; gy < s.y + s.h - 4; gy += 12) {
                        let shift = ((gy / 12) % 2 === 0) ? 0 : 6;
                        if (gx + shift < s.x + s.w - 4) {
                            targetCtx.fillRect(gx + shift, gy, 4, 4);
                        }
                    }
                }
            }
        }

        function bakeTerrain() {
            const hole = activeCourseHoles[currentHole];
            offCanvas.width = hole.worldW; offCanvas.height = hole.worldH;

            const isPrairie = (selectedCourseIdx === 1 || selectedCourseIdx === 3);
            const isNorthern = (selectedCourseIdx === 2);

            if (isNorthern) {
                offCtx.fillStyle = PALETTE.ROUGH_NORTH;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);

                offCtx.fillStyle = PALETTE.ROUGH_NORTH_LAV;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 1400; i++) {
                    let rx = Math.floor(Math.random() * (hole.worldW / 8)) * 8;
                    let ry = Math.floor(Math.random() * (hole.worldH / 8)) * 8;
                    offCtx.fillRect(rx, ry, 16, 8);
                }
                offCtx.fillStyle = PALETTE.ROUGH_NORTH_DARK;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 1200; i++) {
                    let rx = Math.floor(Math.random() * (hole.worldW / 4)) * 4;
                    let ry = Math.floor(Math.random() * (hole.worldH / 4)) * 4;
                    offCtx.fillRect(rx, ry, 8, 8);
                }

                for (let ay = 40; ay < hole.worldH; ay += 140) {
                    offCtx.fillStyle = 'rgba(82, 242, 178, 0.09)';
                    offCtx.fillRect(0, ay, hole.worldW, 24);
                    offCtx.fillStyle = 'rgba(168, 120, 255, 0.08)';
                    offCtx.fillRect(0, ay + 24, hole.worldW, 18);
                }
                for (let i = 0; i < (hole.worldW * hole.worldH) / 3200; i++) {
                    offCtx.fillStyle = (i % 3 === 0) ? 'rgba(255, 255, 255, 0.45)' : 'rgba(158, 168, 224, 0.35)';
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 2);
                }
            } else if (isPrairie) {
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE_DARK;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 75; i++) {
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 8);
                }
                offCtx.fillStyle = PALETTE.ROUGH_PRAIRIE_TALL;
                for (let i = 0; i < (hole.worldW * hole.worldH) / 90; i++) {
                    offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 3, 5);
                }
            } else {
                offCtx.fillStyle = PALETTE.ROUGH_WOOD;
                offCtx.fillRect(0, 0, hole.worldW, hole.worldH);
                offCtx.fillStyle = '#0a1f16';
                for (let i = 0; i < (hole.worldW * hole.worldH) / 100; i++) { offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 6); }
                offCtx.fillStyle = '#1b402c'; 
                for (let i = 0; i < (hole.worldW * hole.worldH) / 100; i++) { offCtx.fillRect(Math.random() * hole.worldW, Math.random() * hole.worldH, 2, 4); }
            }

            for (let s of hole.shapes) {
                if (s.type === 'WATER' || s.type === 'WATERFALL' || s.type === 'HAZARD_ROCK') continue;
                drawLandShapeToContext(offCtx, s, isPrairie, isNorthern);
            }

            if (!isPrairie) {
                let treeCount = isNorthern ? (hole.worldH > 400 ? 220 : 95) : (hole.worldH > 400 ? 380 : 180);
                for (let i = 0; i < treeCount; i++) {
                    let tx = Math.random() * hole.worldW; let ty = Math.random() * hole.worldH;
                    let canSpawn = true;
                    if (Math.hypot(tx - hole.tee.x, ty - hole.tee.y) < 65) canSpawn = false;
                    for (let s of hole.shapes) {
                        if (s.type === 'HAZARD_ROCK') continue;
                        let buf = (s.type === 'MOUNTAIN' || s.type === 'RIDGE') ? 8 : 32;
                        if (tx >= s.x - buf && tx <= s.x + s.w + buf && ty >= s.y - buf && ty <= s.y + s.h + buf) {
                            canSpawn = false; break;
                        }
                    }
                    if (canSpawn) {
                        if (isNorthern) drawTree(tx, ty, 'SNOW_PINE');
                        else drawTree(tx, ty, Math.random() > 0.4 ? 'PINE' : 'BIRCH');
                    }
                }
            }
        }

        function loadHole(idx) {
            currentHole = idx; strokes = 0; lie = 'TEE'; clubIdx = 0;
            const hole = activeCourseHoles[idx];

            ball.x = hole.tee.x; ball.y = hole.tee.y; ball.z = 0;
            ball.prevX = ball.x; ball.prevY = ball.y;
            aimAngle = hole.startAngle !== undefined ? hole.startAngle : -Math.PI / 2; 

            state = 'AIM'; shotFeedback = ""; puttingState.active = false;
            meter.powerMarker = -1; meter.accuracyMarker = -1;
            
            if (hole.worldH > 400) {
                let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * getEffectiveClubDist(clubIdx)));
                targetCamY = getTargetCameraY(hole, projY);
            } else {
                targetCamY = 0;
            }
            camY = targetCamY;

            if (selectedCourseIdx === 1 && currentHole === 1) {
                spawnBuffaloHerd();
            }

            bakeTerrain();
        }

        function getTerrainAt(x, y) {
            const hole = activeCourseHoles[currentHole];
            if (x < 0 || x >= hole.worldW || y < 0 || y >= hole.worldH) return 'OB';
            for (let i = hole.shapes.length - 1; i >= 0; i--) {
                const s = hole.shapes[i];
                if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
                    if (s.type === 'TALL_GRASS_PATCH' || s.type === 'PEBBLE_ROUGH') return 'ROUGH';
                    if (s.type === 'WATERFALL') return 'WATER';
                    if (s.type === 'MOUNTAIN' || s.type === 'RIDGE' || s.type === 'HAZARD_ROCK') return 'OB';
                    return s.type; 
                }
            }
            return 'ROUGH';
        }

        function handleA_Button() {
            const now = Date.now();
            if (now - lastButtonTime.a < BUTTON_DEBOUNCE_MS) return;
            lastButtonTime.a = now;

            initAudio();
            if (state === 'TITLE') { 
                state = 'COURSE_SELECT'; playSynth('triangle', 350, 450, 0.1, 0.3); 
            } 
            else if (state === 'COURSE_SELECT') {
                if (COURSES[selectedCourseIdx].status === 'AVAILABLE') { 
                    courseScores = [0, 0, 0];
                    activeCourseHoles = COURSES[selectedCourseIdx].holes;
                    rangeState.active = !!COURSES[selectedCourseIdx].isRange;
                    initGlobalConditions();
                    playSynth('triangle', 440, 660, 0.15, 0.4); 
                    state = 'COURSE_SPLASH';
                } 
                else playSynth('triangle', 150, 90, 0.25, 0.5); 
            }
            else if (state === 'COURSE_SPLASH') {
                playSynth('triangle', 523.25, 783.99, 0.18, 0.4);
                if (COURSES[selectedCourseIdx].isRange) {
                    initRangeMode();
                } else {
                    rangeState.active = false;
                    loadHole(0);
                }
            }
            else if (state === 'POST_HOLE') {
                if (rangeState.active) {
                    state = 'FINAL_SCORECARD';
                } else if (currentHole < 2) {
                    loadHole(currentHole + 1);
                } else {
                    state = 'FINAL_SCORECARD';
                    playSynth('triangle', 523.25, 659.25, 0.25, 0.4);
                }
            } 
            else if (state === 'FINAL_SCORECARD') {
                state = 'COURSE_SELECT';
                currentHole = 0;
                rangeState.active = false;
                initGlobalConditions();
                playSynth('triangle', 350, 450, 0.1, 0.3);
            }
            else if (state === 'AIM') {
                state = 'POWER'; meter.val = 0; meter.dir = 0.81; shotFeedback = "";
                playSynth('triangle', 300, 400, 0.1, 0.2);
            } 
            else if (state === 'POWER') {
                meter.power = meter.val; meter.powerMarker = meter.val; state = 'SNAP'; meter.dir = -1.69; 
                playSynth('triangle', 400, 500, 0.1, 0.2);
            } 
            else if (state === 'SNAP') {
                meter.accuracy = meter.val; meter.accuracyMarker = meter.val; hitBall();
            }
        }

        function handleB_Button() {
            const now = Date.now();
            if (now - lastButtonTime.b < BUTTON_DEBOUNCE_MS) return;
            lastButtonTime.b = now;

            if (state === 'COURSE_SELECT') { 
                state = 'TITLE'; playSynth('triangle', 300, 200, 0.1, 0.3); 
            }
            else if (state === 'COURSE_SPLASH') {
                state = 'COURSE_SELECT'; playSynth('triangle', 300, 200, 0.1, 0.3);
            }
            else if (state === 'AIM' || state === 'FLY' || state === 'ROLL') { 
                showMiniMap = !showMiniMap; playSynth('triangle', 450, 450, 0.05, 0.2); 
            }
        }

        function hitBall() {
            strokes++; 
            if (!rangeState.active) {
                courseScores[currentHole] = strokes;
            }
            state = 'FLY'; let club = CLUBS[clubIdx];
            const player = getActivePlayer();

            let sweetCenter = 25; 
            let deviation = ((meter.accuracy - sweetCenter) / 100) * player.accuracyMult;
            let finalAngle = aimAngle + (deviation * 0.9);

            let missDiff = Math.abs(meter.accuracy - sweetCenter);
            let sweetHalf = 5 + (player.sweetBonus * 100);
            if (missDiff <= sweetHalf) shotFeedback = "GREAT SHOT!";
            else if (missDiff <= 13) shotFeedback = "AVERAGE";
            else shotFeedback = "POOR SHOT!";

            let pwr = Math.max(0.05, meter.power / 100);

            if (puttingState.active) {
                let puttForce = pwr * 8.5;
                ball.vx = Math.cos(finalAngle) * puttForce;
                ball.vy = Math.sin(finalAngle) * puttForce;
                ball.vz = 0; state = 'ROLL';
                playSynth('square', 100, 60, 0.15, 0.6);
                return;
            }

            let liePenalty = 1.0; let zPenalty = 1.0;
            if (lie === 'ROUGH') {
                if (clubIdx === 0) { liePenalty = 0.35; zPenalty = 0.35; }
                else { liePenalty = player.roughSave; }
            } else if (lie === 'SAND') {
                if (clubIdx === 0) { liePenalty = 0.20; zPenalty = 0.20; }
                else if (clubIdx === 1) { liePenalty = 0.45; zPenalty = 0.45; }
                else { liePenalty = player.sandSave; }
            }

            let rangeBoost = rangeState.active ? 1.55 : 1.0;

            let speedModifier = club.speed * pwr * liePenalty * player.powerMult * rangeBoost;
            ball.prevX = ball.x; ball.prevY = ball.y;
            ball.vx = Math.cos(finalAngle) * speedModifier;
            ball.vy = Math.sin(finalAngle) * speedModifier;
            ball.vz = club.vZ * pwr * zPenalty * (rangeState.active ? 1.25 : 1.0);
            if (clubIdx === 3) ball.vz = 0;

            playSynth('square', 80, 40, 0.2, 0.8);
        }

        function clearActiveInputs() {
            dpad.up = false;
            dpad.down = false;
            dpad.left = false;
            dpad.right = false;
            dpadLastPulse.up = 0;
            dpadLastPulse.down = 0;
            dpadLastPulse.left = 0;
            dpadLastPulse.right = 0;
            inputTimers.up = 0;
            inputTimers.down = 0;
            inputTimers.left = 0;
            inputTimers.right = 0;
        }

        // Single Source of Truth: Parent Arcade Cabinet postMessage Bridge
        window.addEventListener('message', function(event) {
            const raw = event.data;
            const cmd = (typeof raw === 'string') ? raw : (raw && (raw.type || raw.action || raw.cmd || raw.button));
            if (!cmd) return;

            if (cmd === 'PAUSE') {
                isPaused = true;
                clearActiveInputs();
                return;
            }
            if (cmd === 'RESUME') {
                isPaused = false;
                clearActiveInputs();
                return;
            }

            if (isPaused) return;

            const now = Date.now();
            if (cmd === 'DPAD_UP') {
                dpad.up = true;
                dpadLastPulse.up = now;
            } else if (cmd === 'DPAD_UP_PRESS') {
                dpad.up = true;
                dpadLastPulse.up = 0;
            } else if (cmd === 'DPAD_UP_RELEASE') {
                dpad.up = false;
                dpadLastPulse.up = 0;
            } else if (cmd === 'DPAD_DOWN') {
                dpad.down = true;
                dpadLastPulse.down = now;
            } else if (cmd === 'DPAD_DOWN_PRESS') {
                dpad.down = true;
                dpadLastPulse.down = 0;
            } else if (cmd === 'DPAD_DOWN_RELEASE') {
                dpad.down = false;
                dpadLastPulse.down = 0;
            } else if (cmd === 'DPAD_LEFT') {
                dpad.left = true;
                dpadLastPulse.left = now;
            } else if (cmd === 'DPAD_LEFT_PRESS') {
                dpad.left = true;
                dpadLastPulse.left = 0;
            } else if (cmd === 'DPAD_LEFT_RELEASE') {
                dpad.left = false;
                dpadLastPulse.left = 0;
            } else if (cmd === 'DPAD_RIGHT') {
                dpad.right = true;
                dpadLastPulse.right = now;
            } else if (cmd === 'DPAD_RIGHT_PRESS') {
                dpad.right = true;
                dpadLastPulse.right = 0;
            } else if (cmd === 'DPAD_RIGHT_RELEASE') {
                dpad.right = false;
                dpadLastPulse.right = 0;
            } else if (cmd === 'BUTTON_A' || cmd === 'BUTTON_A_PRESS') {
                handleA_Button();
            } else if (cmd === 'BUTTON_B' || cmd === 'BUTTON_B_PRESS') {
                handleB_Button();
            }
        });

        function releaseExpiredDpadPulses() {
            const now = Date.now();
            if (dpad.up && dpadLastPulse.up > 0 && now - dpadLastPulse.up > DPAD_HOLD_WINDOW_MS) {
                dpad.up = false;
                dpadLastPulse.up = 0;
            }
            if (dpad.down && dpadLastPulse.down > 0 && now - dpadLastPulse.down > DPAD_HOLD_WINDOW_MS) {
                dpad.down = false;
                dpadLastPulse.down = 0;
            }
            if (dpad.left && dpadLastPulse.left > 0 && now - dpadLastPulse.left > DPAD_HOLD_WINDOW_MS) {
                dpad.left = false;
                dpadLastPulse.left = 0;
            }
            if (dpad.right && dpadLastPulse.right > 0 && now - dpadLastPulse.right > DPAD_HOLD_WINDOW_MS) {
                dpad.right = false;
                dpadLastPulse.right = 0;
            }
        }

        function handleMenuNavigation(key, changeVal) {
            let now = Date.now();
            if (dpad[key]) {
                if (inputTimers[key] === 0) {
                    selectedCourseIdx = Math.max(0, Math.min(COURSES.length - 1, selectedCourseIdx + changeVal));
                    playSynth('triangle', 240, 240, 0.05, 0.2); inputTimers[key] = now;
                } else if (now - inputTimers[key] > 280) {
                    selectedCourseIdx = Math.max(0, Math.min(COURSES.length - 1, selectedCourseIdx + changeVal));
                    playSynth('triangle', 240, 240, 0.05, 0.2); inputTimers[key] = now - 180;
                }
            } else inputTimers[key] = 0;
        }

        function handlePlayerPickerNavigation(key, changeVal) {
            let now = Date.now();
            if (dpad[key]) {
                if (inputTimers[key] === 0) {
                    selectedPlayerIdx = (selectedPlayerIdx + changeVal + PLAYER_TYPES.length) % PLAYER_TYPES.length;
                    playSynth('triangle', 320, 380, 0.05, 0.2); inputTimers[key] = now;
                } else if (now - inputTimers[key] > 280) {
                    selectedPlayerIdx = (selectedPlayerIdx + changeVal + PLAYER_TYPES.length) % PLAYER_TYPES.length;
                    playSynth('triangle', 320, 380, 0.05, 0.2); inputTimers[key] = now - 180;
                }
            } else inputTimers[key] = 0;
        }

        function handleClubSelectionInput(key, changeVal) {
            if (puttingState.active) return;
            let now = Date.now();
            if (dpad[key]) {
                if (inputTimers[key] === 0) {
                    clubIdx = Math.max(0, Math.min(3, clubIdx + changeVal)); inputTimers[key] = now;
                } else if (now - inputTimers[key] > 300) {
                    clubIdx = Math.max(0, Math.min(3, clubIdx + changeVal)); inputTimers[key] = now - 200;
                }
            } else inputTimers[key] = 0;
        }

        function initPuttingMiniGame() {
            puttingState.active = true; clubIdx = 3; 
            const hole = activeCourseHoles[currentHole];

            let dx = (ball.x - hole.pin.x) * puttingState.zoomScale;
            let dy = (ball.y - hole.pin.y) * puttingState.zoomScale;
            ball.x = puttingState.cupX + dx;
            ball.y = puttingState.cupY + dy;
            ball.z = 0; ball.vx = 0; ball.vy = 0;

            puttingState.isDualSlope = assignedDualSlopeHoles.includes(currentHole);
            puttingState.splitAxis = Math.random() > 0.5 ? 'x' : 'y';
            puttingState.splitVal = puttingState.splitAxis === 'x' ? 300 : 160;

            const subtleSlope = () => {
                let dir = Math.floor(Math.random() * 8);
                let ang = dir * (Math.PI / 4);
                let mag = 0.0035 + (Math.random() * 0.0025);
                return { x: Math.cos(ang) * mag, y: Math.sin(ang) * mag };
            };

            puttingState.slope1 = subtleSlope();
            puttingState.slope2 = subtleSlope();

            aimAngle = Math.atan2(puttingState.cupY - ball.y, puttingState.cupX - ball.x);
            state = 'AIM';
        }

        function getActiveSlope(screenX, screenY) {
            if (!puttingState.isDualSlope) return puttingState.slope1;
            let val = (puttingState.splitAxis === 'x') ? screenX : screenY;
            return (val < puttingState.splitVal) ? puttingState.slope1 : puttingState.slope2;
        }

        function exitPuttingOffGreen(worldX, worldY) {
            const hole = activeCourseHoles[currentHole];
            ball.x = worldX; ball.y = worldY;
            ball.vx = ball.vx / puttingState.zoomScale; 
            ball.vy = ball.vy / puttingState.zoomScale;
            ball.z = 0; ball.vz = 0; ball.prevX = ball.x; ball.prevY = ball.y;

            puttingState.active = false;
            targetCamY = hole.worldH > 400 ? Math.max(0, Math.min(hole.worldH - 400, ball.y - 200)) : 0;
            camY = targetCamY;
            
            shotFeedback = "OFF GREEN!";
            state = 'ROLL';
        }

        function gameLoop() {
            if (!isPaused) {
                releaseExpiredDpadPulses();
                update();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        function getTargetCameraY(hole, focusY) {
            if (hole.worldH <= 400) return 0;
            if (hole.worldH > 900) {
                if (focusY < 370) return 0;
                if (focusY < 710) return 340;
                return 680;
            } else {
                return (focusY < (hole.worldH - 400) + 70) ? 0 : (hole.worldH - 400);
            }
        }

        function triggerHazardReset(hole, feedbackText) {
            strokes++;
            courseScores[currentHole] = strokes;
            ball.x = ball.prevX;
            ball.y = ball.prevY;
            ball.z = 0;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;
            lie = getTerrainAt(ball.x, ball.y);
            if (lie === 'OB' || lie === 'WATER') lie = 'FAIRWAY';
            if (hole.worldH > 400) targetCamY = getTargetCameraY(hole, ball.y);
            playSynth('noise', 400, 100, 0.4, 0.8);
            shotFeedback = feedbackText || "HAZARD +1";
            state = 'AIM';
        }

        function update() {
            if (state === 'COURSE_SELECT' || state === 'COURSE_SPLASH' || state === 'FINAL_SCORECARD') { 
                if (state === 'COURSE_SELECT') {
                    handleMenuNavigation('up', -1); 
                    handleMenuNavigation('down', 1);
                    handlePlayerPickerNavigation('left', -1);
                    handlePlayerPickerNavigation('right', 1);
                }
                return; 
            }

            const hole = activeCourseHoles[currentHole];

            // Vizé La Lign Dynamic Wildlife & Target Animations
            if (rangeState.active) {
                for (let i = rangeState.popups.length - 1; i >= 0; i--) {
                    let p = rangeState.popups[i];
                    p.y -= 0.45;
                    p.life--;
                    if (p.life <= 0) rangeState.popups.splice(i, 1);
                }

                // 1. Fox emerging from tall grass rough patch and running across fairway off-screen
                const fox = rangeState.fox;
                if (fox && !fox.hit && fox.active) {
                    if (fox.delay > 0) {
                        fox.delay--;
                    } else {
                        fox.anim += 0.14;
                        fox.x += fox.vx;
                        if (fox.x < -30) {
                            fox.active = false; // Exited off-screen; will reset on next shot
                        }
                    }
                }

                // 2. Geese sitting on fairway pecking at grass; scatter and fly off-screen permanently when hit
                const geese = rangeState.geese;
                if (geese && !geese.gone) {
                    geese.anim += 0.08;
                    if (geese.scattering) {
                        let anyVisible = false;
                        for (let b of geese.birds) {
                            b.dx += b.vx;
                            b.dy += b.vy;
                            const wy = geese.y + b.dy;
                            const wx = geese.x + b.dx;
                            if (wy > -40 && wx > -40 && wx < 640) anyVisible = true;
                        }
                        if (!anyVisible) geese.gone = true;
                    }
                }

                // 3. Buffalo Herd (2-3 buffalos) rumbling horizontally off-screen to off-screen
                const herd = rangeState.herd;
                if (herd && !herd.hit && herd.active) {
                    if (herd.delay > 0) {
                        herd.delay--;
                    } else {
                        herd.anim += 0.08;
                        herd.x += herd.vx;
                        if ((herd.dir > 0 && herd.x > 690) || (herd.dir < 0 && herd.x < -90)) {
                            herd.active = false; // Exited off-screen; will reset on next shot
                        }
                    }
                }
            }

            if (selectedCourseIdx === 1 && currentHole === 1 && !puttingState.active) {
                for (let b of buffalos) {
                    b.chewAnim += 0.05;
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 275 || b.x > 395) b.vx *= -1;
                    if (b.y < 195 || b.y > 335) b.vy *= -1;
                }
            }

            if (state === 'AIM') {
                if (dpad.left) aimAngle -= 0.03; if (dpad.right) aimAngle += 0.03;
                handleClubSelectionInput('up', -1); handleClubSelectionInput('down', 1);

                if (!puttingState.active && hole.worldH > 400) {
                    let projY = Math.max(0, Math.min(hole.worldH, ball.y + Math.sin(aimAngle) * getEffectiveClubDist(clubIdx)));
                    targetCamY = getTargetCameraY(hole, projY);
                }
            }
            else if (state === 'POWER' || state === 'SNAP') {
                if (!puttingState.active && hole.worldH > 400) {
                    targetCamY = getTargetCameraY(hole, ball.y);
                }

                meter.val += meter.dir;
                if (state === 'POWER' && meter.val > 100) { meter.val = 100; meter.dir *= -1; }
                if (state === 'SNAP' && meter.val < 0) { meter.val = 0; meter.accuracy = 0; meter.accuracyMarker = 0; hitBall(); }
            }
            else if (state === 'FLY' || state === 'ROLL') {
                ball.x += ball.vx; ball.y += ball.vy;

                if (!puttingState.active && hole.worldH > 400) {
                    targetCamY = getTargetCameraY(hole, ball.y);
                }

                // Vizé La Lign Target Hit Detection (No regeneration once hit)
                if (rangeState.active) {
                    // Check Fox (5x)
                    const fox = rangeState.fox;
                    if (fox && !fox.hit && fox.active && fox.delay <= 0 && ball.z <= 12) {
                        if (Math.hypot(ball.x - fox.x, ball.y - fox.y) < 18) {
                            fox.hit = true;
                            fox.active = false;
                            rangeState.currentMultiplier *= fox.mult;
                            playBonusHitJingle(fox.mult);
                            rangeState.popups.push({
                                x: fox.x,
                                y: fox.y - 10,
                                text: "5X FOX!",
                                color: PALETTE.UI_ORANGE,
                                life: 70
                            });
                            shotFeedback = "5X FOX!";
                        }
                    }

                    // Check Grounded Geese Flock (3x) -> Scatter & fly off-screen permanently
                    const geese = rangeState.geese;
                    if (geese && !geese.hit && !geese.scattering && ball.z <= 14) {
                        if (Math.hypot(ball.x - geese.x, ball.y - geese.y) < 28) {
                            geese.hit = true;
                            geese.scattering = true;
                            rangeState.currentMultiplier *= geese.mult;
                            playBonusHitJingle(geese.mult);
                            rangeState.popups.push({
                                x: geese.x,
                                y: geese.y - 12,
                                text: "3X GEESE!",
                                color: PALETTE.WATER_BLUE_LIGHT,
                                life: 70
                            });
                            shotFeedback = "3X GEESE!";
                        }
                    }

                    // Check Buffalo Herd (2x)
                    const herd = rangeState.herd;
                    if (herd && !herd.hit && herd.active && herd.delay <= 0 && ball.z <= 14) {
                        for (let m of herd.members) {
                            const bx = herd.x + m.dx;
                            const by = herd.y + m.dy;
                            if (Math.hypot(ball.x - bx, ball.y - by) < 18) {
                                herd.hit = true;
                                herd.active = false;
                                rangeState.currentMultiplier *= herd.mult;
                                playBonusHitJingle(herd.mult);
                                rangeState.popups.push({
                                    x: bx,
                                    y: by - 12,
                                    text: "2X BUFFALO!",
                                    color: PALETTE.YELLOW,
                                    life: 70
                                });
                                shotFeedback = "2X BUFFALO!";
                                break;
                            }
                        }
                    }
                }

                if (selectedCourseIdx === 1 && currentHole === 1 && !puttingState.active && ball.z < 7) {
                    for (let b of buffalos) {
                        if (Math.hypot(ball.x - b.x, ball.y - b.y) < 13) {
                            ball.vx = -ball.vx * 0.45;
                            ball.vy = -ball.vy * 0.45;
                            ball.x += ball.vx * 2;
                            ball.y += ball.vy * 2;
                            ball.z = 0;
                            state = 'ROLL';
                            playSynth('sawtooth', 95, 55, 0.25, 0.5);
                            break;
                        }
                    }
                }

                if (selectedCourseIdx === 2 && !puttingState.active) {
                    for (let s of hole.shapes) {
                        if ((s.type === 'RIDGE' || s.type === 'MOUNTAIN') &&
                            ball.x >= s.x && ball.x <= s.x + s.w &&
                            ball.y >= s.y && ball.y <= s.y + s.h) {
                            triggerHazardReset(hole, "ROCK HAZARD +1");
                            return;
                        }
                    }
                }

                if (state === 'FLY') {
                    ball.vx += Math.cos(sessionConditions.dirAngle) * (sessionConditions.speed * 0.001);
                    ball.vy += Math.sin(sessionConditions.dirAngle) * (sessionConditions.speed * 0.001);
                    
                    ball.z += ball.vz; ball.vz -= GRAVITY;
                    if (ball.z <= 0) { ball.z = 0; state = 'ROLL'; }
                } else if (state === 'ROLL') {
                    if (puttingState.active) {
                        let activeSlope = getActiveSlope(ball.x, ball.y);
                        let effectivePuttFriction = Math.min(0.96, sessionConditions.puttingFriction * getActivePlayer().puttGrip);
                        
                        ball.vx *= effectivePuttFriction; 
                        ball.vy *= effectivePuttFriction;
                        
                        let currentSpeed = Math.hypot(ball.vx, ball.vy);
                        if (currentSpeed > 0.08) {
                            ball.vx += activeSlope.x;
                            ball.vy += activeSlope.y;
                        }

                        let worldX = hole.pin.x + (ball.x - puttingState.cupX) / puttingState.zoomScale;
                        let worldY = hole.pin.y + (ball.y - puttingState.cupY) / puttingState.zoomScale;
                        
                        let terr = getTerrainAt(worldX, worldY);
                        if (terr !== 'GREEN' && terr !== 'GREEN_DARK') {
                            exitPuttingOffGreen(worldX, worldY); return;
                        }

                        let distToCup = Math.hypot(ball.x - puttingState.cupX, ball.y - puttingState.cupY);

                        if (distToCup < puttingState.cupRadius + 1) {
                            if (currentSpeed < 3.2) {
                                ball.x = puttingState.cupX; ball.y = puttingState.cupY; ball.vx = 0; ball.vy = 0;
                                state = 'HOLE_OUT'; playSinkJingle(); 
                                setTimeout(() => { 
                                    state = 'POST_HOLE';
                                }, 2200);
                                return;
                            } else {
                                playSynth('square', 320, 240, 0.08, 0.4);
                                ball.vx = -ball.vx * 0.35; ball.vy = -ball.vy * 0.35;
                            }
                        }
                        if (currentSpeed < 0.08) {
                            ball.vx = 0; ball.vy = 0; 
                            aimAngle = Math.atan2(puttingState.cupY - ball.y, puttingState.cupX - ball.x); 
                            state = 'AIM';
                        }
                    } else {
                        let curTerr = getTerrainAt(ball.x, ball.y);
                        let friction = CLUBS[clubIdx].roll;
                        if (curTerr === 'ROUGH') friction *= 0.75;
                        if (curTerr === 'SAND') friction *= 0.45;
                        ball.vx *= friction; ball.vy *= friction;

                        if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) { ball.vx = 0; ball.vy = 0; resolveLie(); }
                    }
                }
            }

            if (!puttingState.active && hole.worldH > 400) camY += (targetCamY - camY) * 0.14;
            else if (puttingState.active) camY = 0;
        }

        function resolveLie() {
            let curTerr = getTerrainAt(ball.x, ball.y); let hole = activeCourseHoles[currentHole];

            if (rangeState.active) {
                const isOB = (curTerr === 'WATER' || curTerr === 'OB');
                resolveRangeShot(isOB);
                return;
            }

            let distToPin = Math.hypot(ball.x - hole.pin.x, ball.y - hole.pin.y);

            if (curTerr === 'WATER' || curTerr === 'OB') {
                triggerHazardReset(hole, curTerr === 'WATER' ? "WATER +1" : "HAZARD +1");
            } 
            else if (distToPin < 8) { 
                state = 'HOLE_OUT'; playSinkJingle(); 
                setTimeout(() => { state = 'POST_HOLE'; }, 2200); 
            } 
            else if (curTerr === 'GREEN') initPuttingMiniGame(); 
            else { lie = curTerr; clubIdx = (lie === 'SAND' ? 2 : clubIdx); state = 'AIM'; }
        }

        function draw() {
            ctx.clearRect(0, 0, VIEW_W, VIEW_H);

            let bgFill = PALETTE.ROUGH_WOOD;
            if (state === 'COURSE_SELECT') {
                bgFill = (selectedCourseIdx === 1 || selectedCourseIdx === 3) ? '#262110' : (selectedCourseIdx === 2 ? '#181a33' : PALETTE.ROUGH_WOOD);
            } else if (state !== 'TITLE') {
                bgFill = (selectedCourseIdx === 1 || selectedCourseIdx === 3) ? PALETTE.ROUGH_PRAIRIE : (selectedCourseIdx === 2 ? PALETTE.ROUGH_NORTH : PALETTE.ROUGH_WOOD);
            }
            ctx.fillStyle = bgFill;
            ctx.fillRect(0, 0, VIEW_W, VIEW_H);

            if (state === 'TITLE') { drawTitleScreen(); return; }
            if (state === 'COURSE_SELECT') { drawCourseSelectScreen(); return; }
            if (state === 'COURSE_SPLASH') { drawCourseSplashScreen(); return; }
            if (state === 'FINAL_SCORECARD') { drawFinalScorecardScreen(); return; }

            if (puttingState.active) drawPuttingGreenMiniGame();
            else drawMainCourse();

            drawHUD();
            if (showMiniMap && state !== 'HOLE_OUT' && state !== 'POST_HOLE') drawOverlayHUD();

            if (state === 'HOLE_OUT' || state === 'POST_HOLE') {
                let hole = activeCourseHoles[currentHole];
                ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 150, VIEW_W, 100);
                ctx.fillStyle = PALETTE.GREEN; ctx.textAlign = 'center';
                if (rangeState.active) {
                    const last = rangeState.ballScores[rangeState.ballScores.length - 1];
                    ctx.font = '18px "Press Start 2P"';
                    if (last && last.ob) {
                        ctx.fillStyle = PALETTE.RED;
                        ctx.fillText("OUT OF BOUNDS! 0 PTS", VIEW_W / 2, 206);
                    } else if (last) {
                        ctx.fillStyle = last.mult > 1 ? PALETTE.YELLOW : PALETTE.GREEN;
                        ctx.fillText(`${last.yards} YDS  x${last.mult}  =  ${last.points} PTS!`, VIEW_W / 2, 206);
                    }
                } else {
                    ctx.font = '24px "Press Start 2P"';
                    let diff = strokes - hole.par;
                    let text = (strokes === 1) ? "HOLE IN ONE!" : diff === -2 ? "EAGLE!" : diff === -1 ? "BIRDIE!" : diff === 0 ? "PAR" : diff === 1 ? "BOGEY" : "DBL BOGEY";
                    ctx.fillText(text, VIEW_W / 2, 210);
                }
            }
        }

        function drawThematicParallaxBackdrop(themeIdx) {
            const t = Date.now() / 1000;

            if (themeIdx === 2) {
                ctx.fillStyle = PALETTE.ROUGH_NORTH_DARK;
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);

                for (let s = 0; s < 56; s++) {
                    let sx = ((s * 73 - t * 4) % VIEW_W + VIEW_W) % VIEW_W;
                    let sy = (s * 41) % 210 + 10;
                    ctx.fillStyle = ((Date.now() + s * 170) % 1000 < 550) ? PALETTE.WHITE : PALETTE.MTN_SNOW;
                    ctx.fillRect(sx, sy, (s % 4 === 0) ? 3 : 2, (s % 4 === 0) ? 3 : 2);
                }

                let auroraWave = Math.sin(t * 1.1) * 14;
                for (let ax = -80; ax < VIEW_W + 80; ax += 80) {
                    let shiftY = Math.sin(t * 1.5 + ax * 0.02) * 10;
                    ctx.fillStyle = 'rgba(82, 242, 178, 0.22)';
                    ctx.fillRect(ax, 105 + shiftY, 82, 26);

        function drawHoleMiniMapBox(hole, courseIdx, boxX, boxY, boxW, boxH, holeLabel) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.90)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = PALETTE.UI_ORANGE;
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText(holeLabel, boxX + boxW / 2, boxY + 11);

            const innerX = boxX + 6;
            const innerY = boxY + 15;
            const innerW = boxW - 12;
            const innerH = boxH - 20;

            if (!hole) {
                ctx.fillStyle = '#1d242b';
                ctx.fillRect(innerX, innerY, innerW, innerH);
                ctx.fillStyle = '#555555';
                ctx.font = '10px "Press Start 2P"';
                ctx.fillText("?", boxX + boxW / 2, innerY + innerH / 2 + 4);
                return;
            }

            if (courseIdx === 1 || courseIdx === 3) ctx.fillStyle = PALETTE.ROUGH_PRAIRIE_DARK;
            else if (courseIdx === 2) ctx.fillStyle = PALETTE.ROUGH_NORTH;
            else ctx.fillStyle = PALETTE.ROUGH_WOOD;
            ctx.fillRect(innerX, innerY, innerW, innerH);

            const scaleX = innerW / hole.worldW;
            const scaleY = innerH / hole.worldH;

            for (let s of hole.shapes) {
                if (s.type === 'HAZARD_ROCK') continue;
                if (s.type === 'TALL_GRASS_PATCH') {
                    ctx.fillStyle = '#63521d';
                } else if (s.type === 'FAIRWAY') {
                    ctx.fillStyle = (courseIdx === 1 || courseIdx === 3) ? PALETTE.FAIRWAY_PRAIRIE : (courseIdx === 2 ? PALETTE.FAIRWAY_NORTH : PALETTE.FAIRWAY_WOOD);
                } else if (s.type === 'PEBBLE_ROUGH') {
                    ctx.fillStyle = PALETTE.PEBBLE_BUFFER;
                } else if (s.type === 'WATER' || s.type === 'WATERFALL') {
                    ctx.fillStyle = (courseIdx === 1 || courseIdx === 3) ? PALETTE.WATER_SILT : (courseIdx === 2 ? PALETTE.WATER_GLACIAL : PALETTE.WATER_BLUE);
                } else if (s.type === 'MOUNTAIN' || s.type === 'RIDGE') {
                    ctx.fillStyle = PALETTE.MTN_HIGH;
                } else if (s.type === 'SAND') {
                    ctx.fillStyle = (courseIdx === 2) ? PALETTE.SAND_NORTH : PALETTE.SAND;
                } else if (s.type === 'GREEN') {
                    ctx.fillStyle = (courseIdx === 2) ? PALETTE.GREEN_NORTH : PALETTE.GREEN;
                } else {
                    ctx.fillStyle = PALETTE[s.type];
                }

                ctx.fillRect(
                    innerX + (s.x * scaleX),
                    innerY + (s.y * scaleY),
                    Math.max(1, s.w * scaleX),
                    Math.max(2, s.h * scaleY)
                );
            }

            ctx.fillStyle = PALETTE.TEE_BLUE_LIGHT;
            ctx.fillRect(innerX + (hole.tee.x * scaleX) - 2, innerY + (hole.tee.y * scaleY) - 2, 4, 4);

            if (courseIdx !== 3) {
                ctx.fillStyle = (Date.now() % 400 < 200) ? PALETTE.UI_ORANGE : PALETTE.WHITE;
                ctx.fillRect(innerX + (hole.pin.x * scaleX) - 2, innerY + (hole.pin.y * scaleY) - 2, 4, 4);
            }
        }

        function drawRangeMiniScorecard(scX, scY, scW, scH, scoresArr) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            ctx.fillRect(scX, scY, scW, scH);
            ctx.strokeStyle = PALETTE.UI_ORANGE;
            ctx.lineWidth = 2;
            ctx.strokeRect(scX, scY, scW, scH);

            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("RANGE CARD (10)", scX + scW / 2, scY + 10);

            const headerH = 14;
            const rowH = (scH - headerH) / 2;

            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(scX, scY + headerH);
            ctx.lineTo(scX + scW, scY + headerH);
            ctx.moveTo(scX, scY + headerH + rowH);
            ctx.lineTo(scX + scW, scY + headerH + rowH);

            const totColW = Math.floor(scW * 0.26);
            const ballAreaW = scW - totColW;
            const colW = ballAreaW / 5;
            for (let c = 1; c <= 5; c++) {
                ctx.moveTo(scX + c * colW, scY + headerH);
                ctx.lineTo(scX + c * colW, scY + scH);
            }
            ctx.stroke();

            ctx.font = '5px "Press Start 2P"';
            ctx.textAlign = 'center';
            for (let i = 0; i < 10; i++) {
                const col = i % 5;
                const row = Math.floor(i / 5);
                const cx = scX + col * colW + colW / 2;
                const cy = scY + headerH + row * rowH + rowH * 0.68;
                const entry = scoresArr && scoresArr[i];
                if (entry) {
                    ctx.fillStyle = entry.mult > 1 ? PALETTE.YELLOW : PALETTE.GREEN;
                    ctx.fillText(entry.points, cx, cy);
                } else {
                    ctx.fillStyle = '#777777';
                    ctx.fillText(`B${i + 1}`, cx, cy);
                }
            }

            const totX = scX + ballAreaW + totColW / 2;
            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '6px "Press Start 2P"';
            ctx.fillText("TOT", totX, scY + headerH + rowH * 0.68);
            const totPts = scoresArr ? scoresArr.reduce((acc, s) => acc + s.points, 0) : 0;
            ctx.fillStyle = PALETTE.YELLOW;
            ctx.fillText(totPts > 0 ? totPts : "-", totX, scY + headerH + rowH * 1.68);
        }

        function drawGriddedScorecard(scX, scY, scW, scH, holesArr, scoresArr, showLiveColors) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            ctx.fillRect(scX, scY, scW, scH);
            ctx.strokeStyle = PALETTE.UI_ORANGE;
            ctx.lineWidth = 2;
            ctx.strokeRect(scX, scY, scW, scH);

            ctx.fillStyle = PALETTE.WHITE;
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("SCORECARD", scX + scW / 2, scY + 10);

            const headerH = 14;
            const bodyH = scH - headerH;
            const rowH = bodyH / 3;

            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(scX, scY + headerH);
            ctx.lineTo(scX + scW, scY + headerH);
            ctx.moveTo(scX, scY + headerH + rowH);
            ctx.lineTo(scX + scW, scY + headerH + rowH);
            ctx.moveTo(scX, scY + headerH + rowH * 2);
            ctx.lineTo(scX + scW, scY + headerH + rowH * 2);

            const labelColW = Math.floor(scW * 0.18);
            const totColW = Math.floor(scW * 0.28);
            const holeColW = (scW - labelColW - totColW) / 3;

            for (let c = 0; c < 4; c++) {
                let lx = scX + labelColW + (c * holeColW);
                ctx.moveTo(lx, scY + headerH);
                ctx.lineTo(lx, scY + scH);
            }
            ctx.stroke();

            ctx.font = '6px "Press Start 2P"';
            ctx.fillStyle = PALETTE.WHITE;
            ctx.textAlign = 'left';
            ctx.fillText("HL", scX + 5, scY + headerH + rowH * 0.74);
            ctx.fillText("PR", scX + 5, scY + headerH + rowH * 1.74);
            ctx.fillText("SC", scX + 5, scY + headerH + rowH * 2.74);

            ctx.textAlign = 'center';
            for (let i = 0; i < 3; i++) {
                let cx = scX + labelColW + (i * holeColW) + (holeColW / 2);
                ctx.fillStyle = PALETTE.WHITE;
                ctx.fillText(i + 1, cx, scY + headerH + rowH * 0.74);

                let parVal = holesArr ? holesArr[i].par : "-";
                ctx.fillText(parVal, cx, scY + headerH + rowH * 1.74);

                let dispScore = "-";
                if (scoresArr && (i < currentHole || (i === currentHole && scoresArr[i] > 0))) {
                    dispScore = scoresArr[i];
                }

                if (showLiveColors && dispScore !== "-" && holesArr) {
                    let diff = dispScore - holesArr[i].par;
                    if (diff < 0) ctx.fillStyle = PALETTE.GREEN;
                    else if (diff > 0) ctx.fillStyle = PALETTE.RED;
                    else ctx.fillStyle = PALETTE.WHITE;
                } else {
                    ctx.fillStyle = PALETTE.WHITE;
                }
                ctx.fillText(dispScore, cx, scY + headerH + rowH * 2.74);
            }

            let cxTot = scX + scW - (totColW / 2);
            ctx.fillStyle = PALETTE.WHITE;
            ctx.fillText("TOT", cxTot, scY + headerH + rowH * 0.74);

            let parTot = holesArr ? holesArr.reduce((a, b) => a + b.par, 0) : "-";
            ctx.fillText(parTot, cxTot, scY + headerH + rowH * 1.74);

            let totScore = scoresArr ? scoresArr.reduce((a, b) => a + b, 0) : 0;
            let dispTot = (totScore > 0) ? totScore : "-";
            ctx.fillText(dispTot, cxTot, scY + headerH + rowH * 2.74);
        }

        function drawAnimatedWindSock(poleX, poleTopY, poleBottomY, windSpeed, windAngle) {
            ctx.fillStyle = PALETTE.FAIRWAY_WOOD;
            ctx.fillRect(poleX - 18, poleBottomY - 4, 36, 8);
            ctx.fillStyle = PALETTE.GREEN;
            ctx.fillRect(poleX - 14, poleBottomY - 6, 28, 4);

            ctx.fillStyle = '#888888';
            ctx.fillRect(poleX - 2, poleTopY, 4, poleBottomY - poleTopY);
            ctx.fillStyle = PALETTE.WHITE;
            ctx.fillRect(poleX - 1, poleTopY, 2, poleBottomY - poleTopY);

            ctx.fillStyle = PALETTE.YELLOW;
            ctx.fillRect(poleX - 3, poleTopY - 5, 6, 5);

            const time = Date.now() / 1000;
            const speedNorm = Math.min(1, windSpeed / 30);

            const dirX = Math.cos(windAngle);
            const dirY = Math.sin(windAngle);

            const extension = 0.22 + speedNorm * 0.78;
            const gravitySag = (1 - extension) * 1.15;

            const vecX = dirX * extension;
            const vecY = (dirY * extension) + gravitySag;
            const baseAngle = Math.atan2(vecY, vecX);

            const waveSpeed = 3.5 + speedNorm * 10;
            const waveAmp = 0.04 + speedNorm * 0.14;

            const collarX = poleX + Math.cos(baseAngle) * 7;
            const collarY = (poleTopY + 4) + Math.sin(baseAngle) * 7;

            ctx.strokeStyle = PALETTE.WHITE;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(poleX, poleTopY + 4);
            ctx.lineTo(collarX, collarY);
            ctx.stroke();

            let segX = collarX;
            let segY = collarY;
            const segWidths = [11, 11, 10, 10, 9];
            const segHeights = [14, 12, 10, 8, 6];

            for (let i = 0; i < 5; i++) {
                let flutter = Math.sin(time * waveSpeed - i * 0.85) * waveAmp;
                let curAngle = baseAngle + flutter;
                let w = segWidths[i];
                let h = segHeights[i];

                ctx.save();
                ctx.translate(segX, segY);
                ctx.rotate(curAngle);

                ctx.fillStyle = PALETTE.BLACK;
                ctx.fillRect(-1, -h / 2 - 1, w + 2, h + 2);

                ctx.fillStyle = (i % 2 === 0) ? PALETTE.UI_ORANGE : PALETTE.WHITE;
                ctx.fillRect(0, -h / 2, w, h);

                ctx.restore();

                segX += Math.cos(curAngle) * (w - 1);
                segY += Math.sin(curAngle) * (w - 1);
            }
        }

        // Draws Grounded Geese Pecking at Grass, or Scattering & Flying Upward Off-Screen when Hit
        function drawPixelGeeseFlock(gx, gy, anim, geeseObj) {
            const birds = geeseObj ? geeseObj.birds : [
                { dx: 0, dy: -8, peckOffset: 0 },
                { dx: -12, dy: 0, peckOffset: 1.5 },
                { dx: 12, dy: 0, peckOffset: 3.0 },
                { dx: -22, dy: 8, peckOffset: 4.5 },
                { dx: 22, dy: 8, peckOffset: 6.0 }
            ];
            const scattering = geeseObj ? geeseObj.scattering : false;

            for (let b of birds) {
                const bx = gx + b.dx;
                const by = gy + b.dy;

                if (scattering) {
                    // Flying scatter animation
                    const flap = Math.sin(anim * 10 + (b.peckOffset || 0)) > 0 ? -4 : 3;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.fillRect(bx - 3, by + 16, 6, 2);
                    ctx.fillStyle = PALETTE.GOOSE_BODY;
                    ctx.fillRect(bx - 2, by - 4, 4, 8);
                    ctx.fillStyle = PALETTE.GOOSE_WING;
                    ctx.fillRect(bx - 8, by - 1 + flap, 6, 3);
                    ctx.fillRect(bx + 2, by - 1 + flap, 6, 3);
                    ctx.fillStyle = PALETTE.GOOSE_NECK;
                    ctx.fillRect(bx - 1, by - 8, 2, 4);
                    ctx.fillStyle = PALETTE.WHITE;
                    ctx.fillRect(bx - 1, by - 6, 2, 1);
                } else {
                    // Sitting on fairway pecking at the grass
                    const pecking = Math.sin(anim * 2.5 + (b.peckOffset || 0)) > 0.35;
                    // Body sitting on grass
                    ctx.fillStyle = PALETTE.GOOSE_BODY;
                    ctx.fillRect(bx - 4, by - 2, 8, 5);
                    ctx.fillStyle = PALETTE.GOOSE_WING;
                    ctx.fillRect(bx - 3, by - 1, 5, 3);
                    // Tail tip
                    ctx.fillStyle = PALETTE.WHITE;
                    ctx.fillRect(bx + 3, by - 2, 2, 2);
                    // Head & neck (dips down to grass when pecking)
                    ctx.fillStyle = PALETTE.GOOSE_NECK;
                    if (pecking) {
                        ctx.fillRect(bx - 7, by + 1, 4, 3);
                        ctx.fillStyle = PALETTE.WHITE;
                        ctx.fillRect(bx - 6, by + 1, 1, 2);
                    } else {
                        ctx.fillRect(bx - 5, by - 6, 2, 5);
                        ctx.fillStyle = PALETTE.WHITE;
                        ctx.fillRect(bx - 5, by - 5, 2, 1);
                    }
                }
            }

                distText = `PIN: ${(Math.hypot(ball.x - puttingState.cupX, ball.y - puttingState.cupY) / puttingState.zoomScale * 3 / 10).toFixed(1)}ft`;
            } else {
                distText = `PIN: ${Math.hypot(ball.x - hole.pin.x, ball.y - hole.pin.y).toFixed(0)}y`;
            }

            ctx.textAlign = 'left';
            let isBadLie = (lie === 'SAND' || lie === 'ROUGH') && clubIdx === 0 && !puttingState.active;
            ctx.fillStyle = isBadLie ? PALETTE.CANYON : PALETTE.WHITE;
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText(`${CLUBS[clubIdx].name}`, 15, botHudY + 31);
            ctx.fillStyle = PALETTE.WHITE; ctx.fillText(distText, 215, botHudY + 31);

            const meterW = 230;
            const meterX = VIEW_W - meterW - 20;
            const meterY = botHudY + 16;
            ctx.fillStyle = '#222222'; ctx.fillRect(meterX, meterY, meterW, 20);
            ctx.fillStyle = '#441111'; ctx.fillRect(meterX, meterY, meterW * 0.20, 20);
            ctx.fillStyle = '#666666'; ctx.fillRect(meterX + (meterW * 0.25), meterY, 2, 20); ctx.fillRect(meterX + (meterW * 0.50), meterY, 2, 20); ctx.fillRect(meterX + (meterW * 0.75), meterY, 2, 20);

            let sweetLeft = meterW * 0.20;
            let sweetW = meterW * Math.max(0.06, 0.10 + player.sweetBonus);
            ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(meterX + sweetLeft, meterY, sweetW, 20);
            ctx.fillStyle = PALETTE.BLACK; ctx.font = '12px "Press Start 2P"';
            ctx.fillText("[", meterX + sweetLeft - 4, meterY + 15); ctx.fillText("]", meterX + sweetLeft + sweetW - 8, meterY + 15);

            if (state === 'POWER' || state === 'SNAP' || state === 'FLY' || state === 'ROLL') {
                ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(meterX, meterY + 4, (meter.val / 100) * meterW, 12);
                if (state === 'POWER' || state === 'SNAP') {
                    ctx.fillStyle = PALETTE.WHITE; ctx.fillRect(meterX + (meter.val / 100) * meterW - 2, meterY - 4, 4, 28);
                }
            }

            if (meter.powerMarker >= 0) { ctx.fillStyle = PALETTE.UI_ORANGE; ctx.fillRect(meterX + (meter.powerMarker / 100) * meterW - 2, meterY - 6, 4, 10); }
            if (meter.accuracyMarker >= 0) { ctx.fillStyle = PALETTE.WATER_LIGHT; ctx.fillRect(meterX + (meter.accuracyMarker / 100) * meterW - 2, meterY + 16, 4, 10); }

            if (shotFeedback !== "") {
                ctx.fillStyle = (shotFeedback === "GREAT SHOT!" || shotFeedback.includes("X")) ? PALETTE.YELLOW : shotFeedback === "AVERAGE" ? PALETTE.WHITE : PALETTE.CANYON;
                ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText(shotFeedback, meterX + (meterW / 2), botHudY + 50);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
