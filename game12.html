  function renderPlayfield() {
    const cel = getCelestialState(gameState.clockMinutes);
    const p = gameState.player;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HUD_H, SCREEN_W, SCREEN_H);
    ctx.clip();

    if (gameState.slide.active) {
      const t = gameState.slide.progress;
      const ease = 1 - Math.pow(1 - t, 3);
      const dir = gameState.slide.dir;

      let fromOx = 0, fromOy = HUD_H;
      let toOx = 0, toOy = HUD_H;

      if (dir === 'UP') {
        fromOy = HUD_H + Math.round(ease * SCREEN_H);
        toOy = HUD_H - SCREEN_H + Math.round(ease * SCREEN_H);
      } else if (dir === 'DOWN') {
        fromOy = HUD_H - Math.round(ease * SCREEN_H);
        toOy = HUD_H + SCREEN_H - Math.round(ease * SCREEN_H);
      } else if (dir === 'LEFT') {
        fromOx = Math.round(ease * SCREEN_W);
        toOx = -SCREEN_W + Math.round(ease * SCREEN_W);
      } else if (dir === 'RIGHT') {
        fromOx = -Math.round(ease * SCREEN_W);
        toOx = SCREEN_W - Math.round(ease * SCREEN_W);
      }

      if (p.space === 'EXTERIOR') {
        renderExteriorScreen(gameState.slide.fromScX, gameState.slide.fromScY, fromOx, fromOy);
        renderExteriorScreen(gameState.view.scX, gameState.view.scY, toOx, toOy);
      } else {
        renderInteriorScreen(p.space, gameState.slide.fromRoom, fromOx, fromOy);
        renderInteriorScreen(p.space, p.roomIdx, toOx, toOy);
      }
    } else {
      if (p.space === 'EXTERIOR') {
        renderExteriorScreen(gameState.view.scX, gameState.view.scY, 0, HUD_H);
      } else {
        renderInteriorScreen(p.space, p.roomIdx, 0, HUD_H);
      }
    }

    if (cel.tintCss) {
      ctx.fillStyle = cel.tintCss;
      ctx.fillRect(0, HUD_H, SCREEN_W, SCREEN_H);
    }

    if (gameState.dissolve.active) {
      const dp = gameState.dissolve.progress;
      const intensity = 1 - Math.abs(dp - 0.5) * 2;
      const cellSize = 8;
      ctx.fillStyle = '#0b0d14';
      for (let py = HUD_H; py < 336; py += cellSize) {
        for (let px = 0; px < SCREEN_W; px += cellSize) {
          const hash = (((px / cellSize) * 7 + (py / cellSize) * 13) % 16) / 16;
          if (hash < intensity) {
            ctx.fillRect(px, py, cellSize, cellSize);
          }
        }
      }
    }

    ctx.restore();
  }

  function renderHud() {
    const phase = PHASES[getCurrentPhaseIndex()];
    const cel = getCelestialState(gameState.clockMinutes);
    const stats = getRosterStats();
    const foundCount = gameState.clues.filter((c) => c.discovered).length;

    ctx.fillStyle = 'rgba(15, 19, 36, 0.96)';
    ctx.fillRect(0, 0, 480, HUD_H);

    const skyGrad = ctx.createLinearGradient(0, 2, 0, HUD_H - 2);
    skyGrad.addColorStop(0, cel.skyTopCss);
    skyGrad.addColorStop(1, cel.skyBotCss);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(4, 2, 146, HUD_H - 4);
    ctx.strokeStyle = '#5c5449';
    ctx.strokeRect(4, 2, 146, HUD_H - 4);

    if (cel.isNight) {
      ctx.fillStyle = '#f4f1de';
      ctx.fillRect(16, 5, 1, 1);
      ctx.fillRect(48, 4, 1, 1);
      ctx.fillRect(96, 6, 1, 1);
      ctx.fillRect(132, 4, 1, 1);
    }

    const arcX = Math.round(12 + cel.bodyProgress * 130);
    const arcY = Math.round(16 - Math.sin(cel.bodyProgress * Math.PI) * 10);
    if (cel.isDay) {
      ctx.fillStyle = '#ffcd75';
      ctx.fillRect(arcX - 3, arcY - 3, 6, 6);
      ctx.fillStyle = '#fff5cc';
      ctx.fillRect(arcX - 2, arcY - 2, 4, 4);
    } else {
      ctx.fillStyle = '#e6eef8';
      ctx.fillRect(arcX - 3, arcY - 3, 5, 5);
      ctx.fillStyle = cel.skyTopCss;
      ctx.fillRect(arcX - 1, arcY - 3, 3, 3);
    }

    ctx.fillStyle = '#f7c844';
    ctx.fillRect(0, HUD_H - 1, 480, 1);

    ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0b0d14';
    ctx.fillText(`${formatClock(gameState.clockMinutes)} ${phase.label.split(' ')[1]}`, 11, 15);
    ctx.fillStyle = '#f4f1de';
    ctx.fillText(`${formatClock(gameState.clockMinutes)} ${phase.label.split(' ')[1]}`, 10, 14);

    ctx.textAlign = 'center';
    ctx.fillStyle = stats.count === 12 ? '#73eff7' : '#ff7b72';
    ctx.fillText(`ROSTER ${stats.count}/12 (${stats.steersmen}B/${stats.bowsmen}A/${stats.middlemen}M)`, 258, 14);

    ctx.textAlign = 'right';
    ctx.fillStyle = gameState.morale >= 65 ? '#a3e635' : '#ff7b72';
    ctx.fillText(`MORALE ${gameState.morale}%  CLUES ${foundCount}`, 472, 14);

    if (gameState.screen === 'PLAYING' && !gameState.slide.active && !gameState.dissolve.active) {
      const prompt = getNearbyPrompt();
      if (prompt) {
        ctx.fillStyle = 'rgba(15, 19, 36, 0.92)';
        ctx.fillRect(105, 312, 270, 18);
        ctx.strokeStyle = '#f7c844';
        ctx.strokeRect(105, 312, 270, 18);
        ctx.fillStyle = '#f4f1de';
        ctx.font = 'bold 9px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(prompt, 240, 324);
      }
    }
  }

  function getNearbyPrompt() {
    const p = gameState.player;
    if (p.space === 'BLDG_CLERKS_OFFICE' && p.roomIdx === 0 && p.y < 86 && Math.abs(p.x - 165) < 44) {
      return '[A] Final Brigade Roster';
    }
    if (p.space === 'BLDG_COURTHOUSE' && p.roomIdx === 0 && p.y < 86 && Math.abs(p.x - 165) < 44) {
      return '[A] Quarterly Court Docket';
    }
    const clue = gameState.clues.find(
      (c) => c.space === p.space && (c.roomIdx || 0) === p.roomIdx && Math.hypot(c.x - p.x, c.y - p.y) <= 32
    );
    if (clue) return `[A] Inspect ${clue.label}`;
    const mentor = HBC_MENTORS.find(
      (m) => m.space === p.space && (m.roomIdx || 0) === p.roomIdx && Math.hypot(m.x - p.x, m.y - p.y) <= 32
    );
    if (mentor) return `[A] Speak: ${mentor.name}`;
    const npc = gameState.tripmen.find(
      (t) => t.space === p.space && t.roomIdx === p.roomIdx && Math.hypot(t.x - p.x, t.y - p.y) <= 30
    );
    if (npc) return `[A] Speak: ${npc.name} (${npc.role})`;
    return null;
  }

  function renderDialog() {
    const line = gameState.dialogQueue[0] || '';
    ctx.fillStyle = 'rgba(15, 19, 36, 0.95)';
    ctx.fillRect(28, 244, 424, 78);
    ctx.strokeStyle = '#f7c844';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 244, 424, 78);
    ctx.lineWidth = 1;

    ctx.fillStyle = '#f4f1de';
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'left';

    const words = line.split(' ');
    let cur = '';
    let wy = 264;
    for (const w of words) {
      if ((cur + w).length > 56) {
        ctx.fillText(cur.trim(), 42, wy);
        cur = w + ' ';
        wy += 14;
      } else {
        cur += w + ' ';
      }
    }
    if (cur.trim()) ctx.fillText(cur.trim(), 42, wy);

    ctx.fillStyle = '#f7c844';
    ctx.textAlign = 'right';
    ctx.fillText('[A] NEXT', 440, 312);
  }

  function renderDocketOverlay() {
    ctx.fillStyle = 'rgba(15, 19, 36, 0.96)';
    ctx.fillRect(24, 28, 432, 286);
    ctx.strokeStyle = '#f7c844';
    ctx.lineWidth = 2;
    ctx.strokeRect(24, 28, 432, 286);
    ctx.lineWidth = 1;

    ctx.fillStyle = '#f7c844';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('GENERAL QUARTERLY COURT DOCKET — ASSINIBOIA', 38, 46);

    ctx.fillStyle = '#d4d0c5';
    ctx.font = 'bold 8px Courier New';
    ctx.fillText('SUMMER sittings require personal attendance; WINTER sittings follow brigade return.', 38, 60);

    gameState.courtDocket.forEach((entry, i) => {
      const dy = 82 + i * 68;
      const isSummer = entry.season === 'SUMMER';
      ctx.fillStyle = isSummer ? 'rgba(138, 51, 36, 0.35)' : 'rgba(43, 76, 126, 0.35)';
      ctx.fillRect(36, dy - 12, 408, 56);
      ctx.strokeStyle = isSummer ? '#ff7b72' : '#73eff7';
      ctx.strokeRect(36, dy - 12, 408, 56);

      ctx.fillStyle = isSummer ? '#ff7b72' : '#73eff7';
      ctx.font = 'bold 9px Courier New';
      ctx.fillText(`[${entry.sitting}] — ${entry.litigant} (${entry.parish})`, 44, dy + 2);

      ctx.fillStyle = '#f4f1de';
      ctx.font = 'bold 8px Courier New';
      ctx.fillText(entry.matter.slice(0, 66), 44, dy + 18);
      if (entry.matter.length > 66) {
        ctx.fillText(entry.matter.slice(66), 44, dy + 30);
      }
    });

    ctx.fillStyle = '#f7c844';
    ctx.textAlign = 'center';
    ctx.fillText('[A / B] CLOSE DOCKET', 240, 302);
  }

  function renderRosterOverlay() {
    const stats = getRosterStats();
    ctx.fillStyle = 'rgba(15, 19, 36, 0.96)';
    ctx.fillRect(24, 28, 432, 286);
    ctx.strokeStyle = '#f7c844';
    ctx.lineWidth = 2;
    ctx.strokeRect(24, 28, 432, 286);
    ctx.lineWidth = 1;

    ctx.fillStyle = '#f7c844';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText("FINAL BRIGADE ROSTER — CLERK'S QUARTERS", 38, 46);

    ctx.font = 'bold 9px Courier New';
    ctx.fillStyle = stats.count === 12 ? '#73eff7' : '#ff7b72';
    ctx.fillText(
      `SIGNED: ${stats.count}/12   BOUTS: ${stats.steersmen}/2   AVANTS: ${stats.bowsmen}/2   MILIEUX: ${stats.middlemen}/8`,
      38, 60
    );

    const startIdx = Math.max(0, Math.min(10, gameState.rosterCursor - 4));
    for (let i = 0; i < 10; i++) {
      const idx = startIdx + i;
      const t = gameState.tripmen[idx];
      const ry = 78 + i * 20;
      const isCursor = idx === gameState.rosterCursor;

      if (isCursor) {
        ctx.fillStyle = '#29366f';
        ctx.fillRect(34, ry - 11, 412, 16);
      }

      ctx.fillStyle = t.onRoster ? '#a3e635' : (t.isReserve ? '#73eff7' : '#8d96a5');
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'left';
      const mark = t.onRoster ? '[X]' : '[ ]';
      const tag = t.isReserve ? 'RES' : t.role.slice(0, 5).toUpperCase();
      ctx.fillText(`${isCursor ? '►' : ' '} ${mark} ${t.name.padEnd(19, ' ')} ${tag.padEnd(6, ' ')} ${t.parish}`, 38, ry);
    }

    ctx.fillStyle = '#f7c844';
    ctx.textAlign = 'center';
    ctx.fillText('[UP/DOWN] SELECT   [A] TOGGLE SIGN-ON   [B] CLOSE', 240, 302);
  }

  function renderNotebookOverlay() {
    const found = gameState.clues.filter((c) => c.discovered);
    ctx.fillStyle = 'rgba(15, 19, 36, 0.96)';
    ctx.fillRect(24, 28, 432, 286);
    ctx.strokeStyle = '#73eff7';
    ctx.lineWidth = 2;
    ctx.strokeRect(24, 28, 432, 286);
    ctx.lineWidth = 1;

    ctx.fillStyle = '#73eff7';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`GUIDE'S FIELD NOTEBOOK (${found.length} NOTES RECORDED)`, 38, 46);

    if (found.length === 0) {
      ctx.fillStyle = '#d4d0c5';
      ctx.font = 'bold 10px Courier New';
      ctx.fillText('No field notes recorded yet. Inspect ledgers, cargo, and talk to the men.', 38, 82);
    } else {
      const recent = found.slice(-7);
      recent.forEach((c, i) => {
        const ny = 70 + i * 31;
        ctx.fillStyle = '#f7c844';
        ctx.font = 'bold 8px Courier New';
        ctx.fillText(`• ${c.label}`, 38, ny);
        ctx.fillStyle = '#f4f1de';
        ctx.fillText(c.text.slice(0, 68), 46, ny + 11);
      });
    }

    ctx.fillStyle = '#73eff7';
    ctx.textAlign = 'center';
    ctx.fillText('[A / B] RETURN TO FORT GARRY', 240, 302);
  }

  // Pushed 16-bit SNES Sundown Title Screen: Looking West across the Forks of the Red & Assiniboine Rivers from St. Boniface
  function renderTitleScreen() {
    const f = gameState.frame;

    // 1. Sundown Sky Gradient (Deep twilight indigo top -> warm crimson-gold western horizon)
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 178);
    skyGrad.addColorStop(0, '#161b3d');
    skyGrad.addColorStop(0.32, '#3d285c');
    skyGrad.addColorStop(0.62, '#8f394b');
    skyGrad.addColorStop(0.84, '#d96b38');
    skyGrad.addColorStop(1, '#f7b955');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 480, 178);

    // 16-bit Ordered Dither Bands along horizon transition
    ctx.fillStyle = '#8f394b';
    for (let dx = 0; dx < 480; dx += 4) {
      ctx.fillRect(dx, 108 + (dx % 8 === 0 ? 2 : 0), 2, 2);
    }
    ctx.fillStyle = '#f7b955';
    for (let dx = 0; dx < 480; dx += 4) {
      ctx.fillRect(dx, 146 + (dx % 8 === 0 ? -2 : 0), 2, 2);
    }

    // Early evening stars in upper indigo sky
    ctx.fillStyle = '#f4f1de';
    const stars = [
      [34, 18], [88, 12], [142, 28], [210, 14], [295, 22], [358, 12], [426, 24], [456, 36]
    ];
    for (const [sx, sy] of stars) {
      ctx.fillRect(sx, sy, 2, 2);
    }

    // 2. Lowering Western Sun setting behind Upper Fort Garry & the Forks
    const sunX = 186;
    const sunY = 152;
    const sunHalo = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 76);
    sunHalo.addColorStop(0, 'rgba(255, 236, 153, 0.72)');
    sunHalo.addColorStop(0.45, 'rgba(247, 132, 56, 0.32)');
    sunHalo.addColorStop(1, 'rgba(247, 132, 56, 0)');
    ctx.fillStyle = sunHalo;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 76, 0, Math.PI * 2);
    ctx.fill();

    // Crisp pixelated sun disc sliced by thin sunset cloud bands
    ctx.fillStyle = '#fff0a6';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f7b955';
    ctx.fillRect(sunX - 24, sunY + 4, 48, 2);
    ctx.fillRect(sunX - 22, sunY + 11, 44, 2);

    // Distant Red River Prairie Tree Line along Western Horizon
    ctx.fillStyle = '#241e30';
    for (let tx = 0; tx < 480; tx += 12) {
      const th = 10 + ((tx * 17) % 11);
      ctx.fillRect(tx, 174 - th, 13, th + 4);
    }

    // 3. UPPER FORT GARRY SITTING ON THE PENINSULA AT THE FORKS (Midground)
    // Elevated limestone & grassy point between the Assiniboine (left) and Red River (right)
    ctx.fillStyle = '#2f4526';
    ctx.beginPath();
    ctx.moveTo(46, 178);
    ctx.lineTo(366, 178);
    ctx.lineTo(392, 198);
    ctx.lineTo(28, 198);
    ctx.closePath();
    ctx.fill();

    // Sandy/pebbled riverbank lip along the Forks
    ctx.fillStyle = '#7d6344';
    ctx.fillRect(32, 195, 356, 5);

    // Fort Perimeter Limestone Walls & Oak Palisade
    ctx.fillStyle = '#b8b0a0'; // Sun-warmed limestone face
    ctx.fillRect(88, 162, 236, 24);
    ctx.fillStyle = '#7d7567'; // Shaded east face
    ctx.fillRect(286, 162, 38, 24);
    ctx.strokeStyle = '#3b352e';
    ctx.strokeRect(88, 162, 236, 24);

    // Interior Mansard Roofs & Chimneys peeking over the Fort Walls
    // Governor's Victorian Mansion Roof & Dormer
    ctx.fillStyle = '#26384d';
    ctx.fillRect(114, 144, 58, 18);
    ctx.fillStyle = '#eae4d3';
    ctx.fillRect(137, 148, 12, 10);
    ctx.fillStyle = '#ffcd75'; // Warm glowing dormer window
    ctx.fillRect(141, 151, 4, 5);
    ctx.fillStyle = '#7a2e22'; // Brick chimneys
    ctx.fillRect(120, 137, 5, 8);
    ctx.fillRect(161, 137, 5, 8);

    // Clerk's Quarters & Store Pitched Roofs
    ctx.fillStyle = '#6e261c';
    ctx.fillRect(222, 148, 66, 14);
    ctx.fillStyle = '#8f3528';
    ctx.fillRect(224, 150, 62, 4);

    // Central Flagstaff & Waving HBC Red Ensign catching the sunset breeze
    ctx.fillStyle = '#f4f1de';
    ctx.fillRect(204, 118, 3, 46);
    const flagWave = Math.round(Math.sin(f * 0.12) * 1.5);
    ctx.fillStyle = '#c81d25';
    ctx.fillRect(207, 120, 22, 12);
    ctx.fillRect(225, 121 + flagWave, 6, 10);
    ctx.fillStyle = '#1b4f8c';
    ctx.fillRect(207, 120, 9, 6);
    ctx.fillStyle = '#f4f1de';
    ctx.fillRect(210, 120, 2, 6);
    ctx.fillRect(207, 122, 9, 2);

    // Iconic Crenelated Stone Gatehouse (Center-Front of Fort)
    ctx.fillStyle = '#ded8ca';
    ctx.fillRect(184, 152, 34, 34);
    ctx.strokeStyle = '#4a4339';
    ctx.strokeRect(184, 152, 34, 34);
    // Battlements
    for (let gx = 185; gx <= 211; gx += 8) {
      ctx.fillStyle = '#ded8ca';
      ctx.fillRect(gx, 148, 5, 4);
    }
    // Dark stone archway opening
    ctx.fillStyle = '#1c1815';
    ctx.fillRect(195, 168, 12, 18);

    // Circular Limestone Corner Bastions (Left, Center-West, Right)
    for (const bx of [82, 282, 322]) {
      ctx.fillStyle = '#cfc9bc';
      ctx.fillRect(bx - 8, 156, 16, 32);
      ctx.fillStyle = '#8f8778';
      ctx.fillRect(bx + 2, 156, 6, 32);
      // Conical bastion roof
      ctx.fillStyle = '#4a4e58';
      ctx.beginPath();
      ctx.moveTo(bx - 10, 156);
      ctx.lineTo(bx, 146);
      ctx.lineTo(bx + 10, 156);
      ctx.closePath();
      ctx.fill();
    }

    // Warm Amber Lantern Glow along the Fort Wall & Gate
    ctx.fillStyle = '#ffcd75';
    ctx.fillRect(191, 171, 2, 3);
    ctx.fillRect(209, 171, 2, 3);
    ctx.fillRect(132, 170, 4, 4);
    ctx.fillRect(254, 170, 4, 4);

    // Drawn-ashore York Boats & Birchbark Canoe on the Fort Landing
    ctx.fillStyle = '#4a2b14';
    ctx.fillRect(118, 192, 38, 6);
    ctx.fillRect(166, 193, 34, 5);
    ctx.fillStyle = '#c9a463';
    ctx.fillRect(246, 194, 24, 4);

    // 4. THE FORKS OF THE ASSINIBOINE & RED RIVERS (Broad Sundown Water)
    const waterGrad = ctx.createLinearGradient(0, 198, 0, 310);
    waterGrad.addColorStop(0, '#2a3b63');
    waterGrad.addColorStop(0.45, '#1d3257');
    waterGrad.addColorStop(1, '#12203b');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, 198, 480, 114);

    // Shimmering Sunset Reflection Path on the Water below the Western Sun
    for (let wy = 202; wy < 306; wy += 5) {
      const spread = 18 + (wy - 200) * 0.42;
      const shimmer = Math.sin(f * 0.08 + wy * 0.3) * 8;
      ctx.fillStyle = wy < 236 ? 'rgba(247, 185, 85, 0.55)' : 'rgba(217, 107, 56, 0.35)';
      ctx.fillRect(Math.round(sunX - spread / 2 + shimmer), wy, Math.round(spread), 2);
    }

    // Animated 16-bit River Current Ripples across the Forks
    ctx.fillStyle = '#4b6fa3';
    const flow = (f * 0.5) % 48;
    for (let ry = 208; ry < 302; ry += 16) {
      for (let rx = 18; rx < 450; rx += 64) {
        ctx.fillRect(Math.round((rx + flow) % 465), ry, 14, 1);
      }
    }

    // Silhouette of a North Canoe crossing the Red River from St. Boniface
    const canoeX = 338 + Math.round(Math.sin(f * 0.03) * 10);
    const canoeY = 234;
    ctx.fillStyle = '#181c2e';
    ctx.beginPath();
    ctx.moveTo(canoeX - 24, canoeY);
    ctx.lineTo(canoeX - 18, canoeY - 4);
    ctx.lineTo(canoeX + 18, canoeY - 4);
    ctx.lineTo(canoeX + 24, canoeY);
    ctx.lineTo(canoeX + 16, canoeY + 5);
    ctx.lineTo(canoeX - 16, canoeY + 5);
    ctx.closePath();
    ctx.fill();
    // Paddlers silhouette
    ctx.fillRect(canoeX - 10, canoeY - 10, 4, 6);
    ctx.fillRect(canoeX + 6, canoeY - 10, 4, 6);

    // 5. ST. BONIFACE FOREGROUND RIVERBANK (Standing across the Red River looking West)
    ctx.fillStyle = '#1b2b18';
    ctx.beginPath();
    ctx.moveTo(0, 294);
    ctx.quadraticCurveTo(180, 286, 480, 300);
    ctx.lineTo(480, 336);
    ctx.lineTo(0, 336);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#283d22';
    ctx.fillRect(0, 304, 480, 32);

    // Foreground cattails, reeds & prairie grass silhouettes on St. Boniface shore
    ctx.fillStyle = '#121c10';
    for (let gx = 6; gx < 476; gx += 14) {
      const gh = 10 + ((gx * 13) % 14);
      ctx.fillRect(gx, 306 - gh, 2, gh);
      ctx.fillRect(gx + 4, 308 - gh * 0.7, 2, gh * 0.7);
      if (gx % 42 === 0) {
        // Cattail seed head
        ctx.fillStyle = '#3b2414';
        ctx.fillRect(gx - 1, 302 - gh, 4, 6);
        ctx.fillStyle = '#121c10';
      }
    }

    // 6. PUSHED SNES PIXEL-STYLIZED WORDMARK
    ctx.textAlign = 'center';

    // Decorative gold & crimson pixel banner frame behind wordmark
    ctx.fillStyle = 'rgba(15, 19, 36, 0.74)';
    ctx.fillRect(62, 34, 356, 54);
    ctx.strokeStyle = '#f7c844';
    ctx.lineWidth = 2;
    ctx.strokeRect(62, 34, 356, 54);
    ctx.strokeStyle = '#8a3324';
    ctx.lineWidth = 1;
    ctx.strokeRect(66, 38, 348, 46);

    // Multi-layered extruded 16-bit pixel block title
    ctx.font = 'bold 28px Courier New';
    ctx.fillStyle = '#0b0d14';
    ctx.fillText('LA LOCHE BRIGADE', 243, 66);
    ctx.fillStyle = '#8a3324';
    ctx.fillText('LA LOCHE BRIGADE', 241, 64);
    ctx.fillStyle = '#f7c844';
    ctx.fillText('LA LOCHE BRIGADE', 240, 62);

    // Subtle cream highlight pass on top edge of letters
    ctx.fillStyle = '#fff3c4';
    ctx.fillText('LA LOCHE BRIGADE', 240, 61);

    // Historical subtitle inside plaque
    ctx.font = 'bold 9px Courier New';
    ctx.fillStyle = '#73eff7';
    ctx.fillText('UPPER FORT GARRY  •  JUNE 1855', 240, 78);

    // 7. CLEAN BLINKING "PRESS 'A' TO START" PROMPT
    if (Math.floor(f / 22) % 2 === 0) {
      ctx.fillStyle = 'rgba(11, 13, 20, 0.85)';
      ctx.fillRect(136, 302, 208, 22);
      ctx.strokeStyle = '#f7c844';
      ctx.strokeRect(136, 302, 208, 22);

      ctx.font = 'bold 12px Courier New';
      ctx.fillStyle = '#0b0d14';
      ctx.fillText("PRESS 'A' TO START", 241, 317);
      ctx.fillStyle = '#f7c844';
      ctx.fillText("PRESS 'A' TO START", 240, 316);
    }
  }

  function renderOutcomeScreen() {
    const out = gameState.outcome;
    ctx.fillStyle = 'rgba(11, 13, 20, 0.96)';
    ctx.fillRect(0, 0, 480, 336);

    ctx.strokeStyle = out.won ? '#a3e635' : '#ff7b72';
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, 432, 288);
    ctx.lineWidth = 1;

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Courier New';
    ctx.fillStyle = out.won ? '#a3e635' : '#ff7b72';
    ctx.fillText(out.won ? 'BRIGADE SHOVES OFF!' : 'BRIGADE COMPROMISED', 240, 68);

    ctx.font = 'bold 11px Courier New';
    ctx.fillStyle = '#f7c844';
    ctx.fillText(`THE FOX: ${out.fox.name} (${out.fox.secret.codename})`, 240, 98);

    ctx.fillStyle = '#f4f1de';
    ctx.font = 'bold 10px Courier New';
    const words = out.reason.split(' ');
    let line = '';
    let y = 132;
    for (const w of words) {
      if ((line + w).length > 52) {
        ctx.fillText(line.trim(), 240, y);
        line = w + ' ';
        y += 16;
      } else {
        line += w + ' ';
      }
    }
    if (line.trim()) ctx.fillText(line.trim(), 240, y);

    ctx.fillStyle = '#73eff7';
    ctx.fillText(
      `FINAL CREW: ${out.stats.count}/12   MORALE: ${gameState.morale}%`,
      240, 224
    );

    if (Math.floor(gameState.frame / 24) % 2 === 0) {
      ctx.fillStyle = '#f7c844';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText("PRESS 'A' FOR NEW CASE", 240, 280);
    }
  }

  function renderPauseBanner() {
    ctx.fillStyle = 'rgba(11, 13, 20, 0.72)';
    ctx.fillRect(0, 0, 480, 336);
    ctx.fillStyle = '#f7c844';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', 240, 172);
  }

  // =========================================================================
  // 9. MAIN LOOP
  // =========================================================================
  function loop() {
    updateSimulation();

    if (gameState.screen === 'TITLE') {
      renderTitleScreen();
    } else if (gameState.screen === 'OUTCOME') {
      renderOutcomeScreen();
    } else {
      renderPlayfield();
      renderHud();

      if (gameState.screen === 'DIALOG') renderDialog();
      else if (gameState.screen === 'ROSTER_UI') renderRosterOverlay();
      else if (gameState.screen === 'NOTEBOOK_UI') renderNotebookOverlay();
      else if (gameState.screen === 'DOCKET_UI') renderDocketOverlay();
    }

    if (isPaused) renderPauseBanner();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
