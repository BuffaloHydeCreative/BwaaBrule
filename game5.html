  function initChiptuneAudio() {
    if (!chiptuneAudioCtx) {
      chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (chiptuneAudioCtx.state === 'suspended') {
      chiptuneAudioCtx.resume();
    }
  }

  function playChiptuneTone(freq, type, duration, volume) {
    if (!freq || !chiptuneAudioCtx) return;

    const osc = chiptuneAudioCtx.createOscillator();
    const gainNode = chiptuneAudioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, chiptuneAudioCtx.currentTime);

    gainNode.gain.setValueAtTime(volume, chiptuneAudioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, chiptuneAudioCtx.currentTime + duration - 0.015);

    osc.connect(gainNode);
    gainNode.connect(chiptuneAudioCtx.destination);

    osc.start();
    osc.stop(chiptuneAudioCtx.currentTime + duration);
  }

  function stepChiptuneTrack() {
    const leadNote = trainFiddleLead[currentChiptuneStep];
    const bassNote = runawayTrainBass[currentChiptuneStep];

    if (leadNote && CHIPTUNE_NOTES[leadNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[leadNote], 'square', CHIPTUNE_NOTE_LEN * 0.85, 0.06);
    }
    
    if (bassNote && CHIPTUNE_NOTES[bassNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[bassNote], 'triangle', CHIPTUNE_NOTE_LEN * 1.8, 0.35);
    }

    currentChiptuneStep = (currentChiptuneStep + 1) % 32;
  }

  function startChiptuneTrack() {
    initChiptuneAudio();
    if (!chiptuneIsPlaying) {
      chiptuneIsPlaying = true;
      currentChiptuneStep = 0;
      chiptuneInterval = setInterval(stepChiptuneTrack, CHIPTUNE_NOTE_LEN * 1000);
    }
  }

  function stopChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
      currentChiptuneStep = 0;
    }
  }

  function pauseChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
    }
  }

  function resumeChiptuneTrack() {
    if (!chiptuneIsPlaying && (state === 'PLAYING' || state === 'FRAME_SLIDE' || state === 'LEVEL_END_CUTSCENE' || state === 'VICTORY_CUTSCENE')) {

      chiptuneInterval = setInterval(stepChiptuneTrack, CHIPTUNE_NOTE_LEN * 1000);

  const drawSprite = (x, y, matrix, palette, scale = 2, flipX = false) => {
    const rows = matrix.length;
    const cols = matrix[0].length;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let v = matrix[r][c];
        if (v > 0 && palette[v]) {
          ctx.fillStyle = palette[v];
          let drawX = flipX ? (x + (cols - 1 - c) * scale) : (x + c * scale);
          ctx.fillRect(Math.floor(drawX), Math.floor(y + r * scale), scale, scale);
        }
      }
    }
  };

  function drawStylizedTitle(text, centerX, startY, scale) {
    const spacing = 1;
    const totalCols = text.length * (5 + spacing) - spacing;
    let curX = Math.floor(centerX - (totalCols * scale) / 2);

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const glyph = FONT_5X7[ch] || FONT_5X7[' '];
      
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (glyph[r][c] === '1') {
            const px = curX + c * scale;
            const py = startY + r * scale;
            
            ctx.fillStyle = '#1c0507';
            ctx.fillRect(px + scale, py + scale, scale, scale);
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(px - 1, py, scale + 2, scale);
            ctx.fillRect(px, py - 1, scale, scale + 2);

            if (r < 2) ctx.fillStyle = '#F7C844';
            else if (r < 5) ctx.fillStyle = '#FB6604';
            else ctx.fillStyle = '#AD1C21';
            ctx.fillRect(px, py, scale, scale);
          }
        }
      }
      curX += (5 + spacing) * scale;
    }
  }

  function drawSNESWindow(x, y, w, h, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.fillRect(x + 4, y + 4, w, h);

    ctx.fillStyle = '#182238';
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);

    ctx.fillStyle = '#F7C844';
    ctx.fillRect(x + 3, y + 3, w - 6, 1);
    ctx.fillRect(x + 3, y + h - 4, w - 6, 1);
    ctx.fillRect(x + 3, y + 3, 1, h - 6);
    ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
    ctx.restore();
  }

  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0];
    for (let i = 1; i < words.length; i++) {
      let testLine = currentLine + " " + words[i];
      if (ctx.measureText(testLine).width < maxWidth) {
        currentLine = testLine;
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);
    return lines;
  }

  function generateGroundPatches(minY, maxY) {
    let patches = [];
    for (let i = 0; i < 42; i++) {
      patches.push({
        x: Math.random() * VIEW_W,
        y: minY + Math.random() * (maxY - minY),
        w: 4 + Math.floor(Math.random() * 14),
        h: 3 + Math.floor(Math.random() * 8),
        kind: i % 3
      });
    }
    return patches;
  }

  function addDynamicLane(dynamics, y, aType, dir, speedScale, count = 2, minX = 0, maxX = VIEW_W) {
    let baseSpd = 0.78;
    let w = 24, h = 14, scale = 2;

    if (aType === 'FOX') { baseSpd = 1.12; w = 24; h = 14; }
    else if (aType === 'MOOSE') { baseSpd = 0.62; w = 32; h = 24; }
    else if (aType === 'DEER') { baseSpd = 0.92; w = 28; h = 20; }
    else if (aType === 'PRONGHORN') { baseSpd = 1.05; w = 28; h = 20; }
    else if (aType === 'SNAKE') { baseSpd = 0.76; w = 26; h = 12; }
    else if (aType === 'CART') { baseSpd = 0.72; w = 28; h = 18; }
    else if (aType === 'OX') { baseSpd = 0.58; w = 28; h = 18; }
    else if (aType === 'WOLF') { baseSpd = 1.08; w = 24; h = 14; }
    else if (aType === 'BEAR') { baseSpd = 0.72; w = 28; h = 16; }
    else if (aType === 'BEAVER') { baseSpd = 0.85; w = 24; h = 12; }
    else if (aType === 'TURTLE') { baseSpd = 0.52; w = 24; h = 12; }

    const spanW = Math.max(48, maxX - minX);
    for (let c = 0; c < count; c++) {
      let startX = minX + ((c * (spanW / count)) + Math.random() * 20) % Math.max(10, spanW - w);
      dynamics.push({
        type: aType,
        x: startX,
        y: y,
        w: w,
        h: h,
        vx: dir * baseSpd * speedScale,
        scale: scale,
        minBoundX: minX,
        maxBoundX: maxX
      });
    }
  }

  function createHLogs(riverY, laneConfigs) {
    let logs = [];
    const laneH = 22;
    for (let i = 0; i < laneConfigs.length; i++) {
      let cfg = laneConfigs[i];
      for (let c = 0; c < cfg.count; c++) {
        logs.push({
          x: c * (VIEW_W / cfg.count) + 14,
          y: riverY + i * laneH + 2,
          w: cfg.logW,
          h: laneH - 4,
          vx: cfg.vx
        });
      }
    }
    return logs;
  }

  // Helper to build a horizontal-flowing meandering river band across the X-axis with a single-point wire-line cable ferry
  function addMeanderingHorizontalFerryRiver(waters, riverY, riverH, meanderOffsetY, ferryVx, ferryStartX, name) {
    const ferryW = 54;
    waters.push({
      name: name,
      orientation: 'H',
      x: 0,
      y: riverY,
      w: VIEW_W,
      h: riverH,
      meanderOffsetY: meanderOffsetY, // Visual meander wave along X-axis
      mode: 'FERRY',
      platforms: [
        {
          x: ferryStartX,
          y: riverY + 3,
          w: ferryW,
          h: riverH - 6,
          vx: ferryVx,
          minX: 16,
          maxX: VIEW_W - ferryW - 16
        }
      ]
    });
  }

    const safeBottomH = (fIdx === 0) ? 46 : 14;
    const safeTopH = (fIdx === TOTAL_ZONES - 1) ? 58 : HUD_HEIGHT + 8;
    const playTop = safeTopH;
    const playBottom = VIEW_H - safeBottomH;
    const playHeight = Math.max(90, playBottom - playTop);

    let statics = [];
    let dynamics = [];
    let waters = [];
    let burrows = [];
    let groundPatches = generateGroundPatches(playTop, playBottom);

    // ---------------------------------------------------------
    // LEVEL 1: ROCKY FOOTHILLS
    // - Zone 0: Glacial Snow Red River Cart Camp & Downhill Sloped Steps
    // - Zone 2 (3rd Frame, fIdx === 2): Center Y-axis Rocky Ledge Barricade (zero straight-shot path!)
    // - Wildlife: Moose, Foxes, Deer, Snakes (NO Rivers/Creeks)
    // ---------------------------------------------------------
    if (bType === 'mountain') {
      const numRows = 3;
      const rowH = playHeight / numRows;

      for (let r = 0; r < numRows; r++) {
        let ry = Math.floor(playTop + r * rowH + 6);

        if (fIdx === 2 && r === 1) {
          const barW = 136;
          const barX = Math.floor((VIEW_W - barW) / 2);
          statics.push({
            type: 'LEDGE',
            x: barX,
            y: ry,
            w: barW,
            h: 24,
            fromLeft: false,
            isCenterBarricade: true
          });
          statics.push({ type: 'ROCK', x: 8, y: ry - 14, w: 30, h: 18 });
          statics.push({ type: 'ROCK', x: VIEW_W - 38, y: ry + 26, w: 30, h: 18 });
        } else {
          let fromLeft = (r + fIdx) % 2 === 0;
          let ledgeW = 92 + ((r * 17 + fIdx * 11) % 26);
          let lx = fromLeft ? 0 : (VIEW_W - ledgeW);

          statics.push({
            type: 'LEDGE',
            x: lx,
            y: ry,
            w: ledgeW,
            h: 22,
            fromLeft: fromLeft
          });

          let rockX = fromLeft ? (VIEW_W - 44) : 14;
          statics.push({
            type: 'ROCK',
            x: rockX,
            y: ry + 2,
            w: 30,
            h: 18
          });
        }

        let wy = Math.floor(ry + 25);
        if (wy + 20 < playBottom) {
          let animal = ((r + fIdx) % 3 === 0) ? 'MOOSE' : (((r + fIdx) % 3 === 1) ? 'FOX' : 'DEER');
          let dir = (r % 2 === 0) ? -1 : 1;
          addDynamicLane(dynamics, wy, animal, dir, speedScale, animal === 'MOOSE' ? 1 : 2);
        }
      }
    }

    // ---------------------------------------------------------
    // LEVEL 2: DRY PRAIRIES / UPPER MISSOURI PLAINS
    // - NO Moose! Pronghorn Antelope replaces Deer!
    // - Prairie Dog Dirt Piles: safe when empty, trips horse when Prairie Dog pops up!
    // - Zone 0: Tipi Village Barrier + Upper Missouri River with Shaded Logs
    // ---------------------------------------------------------
    else if (bType === 'missouri') {
      if (fIdx === 0) {
        const tipiY = Math.floor(playTop + playHeight * 0.62);
        statics.push({ type: 'TIPI', x: 18, y: tipiY, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: 64, y: tipiY + 4, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: VIEW_W - 92, y: tipiY + 4, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: VIEW_W - 46, y: tipiY, w: 28, h: 26 });

        const riverY = Math.floor(playTop + playHeight * 0.20);
        const logs = createHLogs(riverY, [
          { vx: 0.95 * speedScale, logW: 64, count: 2 },
          { vx: -1.15 * speedScale, logW: 56, count: 2 }
        ]);
        waters.push({
          name: 'UPPER MISSOURI',
          orientation: 'H',
          x: 0,
          y: riverY,
          w: VIEW_W,
          h: 44,
          meanderOffsetY: 0,
          mode: 'LOGS',
          platforms: logs
        });

        burrows.push({ x: 112, y: tipiY + 8, w: 22, h: 14, timer: 10, cycle: 150 });
        burrows.push({ x: 186, y: tipiY + 8, w: 22, h: 14, timer: 85, cycle: 150 });

        addDynamicLane(dynamics, tipiY + 32, 'FOX', 1, speedScale, 2);
      } else {
        const rows = 3;
        const rStep = playHeight / rows;
        for (let r = 0; r < rows; r++) {
          let ry = Math.floor(playTop + r * rStep + 8);
          let gx1 = 24 + (((r + fIdx) * 74) % (VIEW_W - 120));
          statics.push({ type: 'TALLGRASS', x: gx1, y: ry, w: 30, h: 18 });

          let bx1 = 68 + (((r * 63 + fIdx * 47)) % (VIEW_W - 110));
          burrows.push({
            x: bx1,
            y: ry + 4,
            w: 22,
            h: 14,
            timer: (r * 45 + fIdx * 30) % 140,
            cycle: 145
          });

          let aType = ((r + fIdx) % 3 === 0) ? 'PRONGHORN' : (((r + fIdx) % 3 === 1) ? 'FOX' : 'SNAKE');
          addDynamicLane(dynamics, ry + 22, aType, ((r + fIdx) % 2 === 0 ? 1 : -1), speedScale, 2);
        }
      }
    }

    // ---------------------------------------------------------
    // LEVEL 3: RED RIVER SETTLEMENT
    // - Horizontal-flowing meandering Red River!
    // - Crosses in Frame 1 (fIdx === 0) via single-point Wire-Line Cable Ferry!
    // - Frame 2 (fIdx === 1): Settlement Roadway & Log Houses (no river crossing)
    // - Crosses again in Frame 3 (fIdx === 2) via single-point Wire-Line Cable Ferry (opposite meander bend)!
    // - Peeks in (does NOT need to be crossed) along the top/upper-right bend in Frame 4 (fIdx === 3)!
    // - NPC Red River Carts (cannot cross rivers!), Oxen (replace Deer), Wolves (replace Foxes), Log Houses blocking
    // ---------------------------------------------------------
    else if (bType === 'settlement') {
      if (fIdx === 0) {
        // Frame 1 (Zone 0): Horizontal-flowing meandering Red River (bows northward) + Single-Point Wire-Line Ferry
        const riverY = Math.floor(playTop + playHeight * 0.24);
        const riverH = 38;
        addMeanderingHorizontalFerryRiver(waters, riverY, riverH, -8, 1.05 * speedScale, 60, 'RED RIVER FERRY');

        // Village Log Houses blocking on near and far banks
        statics.push({ type: 'LOGHOUSE', x: 18, y: riverY + riverH + 14, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 54, y: riverY + riverH + 14, w: 32, h: 26 });

        // NPC Red River Cart patrolling south bank (cannot enter river)
        addDynamicLane(dynamics, riverY + riverH + 44, 'CART', 1, speedScale, 1);
        addDynamicLane(dynamics, riverY - 22, 'WOLF', -1, speedScale, 1);
      } else if (fIdx === 1) {
        // Frame 2 (Zone 1): Settlement Parish Lands between river bends — Log Houses, Carts, Oxen & Wolves
        const row1Y = Math.floor(playTop + playHeight * 0.22);
        const row2Y = Math.floor(playTop + playHeight * 0.62);

        statics.push({ type: 'LOGHOUSE', x: 24, y: row1Y, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: Math.floor(VIEW_W / 2) - 16, y: row1Y + 6, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 58, y: row1Y, w: 32, h: 26 });

        statics.push({ type: 'LOGHOUSE', x: 64, y: row2Y, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 98, y: row2Y, w: 32, h: 26 });

        addDynamicLane(dynamics, row1Y + 34, 'CART', -1, speedScale, 1);
        addDynamicLane(dynamics, row2Y + 30, 'OX', 1, speedScale, 2);
        addDynamicLane(dynamics, playTop + 4, 'WOLF', 1, speedScale, 1);
      } else if (fIdx === 2) {
        // Frame 3 (Zone 2): Second Horizontal-Flowing Meandering Red River Crossing (bows southward) + Wire-Line Ferry
        const riverY = Math.floor(playTop + playHeight * 0.36);
        const riverH = 38;
        addMeanderingHorizontalFerryRiver(waters, riverY, riverH, 8, -1.15 * speedScale, VIEW_W - 110, 'RED RIVER FERRY');

        statics.push({ type: 'LOGHOUSE', x: 28, y: riverY + riverH + 14, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 64, y: riverY + riverH + 14, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: Math.floor(VIEW_W / 2) - 16, y: riverY - 32, w: 32, h: 26 });

        addDynamicLane(dynamics, riverY + riverH + 44, 'OX', -1, speedScale, 1);
        addDynamicLane(dynamics, riverY - 22, 'CART', 1, speedScale, 1);
      } else {
        // Frame 4 (Zone 3): River peeks in as a scenic shoreline bend along the East/Upper-East edge (NO crossing needed!)
        waters.push({
          name: 'RED RIVER BEND',
          orientation: 'PEEK',
          x: VIEW_W - 56,
          y: HUD_HEIGHT + 58,
          w: 56,
          h: VIEW_H - (HUD_HEIGHT + 58),
          meanderOffsetY: 0,
          mode: 'NONE',
          platforms: []
        });

        // Settlement Log Houses & Carts on the wide West meadow leading up to the Horizon Herd
        statics.push({ type: 'LOGHOUSE', x: 22, y: playTop + 22, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: 118, y: playTop + 56, w: 32, h: 26 });

        addDynamicLane(dynamics, playTop + 34, 'WOLF', 1, speedScale, 1, 4, VIEW_W - 64);
        addDynamicLane(dynamics, playTop + 84, 'CART', -1, speedScale, 1, 4, VIEW_W - 64);
      }
    }

    // ---------------------------------------------------------
    // LEVEL 4: EASTERN WOODLANDS
    // - Moose return! Black Bear replaces Deer; Turtles replace Snakes; Beavers replace Foxes!
    // - Horizontal-flowing meandering Woodland Creek crossed on Shaded Logs
    // - Zone 0: Flat edge woodlands (light border trees) -> Zone 3: Full slalom through Pines & Birches!
    // ---------------------------------------------------------
    else if (bType === 'forest') {
      if (fIdx === 0) {
        // Frame 1 (Zone 0): Flat edge woodlands — trees only along the outer edges, open meadow in middle
        statics.push({ type: 'PINE', x: 6, y: playTop + 10, w: 30, h: 30 });
        statics.push({ type: 'BIRCH', x: 6, y: playTop + 56, w: 30, h: 30 });
        statics.push({ type: 'BIRCH', x: VIEW_W - 36, y: playTop + 14, w: 30, h: 30 });
        statics.push({ type: 'PINE', x: VIEW_W - 36, y: playTop + 60, w: 30, h: 30 });

        addDynamicLane(dynamics, playTop + 26, 'BEAVER', 1, speedScale, 2);
        addDynamicLane(dynamics, playTop + 68, 'TURTLE', -1, speedScale, 2);
      } else if (fIdx === 1) {
        // Frame 2 (Zone 1): Horizontal Woodland Creek with Shaded Logs + Early Pine & Birch Slalom
        const creekY = Math.floor(playTop + playHeight * 0.34);
        const logs = createHLogs(creekY, [
          { vx: 0.90 * speedScale, logW: 62, count: 2 },
          { vx: -1.10 * speedScale, logW: 56, count: 2 }
        ]);
        waters.push({
          name: 'WOODLAND CREEK',
          orientation: 'H',
          x: 0,
          y: creekY,
          w: VIEW_W,
          h: 44,
          meanderOffsetY: -6,
          mode: 'LOGS',
          platforms: logs
        });

        statics.push({ type: 'PINE', x: 24, y: creekY + 52, w: 30, h: 30 });
        statics.push({ type: 'BIRCH', x: VIEW_W - 58, y: creekY + 52, w: 30, h: 30 });
        addDynamicLane(dynamics, creekY - 24, 'BEAR', 1, speedScale, 1);
      } else if (fIdx === 2) {
        // Frame 3 (Zone 2): Thickening Pine & Birch Slalom + Moose, Bear & Beaver
        const slalomRows = 3;
        const rowStep = playHeight / slalomRows;
        for (let r = 0; r < slalomRows; r++) {
          let sy = Math.floor(playTop + r * rowStep + 4);
          let gapCenter = (r === 0) ? 78 : (r === 1 ? VIEW_W - 82 : Math.floor(VIEW_W / 2));
          let gapHalf = 38;
          for (let tx = 8; tx < VIEW_W - 32; tx += 36) {
            if (Math.abs((tx + 15) - gapCenter) > gapHalf) {
              statics.push({ type: ((r + tx) % 2 === 0 ? 'PINE' : 'BIRCH'), x: tx, y: sy, w: 30, h: 30 });
            }
          }
          let wy = sy + 30;
          if (wy + 18 < playBottom) {
            const woodAnimals = ['MOOSE', 'BEAR', 'BEAVER'];
            addDynamicLane(dynamics, wy, woodAnimals[r % woodAnimals.length], (r % 2 === 0 ? 1 : -1), speedScale, 1);
          }
        }
      } else {
        // Frame 4 (Zone 3): Full Slalom through Pines & Birch Trees leading to the Buffalo Herd trapped by Canadian Shield Rocks & Lakes!
        const slalomRows = 3;
        const rowStep = playHeight / slalomRows;
        for (let r = 0; r < slalomRows; r++) {
          let sy = Math.floor(playTop + r * rowStep + 2);
          let gapCenter = (r === 0) ? VIEW_W - 76 : (r === 1 ? 82 : Math.floor(VIEW_W / 2));
          let gapHalf = 34;
          for (let tx = 6; tx < VIEW_W - 30; tx += 34) {
            if (Math.abs((tx + 15) - gapCenter) > gapHalf) {
              statics.push({ type: ((r + tx) % 2 === 0 ? 'BIRCH' : 'PINE'), x: tx, y: sy, w: 30, h: 30 });
            }
          }
          let wy = sy + 28;
          if (wy + 18 < playBottom) {
            const woodAnimals = ['MOOSE', 'BEAR', 'TURTLE'];
            addDynamicLane(dynamics, wy, woodAnimals[r % woodAnimals.length], (r % 2 === 0 ? -1 : 1), speedScale, 1);
          }
        }
      }
    }

    // Top Horizon Buffalo Herd on Final Zone (Frame 3)
    let herd = [];
    if (fIdx === TOTAL_ZONES - 1) {
      if (bType === 'forest') {
        for (let h = 0; h < 5; h++) {
          herd.push({
            x: 84 + h * 32,
            y: HUD_HEIGHT + 16 + (h % 2) * 5,
            phase: h * 11
          });
        }
      } else {
        for (let h = 0; h < 6; h++) {
          herd.push({
            x: 24 + h * 46 + (h % 2) * 8,
            y: HUD_HEIGHT + 12 + (h % 2) * 6,
            phase: h * 11
          });
        }
      }
    }

    return { statics, dynamics, waters, burrows, groundPatches, herd };
  }

  function initLevel() {
    subFrame = 0;
    slideProgress = 0;
    for (let i = 0; i < TOTAL_ZONES; i++) {
      levelFrames[i] = buildFrameData(i);
    }
    let startX = Math.floor(VIEW_W / 2) - 16;
    player = { x: startX, y: VIEW_H - 42, dead: false, w: 32, h: 36, dir: 'UP', moveTimer: 0 };
    state = 'PLAYING';
  }

  function respawnCurrentZone() {
    subFrame = 0;
    slideProgress = 0;
    let startX = Math.floor(VIEW_W / 2) - 16;
    player = { x: startX, y: VIEW_H - 42, dead: false, w: 32, h: 36, dir: 'UP', moveTimer: 0 };
    state = 'PLAYING';
    resumeChiptuneTrack();
  }

  // ==========================================
  // PAUL KANE HOMAGE: REAL HORSE FALLING PHYSICS
  // ==========================================
  function handlePlayerCrash(impactVx = 0) {
    lives--;
    pauseChiptuneTrack();

    // Launch real horse-falling physics simulation (rider flung forward/underneath, horse stumbling & sliding)
    const dirSign = (player.dir === 'LEFT') ? -1 : (player.dir === 'RIGHT' ? 1 : (impactVx >= 0 ? 1 : -1));
    const groundY = Math.min(VIEW_H - 22, player.y + 22);

    fallSim = {
      timer: 0,
      settledFrames: 0,
      horse: {
        x: player.x,
        y: player.y + 4,
        vx: dirSign * 1.15,
        vy: -1.6,
        groundY: groundY,
        angle: 0,
        vAngle: dirSign * 0.065,
        settled: false,
        flipX: (player.dir === 'LEFT')
      },
      rider: {
        x: player.x + 8,
        y: player.y + 2,
        vx: dirSign * 2.35,
        vy: -2.9,
        groundY: groundY + 6, // Rider flung off and tumbling slightly ahead/under the horse's path
        angle: 0,
        vAngle: dirSign * 0.14,
        settled: false,
        bounces: 0
      },
      dust: []
    };

    // Initial impact dust burst
    for (let d = 0; d < 10; d++) {
      fallSim.dust.push({
        x: player.x + 16 + (Math.random() - 0.5) * 14,
        y: groundY + 6,
        vx: (Math.random() - 0.5) * 1.8,
        vy: -0.4 - Math.random() * 1.1,
        life: 28 + Math.floor(Math.random() * 18)
      });
    }

    textBoxAlpha = 0;
    state = 'FALLING_PHYSICS';
  }

  function updateFallPhysics() {
    fallSim.timer++;
    const gravity = 0.22;

    // 1. Update Stumbling/Falling Horse Physics
    let h = fallSim.horse;
    if (!h.settled) {
      h.x += h.vx;
      h.y += h.vy;
      h.vy += gravity;
      h.angle += h.vAngle;

      // Cap horse rotation at horizontal collapse (~90 degrees)
      if (Math.abs(h.angle) >= Math.PI * 0.48) {
        h.angle = Math.sign(h.angle) * Math.PI * 0.48;
        h.vAngle = 0;
      }

      if (h.y >= h.groundY) {
        h.y = h.groundY;
        h.vy = 0;
        h.vx *= 0.72; // Ground friction slide
        h.angle = (h.angle >= 0 ? 1 : -1) * Math.PI * 0.48;
        h.vAngle = 0;

        // Kick up sliding dirt particles
        if (Math.abs(h.vx) > 0.25) {
          fallSim.dust.push({
            x: h.x + 14,
            y: h.groundY + 8,
            vx: -h.vx * 0.5 + (Math.random() - 0.5) * 0.6,
            vy: -0.3 - Math.random() * 0.6,
            life: 20
          });
        } else {
          h.vx = 0;
          h.settled = true;
        }
      }
    }

    // 2. Update Flung Rider Rag-Doll Physics (thrown clear/underneath with realistic bounce & friction)
    let r = fallSim.rider;
    if (!r.settled) {
      r.x += r.vx;
      r.y += r.vy;
      r.vy += gravity;
      r.angle += r.vAngle;

      if (r.y >= r.groundY) {
        r.y = r.groundY;
        if (r.bounces < 1 && Math.abs(r.vy) > 1.2) {
          // Subtle heavy thud rebound
          r.vy = -r.vy * 0.32;
          r.vx *= 0.65;
          r.vAngle *= 0.5;
          r.bounces++;
          for (let d = 0; d < 5; d++) {
            fallSim.dust.push({
              x: r.x + 8,
              y: r.groundY + 4,
              vx: (Math.random() - 0.5) * 1.4,
              vy: -0.3 - Math.random() * 0.7,
              life: 22
            });
          }
        } else {
          r.vy = 0;
          r.vx *= 0.70;
          r.vAngle = 0;
          if (Math.abs(r.vx) < 0.12) {
            r.vx = 0;
            r.settled = true;
          }
        }
      }
    }

    // 3. Update Dust Particles
    for (let i = fallSim.dust.length - 1; i >= 0; i--) {
      let pt = fallSim.dust[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life--;
      if (pt.life <= 0) fallSim.dust.splice(i, 1);
    }

    // Once both horse and rider have finished their tragic fall animation, hold briefly then fade in the next-rider text box
    if (h.settled && r.settled) {
      fallSim.settledFrames++;
      if (fallSim.settledFrames >= 24) {
        if (lives <= 0) {
          state = 'GAMEOVER';
          textBoxAlpha = 0;
        } else {
          state = 'LIFE_LOST';
          lifeLostTimer = 105;
          textBoxAlpha = 0;
        }
      }
    }
  }

  // ==========================================
  // 4-DIRECTIONAL MOVEMENT & STATIC BLOCKING
  // ==========================================
  function move(dx, dy) {
    if (state !== 'PLAYING') return;

    if (dy < 0) player.dir = 'UP';
    else if (dy > 0) player.dir = 'DOWN';
    else if (dx < 0) player.dir = 'LEFT';
    else if (dx > 0) player.dir = 'RIGHT';
    player.moveTimer = 14;

    const stepX = 18;
    const stepY = 18;
    let nx = player.x + dx * stepX;
    let ny = player.y + dy * stepY;

    nx = Math.max(4, Math.min(VIEW_W - player.w - 4, nx));
    if (ny > VIEW_H - player.h - 2) ny = VIEW_H - player.h - 2;

    const activeData = levelFrames[subFrame];
    const pLeft = nx + 6;
    const pRight = nx + player.w - 6;
    const pTop = ny + 8;
    const pBottom = ny + player.h - 4;

    for (let st of activeData.statics) {
      if (pLeft < st.x + st.w - 2 &&
          pRight > st.x + 2 &&
          pTop < st.y + st.h - 2 &&
          pBottom > st.y + 2) {
        return; // Blocked by solid static obstacle
      }
    }

    player.x = nx;
    player.y = ny;

    if (subFrame < TOTAL_ZONES - 1 && player.y <= HUD_HEIGHT + 6) {
      state = 'FRAME_SLIDE';
      slideProgress = 0;
    } else if (subFrame === TOTAL_ZONES - 1 && player.y <= HUD_HEIGHT + 44) {
      const bType = BIOMES[(level - 1) % BIOMES.length].type;
      if (bType === 'forest') {
        state = 'VICTORY_CUTSCENE';
        cutsceneTimer = 0;
      } else {
        state = 'LEVEL_END_CUTSCENE';
        cutsceneTimer = 0;
      }
    }
  }

  // ==========================================
  // MAIN UPDATE LOOP
  // ==========================================
  function update() {
    frame++;

    if (state === 'TITLE') {
      return;
    }

    if (state === 'GAMEOVER') {
      if (textBoxAlpha < 1) textBoxAlpha = Math.min(1, textBoxAlpha + 0.05);
      return;
    }

    if (state === 'FALLING_PHYSICS') {
      updateFallPhysics();
      return;
    }

    if (state === 'LIFE_LOST') {
      if (textBoxAlpha < 1) textBoxAlpha = Math.min(1, textBoxAlpha + 0.05);
      lifeLostTimer--;
      if (lifeLostTimer <= 0) {
        respawnCurrentZone();
      }
      return;
    }

    if (state === 'INTRO_CUTSCENE' || state === 'LEVEL_END_CUTSCENE' || state === 'VICTORY_CUTSCENE') {
      cutsceneTimer++;
      return;
    }

    if (state === 'FRAME_SLIDE') {
      const slideSteps = 30;
      slideProgress++;
      const totalShift = VIEW_H - HUD_HEIGHT - 44;
      player.y = (HUD_HEIGHT + 6) + (slideProgress / slideSteps) * totalShift;
      player.moveTimer = 4;

      if (slideProgress >= slideSteps) {
        subFrame++;
        player.y = VIEW_H - player.h - 6;
        state = 'PLAYING';
      }
      return;
    }

    if (state === 'PLAYING') {
      if (player.moveTimer > 0) {
        player.moveTimer--;
      }

      const activeData = levelFrames[subFrame];
      let pCenterX = player.x + player.w / 2;
      let pFootY = player.y + player.h - 8;

      // 1. Update River Platforms (Logs & Single-Point Wire-Line Cable Ferries) & Check Water Support
      let inAnyWater = false;
      let supportedByPlatform = null;

      for (let wZone of activeData.waters) {
        if (wZone.mode === 'LOGS') {
          for (let log of wZone.platforms) {
            if (log.vx) {
              log.x += log.vx;
              if (log.vx > 0 && log.x > VIEW_W + 8) log.x = -log.w - 4;
              if (log.vx < 0 && log.x < -log.w - 8) log.x = VIEW_W + 4;
            }
          }
        } else if (wZone.mode === 'FERRY') {
          // Single-point wire-line cable ferry shuttles smoothly back and forth across the river channel
          for (let ferry of wZone.platforms) {
            ferry.x += ferry.vx;
            if (ferry.vx > 0 && ferry.x >= ferry.maxX) {
              ferry.x = ferry.maxX;
              ferry.vx *= -1;
            } else if (ferry.vx < 0 && ferry.x <= ferry.minX) {
              ferry.x = ferry.minX;
              ferry.vx *= -1;
            }
          }
        }

        // Compute effective Y band (including visual meander curve)
        let meanderShift = 0;
        if (wZone.meanderOffsetY) {
          meanderShift = Math.sin((pCenterX / VIEW_W) * Math.PI) * wZone.meanderOffsetY;
        }
        const effTop = wZone.y + meanderShift;
        const effBot = wZone.y + wZone.h + meanderShift;

        if (pCenterX >= wZone.x && pCenterX <= wZone.x + wZone.w &&
            pFootY >= effTop && pFootY <= effBot) {
          inAnyWater = true;
          for (let plat of wZone.platforms) {
            if (pCenterX >= plat.x - 4 && pCenterX <= plat.x + plat.w + 4 &&
                pFootY >= plat.y + meanderShift - 6 && pFootY <= plat.y + plat.h + meanderShift + 6) {
              supportedByPlatform = plat;
              break;
            }
          }
        }
      }

      if (inAnyWater) {
        if (!supportedByPlatform) {
          handlePlayerCrash(0);
          return;
        } else {
          if (supportedByPlatform.vx) player.x += supportedByPlatform.vx;
          player.x = Math.max(2, Math.min(VIEW_W - player.w - 2, player.x));
        }
      }

      // 2. Update Prairie Dog Dirt Burrows (Safe when empty, trips horse if Prairie Dog pops up!)
      const pLeft = player.x + 7;
      const pRight = player.x + player.w - 7;
      const pTop = player.y + 8;
      const pBottom = player.y + player.h - 5;

      for (let bur of activeData.burrows) {
        bur.timer = (bur.timer + 1) % bur.cycle;
        let isEmerged = (bur.timer >= bur.cycle - 42);
        if (isEmerged) {
          if (pLeft < bur.x + bur.w - 2 &&
              pRight > bur.x + 2 &&
              pTop < bur.y + bur.h - 2 &&
              pBottom > bur.y + 2) {
            handlePlayerCrash(0);
            return;
          }
        }
      }

      // 3. Update Dynamic Collision Wildlife & NPC Red River Carts
      for (let dyn of activeData.dynamics) {
        dyn.x += dyn.vx;
        if (dyn.vx > 0 && dyn.x + dyn.w > dyn.maxBoundX) {
          if (dyn.maxBoundX < VIEW_W) {
            dyn.vx *= -1;
            dyn.x = dyn.maxBoundX - dyn.w;
          } else if (dyn.x > VIEW_W + 10) {
            dyn.x = -dyn.w - 6;
          }
        }
        if (dyn.vx < 0 && dyn.x < dyn.minBoundX) {
          if (dyn.minBoundX > 0) {
            dyn.vx *= -1;
            dyn.x = dyn.minBoundX;
          } else if (dyn.x < -dyn.w - 10) {
            dyn.x = VIEW_W + 6;
          }
        }

        // NPCs & Red River Carts respect solid static barriers and CANNOT cross rivers (even on ferries/logs)
        for (let st of activeData.statics) {
          if (dyn.x < st.x + st.w && dyn.x + dyn.w > st.x &&
              dyn.y < st.y + st.h && dyn.y + dyn.h > st.y) {
            dyn.vx *= -1;
            dyn.x += dyn.vx * 2;
          }
        }

        for (let wZone of activeData.waters) {
          if (dyn.x < wZone.x + wZone.w && dyn.x + dyn.w > wZone.x &&
              dyn.y < wZone.y + wZone.h && dyn.y + dyn.h > wZone.y) {
            dyn.vx *= -1;
            dyn.x += dyn.vx * 3;
          }
        }

        if (pLeft < dyn.x + dyn.w - 3 &&
            pRight > dyn.x + 3 &&
            pTop < dyn.y + dyn.h - 2 &&
            pBottom > dyn.y + 2) {
          handlePlayerCrash(dyn.vx);
          return;
        }
      }
    }
  }

  function drawBiomeHorizonCutscene(biome, scrollOffset, isEndingChase) {
    const horizonY = Math.floor(VIEW_H * 0.56);

    const bandH = Math.ceil(horizonY / biome.skyBands.length);
    for (let i = 0; i < biome.skyBands.length; i++) {
      ctx.fillStyle = biome.skyBands[i];
      ctx.fillRect(0, i * bandH, VIEW_W, bandH + 1);
    }

    const sunY = isEndingChase 
      ? Math.min(horizonY - 6, Math.floor(horizonY * 0.42) + Math.floor(cutsceneTimer * 0.08))
      : Math.floor(horizonY * 0.36);
    const sunX = Math.floor(VIEW_W * 0.72);
    ctx.fillStyle = '#fff5b8';
    ctx.fillRect(sunX, sunY, 22, 22);
    ctx.fillStyle = '#f7c844';
    ctx.fillRect(sunX - 2, sunY + 2, 26, 18);

    ctx.fillStyle = '#f7b267';
    for (let c = 0; c < 4; c++) {
      let cx = ((c * 110) - Math.floor(scrollOffset * 0.15)) % (VIEW_W + 60);
      if (cx < -60) cx += VIEW_W + 60;
      let cy = 16 + (c % 2) * 15;
      ctx.fillRect(cx, cy, 36, 6);
      ctx.fillRect(cx + 6, cy - 4, 22, 4);
    }

    ctx.fillStyle = biome.farHills;
    if (biome.type === 'mountain') {
      for (let m = -1; m < 6; m++) {
        let mx = (m * 76) - (Math.floor(scrollOffset * 0.3) % 76);
        ctx.fillRect(mx, horizonY - 26, 64, 26);
        ctx.fillRect(mx + 14, horizonY - 40, 36, 14);
        ctx.fillRect(mx + 24, horizonY - 50, 16, 10);
      }
    } else if (biome.type === 'forest') {
      for (let t = -1; t < 18; t++) {
        let tx = (t * 22) - (Math.floor(scrollOffset * 0.35) % 22);
        let th = 22 + (t % 3) * 8;
        ctx.fillRect(tx + 4, horizonY - th, 10, th);
        ctx.fillRect(tx + 7, horizonY - th - 6, 4, 6);
      }
    } else {
      for (let m = -1; m < 6; m++) {
        let mx = (m * 84) - (Math.floor(scrollOffset * 0.3) % 84);
        ctx.fillRect(mx, horizonY - 16, 68, 16);
        ctx.fillRect(mx + 16, horizonY - 24, 36, 8);
      }
    }

    ctx.fillStyle = biome.midHills;
    ctx.fillRect(0, horizonY, VIEW_W, 16);
    if (biome.type === 'forest' || biome.type === 'settlement') {
      for (let t = -1; t < 12; t++) {
        let tx = (t * 34) - (Math.floor(scrollOffset * 0.65) % 34);
        ctx.fillRect(tx + 4, horizonY - 10, 6, 10);
        ctx.fillRect(tx + 2, horizonY - 6, 10, 6);
      }
    }

    const groundY = horizonY + 12;
    ctx.fillStyle = biome.groundHoriz;
    ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

    ctx.fillStyle = biome.patch2;
    ctx.fillRect(0, groundY + 18, VIEW_W, 14);
    ctx.fillStyle = biome.patch1;
    ctx.fillRect(0, groundY + 42, VIEW_W, 16);

    for (let g = 0; g < 26; g++) {
      let gx = ((g * 27) - Math.floor(scrollOffset * 2.1)) % (VIEW_W + 20);
      if (gx < -20) gx += VIEW_W + 20;
      let gy = groundY + 6 + ((g * 13) % Math.max(24, VIEW_H - groundY - 12));
      ctx.fillStyle = (g % 2 === 0) ? biome.tuft : biome.tuftDark;
      ctx.fillRect(gx, gy, 3, 6);
      ctx.fillRect(gx + 4, gy + 2, 3, 4);
    }

    const bob = Math.floor(frame / 6) % 2 === 0 ? 0 : -2;
    const chaseY = groundY + Math.min(20, Math.floor((VIEW_H - groundY) * 0.24));
    
    let chaseBaseX = Math.floor(VIEW_W * 0.52);
    let chaseScale = 2;
    let drawYOffset = 0;

    if (isEndingChase) {
      let progress = Math.min(1, cutsceneTimer / 220);
      chaseBaseX = Math.floor(40 + progress * (VIEW_W * 0.68));
      drawYOffset = -Math.floor(progress * 18);
      chaseScale = progress > 0.65 ? 1 : 2;
    }

    ctx.fillStyle = '#d4d0c5';
    for (let d = 0; d < 6; d++) {
      let dx = chaseBaseX - 36 + ((d * 21 + frame * 2) % 110);
      let dy = chaseY + 22 + drawYOffset - ((d * 7 + frame) % 8);
      ctx.fillRect(dx, dy, 3, 3);
    }

    drawSprite(chaseBaseX + 26 * chaseScale, chaseY + bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);
    drawSprite(chaseBaseX + 10 * chaseScale, chaseY + (5 * chaseScale) - bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);
    drawSprite(chaseBaseX + 20 * chaseScale, chaseY + (9 * chaseScale) + bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);

    drawSprite(chaseBaseX - 22 * chaseScale, chaseY + (3 * chaseScale) - bob + drawYOffset, sprHunterSide, getActiveRiderPalette(), chaseScale);
  }

    ctx.fillRect(VIEW_W - 14, pylonY, 8, 10);

    ctx.fillRect(7, pylonY + 1, 6, 8);
    ctx.fillRect(VIEW_W - 13, pylonY + 1, 6, 8);

    // 2. Taut Steel/Hemp Wire-Line Cable spanning from bank to bank across the river
    const wireY = pylonY + 4;

    ctx.fillStyle = '#d4d0c5';

    ctx.fillRect(pulleyX, wireY - 2, 6, 5);
    ctx.fillStyle = '#1c1714';
    ctx.fillRect(pulleyX + 2, wireY - 1, 2, 3);

  // ==========================================
  // RENDER SINGLE ZONE BOARD (0..3)
  // ==========================================
  function renderBoardFrame(fIdx, offsetY) {
    const bIdx = (level - 1) % BIOMES.length;
    const b = BIOMES[bIdx];
    const fData = levelFrames[fIdx];

    ctx.save();
    ctx.translate(0, offsetY);

    // 1. Base Landscape Fill
    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Level 1: Continuous 4-Zone Downhill Sloped Step Gradient
    if (b.type === 'mountain') {
      const steps = 6;
      const stepH = Math.ceil(VIEW_H / steps);
      const baseElevation = (3 - fIdx) * 0.04;
      for (let s = 0; s < steps; s++) {
        let shadeAlpha = baseElevation + (0.04 * (1 - s / steps));
        if (shadeAlpha > 0) {
          ctx.fillStyle = `rgba(220, 238, 250, ${shadeAlpha.toFixed(3)})`;
          ctx.fillRect(0, VIEW_H - (s + 1) * stepH, VIEW_W, stepH);
        }
        ctx.fillStyle = 'rgba(30, 38, 44, 0.22)';
        ctx.fillRect(0, s * stepH, VIEW_W, 2);
      }
    }

    // 2. Natural Ground Patches & Grass Tufts
    for (let gp of fData.groundPatches) {
      const gx = Math.floor(gp.x);
      const gy = Math.floor(gp.y);
      if (gp.kind === 0) {
        ctx.fillStyle = b.patch1;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else if (gp.kind === 1) {
        ctx.fillStyle = b.patch2;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else {
        ctx.fillStyle = b.tuftDark;
        ctx.fillRect(gx, gy + 2, 2, 4);
        ctx.fillStyle = b.tuft;
        ctx.fillRect(gx + 1, gy, 2, 5);
        ctx.fillRect(gx + 4, gy + 1, 2, 4);
      }
    }

    // 3. Starting Platform (Zone 0 Bottom): Métis Red River Cart Circle Camp
    if (fIdx === 0) {
      const campY = VIEW_H - 46;
      if (b.type === 'mountain') {
        ctx.fillStyle = '#c8dce6';
        ctx.fillRect(0, campY, VIEW_W, 46);
        ctx.fillStyle = '#eef7fc';
        ctx.fillRect(0, campY + 8, VIEW_W, 38);
        for (let sx = 0; sx < VIEW_W; sx += 16) {
          ctx.fillRect(sx + 2, campY - 3, 12, 4);
        }
      } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, campY, VIEW_W, 46);
        ctx.fillStyle = b.tuft;
        ctx.fillRect(0, campY, VIEW_W, 2);
      }

      drawSprite(12, campY + 6, sprRedRiverCartAnim[0], PAL_CART, 2);
      drawSprite(48, campY + 18, sprRedRiverCartAnim[0], PAL_CART, 2);
      drawSprite(VIEW_W - 76, campY + 18, sprRedRiverCartAnim[0], PAL_CART, 2, true);
      drawSprite(VIEW_W - 40, campY + 6, sprRedRiverCartAnim[0], PAL_CART, 2, true);
    }

    // 4. End Platform (Zone 3 Top): Horizon Sunset Strip & Thundering Buffalo Herd
    if (fIdx === TOTAL_ZONES - 1) {
      const goalY = HUD_HEIGHT;
      if (b.type === 'forest') {
        ctx.fillStyle = '#0f6f9e';
        ctx.fillRect(0, goalY, 74, 54);
        ctx.fillRect(VIEW_W - 74, goalY, 74, 54);
        ctx.fillStyle = '#38a3b8';
        ctx.fillRect(10, goalY + 14, 18, 2);
        ctx.fillRect(VIEW_W - 36, goalY + 26, 18, 2);

        ctx.fillStyle = '#465054';
        ctx.fillRect(66, goalY, VIEW_W - 132, 16);
        ctx.fillStyle = '#7a8691';
        ctx.fillRect(70, goalY, VIEW_W - 140, 10);
      } else {
        ctx.fillStyle = b.skyBands[3];
        ctx.fillRect(0, goalY, VIEW_W, 8);
        ctx.fillStyle = b.skyBands[4];
        ctx.fillRect(0, goalY + 8, VIEW_W, 8);
        ctx.fillStyle = b.skyBands[5];
        ctx.fillRect(0, goalY + 16, VIEW_W, 6);
      }

      for (let h of fData.herd) {
        let stompY = Math.floor((frame + h.phase) / 10) % 2 === 0 ? 0 : -2;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(h.x + 3, h.y + 28, 22, 4);
        drawSprite(h.x, h.y + stompY, sprBuffaloTop, PAL_BUFFALO_TOP, 2);
      }
    }

    // 5. Horizontal Meandering Rivers, Wire-Line Ferries & Shaded Logs
    for (let wZone of fData.waters) {
      if (wZone.orientation === 'PEEK') {
        // Scenic meandering river bend peeking in on the East shoreline (no crossing needed)
        const sliceH = 8;
        for (let py = wZone.y; py < wZone.y + wZone.h; py += sliceH) {
          let prog = (py - wZone.y) / wZone.h;
          let bendW = Math.floor(24 + Math.sin(prog * Math.PI) * 34);
          let bx = VIEW_W - bendW;
          ctx.fillStyle = '#4a3825';
          ctx.fillRect(bx - 3, py, bendW + 3, sliceH);
          ctx.fillStyle = '#0F6F9E';
          ctx.fillRect(bx, py, bendW, sliceH);
          ctx.fillStyle = '#38a3b8';
          let rippleX = bx + 6 + (Math.floor(frame * 0.6 + py) % Math.max(8, bendW - 14));
          ctx.fillRect(rippleX, py + 3, 8, 2);
        }
        continue;
      }

      // Draw Horizontal-Flowing Meandering River Band
      const colW = 16;
      for (let cx = 0; cx < VIEW_W; cx += colW) {
        let meanderShift = wZone.meanderOffsetY ? Math.round(Math.sin((cx / VIEW_W) * Math.PI) * wZone.meanderOffsetY) : 0;
        let ry = wZone.y + meanderShift;

        ctx.fillStyle = '#4a3825';
        ctx.fillRect(cx, ry - 3, colW, wZone.h + 6);

        ctx.fillStyle = '#0F6F9E';
        ctx.fillRect(cx, ry, colW, wZone.h);
      }

      // Animated Horizontal Current Ripples
      ctx.fillStyle = '#38a3b8';
      const shift = Math.floor(frame * 0.85) % 24;
      for (let rx = -24; rx < VIEW_W; rx += 24) {
        let meanderShift = wZone.meanderOffsetY ? Math.round(Math.sin((Math.max(0, rx) / VIEW_W) * Math.PI) * wZone.meanderOffsetY) : 0;
        ctx.fillRect(rx + shift, wZone.y + meanderShift + 7, 10, 2);
        ctx.fillRect(rx + ((shift + 12) % 24), wZone.y + meanderShift + wZone.h - 9, 10, 2);
      }

      // Render Platforms (Single-Point Wire-Line Ferry or Shaded Floating Logs)
      for (let plat of wZone.platforms) {
        if (wZone.mode === 'FERRY') {
          drawWireLineFerry(wZone, plat);
        } else {
          drawShadedLog(Math.floor(plat.x), Math.floor(plat.y), plat.w, plat.h);
        }
      }
    }

    // 6. Prairie Dog Dirt Piles (Safe when empty, Prairie Dog emerges cyclically)
    for (let bur of fData.burrows) {
      const bx = Math.floor(bur.x);
      const by = Math.floor(bur.y);
      let isEmerged = (bur.timer >= bur.cycle - 42);
      let isWarning = (bur.timer >= bur.cycle - 58 && !isEmerged);

      ctx.fillStyle = '#4a3219';
      ctx.fillRect(bx, by + 4, bur.w, bur.h - 4);
      ctx.fillStyle = '#734f29';
      ctx.fillRect(bx + 2, by + 2, bur.w - 4, bur.h - 4);
      ctx.fillStyle = '#1c1108';
      ctx.fillRect(bx + 5, by + 4, bur.w - 10, 5);

      if (isWarning && frame % 4 < 2) {
        ctx.fillStyle = '#b59259';
        ctx.fillRect(bx + 7, by + 2, 8, 2);
      } else if (isEmerged) {
        drawSprite(bx + 3, by - 6, sprPrairieDog, PAL_PRAIRIEDOG, 2);
      }
    }

    // 7. Static Blocking Objects
    for (let st of fData.statics) {
      if (st.type === 'LEDGE') {
        ctx.fillStyle = '#2c3338';
        ctx.fillRect(st.x, st.y, st.w, st.h);
        ctx.fillStyle = '#78848c';
        ctx.fillRect(st.x, st.y, st.w, st.h - 5);
        ctx.fillStyle = '#9aa6b0';
        ctx.fillRect(st.x, st.y, st.w, 4);
        ctx.fillStyle = '#434d54';
        for (let sx = st.x + 8; sx < st.x + st.w - 6; sx += 14) {
          ctx.fillRect(sx, st.y + 5, 3, st.h - 8);
        }
        ctx.fillStyle = '#1c2024';
        if (st.isCenterBarricade) {
          ctx.fillRect(st.x, st.y, 4, st.h);
          ctx.fillRect(st.x + st.w - 4, st.y, 4, st.h);
        } else {
          const capX = st.fromLeft ? (st.x + st.w - 5) : st.x;
          ctx.fillRect(capX, st.y, 5, st.h);
        }
      } else if (st.type === 'ROCK') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprRock, PAL_ROCK, 3);
      } else if (st.type === 'TALLGRASS') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 3);
        drawSprite(st.x, st.y, sprTallGrass, PAL_TALLGRASS, 3);
      } else if (st.type === 'PINE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(st.x + 3, st.y + st.h - 2, st.w - 6, 4);
        drawSprite(st.x, st.y, sprTree, PAL_PINE, 3);
      } else if (st.type === 'BIRCH') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(st.x + 3, st.y + st.h - 2, st.w - 6, 4);
        drawSprite(st.x, st.y, sprBirch, PAL_BIRCH, 3);
      } else if (st.type === 'TIPI') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprTipi, PAL_TIPI, 2);
      } else if (st.type === 'LOGHOUSE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprLogHouse, PAL_LOGHOUSE, 2);
      }
    }

    // 8. 2-Frame Animated Dynamic Collision Wildlife & NPC Red River Carts
    const animIdx = Math.floor(frame / 7) % 2;
    for (let dyn of fData.dynamics) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.fillRect(Math.floor(dyn.x + 2), Math.floor(dyn.y + dyn.h - 2), dyn.w - 4, 4);

      let spr, pal;
      if (dyn.type === 'FOX') { spr = sprFoxAnim[animIdx]; pal = PAL_FOX; }
      else if (dyn.type === 'MOOSE') { spr = sprMooseAnim[animIdx]; pal = PAL_MOOSE; }
      else if (dyn.type === 'DEER') { spr = sprDeerAnim[animIdx]; pal = PAL_DEER; }
      else if (dyn.type === 'PRONGHORN') { spr = sprPronghornAnim[animIdx]; pal = PAL_PRONGHORN; }
      else if (dyn.type === 'SNAKE') { spr = sprSnakeAnim[animIdx]; pal = PAL_SNAKE; }
      else if (dyn.type === 'CART') { spr = sprRedRiverCartAnim[animIdx]; pal = PAL_CART; }
      else if (dyn.type === 'OX') { spr = sprOxAnim[animIdx]; pal = PAL_OX; }
      else if (dyn.type === 'WOLF') { spr = sprWolfAnim[animIdx]; pal = PAL_WOLF; }
      else if (dyn.type === 'BEAR') { spr = sprBearAnim[animIdx]; pal = PAL_BEAR; }
      else if (dyn.type === 'BEAVER') { spr = sprBeaverAnim[animIdx]; pal = PAL_BEAVER; }
      else if (dyn.type === 'TURTLE') { spr = sprTurtleAnim[animIdx]; pal = PAL_TURTLE; }

      let flip = dyn.vx < 0;
      let hopY = (dyn.type === 'FOX' || dyn.type === 'DEER' || dyn.type === 'PRONGHORN' || dyn.type === 'WOLF') && (animIdx === 1) ? -1 : 0;
      drawSprite(dyn.x, dyn.y + hopY, spr, pal, dyn.scale, flip);
    }

    ctx.restore();
  }

  // Render Paul Kane Homage Tragic Horse Fall & Flung Rider Rag-Doll
  function drawFallingPhysicsSimulation() {
    const activePal = getActiveRiderPalette();
    const h = fallSim.horse;
    const r = fallSim.rider;

    // 1. Dust Clouds kicked up by sliding horse & tumbling rider
    for (let pt of fallSim.dust) {
      ctx.fillStyle = pt.life > 12 ? '#d4d0c5' : '#8c7d65';
      ctx.fillRect(Math.floor(pt.x), Math.floor(pt.y), 3, 3);
    }

    // 2. Ground Shadows beneath fallen horse & rider
    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.fillRect(Math.floor(h.x + 2), Math.floor(h.groundY + 10), 32, 5);
    ctx.fillRect(Math.floor(r.x + 2), Math.floor(r.groundY + 6), 20, 4);

    // 3. Draw Flung Rider (rendered underneath/ahead of the collapsing horse)
    ctx.save();
    ctx.translate(Math.floor(r.x + 12), Math.floor(r.y + 6));
    ctx.rotate(r.angle);
    drawSprite(-12, -6, sprFallenRider, activePal, 2, h.flipX);
    ctx.restore();

    // 4. Draw Collapsing Horse
    ctx.save();
    ctx.translate(Math.floor(h.x + 18), Math.floor(h.y + 8));
    ctx.rotate(h.angle);
    drawSprite(-18, -8, sprFallenHorse, activePal, 2, h.flipX);
    ctx.restore();
  }

  function drawGameplay() {
    const bIdx = (level - 1) % BIOMES.length;
    const b = BIOMES[bIdx];

    if (state === 'FRAME_SLIDE') {
      const slideSteps = 30;
      const progress = slideProgress / slideSteps;
      const slideH = VIEW_H - HUD_HEIGHT;
      const offsetCurr = Math.floor(progress * slideH);
      const offsetNext = offsetCurr - slideH;

      renderBoardFrame(subFrame, offsetCurr);
      renderBoardFrame(subFrame + 1, offsetNext);
    } else {
      renderBoardFrame(subFrame, 0);
    }

    // Draw Active Player OR Paul Kane Tragic Horse Fall Physics
    if (state === 'FALLING_PHYSICS' || state === 'LIFE_LOST' || state === 'GAMEOVER') {
      drawFallingPhysicsSimulation();
    } else {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
      ctx.fillRect(Math.floor(player.x + 5), Math.floor(player.y + player.h - 4), player.w - 10, 5);

      const isMoving = player.moveTimer > 0;
      const poseIdx = isMoving ? (Math.floor(frame / 6) % 2) : 2; 
      const activePal = getActiveRiderPalette();

      if (player.dir === 'UP') {
        drawSprite(player.x, player.y, sprPlayerUp[poseIdx], activePal, 2, false);
      } else if (player.dir === 'DOWN') {
        drawSprite(player.x, player.y, sprPlayerDown[poseIdx], activePal, 2, false);
      } else if (player.dir === 'RIGHT') {
        drawSprite(player.x - 2, player.y + 2, sprPlayerSideAnim[poseIdx], activePal, 2, false);
      } else if (player.dir === 'LEFT') {
        drawSprite(player.x - 2, player.y + 2, sprPlayerSideAnim[poseIdx], activePal, 2, true);
      }
    }

    // Top HUD Bar (Anchored y = 0)
    ctx.fillStyle = '#182238';
    ctx.fillRect(0, 0, VIEW_W, HUD_HEIGHT);
    ctx.fillStyle = '#F7C844'; 
    ctx.fillRect(0, HUD_HEIGHT - 2, VIEW_W, 2);

    ctx.fillStyle = '#F7C844';
    ctx.font = "bold 10px 'Courier New', Courier, monospace";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 6, HUD_HEIGHT / 2);

    ctx.fillStyle = '#12AEA2';
    ctx.textAlign = 'right';
    ctx.fillText(`RIDERS:${lives}  STG:${level}  ZN:${subFrame + 1}/${TOTAL_ZONES}`, VIEW_W - 6, HUD_HEIGHT / 2);

    // Fading-In Next Hunting Party Member Banner AFTER Fall Animation Finishes
    if (state === 'LIFE_LOST') {
      const boxW = 246;
      const boxH = 58;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH, textBoxAlpha);

      ctx.save();
      ctx.globalAlpha = textBoxAlpha;
      ctx.fillStyle = '#FB6604';
      ctx.font = "bold 13px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("RIDER THROWN!", VIEW_W / 2, by + 10);

      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 10px 'Courier New', Courier, monospace";
      ctx.fillText(`NEXT UP: ${getActiveRiderName()}`, VIEW_W / 2, by + 32);
      ctx.restore();
    }

    // Fading-In Game Over Box AFTER Final Rider Fall Animation Finishes
    if (state === 'GAMEOVER') {
      const boxW = 230;
      const boxH = 78;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH, textBoxAlpha);

      ctx.save();
      ctx.globalAlpha = textBoxAlpha;
      ctx.fillStyle = '#AD1C21';
      ctx.font = "bold 17px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("HUNTING PARTY HALTED", VIEW_W / 2, by + 12);

      if (Math.floor(Date.now() / 480) % 2 === 0) {
        ctx.fillStyle = '#12AEA2';
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.fillText("PRESS 'A' TO RIDE AGAIN", VIEW_W / 2, by + 46);
      }
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE') {
      drawTitleScreen();
    } else if (state === 'INTRO_CUTSCENE') {
      drawIntroCutscene();
    } else if (state === 'LEVEL_END_CUTSCENE') {
      drawLevelEndCutscene();
    } else if (state === 'VICTORY_CUTSCENE') {
      drawLowerFortGarryVictory();
    } else {
      drawGameplay();
    }

    if (isPaused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const bw = 150, bh = 44;
      drawSNESWindow(Math.floor((VIEW_W - bw) / 2), Math.floor((VIEW_H - bh) / 2), bw, bh);
      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 16px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("PAUSED", VIEW_W / 2, VIEW_H / 2 + 1);
    }
  }

  // ==========================================
  // ARCADE CABINET POSTMESSAGE BRIDGE
  // ==========================================
  let inputState = { up: false, down: false, left: false, right: false };
  let inputTimers = { up: 0, down: 0, left: 0, right: 0 };
  let btnALast = 0;
  let btnBLast = 0;

  window.addEventListener('message', function(event) {
    const cmd = (typeof event.data === 'string') ? event.data : (event.data && (event.data.cmd || event.data.action || event.data.type));
    if (!cmd) return;

    const now = Date.now();

    if (cmd === 'PAUSE') { 
      isPaused = true; 
      pauseChiptuneTrack();
      inputState.up = inputState.down = inputState.left = inputState.right = false;
      return; 
    }
    if (cmd === 'RESUME') { 
      isPaused = false; 
      resumeChiptuneTrack();
      return; 
    }

    if (isPaused) return;

    if (cmd === 'BUTTON_A' && now - btnALast > 110) {
      btnALast = now;
      if (state === 'TITLE') {
        state = 'INTRO_CUTSCENE';
        cutsceneTimer = 0;
        startChiptuneTrack();
      } else if (state === 'INTRO_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      } else if (state === 'LEVEL_END_CUTSCENE') {
        level++;
        initLevel();
      } else if (state === 'VICTORY_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      } else if (state === 'GAMEOVER' && textBoxAlpha >= 0.8) {
        level = 1;
        lives = 3;
        stopChiptuneTrack();
        initLevel();
        startChiptuneTrack();
      }
    }

    if (cmd === 'BUTTON_B' && now - btnBLast > 110) {
      btnBLast = now;
      if (state === 'INTRO_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      } else if (state === 'LEVEL_END_CUTSCENE') {
        level++;
        initLevel();
      } else if (state === 'VICTORY_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      }
    }

    const parseDpad = (dirCmd, pressCmd, releaseCmd, stateKey, dx, dy) => {
      if (cmd === pressCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy); 
      }
      else if (cmd === releaseCmd) {
        inputState[stateKey] = false;
      }
      else if (cmd === dirCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy);
      }
    };

    parseDpad('DPAD_UP', 'DPAD_UP_PRESS', 'DPAD_UP_RELEASE', 'up', 0, -1);
    parseDpad('DPAD_DOWN', 'DPAD_DOWN_PRESS', 'DPAD_DOWN_RELEASE', 'down', 0, 1);
    parseDpad('DPAD_LEFT', 'DPAD_LEFT_PRESS', 'DPAD_LEFT_RELEASE', 'left', -1, 0);
    parseDpad('DPAD_RIGHT', 'DPAD_RIGHT_PRESS', 'DPAD_RIGHT_RELEASE', 'right', 1, 0);

    if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'NEUTRAL') {
      inputState.up = inputState.down = inputState.left = inputState.right = false;
    }
  });

  function processHoldInputs() {
    const now = Date.now();
    const holdDelay = 145; 
    if (inputState.up && now - inputTimers.up > holdDelay) { inputTimers.up = now; move(0, -1); }
    if (inputState.down && now - inputTimers.down > holdDelay) { inputTimers.down = now; move(0, 1); }
    if (inputState.left && now - inputTimers.left > holdDelay) { inputTimers.left = now; move(-1, 0); }
    if (inputState.right && now - inputTimers.right > holdDelay) { inputTimers.right = now; move(1, 0); }
  }

  function loop() {
    if (!isPaused) {
      processHoldInputs();
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  resizeViewport();
  loop();

</script>
</body>
