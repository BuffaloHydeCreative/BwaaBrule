  function initChiptuneAudio() {
    if (!chiptuneAudioCtx) {
      chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (chiptuneAudioCtx.state === 'suspended') {
      chiptuneAudioCtx.resume();
    }
  }

  function playChiptuneTone(freq, type, duration, volume) {
    if (!freq || !chiptuneAudioCtx) return;

    const osc = chiptuneAudioCtx.createOscillator();
    const gainNode = chiptuneAudioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, chiptuneAudioCtx.currentTime);

    gainNode.gain.setValueAtTime(volume, chiptuneAudioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, chiptuneAudioCtx.currentTime + duration - 0.015);

    osc.connect(gainNode);
    gainNode.connect(chiptuneAudioCtx.destination);

    osc.start();
    osc.stop(chiptuneAudioCtx.currentTime + duration);
  }

  function stepChiptuneTrack() {
    const leadNote = trainFiddleLead[currentChiptuneStep];
    const bassNote = runawayTrainBass[currentChiptuneStep];

    if (leadNote && CHIPTUNE_NOTES[leadNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[leadNote], 'square', CHIPTUNE_NOTE_LEN * 0.85, 0.06);
    }
    
    if (bassNote && CHIPTUNE_NOTES[bassNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[bassNote], 'triangle', CHIPTUNE_NOTE_LEN * 1.8, 0.35);
    }

    currentChiptuneStep = (currentChiptuneStep + 1) % 32;
  }

  function startChiptuneTrack() {
    initChiptuneAudio();
    if (!chiptuneIsPlaying) {
      chiptuneIsPlaying = true;
      currentChiptuneStep = 0;
      chiptuneInterval = setInterval(stepChiptuneTrack, CHIPTUNE_NOTE_LEN * 1000);
    }
  }

  function stopChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
      currentChiptuneStep = 0;
    }
  }

  function pauseChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
    }
  }

    if (!chiptuneIsPlaying && (state === 'PLAYING' || state === 'TRANSITION')) {

    'R': ["11110","10001","10001","11110","10100","10010","10001"],

    ' ': ["00000","00000","00000","00000","00000","00000","00000"]
  };

  function drawStylizedTitle(text, centerX, startY, scale) {
    const spacing = 1;
    const totalCols = text.length * (5 + spacing) - spacing;
    let curX = Math.floor(centerX - (totalCols * scale) / 2);

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const glyph = FONT_5X7[ch] || FONT_5X7[' '];
      
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (glyph[r][c] === '1') {
            const px = curX + c * scale;
            const py = startY + r * scale;
            
            // Deep drop shadow
            ctx.fillStyle = '#1c0507';
            ctx.fillRect(px + scale, py + scale, scale, scale);
            
            // Outline
            ctx.fillStyle = '#000000';
            ctx.fillRect(px - 1, py, scale + 2, scale);
            ctx.fillRect(px, py - 1, scale, scale + 2);

            // SNES Vertical Gradient Fill (Gold -> Blaze Orange -> Crimson)
            if (r < 2) ctx.fillStyle = '#F7C844';
            else if (r < 5) ctx.fillStyle = '#FB6604';
            else ctx.fillStyle = '#AD1C21';
            ctx.fillRect(px, py, scale, scale);
          }
        }
      }
      curX += (5 + spacing) * scale;
    }
  }

  // ==========================================
  // SNES RPG DIALOGUE BOX HELPER
  // ==========================================
  function drawSNESWindow(x, y, w, h) {
    // Outer drop shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(x + 4, y + 4, w, h);

    // Deep Navy/Indigo SNES Box Fill
    ctx.fillStyle = '#182238';
    ctx.fillRect(x, y, w, h);

    // Outer White Pixel Border
    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);

    // Inner Gold/Teal Trim
    ctx.fillStyle = '#F7C844';
    ctx.fillRect(x + 3, y + 3, w - 6, 1);
    ctx.fillRect(x + 3, y + h - 4, w - 6, 1);
    ctx.fillRect(x + 3, y + 3, 1, h - 6);
    ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
  }

  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0];
    for (let i = 1; i < words.length; i++) {
      let testLine = currentLine + " " + words[i];
      if (ctx.measureText(testLine).width < maxWidth) {
        currentLine = testLine;
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);
    return lines;
  }

  // ==========================================
  // GAMEPLAY SPAWNING & LEVEL PROGRESSION
  // ==========================================
  function initGroundDetails() {
    groundDetails = [];
    for (let i = 0; i < 36; i++) {
      groundDetails.push({
        x: Math.random() * VIEW_W,
        y: Math.random() * VIEW_H,
        w: Math.random() > 0.5 ? 6 : 4,
        h: Math.random() > 0.5 ? 4 : 2,
        tone: Math.random() > 0.4 ? 'light' : 'dark'
      });
    }
  }

  function spawnObstacle() {
    let spawnRate = Math.max(46, 115 - (level * 9)); 
    if (frame % spawnRate === 0) {
      let bIdx = (level - 1) % BIOMES.length;
      let pool = [];
      if (BIOMES[bIdx].type === 'mountain') pool = ['rock','rock','rock','shrub','fox'];
      else if (BIOMES[bIdx].type === 'desert') pool = ['rock','rock','shrub','shrub','fox'];
      else if (BIOMES[bIdx].type === 'grass') pool = ['rock','shrub','shrub','tree','fox'];
      else if (BIOMES[bIdx].type === 'forest') pool = ['rock','shrub','tree','tree','tree','fox'];

      let type = pool[Math.floor(Math.random() * pool.length)];
      if (Math.random() < 0.28) type = 'pelt';

      let x = 12 + Math.random() * (VIEW_W - 64);
      let dx = (type === 'fox') ? (Math.random() > 0.5 ? 0.45 : -0.45) : 0;
      let dy = baseSpeed + (Math.random() * 0.35);

      let w = 24, h = 18, scale = 3; 
      if (type === 'tree') { w = 40; h = 40; scale = 4; } 
      if (type === 'shrub') { w = 24; h = 18; scale = 3; }
      if (type === 'fox') { w = 24; h = 18; scale = 3; }
      if (type === 'pelt') { w = 20; h = 18; scale = 2; } 

      obstacles.push({ x: x, y: -50, dx: dx, dy: dy, type: type, w: w, h: h, scale: scale, dead: false });
    }
  }

  function startLevelGameplay(withRumble = true) {
    baseSpeed = 1.05 + (level * 0.14); 
    obstacles = [];
    peltsCollected = 0;
    player = { x: (VIEW_W / 2) - 16, y: VIEW_H - 48, dead: false, w: 32, h: 32 };
    initGroundDetails();
    
    if (withRumble) {
      triggerRumble();
    } else {
      state = 'PLAYING';
    }
  }

  function triggerRumble() {
    state = 'TRANSITION';
    shakeFrames = 95;
    buffaloes = [];
    for (let i = 0; i < 22; i++) {
      buffaloes.push({
        x: Math.random() * (VIEW_W - 36),
        y: VIEW_H + Math.random() * 220, 
        dy: -(3.2 + Math.random() * 2.2)
      });
    }
  }

  function move(dx, dy) {
    if (state !== 'PLAYING') return;
    let spd = 20; 
    let nx = player.x + (dx * spd);
    let ny = player.y + (dy * spd);
    if (nx >= 6 && nx <= VIEW_W - player.w - 6) player.x = nx;
    if (ny >= HUD_HEIGHT + 4 && ny <= VIEW_H - player.h - 4) player.y = ny;
  }

  // ==========================================
  // MAIN UPDATE LOOP
  // ==========================================
  function update() {
    frame++;

    if (state === 'TITLE') {
      return;
    }

    if (state === 'CUTSCENE') {
      cutsceneScroll += 1.5;
      return;
    }

    if (state === 'LEVEL_POPUP' || state === 'GAMEOVER') {
      return;
    }

    if (state === 'PLAYING') {
      bgScrollY += baseSpeed;
      if (bgScrollY >= TILE * 2) bgScrollY = 0;

      for (let gd of groundDetails) {
        gd.y += baseSpeed;
        if (gd.y > VIEW_H) {
          gd.y = -6;
          gd.x = Math.random() * VIEW_W;
        }
      }

      spawnObstacle();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x += obs.dx;
        if (obs.x < 4 || obs.x + obs.w > VIEW_W - 4) obs.dx *= -1;
        obs.y += obs.dy;

        let inset = (obs.type === 'pelt') ? 0 : 4;
        let playerInset = 6; 

        if (!obs.dead && 
            player.x + playerInset < obs.x + obs.w - inset && 
            player.x + player.w - playerInset > obs.x + inset &&
            player.y + playerInset < obs.y + obs.h - inset && 
            player.y + player.h - playerInset > obs.y + inset) {
          
          if (obs.type === 'pelt') {
            peltsCollected++;
            obs.dead = true; 
            if (peltsCollected >= 10) {
              level++;
              state = 'LEVEL_POPUP';
            }
          } else {
            state = 'GAMEOVER';
            stopChiptuneTrack(); 
          }
        }

        if (obs.y > VIEW_H || obs.dead) obstacles.splice(i, 1);
      }

    } else if (state === 'TRANSITION') {
      shakeFrames--;
      bgScrollY += baseSpeed * 1.5;
      if (bgScrollY >= TILE * 2) bgScrollY = 0;

      for (let gd of groundDetails) {
        gd.y += baseSpeed * 1.5;
        if (gd.y > VIEW_H) {
          gd.y = -6;
          gd.x = Math.random() * VIEW_W;
        }
      }

      buffaloes.forEach(b => b.y += b.dy);
      if (shakeFrames <= 0) {
        state = 'PLAYING';
      }
    }
  }

  // ==========================================
  // PARALLAX SCENERY & RENDERING
  // ==========================================
  function drawPrairieParallax(scrollOffset, isCutscene) {
    // 1. SNES Sunset / Prairie Sky Banded Gradient
    const skyBands = ['#241438', '#541b36', '#8f2929', '#c95822', '#eb9634', '#f7c844'];
    const horizonY = Math.floor(VIEW_H * 0.56);
    const bandH = Math.ceil(horizonY / skyBands.length);
    for (let i = 0; i < skyBands.length; i++) {
      ctx.fillStyle = skyBands[i];
      ctx.fillRect(0, i * bandH, VIEW_W, bandH + 1);
    }

    // 2. Distant Sun & Drifting Clouds (Slow Parallax Layer 1)
    ctx.fillStyle = '#fff5b8';
    ctx.fillRect(Math.floor(VIEW_W * 0.72), Math.floor(horizonY * 0.35), 22, 22);
    ctx.fillStyle = '#f7c844';
    ctx.fillRect(Math.floor(VIEW_W * 0.72) - 2, Math.floor(horizonY * 0.35) + 2, 26, 18);

    ctx.fillStyle = '#f7b267';
    for (let c = 0; c < 4; c++) {
      let cx = ((c * 110) - Math.floor(scrollOffset * 0.15)) % (VIEW_W + 60);
      if (cx < -60) cx += VIEW_W + 60;
      let cy = 18 + (c % 2) * 16;
      ctx.fillRect(cx, cy, 36, 6);
      ctx.fillRect(cx + 6, cy - 4, 22, 4);
    }

    // 3. Distant Rocky Foothills & Buttes (Parallax Layer 2)
    ctx.fillStyle = '#472836';
    for (let m = -1; m < 6; m++) {
      let mx = (m * 80) - (Math.floor(scrollOffset * 0.35) % 80);
      ctx.fillRect(mx, horizonY - 22, 60, 22);
      ctx.fillRect(mx + 12, horizonY - 32, 36, 10);
      ctx.fillRect(mx + 22, horizonY - 38, 16, 6);
    }

    // 4. Midground Rolling Prairie Hills & Pine Silhouettes (Parallax Layer 3)
    ctx.fillStyle = '#5e4318';
    ctx.fillRect(0, horizonY, VIEW_W, 18);
    ctx.fillStyle = '#382a10';
    for (let t = -1; t < 12; t++) {
      let tx = (t * 34) - (Math.floor(scrollOffset * 0.7) % 34);
      ctx.fillRect(tx + 4, horizonY - 10, 6, 10);
      ctx.fillRect(tx + 2, horizonY - 6, 10, 6);
    }

    // 5. Foreground Open Golden Prairie & Trail (Parallax Layer 4 - Fast)
    const groundY = horizonY + 14;
    ctx.fillStyle = '#8a681a';
    ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

    // Trail band where the chase runs
    const trailY = groundY + 14;
    const trailH = Math.min(54, VIEW_H - trailY - 8);
    ctx.fillStyle = '#634729';
    ctx.fillRect(0, trailY, VIEW_W, trailH);
    ctx.fillStyle = '#4a331c';
    ctx.fillRect(0, trailY, VIEW_W, 2);
    ctx.fillRect(0, trailY + trailH - 2, VIEW_W, 2);

    // Scrolling Prairie Grass Tufts & Pebbles
    for (let g = 0; g < 22; g++) {
      let gx = ((g * 29) - Math.floor(scrollOffset * 2.2)) % (VIEW_W + 20);
      if (gx < -20) gx += VIEW_W + 20;
      let gy = (g % 2 === 0) ? groundY + 4 : trailY + trailH + 4;
      if (gy < VIEW_H - 4) {
        ctx.fillStyle = '#bd9632';
        ctx.fillRect(gx, gy, 3, 6);
        ctx.fillRect(gx + 4, gy + 2, 3, 4);
      }
    }

    // 6. Animated Herd of Buffalo Chased by Mounted Hunter!
    const bob = Math.floor(frame / 6) % 2 === 0 ? 0 : -2;
    const chaseBaseX = isCutscene 
      ? ((Math.floor(frame * 1.4) % (VIEW_W + 160)) - 130)
      : Math.floor(VIEW_W * 0.52);

    // Kicking prairie dust particles
    ctx.fillStyle = '#d4d0c5';
    for (let d = 0; d < 6; d++) {
      let dx = chaseBaseX - 45 + ((d * 23 + frame * 2) % 130);
      let dy = trailY + trailH - 6 - ((d * 7 + frame) % 8);
      ctx.fillRect(dx, dy, 3, 3);
    }

    // Buffalo Herd (3 staggered 16-bit buffalo)
    drawSprite(chaseBaseX + 46, trailY + 6 + bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);
    drawSprite(chaseBaseX + 18, trailY + 16 - bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);
    drawSprite(chaseBaseX + 34, trailY + 24 + bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);

    // Mounted Métis Buffalo Hunter pursuing closely behind
    drawSprite(chaseBaseX - 38, trailY + 12 - bob, sprHunterSide, PAL_HUNTER_SIDE, 2);
  }

  function drawTitleScreen() {
    drawPrairieParallax(frame * 1.2, false);

    // Subtle dark vignette at top for crisp title contrast
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, VIEW_W, 76);

    // Stylized 16-Bit Block Pixel Wordmark
    drawStylizedTitle("LAND", VIEW_W / 2, 14, 3);
    drawStylizedTitle("THUNDER!", VIEW_W / 2, 42, 3);

    // Bottom Prompt Banner
    if (Math.floor(Date.now() / 480) % 2 === 0) {
      const boxW = 190;
      const boxH = 22;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = VIEW_H - 30;
      ctx.fillStyle = 'rgba(14, 42, 30, 0.88)';
      ctx.fillRect(bx, by, boxW, boxH);
      ctx.strokeStyle = '#F7C844';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, boxW, boxH);

      ctx.fillStyle = '#12AEA2';
      ctx.font = "bold 12px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("PRESS 'A' TO START", VIEW_W / 2, by + boxH / 2 + 1);
    }
  }

  function drawCutsceneScreen() {
    drawPrairieParallax(cutsceneScroll, true);

    // Top Cutscene Story & Game Description RPG Box
    const pad = 14;
    const boxW = VIEW_W - pad * 2;
    const boxH = 112;
    const bx = pad;
    const by = 12;

    drawSNESWindow(bx, by, boxW, boxH);

    ctx.fillStyle = '#F7C844';
    ctx.font = "bold 11px 'Courier New', Courier, monospace";
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText("THE GREAT PLAINS RUN", bx + 10, by + 8);

    ctx.fillStyle = '#F4F4F4';
    ctx.font = "10px 'Courier New', Courier, monospace";
    const story = "THE BUFFALO HERD THUNDERS ACROSS THE LAND! RIDE NORTH ON YOUR RUNNER STEED, DODGE WILDLIFE AND TIMBER, AND GATHER 10 GOLDEN PELTS PER REGION.";
    const lines = wrapText(story, boxW - 20);
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], bx + 10, by + 24 + (i * 13));
    }

    if (Math.floor(Date.now() / 450) % 2 === 0) {
      ctx.fillStyle = '#12AEA2';
      ctx.font = "bold 10px 'Courier New', Courier, monospace";
      ctx.textAlign = 'right';
      ctx.fillText("PRESS 'A' TO RIDE ►", bx + boxW - 10, by + boxH - 16);
    }
  }

  function drawGameplay() {
    let shakeX = 0, shakeY = 0;
    if (state === 'TRANSITION') {
      shakeX = (Math.random() - 0.5) * 6;
      shakeY = (Math.random() - 0.5) * 6;
    }

    ctx.save();
    
    let bIdx = (level - 1) % BIOMES.length;
    let b = BIOMES[bIdx];

    // 1. Base SNES Terrain Fill
    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // 2. Alternating Dithered Terrain Bands for Depth
    const bandSize = 24;
    const numBands = Math.ceil(VIEW_H / bandSize) + 2;
    ctx.fillStyle = b.bgAlt;
    for (let r = -2; r < numBands; r++) {
      if (Math.abs(r) % 2 === 0) {
        ctx.fillRect(0, (r * bandSize) + bgScrollY, VIEW_W, bandSize);
      }
    }

    // 3. Centralworn Prairie Cart/Horse Trail for Visual Atmosphere
    const trailW = Math.floor(VIEW_W * 0.44);
    const trailX = Math.floor((VIEW_W - trailW) / 2);
    ctx.fillStyle = b.trackEdge;
    ctx.fillRect(trailX - 3, 0, trailW + 6, VIEW_H);
    ctx.fillStyle = b.track;
    ctx.fillRect(trailX, 0, trailW, VIEW_H);

    // Scrolling Trail Ruts & Ground Patches
    for (let gd of groundDetails) {
      ctx.fillStyle = (gd.tone === 'light') ? b.patch : b.patchDark;
      ctx.fillRect(Math.floor(gd.x), Math.floor(gd.y), gd.w, gd.h);
    }

    ctx.translate(shakeX, shakeY);

    // 4. Draw Obstacles & Golden Pelts with Ground Shadows
    obstacles.forEach(obs => {
      // Pixel drop shadow under entity
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(Math.floor(obs.x + 2), Math.floor(obs.y + obs.h - 2), obs.w - 4, 4);

      let pal, spr;
      if (obs.type === 'rock') { spr = sprRock; pal = PAL_ROCK; }
      else if (obs.type === 'tree') { spr = sprTree; pal = PAL_TREE; }
      else if (obs.type === 'shrub') { spr = sprShrub; pal = PAL_SHRUB; }
      else if (obs.type === 'fox') { spr = sprFox; pal = PAL_FOX; }
      else if (obs.type === 'pelt') { spr = sprPelt; pal = PAL_PELT; }
      
      let flip = (obs.type === 'fox' && obs.dx < 0);
      drawSprite(obs.x, obs.y, spr, pal, obs.scale, flip);
    });

    // 5. Draw Mounted Hunter & Horse
    if (state !== 'GAMEOVER' || frame % 10 < 5) { 
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(Math.floor(player.x + 4), Math.floor(player.y + player.h - 3), player.w - 8, 5);

      let animFrame = (Math.floor(frame / 7) % 2 === 0) ? sprPlayerAnim[0] : sprPlayerAnim[1];
      drawSprite(player.x, player.y, animFrame, PAL_PLAYER, 2);
    }

    // 6. Draw Rumbling Buffalo Herd Transition
    if (state === 'TRANSITION') {
      buffaloes.forEach(buf => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(Math.floor(buf.x + 4), Math.floor(buf.y + 30), 28, 6);
        drawSprite(buf.x, buf.y, sprBuffaloTop, PAL_BUFFALO_TOP, 3);
      });
    }

    ctx.restore();
    
    // 7. Top HUD Bar (Anchored y = 0)
    ctx.fillStyle = '#182238';
    ctx.fillRect(0, 0, VIEW_W, HUD_HEIGHT);
    ctx.fillStyle = '#F7C844'; 
    ctx.fillRect(0, HUD_HEIGHT - 2, VIEW_W, 2);

    ctx.fillStyle = '#F7C844';
    ctx.font = "bold 11px 'Courier New', Courier, monospace";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 6, HUD_HEIGHT / 2);

    ctx.fillStyle = '#12AEA2';
    ctx.textAlign = 'right';
    ctx.fillText(`PELTS:${peltsCollected}/10 LVL:${level}`, VIEW_W - 6, HUD_HEIGHT / 2);

    // 8. Pop-up Cutscene Text Box on Level Change
    if (state === 'LEVEL_POPUP') {
      const boxW = VIEW_W - 32;
      const boxH = 104;
      const bx = 16;
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#12AEA2';
      ctx.font = "bold 11px 'Courier New', Courier, monospace";
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`REGION ${level}: ${b.name}`, bx + 10, by + 8);

      ctx.fillStyle = '#F4F4F4';
      ctx.font = "10px 'Courier New', Courier, monospace";
      const lines = wrapText(b.desc, boxW - 20);
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], bx + 10, by + 25 + (i * 13));
      }

      if (Math.floor(Date.now() / 450) % 2 === 0) {
        ctx.fillStyle = '#F7C844';
        ctx.font = "bold 10px 'Courier New', Courier, monospace";
        ctx.textAlign = 'right';
        ctx.fillText("PRESS 'A' TO CONTINUE ►", bx + boxW - 10, by + boxH - 16);
      }
    }

    // 9. Game Over Box
    if (state === 'GAMEOVER') {
      const boxW = 220;
      const boxH = 74;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#AD1C21';
      ctx.font = "bold 18px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("TRAIL ENDED!", VIEW_W / 2, by + 12);

      if (Math.floor(Date.now() / 480) % 2 === 0) {
        ctx.fillStyle = '#12AEA2';
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.fillText("PRESS 'A' TO RESTART", VIEW_W / 2, by + 44);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE') {
      drawTitleScreen();
    } else if (state === 'CUTSCENE') {
      drawCutsceneScreen();
    } else {
      drawGameplay();
    }

    // System Pause Overlay
    if (isPaused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const bw = 150, bh = 44;
      drawSNESWindow(Math.floor((VIEW_W - bw) / 2), Math.floor((VIEW_H - bh) / 2), bw, bh);
      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 16px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("PAUSED", VIEW_W / 2, VIEW_H / 2 + 1);
    }
  }

  // ==========================================
  // ARCADE CABINET POSTMESSAGE BRIDGE
  // ==========================================
  let inputState = { up: false, down: false, left: false, right: false };
  let inputTimers = { up: 0, down: 0, left: 0, right: 0 };
  let btnALast = 0;
  let btnBLast = 0;

  window.addEventListener('message', function(event) {
    const cmd = (typeof event.data === 'string') ? event.data : (event.data && (event.data.cmd || event.data.action || event.data.type));
    if (!cmd) return;

    const now = Date.now();

    if (cmd === 'PAUSE') { 
      isPaused = true; 
      pauseChiptuneTrack();
      inputState.up = inputState.down = inputState.left = inputState.right = false;
      return; 
    }
    if (cmd === 'RESUME') { 
      isPaused = false; 
      resumeChiptuneTrack();
      return; 
    }

    if (isPaused) return;

    if (cmd === 'BUTTON_A' && now - btnALast > 110) {
      btnALast = now;
      if (state === 'TITLE') {
        state = 'CUTSCENE';
        cutsceneScroll = 0;
        startChiptuneTrack();
      } else if (state === 'CUTSCENE') {
        level = 1;
        startLevelGameplay(true);
      } else if (state === 'LEVEL_POPUP') {
        startLevelGameplay(true);
      } else if (state === 'GAMEOVER') {
        level = 1;
        stopChiptuneTrack();
        startLevelGameplay(true);
        startChiptuneTrack();
      }
    }

    if (cmd === 'BUTTON_B' && now - btnBLast > 110) {
      btnBLast = now;
      if (state === 'CUTSCENE') {
        level = 1;
        startLevelGameplay(true);
      } else if (state === 'LEVEL_POPUP') {
        startLevelGameplay(true);
      }
    }

    const parseDpad = (dirCmd, pressCmd, releaseCmd, stateKey, dx, dy) => {
      if (cmd === pressCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy); 
      }
      else if (cmd === releaseCmd) {
        inputState[stateKey] = false;
      }
      else if (cmd === dirCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy);
      }
    };

    parseDpad('DPAD_UP', 'DPAD_UP_PRESS', 'DPAD_UP_RELEASE', 'up', 0, -1);
    parseDpad('DPAD_DOWN', 'DPAD_DOWN_PRESS', 'DPAD_DOWN_RELEASE', 'down', 0, 1);
    parseDpad('DPAD_LEFT', 'DPAD_LEFT_PRESS', 'DPAD_LEFT_RELEASE', 'left', -1, 0);
    parseDpad('DPAD_RIGHT', 'DPAD_RIGHT_PRESS', 'DPAD_RIGHT_RELEASE', 'right', 1, 0);

    if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'NEUTRAL') {
      inputState.up = inputState.down = inputState.left = inputState.right = false;
    }
  });

  function processHoldInputs() {
    const now = Date.now();
    const holdDelay = 145; 
    if (inputState.up && now - inputTimers.up > holdDelay) { inputTimers.up = now; move(0, -1); }
    if (inputState.down && now - inputTimers.down > holdDelay) { inputTimers.down = now; move(0, 1); }
    if (inputState.left && now - inputTimers.left > holdDelay) { inputTimers.left = now; move(-1, 0); }
    if (inputState.right && now - inputTimers.right > holdDelay) { inputTimers.right = now; move(1, 0); }
  }

  function loop() {
    if (!isPaused) {
      processHoldInputs();
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  resizeViewport();
  initGroundDetails();
  loop();
