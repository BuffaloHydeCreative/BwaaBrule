    'G2', 'D3', 'G2', 'D3', 'G2', 'E3', 'G2', 'D3',

  function initChiptuneAudio() {
    if (!chiptuneAudioCtx) {
      chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (chiptuneAudioCtx.state === 'suspended') {
      chiptuneAudioCtx.resume();
    }
  }

  function playChiptuneTone(freq, type, duration, volume) {
    if (!freq || !chiptuneAudioCtx) return;

    const osc = chiptuneAudioCtx.createOscillator();
    const gainNode = chiptuneAudioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, chiptuneAudioCtx.currentTime);

    gainNode.gain.setValueAtTime(volume, chiptuneAudioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, chiptuneAudioCtx.currentTime + duration - 0.015);

    osc.connect(gainNode);
    gainNode.connect(chiptuneAudioCtx.destination);

    osc.start();
    osc.stop(chiptuneAudioCtx.currentTime + duration);
  }

  function stepChiptuneTrack() {
    const leadNote = trainFiddleLead[currentChiptuneStep];
    const bassNote = runawayTrainBass[currentChiptuneStep];

    if (leadNote && CHIPTUNE_NOTES[leadNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[leadNote], 'square', CHIPTUNE_NOTE_LEN * 0.85, 0.06);
    }
    
    if (bassNote && CHIPTUNE_NOTES[bassNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[bassNote], 'triangle', CHIPTUNE_NOTE_LEN * 1.8, 0.35);
    }

    currentChiptuneStep = (currentChiptuneStep + 1) % 32;
  }

  function startChiptuneTrack() {
    initChiptuneAudio();
    if (!chiptuneIsPlaying) {
      chiptuneIsPlaying = true;
      currentChiptuneStep = 0;
      chiptuneInterval = setInterval(stepChiptuneTrack, CHIPTUNE_NOTE_LEN * 1000);
    }
  }

  function stopChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
      currentChiptuneStep = 0;
    }
  }

  function pauseChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
    }
  }

  function resumeChiptuneTrack() {
    if (!chiptuneIsPlaying && (state === 'PLAYING' || state === 'TRANSITION')) {

  // ==========================================
  // STYLIZED PIXEL TEXT RENDERER (SNES BLOCK)

  const FONT_5X7 = {
    'L': ["10000","10000","10000","10000","10000","10000","11111"],
    'A': ["01110","10001","10001","11111","10001","10001","10001"],
    'N': ["10001","11001","10101","10011","10001","10001","10001"],
    'D': ["11110","10001","10001","10001","10001","10001","11110"],

    'U': ["10001","10001","10001","10001","10001","10001","01110"],
    'E': ["11111","10000","10000","11110","10000","10000","11111"],
    'R': ["11110","10001","10001","11110","10100","10010","10001"],
    '!': ["00100","00100","00100","00100","00100","00000","00100"],
    ' ': ["00000","00000","00000","00000","00000","00000","00000"]
  };

  function drawStylizedTitle(text, centerX, startY, scale) {
    const spacing = 1;
    const totalCols = text.length * (5 + spacing) - spacing;
    let curX = Math.floor(centerX - (totalCols * scale) / 2);

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const glyph = FONT_5X7[ch] || FONT_5X7[' '];
      
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (glyph[r][c] === '1') {
            const px = curX + c * scale;
            const py = startY + r * scale;
            
            ctx.fillStyle = '#1c0507';
            ctx.fillRect(px + scale, py + scale, scale, scale);
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(px - 1, py, scale + 2, scale);
            ctx.fillRect(px, py - 1, scale, scale + 2);

            if (r < 2) ctx.fillStyle = '#F7C844';
            else if (r < 5) ctx.fillStyle = '#FB6604';
            else ctx.fillStyle = '#AD1C21';
            ctx.fillRect(px, py, scale, scale);
          }
        }
      }
      curX += (5 + spacing) * scale;
    }
  }

  function drawSNESWindow(x, y, w, h) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(x + 4, y + 4, w, h);

    ctx.fillStyle = '#182238';
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);

    ctx.fillStyle = '#F7C844';
    ctx.fillRect(x + 3, y + 3, w - 6, 1);
    ctx.fillRect(x + 3, y + h - 4, w - 6, 1);
    ctx.fillRect(x + 3, y + 3, 1, h - 6);
    ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
  }

  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0];
    for (let i = 1; i < words.length; i++) {
      let testLine = currentLine + " " + words[i];
      if (ctx.measureText(testLine).width < maxWidth) {
        currentLine = testLine;
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);
    return lines;
  }

  // ==========================================
  // WILD TERRAIN FEATURES & NATURAL SPAWNING
  // ==========================================
  function initGroundPatches() {
    groundPatches = [];
    for (let i = 0; i < 65; i++) {
      groundPatches.push({
        x: Math.random() * VIEW_W,
        y: Math.random() * VIEW_H,
        w: 4 + Math.floor(Math.random() * 14),
        h: 3 + Math.floor(Math.random() * 8),
        kind: i % 3 // 0: patch1, 1: patch2, 2: grass tuft
      });

  // Clear any obstacles that might overlap or block a creek crossing corridor
  function clearCreekCorridor(creekY, creekH, fordStart, fordEnd) {
    const padY = 44; // Generous vertical clearance above and below the creek
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      // Remove any obstacle inside the creek band or blocking the entry/exit funnel of the ford
      if (obs.y + obs.h > creekY - padY && obs.y < creekY + creekH + padY) {
        obstacles.splice(i, 1);
      }
    }
  }

  function spawnCreekFeature() {
    let fordCenter = Math.floor(VIEW_W * (0.42 + Math.random() * 0.16));
    let fordHalfW = 36; // 72px wide passable shallow ford
    let bufferW = 14;   // 14px shallow gravel/wading transition buffer on each side before deep water
    let creekY = -36;
    let creekH = 26;

    // Guarantee zero objects block the crossing or sit in the creek approaches
    clearCreekCorridor(creekY, creekH, fordCenter - fordHalfW - bufferW, fordCenter + fordHalfW + bufferW);

    terrainFeatures.push({
      kind: 'CREEK',
      x: 0,
      y: creekY,
      w: VIEW_W,
      h: creekH,
      fordStart: fordCenter - fordHalfW,
      fordEnd: fordCenter + fordHalfW,
      bufferW: bufferW
    });

    creeksSpawnedThisLevel++;
    // Space creeks far apart so strictly 2–3 creeks occur over a full 10-pelt level (~950–1250px)
    nextCreekSpawnDist = worldScrollDist + 950 + Math.floor(Math.random() * 350);
  }

  function spawnTerrainFeature() {
    let bIdx = (level - 1) % BIOMES.length;
    let bType = BIOMES[bIdx].type;

    // 1. Rocky Foothills: Impassable stepped rocky ledges jutting from left/right slopes
    if (bType === 'mountain') {
      let ledgeW = 72 + Math.floor(Math.random() * 44);
      let fromLeft = Math.random() > 0.5;
      let lx = fromLeft ? 0 : (VIEW_W - ledgeW);
      let lh = 26;
      terrainFeatures.push({
        kind: 'LEDGE',
        x: lx,
        y: -36,
        w: ledgeW,
        h: lh,
        fromLeft: fromLeft
      });
      obstacles.push({
        x: fromLeft ? ledgeW - 18 : lx - 6,
        y: -12,
        dx: 0,
        dy: 0,
        type: 'rock',
        w: 24,
        h: 18,
        scale: 3,
        dead: false
      });
    }

    // 2. Eastern Woodlands: Thick timber woods with a slalom clearing corridor
    if (bType === 'forest') {
      let clearingCenter = Math.floor(VIEW_W * (0.28 + Math.random() * 0.44));
      let clearingHalfW = 42;
      terrainFeatures.push({
        kind: 'WOODS',
        x: 0,
        y: -52,
        w: VIEW_W,
        h: 44,
        clearStart: clearingCenter - clearingHalfW,
        clearEnd: clearingCenter + clearingHalfW
      });
      let leftTreeX = Math.max(4, clearingCenter - clearingHalfW - 44);
      let rightTreeX = Math.min(VIEW_W - 44, clearingCenter + clearingHalfW + 6);
      if (clearingCenter - clearingHalfW > 32) {
        obstacles.push({ x: leftTreeX, y: -50, dx: 0, dy: 0, type: 'tree', w: 40, h: 40, scale: 4, dead: false });
      }
      if (VIEW_W - (clearingCenter + clearingHalfW) > 32) {
        obstacles.push({ x: rightTreeX, y: -46, dx: 0, dy: 0, type: 'tree', w: 40, h: 40, scale: 4, dead: false });
      }
    }
  }

  function spawnNaturalEntities() {
    let bIdx = (level - 1) % BIOMES.length;
    let bType = BIOMES[bIdx].type;

    // Prevent spawning inside or near any creek crossing or active terrain feature
    for (let tf of terrainFeatures) {
      let clearance = (tf.kind === 'CREEK') ? 68 : 22;
      if (tf.y < clearance) return;
    }

    // Chance to spawn a Golden Beaded Pelt in a fair, reachable spot
    if (Math.random() < 0.30) {
      let px = 28 + Math.random() * (VIEW_W - 76);
      obstacles.push({ x: px, y: -24, dx: 0, dy: 0, type: 'pelt', w: 20, h: 18, scale: 2, dead: false });
      return;
    }

    // Spawn natural cluster or roaming wildlife integrated with the scrolling ground
    let pool = [];
    if (bType === 'mountain') pool = ['rock', 'rock', 'shrub', 'fox'];
    else if (bType === 'desert') pool = ['rock', 'shrub', 'shrub', 'fox'];
    else if (bType === 'grass') pool = ['shrub', 'shrub', 'tree', 'fox'];
    else if (bType === 'forest') pool = ['shrub', 'tree', 'tree', 'fox'];

    let type = pool[Math.floor(Math.random() * pool.length)];
    let x = 14 + Math.random() * (VIEW_W - 64);

    if (type === 'fox') {
      let dir = Math.random() > 0.5 ? 0.65 : -0.65;
      obstacles.push({ x: x, y: -24, dx: dir, dy: 0, type: 'fox', w: 24, h: 18, scale: 3, dead: false });
    } else if (type === 'tree') {
      obstacles.push({ x: x, y: -44, dx: 0, dy: 0, type: 'tree', w: 40, h: 40, scale: 4, dead: false });
    } else if (type === 'rock') {
      obstacles.push({ x: x, y: -24, dx: 0, dy: 0, type: 'rock', w: 24, h: 18, scale: 3, dead: false });
      if (Math.random() > 0.45 && x + 28 < VIEW_W - 30) {
        obstacles.push({ x: x + 24, y: -16, dx: 0, dy: 0, type: 'shrub', w: 24, h: 18, scale: 3, dead: false });
      }
    } else {
      obstacles.push({ x: x, y: -24, dx: 0, dy: 0, type: 'shrub', w: 24, h: 18, scale: 3, dead: false });
    }
  }

  function startLevelGameplay(withRumble = true) {
    baseSpeed = 1.1 + (level * 0.14); 
    effectiveSpeed = baseSpeed;

    worldScrollDist = 0;
    creeksSpawnedThisLevel = 0;

    player = { x: (VIEW_W / 2) - 20, y: VIEW_H - 58, dead: false, w: 40, h: 48, inCreek: false, inBrush: false };

  function triggerRumble() {
    state = 'TRANSITION';
    shakeFrames = 95;
    buffaloes = [];
    for (let i = 0; i < 20; i++) {
      buffaloes.push({
        x: Math.random() * (VIEW_W - 48),
        y: VIEW_H + Math.random() * 240, 
        dy: -(3.2 + Math.random() * 2.2)
      });
    }

  function move(dx, dy) {
    if (state !== 'PLAYING') return;
    let step = (player.inCreek || player.inBrush) ? 13 : 20; 
    let nx = player.x + (dx * step);
    let ny = player.y + (dy * step);

    // Prevent stepping directly into impassable rocky ledges
    for (let tf of terrainFeatures) {
      if (tf.kind === 'LEDGE') {
        if (nx + 8 < tf.x + tf.w && nx + player.w - 8 > tf.x &&
            ny + 10 < tf.y + tf.h && ny + player.h - 6 > tf.y) {
          return;
        }
      }
    }

    if (nx >= 4 && nx <= VIEW_W - player.w - 4) player.x = nx;
    if (ny >= HUD_HEIGHT + 2 && ny <= VIEW_H - player.h - 4) player.y = ny;
  }

  // ==========================================
  // MAIN UPDATE LOOP
  // ==========================================
  function update() {
    frame++;

    if (state === 'TITLE') {
      return;
    }

    if (state === 'CUTSCENE') {
      cutsceneScroll += 1.5;
      return;
    }

    if (state === 'LEVEL_POPUP' || state === 'GAMEOVER') {
      return;
    }

    if (state === 'PLAYING') {
      player.inCreek = false;
      player.inBrush = false;

      const pLeft = player.x + 10;
      const pRight = player.x + player.w - 10;
      const pTop = player.y + 12;
      const pBottom = player.y + player.h - 6;
      const pCenterX = player.x + player.w / 2;

      for (let i = terrainFeatures.length - 1; i >= 0; i--) {
        let tf = terrainFeatures[i];
        
        if (pLeft < tf.x + tf.w && pRight > tf.x && pTop < tf.y + tf.h && pBottom > tf.y) {
          if (tf.kind === 'LEDGE') {
            player.y = tf.y + tf.h - 10;
            if (player.y + player.h > VIEW_H + 6) {
              state = 'GAMEOVER';
              stopChiptuneTrack();
              return;
            }
          } else if (tf.kind === 'CREEK') {
            // Includes generous buffer zone between the shallow ford and deep water flanks
            const safeMin = tf.fordStart - tf.bufferW;
            const safeMax = tf.fordEnd + tf.bufferW;
            if (pCenterX < safeMin || pCenterX > safeMax) {
              state = 'GAMEOVER';
              stopChiptuneTrack();
              return;
            } else {
              player.inCreek = true;
            }
          } else if (tf.kind === 'WOODS') {
            if (pCenterX < tf.clearStart || pCenterX > tf.clearEnd) {
              player.inBrush = true;
            }
          }
        }
      }

      effectiveSpeed = (player.inCreek || player.inBrush) ? (baseSpeed * 0.55) : baseSpeed;
      worldScrollDist += effectiveSpeed;

      for (let gp of groundPatches) {
        gp.y += effectiveSpeed;
        if (gp.y > VIEW_H) {
          gp.y = -10;
          gp.x = Math.random() * VIEW_W;
        }
      }

      for (let i = terrainFeatures.length - 1; i >= 0; i--) {
        terrainFeatures[i].y += effectiveSpeed;
        if (terrainFeatures[i].y > VIEW_H + 20) {
          terrainFeatures.splice(i, 1);
        }
      }

      // Rare Creek Spawning (strictly 2–3 creeks over a full playable level in Dry Prairie / Red River Valley)
      let bIdx = (level - 1) % BIOMES.length;
      let bType = BIOMES[bIdx].type;
      if ((bType === 'desert' || bType === 'grass') && creeksSpawnedThisLevel < 3 && worldScrollDist >= nextCreekSpawnDist) {
        spawnCreekFeature();
      }

      // Periodic terrain spawning for Mountains (ledges) and Forest (thick woods)
      const terrainInterval = 225;
      if (Math.floor(worldScrollDist / terrainInterval) > Math.floor((worldScrollDist - effectiveSpeed) / terrainInterval)) {
        spawnTerrainFeature();
      }

      const objInterval = Math.max(54, 118 - (level * 8));
      if (Math.floor(worldScrollDist / objInterval) > Math.floor((worldScrollDist - effectiveSpeed) / objInterval)) {
        spawnNaturalEntities();
      }

      // Update obstacles (anchored to ground scroll + any horizontal wildlife movement)
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x += obs.dx;
        if (obs.x < 4 || obs.x + obs.w > VIEW_W - 4) obs.dx *= -1;
        obs.y += effectiveSpeed;

        let inset = (obs.type === 'pelt') ? 0 : 4;

        if (!obs.dead && 
            pLeft < obs.x + obs.w - inset && 
            pRight > obs.x + inset &&
            pTop < obs.y + obs.h - inset && 
            pBottom > obs.y + inset) {
          
          if (obs.type === 'pelt') {
            peltsCollected++;
            obs.dead = true; 
            if (peltsCollected >= 10) {
              level++;
              state = 'LEVEL_POPUP';
            }
          } else {
            state = 'GAMEOVER';
            stopChiptuneTrack(); 
          }
        }

        if (obs.y > VIEW_H + 10 || obs.dead) obstacles.splice(i, 1);
      }

    } else if (state === 'TRANSITION') {
      shakeFrames--;
      for (let gp of groundPatches) {
        gp.y += baseSpeed * 1.4;
        if (gp.y > VIEW_H) {
          gp.y = -10;
          gp.x = Math.random() * VIEW_W;
        }
      }

      buffaloes.forEach(b => b.y += b.dy);
      if (shakeFrames <= 0) {
        state = 'PLAYING';
      }
    }
  }

  // ==========================================
  // PARALLAX SCENERY & WILDERNESS RENDERING
  // ==========================================
  function drawPrairieParallax(scrollOffset, isCutscene) {
    const skyBands = ['#241438', '#541b36', '#8f2929', '#c95822', '#eb9634', '#f7c844'];
    const horizonY = Math.floor(VIEW_H * 0.56);
    const bandH = Math.ceil(horizonY / skyBands.length);
    for (let i = 0; i < skyBands.length; i++) {
      ctx.fillStyle = skyBands[i];
      ctx.fillRect(0, i * bandH, VIEW_W, bandH + 1);
    }

    ctx.fillStyle = '#fff5b8';
    ctx.fillRect(Math.floor(VIEW_W * 0.72), Math.floor(horizonY * 0.35), 22, 22);
    ctx.fillStyle = '#f7c844';
    ctx.fillRect(Math.floor(VIEW_W * 0.72) - 2, Math.floor(horizonY * 0.35) + 2, 26, 18);

    ctx.fillStyle = '#f7b267';
    for (let c = 0; c < 4; c++) {
      let cx = ((c * 110) - Math.floor(scrollOffset * 0.15)) % (VIEW_W + 60);
      if (cx < -60) cx += VIEW_W + 60;
      let cy = 18 + (c % 2) * 16;
      ctx.fillRect(cx, cy, 36, 6);
      ctx.fillRect(cx + 6, cy - 4, 22, 4);
    }

    ctx.fillStyle = '#472836';
    for (let m = -1; m < 6; m++) {
      let mx = (m * 80) - (Math.floor(scrollOffset * 0.35) % 80);
      ctx.fillRect(mx, horizonY - 22, 60, 22);
      ctx.fillRect(mx + 12, horizonY - 32, 36, 10);
      ctx.fillRect(mx + 22, horizonY - 38, 16, 6);
    }

    ctx.fillStyle = '#5e4318';
    ctx.fillRect(0, horizonY, VIEW_W, 18);
    ctx.fillStyle = '#382a10';
    for (let t = -1; t < 12; t++) {
      let tx = (t * 34) - (Math.floor(scrollOffset * 0.7) % 34);
      ctx.fillRect(tx + 4, horizonY - 10, 6, 10);
      ctx.fillRect(tx + 2, horizonY - 6, 10, 6);
    }

    const groundY = horizonY + 14;
    ctx.fillStyle = '#8a681a';
    ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

    ctx.fillStyle = '#755614';
    ctx.fillRect(0, groundY + 18, VIEW_W, 14);
    ctx.fillStyle = '#9c7821';
    ctx.fillRect(0, groundY + 42, VIEW_W, 16);

    for (let g = 0; g < 28; g++) {
      let gx = ((g * 27) - Math.floor(scrollOffset * 2.2)) % (VIEW_W + 20);
      if (gx < -20) gx += VIEW_W + 20;
      let gy = groundY + 6 + ((g * 13) % Math.max(24, VIEW_H - groundY - 12));
      ctx.fillStyle = (g % 2 === 0) ? '#bd9632' : '#5e4310';
      ctx.fillRect(gx, gy, 3, 6);
      ctx.fillRect(gx + 4, gy + 2, 3, 4);
    }

    const bob = Math.floor(frame / 6) % 2 === 0 ? 0 : -2;
    const chaseY = groundY + Math.min(22, Math.floor((VIEW_H - groundY) * 0.25));
    const chaseBaseX = isCutscene 
      ? ((Math.floor(frame * 1.4) % (VIEW_W + 160)) - 130)
      : Math.floor(VIEW_W * 0.52);

    ctx.fillStyle = '#d4d0c5';
    for (let d = 0; d < 6; d++) {
      let dx = chaseBaseX - 45 + ((d * 23 + frame * 2) % 130);
      let dy = chaseY + 24 - ((d * 7 + frame) % 8);
      ctx.fillRect(dx, dy, 3, 3);
    }

    drawSprite(chaseBaseX + 46, chaseY + bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);
    drawSprite(chaseBaseX + 16, chaseY + 10 - bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);
    drawSprite(chaseBaseX + 34, chaseY + 18 + bob, sprBuffaloSide, PAL_BUFFALO_SIDE, 2);

    drawSprite(chaseBaseX - 42, chaseY + 6 - bob, sprHunterSide, PAL_HUNTER_SIDE, 2);
  }

  function drawTitleScreen() {

    const pad = 14;

    const story = "THE BUFFALO HERD THUNDERS ACROSS THE WILD LAND! RIDE NORTH ON YOUR RUNNER STEED, FORD CREEKS AT SHALLOWS, AND GATHER 10 GOLDEN PELTS PER REGION.";

      ctx.fillText("PRESS 'A' TO RIDE ►", bx + boxW - 10, by + boxH - 16);

  function drawTerrainFeatures() {
    for (let tf of terrainFeatures) {
      const y = Math.floor(tf.y);

      if (tf.kind === 'LEDGE') {
        ctx.fillStyle = '#2c3338';
        ctx.fillRect(tf.x, y, tf.w, tf.h);
        ctx.fillStyle = '#78848c';
        ctx.fillRect(tf.x, y, tf.w, tf.h - 6);
        ctx.fillStyle = '#9aa6b0';
        ctx.fillRect(tf.x, y, tf.w, 5);
        ctx.fillStyle = '#434d54';
        for (let sx = tf.x + 8; sx < tf.x + tf.w - 6; sx += 14) {
          ctx.fillRect(sx, y + 6, 3, tf.h - 10);
        }
        const capX = tf.fromLeft ? (tf.x + tf.w - 6) : tf.x;
        ctx.fillStyle = '#1c2024';
        ctx.fillRect(capX, y, 6, tf.h);
      }

      if (tf.kind === 'CREEK') {
        // Organic winding creek banks
        ctx.fillStyle = '#4a3825';
        ctx.fillRect(0, y - 3, VIEW_W, tf.h + 6);

        // Deep rushing creek water on flanks
        ctx.fillStyle = '#0f6f9e';
        ctx.fillRect(0, y, VIEW_W, tf.h);

        // Transitional Wading Buffer Zone (gradual sandy/shallow shelf before deep water)
        const bufStart = tf.fordStart - tf.bufferW;
        const bufTotalW = (tf.fordEnd - tf.fordStart) + (tf.bufferW * 2);
        ctx.fillStyle = '#2088ab';
        ctx.fillRect(bufStart, y, bufTotalW, tf.h);

        // Shallow passable gravel/pebble ford in the center
        const fordW = tf.fordEnd - tf.fordStart;
        ctx.fillStyle = '#38a3b8';
        ctx.fillRect(tf.fordStart, y, fordW, tf.h);

        // Stepping cobbles & sandbar ripples across the shallow ford and buffer edges
        ctx.fillStyle = '#9c8b70';
        for (let cx = bufStart + 4; cx < bufStart + bufTotalW - 6; cx += 12) {
          ctx.fillRect(cx, y + 5, 5, 4);
          ctx.fillRect(cx + 3, y + 15, 6, 4);
        }

        // Animated water current lines & whitewater foam
        ctx.fillStyle = '#a3e8f5';
        const rippleShift = Math.floor(frame * 0.8) % 24;
        for (let rx = -24; rx < VIEW_W; rx += 24) {
          ctx.fillRect(rx + rippleShift, y + 6, 8, 2);
          ctx.fillRect(rx + ((rippleShift + 12) % 24), y + 17, 10, 2);
        }
      }

      if (tf.kind === 'WOODS') {
        ctx.fillStyle = '#142b0d';
        ctx.fillRect(0, y, tf.clearStart, tf.h);
        ctx.fillRect(tf.clearEnd, y, VIEW_W - tf.clearEnd, tf.h);

        ctx.fillStyle = '#2d591f';
        for (let bx = 4; bx < tf.clearStart - 6; bx += 12) {
          ctx.fillRect(bx, y + 6, 6, 5);
          ctx.fillRect(bx + 3, y + 24, 7, 6);
        }
        for (let bx = tf.clearEnd + 4; bx < VIEW_W - 6; bx += 12) {
          ctx.fillRect(bx, y + 8, 6, 5);
          ctx.fillRect(bx + 3, y + 26, 7, 6);
        }
      }
    }
  }

  function drawGameplay() {
    let shakeX = 0, shakeY = 0;
    if (state === 'TRANSITION') {
      shakeX = (Math.random() - 0.5) * 6;
      shakeY = (Math.random() - 0.5) * 6;
    }

    ctx.save();
    
    let bIdx = (level - 1) % BIOMES.length;
    let b = BIOMES[bIdx];

    // 1. Wild Untamed Earth & Grassland Base
    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // 2. Organic Ground Patches & Tallgrass Tufts
    for (let gp of groundPatches) {
      const gx = Math.floor(gp.x);
      const gy = Math.floor(gp.y);
      if (gp.kind === 0) {
        ctx.fillStyle = b.patch1;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else if (gp.kind === 1) {
        ctx.fillStyle = b.patch2;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else {
        ctx.fillStyle = b.tuftDark;
        ctx.fillRect(gx, gy + 2, 2, 4);
        ctx.fillStyle = b.tuft;
        ctx.fillRect(gx + 1, gy, 2, 5);
        ctx.fillRect(gx + 4, gy + 1, 2, 4);
      }
    }

    ctx.translate(shakeX, shakeY);

    // 3. Draw Integrated Terrain Features
    drawTerrainFeatures();

    // 4. Draw Natural Obstacles & Golden Pelts with Ground Shadows
    obstacles.forEach(obs => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
      ctx.fillRect(Math.floor(obs.x + 2), Math.floor(obs.y + obs.h - 2), obs.w - 4, 4);

      let pal, spr;
      if (obs.type === 'rock') { spr = sprRock; pal = PAL_ROCK; }
      else if (obs.type === 'tree') { spr = sprTree; pal = PAL_TREE; }
      else if (obs.type === 'shrub') { spr = sprShrub; pal = PAL_SHRUB; }
      else if (obs.type === 'fox') { spr = sprFox; pal = PAL_FOX; }
      else if (obs.type === 'pelt') { spr = sprPelt; pal = PAL_PELT; }
      
      let flip = (obs.type === 'fox' && obs.dx < 0);
      drawSprite(obs.x, obs.y, spr, pal, obs.scale, flip);
    });

    // 5. Draw Sculpted Mounted Hunter & Horse
    if (state !== 'GAMEOVER' || frame % 10 < 5) { 
      ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
      ctx.fillRect(Math.floor(player.x + 6), Math.floor(player.y + player.h - 6), player.w - 12, 6);

      if (player.inCreek) {
        ctx.fillStyle = '#d4f6fc';
        ctx.fillRect(Math.floor(player.x + 4), Math.floor(player.y + player.h - 8), player.w - 8, 3);
      }

      let animSpeed = (player.inCreek || player.inBrush) ? 11 : 7;
      let animFrame = (Math.floor(frame / animSpeed) % 2 === 0) ? sprPlayerAnim[0] : sprPlayerAnim[1];
      drawSprite(player.x, player.y, animFrame, PAL_PLAYER, 2);
    }

    // 6. Draw Rumbling Buffalo Herd Transition
    if (state === 'TRANSITION') {
      buffaloes.forEach(buf => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
        ctx.fillRect(Math.floor(buf.x + 6), Math.floor(buf.y + 44), 36, 7);
        drawSprite(buf.x, buf.y, sprBuffaloTop, PAL_BUFFALO_TOP, 3);
      });
    }

    ctx.restore();
    
    // 7. Top HUD Bar (Anchored y = 0)
    ctx.fillStyle = '#182238';
    ctx.fillRect(0, 0, VIEW_W, HUD_HEIGHT);
    ctx.fillStyle = '#F7C844'; 
    ctx.fillRect(0, HUD_HEIGHT - 2, VIEW_W, 2);

    ctx.fillStyle = '#F7C844';
    ctx.font = "bold 11px 'Courier New', Courier, monospace";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 6, HUD_HEIGHT / 2);

    ctx.fillStyle = '#12AEA2';
    ctx.textAlign = 'right';
    ctx.fillText(`PELTS:${peltsCollected}/10 LVL:${level}`, VIEW_W - 6, HUD_HEIGHT / 2);

    // 8. Pop-up Cutscene Text Box on Level Change
    if (state === 'LEVEL_POPUP') {
      const boxW = VIEW_W - 32;
      const boxH = 104;
      const bx = 16;
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#12AEA2';
      ctx.font = "bold 11px 'Courier New', Courier, monospace";
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`REGION ${level}: ${b.name}`, bx + 10, by + 8);

      ctx.fillStyle = '#F4F4F4';
      ctx.font = "10px 'Courier New', Courier, monospace";
      const lines = wrapText(b.desc, boxW - 20);
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], bx + 10, by + 25 + (i * 13));
      }

      if (Math.floor(Date.now() / 450) % 2 === 0) {
        ctx.fillStyle = '#F7C844';
        ctx.font = "bold 10px 'Courier New', Courier, monospace";
        ctx.textAlign = 'right';
        ctx.fillText("PRESS 'A' TO CONTINUE ►", bx + boxW - 10, by + boxH - 16);
      }
    }

    // 9. Game Over Box
    if (state === 'GAMEOVER') {
      const boxW = 220;
      const boxH = 74;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#AD1C21';
      ctx.font = "bold 18px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("TRAIL ENDED!", VIEW_W / 2, by + 12);

      if (Math.floor(Date.now() / 480) % 2 === 0) {
        ctx.fillStyle = '#12AEA2';
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.fillText("PRESS 'A' TO RESTART", VIEW_W / 2, by + 44);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE') {
      drawTitleScreen();
    } else if (state === 'CUTSCENE') {
      drawCutsceneScreen();
    } else {
      drawGameplay();
    }

    if (isPaused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const bw = 150, bh = 44;
      drawSNESWindow(Math.floor((VIEW_W - bw) / 2), Math.floor((VIEW_H - bh) / 2), bw, bh);
      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 16px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("PAUSED", VIEW_W / 2, VIEW_H / 2 + 1);
    }
  }

  // ==========================================
  // ARCADE CABINET POSTMESSAGE BRIDGE
  // ==========================================
  let inputState = { up: false, down: false, left: false, right: false };
  let inputTimers = { up: 0, down: 0, left: 0, right: 0 };
  let btnALast = 0;
  let btnBLast = 0;

  window.addEventListener('message', function(event) {
    const cmd = (typeof event.data === 'string') ? event.data : (event.data && (event.data.cmd || event.data.action || event.data.type));
    if (!cmd) return;

    const now = Date.now();

    if (cmd === 'PAUSE') { 
      isPaused = true; 
      pauseChiptuneTrack();
      inputState.up = inputState.down = inputState.left = inputState.right = false;
      return; 
    }
    if (cmd === 'RESUME') { 
      isPaused = false; 
      resumeChiptuneTrack();
      return; 
    }

    if (isPaused) return;

    if (cmd === 'BUTTON_A' && now - btnALast > 110) {
      btnALast = now;
      if (state === 'TITLE') {
        state = 'CUTSCENE';
        cutsceneScroll = 0;
        startChiptuneTrack();
      } else if (state === 'CUTSCENE') {
        level = 1;
        startLevelGameplay(true);
      } else if (state === 'LEVEL_POPUP') {
        startLevelGameplay(true);
      } else if (state === 'GAMEOVER') {
        level = 1;
        stopChiptuneTrack();
        startLevelGameplay(true);
        startChiptuneTrack();
      }
    }

    if (cmd === 'BUTTON_B' && now - btnBLast > 110) {
      btnBLast = now;
      if (state === 'CUTSCENE') {
        level = 1;
        startLevelGameplay(true);
      } else if (state === 'LEVEL_POPUP') {
        startLevelGameplay(true);
      }
    }

    const parseDpad = (dirCmd, pressCmd, releaseCmd, stateKey, dx, dy) => {
      if (cmd === pressCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy); 
      }
      else if (cmd === releaseCmd) {
        inputState[stateKey] = false;
      }
      else if (cmd === dirCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy);
      }
    };

    parseDpad('DPAD_UP', 'DPAD_UP_PRESS', 'DPAD_UP_RELEASE', 'up', 0, -1);
    parseDpad('DPAD_DOWN', 'DPAD_DOWN_PRESS', 'DPAD_DOWN_RELEASE', 'down', 0, 1);
    parseDpad('DPAD_LEFT', 'DPAD_LEFT_PRESS', 'DPAD_LEFT_RELEASE', 'left', -1, 0);
    parseDpad('DPAD_RIGHT', 'DPAD_RIGHT_PRESS', 'DPAD_RIGHT_RELEASE', 'right', 1, 0);

    if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'NEUTRAL') {
      inputState.up = inputState.down = inputState.left = inputState.right = false;
    }
  });

  function processHoldInputs() {
    const now = Date.now();
    const holdDelay = 145; 
    if (inputState.up && now - inputTimers.up > holdDelay) { inputTimers.up = now; move(0, -1); }
    if (inputState.down && now - inputTimers.down > holdDelay) { inputTimers.down = now; move(0, 1); }
    if (inputState.left && now - inputTimers.left > holdDelay) { inputTimers.left = now; move(-1, 0); }
    if (inputState.right && now - inputTimers.right > holdDelay) { inputTimers.right = now; move(1, 0); }
  }

  function loop() {
    if (!isPaused) {
      processHoldInputs();
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  resizeViewport();
  initGroundPatches();
  loop();

</script>
