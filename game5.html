  function initChiptuneAudio() {
    if (!chiptuneAudioCtx) {
      chiptuneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (chiptuneAudioCtx.state === 'suspended') {
      chiptuneAudioCtx.resume();
    }
  }

  function playChiptuneTone(freq, type, duration, volume) {
    if (!freq || !chiptuneAudioCtx) return;

    const osc = chiptuneAudioCtx.createOscillator();
    const gainNode = chiptuneAudioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, chiptuneAudioCtx.currentTime);

    gainNode.gain.setValueAtTime(volume, chiptuneAudioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, chiptuneAudioCtx.currentTime + duration - 0.015);

    osc.connect(gainNode);
    gainNode.connect(chiptuneAudioCtx.destination);

    osc.start();
    osc.stop(chiptuneAudioCtx.currentTime + duration);
  }

  function stepChiptuneTrack() {
    const leadNote = trainFiddleLead[currentChiptuneStep];
    const bassNote = runawayTrainBass[currentChiptuneStep];

    if (leadNote && CHIPTUNE_NOTES[leadNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[leadNote], 'square', CHIPTUNE_NOTE_LEN * 0.85, 0.06);
    }
    
    if (bassNote && CHIPTUNE_NOTES[bassNote]) {
      playChiptuneTone(CHIPTUNE_NOTES[bassNote], 'triangle', CHIPTUNE_NOTE_LEN * 1.8, 0.35);
    }

    currentChiptuneStep = (currentChiptuneStep + 1) % 32;
  }

  function startChiptuneTrack() {
    initChiptuneAudio();
    if (!chiptuneIsPlaying) {
      chiptuneIsPlaying = true;
      currentChiptuneStep = 0;
      chiptuneInterval = setInterval(stepChiptuneTrack, CHIPTUNE_NOTE_LEN * 1000);
    }
  }

  function stopChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
      currentChiptuneStep = 0;
    }
  }

  function pauseChiptuneTrack() {
    if (chiptuneIsPlaying) {
      clearInterval(chiptuneInterval);
      chiptuneIsPlaying = false;
    }
  }

  function resumeChiptuneTrack() {
    if (!chiptuneIsPlaying && (state === 'PLAYING' || state === 'FRAME_SLIDE' || state === 'LEVEL_END_CUTSCENE')) {

  const drawSprite = (x, y, matrix, palette, scale = 2, flipX = false) => {
    const rows = matrix.length;
    const cols = matrix[0].length;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let v = matrix[r][c];
        if (v > 0 && palette[v]) {
          ctx.fillStyle = palette[v];
          let drawX = flipX ? (x + (cols - 1 - c) * scale) : (x + c * scale);
          ctx.fillRect(Math.floor(drawX), Math.floor(y + r * scale), scale, scale);
        }
      }
    }
  };

  function drawStylizedTitle(text, centerX, startY, scale) {
    const spacing = 1;
    const totalCols = text.length * (5 + spacing) - spacing;
    let curX = Math.floor(centerX - (totalCols * scale) / 2);

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const glyph = FONT_5X7[ch] || FONT_5X7[' '];
      
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (glyph[r][c] === '1') {
            const px = curX + c * scale;
            const py = startY + r * scale;
            
            ctx.fillStyle = '#1c0507';
            ctx.fillRect(px + scale, py + scale, scale, scale);
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(px - 1, py, scale + 2, scale);
            ctx.fillRect(px, py - 1, scale, scale + 2);

            if (r < 2) ctx.fillStyle = '#F7C844';
            else if (r < 5) ctx.fillStyle = '#FB6604';
            else ctx.fillStyle = '#AD1C21';
            ctx.fillRect(px, py, scale, scale);
          }
        }
      }
      curX += (5 + spacing) * scale;
    }
  }

  function drawSNESWindow(x, y, w, h) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.fillRect(x + 4, y + 4, w, h);

    ctx.fillStyle = '#182238';
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);

    ctx.fillStyle = '#F7C844';
    ctx.fillRect(x + 3, y + 3, w - 6, 1);
    ctx.fillRect(x + 3, y + h - 4, w - 6, 1);
    ctx.fillRect(x + 3, y + 3, 1, h - 6);
    ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
  }

  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    let lines = [];
    let currentLine = words[0];
    for (let i = 1; i < words.length; i++) {
      let testLine = currentLine + " " + words[i];
      if (ctx.measureText(testLine).width < maxWidth) {
        currentLine = testLine;
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);
    return lines;
  }

  // ==========================================
  // 4-ZONE BESPOKE LEVEL GENERATOR (LOGICALLY CONNECTED ACROSS ALL 4 FRAMES)
  // ==========================================
  function generateGroundPatches(minY, maxY) {
    let patches = [];
    for (let i = 0; i < 42; i++) {
      patches.push({
        x: Math.random() * VIEW_W,
        y: minY + Math.random() * (maxY - minY),
        w: 4 + Math.floor(Math.random() * 14),
        h: 3 + Math.floor(Math.random() * 8),
        kind: i % 3
      });
    }
    return patches;
  }

  function addWildlifeLane(dynamics, y, aType, dir, speedScale, count = 2) {
    let baseSpd = 0.78;
    let w = 24, h = 14, scale = 2;

    if (aType === 'FOX') { baseSpd = 1.12; w = 24; h = 14; }
    else if (aType === 'MOOSE') { baseSpd = 0.62; w = 32; h = 24; }
    else if (aType === 'DEER') { baseSpd = 0.92; w = 28; h = 20; }
    else if (aType === 'SNAKE') { baseSpd = 0.76; w = 24; h = 12; }

    for (let c = 0; c < count; c++) {
      let startX = (c * (VIEW_W / count)) + Math.random() * 36;
      dynamics.push({
        type: aType,
        x: startX % VIEW_W,
        y: y,
        w: w,
        h: h,
        vx: dir * baseSpd * speedScale,
        scale: scale
      });
    }
  }

  function createHLogs(riverY, laneConfigs) {
    let logs = [];
    const laneH = 22;
    for (let i = 0; i < laneConfigs.length; i++) {
      let cfg = laneConfigs[i];
      for (let c = 0; c < cfg.count; c++) {
        logs.push({
          x: c * (VIEW_W / cfg.count) + 14,
          y: riverY + i * laneH + 2,
          w: cfg.logW,
          h: laneH - 4,
          vx: cfg.vx
        });
      }
    }
    return logs;
  }

  function buildFrameData(fIdx) {
    const bIdx = (level - 1) % BIOMES.length;
    const bType = BIOMES[bIdx].type;
    const cycleLoop = Math.floor((level - 1) / BIOMES.length);
    const speedScale = 1 + (cycleLoop * 0.25);

    const safeBottomH = (fIdx === 0) ? 46 : 14;
    const safeTopH = (fIdx === 3) ? 54 : HUD_HEIGHT + 8;
    const playTop = safeTopH;
    const playBottom = VIEW_H - safeBottomH;
    const playHeight = Math.max(90, playBottom - playTop);

    let statics = [];
    let dynamics = [];
    let waters = [];
    let groundPatches = generateGroundPatches(playTop, playBottom);

    // ---------------------------------------------------------
    // LEVEL 1: ROCKY FOOTHILLS (4-Zone Downhill Glacial Descent, NO Rivers/Creeks)
    // Zone 0: Glacial Cart Camp & Upper Crags -> Zone 1: Steep Talus Switchbacks
    // Zone 2: Lower Foothill Ledges -> Zone 3: Valley Floor & Buffalo Herd
    // ---------------------------------------------------------
    if (bType === 'mountain') {
      const numRows = 3;
      const rowH = playHeight / numRows;

      for (let r = 0; r < numRows; r++) {
        let ry = Math.floor(playTop + r * rowH + 6);
        let fromLeft = (r + fIdx) % 2 === 0;
        let ledgeW = 92 + ((r * 17 + fIdx * 11) % 26);
        let lx = fromLeft ? 0 : (VIEW_W - ledgeW);

        statics.push({
          type: 'LEDGE',
          x: lx,
          y: ry,
          w: ledgeW,
          h: 22,
          fromLeft: fromLeft
        });

        let rockX = fromLeft ? (VIEW_W - 44) : 14;
        statics.push({
          type: 'ROCK',
          x: rockX,
          y: ry + 2,
          w: 30,
          h: 18
        });

        let wy = Math.floor(ry + 24);
        if (wy + 20 < playBottom) {
          let animal = ((r + fIdx) % 3 === 0) ? 'MOOSE' : (((r + fIdx) % 3 === 1) ? 'FOX' : 'DEER');
          let dir = fromLeft ? -1 : 1;
          addWildlifeLane(dynamics, wy, animal, dir, speedScale, animal === 'MOOSE' ? 1 : 2);
        }
      }
    }

    // ---------------------------------------------------------
    // LEVEL 2: UPPER MISSOURI PLAINS (4-Zone Connected River & Open Plains)
    // Zone 0: Tipi Village Barrier & Upper Missouri River (mid 2/3) with Shaded Logs
    // Zone 1: Missouri Tributary Fork (full edge-to-edge river) & Prairie Ridges
    // Zone 2: Wide Sun-Baked Plains & Tallgrass Stands
    // Zone 3: Open Plains Horizon & Thundering Buffalo Herd
    // ---------------------------------------------------------
    else if (bType === 'missouri') {
      if (fIdx === 0) {
        // Near-side Tipi Village Barrier (south of river) with central village gate
        const tipiY = Math.floor(playTop + playHeight * 0.62);
        statics.push({ type: 'TIPI', x: 18, y: tipiY, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: 64, y: tipiY + 4, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: VIEW_W - 92, y: tipiY + 4, w: 28, h: 26 });
        statics.push({ type: 'TIPI', x: VIEW_W - 46, y: tipiY, w: 28, h: 26 });

        // Upper Missouri River (full West-to-East span across viewport)
        const riverY = Math.floor(playTop + playHeight * 0.20);
        const logs = createHLogs(riverY, [
          { vx: 0.95 * speedScale, logW: 64, count: 2 },
          { vx: -1.15 * speedScale, logW: 56, count: 2 }
        ]);
        waters.push({
          name: 'UPPER MISSOURI',
          orientation: 'H',
          x: 0,
          y: riverY,
          w: VIEW_W,
          h: 44,
          mode: 'LOGS',
          platforms: logs
        });

        addWildlifeLane(dynamics, tipiY + 32, 'FOX', 1, speedScale, 2);
      } else if (fIdx === 1) {
        // Missouri Tributary Fork (full West-to-East span) + Prairie Boulders
        const riverY = Math.floor(playTop + playHeight * 0.44);
        const logs = createHLogs(riverY, [
          { vx: -1.0 * speedScale, logW: 60, count: 2 },
          { vx: 1.2 * speedScale, logW: 54, count: 2 }
        ]);
        waters.push({
          name: 'MILK RIVER FORK',
          orientation: 'H',
          x: 0,
          y: riverY,
          w: VIEW_W,
          h: 44,
          mode: 'LOGS',
          platforms: logs
        });

        statics.push({ type: 'ROCK', x: 34, y: riverY + 52, w: 30, h: 18 });
        statics.push({ type: 'TALLGRASS', x: VIEW_W - 72, y: riverY + 52, w: 30, h: 18 });
        statics.push({ type: 'TALLGRASS', x: 78, y: riverY - 26, w: 30, h: 18 });
        addWildlifeLane(dynamics, riverY - 42, 'DEER', 1, speedScale, 2);
      } else {
        // Zones 2 & 3: Open Plains transition with tallgrass clumps and swift plains wildlife
        const rows = 3;
        const rStep = playHeight / rows;
        for (let r = 0; r < rows; r++) {
          let ry = Math.floor(playTop + r * rStep + 8);
          let gx1 = 26 + (((r + fIdx) * 74) % (VIEW_W - 120));
          let gx2 = gx1 + 68;
          statics.push({ type: 'TALLGRASS', x: gx1, y: ry, w: 30, h: 18 });
          if (gx2 < VIEW_W - 36) {
            statics.push({ type: 'TALLGRASS', x: gx2, y: ry + 4, w: 30, h: 18 });
          }

          let aType = ((r + fIdx) % 3 === 0) ? 'DEER' : (((r + fIdx) % 3 === 1) ? 'FOX' : 'SNAKE');
          addWildlifeLane(dynamics, ry + 22, aType, ((r + fIdx) % 2 === 0 ? 1 : -1), speedScale, 2);
        }
      }
    }

    // ---------------------------------------------------------
    // LEVEL 3: RED & ASSINIBOINE RIVERS (4-Zone Connected River System)
    // Zone 0: Vertical Red River (runs full top-to-bottom of Zone 0) + Village Log Houses
    // Zone 1: Vertical Red River continues seamlessly from Zone 0 -> bends into The Forks!
    // Zone 2: Horizontal Assiniboine River (full West-to-East) + Village Log Houses
    // Zone 3: St. Boniface / North Valley Clearing + Village Log Houses -> Horizon Herd
    // ---------------------------------------------------------
    else if (bType === 'forks') {
      const riverW = 72;
      const riverX = Math.floor((VIEW_W - riverW) / 2);

      if (fIdx === 0) {
        // Vertical Red River running full height from bottom edge to top edge of Zone 0
        const colW = 36;
        const logCols = [
          { x: riverX, vy: 0.90 * speedScale, logH: 48, count: 2 },
          { x: riverX + colW, vy: -1.05 * speedScale, logH: 44, count: 2 }
        ];
        let vLogs = [];
        for (let lc of logCols) {
          for (let c = 0; c < lc.count; c++) {
            vLogs.push({
              x: lc.x + 2,
              y: c * (VIEW_H / lc.count),
              w: colW - 4,
              h: lc.logH,
              vy: lc.vy
            });
          }
        }
        waters.push({
          name: 'RED RIVER SOUTH',
          orientation: 'V',
          x: riverX,
          y: 0,
          w: riverW,
          h: VIEW_H,
          mode: 'LOGS',
          platforms: vLogs
        });

        statics.push({ type: 'LOGHOUSE', x: 16, y: playTop + 14, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: 64, y: playTop + Math.floor(playHeight * 0.52), w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 96, y: playTop + 20, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 48, y: playTop + Math.floor(playHeight * 0.56), w: 32, h: 26 });

        addWildlifeLane(dynamics, playTop + Math.floor(playHeight * 0.34), 'FOX', 1, speedScale, 1);
      } else if (fIdx === 1) {
        // Connected Vertical Red River continuing from bottom edge of Zone 1 and meeting the West-East Forks!
        const forksY = Math.floor(playTop + playHeight * 0.36);
        const vHeight = VIEW_H - forksY;
        const colW = 36;
        let vLogs = [
          { x: riverX + 2, y: forksY + 6, w: colW - 4, h: 44, vy: 0.85 * speedScale },
          { x: riverX + colW + 2, y: forksY + 46, w: colW - 4, h: 42, vy: -0.95 * speedScale }
        ];
        waters.push({
          name: 'RED RIVER FORKS',
          orientation: 'V',
          x: riverX,
          y: forksY,
          w: riverW,
          h: vHeight,
          mode: 'LOGS',
          platforms: vLogs
        });

        // West-East river arm branching out across the full width at forksY so the river connects completely
        const hLogs = createHLogs(forksY - 22, [
          { vx: 1.0 * speedScale, logW: 62, count: 2 }
        ]);
        waters.push({
          name: 'THE FORKS CHANNEL',
          orientation: 'H',
          x: 0,
          y: forksY - 22,
          w: VIEW_W,
          h: 22,
          mode: 'LOGS',
          platforms: hLogs
        });

        statics.push({ type: 'LOGHOUSE', x: 24, y: forksY + 26, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 58, y: forksY + 26, w: 32, h: 26 });
        addWildlifeLane(dynamics, forksY - 42, 'DEER', -1, speedScale, 2);
      } else if (fIdx === 2) {
        // Horizontal Assiniboine River running full West-to-East across middle + Village Log Houses
        const riverY = Math.floor(playTop + playHeight * 0.38);
        const hLogs = createHLogs(riverY, [
          { vx: -0.98 * speedScale, logW: 62, count: 2 },
          { vx: 1.18 * speedScale, logW: 58, count: 2 }
        ]);
        waters.push({
          name: 'ASSINIBOINE RIVER',
          orientation: 'H',
          x: 0,
          y: riverY,
          w: VIEW_W,
          h: 44,
          mode: 'LOGS',
          platforms: hLogs
        });

        statics.push({ type: 'LOGHOUSE', x: 24, y: riverY + 52, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 64, y: riverY + 52, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: 56, y: riverY - 32, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 92, y: riverY - 32, w: 32, h: 26 });
      } else {
        // Zone 3: Upper Parish Settlement & Open Meadow before the Horizon Herd
        statics.push({ type: 'LOGHOUSE', x: 22, y: playTop + 26, w: 32, h: 26 });
        statics.push({ type: 'LOGHOUSE', x: VIEW_W - 56, y: playTop + 26, w: 32, h: 26 });
        statics.push({ type: 'TALLGRASS', x: 88, y: playTop + 56, w: 30, h: 18 });
        statics.push({ type: 'TALLGRASS', x: VIEW_W - 118, y: playTop + 56, w: 30, h: 18 });
        addWildlifeLane(dynamics, playTop + 34, 'DEER', 1, speedScale, 2);
        addWildlifeLane(dynamics, playTop + 76, 'FOX', -1, speedScale, 2);
      }
    }

    // ---------------------------------------------------------
    // LEVEL 4: EASTERN WOODLANDS (4-Zone Woodland Slalom & Staggered Creeks)
    // Zones 0 & 2: Thick Timber Slalom Corridors (winding pine & birch corridors)
    // Zones 1 & 3: Flowing Woodland Creeks (full edge-to-edge) crossed via Staggered Stepping Stones
    // ---------------------------------------------------------
    else if (bType === 'forest') {
      if (fIdx === 0 || fIdx === 2) {
        // Winding Woodland Slalom Corridor: dense pine trees framing a curving S-shaped forest trail
        const slalomBands = 3;
        const bandH = playHeight / slalomBands;
        for (let sb = 0; sb < slalomBands; sb++) {
          let sy = Math.floor(playTop + sb * bandH + 4);
          // Alternate opening left -> right -> center so the rider slaloms through the timber
          let gapCenter = (sb === 0) ? 74 : (sb === 1 ? VIEW_W - 78 : Math.floor(VIEW_W / 2));
          let gapHalf = 36;

          for (let tx = 8; tx < VIEW_W - 32; tx += 36) {
            if (Math.abs((tx + 15) - gapCenter) > gapHalf) {
              statics.push({
                type: 'TREE',
                x: tx,
                y: sy,
                w: 30,
                h: 30
              });
            }
          }

          let wy = sy + 32;
          if (wy + 16 < playBottom) {
            addWildlifeLane(dynamics, wy, (sb % 2 === 0 ? 'FOX' : 'SNAKE'), (sb % 2 === 0 ? 1 : -1), speedScale, 2);
          }
        }
      } else {
        // Zones 1 & 3: Flowing Woodland Creek (full West-to-East) crossed via Staggered Stepping Stones
        const creekY = Math.floor(playTop + playHeight * (fIdx === 1 ? 0.44 : 0.38));
        const creekH = 38;

        let stones = [];
        const baseStoneX = (fIdx === 1) ? 72 : 114;
        const stepOffsets = [0, 26, -12, 34, 14, 48];
        for (let s = 0; s < stepOffsets.length; s++) {
          let sx = baseStoneX + stepOffsets[s];
          let sy = (s % 2 === 0) ? (creekY + 20) : (creekY + 3);
          stones.push({
            x: sx,
            y: sy,
            w: 24,
            h: 16
          });
        }

        waters.push({
          name: 'WOODLAND CREEK',
          orientation: 'H',
          x: 0,
          y: creekY,
          w: VIEW_W,
          h: creekH,
          mode: 'STONES',
          platforms: stones
        });

        // Woodland trees & boulders framing the creek banks
        statics.push({ type: 'TREE', x: 14, y: creekY + creekH + 10, w: 30, h: 30 });
        statics.push({ type: 'ROCK', x: VIEW_W - 46, y: creekY + creekH + 14, w: 30, h: 18 });
        statics.push({ type: 'TREE', x: VIEW_W - 48, y: creekY - 34, w: 30, h: 30 });

        addWildlifeLane(dynamics, creekY + creekH + 44, 'MOOSE', (fIdx === 1 ? 1 : -1), speedScale, 1);
      }
    }

    // Top Horizon Buffalo Herd on Final Zone (Frame 3)
    let herd = [];
    if (fIdx === TOTAL_ZONES - 1) {
      for (let h = 0; h < 6; h++) {
        herd.push({
          x: 24 + h * 46 + (h % 2) * 8,
          y: HUD_HEIGHT + 12 + (h % 2) * 6,
          phase: h * 11
        });
      }
    }

    return { statics, dynamics, waters, groundPatches, herd };
  }

  function initLevel() {
    subFrame = 0;
    slideProgress = 0;
    for (let i = 0; i < TOTAL_ZONES; i++) {
      levelFrames[i] = buildFrameData(i);
    }
    player = { x: Math.floor(VIEW_W / 2) - 16, y: VIEW_H - 42, dead: false, w: 32, h: 36, dir: 'UP', moveTimer: 0 };
    state = 'PLAYING';
  }

  function respawnCurrentZone() {
    // Place next hunting party member cleanly at the safe entry of the current zone
    subFrame = 0;
    slideProgress = 0;
    player = { x: Math.floor(VIEW_W / 2) - 16, y: VIEW_H - 42, dead: false, w: 32, h: 36, dir: 'UP', moveTimer: 0 };
    state = 'PLAYING';
    resumeChiptuneTrack();
  }

  function handlePlayerCrash() {
    lives--;
    pauseChiptuneTrack();
    if (lives <= 0) {
      state = 'GAMEOVER';
    } else {
      state = 'LIFE_LOST';
      lifeLostTimer = 95;
    }
  }

  // ==========================================
  // 4-DIRECTIONAL MOVEMENT & STATIC BLOCKING
  // ==========================================
  function move(dx, dy) {
    if (state !== 'PLAYING') return;

    // Update 4-directional facing orientation & trigger gallop animation timer
    if (dy < 0) player.dir = 'UP';
    else if (dy > 0) player.dir = 'DOWN';
    else if (dx < 0) player.dir = 'LEFT';
    else if (dx > 0) player.dir = 'RIGHT';
    player.moveTimer = 14; // Keeps horse galloping smoothly during movement, switches to standing pose when idle

    const stepX = 18;
    const stepY = 18;
    let nx = player.x + dx * stepX;
    let ny = player.y + dy * stepY;

    nx = Math.max(4, Math.min(VIEW_W - player.w - 4, nx));
    if (ny > VIEW_H - player.h - 2) ny = VIEW_H - player.h - 2;

    // Check Static Blocking Objects (Rocks, Tall Grass, Ledges, Trees, Tipis, Log Houses)
    const activeData = levelFrames[subFrame];
    const pLeft = nx + 6;
    const pRight = nx + player.w - 6;
    const pTop = ny + 8;
    const pBottom = ny + player.h - 4;

    for (let st of activeData.statics) {
      if (pLeft < st.x + st.w - 2 &&
          pRight > st.x + 2 &&
          pTop < st.y + st.h - 2 &&
          pBottom > st.y + 2) {
        return; // Blocked by solid static obstacle
      }
    }

    player.x = nx;
    player.y = ny;

    // Check Top Transition across all 4 Zones -> Goal Platform at Top of Zone 4 (subFrame === 3)
    if (subFrame < TOTAL_ZONES - 1 && player.y <= HUD_HEIGHT + 6) {
      state = 'FRAME_SLIDE';
      slideProgress = 0;
    } else if (subFrame === TOTAL_ZONES - 1 && player.y <= HUD_HEIGHT + 44) {
      state = 'LEVEL_END_CUTSCENE';
      cutsceneTimer = 0;
    }
  }

  // ==========================================
  // MAIN UPDATE LOOP (LOGS, STONES, WILDLIFE & LIVES)
  // ==========================================
  function update() {
    frame++;

    if (state === 'TITLE' || state === 'GAMEOVER') {
      return;
    }

    if (state === 'LIFE_LOST') {
      lifeLostTimer--;
      if (lifeLostTimer <= 0) {
        respawnCurrentZone();
      }
      return;
    }

    if (state === 'INTRO_CUTSCENE' || state === 'LEVEL_END_CUTSCENE') {
      cutsceneTimer++;
      return;
    }

    if (state === 'FRAME_SLIDE') {
      const slideSteps = 30;
      slideProgress++;
      const totalShift = VIEW_H - HUD_HEIGHT - 44;
      player.y = (HUD_HEIGHT + 6) + (slideProgress / slideSteps) * totalShift;
      player.moveTimer = 4;

      if (slideProgress >= slideSteps) {
        subFrame++;
        player.y = VIEW_H - player.h - 6;
        state = 'PLAYING';
      }
      return;
    }

    if (state === 'PLAYING') {
      if (player.moveTimer > 0) {
        player.moveTimer--;
      }

      const activeData = levelFrames[subFrame];

      // 1. Update River Logs & Check Water/Log/Stepping-Stone Support
      let pCenterX = player.x + player.w / 2;
      let pFootY = player.y + player.h - 8;

      for (let wZone of activeData.waters) {
        if (wZone.mode === 'LOGS') {
          for (let log of wZone.platforms) {
            if (log.vx) {
              log.x += log.vx;
              if (log.vx > 0 && log.x > VIEW_W + 8) log.x = -log.w - 4;
              if (log.vx < 0 && log.x < -log.w - 8) log.x = VIEW_W + 4;
            }
            if (log.vy) {
              log.y += log.vy;
              if (log.vy > 0 && log.y > wZone.y + wZone.h + 4) log.y = wZone.y - log.h;
              if (log.vy < 0 && log.y < wZone.y - log.h - 4) log.y = wZone.y + wZone.h;
            }
          }
        }

        if (pCenterX >= wZone.x && pCenterX <= wZone.x + wZone.w &&
            pFootY >= wZone.y && pFootY <= wZone.y + wZone.h) {
          
          let supportedBy = null;
          for (let plat of wZone.platforms) {
            if (pCenterX >= plat.x - 4 && pCenterX <= plat.x + plat.w + 4 &&
                pFootY >= plat.y - 5 && pFootY <= plat.y + plat.h + 5) {
              supportedBy = plat;
              break;
            }
          }

          if (!supportedBy) {
            handlePlayerCrash();
            return;
          } else if (wZone.mode === 'LOGS') {
            if (supportedBy.vx) player.x += supportedBy.vx;
            if (supportedBy.vy) player.y += supportedBy.vy;
            player.x = Math.max(2, Math.min(VIEW_W - player.w - 2, player.x));
            player.y = Math.max(HUD_HEIGHT + 2, Math.min(VIEW_H - player.h - 2, player.y));
          }
        }
      }

      // 2. Update Dynamic Collision Wildlife (Foxes, Moose, Deer, Snakes)
      const pLeft = player.x + 7;
      const pRight = player.x + player.w - 7;
      const pTop = player.y + 8;
      const pBottom = player.y + player.h - 5;

      for (let dyn of activeData.dynamics) {
        dyn.x += dyn.vx;
        if (dyn.vx > 0 && dyn.x > VIEW_W + 10) dyn.x = -dyn.w - 6;
        if (dyn.vx < 0 && dyn.x < -dyn.w - 10) dyn.x = VIEW_W + 6;

        // Wildlife respects solid rocky ledges & timber trees
        for (let st of activeData.statics) {
          if (st.type === 'LEDGE' || st.type === 'TREE') {
            if (dyn.x < st.x + st.w && dyn.x + dyn.w > st.x &&
                dyn.y < st.y + st.h && dyn.y + dyn.h > st.y) {
              dyn.vx *= -1;
              dyn.x += dyn.vx * 2;
            }
          }
        }

        if (pLeft < dyn.x + dyn.w - 3 &&
            pRight > dyn.x + 3 &&
            pTop < dyn.y + dyn.h - 2 &&
            pBottom > dyn.y + 2) {
          handlePlayerCrash();
          return;
        }
      }
    }
  }

  // ==========================================
  // PARALLAX HORIZON & LEVEL-ENDING SUNSET SCENE
  // ==========================================
  function drawBiomeHorizonCutscene(biome, scrollOffset, isEndingChase) {
    const horizonY = Math.floor(VIEW_H * 0.56);

    const bandH = Math.ceil(horizonY / biome.skyBands.length);
    for (let i = 0; i < biome.skyBands.length; i++) {
      ctx.fillStyle = biome.skyBands[i];
      ctx.fillRect(0, i * bandH, VIEW_W, bandH + 1);
    }

    const sunY = isEndingChase 
      ? Math.min(horizonY - 6, Math.floor(horizonY * 0.42) + Math.floor(cutsceneTimer * 0.08))
      : Math.floor(horizonY * 0.36);
    const sunX = Math.floor(VIEW_W * 0.72);
    ctx.fillStyle = '#fff5b8';
    ctx.fillRect(sunX, sunY, 22, 22);
    ctx.fillStyle = '#f7c844';
    ctx.fillRect(sunX - 2, sunY + 2, 26, 18);

    ctx.fillStyle = '#f7b267';
    for (let c = 0; c < 4; c++) {
      let cx = ((c * 110) - Math.floor(scrollOffset * 0.15)) % (VIEW_W + 60);
      if (cx < -60) cx += VIEW_W + 60;
      let cy = 16 + (c % 2) * 15;
      ctx.fillRect(cx, cy, 36, 6);
      ctx.fillRect(cx + 6, cy - 4, 22, 4);
    }

    ctx.fillStyle = biome.farHills;
    if (biome.type === 'mountain') {
      for (let m = -1; m < 6; m++) {
        let mx = (m * 76) - (Math.floor(scrollOffset * 0.3) % 76);
        ctx.fillRect(mx, horizonY - 26, 64, 26);
        ctx.fillRect(mx + 14, horizonY - 40, 36, 14);
        ctx.fillRect(mx + 24, horizonY - 50, 16, 10);
      }
    } else if (biome.type === 'forest') {
      for (let t = -1; t < 18; t++) {
        let tx = (t * 22) - (Math.floor(scrollOffset * 0.35) % 22);
        let th = 22 + (t % 3) * 8;
        ctx.fillRect(tx + 4, horizonY - th, 10, th);
        ctx.fillRect(tx + 7, horizonY - th - 6, 4, 6);
      }
    } else {
      for (let m = -1; m < 6; m++) {
        let mx = (m * 84) - (Math.floor(scrollOffset * 0.3) % 84);
        ctx.fillRect(mx, horizonY - 16, 68, 16);
        ctx.fillRect(mx + 16, horizonY - 24, 36, 8);
      }
    }

    ctx.fillStyle = biome.midHills;
    ctx.fillRect(0, horizonY, VIEW_W, 16);
    if (biome.type === 'forest' || biome.type === 'forks') {
      for (let t = -1; t < 12; t++) {
        let tx = (t * 34) - (Math.floor(scrollOffset * 0.65) % 34);
        ctx.fillRect(tx + 4, horizonY - 10, 6, 10);
        ctx.fillRect(tx + 2, horizonY - 6, 10, 6);
      }
    }

    const groundY = horizonY + 12;
    ctx.fillStyle = biome.groundHoriz;
    ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

    ctx.fillStyle = biome.patch2;
    ctx.fillRect(0, groundY + 18, VIEW_W, 14);
    ctx.fillStyle = biome.patch1;
    ctx.fillRect(0, groundY + 42, VIEW_W, 16);

    for (let g = 0; g < 26; g++) {
      let gx = ((g * 27) - Math.floor(scrollOffset * 2.1)) % (VIEW_W + 20);
      if (gx < -20) gx += VIEW_W + 20;
      let gy = groundY + 6 + ((g * 13) % Math.max(24, VIEW_H - groundY - 12));
      ctx.fillStyle = (g % 2 === 0) ? biome.tuft : biome.tuftDark;
      ctx.fillRect(gx, gy, 3, 6);
      ctx.fillRect(gx + 4, gy + 2, 3, 4);
    }

    const bob = Math.floor(frame / 6) % 2 === 0 ? 0 : -2;
    const chaseY = groundY + Math.min(20, Math.floor((VIEW_H - groundY) * 0.24));
    
    let chaseBaseX = Math.floor(VIEW_W * 0.52);
    let chaseScale = 2;
    let drawYOffset = 0;

    if (isEndingChase) {
      let progress = Math.min(1, cutsceneTimer / 220);
      chaseBaseX = Math.floor(40 + progress * (VIEW_W * 0.68));
      drawYOffset = -Math.floor(progress * 18);
      chaseScale = progress > 0.65 ? 1 : 2;
    }

    ctx.fillStyle = '#d4d0c5';
    for (let d = 0; d < 6; d++) {
      let dx = chaseBaseX - 36 + ((d * 21 + frame * 2) % 110);
      let dy = chaseY + 22 + drawYOffset - ((d * 7 + frame) % 8);
      ctx.fillRect(dx, dy, 3, 3);
    }

    drawSprite(chaseBaseX + 26 * chaseScale, chaseY + bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);
    drawSprite(chaseBaseX + 10 * chaseScale, chaseY + (5 * chaseScale) - bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);
    drawSprite(chaseBaseX + 20 * chaseScale, chaseY + (9 * chaseScale) + bob + drawYOffset, sprBuffaloSide, PAL_BUFFALO_SIDE, chaseScale);

    // Draw the active Hunting Party member's horse & rider in the sunset chase!
    drawSprite(chaseBaseX - 22 * chaseScale, chaseY + (3 * chaseScale) - bob + drawYOffset, sprHunterSide, getActiveRiderPalette(), chaseScale);
  }

  // ==========================================
  // 16-BIT SNES SHADED LOG RENDERER (WOOD GRAIN, BARK RINGS & END CUTS)
  // ==========================================
  function drawShadedLog(px, py, pw, ph, orientation) {
    // Crisp dark outline
    ctx.fillStyle = '#170d06';
    ctx.fillRect(px, py, pw, ph);

    if (orientation === 'H') {
      // Mid-tone bark body
      ctx.fillStyle = '#6e4220';
      ctx.fillRect(px + 1, py + 1, pw - 2, ph - 2);

      // Upper sunlight highlight ridge
      ctx.fillStyle = '#9e6536';
      ctx.fillRect(px + 2, py + 2, pw - 4, 3);
      ctx.fillStyle = '#bd7f48';
      ctx.fillRect(px + 3, py + 2, pw - 6, 1);

      // Lower water-line shadow band
      ctx.fillStyle = '#472811';
      ctx.fillRect(px + 2, py + ph - 4, pw - 4, 3);

      // Bark grain ridges & knots along length
      ctx.fillStyle = '#3b200c';
      for (let gx = px + 8; gx < px + pw - 10; gx += 12) {
        ctx.fillRect(gx, py + 6, 7, 1);
        ctx.fillRect(gx + 3, py + 10, 6, 1);
      }

      // Left & Right Fresh-Cut Heartwood End Caps
      ctx.fillStyle = '#d4a66a';
      ctx.fillRect(px + 1, py + 3, 3, ph - 6);
      ctx.fillRect(px + pw - 4, py + 3, 3, ph - 6);
      ctx.fillStyle = '#8f5932';
      ctx.fillRect(px + 2, py + Math.floor(ph / 2) - 1, 1, 2);
      ctx.fillRect(px + pw - 3, py + Math.floor(ph / 2) - 1, 1, 2);
    } else {
      // Vertical River Log (North-South flow)
      ctx.fillStyle = '#6e4220';
      ctx.fillRect(px + 1, py + 1, pw - 2, ph - 2);

      // Left sunlit bark ridge
      ctx.fillStyle = '#9e6536';
      ctx.fillRect(px + 2, py + 2, 4, ph - 4);
      ctx.fillStyle = '#bd7f48';
      ctx.fillRect(px + 2, py + 3, 2, ph - 6);

      // Right shadow bark ridge
      ctx.fillStyle = '#472811';
      ctx.fillRect(px + pw - 5, py + 2, 4, ph - 4);

      // Vertical bark grain grooves
      ctx.fillStyle = '#3b200c';
      for (let gy = py + 8; gy < py + ph - 10; gy += 11) {
        ctx.fillRect(px + 8, gy, 1, 6);
        ctx.fillRect(px + 14, gy + 3, 1, 6);
        ctx.fillRect(px + 20, gy + 1, 1, 5);
      }

      // Top & Bottom Cut Heartwood End Caps
      ctx.fillStyle = '#d4a66a';
      ctx.fillRect(px + 4, py + 1, pw - 8, 3);
      ctx.fillRect(px + 4, py + ph - 4, pw - 8, 3);
      ctx.fillStyle = '#8f5932';
      ctx.fillRect(px + Math.floor(pw / 2) - 1, py + 2, 2, 1);
      ctx.fillRect(px + Math.floor(pw / 2) - 1, py + ph - 3, 2, 1);
    }
  }

  // ==========================================
  // RENDER SINGLE ZONE BOARD (0..3)
  // ==========================================
  function renderBoardFrame(fIdx, offsetY) {
    const bIdx = (level - 1) % BIOMES.length;
    const b = BIOMES[bIdx];
    const fData = levelFrames[fIdx];

    ctx.save();
    ctx.translate(0, offsetY);

    // 1. Base Landscape Fill
    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Level 1: Continuous 4-Zone Downhill Sloped Step Gradient (High glacial ridge in Zone 0 -> lower valley in Zone 3)
    if (b.type === 'mountain') {
      const steps = 6;
      const stepH = Math.ceil(VIEW_H / steps);
      const baseElevation = (3 - fIdx) * 0.04; // Decreases cleanly from Zone 0 down to Zone 3
      for (let s = 0; s < steps; s++) {
        let shadeAlpha = baseElevation + (0.04 * (1 - s / steps));
        if (shadeAlpha > 0) {
          ctx.fillStyle = `rgba(220, 238, 250, ${shadeAlpha.toFixed(3)})`;
          ctx.fillRect(0, VIEW_H - (s + 1) * stepH, VIEW_W, stepH);
        }
        ctx.fillStyle = 'rgba(30, 38, 44, 0.22)';
        ctx.fillRect(0, s * stepH, VIEW_W, 2);
      }
    }

    // 2. Natural Ground Patches & Grass Tufts
    for (let gp of fData.groundPatches) {
      const gx = Math.floor(gp.x);
      const gy = Math.floor(gp.y);
      if (gp.kind === 0) {
        ctx.fillStyle = b.patch1;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else if (gp.kind === 1) {
        ctx.fillStyle = b.patch2;
        ctx.fillRect(gx, gy, gp.w, gp.h);
      } else {
        ctx.fillStyle = b.tuftDark;
        ctx.fillRect(gx, gy + 2, 2, 4);
        ctx.fillStyle = b.tuft;
        ctx.fillRect(gx + 1, gy, 2, 5);
        ctx.fillRect(gx + 4, gy + 1, 2, 4);
      }
    }

    // 3. Starting Platform (Zone 0 Bottom): Métis Red River Cart Circle Camp (with Glacial Snow on Level 1)
    if (fIdx === 0) {
      const campY = VIEW_H - 46;
      if (b.type === 'mountain') {
        ctx.fillStyle = '#c8dce6';
        ctx.fillRect(0, campY, VIEW_W, 46);
        ctx.fillStyle = '#eef7fc';
        ctx.fillRect(0, campY + 8, VIEW_W, 38);
        for (let sx = 0; sx < VIEW_W; sx += 16) {
          ctx.fillRect(sx + 2, campY - 3, 12, 4);
        }
      } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, campY, VIEW_W, 46);
        ctx.fillStyle = b.tuft;
        ctx.fillRect(0, campY, VIEW_W, 2);
      }

      drawSprite(12, campY + 6, sprRedRiverCart, PAL_CART, 2);
      drawSprite(48, campY + 18, sprRedRiverCart, PAL_CART, 2);
      drawSprite(VIEW_W - 76, campY + 18, sprRedRiverCart, PAL_CART, 2, true);
      drawSprite(VIEW_W - 40, campY + 6, sprRedRiverCart, PAL_CART, 2, true);
    }

    // 4. End Platform (Zone 3 Top): Horizon Sunset Strip & Thundering Buffalo Herd
    if (fIdx === TOTAL_ZONES - 1) {
      const goalY = HUD_HEIGHT;
      ctx.fillStyle = b.skyBands[3];
      ctx.fillRect(0, goalY, VIEW_W, 8);
      ctx.fillStyle = b.skyBands[4];
      ctx.fillRect(0, goalY + 8, VIEW_W, 8);
      ctx.fillStyle = b.skyBands[5];
      ctx.fillRect(0, goalY + 16, VIEW_W, 6);

      for (let h of fData.herd) {
        let stompY = Math.floor((frame + h.phase) / 10) % 2 === 0 ? 0 : -2;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(h.x + 3, h.y + 28, 22, 4);
        drawSprite(h.x, h.y + stompY, sprBuffaloTop, PAL_BUFFALO_TOP, 2);
      }
    }

    // 5. Rivers, Creeks, Pixel-Shaded Frogger Logs & Staggered Stepping Stones
    for (let wZone of fData.waters) {
      ctx.fillStyle = '#4a3825';
      if (wZone.orientation === 'H') {
        ctx.fillRect(wZone.x, wZone.y - 3, wZone.w, wZone.h + 6);
      } else {
        ctx.fillRect(wZone.x - 3, wZone.y, wZone.w + 6, wZone.h);
      }

      ctx.fillStyle = '#0F6F9E';
      ctx.fillRect(wZone.x, wZone.y, wZone.w, wZone.h);

      ctx.fillStyle = '#38a3b8';
      const shift = Math.floor(frame * 0.8) % 24;
      if (wZone.orientation === 'H') {
        for (let rx = -24; rx < wZone.w; rx += 24) {
          ctx.fillRect(wZone.x + rx + shift, wZone.y + 7, 10, 2);
          ctx.fillRect(wZone.x + rx + ((shift + 12) % 24), wZone.y + wZone.h - 9, 10, 2);
        }
      } else {
        for (let ry = -24; ry < wZone.h; ry += 24) {
          ctx.fillRect(wZone.x + 10, wZone.y + ry + shift, 2, 10);
          ctx.fillRect(wZone.x + wZone.w - 12, wZone.y + ry + ((shift + 12) % 24), 2, 10);
        }
      }

      for (let plat of wZone.platforms) {
        const px = Math.floor(plat.x);
        const py = Math.floor(plat.y);
        if (wZone.mode === 'LOGS') {
          drawShadedLog(px, py, plat.w, plat.h, wZone.orientation);
        } else {
          ctx.fillStyle = '#d4f6fc';
          ctx.fillRect(px - 2, py + plat.h - 2, plat.w + 4, 3);
          ctx.fillStyle = '#1c2024';
          ctx.fillRect(px, py, plat.w, plat.h);
          ctx.fillStyle = '#7a8691';
          ctx.fillRect(px + 1, py + 1, plat.w - 2, plat.h - 3);
          ctx.fillStyle = '#a8b5c2';
          ctx.fillRect(px + 2, py + 2, plat.w - 6, 4);
        }
      }
    }

    // 6. Static Blocking Objects (Rocks, Tall Grass, Ledges, Trees, Tipis, Log Houses)
    for (let st of fData.statics) {
      if (st.type === 'LEDGE') {
        ctx.fillStyle = '#2c3338';
        ctx.fillRect(st.x, st.y, st.w, st.h);
        ctx.fillStyle = '#78848c';
        ctx.fillRect(st.x, st.y, st.w, st.h - 5);
        ctx.fillStyle = '#9aa6b0';
        ctx.fillRect(st.x, st.y, st.w, 4);
        ctx.fillStyle = '#434d54';
        for (let sx = st.x + 8; sx < st.x + st.w - 6; sx += 14) {
          ctx.fillRect(sx, st.y + 5, 3, st.h - 8);
        }
        const capX = st.fromLeft ? (st.x + st.w - 5) : st.x;
        ctx.fillStyle = '#1c2024';
        ctx.fillRect(capX, st.y, 5, st.h);
      } else if (st.type === 'ROCK') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprRock, PAL_ROCK, 3);
      } else if (st.type === 'TALLGRASS') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 3);
        drawSprite(st.x, st.y, sprTallGrass, PAL_TALLGRASS, 3);
      } else if (st.type === 'TREE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(st.x + 3, st.y + st.h - 2, st.w - 6, 4);
        drawSprite(st.x, st.y, sprTree, PAL_TREE, 3);
      } else if (st.type === 'TIPI') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprTipi, PAL_TIPI, 2);
      } else if (st.type === 'LOGHOUSE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(st.x + 2, st.y + st.h - 2, st.w - 4, 4);
        drawSprite(st.x, st.y, sprLogHouse, PAL_LOGHOUSE, 2);
      }
    }

    // 7. Dynamic Collision Wildlife (Foxes, Moose, Deer, Snakes)
    for (let dyn of fData.dynamics) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.fillRect(Math.floor(dyn.x + 2), Math.floor(dyn.y + dyn.h - 2), dyn.w - 4, 4);

      let spr, pal;
      if (dyn.type === 'FOX') { spr = sprFox; pal = PAL_FOX; }
      else if (dyn.type === 'MOOSE') { spr = sprMoose; pal = PAL_MOOSE; }
      else if (dyn.type === 'DEER') { spr = sprDeer; pal = PAL_DEER; }
      else if (dyn.type === 'SNAKE') { spr = sprSnake; pal = PAL_SNAKE; }

      let flip = dyn.vx < 0;
      let hopY = (dyn.type === 'FOX' || dyn.type === 'DEER') && (Math.floor(frame / 7) % 2 === 0) ? -1 : 0;
      drawSprite(dyn.x, dyn.y + hopY, spr, pal, dyn.scale, flip);
    }

    ctx.restore();
  }

  function drawGameplay() {
    const bIdx = (level - 1) % BIOMES.length;
    const b = BIOMES[bIdx];

    if (state === 'FRAME_SLIDE') {
      const slideSteps = 30;
      const progress = slideProgress / slideSteps;
      const slideH = VIEW_H - HUD_HEIGHT;
      const offsetCurr = Math.floor(progress * slideH);
      const offsetNext = offsetCurr - slideH;

      renderBoardFrame(subFrame, offsetCurr);
      renderBoardFrame(subFrame + 1, offsetNext);
    } else {
      renderBoardFrame(subFrame, 0);
    }

    // Draw Sculpted 4-Directional Mounted Hunter & Horse (Galloping when moving, Standing idle when stationary!)
    if (state !== 'GAMEOVER' && (state !== 'LIFE_LOST' || frame % 6 < 3)) { 
      ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
      ctx.fillRect(Math.floor(player.x + 5), Math.floor(player.y + player.h - 4), player.w - 10, 5);

      const isMoving = player.moveTimer > 0;
      const poseIdx = isMoving ? (Math.floor(frame / 6) % 2) : 2; // Index 2 = Standing Idle frame in all 4 directions!
      const activePal = getActiveRiderPalette();

      if (player.dir === 'UP') {
        drawSprite(player.x, player.y, sprPlayerUp[poseIdx], activePal, 2, false);
      } else if (player.dir === 'DOWN') {
        drawSprite(player.x, player.y, sprPlayerDown[poseIdx], activePal, 2, false);
      } else if (player.dir === 'RIGHT') {
        drawSprite(player.x - 2, player.y + 2, sprPlayerSideAnim[poseIdx], activePal, 2, false);
      } else if (player.dir === 'LEFT') {
        drawSprite(player.x - 2, player.y + 2, sprPlayerSideAnim[poseIdx], activePal, 2, true);
      }
    }

    // Top HUD Bar (Anchored y = 0)
    ctx.fillStyle = '#182238';
    ctx.fillRect(0, 0, VIEW_W, HUD_HEIGHT);
    ctx.fillStyle = '#F7C844'; 
    ctx.fillRect(0, HUD_HEIGHT - 2, VIEW_W, 2);

    ctx.fillStyle = '#F7C844';
    ctx.font = "bold 10px 'Courier New', Courier, monospace";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 6, HUD_HEIGHT / 2);

    ctx.fillStyle = '#12AEA2';
    ctx.textAlign = 'right';
    ctx.fillText(`RIDERS:${lives}  STG:${level}  ZN:${subFrame + 1}/${TOTAL_ZONES}`, VIEW_W - 6, HUD_HEIGHT / 2);

    // Next Hunting Party Member Banner on Life Lost
    if (state === 'LIFE_LOST') {
      const boxW = 246;
      const boxH = 58;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#FB6604';
      ctx.font = "bold 13px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("RIDER DOWN!", VIEW_W / 2, by + 10);

      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 10px 'Courier New', Courier, monospace";
      ctx.fillText(`NEXT UP: ${getActiveRiderName()}`, VIEW_W / 2, by + 32);
    }

    // Game Over Box
    if (state === 'GAMEOVER') {
      const boxW = 230;
      const boxH = 78;
      const bx = Math.floor((VIEW_W - boxW) / 2);
      const by = Math.floor((VIEW_H - boxH) / 2);

      drawSNESWindow(bx, by, boxW, boxH);

      ctx.fillStyle = '#AD1C21';
      ctx.font = "bold 17px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText("HUNTING PARTY HALTED", VIEW_W / 2, by + 12);

      if (Math.floor(Date.now() / 480) % 2 === 0) {
        ctx.fillStyle = '#12AEA2';
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.fillText("PRESS 'A' TO RIDE AGAIN", VIEW_W / 2, by + 46);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (state === 'TITLE') {
      drawTitleScreen();
    } else if (state === 'INTRO_CUTSCENE') {
      drawIntroCutscene();
    } else if (state === 'LEVEL_END_CUTSCENE') {
      drawLevelEndCutscene();
    } else {
      drawGameplay();
    }

    if (isPaused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      const bw = 150, bh = 44;
      drawSNESWindow(Math.floor((VIEW_W - bw) / 2), Math.floor((VIEW_H - bh) / 2), bw, bh);
      ctx.fillStyle = '#F7C844';
      ctx.font = "bold 16px 'Courier New', Courier, monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("PAUSED", VIEW_W / 2, VIEW_H / 2 + 1);
    }
  }

  // ==========================================
  // ARCADE CABINET POSTMESSAGE BRIDGE
  // ==========================================
  let inputState = { up: false, down: false, left: false, right: false };
  let inputTimers = { up: 0, down: 0, left: 0, right: 0 };
  let btnALast = 0;
  let btnBLast = 0;

  window.addEventListener('message', function(event) {
    const cmd = (typeof event.data === 'string') ? event.data : (event.data && (event.data.cmd || event.data.action || event.data.type));
    if (!cmd) return;

    const now = Date.now();

    if (cmd === 'PAUSE') { 
      isPaused = true; 
      pauseChiptuneTrack();
      inputState.up = inputState.down = inputState.left = inputState.right = false;
      return; 
    }
    if (cmd === 'RESUME') { 
      isPaused = false; 
      resumeChiptuneTrack();
      return; 
    }

    if (isPaused) return;

    if (cmd === 'BUTTON_A' && now - btnALast > 110) {
      btnALast = now;
      if (state === 'TITLE') {
        state = 'INTRO_CUTSCENE';
        cutsceneTimer = 0;
        startChiptuneTrack();
      } else if (state === 'INTRO_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      } else if (state === 'LEVEL_END_CUTSCENE') {
        level++;
        initLevel();
      } else if (state === 'GAMEOVER') {
        level = 1;
        lives = 3;
        stopChiptuneTrack();
        initLevel();
        startChiptuneTrack();
      }
    }

    if (cmd === 'BUTTON_B' && now - btnBLast > 110) {
      btnBLast = now;
      if (state === 'INTRO_CUTSCENE') {
        level = 1;
        lives = 3;
        initLevel();
      } else if (state === 'LEVEL_END_CUTSCENE') {
        level++;
        initLevel();
      }
    }

    const parseDpad = (dirCmd, pressCmd, releaseCmd, stateKey, dx, dy) => {
      if (cmd === pressCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy); 
      }
      else if (cmd === releaseCmd) {
        inputState[stateKey] = false;
      }
      else if (cmd === dirCmd) { 
        inputState[stateKey] = true; 
        inputTimers[stateKey] = now; 
        move(dx, dy);
      }
    };

    parseDpad('DPAD_UP', 'DPAD_UP_PRESS', 'DPAD_UP_RELEASE', 'up', 0, -1);
    parseDpad('DPAD_DOWN', 'DPAD_DOWN_PRESS', 'DPAD_DOWN_RELEASE', 'down', 0, 1);
    parseDpad('DPAD_LEFT', 'DPAD_LEFT_PRESS', 'DPAD_LEFT_RELEASE', 'left', -1, 0);
    parseDpad('DPAD_RIGHT', 'DPAD_RIGHT_PRESS', 'DPAD_RIGHT_RELEASE', 'right', 1, 0);

    if (cmd === 'RELEASE' || cmd === 'STOP' || cmd === 'NEUTRAL') {
      inputState.up = inputState.down = inputState.left = inputState.right = false;
    }
  });

  function processHoldInputs() {
    const now = Date.now();
    const holdDelay = 145; 
    if (inputState.up && now - inputTimers.up > holdDelay) { inputTimers.up = now; move(0, -1); }
    if (inputState.down && now - inputTimers.down > holdDelay) { inputTimers.down = now; move(0, 1); }
    if (inputState.left && now - inputTimers.left > holdDelay) { inputTimers.left = now; move(-1, 0); }
    if (inputState.right && now - inputTimers.right > holdDelay) { inputTimers.right = now; move(1, 0); }
  }

  function loop() {
    if (!isPaused) {
      processHoldInputs();
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  resizeViewport();
  loop();

</script>
</body>
</html>
