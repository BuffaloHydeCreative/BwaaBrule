  function hexToRgb(hex) {
    const clean = hex.replace('#', '');
    return [
      parseInt(clean.substring(0, 2), 16),
      parseInt(clean.substring(2, 4), 16),
      parseInt(clean.substring(4, 6), 16)
    ];
  }

  function lerpHex(hexA, hexB, t) {
    const clamped = Math.max(0, Math.min(1, t));
    const [r1, g1, b1] = hexToRgb(hexA);
    const [r2, g2, b2] = hexToRgb(hexB);
    const r = Math.round(r1 + (r2 - r1) * clamped);
    const g = Math.round(g1 + (g2 - g1) * clamped);
    const b = Math.round(b1 + (b2 - b1) * clamped);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function initAudio() {

  function playTone(freq, type, dur, vol) {
    if (!audioCtx || !freq) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function drawMatrix(matrix, x, y, palette, scale = 1, flipX = false) {
    const h = matrix.length;
    const w = matrix[0].length;
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const val = matrix[r][c];
        if (val > 0 && palette[val]) {
          ctx.fillStyle = palette[val];
          const drawC = flipX ? (w - 1 - c) : c;
          ctx.fillRect(Math.floor(x + drawC * scale), Math.floor(y + r * scale), scale, scale);
        }
      }
    }
  }

  function drawPixelText(txt, x, y, size, color, align = 'left', shadow = true) {
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textAlign = align;
    if (shadow) {
      ctx.fillStyle = PALETTE.black;
      ctx.fillText(txt, x + 1, y + 1);
    }
    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
  }

  function drawWrappedLines(lines, x, startY, lineHeight, size, color, align = 'left') {
    for (let i = 0; i < lines.length; i++) {
      drawPixelText(lines[i], x, startY + i * lineHeight, size, color, align, true);
    }
  }

    }

    if (cp.flow === 'NS') {
      if (cp.id === 'st_boniface') {
        if (x >= 46 && x <= 62 && ((y >= 16 && y <= 132) || (y >= 184 && y <= 228))) return true;
      } else {
        if (x >= 46 && x <= 62 && y >= 16 && y <= 228) return true;
      }
      if (x >= 46 && x <= 72 && y >= 112 && y <= 128) return true;
      if (cp.entrySide === 'WEST' && x >= 6 && x <= 46 && y >= 112 && y <= 128) return true;

      if (x >= 178 && x <= 194 && y >= 16 && y <= 228) return true;
      if (x >= 168 && x <= 194 && y >= 112 && y <= 128) return true;
      if (cp.entrySide === 'EAST' && x >= 194 && x <= 234 && y >= 112 && y <= 128) return true;

      if (cp.id === 'st_boniface' && x >= 168 && x <= 236 && y >= 2 && y <= 16) return true;

      return false;
    } else {
      if (x >= 12 && x <= 228 && y >= 56 && y <= 72) return true;
      if (x >= 112 && x <= 128 && y >= 14 && y <= 58) return true;
      if (x >= 12 && x <= 228 && y >= 164 && y <= 180) return true;
      return false;
    }
  }

  // =========================================================================
  // BASELINE RANK STANDING SYSTEM & REPUTATION RATIO (x:y:z)
  // =========================================================================
  function getBaselineTradeStanding() {
    return totalFurs + (totalRobes * 2);
  }

  function getTraderRankInfo() {
    const standing = getBaselineTradeStanding();
    if (standing >= 40) {
      return { title: 'KING OF THE TRADERS', color: PALETTE.compassGold };
    }
    if (standing >= 10) {
      return { title: 'SURVIVED THE WINTER', color: PALETTE.teal };
    }
    return { title: 'SCARCE & STARVATION', color: '#ff6b6b' };
  }

  // =========================================================================
  // GAME STATE & REAL-TIME SIMULATION
  // =========================================================================
  let gameState = 'TITLE'; // TITLE, BRIEFING, MAP, WEIR, GAMEOVER
  let briefingSide = 1;
  let frameTick = 0;
  let timeLeft = 300;
  let lastSecondTimestamp = 0;
  let isPaused = false;

  let totalFurs = 0;
  let totalRobes = 0;

  let hbcDealsLost = 0;
  let buffaloRedirects = 0;
  let hbcBrokenCount = 0;

  let activeCheckpointIndex = 0;
  let player = { x: 54, y: 120, dir: 'right', moving: false };

  let sceneNPCs = [];
  let riverFish = [];
  let floatingPopups = [];

  let whiteHorseTriggeredThisRun = false;
  let whiteHorse = null;

  // --- POSTMESSAGE JOYSTICK HOLD, COOLDOWN & BUTTON DEBOUNCE STATE ---
  const dpadExpiry = { UP: 0, DOWN: 0, LEFT: 0, RIGHT: 0 };
  const DPAD_HOLD_WINDOW_MS = 145;
  let lastBtnATime = 0;
  let lastBtnBTime = 0;
  const BTN_DEBOUNCE_MS = 120;
  let weirStepCooldown = 0;
  let lastMapCycleTime = 0;
  const MAP_CYCLE_COOLDOWN_MS = 185;

  function isDpadHeld(dir) {
    return performance.now() < dpadExpiry[dir];
  }

  function clearAllInputs() {
    dpadExpiry.UP = 0;
    dpadExpiry.DOWN = 0;
    dpadExpiry.LEFT = 0;
    dpadExpiry.RIGHT = 0;
    weirStepCooldown = 0;
  }

  function setViewMode(mode) {
    gameState = mode;
    if (mode === 'MAP') {
      const bucket = Math.floor((300 - timeLeft) / 5);
      if (bucket !== lastBakedSeasonBucket) {
        bakeStaticMap();
      }
    }
  }

  function toggleBriefingSide() {
    if (gameState !== 'BRIEFING') return;
    sfxCursor();
    briefingSide = briefingSide === 1 ? 2 : 1;
  }

  function getCartWeight(cp) {
    return (cp.furs * WEIGHT_SMALL_FUR) + (cp.robes * WEIGHT_BUFFALO_ROBE);
  }

  function getCheckpointHbcPresence(cp, idx) {
    if (gameState === 'WEIR' && activeCheckpointIndex === idx) {
      if (sceneNPCs.some(n => n.role === 'warden')) return 'warden';
      if (sceneNPCs.some(n => n.role === 'hbc')) return 'hbc';
    }
    if (cp.wardenActiveTimer > 0) return 'warden';
    if (cp.status === 'HBC_RAID' || cp.hbcActiveTimer > 0) return 'hbc';
    return null;
  }

  function resetAllCheckpoints() {
    CHECKPOINTS.forEach((cp, idx) => {
      cp.status = 'UNSET';
      cp.cartX = cp.id === 'upper_fort_garry'
        ? 112
        : (cp.flow === 'NS' ? (cp.entrySide === 'EAST' ? 186 : 54) : 120);
      cp.cartY = cp.flow === 'NS' ? 146 : 64;
      cp.setProgress = 0;
      cp.isWorking = false;
      cp.raidTimer = 0;
      cp.furs = 0;
      cp.robes = 0;
      cp.smallGameTimer = rollRange(cp.smallGameRange) * (0.4 + idx * 0.08);
      cp.buffaloTimer   = rollRange(cp.buffaloRange) * (0.45 + idx * 0.08);
      cp.hbcTimer       = rollRange(cp.hbcRange) * (0.45 + idx * 0.1);
      cp.hbcActiveTimer = 0;
      cp.hbcTriggeredPass = false;
      if (cp.id === 'st_francois_xavier') {
        cp.wardenTimer = 55;
        cp.wardenActiveTimer = 0;
        cp.wardenTriggeredPass = false;
      }
    });
    whiteHorseTriggeredThisRun = false;
    whiteHorse = null;
  }

  function isPlayerNearCart(cp) {
    return Math.hypot(player.x - cp.cartX, player.y - cp.cartY) <= 28;
  }

  let lastFrameTime = performance.now();

  function updateSimulation(now) {
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    if (isPaused) return;

    frameTick++;
    if (weirStepCooldown > 0) weirStepCooldown = Math.max(0, weirStepCooldown - dt);

    // Smooth continuous walking when joystick is held in WEIR scene
    if (gameState === 'WEIR' && weirStepCooldown <= 0) {
      if (isDpadHeld('UP'))         { moveWeirPlayer('UP');    weirStepCooldown = 0.11; }
      else if (isDpadHeld('DOWN'))  { moveWeirPlayer('DOWN');  weirStepCooldown = 0.11; }
      else if (isDpadHeld('LEFT'))  { moveWeirPlayer('LEFT');  weirStepCooldown = 0.11; }
      else if (isDpadHeld('RIGHT')) { moveWeirPlayer('RIGHT'); weirStepCooldown = 0.11; }
    }

    // Smooth held-joystick stepping through the 6 parishes on the MAP carousel
    if (gameState === 'MAP' && (now - lastMapCycleTime) >= MAP_CYCLE_COOLDOWN_MS) {
      if (isDpadHeld('RIGHT') || isDpadHeld('DOWN')) {
        cycleCheckpoint(1);
        lastMapCycleTime = now;
      } else if (isDpadHeld('LEFT') || isDpadHeld('UP')) {
        cycleCheckpoint(-1);
        lastMapCycleTime = now;
      }
    }

    if (gameState !== 'MAP' && gameState !== 'WEIR') return;

    const secNow = Math.floor(now / 1000);
    if (secNow > lastSecondTimestamp) {
      timeLeft--;
      lastSecondTimestamp = secNow;
      if (timeLeft <= 0) {
        timeLeft = 0;
        triggerGameOver(false);
        return;
      }
      const bucket = Math.floor((300 - timeLeft) / 5);
      if (bucket !== lastBakedSeasonBucket) {
        bakeStaticMap();
      }
    }

    for (let idx = 0; idx < CHECKPOINTS.length; idx++) {
      const cp = CHECKPOINTS[idx];
      const isViewingThis = (gameState === 'WEIR' && activeCheckpointIndex === idx);

      if (cp.status === 'SETTING') {
        if (isViewingThis && cp.isWorking && isPlayerNearCart(cp)) {
          cp.setProgress += dt;
          if (Math.floor(cp.setProgress * 2) !== Math.floor((cp.setProgress - dt) * 2)) {
            sfxWorkTick();
          }
          if (cp.setProgress >= SET_TIME_REQUIRED) {
            cp.status = 'ACTIVE';
            cp.setProgress = 0;
            cp.isWorking = false;
            sfxSetCart();
          }
        } else {
          cp.isWorking = false;
        }
      } else if (cp.status === 'HBC_RAID') {
        cp.raidTimer -= dt;
        if (cp.raidTimer <= 0) {
          cp.status = 'BUSTED';
          cp.raidTimer = 0;
          cp.furs = 0;
          cp.robes = 0;
          cp.isWorking = false;
          hbcBrokenCount++;
          sfxBust();

          if (hbcBrokenCount >= 3) {
            triggerGameOver(true);
            return;
          }
        }
      }

      if (cp.hbcActiveTimer > 0) {
        cp.hbcActiveTimer -= dt;
        if (!isViewingThis && cp.status === 'ACTIVE' && !cp.hbcTriggeredPass && cp.hbcActiveTimer <= 7.0) {
          cp.hbcTriggeredPass = true;
          cp.status = 'HBC_RAID';
          cp.raidTimer = HBC_RAID_DURATION;
        }
        if (cp.hbcActiveTimer <= 0) {
          cp.hbcActiveTimer = 0;
          cp.hbcTriggeredPass = false;
        }
      }

      if (cp.id === 'st_francois_xavier') {
        if (cp.wardenActiveTimer > 0) {
          cp.wardenActiveTimer -= dt;
          if (!isViewingThis && cp.status === 'ACTIVE' && !cp.wardenTriggeredPass && cp.wardenActiveTimer <= 8.0) {
            cp.wardenTriggeredPass = true;
            if (Math.random() >= 0.5) {
              cp.status = 'HBC_RAID';
              cp.raidTimer = HBC_RAID_DURATION;
            }
          }
          if (cp.wardenActiveTimer <= 0) {
            cp.wardenActiveTimer = 0;
            cp.wardenTriggeredPass = false;
          }
        }

        cp.wardenTimer -= dt;
        if (cp.wardenTimer <= 0) {
          cp.wardenTimer = 120.0;
          if (isViewingThis) {
            spawnCheckpointNPC(cp, 'warden');
          } else {
            cp.wardenActiveTimer = 16.0;
            cp.wardenTriggeredPass = false;
          }
        }
      }

      // 1) SmallGameHunter
      cp.smallGameTimer -= dt;
      if (cp.smallGameTimer <= 0) {
        cp.smallGameTimer = rollRange(cp.smallGameRange);
        const skins = cp.smallGameSkins;
        const variant = skins[Math.floor(Math.random() * skins.length)];
        if (isViewingThis) {
          spawnCheckpointNPC(cp, variant);
        } else if (cp.status === 'ACTIVE') {
          const hasAuthority = (cp.hbcActiveTimer > 0 || cp.wardenActiveTimer > 0);
          if (hasAuthority && Math.random() < cp.hbcDealChance) {
            hbcDealsLost++;
          } else {
            applyOffscreenNpcTrade(cp, variant);
          }
        }
      }

      // 2) BuffaloHunter
      cp.buffaloTimer -= dt;
      if (cp.buffaloTimer <= 0) {
        cp.buffaloTimer = rollRange(cp.buffaloRange);
        if (isViewingThis) {
          spawnCheckpointNPC(cp, 'buffalo');
        } else {
          if (cp.hbcActiveTimer > 0) {
            cp.hbcActiveTimer = 0;
            cp.hbcTriggeredPass = false;
            buffaloRedirects++;
          }
          if (cp.wardenActiveTimer > 0 && Math.random() < 0.5) {
            cp.wardenActiveTimer = 0;
            cp.wardenTriggeredPass = false;
            buffaloRedirects++;
          }
          if (cp.status === 'ACTIVE') {
            applyOffscreenNpcTrade(cp, 'buffalo');
          }
        }
      }

      // 3) Regular HBC Officer
      cp.hbcTimer -= dt;
      if (cp.hbcTimer <= 0) {
        cp.hbcTimer = rollRange(cp.hbcRange);
        if (isViewingThis) {
          spawnCheckpointNPC(cp, 'hbc');
        } else {
          cp.hbcActiveTimer = 14.0;
          cp.hbcTriggeredPass = false;
        }
      }
    }

    if (gameState === 'WEIR') {
      const cp = CHECKPOINTS[activeCheckpointIndex];
      updateSceneNPCs(cp, dt);
      updateSceneFish(cp);
      updateWhiteHorse(cp, dt);
    }

    for (let i = floatingPopups.length - 1; i >= 0; i--) {
      floatingPopups[i].y -= 0.35;
      floatingPopups[i].life -= dt;
      if (floatingPopups[i].life <= 0) floatingPopups.splice(i, 1);
    }
  }

  function applyOffscreenNpcTrade(cp, role) {
    if (cp.status !== 'ACTIVE') return;
    if (role === 'buffalo') {
      cp.robes++;
      if (getCartWeight(cp) >= CART_BUST_WEIGHT) {
        cp.status = 'BUSTED';
        cp.furs = 0;
        cp.robes = 0;
      }
    } else if (isSmallGameRole(role)) {
      cp.furs++;
      if (getCartWeight(cp) >= CART_BUST_WEIGHT) {
        cp.status = 'BUSTED';
        cp.furs = 0;
        cp.robes = 0;
      }
    }
  }

  function isSmallGameRole(role) {
    return role === 'cree' || role === 'voyageur' || role === 'saulteaux' || role === 'kilt';
  }

  function isOfficerRole(role) {
    return role === 'hbc' || role === 'warden';
  }

  // =========================================================================
  // RARE SPIRITED WHITE HORSE (ST. FRANCOIS-XAVIER — ONCE EVERY GAMEPLAY)
  // =========================================================================
  function maybeSpawnSpiritedWhiteHorse(cp) {
    if (cp.id !== 'st_francois_xavier') return;
    if (whiteHorseTriggeredThisRun || whiteHorse) return;

    whiteHorseTriggeredThisRun = true;
    sfxHorseWhinny();
    whiteHorse = {
      x: 248,
      y: 34,
      dir: 'left',
      timer: 0,
      waypoints: [
        { x: 196, y: 28 },
        { x: 158, y: 38 },
        { x: 142, y: 24 },
        { x: 86,  y: 36 },
        { x: 24,  y: 28 },
        { x: -24, y: 34 }
      ],
      wpIndex: 0
    };
  }

  function updateWhiteHorse(cp, dt) {
    if (!whiteHorse || cp.id !== 'st_francois_xavier') return;

    if (whiteHorse.timer > 0) {
      whiteHorse.timer -= dt;
      return;
    }

    const target = whiteHorse.waypoints[whiteHorse.wpIndex];
    if (!target) {
      whiteHorse = null;
      return;
    }

    const dx = target.x - whiteHorse.x;
    const dy = target.y - whiteHorse.y;
    const dist = Math.hypot(dx, dy);

    if (dist <= 2) {
      whiteHorse.x = target.x;
      whiteHorse.y = target.y;
      if (whiteHorse.wpIndex === 2) {
        whiteHorse.timer = 1.3;
        sfxHorseWhinny();
      }
      whiteHorse.wpIndex++;
    } else {
      const speed = 0.68;
      const vx = (dx / dist) * speed;
      const vy = (dy / dist) * speed;
      whiteHorse.x += vx;
      whiteHorse.y += vy;
      if (Math.abs(vx) > 0.05) {
        whiteHorse.dir = vx < 0 ? 'left' : 'right';
      }
    }
  }

  function drawSpiritedWhiteHorse() {
    if (!whiteHorse) return;
    const gallop = Math.floor(frameTick / 7) % 2 === 0 ? 0 : -2;
    const flip = whiteHorse.dir === 'left';

    ctx.fillStyle = 'rgba(15, 19, 36, 0.35)';
    ctx.fillRect(Math.round(whiteHorse.x - 8), Math.round(whiteHorse.y - 1), 16, 3);

    drawMatrix(sprWhiteHorse, whiteHorse.x - 10, whiteHorse.y - 13 + gallop, {
      1: '#ffffff',
      2: '#cfd8e3',
      3: '#e8f1f8',
      4: '#1a1c2c',
      5: '#e0a899'
    }, 1, flip);
  }

  // =========================================================================
  // STRICT DIRT-ROAD & STEPPING-STONE NPC ROUTING
  // =========================================================================
  function buildExitWaypointsFrom(cp, x, y, avoidX = null, avoidY = null) {
    if (cp.flow === 'NS') {
      const pts = [];
      let bankX;
      if (x > 58 && x < 182) {
        if (avoidX !== null) bankX = avoidX < x ? 186 : 54;
        else bankX = x < 120 ? 54 : 186;
        pts.push({ x: bankX, y: 120 });
      } else {
        bankX = x < 120 ? 54 : 186;
        if (Math.abs(x - bankX) > 3) pts.push({ x: bankX, y });
      }
      let exitY;
      if (cp.id === 'st_boniface' && bankX === 54) {
        exitY = -14;
      } else {
        exitY = avoidY !== null ? (avoidY < y ? 254 : -14) : (y < 120 ? -14 : 254);
      }
      pts.push({ x: bankX, y: exitY });
      return pts;
    } else {
      const pts = [];
      let bankY;
      if (y > 68 && y < 168) {
        if (avoidY !== null) bankY = avoidY < y ? 172 : 64;
        else bankY = y < 120 ? 64 : 172;
        pts.push({ x: 120, y: bankY });
      } else {
        bankY = y < 120 ? 64 : 172;
        if (Math.abs(y - bankY) > 3) pts.push({ x, y: bankY });
      }
      if (cp.id === 'upper_fort_garry') {
        pts.push({ x: -14, y: bankY });
      } else {
        const exitX = avoidX !== null ? (avoidX < x ? 254 : -14) : (x < 120 ? -14 : 254);
        pts.push({ x: exitX, y: bankY });
      }
      return pts;
    }
  }

  function getNextWalkableSubtarget(cp, ax, ay, tx, ty) {
    if (cp.flow === 'NS') {
      const onWest = ax <= 58;
      const onEast = ax >= 182;
      const onBridge = !onWest && !onEast;
      const targetWest = tx < 120;
      const targetRoadX = targetWest ? 54 : 186;

      if (onBridge) {
        if (Math.abs(ay - 120) > 2) return { x: ax, y: 120 };
        return { x: targetRoadX, y: 120 };
      }

      if ((onWest && !targetWest) || (onEast && targetWest)) {
        const ownRoadX = onWest ? 54 : 186;
        if (Math.abs(ax - ownRoadX) > 2) return { x: ownRoadX, y: ay };
        if (Math.abs(ay - 120) > 2) return { x: ownRoadX, y: 120 };
        return { x: targetRoadX, y: 120 };
      }

      const ownRoadX = onWest ? 54 : 186;
      if (Math.abs(ay - ty) > 2 && Math.abs(ax - ownRoadX) > 2) return { x: ownRoadX, y: ay };
      if (Math.abs(ay - ty) > 2) return { x: ownRoadX, y: ty };
      return { x: tx, y: ty };
    } else {
      const onNorth = ay <= 68;
      const onSouth = ay >= 168;
      const onBridge = !onNorth && !onSouth;
      const targetNorth = ty < 120;
      const targetRoadY = targetNorth ? 64 : 172;

      if (onBridge) {
        if (Math.abs(ax - 120) > 2) return { x: 120, y: ay };
        return { x: 120, y: targetRoadY };
      }

      if ((onNorth && !targetNorth) || (onSouth && targetNorth)) {
        const ownRoadY = onNorth ? 64 : 172;
        if (Math.abs(ay - ownRoadY) > 2) return { x: ax, y: ownRoadY };
        if (Math.abs(ax - 120) > 2) return { x: 120, y: ownRoadY };
        return { x: 120, y: targetRoadY };
      }

      const ownRoadY = onNorth ? 64 : 172;
      if (Math.abs(ax - tx) > 2 && Math.abs(ay - ownRoadY) > 2) return { x: ax, y: ownRoadY };
      if (Math.abs(ax - tx) > 2) return { x: tx, y: ownRoadY };
      return { x: tx, y: ty };
    }
  }

  function moveActorWalkablyToward(cp, actor, tx, ty, moveSpeed) {
    const sub = getNextWalkableSubtarget(cp, actor.x, actor.y, tx, ty);
    const dx = sub.x - actor.x;
    const dy = sub.y - actor.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.1) {
      const stepDist = Math.min(dist, moveSpeed);
      const vx = (dx / dist) * stepDist;
      const vy = (dy / dist) * stepDist;
      actor.x += vx;
      actor.y += vy;
      if (Math.abs(vx) >= Math.abs(vy)) {
        actor.dir = vx < 0 ? 'left' : 'right';
      }
    }
  }

  function spawnCheckpointNPC(cp, role) {
    const fromSideA = Math.random() < 0.5;
    let waypoints = [];
    let startX = 0;
    let startY = 0;

    if (cp.flow === 'NS') {
      const startOnWest = fromSideA;
      startX = startOnWest ? 54 : 186;
      if (cp.id === 'st_boniface' && startOnWest) startY = -10;
      else startY = Math.random() < 0.5 ? -10 : 250;

      const crossRiver = Math.random() < 0.45;
      if (crossRiver) {
        const destX = startOnWest ? 186 : 54;
        const destY = (cp.id === 'st_boniface' && destX === 54)
          ? -12
          : (Math.random() < 0.5 ? -12 : 252);
        waypoints = [
          { x: startX, y: 120 },
          { x: destX, y: 120 },
          { x: destX, y: destY }
        ];
      } else {
        const destY = (cp.id === 'st_boniface' && startOnWest)
          ? -12
          : (startY < 120 ? 252 : -12);
        waypoints = [
          { x: startX, y: 120 },
          { x: startX, y: destY }
        ];
      }
    } else {
      const startOnNorth = fromSideA;
      startY = startOnNorth ? 64 : 172;
      if (cp.id === 'upper_fort_garry') startX = -10;
      else startX = Math.random() < 0.5 ? -10 : 250;

      const crossRiver = Math.random() < 0.45;
      if (crossRiver) {
        const destY = startOnNorth ? 172 : 64;
        const destX = cp.id === 'upper_fort_garry'
          ? -12
          : (Math.random() < 0.5 ? -12 : 252);
        waypoints = [
          { x: 120, y: startY },
          { x: 120, y: destY },
          { x: destX, y: destY }
        ];
      } else {
        const destX = cp.id === 'upper_fort_garry'
          ? -12
          : (startX < 120 ? 252 : -12);
        waypoints = [
          { x: 120, y: startY },
          { x: destX, y: startY }
        ];
      }
    }

    const newNpc = {
      role,
      x: startX,
      y: startY,
      speed: isOfficerRole(role) ? 0.46 : 0.40,
      dir: startX < 120 ? 'right' : 'left',
      waypoints,
      wpIndex: 0,
      hasInteracted: false,
      routedToCart: false,
      pauseTimer: 0,
      chasingHbc: null,
      spooked: false,
      scaredByBuffalo: false,
      discussingWithHbc: null,
      hbcPreference: undefined
    };

    if (role === 'buffalo') {
      sceneNPCs.forEach(existing => {
        if (isOfficerRole(existing.role) && !existing.spooked && !existing.scaredByBuffalo) {
          if (existing.role === 'warden' && Math.random() < 0.5) {
            addPopup('FEARLESS!', existing.x - 18, existing.y - 20, PALETTE.compassGold);
            return;
          }
          existing.spooked = true;
          existing.hasInteracted = true;
          existing.routedToCart = true;
          existing.speed = 0.72;
          existing.pauseTimer = 0.25;
          existing.waypoints = buildExitWaypointsFrom(cp, existing.x, existing.y, startX, startY);
          existing.wpIndex = 0;
          buffaloRedirects++;
          sfxScareHbc();
          addPopup('!', existing.x - 2, existing.y - 20, PALETTE.roofRed);
        }
      });
    }

    if (isOfficerRole(role)) {
      const existingBuffalo = sceneNPCs.find(existing => existing.role === 'buffalo' && !existing.chasingHbc);
      if (existingBuffalo) {
        existingBuffalo.chasingHbc = newNpc;
        existingBuffalo.pauseTimer = 0;
      }
    }

    sceneNPCs.push(newNpc);
  }

  function buildCartApproachWaypoints(cp, npc) {
    if (cp.flow === 'NS') {
      const pts = [];
      const cartOnWest = cp.cartX < 120;
      const cartBankX = cartOnWest ? 54 : 186;

      if (npc.x > 58 && npc.x < 182) {
        pts.push({ x: cartBankX, y: 120 });
      } else {
        const npcOnWest = npc.x < 120;
        const startBankX = npcOnWest ? 54 : 186;
        if (Math.abs(npc.x - startBankX) > 3) pts.push({ x: startBankX, y: npc.y });
        if (npcOnWest !== cartOnWest) {
          pts.push({ x: startBankX, y: 120 });
          pts.push({ x: cartBankX, y: 120 });
        }
      }

      pts.push({ x: cartBankX, y: cp.cartY });
      if (Math.abs(cp.cartX - cartBankX) > 2) {
        pts.push({ x: cp.cartX, y: cp.cartY, isCartTarget: true });
        pts.push({ x: cartBankX, y: cp.cartY });
      } else {
        pts[pts.length - 1].isCartTarget = true;
      }

      const exitY = (cp.id === 'st_boniface' && cartBankX === 54)
        ? -14
        : (Math.random() < 0.5 ? -14 : 254);
      pts.push({ x: cartBankX, y: exitY });
      return pts;
    } else {
      const pts = [];
      const cartOnNorth = cp.cartY < 120;
      const cartBankY = cartOnNorth ? 64 : 172;

      if (npc.y > 68 && npc.y < 168) {
        pts.push({ x: 120, y: cartBankY });
      } else {
        const npcOnNorth = npc.y < 120;
        const startBankY = npcOnNorth ? 64 : 172;
        if (Math.abs(npc.y - startBankY) > 3) pts.push({ x: npc.x, y: startBankY });
        if (npcOnNorth !== cartOnNorth) {
          pts.push({ x: 120, y: startBankY });
          pts.push({ x: 120, y: cartBankY });
        }
      }

      pts.push({ x: cp.cartX, y: cartBankY });
      if (Math.abs(cp.cartY - cartBankY) > 2) {
        pts.push({ x: cp.cartX, y: cp.cartY, isCartTarget: true });
        pts.push({ x: cp.cartX, y: cartBankY });
      } else {
        pts[pts.length - 1].isCartTarget = true;
      }
      const exitX = cp.id === 'upper_fort_garry'
        ? -14
        : (Math.random() < 0.5 ? -14 : 254);
      pts.push({ x: exitX, y: cartBankY });
      return pts;
    }
  }

  function updateSceneNPCs(cp, dt) {
    for (let i = sceneNPCs.length - 1; i >= 0; i--) {
      const npc = sceneNPCs[i];

      if (npc.pauseTimer > 0) {
        npc.pauseTimer -= dt;
        continue;
      }

      if (npc.role === 'buffalo' && npc.chasingHbc) {
        const hbc = npc.chasingHbc;
        const stillHere = sceneNPCs.includes(hbc) && !hbc.scaredByBuffalo && !hbc.spooked;
        if (!stillHere) {
          npc.chasingHbc = null;
          npc.routedToCart = false;
        } else {
          moveActorWalkablyToward(cp, npc, hbc.x, hbc.y, 0.58);
          if (Math.hypot(npc.x - hbc.x, npc.y - hbc.y) <= 13) {
            if (hbc.role === 'warden' && Math.random() < 0.5) {
              npc.chasingHbc = null;
              npc.pauseTimer = 0.4;
              npc.routedToCart = false;
              addPopup('UNFAZED!', hbc.x - 18, hbc.y - 20, PALETTE.compassGold);
            } else {
              hbc.scaredByBuffalo = true;
              hbc.spooked = true;
              hbc.hasInteracted = true;
              hbc.routedToCart = true;
              hbc.speed = 0.74;
              hbc.waypoints = buildExitWaypointsFrom(cp, hbc.x, hbc.y, npc.x, npc.y);
              hbc.wpIndex = 0;

              npc.chasingHbc = null;
              npc.pauseTimer = 0.4;
              npc.routedToCart = false;
              buffaloRedirects++;

              sfxScareHbc();
              addPopup('SCARED!', hbc.x - 16, hbc.y - 20, PALETTE.compassGold);
            }
          }
          continue;
        }
      }

      if (isSmallGameRole(npc.role) && !npc.hasInteracted) {
        const availableHbc = sceneNPCs.find(
          other => isOfficerRole(other.role) && !other.spooked && !other.scaredByBuffalo
        );

        if (availableHbc && npc.hbcPreference === undefined) {
          npc.hbcPreference = Math.random() < cp.hbcDealChance;
          if (npc.hbcPreference) npc.discussingWithHbc = availableHbc;
        }

        if (npc.discussingWithHbc) {
          const targetHbc = npc.discussingWithHbc;
          const validHbc = sceneNPCs.includes(targetHbc) && !targetHbc.spooked && !targetHbc.scaredByBuffalo;
          if (!validHbc) {
            npc.discussingWithHbc = null;
            npc.hbcPreference = false;
            npc.routedToCart = false;
          } else {
            moveActorWalkablyToward(cp, npc, targetHbc.x, targetHbc.y, npc.speed);
            if (Math.hypot(npc.x - targetHbc.x, npc.y - targetHbc.y) <= 13) {
              npc.hasInteracted = true;
              npc.discussingWithHbc = null;
              npc.routedToCart = true;
              npc.pauseTimer = 1.05;
              targetHbc.pauseTimer = Math.max(targetHbc.pauseTimer, 1.05);
              npc.waypoints = buildExitWaypointsFrom(cp, npc.x, npc.y);
              npc.wpIndex = 0;
              hbcDealsLost++;

              sfxTrade();
              addPopup('HBC DEAL', npc.x - 18, npc.y - 20, PALETTE.wallWhite);
            }
            continue;
          }
        }
      }

      if (cp.status === 'ACTIVE' && !npc.hasInteracted && !npc.routedToCart && !npc.spooked) {
        npc.routedToCart = true;
        npc.waypoints = buildCartApproachWaypoints(cp, npc);
        npc.wpIndex = 0;
      }

      const target = npc.waypoints[npc.wpIndex];
      if (!target) {
        sceneNPCs.splice(i, 1);
        continue;
      }

      const dx = target.x - npc.x;
      const dy = target.y - npc.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= 2) {
        npc.x = target.x;
        npc.y = target.y;

        if (target.isCartTarget && !npc.hasInteracted && !npc.spooked) {
          npc.hasInteracted = true;
          npc.pauseTimer = 0.65;
          resolveNpcCartInteraction(cp, npc);
        }
        npc.wpIndex++;
      } else {
        const vx = (dx / dist) * npc.speed;
        const vy = (dy / dist) * npc.speed;
        npc.x += vx;
        npc.y += vy;
        if (Math.abs(vx) >= Math.abs(vy)) {
          npc.dir = vx < 0 ? 'left' : 'right';
        }
      }
    }
  }

  function resolveNpcCartInteraction(cp, npc) {
    if (cp.status !== 'ACTIVE') return;

    if (npc.role === 'buffalo') {
      cp.robes++;
      sfxTrade();
      addPopup('+1 ROBE', cp.cartX - 18, cp.cartY - 18, PALETTE.compassGold);

      if (getCartWeight(cp) >= CART_BUST_WEIGHT) {
        cp.status = 'BUSTED';
        cp.furs = 0;
        cp.robes = 0;
        sfxBust();
      }
    } else if (isSmallGameRole(npc.role)) {
      cp.furs++;
      sfxTrade();
      addPopup('+1 PELT', cp.cartX - 18, cp.cartY - 18, PALETTE.teal);

      if (getCartWeight(cp) >= CART_BUST_WEIGHT) {
        cp.status = 'BUSTED';
        cp.furs = 0;
        cp.robes = 0;
        sfxBust();
      }
    } else if (npc.role === 'warden') {
      if (Math.random() < 0.5) {
        sfxCursor();
        addPopup('BLIND EYE', cp.cartX - 20, cp.cartY - 18, PALETTE.teal);
      } else {
        cp.status = 'HBC_RAID';
        cp.raidTimer = HBC_RAID_DURATION;
        sfxHbcAlert();
        addPopup('WARDEN RAID!', cp.cartX - 24, cp.cartY - 18, PALETTE.roofRed);
      }
    } else if (npc.role === 'hbc') {
      cp.status = 'HBC_RAID';
      cp.raidTimer = HBC_RAID_DURATION;
      sfxHbcAlert();
      addPopup('HBC RAID!', cp.cartX - 22, cp.cartY - 18, PALETTE.roofRed);
    }
  }

  // =========================================================================
  function spawnRiverFish(flow, cpId) {
    const isSturgeon = Math.random() < 0.35;
    const speed = isSturgeon ? 0.55 : 0.85;
    if (flow === 'WE') {
      const maxX = cpId === 'upper_fort_garry' ? 182 : 252;
      riverFish.push({
        isSturgeon, flow, maxX,
        x: -16,
        y: 90 + Math.random() * 52,
        speed,
        phase: Math.random() * Math.PI * 2
      });
    } else {
      riverFish.push({
        isSturgeon, flow,
        x: 88 + Math.random() * 64,
        y: 248,
        speed,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function updateSceneFish(cp) {
    if (frameTick % 140 === 0 && riverFish.length < 4) {
      spawnRiverFish(cp.flow, cp.id);
    }

    for (let i = riverFish.length - 1; i >= 0; i--) {
      const f = riverFish[i];
      if (f.flow === 'WE') {
        f.x += f.speed;
        f.y += Math.sin(frameTick * 0.05 + f.phase) * 0.16;
        if (f.x > (f.maxX || 252)) riverFish.splice(i, 1);
      } else {
        f.y -= f.speed;
        f.x += Math.sin(frameTick * 0.05 + f.phase) * 0.16;
        if (f.y < -18) riverFish.splice(i, 1);
      }
    }
  }

  // =========================================================================
  // 1850 RED RIVER SETTLEMENT MINIMAP (480 x 336 BAKED BUFFER + FULLSCREEN FIT)
  // =========================================================================
  function fillPoly(context, pts, color) {
    context.fillStyle = color;
    context.beginPath();
    context.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) context.lineTo(pts[i][0], pts[i][1]);
    context.closePath();
    context.fill();
  }

  function strokePoly(context, pts, color, width = 1) {
    context.strokeStyle = color;
    context.lineWidth = width;
    context.beginPath();
    context.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) context.lineTo(pts[i][0], pts[i][1]);
    context.closePath();
    context.stroke();
  }

  function drawRiverPath(context, pts, width, color) {
    context.strokeStyle = color;
    context.lineWidth = width;
    context.lineCap = 'round';
    context.lineJoin = 'round';
    context.beginPath();
    context.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) context.lineTo(pts[i][0], pts[i][1]);
    context.stroke();
  }

  function bakeStaticMap() {
    const pal = PALETTE;
    const season = getSeasonalTheme();
    lastBakedSeasonBucket = Math.floor((300 - timeLeft) / 5);

    tCtx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

    tCtx.fillStyle = season.outerBg;
    tCtx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

    for (let y = 4; y < MAP_HEIGHT - 4; y += 6) {
      for (let x = 4; x < MAP_WIDTH - 4; x += 6) {
        const hash = ((x * 73856093) ^ (y * 19349663)) & 15;
        if (hash === 0) {
          tCtx.fillStyle = season.outerSpeck;
          tCtx.fillRect(x, y, 2, 1);
          tCtx.fillRect(x + 1, y - 1, 1, 1);
        }
      }
    }

    PARISH_BLOCKS.forEach(block => fillPoly(tCtx, block.poly, season.grassBase));

    for (let y = 12; y < MAP_HEIGHT - 12; y += 5) {
      for (let x = 12; x < MAP_WIDTH - 12; x += 5) {
        const h = ((x * 374761393) + (y * 668265263)) & 31;
        if (h < 3 && x > 25 && x < 455 && y > 20 && y < 318) {
          tCtx.fillStyle = h === 0 ? season.grassTuft : season.grassAccent;
          tCtx.fillRect(x, y, 2, 1);
        }
      }
    }

    tCtx.save();
    tCtx.beginPath();
    PARISH_BLOCKS.forEach(block => {
      tCtx.moveTo(block.poly[0][0], block.poly[0][1]);
      for (let i = 1; i < block.poly.length; i++) tCtx.lineTo(block.poly[i][0], block.poly[i][1]);
      tCtx.closePath();
    });
    tCtx.clip();

    CULTIVATED_ZONES.forEach(zone => {
      fillPoly(tCtx, zone, season.cultivated);
      const minX = Math.min(...zone.map(p => p[0]));
      const maxX = Math.max(...zone.map(p => p[0]));
      const minY = Math.min(...zone.map(p => p[1]));
      const maxY = Math.max(...zone.map(p => p[1]));
      for (let py = minY; py < maxY; py += 4) {
        for (let px = minX; px < maxX; px += 4) {
          if (((px + py) & 7) === 0) {
            tCtx.fillStyle = season.cultivatedLight;
            tCtx.fillRect(px, py, 2, 1);
          }
        }
      }
    });

    if (season.stage === 0) {
      tCtx.fillStyle = season.wetPatch;
      for (let y = 40; y < 300; y += 22) {
        for (let x = 40; x < 440; x += 28) {
          if (((x * 3 + y * 5) % 11) === 0) {
            tCtx.fillRect(x, y, 6, 3);
          }
        }
      }
    }

    WOODLAND_ZONES.forEach((zone, zIdx) => {
      const zoneBg = season.stage === 4
        ? lerpHex('#4a4339', '#8a96a3', season.t)
        : (season.stage === 3 ? '#5c4223' : (season.stage === 0 ? '#3d3324' : pal.woodlandBase));
      fillPoly(tCtx, zone, zoneBg);

      const minX = Math.min(...zone.map(p => p[0]));
      const maxX = Math.max(...zone.map(p => p[0]));
      const minY = Math.min(...zone.map(p => p[1]));
      const maxY = Math.max(...zone.map(p => p[1]));

      for (let ty = minY + 3; ty < maxY - 3; ty += 6) {
        for (let tx = minX + 3; tx < maxX - 3; tx += 6) {
          const offset = ((ty / 6) % 2) * 3;
          const cx = tx + offset;
          if (pointInPoly(cx, ty, zone)) {
            drawMapSeasonalTree(tCtx, cx, ty, season, (cx + ty + zIdx) % 5);
          }
        }
      }
    });

    tCtx.restore();

    PARISH_BLOCKS.forEach(block => strokePoly(tCtx, block.poly, pal.parishBorder, 1));
    drawHistoricTrails(tCtx, season);

    const wShift = Math.round(season.waterLevelOffset * 0.35);
    const assiniSand = 10;
    const redSand = 13;
    const assiniWater = Math.max(4, 6 + wShift);
    const redWater = Math.max(6, 9 + wShift);

    drawRiverPath(tCtx, ASSINIBOINE_POINTS, assiniSand, season.sandBank);
    drawRiverPath(tCtx, RED_RIVER_POINTS, redSand, season.sandBank);

    drawRiverPath(tCtx, ASSINIBOINE_POINTS, assiniWater + 2, pal.waterBank);
    drawRiverPath(tCtx, RED_RIVER_POINTS, redWater + 2, pal.waterBank);

    drawRiverPath(tCtx, ASSINIBOINE_POINTS, assiniWater, season.waterDeep);
    drawRiverPath(tCtx, RED_RIVER_POINTS, redWater, season.waterDeep);

    drawRiverPath(tCtx, ASSINIBOINE_POINTS, Math.max(2, assiniWater - 3), season.waterMid);
    drawRiverPath(tCtx, RED_RIVER_POINTS, Math.max(2, redWater - 4), season.waterMid);

    if (season.stage === 4) {
      drawRiverPath(tCtx, ASSINIBOINE_POINTS, assiniWater, '#cde6f7');
      drawRiverPath(tCtx, RED_RIVER_POINTS, redWater, '#cde6f7');
      const openAssini = Math.max(1, Math.round(assiniWater * (1 - season.freezeRatio)));
      const openRed = Math.max(2, Math.round(redWater * (1 - season.freezeRatio)));
      drawRiverPath(tCtx, ASSINIBOINE_POINTS, openAssini, season.waterDeep);
      drawRiverPath(tCtx, RED_RIVER_POINTS, openRed, season.waterDeep);
    }

    drawLandmarkSprites(tCtx, pal, season);
  }

  function drawMapSeasonalTree(context, x, y, season, variant) {
    if (season.stage === 0) {
      context.fillStyle = '#3d2817';
      context.fillRect(x, y - 2, 1, 5);
      context.fillRect(x - 2, y - 1, 5, 1);
      context.fillStyle = '#9fd468';
      context.fillRect(x - 2, y - 2, 1, 1);
      context.fillRect(x + 2, y - 2, 1, 1);
      context.fillRect(x, y - 3, 1, 1);
    } else if (season.stage === 1) {
      context.fillStyle = '#1d5c32';
      context.fillRect(x - 2, y + 1, 5, 2);
      context.fillStyle = '#2e8544';
      context.fillRect(x - 2, y - 2, 5, 3);
      context.fillRect(x - 1, y - 3, 3, 1);
      context.fillStyle = variant % 2 === 0 ? '#ffb7c5' : '#ffffff';
      context.fillRect(x - 1, y - 2, 2, 1);
      context.fillRect(x + 1, y - 1, 1, 1);
    } else if (season.stage === 2) {
      context.fillStyle = PALETTE.woodlandDark;
      context.fillRect(x - 2, y + 1, 5, 2);
      context.fillStyle = PALETTE.woodlandBase;
      context.fillRect(x - 2, y - 2, 5, 3);
      context.fillRect(x - 1, y - 3, 3, 1);
      context.fillStyle = PALETTE.woodlandHighlight;
      context.fillRect(x - 1, y - 2, 2, 1);
    } else if (season.stage === 3) {
      const fallColors = ['#c9382a', '#e67e22', '#f1c40f', '#d94e28', '#ffcd75'];
      const fallHighlights = ['#ff6b5b', '#f7a54a', '#fff08a', '#f2784b', '#fff5b8'];
      context.fillStyle = '#5c2616';
      context.fillRect(x - 2, y + 1, 5, 2);
      context.fillStyle = fallColors[variant % fallColors.length];
      context.fillRect(x - 2, y - 2, 5, 3);
      context.fillRect(x - 1, y - 3, 3, 1);
      context.fillStyle = fallHighlights[variant % fallHighlights.length];
      context.fillRect(x - 1, y - 2, 2, 1);
    } else {
      context.fillStyle = '#3a2818';
      context.fillRect(x, y - 2, 1, 5);
      context.fillRect(x - 2, y - 1, 5, 1);
      context.fillRect(x - 1, y - 3, 1, 1);
      context.fillRect(x + 1, y - 3, 1, 1);
      if (season.t > 0.35) {
        context.fillStyle = '#f4f8fc';
        context.fillRect(x - 2, y - 2, 2, 1);
        context.fillRect(x + 1, y - 2, 2, 1);
      }
    }
  }

      context.fillStyle = isSnow ? '#e8f1f8' : pal.roofRed;
      context.fillRect(cx - 2, cy - 2, 4, 2);
    });
  }

  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi + 0.00001) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function renderFullScreenMapView() {
    const pal = PALETTE;
    const season = getSeasonalTheme();
    const topHudH = 26;
    const bottomHudH = 56;
    const availH = Math.max(120, VIEW_H - topHudH - bottomHudH);

    ctx.fillStyle = season.outerBg;
    ctx.fillRect(0, topHudH, VIEW_W, availH);

    const scale = Math.max(VIEW_W / MAP_WIDTH, availH / MAP_HEIGHT);
    const drawW = MAP_WIDTH * scale;
    const drawH = MAP_HEIGHT * scale;

    const activeCp = CHECKPOINTS[activeCheckpointIndex];
    const desiredCenterX = activeCp.x * scale;
    let offsetX = (VIEW_W * 0.5) - desiredCenterX;
    offsetX = Math.min(0, Math.max(VIEW_W - drawW, offsetX));
    const offsetY = topHudH + Math.floor((availH - drawH) * 0.5);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, topHudH, VIEW_W, availH);
    ctx.clip();

    ctx.translate(Math.round(offsetX), Math.round(offsetY));
    ctx.scale(scale, scale);

    ctx.drawImage(terrainCanvas, 0, 0);

    if (season.hasIceChunks) {
      for (let i = 0; i < ASSINIBOINE_POINTS.length - 1; i += 2) {
        const [x1, y1] = ASSINIBOINE_POINTS[i];
        const [x2, y2] = ASSINIBOINE_POINTS[i + 1];
        const t = ((frameTick * 0.012) + i * 0.41) % 1;
        const wx = Math.round(x1 + (x2 - x1) * t);
        const wy = Math.round(y1 + (y2 - y1) * t);
        ctx.fillStyle = '#a8d8f0';
        ctx.fillRect(wx - 2, wy - 1, 4, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(wx - 1, wy - 1, 3, 2);
      }
      for (let i = 0; i < RED_RIVER_POINTS.length - 1; i += 2) {
        const [x1, y1] = RED_RIVER_POINTS[i];
        const [x2, y2] = RED_RIVER_POINTS[i + 1];
        const t = ((frameTick * 0.012) + i * 0.31) % 1;
        const wx = Math.round(x1 + (x2 - x1) * t);
        const wy = Math.round(y1 + (y2 - y1) * t);
        ctx.fillStyle = '#a8d8f0';
        ctx.fillRect(wx - 2, wy - 1, 5, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(wx - 1, wy - 1, 3, 2);
      }
    } else {
      ctx.fillStyle = pal.waterFoam;
      for (let i = 0; i < ASSINIBOINE_POINTS.length - 1; i++) {
        const [x1, y1] = ASSINIBOINE_POINTS[i];
        const [x2, y2] = ASSINIBOINE_POINTS[i + 1];
        const t = ((frameTick * 0.025) + i * 0.37) % 1;
        ctx.fillRect(Math.round(x1 + (x2 - x1) * t), Math.round(y1 + (y2 - y1) * t), 2, 1);
      }
      for (let i = 0; i < RED_RIVER_POINTS.length - 1; i++) {
        const [x1, y1] = RED_RIVER_POINTS[i];
        const [x2, y2] = RED_RIVER_POINTS[i + 1];
        const t = ((frameTick * 0.025) + i * 0.29) % 1;
        ctx.fillRect(Math.round(x1 + (x2 - x1) * t) - 1, Math.round(y1 + (y2 - y1) * t), 3, 1);
      }
    }

    clouds.forEach(c => {
      c.x += c.speed;
      if (c.x > MAP_WIDTH + 30) c.x = -40;
      const cx = Math.round(c.x);
      const cy = Math.round(c.y);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
      ctx.fillRect(cx + 3, cy + 12, c.w - 4, 4);

      ctx.fillStyle = pal.wallWhite;
      ctx.globalAlpha = 0.72;
      ctx.fillRect(cx + 4, cy, c.w - 8, 6);
      ctx.fillRect(cx, cy + 2, c.w, 4);
      ctx.globalAlpha = 1.0;
    });

    if (season.stage === 4) {
      const activeFlakes = Math.floor(65 * season.snowAmount);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < activeFlakes; i++) {
        const sf = snowFlakes[i];
        const sy = Math.round((sf.y + frameTick * sf.speedY) % MAP_HEIGHT);
        const sx = Math.round((sf.x + Math.sin(frameTick * 0.03 + sf.driftPhase) * 6 + MAP_WIDTH) % MAP_WIDTH);
        ctx.fillRect(sx, sy, (i % 4 === 0) ? 2 : 1, (i % 4 === 0) ? 2 : 1);
      }
    }

    const pulse = Math.floor(frameTick / 18) % 2;
    CHECKPOINTS.forEach((cp, idx) => {
      const isSelected = idx === activeCheckpointIndex;
      ctx.strokeStyle = isSelected
        ? (pulse === 0 ? pal.roofBlue : pal.capoteBlueBright)
        : pal.wallWhite;
      ctx.lineWidth = 1;
      ctx.strokeRect(cp.x - 6, cp.y - 6, 12, 12);

      const presence = getCheckpointHbcPresence(cp, idx);
      if (presence) {
        drawMapHbcOfficerIcon(cp.hbcIconX, cp.hbcIconY, frameTick, presence === 'warden');
      }

      if (cp.status !== 'UNSET') {
        const bx = cp.x - 11;
        const by = cp.y - 13;
        ctx.fillStyle = pal.black;
        ctx.fillRect(bx, by, 22, 4);

        if (cp.status === 'SETTING') {
          const pct = Math.min(1, cp.setProgress / SET_TIME_REQUIRED);
          ctx.fillStyle = pal.teal;
          ctx.fillRect(bx + 1, by + 1, Math.round(20 * pct), 2);
        } else if (cp.status === 'HBC_RAID') {
          const remPct = Math.max(0, cp.raidTimer / HBC_RAID_DURATION);
          ctx.fillStyle = Math.floor(frameTick / 5) % 2 === 0 ? pal.roofRed : pal.compassGold;
          ctx.fillRect(bx + 1, by + 1, Math.max(2, Math.round(20 * remPct)), 2);
        } else if (cp.status === 'BUSTED') {
          ctx.fillStyle = pal.roofRed;
          ctx.fillRect(bx + 1, by + 1, 20, 2);
        } else if (cp.status === 'ACTIVE') {
          const wt = getCartWeight(cp);
          const pct = Math.min(1, wt / CART_CAPACITY);
          const isOver = wt > CART_CAPACITY;
          ctx.fillStyle = isOver && Math.floor(frameTick / 8) % 2 === 0
            ? pal.roofRed
            : (wt >= CART_CAPACITY ? pal.compassGold : pal.teal);
          ctx.fillRect(bx + 1, by + 1, Math.max(2, Math.round(20 * pct)), 2);
        }
      }
    });

    cursor.x += (cursor.targetX - cursor.x) * 0.24;
    cursor.y += (cursor.targetY - cursor.y) * 0.24;

    const cx = Math.round(cursor.x);
    const cy = Math.round(cursor.y);
    const bracketOffset = pulse === 0 ? 8 : 10;

    ctx.fillStyle = pulse === 0 ? pal.roofBlue : pal.capoteBlueBright;
    ctx.fillRect(cx - bracketOffset, cy - bracketOffset, 4, 2);
    ctx.fillRect(cx - bracketOffset, cy - bracketOffset, 2, 4);

    ctx.fillRect(cx + bracketOffset - 4, cy - bracketOffset, 4, 2);
    ctx.fillRect(cx + bracketOffset - 2, cy - bracketOffset, 2, 4);

    ctx.fillRect(cx - bracketOffset, cy + bracketOffset - 2, 4, 2);
    ctx.fillRect(cx - bracketOffset, cy + bracketOffset - 4, 2, 4);

    ctx.fillRect(cx + bracketOffset - 4, cy + bracketOffset - 2, 4, 2);
    ctx.fillRect(cx + bracketOffset - 2, cy + bracketOffset - 4, 2, 4);

    ctx.restore();

    drawBottomCheckpointStrip(VIEW_H - bottomHudH, bottomHudH);
  }

  function drawBottomCheckpointStrip(stripY, stripH) {
    ctx.fillStyle = '#1a1c2c';
    ctx.fillRect(0, stripY, VIEW_W, stripH);
    ctx.fillStyle = PALETTE.wallWhite;
    ctx.fillRect(0, stripY, VIEW_W, 2);
    ctx.fillStyle = PALETTE.roofBlue;
    ctx.fillRect(0, stripY + 2, VIEW_W, 2);

    const cols = 3;
    const rows = 2;
    const padX = 4;
    const padY = 6;
    const gapX = 3;
    const gapY = 3;
    const cellW = Math.floor((VIEW_W - padX * 2 - gapX * (cols - 1)) / cols);
    const cellH = Math.floor((stripH - padY - 3 - gapY * (rows - 1)) / rows);

    CHECKPOINTS.forEach((cp, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const bx = padX + col * (cellW + gapX);
      const by = stripY + padY + row * (cellH + gapY);
      const isAct = (idx === activeCheckpointIndex);

      ctx.fillStyle = isAct ? PALETTE.compassGold : '#29366f';
      ctx.fillRect(bx, by, cellW, cellH);
      ctx.strokeStyle = isAct ? '#ffffff' : '#7f8ec9';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, cellW - 1, cellH - 1);

      drawPixelText(
        `0${idx + 1} ${cp.shortName}`,
        bx + Math.floor(cellW / 2),
        by + 11,
        5,
        isAct ? '#1a1c2c' : '#f4f4f4',
        'center',
        false
      );

      if (cp.status !== 'UNSET') {
        const barW = cellW - 10;
        const barX = bx + 5;
        const barY = by + cellH - 5;
        ctx.fillStyle = '#0f1324';
        ctx.fillRect(barX, barY, barW, 3);

        let fillRatio = 0;
        let fillCol = PALETTE.teal;
        if (cp.status === 'SETTING') {
          fillRatio = cp.setProgress / SET_TIME_REQUIRED;
          fillCol = PALETTE.teal;
        } else if (cp.status === 'HBC_RAID') {
          fillRatio = cp.raidTimer / HBC_RAID_DURATION;
          fillCol = PALETTE.roofRed;
        } else if (cp.status === 'BUSTED') {
          fillRatio = 1;
          fillCol = '#555555';
        } else if (cp.status === 'ACTIVE') {
          const wt = getCartWeight(cp);
          fillRatio = Math.min(1, wt / CART_CAPACITY);
          fillCol = wt > CART_CAPACITY ? PALETTE.roofRed : (wt >= CART_CAPACITY ? '#38984c' : '#3b5dc9');
        }
        ctx.fillStyle = fillCol;
        ctx.fillRect(barX, barY, Math.max(2, Math.round(barW * fillRatio)), 3);
      }
    });
  }

  function drawRoiDesTraiteursTitle(topY) {

  // =========================================================================
  // SEASONAL & CHECKPOINT-SPECIFIC 16-BIT SCENES (SCALED TO FILL VIEWPORT)
  // =========================================================================
  function drawWeirScene() {
    const cp = CHECKPOINTS[activeCheckpointIndex];
    const season = getSeasonalTheme();
    const topHudH = 26;
    const availH = Math.max(180, VIEW_H - topHudH);

    ctx.fillStyle = season.grassBase;
    ctx.fillRect(0, topHudH, VIEW_W, availH);

    const scale = Math.min(VIEW_W / 240, availH / 240);
    const sceneW = 240 * scale;
    const sceneH = 240 * scale;
    const offsetX = Math.floor((VIEW_W - sceneW) * 0.5);
    const offsetY = topHudH + Math.floor((availH - sceneH) * 0.5);

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    if (cp.flow === 'WE') {
      drawAssiniboineCheckpointScene(cp, season);
    } else {
      drawRedRiverCheckpointScene(cp, season);
    }

    if (cp.id === 'st_francois_xavier' && whiteHorse) {
      drawSpiritedWhiteHorse();
    }

    if (season.stage === 4) {
      const activeFlakes = Math.floor(42 * season.snowAmount);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < activeFlakes; i++) {
        const sf = snowFlakes[i];
        const sy = Math.round((sf.y + frameTick * sf.speedY) % 240);
        const sx = Math.round((sf.x + Math.sin(frameTick * 0.04 + sf.driftPhase) * 6 + 240) % 240);
        ctx.fillRect(sx, sy, (i % 4 === 0) ? 2 : 1, (i % 4 === 0) ? 2 : 1);
      }
    }

    ctx.font = 'bold 8px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    floatingPopups.forEach(p => {
      ctx.fillStyle = PALETTE.black;
      ctx.fillText(p.text, p.x + 1, p.y + 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    });

    ctx.restore();
  }

  function drawRedRiverCheckpointScene(cp, season) {
    const waterLeft = 76 - season.waterLevelOffset;
    const waterRight = 164 + season.waterLevelOffset;
    const waterWidth = waterRight - waterLeft;

    ctx.fillStyle = season.waterDeep;
    ctx.fillRect(waterLeft, 0, waterWidth, 240);

    const hasWestForks = (cp.id === 'st_boniface');
    const forkTop = 140 - Math.round(season.waterLevelOffset * 0.6);
    const forkBottom = 180 + Math.round(season.waterLevelOffset * 0.6);
    if (hasWestForks) {
      ctx.fillStyle = season.waterDeep;
      ctx.fillRect(0, forkTop, waterLeft + 4, forkBottom - forkTop);
    }

    ctx.fillStyle = 'rgba(15, 32, 74, 0.35)';
    for (let i = 0; i < 18; i++) {
      const px = waterLeft + 6 + ((i * 37) % Math.max(16, waterWidth - 14));
      const py = 12 + ((i * 41) % 216);
      ctx.fillRect(px, py, 6, 4);
    }

    riverFish.forEach(f => {
      if (f.isSturgeon) {
        drawMatrix(sprSturgeonNorth, f.x - 5, f.y, {
          1: '#162922', 2: '#3D5C4E', 3: '#B8B4A9', 4: '#D9AF36'
        }, 1);
      } else {
        drawMatrix(sprWhitefishNorth, f.x - 4, f.y, {
          1: '#1E4863', 2: '#8FAAB5', 3: '#D8E6EB'
        }, 1);
      }
    });

    ctx.fillStyle = season.waterSurfaceRgba;
    ctx.fillRect(waterLeft, 0, waterWidth, 240);
    if (hasWestForks) {
      ctx.fillRect(0, forkTop, waterLeft + 4, forkBottom - forkTop);
    }

    ctx.fillStyle = season.waterMid;
    for (let col = 0; col < 5; col++) {
      const rx = waterLeft + 8 + ((col * 16) % Math.max(12, waterWidth - 12));
      const ry = 240 - ((frameTick * 1.6 + col * 43) % 240);
      ctx.fillRect(rx, ry, 2, 16);
    }
    ctx.fillStyle = PALETTE.waterFoam;
    for (let col = 0; col < 4; col++) {
      const fx = waterLeft + 12 + ((col * 20) % Math.max(12, waterWidth - 16));
      const fy = 240 - ((frameTick * 2.3 + col * 59) % 240);
      ctx.fillRect(fx, fy, 2, 5);
    }

    if (hasWestForks) {
      ctx.fillStyle = season.waterMid;
      for (let r = 0; r < 2; r++) {
        const fy = forkTop + 8 + r * 16;
        const fx = (frameTick * 1.4 + r * 35) % (waterLeft + 2);
        ctx.fillRect(fx, fy, 12, 2);
      }
      ctx.fillStyle = PALETTE.waterFoam;
      const foamX = (frameTick * 1.9) % (waterLeft + 2);
      ctx.fillRect(foamX, forkTop + 14, 4, 2);
    }

    if (season.hasIceChunks) {
      for (let ic = 0; ic < 6; ic++) {
        const ix = waterLeft + 8 + ((ic * 23) % Math.max(16, waterWidth - 20));
        const iy = 240 - ((frameTick * 0.9 + ic * 41) % 240);
        if (iy < 104 || iy > 132) {
          ctx.fillStyle = '#a8d8f0';
          ctx.fillRect(ix, iy, 9, 6);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ix + 1, iy, 7, 4);
        }
      }
    }

    if (season.stage === 4) {
      const shelfW = Math.round((waterWidth * 0.42) * season.freezeRatio);
      for (let y = 0; y < 240; y += 6) {
        if (y >= 110 && y <= 130) continue;
        const jag = ((y * 7) % 5) - 2;
        ctx.fillStyle = '#9ad1f0';
        ctx.fillRect(waterLeft, y, shelfW + jag + 2, 6);
        ctx.fillRect(waterRight - (shelfW - jag + 2), y, shelfW - jag + 2, 6);
        ctx.fillStyle = '#e8f6ff';
        ctx.fillRect(waterLeft, y, Math.max(2, shelfW + jag), 6);
        ctx.fillRect(waterRight - Math.max(2, shelfW - jag), y, Math.max(2, shelfW - jag), 6);
      }
    }

    drawRedRiverRichShores(cp, season, waterLeft, waterRight, hasWestForks, forkTop, forkBottom);
    drawNaturalHorizontalStones(season);

    if (cp.status !== 'UNSET') {
      drawRedRiverCart(cp, cp.cartX, cp.cartY);
    } else if (isOnDirtRoad(cp, player.x, player.y)) {
      drawCartPlacementOutline(player.x, player.y);
    }

    drawDepthSortedActors();
  }

  function drawRedRiverCart(cp, cx, cy) {
    const bx = Math.round(cx - 14);
    const by = Math.round(cy - 10);

    const wt = getCartWeight(cp);
    const isRaid = cp.status === 'HBC_RAID';
    const isOver = cp.status === 'ACTIVE' && wt > CART_CAPACITY;
    const shake = (isRaid || isOver) ? (Math.floor(frameTick / 2) % 2 === 0 ? -1 : 1) : 0;

    if (cp.status === 'SETTING') {
      ctx.strokeStyle = PALETTE.teal;
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, 28, 20);
      const bars = Math.floor((cp.setProgress / SET_TIME_REQUIRED) * 5);
      ctx.fillStyle = PALETTE.woodLight;
      for (let i = 0; i < bars; i++) {
        ctx.fillRect(bx + 3 + i * 5, by + 3, 3, 14);
      }
      drawCartGaugeBar(cx - 16, by - 9, 32, 6, cp.setProgress / SET_TIME_REQUIRED, PALETTE.teal, false);
      return;
    }

    if (cp.status === 'BUSTED') {
      ctx.fillStyle = PALETTE.woodDark;
      ctx.fillRect(bx + 2, by + 10, 12, 8);
      ctx.fillRect(bx + 15, by + 8, 11, 10);
      ctx.fillStyle = PALETTE.woodMid;
      ctx.fillRect(bx + 5, by + 13, 18, 4);
      ctx.fillStyle = PALETTE.roofRed;
      ctx.fillRect(bx + 11, by + 11, 6, 3);
      drawCartGaugeBar(cx - 16, by - 9, 32, 6, 1, PALETTE.roofRed, true);
      return;
    }

    ctx.fillStyle = PALETTE.woodMid;
    ctx.fillRect(bx + 24 + shake, by + 8, 8, 2);
    ctx.fillRect(bx + 24 + shake, by + 13, 8, 2);

    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillRect(bx + 2 + shake, by + 2, 22, 12);
    ctx.fillStyle = PALETTE.woodLight;
    ctx.fillRect(bx + 3 + shake, by + 3, 20, 3);
    for (let sx = bx + 4; sx <= bx + 20; sx += 4) {
      ctx.fillStyle = PALETTE.woodMid;
      ctx.fillRect(sx + shake, by + 3, 2, 10);
    }

    for (let i = 0; i < Math.min(4, cp.furs); i++) {
      ctx.fillStyle = PALETTE.wallWhite;
      ctx.fillRect(bx + 4 + i * 4 + shake, by + 4, 3, 4);
    }
    for (let i = 0; i < Math.min(2, cp.robes); i++) {
      ctx.fillStyle = '#3A2314';
      ctx.fillRect(bx + 5 + i * 9 + shake, by + 1, 7, 5);
      ctx.fillStyle = PALETTE.compassGold;
      ctx.fillRect(bx + 7 + i * 9 + shake, by + 2, 3, 2);
    }

    const wx = bx + 13 + shake;
    const wy = by + 14;
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillRect(wx - 6, wy - 5, 12, 11);
    ctx.fillStyle = PALETTE.woodLight;
    ctx.fillRect(wx - 4, wy - 4, 8, 9);
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillRect(wx - 1, wy - 4, 2, 9);
    ctx.fillRect(wx - 4, wy, 8, 2);
    ctx.fillStyle = PALETTE.compassGold;
    ctx.fillRect(wx - 1, wy, 2, 2);

    if (isRaid) {
      const remPct = Math.max(0, cp.raidTimer / HBC_RAID_DURATION);
      const flashColor = Math.floor(frameTick / 4) % 2 === 0 ? PALETTE.roofRed : PALETTE.compassGold;
      drawCartGaugeBar(cx - 16, by - 9, 32, 6, remPct, flashColor, false, false);
    } else {
      const barColor = isOver
        ? (Math.floor(frameTick / 6) % 2 === 0 ? PALETTE.roofRed : PALETTE.compassGold)
        : (wt >= CART_CAPACITY ? PALETTE.compassGold : PALETTE.teal);
      drawCartGaugeBar(cx - 16, by - 9, 32, 6, wt / CART_BUST_WEIGHT, barColor, false, true);
    }
  }

  function drawCartGaugeBar(gx, gy, gw, gh, ratio, fillColor, isBusted, showCapacityTick = false) {
    ctx.fillStyle = 'rgba(15, 19, 36, 0.92)';
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = PALETTE.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(gx, gy, gw, gh);

    const innerW = gw - 2;
    const innerH = gh - 2;

    if (isBusted) {
      ctx.fillStyle = PALETTE.roofRed;
      ctx.fillRect(gx + 1, gy + 1, innerW, innerH);
      return;
    }

    const clamped = Math.max(0, Math.min(1, ratio));
    if (clamped > 0) {
      ctx.fillStyle = fillColor;
      ctx.fillRect(gx + 1, gy + 1, Math.max(2, Math.round(innerW * clamped)), innerH);
    }

    if (showCapacityTick) {
      const tickX = gx + 1 + Math.round(innerW * (CART_CAPACITY / CART_BUST_WEIGHT));
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(tickX, gy, 1, gh);
    }
  }

  // =========================================================================
  // MAIN RENDER LOOP
  // =========================================================================
  function renderLoop(now) {
    updateSimulation(now);

    ctx.clearRect(0, 0, VIEW_W, VIEW_H);

    if (gameState === 'TITLE') {
      drawTitleScreen();
    } else if (gameState === 'BRIEFING') {
      drawBriefingOverlay();
    } else if (gameState === 'MAP') {
      renderFullScreenMapView();
      drawTopArcadeHUD();
    } else if (gameState === 'WEIR') {
      drawWeirScene();
      drawTopArcadeHUD();
    } else if (gameState === 'GAMEOVER') {
      drawGameOverOverlay();
    }

    requestAnimationFrame(renderLoop);
  }

  // =========================================================================
  // CONTROLS & INPUT BRIDGE (EXCLUSIVE POSTMESSAGE LISTENER)
  // =========================================================================
  function setCheckpoint(index) {
    activeCheckpointIndex = ((index % CHECKPOINTS.length) + CHECKPOINTS.length) % CHECKPOINTS.length;
    const cp = CHECKPOINTS[activeCheckpointIndex];
    cursor.targetX = cp.x;
    cursor.targetY = cp.y;
    sfxCursor();
  }

  function cycleCheckpoint(step = 1) {
    setCheckpoint(activeCheckpointIndex + step);
  }

  function enterSelectedCheckpoint() {
    const cp = CHECKPOINTS[activeCheckpointIndex];
    if (cp.flow === 'WE') {
      player = { x: 120, y: 42, dir: 'down', moving: false };
    } else if (cp.entrySide === 'EAST') {
      player = { x: 214, y: 120, dir: 'left', moving: false };
    } else {
      player = { x: 26, y: 120, dir: 'right', moving: false };
    }
    sceneNPCs = [];
    riverFish = [];
    floatingPopups = [];

    if (cp.hbcActiveTimer > 0) {
      spawnCheckpointNPC(cp, 'hbc');
      cp.hbcActiveTimer = 0;
      cp.hbcTriggeredPass = false;
    }

    if (cp.id === 'st_francois_xavier') {
      if (cp.wardenActiveTimer > 0) {
        spawnCheckpointNPC(cp, 'warden');
        cp.wardenActiveTimer = 0;
        cp.wardenTriggeredPass = false;
      }
      maybeSpawnSpiritedWhiteHorse(cp);
    }

    sfxStep();
    setViewMode('WEIR');
  }

  function handleActionA() {
    const now = performance.now();
    if (now - lastBtnATime < BTN_DEBOUNCE_MS) return;
    lastBtnATime = now;
    if (isPaused) return;

    initAudio();

    if (gameState === 'TITLE') {
      briefingSide = 1;
      setViewMode('BRIEFING');
      sfxCursor();
      return;
    }

    if (gameState === 'BRIEFING') {
      startFreetradeSession();
      return;
    }

    if (gameState === 'MAP') {
      enterSelectedCheckpoint();
      return;
    }

    if (gameState === 'WEIR') {
      const cp = CHECKPOINTS[activeCheckpointIndex];

      if (cp.status === 'UNSET') {
        if (!isOnDirtRoad(cp, player.x, player.y)) return;
        cp.cartX = player.x;
        cp.cartY = player.y;
        cp.status = 'SETTING';
        cp.setProgress = 0;
        cp.isWorking = true;
        sfxWorkTick();
        return;
      }

      if (!isPlayerNearCart(cp)) return;

      if (cp.status === 'SETTING') {
        if (!cp.isWorking) {
          cp.isWorking = true;
          sfxWorkTick();
        }
      } else if (cp.status === 'ACTIVE' || cp.status === 'HBC_RAID') {
        const furCount = cp.furs;
        const robeCount = cp.robes;
        const wasRaid = cp.status === 'HBC_RAID';

        totalFurs += furCount;
        totalRobes += robeCount;

        cp.furs = 0;
        cp.robes = 0;
        cp.raidTimer = 0;
        cp.status = 'UNSET';
        cp.setProgress = 0;
        cp.isWorking = false;

        if (furCount > 0 || robeCount > 0 || wasRaid) {
          sfxHarvest();
          const label = (furCount > 0 || robeCount > 0) ? 'HAULED!' : 'SAVED!';
          addPopup(label, cp.cartX - 16, cp.cartY - 18, PALETTE.compassGold);
        } else {
          sfxStep();
        }
      } else if (cp.status === 'BUSTED') {
        cp.status = 'UNSET';
        cp.furs = 0;
        cp.robes = 0;
        sfxStep();
      }
      return;
    }

    if (gameState === 'GAMEOVER') {
      timeLeft = 300;
      bakeStaticMap();
      setViewMode('TITLE');
    }
  }

  function handleActionB() {
    const now = performance.now();
    if (now - lastBtnBTime < BTN_DEBOUNCE_MS) return;
    lastBtnBTime = now;
    if (isPaused) return;

    initAudio();

    if (gameState === 'BRIEFING') {
      toggleBriefingSide();
      return;
    }

    if (gameState === 'WEIR') {
      const cp = CHECKPOINTS[activeCheckpointIndex];
      cp.isWorking = false;
      sfxStep();
      setViewMode('MAP');
    }
  }

  function canPlayerStandAt(cp, nx, ny) {
    if (cp.id === 'upper_fort_garry') {
      if (nx >= 12 && nx <= 172 && ny >= 52 && ny <= 78) return true;
      if (nx >= 110 && nx <= 130 && ny >= 14 && ny <= 54) return true;
      if (nx >= 112 && nx <= 128 && ny >= 78 && ny <= 162) return true;
      if (nx >= 12 && nx <= 172 && ny >= 162 && ny <= 226) return true;
      return false;
    }

    if (cp.flow === 'NS') {
      if (cp.id === 'st_boniface') {
        if (nx >= 8 && nx <= 72 && ((ny >= 18 && ny <= 132) || (ny >= 186 && ny <= 228))) return true;
        if (nx >= 168 && nx <= 232 && ny >= 4 && ny <= 16) return true;
        if (nx >= 168 && nx <= 232 && ny >= 58 && ny <= 228) return true;
        if (nx >= 72 && nx <= 168 && ny >= 112 && ny <= 128) return true;
        return false;
      }
      const minWestY = cp.id === 'st_vital' ? 54 : 18;
      if (nx >= 8 && nx <= 72 && ny >= minWestY && ny <= 228) return true;
      const minEastY = cp.id === 'kildonan' ? 56 : 18;
      if (nx >= 168 && nx <= 232 && ny >= minEastY && ny <= 228) return true;
      if (nx >= 72 && nx <= 168 && ny >= 112 && ny <= 128) return true;
      return false;
    } else {
      if (nx >= 12 && nx <= 228 && ny >= 52 && ny <= 78) return true;
      if (nx >= 110 && nx <= 130 && ny >= 14 && ny <= 54) return true;
      if (nx >= 112 && nx <= 128 && ny >= 78 && ny <= 162) return true;
      if (nx >= 12 && nx <= 228 && ny >= 162 && ny <= 226) return true;
      return false;
    }
  }

  function moveWeirPlayer(dir) {
    const cp = CHECKPOINTS[activeCheckpointIndex];
    const step = 10;
    let nx = player.x;
    let ny = player.y;

    if (dir === 'UP') { ny -= step; player.dir = 'up'; }
    else if (dir === 'DOWN') { ny += step; player.dir = 'down'; }
    else if (dir === 'LEFT') { nx -= step; player.dir = 'left'; }
    else if (dir === 'RIGHT') { nx += step; player.dir = 'right'; }

    if (cp.flow === 'WE' && dir === 'UP' && ny <= 22 && nx >= 108 && nx <= 132) {
      handleActionB();
      return;
    }
    if (cp.flow === 'NS' && cp.entrySide === 'EAST' && dir === 'RIGHT' && nx >= 230 && ny >= 108 && ny <= 132) {
      handleActionB();
      return;
    }
    if (cp.flow === 'NS' && cp.entrySide === 'WEST' && dir === 'LEFT' && nx <= 10 && ny >= 108 && ny <= 132) {
      handleActionB();
      return;
    }

    if (canPlayerStandAt(cp, nx, ny)) {
      player.x = nx;
      player.y = ny;
      sfxStep();
    }
  }

  function handleDpadPulse(dir) {
    if (isPaused) return;
    const now = performance.now();
    const wasHeld = now < dpadExpiry[dir];
    dpadExpiry[dir] = now + DPAD_HOLD_WINDOW_MS;

    if (gameState === 'MAP') {
      if (!wasHeld && (now - lastMapCycleTime) >= 95) {
        if (dir === 'RIGHT' || dir === 'DOWN') cycleCheckpoint(1);
        else if (dir === 'LEFT' || dir === 'UP') cycleCheckpoint(-1);
        lastMapCycleTime = now;
      }
      return;
    }

    if (gameState === 'WEIR' && !wasHeld) {
      moveWeirPlayer(dir);
      weirStepCooldown = 0.14;
    }
  }

  function startFreetradeSession() {
    resetAllCheckpoints();
    totalFurs = 0;
    totalRobes = 0;
    hbcDealsLost = 0;
    buffaloRedirects = 0;
    hbcBrokenCount = 0;
    timeLeft = 300;
    lastSecondTimestamp = Math.floor(performance.now() / 1000);
    bakeStaticMap();
    setCheckpoint(0);
    setViewMode('MAP');
    startBGM();
  }

  function triggerGameOver(byHbcMonopoly = false) {
    stopBGM();
    setViewMode('GAMEOVER');
  }

  // =========================================================================
  // EXCLUSIVE POSTMESSAGE JOYSTICK & BUTTON BRIDGE
  // =========================================================================
  window.addEventListener('message', function(event) {
    const cmd = event.data;
    if (cmd === 'PAUSE') {
      isPaused = true;
      clearAllInputs();
      return;
    }
    if (cmd === 'RESUME') {
      isPaused = false;
      clearAllInputs();
      lastFrameTime = performance.now();
      return;
    }

    if (cmd === 'DPAD_UP' || cmd === 'DPAD_UP_PRESS')          handleDpadPulse('UP');
    else if (cmd === 'DPAD_DOWN' || cmd === 'DPAD_DOWN_PRESS')  handleDpadPulse('DOWN');
    else if (cmd === 'DPAD_LEFT' || cmd === 'DPAD_LEFT_PRESS')  handleDpadPulse('LEFT');
    else if (cmd === 'DPAD_RIGHT' || cmd === 'DPAD_RIGHT_PRESS') handleDpadPulse('RIGHT');
    else if (cmd === 'DPAD_UP_RELEASE')    dpadExpiry.UP = 0;
    else if (cmd === 'DPAD_DOWN_RELEASE')  dpadExpiry.DOWN = 0;
    else if (cmd === 'DPAD_LEFT_RELEASE')  dpadExpiry.LEFT = 0;
    else if (cmd === 'DPAD_RIGHT_RELEASE') dpadExpiry.RIGHT = 0;
    else if (cmd === 'BUTTON_A') handleActionA();
    else if (cmd === 'BUTTON_B') handleActionB();
  });

  // Boot Initialization
  bakeStaticMap();
  setCheckpoint(0);
  requestAnimationFrame(renderLoop);
</script>
</body>
</html>
